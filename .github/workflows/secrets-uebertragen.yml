name: Einmalig - Secrets fuer guardops.ch uebertragen

# EINMALIGER LAUF, DANACH WIEDER ENTFERNEN (Umzug von guardops.ch nach
# formateins-guardops, 2026-11).
#
# Die Werte fuer guardops.ch liegen nur hier im Environment production und
# sind nirgends sonst notiert. Neu setzen hiesse bei Hostpoint das Passwort
# von info@guardops.ch aendern -- das braeuchten aber auch Betreiber-Bereich,
# Pruefzugang und Demo-Plaetze, die bis zum Nachfuehren keine Mail mehr
# verschickten. Darum werden die Werte hier gelesen und per GitHub-
# Schnittstelle in die Repository-Secrets von formateins-guardops
# geschrieben. Niemand sieht sie dabei: Der Lauf gibt nur Namen aus, GitHub
# maskiert jeden Secret-Wert im Protokoll zusaetzlich.
#
# Voraussetzung: Repository-Secret GUARDOPS_UEBERTRAG_TOKEN, ein
# feingranularer Token NUR fuer formateins-guardops mit der Berechtigung
# "Secrets: Read and write". Nach dem Lauf: diese Datei entfernen, das
# Secret GUARDOPS_UEBERTRAG_TOKEN hier loeschen und den Token auf GitHub
# widerrufen.
#
# Nur von Hand (workflow_dispatch), nie bei einem Push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uebertragen:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Secrets nach formateins-guardops schreiben
        env:
          GH_TOKEN: ${{ secrets.GUARDOPS_UEBERTRAG_TOKEN }}
          ZIEL: f5yct67kcv-source/formateins-guardops
          GUARDOPS_FTP_HOST: ${{ secrets.GUARDOPS_FTP_HOST }}
          GUARDOPS_FTP_USER: ${{ secrets.GUARDOPS_FTP_USER }}
          GUARDOPS_FTP_PASSWORD: ${{ secrets.GUARDOPS_FTP_PASSWORD }}
          GUARDOPS_SMTP_HOST: ${{ secrets.GUARDOPS_SMTP_HOST }}
          GUARDOPS_SMTP_PORT: ${{ secrets.GUARDOPS_SMTP_PORT }}
          GUARDOPS_SMTP_VERSCHLUESSELUNG: ${{ secrets.GUARDOPS_SMTP_VERSCHLUESSELUNG }}
          GUARDOPS_SMTP_USER: ${{ secrets.GUARDOPS_SMTP_USER }}
          GUARDOPS_SMTP_PASSWORD: ${{ secrets.GUARDOPS_SMTP_PASSWORD }}
          GUARDOPS_KALENDER_URL: ${{ secrets.GUARDOPS_KALENDER_URL }}
          GUARDOPS_KALENDER_BENUTZER: ${{ secrets.GUARDOPS_KALENDER_BENUTZER }}
          GUARDOPS_KALENDER_PASSWORT: ${{ secrets.GUARDOPS_KALENDER_PASSWORT }}
          DEMO_EMPFAENGER: ${{ secrets.DEMO_EMPFAENGER }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret GUARDOPS_UEBERTRAG_TOKEN fehlt in sop-plattform -- nichts uebertragen."
            exit 1
          fi
          uebertragen=0; leer=""
          for NAME in GUARDOPS_FTP_HOST GUARDOPS_FTP_USER GUARDOPS_FTP_PASSWORD \
                      GUARDOPS_SMTP_HOST GUARDOPS_SMTP_PORT GUARDOPS_SMTP_VERSCHLUESSELUNG \
                      GUARDOPS_SMTP_USER GUARDOPS_SMTP_PASSWORD \
                      GUARDOPS_KALENDER_URL GUARDOPS_KALENDER_BENUTZER GUARDOPS_KALENDER_PASSWORT \
                      DEMO_EMPFAENGER; do
            WERT="${!NAME:-}"
            if [ -z "$WERT" ]; then
              # Leer heisst: hier nicht gesetzt. Im Ziel wird dann nichts
              # angelegt -- "nicht eingerichtet" bleibt sichtbar.
              echo "::warning::$NAME ist hier leer -- im Ziel NICHT angelegt"
              leer="$leer $NAME"
              continue
            fi
            # Wert ueber die Standardeingabe, nie als Argument (Argumente
            # koennen in Prozesslisten auftauchen).
            printf '%s' "$WERT" | gh secret set "$NAME" --repo "$ZIEL"
            echo "uebertragen: $NAME"
            uebertragen=$((uebertragen + 1))
          done
          echo "Uebertragen: $uebertragen von 12.${leer:+ Leer:$leer}"
          gh secret list --repo "$ZIEL"
