            EFF_SMTP_ABSENDER="$D_SMTP_ABSENDER"; EFF_SMTP_ABSENDER_NAME="$D_SMTP_ABSENDER_NAME"
            EFF_ANTHROPIC_API_KEY="$D_ANTHROPIC_API_KEY"; EFF_MAPS_JS_KEY="$D_MAPS_JS_KEY"
            # KEIN Rueckfall auf die Staging-Testadresse -- eigene Demo-
            # Testadresse, eigenes Secret (siehe smtp_ziel() in mailer.php).
            EFF_STAGING_TESTMAIL=""
            EFF_DEMO_TESTMAIL="$D_TESTMAIL"
            EFF_DEMO_RESET_TOKEN="$D_RESET_TOKEN"
            EFF_DEMO_ABLAUF_TOKEN=""
            EFF_VAPID_PRIVATE_PEM_B64="$D_VAPID_PRIVATE_PEM_B64"
