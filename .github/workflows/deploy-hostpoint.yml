            # Begruendung wie bei EFF_BETREIBER_FTP_* direkt darueber. Der
            # heutige Rueckfall auf db() in betreiber_db() bleibt fuer Demo
            # damit unveraendert bestehen.
            EFF_BETREIBER_DB_HOST=""
            EFF_BETREIBER_DB_NAME=""
            EFF_BETREIBER_DB_USER=""
            EFF_BETREIBER_DB_PASSWORD=""
            # OP-526, wie EFF_BETREIBER_DB_* direkt darueber: nur Production.
            EFF_MANDANT_SECRETS=""
            # portal.guardops.ch ist wie betreiber.guardops.ch nur fuer
            # Production gedacht (ENT-580) -- dieselbe Begruendung.
            EFF_PORTAL_FTP_HOST=""
            EFF_PORTAL_FTP_USER=""
            EFF_PORTAL_FTP_PASSWORD=""
            # cupi24.guardops.ch ist wie portal.guardops.ch nur fuer
            # Production gedacht (ENT-589) -- dieselbe Begruendung.
            EFF_CUPI24_FTP_HOST=""
            EFF_CUPI24_FTP_USER=""
            EFF_CUPI24_FTP_PASSWORD=""
            # Eigene Adresse (ENT-501), siehe Begruendung im Production-Zweig.
            # Fuer Demo steht die Domain als Environment-Variable DEMO_DOMAIN
            # bereit -- dieselbe, mit der der Verifikationsschritt weiter
            # unten die Seite abruft. KEIN Rueckfall auf die produktive
            # Adresse, aus demselben Grund wie bei Staging.
            EFF_APP_BASIS_URL=""
            if [ -n "${{ vars.DEMO_DOMAIN }}" ]; then
              EFF_APP_BASIS_URL="https://${{ vars.DEMO_DOMAIN }}"
            fi

            PFLICHT_FEHLT=""
            [ -z "$EFF_DB_HOST" ]                && PFLICHT_FEHLT="$PFLICHT_FEHLT DEMO_DB_HOST"
            [ -z "$EFF_DB_NAME" ]                && PFLICHT_FEHLT="$PFLICHT_FEHLT DEMO_DB_NAME"
            [ -z "$EFF_DB_USER" ]                && PFLICHT_FEHLT="$PFLICHT_FEHLT DEMO_DB_USER"
            [ -z "$EFF_DB_PASSWORD" ]            && PFLICHT_FEHLT="$PFLICHT_FEHLT DEMO_DB_PASSWORD"
            [ -z "$EFF_HOSTPOINT_FTP_HOST" ]     && PFLICHT_FEHLT="$PFLICHT_FEHLT DEMO_HOSTPOINT_FTP_HOST"
            [ -z "$EFF_HOSTPOINT_FTP_USER" ]     && PFLICHT_FEHLT="$PFLICHT_FEHLT DEMO_HOSTPOINT_FTP_USER"
            [ -z "$EFF_HOSTPOINT_FTP_PASSWORD" ] && PFLICHT_FEHLT="$PFLICHT_FEHLT DEMO_HOSTPOINT_FTP_PASSWORD"
            [ -z "$EFF_MAPS_JS_KEY" ]            && PFLICHT_FEHLT="$PFLICHT_FEHLT DEMO_MAPS_JS_KEY"
            # Anders als bei Production/Staging: hier ERFORDERLICH
            # (ENT-523-N1 -- die KI-Funktion soll in der Demo aktiv sein,
            # kein "meldet sich selbst als nicht eingerichtet").
            [ -z "$EFF_ANTHROPIC_API_KEY" ]      && PFLICHT_FEHLT="$PFLICHT_FEHLT DEMO_ANTHROPIC_API_KEY"
          else
            UMGEBUNG=staging
            EFF_DB_HOST="$S_DB_HOST"; EFF_DB_NAME="$S_DB_NAME"
            EFF_DB_USER="$S_DB_USER"; EFF_DB_PASSWORD="$S_DB_PASSWORD"
            EFF_HOSTPOINT_FTP_HOST="$S_HOSTPOINT_FTP_HOST"
            EFF_HOSTPOINT_FTP_USER="$S_HOSTPOINT_FTP_USER"
            EFF_HOSTPOINT_FTP_PASSWORD="$S_HOSTPOINT_FTP_PASSWORD"
            EFF_SMTP_HOST="$S_SMTP_HOST"; EFF_SMTP_PORT="$S_SMTP_PORT"
            EFF_SMTP_VERSCHLUESSELUNG="$S_SMTP_VERSCHLUESSELUNG"
            EFF_SMTP_USER="$S_SMTP_USER"; EFF_SMTP_PASSWORD="$S_SMTP_PASSWORD"
            EFF_SMTP_ABSENDER="$S_SMTP_ABSENDER"; EFF_SMTP_ABSENDER_NAME="$S_SMTP_ABSENDER_NAME"
            EFF_ANTHROPIC_API_KEY="$S_ANTHROPIC_API_KEY"; EFF_MAPS_JS_KEY="$S_MAPS_JS_KEY"
            EFF_STAGING_TESTMAIL="$S_STAGING_TESTMAIL"
            # Kein Rueckfall auf die Demo-Testadresse -- Staging und Demo
            # teilen sich keine Mailziele (ENT-523-N1).
            EFF_DEMO_TESTMAIL=""
            EFF_DEMO_RESET_TOKEN=""
            EFF_DEMO_ABLAUF_TOKEN=""
            EFF_VAPID_PRIVATE_PEM_B64="$S_VAPID_PRIVATE_PEM_B64"
            EFF_VAPID_KONTAKT="$S_VAPID_KONTAKT"
            EFF_PUSH_CRON_SCHLUESSEL="$S_PUSH_CRON_SCHLUESSEL"
            EFF_APNS_KEY_P8_B64=""
            EFF_APNS_KEY_ID=""
            EFF_APNS_TEAM_ID=""
            EFF_DEMO_EMPFAENGER="$S_DEMO_EMPFAENGER"
            # guardops.ch ist die ECHTE Verkaufsdomain. Ein Staging-Lauf hat
            # dort nichts verloren -- darum hier leer und KEIN Rueckfall auf
            # die Production-Werte. Der Schritt unten ueberspringt sich damit
            # von selbst.
            EFF_GUARDOPS_FTP_HOST=""
            EFF_GUARDOPS_FTP_USER=""
            EFF_GUARDOPS_FTP_PASSWORD=""
            # Dasselbe gilt fuer das eigene SMTP-Postfach von guardops.ch --
            # ein Staging-Lauf baut das guardops-Buendel ohnehin nie (siehe
            # Schritt unten), diese Zeilen sind nur die Absicherung dazu.
            EFF_GUARDOPS_SMTP_HOST=""
            EFF_GUARDOPS_SMTP_PORT=""
            EFF_GUARDOPS_SMTP_VERSCHLUESSELUNG=""
            EFF_GUARDOPS_SMTP_USER=""
            EFF_GUARDOPS_SMTP_PASSWORD=""
            # betreiber.guardops.ch ist wie guardops.ch nur fuer Production
            # gedacht (ENT-580) -- dieselbe Begruendung wie bei
            # EFF_GUARDOPS_FTP_* direkt darueber.
            EFF_BETREIBER_FTP_HOST=""
            EFF_BETREIBER_FTP_USER=""
            EFF_BETREIBER_FTP_PASSWORD=""
            # Die eigene Datenbank der Betreiber-Ebene (OP-518) ist wie
            # betreiber.guardops.ch nur fuer Production gedacht -- dieselbe
            # Begruendung wie bei EFF_BETREIBER_FTP_* direkt darueber.
            EFF_BETREIBER_DB_HOST=""
            EFF_BETREIBER_DB_NAME=""
            EFF_BETREIBER_DB_USER=""
            EFF_BETREIBER_DB_PASSWORD=""
            # OP-526, wie EFF_BETREIBER_DB_* direkt darueber: nur Production.
            EFF_MANDANT_SECRETS=""
            # portal.guardops.ch ist wie betreiber.guardops.ch nur fuer
            # Production gedacht (ENT-580) -- dieselbe Begruendung.
            EFF_PORTAL_FTP_HOST=""
            EFF_PORTAL_FTP_USER=""
            EFF_PORTAL_FTP_PASSWORD=""
            # cupi24.guardops.ch ist wie portal.guardops.ch nur fuer
            # Production gedacht (ENT-589) -- dieselbe Begruendung.
            EFF_CUPI24_FTP_HOST=""
            EFF_CUPI24_FTP_USER=""
            EFF_CUPI24_FTP_PASSWORD=""
            # Eigene Adresse (ENT-501, Begruendung im Production-Zweig).
            # STAGING_DOMAIN dient auch den Verifikationsschritten weiter
            # unten. Kein Rueckfall auf die produktive Adresse -- fehlt die
            # Variable, bleibt der Platzhalter stehen, basis_url() liefert
            # null statt eines falschen Links.
            EFF_APP_BASIS_URL=""
            if [ -n "${{ vars.STAGING_DOMAIN }}" ]; then
              EFF_APP_BASIS_URL="https://${{ vars.STAGING_DOMAIN }}"
            fi

            PFLICHT_FEHLT=""
            [ -z "$EFF_DB_HOST" ]                && PFLICHT_FEHLT="$PFLICHT_FEHLT STAGING_DB_HOST"
            [ -z "$EFF_DB_NAME" ]                && PFLICHT_FEHLT="$PFLICHT_FEHLT STAGING_DB_NAME"
            [ -z "$EFF_DB_USER" ]                && PFLICHT_FEHLT="$PFLICHT_FEHLT STAGING_DB_USER"
            [ -z "$EFF_DB_PASSWORD" ]            && PFLICHT_FEHLT="$PFLICHT_FEHLT STAGING_DB_PASSWORD"
            [ -z "$EFF_HOSTPOINT_FTP_HOST" ]     && PFLICHT_FEHLT="$PFLICHT_FEHLT STAGING_HOSTPOINT_FTP_HOST"
            [ -z "$EFF_HOSTPOINT_FTP_USER" ]     && PFLICHT_FEHLT="$PFLICHT_FEHLT STAGING_HOSTPOINT_FTP_USER"
            [ -z "$EFF_HOSTPOINT_FTP_PASSWORD" ] && PFLICHT_FEHLT="$PFLICHT_FEHLT STAGING_HOSTPOINT_FTP_PASSWORD"
            [ -z "$EFF_MAPS_JS_KEY" ]            && PFLICHT_FEHLT="$PFLICHT_FEHLT STAGING_MAPS_JS_KEY"
            [ -z "$EFF_STAGING_TESTMAIL" ]       && PFLICHT_FEHLT="$PFLICHT_FEHLT STAGING_TESTMAIL"
          fi

          # ENT-372: Staging deployt ausschliesslich gegen einen Tag der Form
          # qa-JJJJ-MM-TT-NNN, nie gegen einen Branch. Ohne diese Pruefung
          # wuerde ein Dispatch gegen IRGENDEINEN Branch, der nicht "main"
          # heisst, klaglos mit Staging-Secrets bespielt -- dieselbe Pruefung,
          # die das GitHub-Environment "staging" ueber "Deployment branches
          # and tags" (Muster qa-*) zusaetzlich extern erzwingt.
          if [ "$UMGEBUNG" = "staging" ]; then
            case "${{ github.ref_name }}" in
              qa-*) ;;
              *) echo "::error::Staging-Deploy abgebrochen -- Ref '${{ github.ref_name }}' ist kein qa-*-Tag (ENT-372). Staging deployt ausschliesslich gegen einen Tag der Form qa-JJJJ-MM-TT-NNN, nie gegen einen Branch."
                 exit 1 ;;
            esac
          fi

          # Dieselbe Absicherung fuer Demo (ENT-523): Ohne diese Pruefung
          # wuerde ein Dispatch gegen IRGENDEINEN Ref mit einem Namen der
          # NICHT "main" ist und NICHT mit "qa-" beginnt automatisch als
          # UMGEBUNG=demo durchgehen (siehe if/elif/else oben) -- auch ein
          # x-beliebiger Feature-Branch. Das GitHub-Environment "demo" soll
          # diese Pruefung zusaetzlich extern erzwingen (Settings →
          # Environments → demo → Deployment branches and tags, Muster
          # demo-*), sobald es eingerichtet ist.
          if [ "$UMGEBUNG" = "demo" ]; then
            case "${{ github.ref_name }}" in
              demo-*) ;;
              *) echo "::error::Demo-Deploy abgebrochen -- Ref '${{ github.ref_name }}' ist kein demo-*-Tag (ENT-523). Demo deployt ausschliesslich gegen einen Tag der Form demo-JJJJ-MM-TT-NNN, nie gegen einen Branch."
                 exit 1 ;;
            esac
          fi

          # Drift-Guard fuer die manuell bei Hostpoint gepflegten Staging-
          # Dateien (ENT-384/387; Demo braucht ihn nicht, ENT-523-N1). Der
          # Deploy laesst htaccess-hostpoint, htaccess-staging-zusatz und
          # robots-staging.txt fuer Staging unangetastet, sonst wuerde er den
          # dort manuell gepflegten Passwortschutz stillschweigend entfernen
          # -- driftet eine der drei Quelldateien im Repository unbemerkt
          # auseinander, muss jeder Hash exakt staging-htaccess.synced-sha256
          # entsprechen, sonst bricht der Staging-Deploy ab.
          if [ "$UMGEBUNG" = "staging" ]; then
            for DRIFT_DATEI in htaccess-hostpoint htaccess-staging-zusatz robots-staging.txt; do
              AKTUELLER_HASH=$(sha256sum "$DRIFT_DATEI" | cut -d' ' -f1)
              SYNCED_HASH=$(grep -E "^${DRIFT_DATEI}:" staging-htaccess.synced-sha256 | cut -d':' -f2 | tr -d '[:space:]')
              if [ -z "$SYNCED_HASH" ] || [ "$AKTUELLER_HASH" != "$SYNCED_HASH" ]; then
                echo "::error::Staging-Deploy abgebrochen -- $DRIFT_DATEI wurde seit der letzten manuellen Staging-Synchronisierung veraendert oder hat keinen erfassten Hash (Hash-Abweichung, ENT-384/ENT-387). Bitte den Inhalt von $DRIFT_DATEI erneut manuell bei Hostpoint eintragen und anschliessend staging-htaccess.synced-sha256 mit dem neuen Hash aktualisieren."
                exit 1
              fi
            done
          fi

          if [ -n "$PFLICHT_FEHLT" ]; then
            echo "::error::Deployment abgebrochen -- fuer Environment $UMGEBUNG fehlen erforderliche Secrets:$PFLICHT_FEHLT"
            exit 1
          fi

          # Von Upload/Loeschung auszunehmende Dateien fuer den FTP-Schritt
          # unten (ENT-384/ENT-387) -- als eigene, mehrzeilige Umgebungs-
          # variable statt direkt im YAML verdrahtet, weil die Deploy-Action
          # ihre "exclude"-Liste zeilenweise erwartet und eine echte
          # Mehrzeilen-Zeichenkette in einem Bash-String einfacher und
          # robuster zu bauen ist als in einem YAML-Ausdruck. Fuer Production
          # bleibt der Wert leer, dort laeuft der Upload unveraendert.
          if [ "$UMGEBUNG" = "staging" ]; then
            STAGING_EXCLUDE=$'.htaccess\nrobots.txt'
          else
            STAGING_EXCLUDE=""
          fi

          # Fuer die folgenden Schritte als Umgebungsvariablen weiterreichen.
          # GitHub maskiert Werte, die einmal ueber "secrets." referenziert
          # wurden, im Log unabhaengig davon, ueber wie viele Variablen sie
          # danach noch laufen.
          {
            echo "UMGEBUNG=$UMGEBUNG"
            echo "EFF_DB_HOST=$EFF_DB_HOST"
            echo "EFF_DB_NAME=$EFF_DB_NAME"
            echo "EFF_DB_USER=$EFF_DB_USER"
            echo "EFF_DB_PASSWORD=$EFF_DB_PASSWORD"
            echo "EFF_HOSTPOINT_FTP_HOST=$EFF_HOSTPOINT_FTP_HOST"
            echo "EFF_HOSTPOINT_FTP_USER=$EFF_HOSTPOINT_FTP_USER"
            echo "EFF_HOSTPOINT_FTP_PASSWORD=$EFF_HOSTPOINT_FTP_PASSWORD"
            echo "EFF_SMTP_HOST=$EFF_SMTP_HOST"
            echo "EFF_SMTP_PORT=$EFF_SMTP_PORT"
            echo "EFF_SMTP_VERSCHLUESSELUNG=$EFF_SMTP_VERSCHLUESSELUNG"
            echo "EFF_SMTP_USER=$EFF_SMTP_USER"
            echo "EFF_SMTP_PASSWORD=$EFF_SMTP_PASSWORD"
            echo "EFF_SMTP_ABSENDER=$EFF_SMTP_ABSENDER"
            echo "EFF_SMTP_ABSENDER_NAME=$EFF_SMTP_ABSENDER_NAME"
            echo "EFF_ANTHROPIC_API_KEY=$EFF_ANTHROPIC_API_KEY"
            echo "EFF_MAPS_JS_KEY=$EFF_MAPS_JS_KEY"
            echo "EFF_STAGING_TESTMAIL=$EFF_STAGING_TESTMAIL"
            echo "EFF_DEMO_TESTMAIL=$EFF_DEMO_TESTMAIL"
            echo "EFF_DEMO_RESET_TOKEN=$EFF_DEMO_RESET_TOKEN"
            echo "EFF_DEMO_ABLAUF_TOKEN=$EFF_DEMO_ABLAUF_TOKEN"
            echo "EFF_VAPID_PRIVATE_PEM_B64=$EFF_VAPID_PRIVATE_PEM_B64"
            echo "EFF_VAPID_KONTAKT=$EFF_VAPID_KONTAKT"
            echo "EFF_PUSH_CRON_SCHLUESSEL=$EFF_PUSH_CRON_SCHLUESSEL"
            echo "EFF_APNS_KEY_P8_B64=$EFF_APNS_KEY_P8_B64"
            echo "EFF_APNS_KEY_ID=$EFF_APNS_KEY_ID"
            echo "EFF_APNS_TEAM_ID=$EFF_APNS_TEAM_ID"
            echo "EFF_APP_BASIS_URL=$EFF_APP_BASIS_URL"
            echo "EFF_DEMO_EMPFAENGER=$EFF_DEMO_EMPFAENGER"
            echo "EFF_GUARDOPS_FTP_HOST=$EFF_GUARDOPS_FTP_HOST"
            echo "EFF_GUARDOPS_FTP_USER=$EFF_GUARDOPS_FTP_USER"
            echo "EFF_GUARDOPS_FTP_PASSWORD=$EFF_GUARDOPS_FTP_PASSWORD"
            echo "EFF_GUARDOPS_SMTP_HOST=$EFF_GUARDOPS_SMTP_HOST"
            echo "EFF_GUARDOPS_SMTP_PORT=$EFF_GUARDOPS_SMTP_PORT"
            echo "EFF_GUARDOPS_SMTP_VERSCHLUESSELUNG=$EFF_GUARDOPS_SMTP_VERSCHLUESSELUNG"
            echo "EFF_GUARDOPS_SMTP_USER=$EFF_GUARDOPS_SMTP_USER"
            echo "EFF_GUARDOPS_SMTP_PASSWORD=$EFF_GUARDOPS_SMTP_PASSWORD"
            echo "EFF_BETREIBER_FTP_HOST=$EFF_BETREIBER_FTP_HOST"
            echo "EFF_BETREIBER_FTP_USER=$EFF_BETREIBER_FTP_USER"
            echo "EFF_BETREIBER_FTP_PASSWORD=$EFF_BETREIBER_FTP_PASSWORD"
            # Steht wie EFF_DB_PASSWORD oben im Klartext im Log-Text dieses
            # Schritts -- ungefaehrlich, weil GitHub jeden Wert, der einmal
            # ueber "secrets." referenziert wurde (hier: secrets.BETREIBER_
            # DB_PASSWORD), im Log maskiert, unabhaengig davon, ueber wie
            # viele Variablen er danach noch laeuft (siehe Begruendung oben).
            echo "EFF_BETREIBER_DB_HOST=$EFF_BETREIBER_DB_HOST"
            echo "EFF_BETREIBER_DB_NAME=$EFF_BETREIBER_DB_NAME"
            echo "EFF_BETREIBER_DB_USER=$EFF_BETREIBER_DB_USER"
            echo "EFF_BETREIBER_DB_PASSWORD=$EFF_BETREIBER_DB_PASSWORD"
            echo "EFF_MANDANT_SECRETS=$EFF_MANDANT_SECRETS"
            echo "EFF_PORTAL_FTP_HOST=$EFF_PORTAL_FTP_HOST"
            echo "EFF_PORTAL_FTP_USER=$EFF_PORTAL_FTP_USER"
            echo "EFF_PORTAL_FTP_PASSWORD=$EFF_PORTAL_FTP_PASSWORD"
            echo "EFF_CUPI24_FTP_HOST=$EFF_CUPI24_FTP_HOST"
            echo "EFF_CUPI24_FTP_USER=$EFF_CUPI24_FTP_USER"
            echo "EFF_CUPI24_FTP_PASSWORD=$EFF_CUPI24_FTP_PASSWORD"
          } >> "$GITHUB_ENV"

          # Mehrzeiliger Wert -- eigener Heredoc-Block statt einer einfachen
          # "KEY=value"-Zeile, sonst wuerde der eingebettete Zeilenumbruch die
          # GITHUB_ENV-Datei zerreissen.
          {
            echo "STAGING_EXCLUDE<<STAGING_EXCLUDE_ENDE"
            echo "$STAGING_EXCLUDE"
            echo "STAGING_EXCLUDE_ENDE"
          } >> "$GITHUB_ENV"

      - name: Platzhalter durch echte Werte ersetzen
        run: |
          mkdir -p dist/api dist/icons dist/fonts dist/img dist/handbuch
          cp index.html dist/index.html
          cp dashboard.html dist/dashboard.html
          cp app.html dist/app.html
          # Kundenportal (ENT-441). Eigene Seite, bewusst getrennt von
          # dashboard.html und app.html: Sie traegt weder Cockpit- noch
          # Mitarbeiter-Code, also kann von dort auch nichts versehentlich
          # an einen Kunden geraten.
          cp portal.html dist/portal.html
          # KEINE homepage.html MEHR AUF DIESER INSTANZ (ENT-563/OP-565): Die
          # oeffentliche Seite lebt seit guardops.ch als index.html dort,
          # doppelter Inhalt unter zwei Adressen soll nicht entstehen. Der
          # Upload raeumt sein Ziel auf, die Datei fehlt hier also von
          # selbst; guardops.ch baut sie weiter, test_deploy.mjs achtet
          # darauf, dass sie hier nicht zurueckkehrt.
          # Betreiber-Bereich (ENT-519/521): eigene Seite, eigene Anmeldung
          # gegen betreiber_*-Endpunkte, kein Cockpit-/Mitarbeiter-/Portalcode.
          cp betreiber.html dist/betreiber.html
          # gav.js traegt die GAV-Regeln fuer BEIDE Oberflaechen (ENT-049).
          # Fehlt sie hier, laden dashboard.html und app.html ins Leere und
          # rechnen gar nichts mehr -- derselbe Fallstrick wie bei ENT-040.
          cp gav.js dist/gav.js
          # zeitwahl.js traegt das Zeit-Bedienelement fuer BEIDE Oberflaechen
          # (ENT-110). Fehlt sie hier, sind alle Zeitfelder unsichtbar und es
          # laesst sich keine Zeit mehr eintragen -- derselbe Fallstrick.
          cp zeitwahl.js dist/zeitwahl.js
          # qrcode.js wird von beleg_oeffentlich.php per <script src> geladen
          # (ENT-205), nicht von dashboard.html/app.html -- test_deploy.mjs
          # scannt nur diese beiden auf lokale Skripte, darum hier von Hand
          # eingetragen wie gav.js/zeitwahl.js oben.
          cp qrcode.js dist/qrcode.js
          # unterschrift.js traegt das Unterschriftsfeld fuer BEIDE Oberflaechen
          # (ENT-292) -- derselbe Fallstrick wie bei gav.js/zeitwahl.js oben:
          # fehlt die Zeile, laesst der Kunde live nirgends mehr
          # unterschreiben, und lokal faellt es NICHT auf.
          cp unterschrift.js dist/unterschrift.js
          # testumgebung.js traegt das TESTUMGEBUNG-Kennzeichen fuer ALLE
          # DREI Oberflaechen (ENT-341) -- derselbe Fallstrick wie bei
          # gav.js/zeitwahl.js/unterschrift.js oben: fehlt die Zeile, faellt
          # das Kennzeichen auf Staging lautlos weg, und lokal faellt es
          # NICHT auf. test_deploy.mjs prueft das bereits automatisch mit,
          # weil es jedes <script src> in den drei Seiten gegen diese Liste
          # abgleicht.
          cp testumgebung.js dist/testumgebung.js
          # html2pdf.bundle.min.js (ENT-206): erst bei Klick auf "Herunter-
          # laden" per JS nachgeladen, deshalb kein literales <script>-Tag im
          # HTML -- test_deploy.mjs prueft trotzdem, dass sie hier steht.
          cp html2pdf.bundle.min.js dist/html2pdf.bundle.min.js
          # Leaflet ist seit ENT-269 nicht mehr im Einsatz (Google Maps statt
          # Leaflet/OpenStreetMap fuer die Kontrollpunkt-Kartenauswahl,
          # Revision von ENT-248) -- kein Ordner mehr auszuliefern. Google
          # Maps wird per <script src="https://maps.googleapis.com/..."> in
          # dashboard.html selbst geladen, kein lokaler Kopiervorgang noetig.
          cp manifest.json dist/manifest.json
          cp manifest-app.json dist/manifest-app.json
          cp sw.js dist/sw.js
          cp icons/*.png dist/icons/
          # Inter wird seit ENT-223/OP-224 selbst ausgeliefert statt von
          # Google geladen -- dashboard.html verweist per @font-face auf
          # fonts/. Fehlen diese Zeilen, faellt die Schrift live auf den
          # System-Stapel zurueck, und lokal faellt es NICHT auf, weil die
          # Dateien im Arbeitsverzeichnis ja liegen: derselbe Fallstrick wie
          # bei gav.js/zeitwahl.js oben. test_deploy.mjs prueft es seither
          # auch fuer CSS-url(), nicht nur fuer <script src>.
          # inter-LICENSE.txt gehoert mit: Die SIL Open Font License 1.1
          # verlangt, dass die Lizenz die Schrift begleitet.
          cp fonts/*.woff2 dist/fonts/
          cp fonts/inter-LICENSE.txt dist/fonts/inter-LICENSE.txt
          # Archivo und IBM Plex (Homepage, ENT-469): selbst ausgeliefert
          # wie Inter -- kein Abruf bei Google von der oeffentlichen Seite
          # aus. Die woff2-Dateien nimmt die Zeile oben mit; die Lizenzen
          # muessen ebenso begleiten (SIL OFL 1.1).
          cp fonts/archivo-OFL.txt dist/fonts/archivo-OFL.txt
          cp fonts/ibm-plex-LICENSE.txt dist/fonts/ibm-plex-LICENSE.txt
          # Hintergrundfoto der Anmeldemaske auf dem Desktop (ENT-392) --
          # per CSS-url() aus app.html geholt, genau derselbe Fallstrick
          # wie bei den Schriftschnitten oben: fehlt die Datei auf dem
          # Server, faellt der Hintergrund lautlos auf die reine
          # Verlaufsflaeche zurueck, lokal faellt es NICHT auf.
          cp img/anmeldung-nacht.webp dist/img/anmeldung-nacht.webp
          # Video-Hintergrund (ENT-394, ergaenzt das Foto darueber) --
          # WebM/VP9 und MP4/H.264 als zwei <source>-Quellen in app.html,
          # derselbe Fallstrick wie beim Foto: fehlt eine der beiden
          # Dateien, spielt sie fuer die Browser, die genau dieses Format
          # brauchen, gar nichts ab, und lokal faellt es NICHT auf.
          cp img/anmeldung-nacht.webm dist/img/anmeldung-nacht.webm
          cp img/anmeldung-nacht.mp4 dist/img/anmeldung-nacht.mp4
          cp backend/db.php dist/db.php
          # Sitzungen und Einmal-Codes des Kundenportals (ENT-441).
          # Wird nur von den portal_*-Endpunkten eingebunden, nie direkt
          # aufgerufen -- steht darum auch in der Sperrliste der .htaccess.
          cp backend/kundenportal.php dist/kundenportal.php
          # Konten, Sitzungen und Mandantenstamm der Betreiber-Ebene
          # (ENT-524). Wird nur von den betreiber_*-Endpunkten
          # eingebunden, nie direkt aufgerufen -- steht darum auch in
          # der Sperrliste der .htaccess.
          cp backend/betreiber.php dist/betreiber.php
          # Rechenkern der Demo-Zugaenge (ENT-600) -- betreiber.php bindet
          # ihn per require_once ein. Fehlt er, stirbt jeder Aufruf, der
          # betreiber.php laedt, nicht erst die Demo-Freigabe.
          cp backend/demo_zugang.php dist/demo_zugang.php
          # Support-Freigabe (ENT-526). Wird von BEIDEN Seiten eingebunden --
          # von den support_*-Endpunkten des Betriebs und von
          # api/betreiber_support.php -- und nie direkt aufgerufen; steht
          # darum auch in der Sperrliste der .htaccess.
          cp backend/support.php dist/support.php
          # Supportvorgaenge (ENT-538). Die Gegenstuecke sind die Endpunkte
          # support_anfrage.php (Kundenseite) und
          # betreiber_support_vorgang.php (Vorrat) -- die kommen ueber
          # backend/api/*.php mit.
          cp backend/supportvorgang.php dist/supportvorgang.php
          # Pruefung und Mailtext der Demo-Anfrage (ENT-469), eingebunden
          # von api/demo_senden.php -- steht darum auch in der Sperrliste.
          # Der ENDPUNKT heisst bewusst anders: gleicher Name hiesse mitgesperrt.
          cp backend/demo_anfrage.php dist/demo_anfrage.php
          # Musterbetrieb-Erzeugung fuer die Demo-Umgebung (ENT-523),
          # eingebunden von api/demo_daten_erzeugen.php -- steht darum auch
          # in der Sperrliste. Wird fuer ALLE Umgebungen mitkopiert wie
          # jede andere Backend-Datei; require_demo_umgebung() im Endpunkt
          # sorgt dafuer, dass ein Aufruf ausserhalb der Demo 404 liefert,
          # nicht die Datei-Sperrliste allein.
          cp backend/demo_daten.php dist/demo_daten.php
          # Rechenkern des naechtlichen Demo-Resets (ENT-523 Punkt 3),
          # eingebunden von api/demo_reset.php -- gleiche Begruendung wie bei
          # backend/demo_daten.php zwei Zeilen darueber.
          cp backend/demo_reset.php dist/demo_reset.php
          # Bremse des Demo-Formulars (dateibasiert, keine Datenbank). Sie
          # steht wie jede Hilfsdatei in der Sperrliste von htaccess-hostpoint
          # -- test_php.mjs gleicht beides gegeneinander ab.
          cp backend/demo_bremse.php dist/demo_bremse.php
          cp backend/ai.php dist/ai.php
          cp backend/planung.php dist/planung.php
          cp backend/kunden.php dist/kunden.php
          cp backend/mitarbeiter.php dist/mitarbeiter.php
          cp backend/layout.php dist/layout.php
          cp backend/anmeldung.php dist/anmeldung.php
          cp backend/zweifaktor.php dist/zweifaktor.php
          cp backend/rechte.php dist/rechte.php
          cp backend/logbuch.php dist/logbuch.php
          cp backend/ereignisse.php dist/ereignisse.php
          cp backend/auslagen.php dist/auslagen.php
          cp backend/rundgang.php dist/rundgang.php
          cp backend/fahrzeug.php dist/fahrzeug.php
          cp backend/geofence_bereich.php dist/geofence_bereich.php
          cp backend/belege.php dist/belege.php
          cp backend/qrrechnung.php dist/qrrechnung.php
          cp backend/produkte.php dist/produkte.php
          cp backend/mailer.php dist/mailer.php
          cp backend/ferien.php dist/ferien.php
          cp backend/lohn.php dist/lohn.php
          cp backend/gavzeit.php dist/gavzeit.php
          cp backend/lohnlauf.php dist/lohnlauf.php
          cp backend/mitteilungen.php dist/mitteilungen.php
          cp backend/push.php dist/push.php
          # Schutzeinstellungen (ENT-075). Im Repository heisst die Datei
          # bewusst ohne fuehrenden Punkt -- sonst uebersieht man sie. Wird
          # trotzdem fuer ALLE Umgebungen hier erzeugt (auch wenn der
          # FTP-Schritt unten sie fuer Staging von Upload/Loeschung
          # ausschliesst, ENT-384) -- so bleibt dieser Schritt umgebungs-
          # unabhaengig, und ein spaeteres Aendern der Ausschluss-Regel
          # bringt hier nichts durcheinander.
          cp htaccess-hostpoint dist/.htaccess
          # Demo-Zusatz (ENT-523, X-Robots-Tag): ANDERS als bei Staging
          # automatisch angehaengt statt manuell bei Hostpoint gepflegt --
          # Demo traegt keinen Passwortschutz-Block, der ueberschrieben
          # werden koennte (ENT-523-N1), darum gibt es keinen Grund, die
          # Demo-.htaccess vom automatischen Deploy auszunehmen. Kein
          # Drift-Guard noetig: Was hier steht, kommt bei jedem Deploy
          # frisch aus dem Repository.
          if [ "$UMGEBUNG" = "demo" ]; then
            cat htaccess-demo-zusatz >> dist/.htaccess
            cp robots-demo.txt dist/robots.txt
          fi
          cp backend/api/*.php dist/api/
          # Handbuch (Nachschlagewerk fuers Cockpit, rollenunabhaengig hinter
          # einem eigenen Zugangs-Ticket, siehe handbuch/_guard.php und
          # backend/api/handbuch_ticket.php). Bleibt als eigener Unterordner
          # erhalten -- anders als backend/, das oben abgeflacht in dist/
          # landet. handbuch/_guard.php erreicht db.php darum ueber
          # '../db.php' (dist/handbuch/../db.php = dist/db.php), nicht ueber
          # '../backend/db.php' wie im rohen Repository.
          cp handbuch/*.php dist/handbuch/
          cp handbuch/*.css dist/handbuch/
          cp handbuch/*.js dist/handbuch/
          # setup.php / setup.html bewusst NICHT hier -- Ersteinrichtung ist ein
          # einmaliger manueller Upload, damit die Datei nicht bei jedem Push
          # automatisch neu auf den Server kommt.
          #
          # Ab hier kommen alle Werte aus dem vorigen Schritt (EFF_*,
          # UMGEBUNG) -- nicht mehr direkt aus "secrets.", damit es nur EINE
          # Stelle gibt, an der Produktion und Staging auseinandergehalten
          # werden.
          sed -i "s|__DB_HOST__|$EFF_DB_HOST|g" dist/db.php
          sed -i "s|__DB_NAME__|$EFF_DB_NAME|g" dist/db.php
          sed -i "s|__DB_USER__|$EFF_DB_USER|g" dist/db.php
          sed -i "s|__DB_PASS__|$EFF_DB_PASSWORD|g" dist/db.php
          # Platzhalter der separaten Betreiber-Datenbank (OP-518, sop-projekt/
          # 00-projekt/offene-punkte.md). Bleiben die vier Secrets BETREIBER_
          # DB_HOST/NAME/USER/PASSWORD ungesetzt, ist $EFF_BETREIBER_DB_* leer
          # -- die Ersetzung traegt dann eine leere Zeichenkette statt des
          # woertlichen Platzhalters ein, und betreiber_db() faellt bei
          # leerem Namen bewusst auf db() zurueck (siehe Kopf von
          # backend/betreiber.php). Das ist der heutige, unveraenderte
          # Normalfall -- KEIN neuer Fehlerzustand, nur ueber eine leere
          # Variable statt einen liegen gebliebenen Platzhalter hergestellt.
          sed -i "s|__BETREIBER_DB_HOST__|$EFF_BETREIBER_DB_HOST|g" dist/betreiber.php
          sed -i "s|__BETREIBER_DB_NAME__|$EFF_BETREIBER_DB_NAME|g" dist/betreiber.php
          sed -i "s|__BETREIBER_DB_USER__|$EFF_BETREIBER_DB_USER|g" dist/betreiber.php
          sed -i "s|__BETREIBER_DB_PASS__|$EFF_BETREIBER_DB_PASSWORD|g" dist/betreiber.php
          # APP_ENV (ENT-341, Revision): explizite Umgebungskennung statt
          # Ableitung aus dem Hostnamen -- traegt sowohl db.php als auch
          # testumgebung.js, damit Backend und die drei Frontends dieselbe
          # Quelle der Wahrheit verwenden.
          sed -i "s|__APP_ENV__|$UMGEBUNG|g" dist/db.php
          sed -i "s|__APP_ENV__|$UMGEBUNG|g" dist/testumgebung.js
          # Eigene Adresse (ENT-501). Bleibt sie leer -- bei Staging ohne
          # gesetzte STAGING_DOMAIN --, steht weiterhin woertlich
          # "__APP_BASIS_URL__" in dist/db.php; basis_url() erkennt das und
          # liefert null, und die betroffenen Endpunkte verschicken dann
          # keinen Link statt eines falschen (dieselbe Bauart wie bei SMTP
          # und Push oben).
          sed -i "s|__APP_BASIS_URL__|$EFF_APP_BASIS_URL|g" dist/db.php
          sed -i "s|__ANTHROPIC_API_KEY__|$EFF_ANTHROPIC_API_KEY|g" dist/ai.php
          # SMTP fuer den Offert-Versand (ENT-192). Bleiben die Secrets ungesetzt,
          # steht weiterhin woertlich "__SMTP_HOST__" usw. in dist/mailer.php --
          # smtp_konfiguriert() erkennt das und meldet "nicht eingerichtet",
          # statt mit einem Platzhalter als Hostnamen zu verbinden. STAGING_SMTP_*
          # sind eigene, von SMTP_* verschiedene Secret-NAMEN (kein struktureller
          # Rueckfall moeglich, siehe ENT-343 Punkt 1) -- tragen aber seit ENT-367
          # dieselben WERTE wie Production: Hostpoint erlaubt kontoweit nur ein
          # kostenloses Postfach auf *.myhostpoint.ch, das bereits produktiv
          # belegt ist, und sop-plattform hat keine eigene Domain. ENT-371
          # bestaetigt das als bewusste, eng begrenzte Ausnahme von der sonst
          # harten Infrastrukturtrennung (ENT-372) -- gilt AUSSCHLIESSLICH
          # fuer SMTP, kein Praezedenzfall fuer DB/FTP/Storage/API-Keys. Die
          # Umleitung auf STAGING_TESTMAIL bleibt die massgebliche
          # Absicherung, siehe unten; mailer.php kennzeichnet den
          # Absendernamen ausserhalb der Produktion zusaetzlich automatisch
          # mit "[STAGING]" (ENT-371 Bedingung 4).
          sed -i "s|__SMTP_HOST__|$EFF_SMTP_HOST|g" dist/mailer.php
          sed -i "s|__SMTP_PORT__|$EFF_SMTP_PORT|g" dist/mailer.php
          sed -i "s|__SMTP_VERSCHLUESSELUNG__|$EFF_SMTP_VERSCHLUESSELUNG|g" dist/mailer.php
          sed -i "s|__SMTP_USER__|$EFF_SMTP_USER|g" dist/mailer.php
          sed -i "s|__SMTP_PASSWORD__|$EFF_SMTP_PASSWORD|g" dist/mailer.php
          sed -i "s|__SMTP_ABSENDER__|$EFF_SMTP_ABSENDER|g" dist/mailer.php
          sed -i "s|__SMTP_ABSENDER_NAME__|$EFF_SMTP_ABSENDER_NAME|g" dist/mailer.php
          # Empfaenger der Demo-Anfragen. Fehlt das Secret, bleibt der
          # Platzhalter stehen -- demo_empfaenger_pruefen() erkennt ihn und
          # liefert null, das Formular sagt dann "noch nicht eingerichtet"
          # (503) statt an eine Unsinn-Adresse zu senden. Gleiche Bauart wie
          # basis_url_pruefen() (ENT-501).
          sed -i "s|__DEMO_EMPFAENGER__|$EFF_DEMO_EMPFAENGER|g" dist/demo_anfrage.php
          # Staging-Mailmodus (ENT-341): Ausserhalb der Produktion leitet
          # mailer.php JEDE Mail auf diese Adresse um -- unabhaengig davon,
          # ueber welches Postfach (siehe SMTP_* oben) sie verschickt wird.
          # Bleibt das Secret in einer Umgebung ungesetzt, steht weiterhin
          # woertlich "__STAGING_TESTMAIL__" in dist/mailer.php -- smtp_ziel()
          # erkennt das und smtp_senden() bricht dann ab, statt irgendwohin
          # zu senden. Fuer main ist EFF_STAGING_TESTMAIL bewusst leer, das
          # ist unschaedlich: ist_produktion() ist dort wahr, smtp_ziel()
          # fragt die Testadresse in diesem Zweig gar nicht erst ab.
          sed -i "s|__STAGING_TESTMAIL__|$EFF_STAGING_TESTMAIL|g" dist/mailer.php
          # Demo-Mailmodus (ENT-523-N1): dieselbe Bauart wie
          # __STAGING_TESTMAIL__ oben, aber eine EIGENE Adresse -- Demo und
          # Staging teilen kein Mailziel (siehe smtp_ziel() in mailer.php).
          # Fuer main und fuer Staging ist EFF_DEMO_TESTMAIL bewusst leer.
          sed -i "s|__DEMO_TESTMAIL__|$EFF_DEMO_TESTMAIL|g" dist/mailer.php
          # Zeitgeber-Zugang fuer den naechtlichen Demo-Reset (ENT-523 Punkt 3,
          # api/demo_reset.php) -- fuer main und Staging bewusst leer, aus
          # demselben Grund wie EFF_DEMO_TESTMAIL zwei Zeilen darueber.
          sed -i "s|__DEMO_RESET_TOKEN__|$EFF_DEMO_RESET_TOKEN|g" dist/api/demo_reset_ausfuehren.php
          # Google-Maps-Browserschluessel (ENT-341): eigener Schluessel je
          # Umgebung, in ALLEN Oberflaechen, die die Karte laden -- seit
          # ENT-474 auch im Kundenportal (Weg waehrend der Runde, hinter
          # einem Knopf). Fehlt die Ersetzung fuer eine davon, laedt Google
          # Maps dort mit dem woertlichen Platzhalter als Schluessel und die
          # Karte bleibt leer; test_deploy.mjs prueft das darum je Datei.
          sed -i "s|__MAPS_JS_KEY__|$EFF_MAPS_JS_KEY|g" dist/dashboard.html
          sed -i "s|__MAPS_JS_KEY__|$EFF_MAPS_JS_KEY|g" dist/portal.html
          # Push-Benachrichtigungen (ENT-424). Wie bei SMTP bewusst NICHT
          # erforderlich: Bleiben die Secrets ungesetzt, steht weiterhin
          # woertlich "__VAPID_PRIVATE_PEM_B64__" in dist/push.php --
          # push_konfiguriert() erkennt das und meldet "nicht eingerichtet",
          # statt mit einem Platzhalter als Schluessel zu signieren.
          # VAPID_PRIVATE_PEM_B64 ist base64 der PEM-Datei des privaten
          # P-256-Schluessels, EINZEILIG (base64 -w0) -- sed vertraegt
          # keine Zeilenumbrueche im Ersatzwert.
          sed -i "s|__VAPID_PRIVATE_PEM_B64__|$EFF_VAPID_PRIVATE_PEM_B64|g" dist/push.php
          sed -i "s|__VAPID_KONTAKT__|$EFF_VAPID_KONTAKT|g" dist/push.php
          sed -i "s|__APNS_KEY_P8_B64__|$EFF_APNS_KEY_P8_B64|g" dist/push.php
          sed -i "s|__APNS_KEY_ID__|$EFF_APNS_KEY_ID|g" dist/push.php
          sed -i "s|__APNS_TEAM_ID__|$EFF_APNS_TEAM_ID|g" dist/push.php
          # Der Schluessel fuer den Zeitgeber-Aufruf (Hostpoint-Cronjob).
          # Ohne ihn bleibt dieser Weg zu; der Versand laeuft dann nur beim
          # Veroeffentlichen und beilaeufig beim Oeffnen der
          # Mitteilungsseite im Cockpit.
          sed -i "s|__PUSH_CRON_SCHLUESSEL__|$EFF_PUSH_CRON_SCHLUESSEL|g" dist/api/push_versand.php
          sed -i "s|__MAPS_JS_KEY__|$EFF_MAPS_JS_KEY|g" dist/app.html

      # Live-Version-Verifikation fuer den externen QA-Runner (ENT-435,
      # sop-qa-runner). Ausschliesslich fuer Staging, keine Secrets: Beide
      # Werte kommen aus dem GitHub-Kontext, nicht aus "secrets.". Staging
      # deployt seit ENT-372 ausschliesslich per workflow_dispatch gegen
      # einen Tag der Form qa-JJJJ-MM-TT-NNN -- github.ref_name ist in
      # diesem Fall bereits der qa_tag, github.sha bereits der exakte
      # deployte Commit. Fuer Production laeuft dieser Schritt gar nicht
      # (if-Bedingung); dist/qa-version.json existiert dort in keinem Lauf
      # und wird folglich auch nie hochgeladen -- Production bleibt damit
      # strukturell unveraendert, nicht nur der Absicht nach.
      - name: qa-version.json erzeugen (nur Staging)
        if: ${{ env.UMGEBUNG == 'staging' }}
        run: |
          cat > dist/qa-version.json << EOF
          {
            "qa_tag": "${{ github.ref_name }}",
            "commit_sha": "${{ github.sha }}"
          }
          EOF

      # Dieselbe Nachvollziehbarkeit fuer Demo (ENT-523): welcher Tag/Commit
      # laeuft gerade auf der Demo-Instanz. Kein externer QA-Runner liest
      # das (anders als bei Staging, ENT-435) -- der Nutzen ist rein
      # betrieblich, beim Nachsehen vor einer Vorfuehrung.
      - name: demo-version.json erzeugen (nur Demo)
        if: ${{ env.UMGEBUNG == 'demo' }}
        run: |
          cat > dist/demo-version.json << EOF
          {
            "demo_tag": "${{ github.ref_name }}",
            "commit_sha": "${{ github.sha }}"
          }
          EOF

      - name: Nach Hostpoint hochladen (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.EFF_HOSTPOINT_FTP_HOST }}
          username: ${{ env.EFF_HOSTPOINT_FTP_USER }}
          password: ${{ env.EFF_HOSTPOINT_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          # Sowohl der produktive FTP-Account (rapport@itufeden.myhostpoint.ch,
          # fest auf /home/itufeden/www/rapport eingeschraenkt) als auch der
          # separate Staging-Account (ENT-341, auf sein eigenes Verzeichnis
          # eingeschraenkt) sind bereits von Hostpoint auf ihr jeweiliges
          # Verzeichnis begrenzt -- daher hier immer nur "/", nicht der volle
          # Pfad. Welcher Account tatsaechlich verwendet wird, entscheidet
          # ausschliesslich der vorige Schritt (EFF_HOSTPOINT_FTP_*), nicht
          # diese Zeile.
          server-dir: /
          # ENT-384/ENT-387: Bei Staging bleiben .htaccess UND robots.txt von
          # Upload UND Loeschung ausgenommen. .htaccess traegt oberhalb von
          # "#@__HCP_END__@#" den von Hostpoints eigener Passwortschutz-
          # Oberflaeche verwalteten Basic-Auth-Block (kein AuthUserFile o. ae.
          # sichtbar -- Hostpoint verwaltet die Zugangsdaten offenbar
          # ausserhalb der sichtbaren Datei) und darunter von Hand die Inhalte
          # von htaccess-hostpoint sowie htaccess-staging-zusatz (X-Robots-Tag).
          # robots.txt liegt als eigene, ebenfalls nur manuell gepflegte Datei
          # daneben. Wuerde dieser Schritt sie wie jede andere Datei
          # ueberschreiben oder loeschen, verschwaende der Schutz beim
          # naechsten Deploy lautlos -- genau das soll dieser Ausschluss
          # verhindern. Fuer Production bleibt STAGING_EXCLUDE leer, dort
          # laeuft der Upload unveraendert wie bisher.
          exclude: ${{ env.STAGING_EXCLUDE }}

      # ENT-384: Beweist, dass der Hostpoint-Passwortschutz auf Staging
      # tatsaechlich aktiv ist -- eine reine Konfigurationspruefung waere nur
      # eine Behauptung, dieser Schritt fragt die echte, gerade deployte Seite
      # ab. Verlangt wird nicht nur HTTP 401, sondern zusaetzlich ein
      # "WWW-Authenticate: Basic"-Kopf -- ein 401 aus einem anderen Grund
      # (z. B. ein eigener, produktiver Auth-Mechanismus) waere kein Nachweis
      # fuer DIESEN Schutz. Netzwerkfehler und Timeouts zaehlen ausdruecklich
      # als Fehlschlag, nicht als "nicht pruefbar, also ok".
      # ══════════ DIE HOMEPAGE AUF IHRER EIGENEN DOMAIN ══════════════════
      #
      # guardops.ch liegt bei Hostpoint unter /home/itufeden/www/guardops.ch
      # -- NEBEN /home/itufeden/www/rapport, nicht darin. Der aufraeumende
      # Upload oben kommt dort also nicht hin, und dieser hier nicht ans
      # Rapport-Tool. Beide FTP-Zugaenge sind von Hostpoint auf ihr eigenes
      # Verzeichnis beschraenkt; eigene Secret-NAMEN aus demselben Grund wie
      # bei Staging (ENT-343 Punkt 1).
      #
      # NUR PRODUCTION: Ein Staging-Lauf hat auf der echten Verkaufsdomain
      # nichts verloren -- der Staging-Zweig oben setzt EFF_GUARDOPS_FTP_HOST
      # deshalb ausdruecklich leer, ohne Rueckfall.
      #
      # UEBERSPRINGT SICH, SOLANGE DIE SECRETS FEHLEN -- und sagt das dann
      # auch (Schritt darunter). Der Deploy des Rapport-Tools darf nicht rot
      # werden, nur weil die Homepage-Domain noch nicht eingerichtet ist;
      # lautlos ausfallen darf er aber ebenso wenig.
      - name: Homepage-Buendel fuer guardops.ch bauen
        if: ${{ env.UMGEBUNG == 'production' && env.EFF_GUARDOPS_FTP_HOST != '' }}
        run: |
          set -euo pipefail
          mkdir -p dist-guardops/api dist-guardops/icons dist-guardops/fonts

          # Auf der eigenen Domain gehoert die Homepage auf "/", nicht auf
          # "/homepage.html" -- darum hier index.html.
          cp homepage.html dist-guardops/index.html

          # Schriften: dieselben vier, die homepage.html per CSS-url() holt.
          # Fehlt eine, faellt sie live lautlos auf den System-Stapel zurueck
          # und lokal faellt es NICHT auf -- derselbe Fallstrick wie beim
          # Rapport-Tool. test_deploy.mjs gleicht diese Liste gegen die
          # tatsaechlich in homepage.html benutzten Dateien ab.
          # Die Lizenzen muessen die Schriften begleiten (SIL OFL 1.1).
          cp fonts/archivo-variable-latin.woff2   dist-guardops/fonts/
          cp fonts/plex-sans-variable-latin.woff2 dist-guardops/fonts/
          cp fonts/plex-mono-400-latin.woff2      dist-guardops/fonts/
          cp fonts/plex-mono-500-latin.woff2      dist-guardops/fonts/
          cp fonts/archivo-OFL.txt                dist-guardops/fonts/
          cp fonts/ibm-plex-LICENSE.txt           dist-guardops/fonts/
          cp icons/guardops-*.png                 dist-guardops/icons/

          # Der Endpunkt und seine vier Einbindungen. KEIN anmeldung.php und
          # kein Produktcode -- die Seite hat mit dem Rapport-Tool nichts zu
          # tun ausser diesem einen Formular.
          cp backend/api/demo_senden.php dist-guardops/api/demo_senden.php
          cp backend/db.php              dist-guardops/db.php
          cp backend/mailer.php          dist-guardops/mailer.php
          cp backend/demo_anfrage.php    dist-guardops/demo_anfrage.php
          cp backend/demo_bremse.php     dist-guardops/demo_bremse.php
          # Rechtsseiten (OP-564). Beide teilen sich recht.css -- zweimal
          # derselbe Stil inline hiesse, dass beim naechsten Farbwechsel
          # eine von beiden vergessen wird. test_deploy.mjs leitet aus den
          # Seiten ab, welche Stilblaetter und Schriften mitmuessen.
          cp impressum.html              dist-guardops/impressum.html
          cp datenschutz.html            dist-guardops/datenschutz.html
          # Eigene Erklaerung fuer den Demobereich (demo.guardops.ch). Sie
          # liegt hier und nicht im Demo-Buendel: Alle Rechtsseiten sollen
          # an EINER Adresse stehen, mit einem Stil und einem Deploy-Weg.
          # Der Demobereich verweist absolut darauf (dashboard.html).
          cp datenschutz-demo.html       dist-guardops/datenschutz-demo.html
          cp recht.css                   dist-guardops/recht.css
          cp htaccess-guardops           dist-guardops/.htaccess
          cp robots-guardops.txt         dist-guardops/robots.txt

          # HIER STEHEN ABSICHTLICH KEINE DATENBANK-ZUGANGSDATEN. db.php wird
          # frisch aus backend/ kopiert und bekommt NUR APP_ENV -- die
          # __DB_*__-Platzhalter bleiben stehen. db() ist traege und wird von
          # diesem Endpunkt nie aufgerufen; wuerde es je jemand tun, scheitert
          # es laut an einem unbrauchbaren DSN, statt sich still zu verbinden.
          # Die Zugangsdaten der produktiven Datenbank liegen damit an genau
          # einer Stelle statt an zweien.
          sed -i "s|__APP_ENV__|$UMGEBUNG|g" dist-guardops/db.php

          # EIGENES POSTFACH, NICHT DAS GETEILTE PRODUKTIONS-POSTFACH
          # (ENT-569/OP-569, sop-projekt). Bis hierher bekam mailer.php in
          # diesem Buendel dieselben EFF_SMTP_*-Werte wie das Rapport-Tool --
          # dasselbe Postfach, das CUPI 24s eigene Kunden-Mails verschickt
          # (ENT-371). Die Demo-Anfrage-Mail geht aber an den Betreiber
          # selbst und soll erkennbar UND beantwortbar als GuardOpS laufen.
          # Host/Port/Verschluesselung/Benutzer/Passwort kommen darum aus
          # EFF_GUARDOPS_SMTP_* (eigene Secret-Namen, kein stiller Rueckfall,
          # ENT-343 Punkt 1); sind sie leer (Secrets noch nicht angelegt),
          # bleibt __SMTP_HOST__ als Platzhalter stehen, smtp_konfiguriert()
          # erkennt das und das Formular sagt "noch nicht eingerichtet"
          # (503) -- kein Versand ueber die falsche Kennung.
          #
          # Absenderadresse und -name sind HIER bewusst feste Literale statt
          # eines Secrets: info@guardops.ch und "GuardOpS" sind die oeffent-
          # lich beworbene Adresse und Marke, keine Zugangsdaten (gleiche
          # Einordnung wie bei APP_BASIS_URL, ENT-501). Gelten unabhaengig
          # davon, ob die GUARDOPS_SMTP_*-Secrets schon gesetzt sind -- das
          # allein sendet noch keine Mail, siehe smtp_konfiguriert() oben.
          sed -i "s|__SMTP_HOST__|$EFF_GUARDOPS_SMTP_HOST|g"               dist-guardops/mailer.php
          sed -i "s|__SMTP_PORT__|$EFF_GUARDOPS_SMTP_PORT|g"               dist-guardops/mailer.php
          sed -i "s|__SMTP_VERSCHLUESSELUNG__|$EFF_GUARDOPS_SMTP_VERSCHLUESSELUNG|g" dist-guardops/mailer.php
          sed -i "s|__SMTP_USER__|$EFF_GUARDOPS_SMTP_USER|g"               dist-guardops/mailer.php
          sed -i "s|__SMTP_PASSWORD__|$EFF_GUARDOPS_SMTP_PASSWORD|g"       dist-guardops/mailer.php
          sed -i "s|__SMTP_ABSENDER__|info@guardops.ch|g"                 dist-guardops/mailer.php
          sed -i "s|__SMTP_ABSENDER_NAME__|GuardOpS|g"                    dist-guardops/mailer.php
          sed -i "s|__STAGING_TESTMAIL__||g"                              dist-guardops/mailer.php
          # Dieselbe Ueberlegung wie bei __STAGING_TESTMAIL__ direkt darueber:
          # guardops.ch laeuft ausschliesslich als Production (siehe Pruefung
          # weiter unten), smtp_ziel() fragt die Demo-Testadresse also nie ab
          # -- der Platzhalter bleibt sonst woertlich stehen, weil dieser
          # Bauschritt aelter ist als __DEMO_TESTMAIL__ in mailer.php
          # (ENT-523, erst mit diesem Merge zusammengefuehrt).
          sed -i "s|__DEMO_TESTMAIL__||g"                                 dist-guardops/mailer.php
          sed -i "s|__DEMO_EMPFAENGER__|$EFF_DEMO_EMPFAENGER|g"           dist-guardops/demo_anfrage.php

          # Kein uebersehener Platzhalter darf hochgeladen werden. Erlaubt
          # bleiben genau die zwei Familien, die HIER absichtlich stehen:
          # __DB_*__ (siehe oben) und __APP_BASIS_URL__ -- basis_url_pruefen()
          # erkennt den stehengebliebenen Platzhalter und liefert null, die
          # Demo-Mail enthaelt ohnehin keinen Link auf die eigene Anlage.
          UEBRIG=$(grep -rhos '__[A-Z_]\{3,\}__' dist-guardops/ \
                   | grep -v -e '^__DB_' -e '^__APP_BASIS_URL__$' -e '^__DIR__$' \
                   | sort -u || true)
          if [ -n "$UEBRIG" ]; then
            echo "::error::Nicht ersetzte Platzhalter im guardops-Buendel: $UEBRIG"
            exit 1
          fi

          echo "Buendel fuer guardops.ch:"
          find dist-guardops -type f | sort

      - name: Homepage nach guardops.ch hochladen (FTPS)
        if: ${{ env.UMGEBUNG == 'production' && env.EFF_GUARDOPS_FTP_HOST != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.EFF_GUARDOPS_FTP_HOST }}
          username: ${{ env.EFF_GUARDOPS_FTP_USER }}
          password: ${{ env.EFF_GUARDOPS_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist-guardops/
          # Der Zugang ist von Hostpoint auf /home/itufeden/www/guardops.ch
          # beschraenkt -- daher "/", nicht der volle Pfad. Genau wie beim
          # Upload des Rapport-Tools weiter oben.
          server-dir: /

      # "NICHT EINGERICHTET" DARF NICHT WIE "NICHTS ZU TUN" AUSSEHEN: Ohne
      # diesen Schritt waere ein Deploy ohne GUARDOPS_FTP_*-Secrets von einem
      # erfolgreichen Homepage-Deploy im Protokoll nicht zu unterscheiden.
      - name: Hinweis, wenn guardops.ch noch nicht eingerichtet ist
        if: ${{ env.UMGEBUNG == 'production' && env.EFF_GUARDOPS_FTP_HOST == '' }}
        run: |
          echo "::notice::guardops.ch wurde NICHT beliefert -- die Secrets GUARDOPS_FTP_HOST/USER/PASSWORD fehlen im Environment production. Das Rapport-Tool ist davon nicht betroffen und wurde regulaer ausgeliefert."

      # ══════════ DER BETREIBER-BEREICH AUF SEINER EIGENEN ADRESSE ═══════
      #
      # ENT-580: Erste Etappe des schrittweisen Umzugs weg von
      # itufeden.myhostpoint.ch. betreiber.guardops.ch liegt bei Hostpoint
      # unter /home/itufeden/betreiber.guardops.ch -- NEBEN
      # /home/itufeden/www/rapport, nicht darin. Eigener FTP-Zugang, auf
      # genau dieses Verzeichnis beschraenkt, eigene Secret-NAMEN aus
      # demselben Grund wie bei Staging (ENT-343 Punkt 1).
      #
      # ANDERS ALS DAS GUARDOPS-BUENDEL TRAEGT DIESES HIER ECHTE
      # DATENBANK-ZUGANGSDATEN: betreiber.php und seine API-Endpunkte
      # brauchen Zugriff auf dieselbe Datenbank wie das Rapport-Tool, weil
      # betreiber_db() aktuell auf db() zurueckfaellt (ENT-519). Die
      # Produktions-Zugangsdaten liegen damit an zwei Orten auf dem Server
      # -- bewusst in Kauf genommen (ENT-580), geschuetzt durch
      # htaccess-betreiber mit derselben Sperrliste wie htaccess-hostpoint,
      # nur auf die tatsaechlich mitgelieferten Dateien verengt.
      #
      # NUR PRODUCTION: Ein Staging- oder Demo-Lauf hat auf dieser Adresse
      # nichts verloren -- die Zweige oben setzen EFF_BETREIBER_FTP_HOST
      # deshalb ausdruecklich leer, ohne Rueckfall.
      #
      # UEBERSPRINGT SICH, SOLANGE DIE SECRETS FEHLEN -- und sagt das dann
      # auch (Schritt darunter), genau wie beim guardops-Buendel oben.
      - name: Betreiber-Buendel fuer betreiber.guardops.ch bauen
        if: ${{ env.UMGEBUNG == 'production' && env.EFF_BETREIBER_FTP_HOST != '' }}
        run: |
          set -euo pipefail
          mkdir -p dist-betreiber/api dist-betreiber/fonts dist-betreiber/icons

          # Auf der eigenen Adresse gehoert der Betreiber-Bereich auf "/",
          # nicht auf "/betreiber.html".
          cp betreiber.html dist-betreiber/index.html

          # Einzige lokale Schriftdatei, die betreiber.html per CSS-url()
          # holt (siehe @font-face in betreiber.html). Fehlt sie, faellt
          # die Schrift live lautlos auf den System-Stapel zurueck, lokal
          # faellt es NICHT auf -- derselbe Fallstrick wie beim Rapport-Tool
          # und beim guardops-Buendel. Lizenz muss die Schrift begleiten
          # (SIL OFL 1.1).
          cp fonts/inter-latin.woff2   dist-betreiber/fonts/
          cp fonts/inter-LICENSE.txt   dist-betreiber/fonts/

          # Favicon und Haus-Symbol (siehe <link rel="icon"> in
          # betreiber.html). NUR die guardops-Dateien: Der Betreiber-Bereich
          # gehoert der Betreiberin, nicht einer Mandantin (ENT-568) -- ein
          # "cp icons/*.png" wuerde das CUPI-24-Siegel auf eine Adresse
          # hochladen, die es nie zeigen darf. Fehlen die Dateien, zeigt der
          # Browser einen Buchstaben-Platzhalter statt der Marke, und lokal
          # faellt es NICHT auf -- derselbe Fallstrick wie bei der Schrift
          # direkt darueber.
          cp icons/guardops-16.png    dist-betreiber/icons/
          cp icons/guardops-32.png    dist-betreiber/icons/
          cp icons/guardops-180.png   dist-betreiber/icons/

          # Genau die Backend-Dateien, die betreiber.php und seine
          # API-Endpunkte tatsaechlich per require_once einbinden (siehe
          # Kopf von backend/betreiber.php) -- keine der anderen rund 30
          # Backend-Dateien des Rapport-Tools, die der Betreiber-Bereich
          # nicht braucht (planung.php, kunden.php, mitarbeiter.php, lohn.php
          # usw.). htaccess-betreiber sperrt genau diese Liste.
          cp backend/db.php            dist-betreiber/db.php
          cp backend/anmeldung.php     dist-betreiber/anmeldung.php
          cp backend/zweifaktor.php    dist-betreiber/zweifaktor.php
          cp backend/rechte.php        dist-betreiber/rechte.php
          cp backend/support.php       dist-betreiber/support.php
          cp backend/supportvorgang.php dist-betreiber/supportvorgang.php
          cp backend/betreiber.php     dist-betreiber/betreiber.php
          # Rechenkern der Demo-Zugaenge (ENT-600). betreiber.php bindet ihn
          # per require_once ein -- fehlt er, stirbt der ganze
          # Betreiber-Bereich beim ersten Aufruf, nicht erst bei der
          # Demo-Freigabe.
          cp backend/demo_zugang.php   dist-betreiber/demo_zugang.php
          # Der Griff in eine Demo-Instanz (ENT-600) und was er braucht.
          # demo_instanz.php bindet demo_reset.php ein, demo_reset.php
          # erwartet system_rollen() aus rechte.php (oben schon dabei), und
          # demo_daten.php befuellt die frisch geleerte Instanz.
          cp backend/demo_instanz.php  dist-betreiber/demo_instanz.php
          cp backend/demo_reset.php    dist-betreiber/demo_reset.php
          cp backend/demo_daten.php    dist-betreiber/demo_daten.php
          # demo_daten.php befuellt den Musterbetrieb ueber genau dieselben
          # Rechenkerne wie ein echter Betrieb (Kopf von demo_daten.php:
          # "NIE erfunden, sondern ausschliesslich ueber die bestehenden,
          # geprueften Funktionen"). Das zieht einen Teil der rund 30
          # Rapport-Tool-Dateien in dieses eigentlich schlanke Buendel
          # zurueck, die der Kommentar oben bewusst ausschliessen wollte --
          # ENT-601 kam spaeter dazu und hat diese Kette nicht geerbt.
          # BESTANDSFEHLER (gefunden am 2026-09-18 live auf
          # betreiber.guardops.ch): ohne diese sechs Dateien stirbt jede
          # Demo-Anforderung an einem fehlenden require_once, sichtbar nur
          # als "Unerwarteter Serverfehler" ohne weiteren Hinweis.
          cp backend/mitarbeiter.php   dist-betreiber/mitarbeiter.php
          cp backend/planung.php       dist-betreiber/planung.php
          cp backend/gavzeit.php       dist-betreiber/gavzeit.php
          cp backend/lohnlauf.php      dist-betreiber/lohnlauf.php
          cp backend/logbuch.php       dist-betreiber/logbuch.php
          cp backend/lohn.php          dist-betreiber/lohn.php
          # Rechenkern der zentralen Mandanten-Einrichtung (ENT-612):
          # api/betreiber_schema_pruefen.php richtet ueber
          # planung_einrichten_kern.php jede Mandanten-Datenbank ein, zu der
          # der Betreiber Zugangsdaten hat -- derselbe Rechenkern wie bei
          # api/planung_einrichten.php (eigene Einrichtung eines Mandanten),
          # "eine Definition, nicht zwei". Bindet seinerseits rundgang.php
          # und fahrzeug.php ein (kunden.php/produkte.php stehen schon
          # weiter unten im Buendel).
          cp backend/planung_einrichten_kern.php dist-betreiber/planung_einrichten_kern.php
          cp backend/rundgang.php      dist-betreiber/rundgang.php
          cp backend/fahrzeug.php      dist-betreiber/fahrzeug.php
          # Bremse gegen zu viele Anfragen (ENT-601), von
          # api/demo_anfordern.php und api/demo_erneut_senden.php benutzt --
          # dieselbe Datei wie beim Kontaktformular der Homepage, eigenes
          # Verzeichnis zur Laufzeit.
          cp backend/demo_bremse.php   dist-betreiber/demo_bremse.php
          # Der Versand der Zugangsdaten an den Interessenten (ENT-600).
          # mailer.php traegt das SMTP-Passwort -- die Platzhalter werden
          # weiter unten ersetzt, wie in den anderen Buendeln.
          cp backend/mailer.php        dist-betreiber/mailer.php
          # Offerten der Betreiberin (ENT-605). Drei geteilte Rechenkerne,
          # die seit ENT-605 einen Tabellenpraefix nehmen und darum von
          # beiden Ebenen benutzt werden: die Summen eines Belegs, die
          # Adresslogik und die Leistungsnummern. Sie liegen NICHT doppelt
          # im Haus -- eine zweite Kopie der Geldrechnung waere die Stelle,
          # an der die beiden Seiten auseinanderlaufen.
          cp backend/belege.php        dist-betreiber/belege.php
          cp backend/kunden.php        dist-betreiber/kunden.php
          cp backend/produkte.php      dist-betreiber/produkte.php
          # html2pdf erzeugt die PDF-Fassung einer Offerte -- im
          # Betreiber-Bereich selbst (Herunterladen/Teilen) und auf der
          # oeffentlichen Seite, die der Empfaenger am Link sieht. Beide
          # laden sie erst BEIM KLICK nach; fehlt die Datei, bleibt der
          # Knopf ohne Wirkung, und lokal faellt das NICHT auf.
          cp html2pdf.bundle.min.js    dist-betreiber/html2pdf.bundle.min.js
          # qrcode.js zeichnet den QR-Code der Zwei-Faktor-Einrichtung
          # (betreiber.html, qrLaden()). BESTANDSFEHLER, gefunden durch die
          # neue Pruefung in test_offerten_betreiber.mjs ("jede Datei, die
          # betreiber.html nachlaedt, liegt im Buendel"): Die Datei fehlte
          # hier seit ENT-580. Live blieb der QR-Code darum leer und die
          # Seite zeigte ihren Ersatztext -- der abtippbare Schluessel
          # daneben trug weiter, die Einrichtung war also nie blockiert,
          # aber unnoetig umstaendlich. Lokal faellt es nicht auf, weil dort
          # die Datei neben der Seite liegt.
          cp qrcode.js                 dist-betreiber/qrcode.js
          cp backend/api/betreiber_*.php dist-betreiber/api/
          # Die oeffentliche Selbstbedienung (ENT-601): kein betreiber_-
          # Praefix, weil sie ausdruecklich OHNE Anmeldung laeuft -- der
          # Wildcard zwei Zeilen darueber faengt sie darum nicht ein.
          cp backend/api/demo_anfordern.php     dist-betreiber/api/demo_anfordern.php
          cp backend/api/demo_erneut_senden.php dist-betreiber/api/demo_erneut_senden.php
          cp htaccess-betreiber        dist-betreiber/.htaccess
          cp robots-betreiber.txt      dist-betreiber/robots.txt

          # ECHTE Produktions-Datenbank -- dieselben Werte wie das
          # Rapport-Tool oben (EFF_DB_*), nicht die leeren Platzhalter wie
          # beim guardops-Buendel. Siehe Kopf dieses Abschnitts.
          sed -i "s|__DB_HOST__|$EFF_DB_HOST|g" dist-betreiber/db.php
          sed -i "s|__DB_NAME__|$EFF_DB_NAME|g" dist-betreiber/db.php
          sed -i "s|__DB_USER__|$EFF_DB_USER|g" dist-betreiber/db.php
          sed -i "s|__DB_PASS__|$EFF_DB_PASSWORD|g" dist-betreiber/db.php
          # Platzhalter der separaten Betreiber-Datenbank (OP-518). Bleiben
          # die vier Secrets ungesetzt, ist $EFF_BETREIBER_DB_* leer und
          # betreiber_db() faellt bewusst auf db() zurueck -- derselbe
          # heutige Normalfall wie im Hauptschritt (dist/) oben, hier nur
          # zusaetzlich mit den bereits echten dist-betreiber/db.php-Werten
          # daneben.
          sed -i "s|__BETREIBER_DB_HOST__|$EFF_BETREIBER_DB_HOST|g" dist-betreiber/betreiber.php
          sed -i "s|__BETREIBER_DB_NAME__|$EFF_BETREIBER_DB_NAME|g" dist-betreiber/betreiber.php
          sed -i "s|__BETREIBER_DB_USER__|$EFF_BETREIBER_DB_USER|g" dist-betreiber/betreiber.php
          sed -i "s|__BETREIBER_DB_PASS__|$EFF_BETREIBER_DB_PASSWORD|g" dist-betreiber/betreiber.php
          sed -i "s|__APP_ENV__|$UMGEBUNG|g" dist-betreiber/db.php

          # Eigene Adresse (ENT-501, ENT-580) -- FESTES LITERAL, kein Secret
          # und keine Environment-Variable: betreiber.guardops.ch ist die
          # entschiedene, oeffentlich sichtbare Adresse dieser Etappe, keine
          # Zugangsdaten (gleiche Einordnung wie bei EFF_APP_BASIS_URL des
          # Rapport-Tools und bei den GuardOpS-Literalen im guardops-Buendel).
          sed -i "s|__APP_BASIS_URL__|https://betreiber.guardops.ch|g" dist-betreiber/db.php

          # SMTP fuer die Zugangsdaten-Mail an Demo-Interessenten (ENT-600).
          # Dasselbe Postfach wie das Kundenportal, aus demselben Grund wie
          # dort: Es ist Kundenkommunikation der Plattform, keine eigene
          # Anfrage-Mailbox wie beim guardops-Buendel (ENT-371).
          # Die beiden Testmail-Platzhalter werden geleert -- der
          # Betreiber-Bereich laeuft nur auf Produktion, eine Umleitung auf
          # eine Testadresse gaebe es dort nie.
          sed -i "s|__SMTP_HOST__|$EFF_SMTP_HOST|g" dist-betreiber/mailer.php
          sed -i "s|__SMTP_PORT__|$EFF_SMTP_PORT|g" dist-betreiber/mailer.php
          sed -i "s|__SMTP_VERSCHLUESSELUNG__|$EFF_SMTP_VERSCHLUESSELUNG|g" dist-betreiber/mailer.php
          sed -i "s|__SMTP_USER__|$EFF_SMTP_USER|g" dist-betreiber/mailer.php
          sed -i "s|__SMTP_PASSWORD__|$EFF_SMTP_PASSWORD|g" dist-betreiber/mailer.php
          sed -i "s|__SMTP_ABSENDER__|$EFF_SMTP_ABSENDER|g" dist-betreiber/mailer.php
          sed -i "s|__SMTP_ABSENDER_NAME__|$EFF_SMTP_ABSENDER_NAME|g" dist-betreiber/mailer.php
          sed -i "s|__STAGING_TESTMAIL__||g" dist-betreiber/mailer.php
          sed -i "s|__DEMO_TESTMAIL__||g" dist-betreiber/mailer.php
          # Der Zeitgeber-Schluessel fuer den Ablauf der Demo-Zugaenge
          # (api/betreiber_demo_ablauf.php). Derselbe Wert wie beim
          # naechtlichen Demo-Reset -- es ist derselbe Cron-Dienst.
          sed -i "s|__DEMO_ABLAUF_TOKEN__|$EFF_DEMO_ABLAUF_TOKEN|g" dist-betreiber/api/betreiber_demo_ablauf.php
          # Die Deploy-Geheimnisse der einzelnen Mandanten-Datenbanken
          # (OP-526, mandant_secret() in backend/betreiber.php) -- als
          # base64(JSON), nicht als rohes JSON, siehe Begruendung bei
          # P_MANDANT_SECRETS oben: "&" und "|" in einem Passwort zerschlagen
          # sonst diesen sed-Aufruf, unbemerkt. Notfalls mit einer leeren
          # Zeichenkette ersetzt, solange das Secret noch nicht gesetzt ist
          # -- mandant_secret() behandelt das dann als "kein Mandant hat ein
          # Secret", nicht als Fehler.
          sed -i "s|__MANDANT_SECRETS__|$EFF_MANDANT_SECRETS|g" dist-betreiber/betreiber.php

          # Kein uebersehener Platzhalter darf hochgeladen werden. Anders als
          # beim guardops-Buendel braucht dieses hier eine echte
          # Datenbankverbindung (__DB_*__ wird oben ersetzt). Seit OP-518
          # werden auch die eigenen Platzhalter der separaten Betreiber-
          # Datenbank (__BETREIBER_DB_*__) hier oben IMMER ersetzt, und seit
          # OP-526 genauso __MANDANT_SECRETS__ zwei Zeilen darueber --
          # notfalls mit einer leeren Zeichenkette, wenn die Secrets noch
          # nicht gesetzt sind; die betroffenen Funktionen fallen dann
          # bewusst auf ihren jeweiligen Normalfall zurueck, siehe Kommentare
          # dort. Ein stehen gebliebener Platzhalter ist ab jetzt also in
          # jedem Fall ein echter Fehler (z. B. eine vergessene sed-Zeile),
          # keine bewusste Ausnahme mehr -- die Liste unten traegt darum nur
          # noch PHPs eigene Konstante __DIR__.
          UEBRIG=$(grep -rhos '__[A-Z_]\{3,\}__' dist-betreiber/ \
                   | grep -v -e '^__DIR__$' \
                   | sort -u || true)
          if [ -n "$UEBRIG" ]; then
            echo "::error::Nicht ersetzte Platzhalter im betreiber-Buendel: $UEBRIG"
            exit 1
          fi

          echo "Buendel fuer betreiber.guardops.ch:"
          find dist-betreiber -type f | sort

      - name: Betreiber-Bereich nach betreiber.guardops.ch hochladen (FTPS)
        if: ${{ env.UMGEBUNG == 'production' && env.EFF_BETREIBER_FTP_HOST != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.EFF_BETREIBER_FTP_HOST }}
          username: ${{ env.EFF_BETREIBER_FTP_USER }}
          password: ${{ env.EFF_BETREIBER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist-betreiber/
          # Der Zugang ist von Hostpoint auf
          # /home/itufeden/betreiber.guardops.ch beschraenkt -- daher "/",
          # nicht der volle Pfad. Genau wie bei den beiden Uploads oben.
          server-dir: /

      # "NICHT EINGERICHTET" DARF NICHT WIE "NICHTS ZU TUN" AUSSEHEN, genau
      # wie beim guardops-Buendel oben.
      - name: Hinweis, wenn betreiber.guardops.ch noch nicht eingerichtet ist
        if: ${{ env.UMGEBUNG == 'production' && env.EFF_BETREIBER_FTP_HOST == '' }}
        run: |
          echo "::notice::betreiber.guardops.ch wurde NICHT beliefert -- die Secrets BETREIBER_FTP_HOST/USER/PASSWORD fehlen im Environment production. Das Rapport-Tool ist davon nicht betroffen und wurde regulaer ausgeliefert."

      # ZWEITE ETAPPE (ENT-580): das Kundenportal auf seine eigene Adresse
      # portal.guardops.ch, nach demselben Muster wie der Betreiber-Bereich
      # oben. Anders als dort braucht dieses Buendel zusaetzlich mailer.php
      # (das Portal verschickt Zugangslinks/Passwort-Mails, ENT-441/ENT-448)
      # und den Maps-Schluessel in portal.html (Kartenausschnitt der
      # Rundgaenge) -- beide mit denselben Produktions-Werten wie das
      # Rapport-Tool, keine eigenen Postfach-/Schluessel-Werte wie beim
      # guardops-Buendel: Das Kundenportal ist Kernbestandteil desselben
      # Tools und verschickt seine Mails schon heute ueber dieses Postfach.
      #
      # NUR PRODUCTION, UEBERSPRINGT SICH OHNE SECRETS -- dieselbe
      # Begruendung wie beim Betreiber-Buendel oben.
      - name: Portal-Buendel fuer portal.guardops.ch bauen
        if: ${{ env.UMGEBUNG == 'production' && env.EFF_PORTAL_FTP_HOST != '' }}
        run: |
          set -euo pipefail
          mkdir -p dist-portal/api dist-portal/img dist-portal/icons

          # Auf der eigenen Adresse gehoert das Kundenportal auf "/", nicht
          # auf "/portal.html".
          cp portal.html dist-portal/index.html

          # Hintergrundfoto/-video der Anmeldemaske (siehe url()/<source> in
          # portal.html) -- derselbe Fallstrick wie beim Rapport-Tool: fehlt
          # eine der drei Dateien, faellt der Hintergrund live lautlos auf
          # die reine Verlaufsflaeche zurueck bzw. spielt fuer die Browser,
          # die genau dieses Format brauchen, gar nichts ab; lokal faellt es
          # NICHT auf. Keine eigenen Schriftdateien noetig -- portal.html
          # nutzt den System-Schriftstapel, kein @font-face.
          cp img/anmeldung-nacht.webp dist-portal/img/anmeldung-nacht.webp
          cp img/anmeldung-nacht.webm dist-portal/img/anmeldung-nacht.webm
          cp img/anmeldung-nacht.mp4  dist-portal/img/anmeldung-nacht.mp4

          # Favicon UND das Logo im Kopf der Seite (<img src="icons/
          # guardops-192.png"> in portal.html, zweimal). Die 192er fehlte
          # diesem Buendel bisher ganz: Auf portal.guardops.ch blieb das
          # Logo im Anmeldekopf leer, waehrend es auf der geteilten Adresse
          # (dist/, wo icons/*.png mitkommt) richtig stand -- darum ist es
          # lange nicht aufgefallen. NUR die guardops-Dateien, gleiche
          # Begruendung wie beim Betreiber-Buendel (ENT-568).
          cp icons/guardops-16.png    dist-portal/icons/
          cp icons/guardops-32.png    dist-portal/icons/
          cp icons/guardops-180.png   dist-portal/icons/
          cp icons/guardops-192.png   dist-portal/icons/

          # Genau die Backend-Dateien, die kundenportal.php und seine
          # portal_*-API-Endpunkte tatsaechlich per require/require_once
          # einbinden -- keine der anderen rund 30 Backend-Dateien des
          # Rapport-Tools, die das Kundenportal nicht braucht (rechte.php,
          # zweifaktor.php, planung.php, lohn.php usw.). htaccess-portal
          # sperrt genau diese Liste.
          cp backend/db.php            dist-portal/db.php
          cp backend/kundenportal.php  dist-portal/kundenportal.php
          cp backend/anmeldung.php     dist-portal/anmeldung.php
          cp backend/rundgang.php      dist-portal/rundgang.php
          cp backend/mailer.php        dist-portal/mailer.php
          cp backend/api/portal_*.php  dist-portal/api/
          cp htaccess-portal           dist-portal/.htaccess
          cp robots-portal.txt         dist-portal/robots.txt

          # ECHTE Produktions-Datenbank -- dieselben Werte wie das
          # Rapport-Tool oben (EFF_DB_*). Das Kundenportal ist Kernbestandteil
          # desselben Tools, keine Ausnahme wie beim Betreiber-Bereich/OP-518.
          sed -i "s|__DB_HOST__|$EFF_DB_HOST|g" dist-portal/db.php
          sed -i "s|__DB_NAME__|$EFF_DB_NAME|g" dist-portal/db.php
          sed -i "s|__DB_USER__|$EFF_DB_USER|g" dist-portal/db.php
          sed -i "s|__DB_PASS__|$EFF_DB_PASSWORD|g" dist-portal/db.php
          sed -i "s|__APP_ENV__|$UMGEBUNG|g" dist-portal/db.php

          # Eigene Adresse (ENT-501, ENT-580) -- FESTES LITERAL, kein Secret
          # und keine Environment-Variable: portal.guardops.ch ist die
          # entschiedene, oeffentlich sichtbare Adresse dieser Etappe.
          sed -i "s|__APP_BASIS_URL__|https://portal.guardops.ch|g" dist-portal/db.php

          # ECHTE Produktions-SMTP-Werte -- dasselbe Postfach, ueber das das
          # Kundenportal Zugangslink- und Passwort-Mails schon heute
          # verschickt (portal_link_anfordern.php, portal_neues_passwort.php).
          # Kein eigenes Postfach wie beim guardops-Buendel: dort ging es um
          # eine neue, von CUPI 24s Kundenmails getrennte Anfrage-Mailbox
          # (ENT-371) -- hier ist es dieselbe Kundenkommunikation wie bisher,
          # nur auf der neuen Adresse.
          sed -i "s|__SMTP_HOST__|$EFF_SMTP_HOST|g" dist-portal/mailer.php
          sed -i "s|__SMTP_PORT__|$EFF_SMTP_PORT|g" dist-portal/mailer.php
          sed -i "s|__SMTP_VERSCHLUESSELUNG__|$EFF_SMTP_VERSCHLUESSELUNG|g" dist-portal/mailer.php
          sed -i "s|__SMTP_USER__|$EFF_SMTP_USER|g" dist-portal/mailer.php
          sed -i "s|__SMTP_PASSWORD__|$EFF_SMTP_PASSWORD|g" dist-portal/mailer.php
          sed -i "s|__SMTP_ABSENDER__|$EFF_SMTP_ABSENDER|g" dist-portal/mailer.php
          sed -i "s|__SMTP_ABSENDER_NAME__|$EFF_SMTP_ABSENDER_NAME|g" dist-portal/mailer.php
          sed -i "s|__STAGING_TESTMAIL__||g" dist-portal/mailer.php
          sed -i "s|__DEMO_TESTMAIL__||g" dist-portal/mailer.php

          # Kartenausschnitt der Rundgaenge (portal_rundgang_detail.php/
          # portal_rundgang_weg.php liefern die Route, portal.html zeichnet
          # sie via Google Maps JS).
          sed -i "s|__MAPS_JS_KEY__|$EFF_MAPS_JS_KEY|g" dist-portal/index.html

          # Kein uebersehener Platzhalter darf hochgeladen werden. Anders als
          # beim Betreiber-Buendel gibt es hier keine bewusst offenen
          # Platzhalter -- das Kundenportal hat keine eigene, noch nicht
          # gebaute Nebendatenbank wie betreiber_db()/OP-518.
          UEBRIG=$(grep -rhos '__[A-Z_]\{3,\}__' dist-portal/ \
                   | grep -v -e '^__DIR__$' \
                   | sort -u || true)
          if [ -n "$UEBRIG" ]; then
            echo "::error::Nicht ersetzte Platzhalter im portal-Buendel: $UEBRIG"
            exit 1
          fi

          echo "Buendel fuer portal.guardops.ch:"
          find dist-portal -type f | sort

      - name: Kundenportal nach portal.guardops.ch hochladen (FTPS)
        if: ${{ env.UMGEBUNG == 'production' && env.EFF_PORTAL_FTP_HOST != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.EFF_PORTAL_FTP_HOST }}
          username: ${{ env.EFF_PORTAL_FTP_USER }}
          password: ${{ env.EFF_PORTAL_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist-portal/
          # Der Zugang ist von Hostpoint auf das Document-Root der Subdomain
          # beschraenkt (www/portal.guardops.ch) -- daher "/", nicht der
          # volle Pfad. Genau wie bei den Uploads oben. ACHTUNG (ENT-580,
          # Lehre aus dem Betreiber-Umzug): der FTP-Account MUSS auf den
          # tatsaechlichen Document-Root der Subdomain zeigen
          # (/home/itufeden/www/portal.guardops.ch), nicht auf einen
          # gleichnamigen Pfad ohne "www/" -- sonst laden die Dateien
          # unbemerkt an eine unbediente Stelle hoch (403 trotz
          # erfolgreichem Upload).
          server-dir: /

      # "NICHT EINGERICHTET" DARF NICHT WIE "NICHTS ZU TUN" AUSSEHEN, genau
      # wie beim betreiber-Buendel oben.
      - name: Hinweis, wenn portal.guardops.ch noch nicht eingerichtet ist
        if: ${{ env.UMGEBUNG == 'production' && env.EFF_PORTAL_FTP_HOST == '' }}
        run: |
          echo "::notice::portal.guardops.ch wurde NICHT beliefert -- die Secrets PORTAL_FTP_HOST/USER/PASSWORD fehlen im Environment production. Das Rapport-Tool ist davon nicht betroffen und wurde regulaer ausgeliefert."

      # ══════════ CUPI 24 AUF IHRER EIGENEN ADRESSE ══════════════════════
      #
      # ENT-589: CUPI 24 ist Mandantin (ENT-568), nicht Betreiberin -- und
      # liefert das Rapport-Tool kuenftig unter cupi24.guardops.ch statt
      # unter der geteilten Testadresse rapport.itufeden.myhostpoint.ch. Das
      # ist zugleich das WIEDERVERWENDBARE MUSTER fuer jeden weiteren
      # Mandanten: ein eigenes Verzeichnis, beim Deploy fest bestueckt mit
      # eigener EFF_APP_BASIS_URL, nicht eine Laufzeit-Entscheidung anhand
      # des angefragten Hostnamens (ENT-501 -- pruef_sicherheit.php Abschnitt
      # 7a schlaegt genau darauf an).
      #
      # ANDERS ALS DIE SCHLANKEN BUENDEL OBEN (dist-betreiber/, dist-portal/)
      # TRAEGT DIESES HIER DEN VOLLEN DATEIUMFANG: CUPI 24 nutzt das
      # komplette Rapport-Tool -- Cockpit, Waechter-App, Kundenportal,
      # Betreiber-Bereich eingeschlossen (ein Betreiber-Konto ist an keinen
      # Mandanten gebunden, siehe backend/betreiber.php) --, nicht nur einen
      # einzelnen Bereich. Die Kopierliste unten ist darum bewusst dieselbe
      # wie beim Hauptschritt "Platzhalter durch echte Werte ersetzen" oben,
      # nur nach dist-cupi24/ statt nach dist/. Wer dort eine Zeile
      # aendert, muss sie HIER nachziehen -- test_deploy.mjs vergleicht
      # beide Kopierlisten gegen den tatsaechlichen Quelltext, nicht nur
      # gegeneinander.
      #
      # ECHTE PRODUKTIONS-DATENBANK UND ECHTES PRODUKTIONS-POSTFACH: CUPI 24
      # ist der Bestandsmandant und braucht dieselbe Datenbank wie das
      # heutige Rapport-Tool (mandant_db() faellt fuer die "standard-
      # verbindung" auf db() zurueck, siehe backend/betreiber.php) -- keine
      # neue Datenbank, kein neues Secret.
      #
      # NUR PRODUCTION, UEBERSPRINGT SICH OHNE SECRETS -- dieselbe
      # Begruendung wie bei den Buendeln oben. Die alte Adresse
      # (rapport.itufeden.myhostpoint.ch, Schritt "Nach Hostpoint hoch-
      # laden") wird von diesem Schritt NICHT abgeschaltet -- beide laufen
      # vorerst parallel, das Abschalten ist eine spaetere, eigene
      # Entscheidung.
      - name: Rapport-Tool-Buendel fuer cupi24.guardops.ch bauen
        if: ${{ env.UMGEBUNG == 'production' && env.EFF_CUPI24_FTP_HOST != '' }}
        run: |
          set -euo pipefail
          mkdir -p dist-cupi24/api dist-cupi24/icons dist-cupi24/fonts dist-cupi24/img dist-cupi24/handbuch

          cp index.html dist-cupi24/index.html
          cp dashboard.html dist-cupi24/dashboard.html
          cp app.html dist-cupi24/app.html
          cp portal.html dist-cupi24/portal.html
          cp betreiber.html dist-cupi24/betreiber.html
          cp gav.js dist-cupi24/gav.js
          cp zeitwahl.js dist-cupi24/zeitwahl.js
          cp qrcode.js dist-cupi24/qrcode.js
          cp unterschrift.js dist-cupi24/unterschrift.js
          cp testumgebung.js dist-cupi24/testumgebung.js
          cp html2pdf.bundle.min.js dist-cupi24/html2pdf.bundle.min.js
          cp manifest.json dist-cupi24/manifest.json
          cp manifest-app.json dist-cupi24/manifest-app.json
          cp sw.js dist-cupi24/sw.js
          cp icons/*.png dist-cupi24/icons/
          cp fonts/*.woff2 dist-cupi24/fonts/
          cp fonts/inter-LICENSE.txt dist-cupi24/fonts/inter-LICENSE.txt
          cp fonts/archivo-OFL.txt dist-cupi24/fonts/archivo-OFL.txt
          cp fonts/ibm-plex-LICENSE.txt dist-cupi24/fonts/ibm-plex-LICENSE.txt
          cp img/anmeldung-nacht.webp dist-cupi24/img/anmeldung-nacht.webp
          cp img/anmeldung-nacht.webm dist-cupi24/img/anmeldung-nacht.webm
          cp img/anmeldung-nacht.mp4 dist-cupi24/img/anmeldung-nacht.mp4
          cp backend/db.php dist-cupi24/db.php
          cp backend/kundenportal.php dist-cupi24/kundenportal.php
          cp backend/betreiber.php dist-cupi24/betreiber.php
          # Siehe dist/: betreiber.php braucht diesen Rechenkern (ENT-600).
          cp backend/demo_zugang.php dist-cupi24/demo_zugang.php
          cp backend/support.php dist-cupi24/support.php
          cp backend/supportvorgang.php dist-cupi24/supportvorgang.php
          cp backend/demo_anfrage.php dist-cupi24/demo_anfrage.php
          cp backend/demo_daten.php dist-cupi24/demo_daten.php
          cp backend/demo_reset.php dist-cupi24/demo_reset.php
          cp backend/demo_bremse.php dist-cupi24/demo_bremse.php
          cp backend/ai.php dist-cupi24/ai.php
          cp backend/planung.php dist-cupi24/planung.php
          cp backend/kunden.php dist-cupi24/kunden.php
          cp backend/mitarbeiter.php dist-cupi24/mitarbeiter.php
          cp backend/layout.php dist-cupi24/layout.php
          cp backend/anmeldung.php dist-cupi24/anmeldung.php
          cp backend/zweifaktor.php dist-cupi24/zweifaktor.php
          cp backend/rechte.php dist-cupi24/rechte.php
          cp backend/logbuch.php dist-cupi24/logbuch.php
          cp backend/ereignisse.php dist-cupi24/ereignisse.php
          cp backend/auslagen.php dist-cupi24/auslagen.php
          cp backend/rundgang.php dist-cupi24/rundgang.php
          cp backend/fahrzeug.php dist-cupi24/fahrzeug.php
          cp backend/geofence_bereich.php dist-cupi24/geofence_bereich.php
          cp backend/belege.php dist-cupi24/belege.php
          cp backend/qrrechnung.php dist-cupi24/qrrechnung.php
          cp backend/produkte.php dist-cupi24/produkte.php
          cp backend/mailer.php dist-cupi24/mailer.php
          cp backend/ferien.php dist-cupi24/ferien.php
          cp backend/lohn.php dist-cupi24/lohn.php
          cp backend/gavzeit.php dist-cupi24/gavzeit.php
          cp backend/lohnlauf.php dist-cupi24/lohnlauf.php
          cp backend/mitteilungen.php dist-cupi24/mitteilungen.php
          cp backend/push.php dist-cupi24/push.php
          cp htaccess-cupi24 dist-cupi24/.htaccess
          cp backend/api/*.php dist-cupi24/api/
          cp handbuch/*.php dist-cupi24/handbuch/
          cp handbuch/*.css dist-cupi24/handbuch/
          cp handbuch/*.js dist-cupi24/handbuch/
          # setup.php / setup.html bewusst NICHT hier -- dieselbe Begruendung
          # wie beim Hauptschritt oben.

          # ECHTE Produktions-Datenbank -- dieselben Werte wie das
          # Rapport-Tool oben (EFF_DB_*). CUPI 24 ist der Bestandsmandant,
          # keine eigene Datenbank noetig (siehe Kopf dieses Abschnitts).
          sed -i "s|__DB_HOST__|$EFF_DB_HOST|g" dist-cupi24/db.php
          sed -i "s|__DB_NAME__|$EFF_DB_NAME|g" dist-cupi24/db.php
          sed -i "s|__DB_USER__|$EFF_DB_USER|g" dist-cupi24/db.php
          sed -i "s|__DB_PASS__|$EFF_DB_PASSWORD|g" dist-cupi24/db.php
          # Platzhalter der separaten Betreiber-Datenbank (OP-518). Bleiben
          # die vier Secrets ungesetzt, ist $EFF_BETREIBER_DB_* leer und
          # betreiber_db() faellt bewusst auf db() zurueck -- derselbe
          # heutige Normalfall wie im Hauptschritt (dist/) und im
          # betreiber-Buendel oben.
          sed -i "s|__BETREIBER_DB_HOST__|$EFF_BETREIBER_DB_HOST|g" dist-cupi24/betreiber.php
          sed -i "s|__BETREIBER_DB_NAME__|$EFF_BETREIBER_DB_NAME|g" dist-cupi24/betreiber.php
          sed -i "s|__BETREIBER_DB_USER__|$EFF_BETREIBER_DB_USER|g" dist-cupi24/betreiber.php
          sed -i "s|__BETREIBER_DB_PASS__|$EFF_BETREIBER_DB_PASSWORD|g" dist-cupi24/betreiber.php
          sed -i "s|__APP_ENV__|$UMGEBUNG|g" dist-cupi24/db.php
          sed -i "s|__APP_ENV__|$UMGEBUNG|g" dist-cupi24/testumgebung.js

          # Eigene Adresse (ENT-501, ENT-589) -- FESTES LITERAL, kein Secret
          # und keine Environment-Variable: cupi24.guardops.ch ist die
          # entschiedene, oeffentlich sichtbare Adresse dieses Mandanten.
          # Bewusst NICHT ueber die globale EFF_APP_BASIS_URL (die traegt
          # weiterhin die alte Adresse fuer den Hauptschritt oben) -- eigene,
          # lokale Ersetzung nur fuer dieses Buendel, genau wie bei
          # dist-betreiber/ und dist-portal/ weiter oben.
          sed -i "s|__APP_BASIS_URL__|https://cupi24.guardops.ch|g" dist-cupi24/db.php

          sed -i "s|__ANTHROPIC_API_KEY__|$EFF_ANTHROPIC_API_KEY|g" dist-cupi24/ai.php

          # ECHTES Produktions-Postfach -- dasselbe wie das Rapport-Tool
          # oben. Kein eigenes Postfach wie beim guardops-Buendel: CUPI 24
          # ist Mandantin des Kernprodukts, keine separate Marketingseite.
          sed -i "s|__SMTP_HOST__|$EFF_SMTP_HOST|g" dist-cupi24/mailer.php
          sed -i "s|__SMTP_PORT__|$EFF_SMTP_PORT|g" dist-cupi24/mailer.php
          sed -i "s|__SMTP_VERSCHLUESSELUNG__|$EFF_SMTP_VERSCHLUESSELUNG|g" dist-cupi24/mailer.php
          sed -i "s|__SMTP_USER__|$EFF_SMTP_USER|g" dist-cupi24/mailer.php
          sed -i "s|__SMTP_PASSWORD__|$EFF_SMTP_PASSWORD|g" dist-cupi24/mailer.php
          sed -i "s|__SMTP_ABSENDER__|$EFF_SMTP_ABSENDER|g" dist-cupi24/mailer.php
          sed -i "s|__SMTP_ABSENDER_NAME__|$EFF_SMTP_ABSENDER_NAME|g" dist-cupi24/mailer.php
          sed -i "s|__DEMO_EMPFAENGER__|$EFF_DEMO_EMPFAENGER|g" dist-cupi24/demo_anfrage.php
          # Dieser Schritt laeuft ausschliesslich in Production (siehe
          # Bedingung oben) -- EFF_STAGING_TESTMAIL und EFF_DEMO_TESTMAIL
          # sind dort immer leer, dieselbe Bauart wie beim Hauptschritt.
          sed -i "s|__STAGING_TESTMAIL__|$EFF_STAGING_TESTMAIL|g" dist-cupi24/mailer.php
          sed -i "s|__DEMO_TESTMAIL__|$EFF_DEMO_TESTMAIL|g" dist-cupi24/mailer.php
          sed -i "s|__DEMO_RESET_TOKEN__|$EFF_DEMO_RESET_TOKEN|g" dist-cupi24/api/demo_reset_ausfuehren.php
          # OP-526, dieselbe Begruendung wie im betreiber-Buendel: dieses
          # Buendel liefert betreiber.php nur als tote Einbindung mit (kein
          # betreiber_*-Endpunkt laeuft hier), aber die strenge
          # Platzhalter-Pruefung unten kennt diesen Unterschied nicht.
          sed -i "s|__MANDANT_SECRETS__|$EFF_MANDANT_SECRETS|g" dist-cupi24/betreiber.php
          sed -i "s|__MAPS_JS_KEY__|$EFF_MAPS_JS_KEY|g" dist-cupi24/dashboard.html
          sed -i "s|__MAPS_JS_KEY__|$EFF_MAPS_JS_KEY|g" dist-cupi24/portal.html
          sed -i "s|__MAPS_JS_KEY__|$EFF_MAPS_JS_KEY|g" dist-cupi24/app.html
          sed -i "s|__VAPID_PRIVATE_PEM_B64__|$EFF_VAPID_PRIVATE_PEM_B64|g" dist-cupi24/push.php
          sed -i "s|__VAPID_KONTAKT__|$EFF_VAPID_KONTAKT|g" dist-cupi24/push.php
          sed -i "s|__APNS_KEY_P8_B64__|$EFF_APNS_KEY_P8_B64|g" dist-cupi24/push.php
          sed -i "s|__APNS_KEY_ID__|$EFF_APNS_KEY_ID|g" dist-cupi24/push.php
          sed -i "s|__APNS_TEAM_ID__|$EFF_APNS_TEAM_ID|g" dist-cupi24/push.php
          sed -i "s|__PUSH_CRON_SCHLUESSEL__|$EFF_PUSH_CRON_SCHLUESSEL|g" dist-cupi24/api/push_versand.php

          # CUPI-24-eigenes Branding (ENT-589, mandantenseitig -- schliesst
          # die zwei offenen Punkte aus ENT-568). Betrifft NUR dieses
          # Buendel: die geteilten Flaechen (guardops.ch, betreiber.*,
          # portal.*) bleiben GuardOpS, weil dort ENT-568 das so entschieden
          # hat. Reine Dateinamen-Ersetzung fuer Favicon/App-Icons/PWA-
          # Vorschaubilder -- die Dateien selbst liegen unter icons/cupi24-*
          # (oben per icons/*.png mitkopiert).
          sed -i "s|icons/guardops-|icons/cupi24-|g" \
            dist-cupi24/dashboard.html dist-cupi24/app.html dist-cupi24/index.html \
            dist-cupi24/manifest.json dist-cupi24/manifest-app.json dist-cupi24/sw.js
          # KEINE eigene Zeile mehr fuer das Favicon des Cockpits: Seit
          # dashboard.html im Grundzustand icons/guardops-32/16/180 traegt
          # (vorher icons/icon-*.png, das CUPI-24-Siegel fuer ALLE Adressen),
          # haengt es die "icons/guardops-"-Ersetzung direkt darueber mit um.
          # sw.js haengt hier mit dran: Push-Icon/-Badge tragen seit ENT-603
          # denselben "icons/guardops-"-Pfad wie das Cockpit-Favicon.

          # Die Anmeldemaske des Cockpits (gate-oben, ENT-579) zeigt das
          # CUPI-24-Siegel statt der GuardOpS-Wortmarke -- das ist die
          # einzige Stelle, die wechselt. "powered by Guard OpS" (go-sig,
          # mh-voll/mh-zeichen -- Herstellerhinweis) bleibt unveraendert
          # GuardOpS, in dashboard.html, app.html UND index.html: keiner
          # dieser drei Dateien wird hier angefasst ausser der einen Zeile
          # unten.
          # Eigene, kleinere Groesse (Befund des Projektinhabers, Lauf 524):
          # .gate-oben .marke ist auf die WORTMARKE zugeschnitten (Rechteck
          # 4.23:1, ~57/80px hoch bei 240/340px Breite) -- beim Siegel
          # (quadratisch) macht dieselbe Breite es doppelt so hoch wie
          # vorgesehen und wirkt zu gross. Eigener, bündel-lokaler
          # Ueberschreibungs-Block statt die geteilte Regel zu aendern.
          sed -i "s|<svg class=\"marke\" viewBox=\"0.00 0.00 649.83 153.56\" role=\"img\" aria-label=\"Guard OpS\"><use href=\"#go-wort\"/></svg>|<img class=\"marke\" src=\"icons/cupi24-badge.png\" alt=\"CUPI 24 GmbH\"><style>.gate-oben .marke{width:130px}@media (min-width:900px){.gate-oben .marke{width:170px}}</style>|" \
            dist-cupi24/dashboard.html

          # Name in den beiden Manifesten (ENT-568, offene Frage): Diese
          # Dateien sind mandantenseitig -- auf dem Telefon einer CUPI-24-
          # Mitarbeiterin ist "GuardOpS" die falsche Auskunft.
          sed -i "s|GuardOpS – Mitarbeitende|CUPI 24 – Mitarbeitende|; s|\"short_name\": \"GuardOpS\"|\"short_name\": \"CUPI 24\"|" \
            dist-cupi24/manifest-app.json
          sed -i "s|Stundenrapport – GuardOpS|Stundenrapport – CUPI 24|" \
            dist-cupi24/manifest.json
          # PUSH_TITEL und das Benachrichtigungs-Kennzeichen in sw.js
          # (ENT-603): Die Quelldatei traegt seither GuardOpS (fuer die
          # geteilten Buendel), das cupi24-Buendel haengt beides hier auf
          # CUPI 24 um -- dieselbe Bauart wie bei den Manifesten oben.
          sed -i "s|const PUSH_TITEL = 'GuardOpS';|const PUSH_TITEL = 'CUPI 24';|; s|tag: 'guardops-mitteilung',|tag: 'cupi24-mitteilung',|" \
            dist-cupi24/sw.js

          # Kein uebersehener Platzhalter darf hochgeladen werden. Genau wie
          # im betreiber-Buendel und im Hauptschritt (dist/) oben werden die
          # eigenen Platzhalter der separaten Betreiber-Datenbank
          # (__BETREIBER_DB_*__, OP-518) und der Mandanten-Deploy-Geheimnisse
          # (__MANDANT_SECRETS__, OP-526) hier oben IMMER ersetzt -- notfalls
          # mit einer leeren Zeichenkette, solange die Secrets noch nicht
          # gesetzt sind; betreiber_db() und mandant_secret() fallen dann
          # bewusst auf ihren jeweiligen Normalfall zurueck. Die Liste unten
          # traegt darum nur noch PHPs eigene Konstante __DIR__.
          UEBRIG=$(grep -rhos '__[A-Z_]\{3,\}__' dist-cupi24/ \
                   | grep -v -e '^__DIR__$' \
                   | sort -u || true)
          if [ -n "$UEBRIG" ]; then
            echo "::error::Nicht ersetzte Platzhalter im cupi24-Buendel: $UEBRIG"
            exit 1
          fi

          echo "Buendel fuer cupi24.guardops.ch:"
          find dist-cupi24 -type f | sort

      - name: Rapport-Tool nach cupi24.guardops.ch hochladen (FTPS)
        if: ${{ env.UMGEBUNG == 'production' && env.EFF_CUPI24_FTP_HOST != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.EFF_CUPI24_FTP_HOST }}
          username: ${{ env.EFF_CUPI24_FTP_USER }}
          password: ${{ env.EFF_CUPI24_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist-cupi24/
          # Der Zugang ist von Hostpoint auf das Document-Root der Subdomain
          # beschraenkt -- daher "/", nicht der volle Pfad. Genau wie bei den
          # Uploads oben. ACHTUNG (Lehre aus dem Portal-Umzug, ENT-580): der
          # FTP-Account MUSS auf den tatsaechlichen Document-Root der
          # Subdomain zeigen, nicht auf einen gleichnamigen Pfad ohne "www/"
          # -- sonst laden die Dateien unbemerkt an eine unbediente Stelle
          # hoch (403 trotz erfolgreichem Upload).
          server-dir: /

      # "NICHT EINGERICHTET" DARF NICHT WIE "NICHTS ZU TUN" AUSSEHEN, genau
      # wie bei den Buendeln oben.
      - name: Hinweis, wenn cupi24.guardops.ch noch nicht eingerichtet ist
        if: ${{ env.UMGEBUNG == 'production' && env.EFF_CUPI24_FTP_HOST == '' }}
        run: |
          echo "::notice::cupi24.guardops.ch wurde NICHT beliefert -- die Secrets CUPI24_FTP_HOST/USER/PASSWORD fehlen im Environment production. Das Rapport-Tool auf der bisherigen Adresse ist davon nicht betroffen und wurde regulaer ausgeliefert."

      - name: Staging-Passwortschutz verifizieren
        if: ${{ env.UMGEBUNG == 'staging' }}
        run: |
          set -uo pipefail
          if [ -z "${{ vars.STAGING_DOMAIN }}" ]; then
            echo "::error::Staging-Deploy abgebrochen -- Environment-Variable STAGING_DOMAIN fehlt, der Passwortschutz kann ohne sie nicht verifiziert werden (ENT-384)."
            exit 1
          fi
          HEADERS=$(curl -sS -D - -o /dev/null --max-time 15 --connect-timeout 10 "https://${{ vars.STAGING_DOMAIN }}/" 2>&1)
          if [ $? -ne 0 ]; then
            echo "::error::Staging-Passwortschutz-Pruefung fehlgeschlagen (Netzwerkfehler/Timeout beim Abruf von https://${{ vars.STAGING_DOMAIN }}/): $HEADERS"
            exit 1
          fi
          if ! echo "$HEADERS" | head -1 | grep -qE '^HTTP/[0-9.]+ 401'; then
            echo "::error::Staging-Passwortschutz nicht nachweisbar -- erwartet HTTP 401, tatsaechliche Antwortzeile: $(echo "$HEADERS" | head -1)"
            exit 1
          fi
          if ! echo "$HEADERS" | grep -qi '^WWW-Authenticate:.*Basic'; then
            echo "::error::Staging-Passwortschutz-Nachweis unvollstaendig -- HTTP 401 erhalten, aber kein 'WWW-Authenticate: Basic'-Kopf gefunden. Kopfzeilen: $HEADERS"
            exit 1
          fi
          echo "Staging-Passwortschutz verifiziert (HTTP 401, WWW-Authenticate: Basic)."

      # ENT-387: Beweist die zweite Schutzschicht (X-Robots-Tag, robots.txt),
      # die greifen soll, falls Basic Auth kuenftig versehentlich geschwaecht
      # wird. Ein unauthentifizierter Abruf waere hier KEIN Nachweis: wegen
      # "Require valid-user" liefert JEDER Pfad -- ob robots.txt existiert
      # oder nicht -- ohnehin 401, das Ergebnis waere unabhaengig vom
      # tatsaechlichen Dateiinhalt immer gleich. Deshalb authentifiziert mit
      # einem eigenen technischen Benutzer (qa-probe, ENT-387), nicht mit
      # persoenlichen Zugangsdaten. Beide Abrufe verzichten bewusst auf
      # "-L"/"--location" (ein Redirect auf einen fremden Host darf niemals
      # als Erfolg durchgehen) und auf "-k"/"--insecure" (TLS wird regulaer
      # geprueft) -- ein DNS-, TLS-, Netzwerk- oder Timeout-Fehler faellt
      # damit automatisch unter denselben Fehlschlag-Zweig wie bei der
      # Passwortschutz-Pruefung oben.
      - name: Staging-Suchmaschinenausschluss verifizieren (X-Robots-Tag, robots.txt)
        if: ${{ env.UMGEBUNG == 'staging' }}
        run: |
          set -uo pipefail
          if [ -z "${{ vars.STAGING_DOMAIN }}" ]; then
            echo "::error::Staging-Deploy abgebrochen -- Environment-Variable STAGING_DOMAIN fehlt, der Suchmaschinenausschluss kann ohne sie nicht verifiziert werden (ENT-387)."
            exit 1
          fi
          if [ -z "${{ secrets.STAGING_BASIC_AUTH_USER }}" ] || [ -z "${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}" ]; then
            echo "::error::Staging-Deploy abgebrochen -- STAGING_BASIC_AUTH_USER/STAGING_BASIC_AUTH_PASSWORD fehlen, der authentifizierte Nachweis kann ohne sie nicht gefuehrt werden (ENT-387)."
            exit 1
          fi

          AUTH_ROOT=$(curl -sS -D - -o /dev/null --max-time 15 --connect-timeout 10 -u "${{ secrets.STAGING_BASIC_AUTH_USER }}:${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}" "https://${{ vars.STAGING_DOMAIN }}/" 2>&1)
          if [ $? -ne 0 ]; then
            echo "::error::Suchmaschinenausschluss-Pruefung fehlgeschlagen (DNS-/TLS-/Netzwerkfehler oder Timeout beim authentifizierten Abruf von https://${{ vars.STAGING_DOMAIN }}/): $AUTH_ROOT"
            exit 1
          fi
          if ! echo "$AUTH_ROOT" | head -1 | grep -qE '^HTTP/[0-9.]+ 200'; then
            echo "::error::Anwendung ueber Staging-Basic-Auth nicht erreichbar -- erwartet HTTP 200 auf '/', tatsaechliche Antwortzeile: $(echo "$AUTH_ROOT" | head -1)"
            exit 1
          fi
          if ! echo "$AUTH_ROOT" | grep -qi '^X-Robots-Tag:.*noindex'; then
            echo "::error::X-Robots-Tag fehlt oder enthaelt kein 'noindex' auf der authentifiziert abgerufenen Startseite. Kopfzeilen: $AUTH_ROOT"
            exit 1
          fi

          AUTH_ROBOTS=$(curl -sS -D - --max-time 15 --connect-timeout 10 -u "${{ secrets.STAGING_BASIC_AUTH_USER }}:${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}" "https://${{ vars.STAGING_DOMAIN }}/robots.txt" 2>&1)
          if [ $? -ne 0 ]; then
            echo "::error::Suchmaschinenausschluss-Pruefung fehlgeschlagen (DNS-/TLS-/Netzwerkfehler oder Timeout beim authentifizierten Abruf von https://${{ vars.STAGING_DOMAIN }}/robots.txt): $AUTH_ROBOTS"
            exit 1
          fi
          if ! echo "$AUTH_ROBOTS" | head -1 | grep -qE '^HTTP/[0-9.]+ 200'; then
            echo "::error::robots.txt auf Staging nicht erreichbar -- erwartet HTTP 200, tatsaechliche Antwortzeile: $(echo "$AUTH_ROBOTS" | head -1)"
            exit 1
          fi
          if ! echo "$AUTH_ROBOTS" | grep -qE '^User-agent:[[:space:]]*\*'; then
            echo "::error::robots.txt-Inhalt unvollstaendig -- 'User-agent: *' nicht gefunden. Antwort: $AUTH_ROBOTS"
            exit 1
          fi
          if ! echo "$AUTH_ROBOTS" | grep -qE '^Disallow:[[:space:]]*/[[:space:]]*$'; then
            echo "::error::robots.txt-Inhalt unvollstaendig -- 'Disallow: /' nicht gefunden. Antwort: $AUTH_ROBOTS"
            exit 1
          fi
          echo "Staging-Suchmaschinenausschluss verifiziert (X-Robots-Tag: noindex auf '/', robots.txt mit User-agent:*/Disallow:/ erreichbar)."

      # Dieselbe zweite Schutzschicht fuer Demo (ENT-523) -- ANDERS als bei
      # Staging OHNE Basic-Auth-Zugangsdaten: Die Demo hat keinen
      # Passwortschutz (ENT-523-N1), ein unauthentifizierter Abruf ist hier
      # also ein echter Nachweis, kein Artefakt eines "Require valid-user".
      # Dieselben Waechter wie bei Staging gegen einen falschen Nachweis:
      # kein -L/--location (ein Redirect auf einen fremden Host darf nie
      # als Erfolg durchgehen), kein -k/--insecure (TLS wird regulaer
      # geprueft), Netzwerkfehler/Timeout zaehlen als Fehlschlag.
      - name: Demo-Suchmaschinenausschluss verifizieren (X-Robots-Tag, robots.txt)
        if: ${{ env.UMGEBUNG == 'demo' }}
        run: |
          set -uo pipefail
          if [ -z "${{ vars.DEMO_DOMAIN }}" ]; then
            echo "::error::Demo-Deploy abgebrochen -- Environment-Variable DEMO_DOMAIN fehlt, der Suchmaschinenausschluss kann ohne sie nicht verifiziert werden (ENT-523)."
            exit 1
          fi

          ROOT=$(curl -sS -D - -o /dev/null --max-time 15 --connect-timeout 10 "https://${{ vars.DEMO_DOMAIN }}/" 2>&1)
          if [ $? -ne 0 ]; then
            echo "::error::Suchmaschinenausschluss-Pruefung fehlgeschlagen (DNS-/TLS-/Netzwerkfehler oder Timeout beim Abruf von https://${{ vars.DEMO_DOMAIN }}/): $ROOT"
            exit 1
          fi
          if ! echo "$ROOT" | head -1 | grep -qE '^HTTP/[0-9.]+ 200'; then
            echo "::error::Demo-Startseite nicht erreichbar -- erwartet HTTP 200 auf '/', tatsaechliche Antwortzeile: $(echo "$ROOT" | head -1)"
            exit 1
          fi
          if ! echo "$ROOT" | grep -qi '^X-Robots-Tag:.*noindex'; then
            echo "::error::X-Robots-Tag fehlt oder enthaelt kein 'noindex' auf der Demo-Startseite. Kopfzeilen: $ROOT"
            exit 1
          fi

          ROBOTS=$(curl -sS -D - --max-time 15 --connect-timeout 10 "https://${{ vars.DEMO_DOMAIN }}/robots.txt" 2>&1)
          if [ $? -ne 0 ]; then
            echo "::error::Suchmaschinenausschluss-Pruefung fehlgeschlagen (DNS-/TLS-/Netzwerkfehler oder Timeout beim Abruf von https://${{ vars.DEMO_DOMAIN }}/robots.txt): $ROBOTS"
            exit 1
          fi
          if ! echo "$ROBOTS" | head -1 | grep -qE '^HTTP/[0-9.]+ 200'; then
            echo "::error::robots.txt auf Demo nicht erreichbar -- erwartet HTTP 200, tatsaechliche Antwortzeile: $(echo "$ROBOTS" | head -1)"
            exit 1
          fi
          if ! echo "$ROBOTS" | grep -qE '^User-agent:[[:space:]]*\*'; then
            echo "::error::robots.txt-Inhalt unvollstaendig -- 'User-agent: *' nicht gefunden. Antwort: $ROBOTS"
            exit 1
          fi
          if ! echo "$ROBOTS" | grep -qE '^Disallow:[[:space:]]*/[[:space:]]*$'; then
            echo "::error::robots.txt-Inhalt unvollstaendig -- 'Disallow: /' nicht gefunden. Antwort: $ROBOTS"
            exit 1
          fi
          echo "Demo-Suchmaschinenausschluss verifiziert (X-Robots-Tag: noindex auf '/', robots.txt mit User-agent:*/Disallow:/ erreichbar)."
