name: Deploy Rapport-Tool zu Hostpoint

# Zwei Laufzeitumgebungen, EIN Workflow (ENT-341, Variante B): main deployt
# nach Produktion, staging nach der getrennten Testinstanz. Welches GitHub
# Environment aktiv ist, entscheidet der REF, gegen den der Lauf ausgeloest
# wird -- Kopierliste und Platzhalter-Ersetzung bleiben fuer beide identisch,
# nur die WERTE hinter den Secret-Namen unterscheiden sich (Settings →
# Environments in GitHub). Das ist der einzige dauerhafte Unterschied
# zwischen den Umgebungen -- nicht zwei gepflegte Kopien dieses Workflows.
#
# Staging-Secrets tragen durchgehend das Praefix STAGING_ und sind EIGENE,
# von den Produktions-Namen VERSCHIEDENE Secret-Namen -- nicht nur eigene
# Werte desselben Namens in einem zweiten Environment (verschaerft auf
# Wunsch des Projektinhabers, nachdem die erste Fassung nur auf getrennte
# Environments gesetzt hatte). Grund: GitHub faellt bei einem fehlenden
# Environment-Secret still auf ein gleichnamiges Repository-Secret zurueck.
# Mit identischen Namen in beiden Environments waere ein vergessenes
# Staging-Secret KEIN Fehler, sondern ein STILLER Rueckgriff auf die
# produktive Datenbank oder den produktiven FTP-Account -- der Lauf ginge
# durch, richtete aber moeglicherweise Schaden an der echten Anlage an. Mit
# eigenen Namen gibt es diesen Rueckfall strukturell nicht: Ein fehlendes
# STAGING_DB_HOST hat keinen gleichnamigen Ersatz, sondern ist schlicht
# leer -- und der erste Schritt unten erkennt genau das und bricht den Lauf
# ab, bevor irgendetwas kopiert oder hochgeladen wird.
#
# Kein dauerhafter Branch "staging" mehr (ENT-372, revidiert ENT-341 Punkt
# 5): Die neue, vom Projektinhaber als "hoechste Architekturvorgabe"
# bezeichnete Regel verlangt, dass main alleinige Source of Truth bleibt und
# kein Staging-spezifischer Code entstehen kann, der spaeter zurueckgemergt
# werden muesste. Ein beschreibbarer Branch waere genau das -- ein Tag ist
# es strukturell nicht, es laesst sich kein Commit "auf" einen Tag pushen.
# main wird deshalb ausschliesslich per Push deployt (immer Production);
# Staging entsteht ausschliesslich durch einen manuellen "Run workflow"
# gegen einen Tag der Form qa-JJJJ-MM-TT-NNN, der exakt auf einem
# bestehenden main-Commit liegt. github.ref_name liefert in diesem Fall den
# Tag-Namen -- die Umgebungs-Logik weiter unten unterscheidet dadurch
# unveraendert zwischen main (Production) und allem anderen (Staging).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      # Erster Schritt, bewusst VOR jedem Kopieren oder Hochladen: waehlt
      # anhand des Refs (main-Branch oder qa-*-Tag, ENT-372) den richtigen
      # Satz Secrets und bricht den
      # gesamten Lauf ab, wenn eines der fuer diese Umgebung ERFORDERLICHEN
      # fehlt. "Erforderlich" heisst: ohne diesen Wert liefe die Anwendung
      # gar nicht (DB, FTP-Ziel) oder ein sichtbares Feature bliebe fuer
      # alle kaputt (Maps-Schluessel, Staging-Testadresse). SMTP_* und
      # ANTHROPIC_API_KEY bleiben absichtlich NICHT erforderlich -- beide
      # Funktionen erkennen einen fehlenden Wert bereits selbst und melden
      # "nicht eingerichtet" statt mit einem Platzhalter zu arbeiten
      # (smtp_konfiguriert() in mailer.php, die Leerpruefung in ai.php).
      - name: Umgebung waehlen und erforderliche Secrets pruefen
        env:
          # Produktion -- bestehende Secret-Namen, unveraendert.
          P_DB_HOST: ${{ secrets.DB_HOST }}
          P_DB_NAME: ${{ secrets.DB_NAME }}
          P_DB_USER: ${{ secrets.DB_USER }}
          P_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          P_HOSTPOINT_FTP_HOST: ${{ secrets.HOSTPOINT_FTP_HOST }}
          P_HOSTPOINT_FTP_USER: ${{ secrets.HOSTPOINT_FTP_USER }}
          P_HOSTPOINT_FTP_PASSWORD: ${{ secrets.HOSTPOINT_FTP_PASSWORD }}
          P_SMTP_HOST: ${{ secrets.SMTP_HOST }}
          P_SMTP_PORT: ${{ secrets.SMTP_PORT }}
          P_SMTP_VERSCHLUESSELUNG: ${{ secrets.SMTP_VERSCHLUESSELUNG }}
          P_SMTP_USER: ${{ secrets.SMTP_USER }}
          P_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          P_SMTP_ABSENDER: ${{ secrets.SMTP_ABSENDER }}
          P_SMTP_ABSENDER_NAME: ${{ secrets.SMTP_ABSENDER_NAME }}
          P_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          P_MAPS_JS_KEY: ${{ secrets.MAPS_JS_KEY }}
          # Staging -- eigene, von Produktion VERSCHIEDENE Secret-Namen.
          S_DB_HOST: ${{ secrets.STAGING_DB_HOST }}
          S_DB_NAME: ${{ secrets.STAGING_DB_NAME }}
          S_DB_USER: ${{ secrets.STAGING_DB_USER }}
          S_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          S_HOSTPOINT_FTP_HOST: ${{ secrets.STAGING_HOSTPOINT_FTP_HOST }}
          S_HOSTPOINT_FTP_USER: ${{ secrets.STAGING_HOSTPOINT_FTP_USER }}
          S_HOSTPOINT_FTP_PASSWORD: ${{ secrets.STAGING_HOSTPOINT_FTP_PASSWORD }}
          S_SMTP_HOST: ${{ secrets.STAGING_SMTP_HOST }}
          S_SMTP_PORT: ${{ secrets.STAGING_SMTP_PORT }}
          S_SMTP_VERSCHLUESSELUNG: ${{ secrets.STAGING_SMTP_VERSCHLUESSELUNG }}
          S_SMTP_USER: ${{ secrets.STAGING_SMTP_USER }}
          S_SMTP_PASSWORD: ${{ secrets.STAGING_SMTP_PASSWORD }}
          S_SMTP_ABSENDER: ${{ secrets.STAGING_SMTP_ABSENDER }}
          S_SMTP_ABSENDER_NAME: ${{ secrets.STAGING_SMTP_ABSENDER_NAME }}
          S_ANTHROPIC_API_KEY: ${{ secrets.STAGING_ANTHROPIC_API_KEY }}
          S_MAPS_JS_KEY: ${{ secrets.STAGING_MAPS_JS_KEY }}
          S_STAGING_TESTMAIL: ${{ secrets.STAGING_TESTMAIL }}
        run: |
          set -euo pipefail

          if [ "${{ github.ref_name }}" = "main" ]; then
            UMGEBUNG=production
            EFF_DB_HOST="$P_DB_HOST"; EFF_DB_NAME="$P_DB_NAME"
            EFF_DB_USER="$P_DB_USER"; EFF_DB_PASSWORD="$P_DB_PASSWORD"
            EFF_HOSTPOINT_FTP_HOST="$P_HOSTPOINT_FTP_HOST"
            EFF_HOSTPOINT_FTP_USER="$P_HOSTPOINT_FTP_USER"
            EFF_HOSTPOINT_FTP_PASSWORD="$P_HOSTPOINT_FTP_PASSWORD"
            EFF_SMTP_HOST="$P_SMTP_HOST"; EFF_SMTP_PORT="$P_SMTP_PORT"
            EFF_SMTP_VERSCHLUESSELUNG="$P_SMTP_VERSCHLUESSELUNG"
            EFF_SMTP_USER="$P_SMTP_USER"; EFF_SMTP_PASSWORD="$P_SMTP_PASSWORD"
            EFF_SMTP_ABSENDER="$P_SMTP_ABSENDER"; EFF_SMTP_ABSENDER_NAME="$P_SMTP_ABSENDER_NAME"
            EFF_ANTHROPIC_API_KEY="$P_ANTHROPIC_API_KEY"; EFF_MAPS_JS_KEY="$P_MAPS_JS_KEY"
            EFF_STAGING_TESTMAIL=""

            PFLICHT_FEHLT=""
            [ -z "$EFF_DB_HOST" ]                && PFLICHT_FEHLT="$PFLICHT_FEHLT DB_HOST"
            [ -z "$EFF_DB_NAME" ]                && PFLICHT_FEHLT="$PFLICHT_FEHLT DB_NAME"
            [ -z "$EFF_DB_USER" ]                && PFLICHT_FEHLT="$PFLICHT_FEHLT DB_USER"
            [ -z "$EFF_DB_PASSWORD" ]            && PFLICHT_FEHLT="$PFLICHT_FEHLT DB_PASSWORD"
            [ -z "$EFF_HOSTPOINT_FTP_HOST" ]     && PFLICHT_FEHLT="$PFLICHT_FEHLT HOSTPOINT_FTP_HOST"
            [ -z "$EFF_HOSTPOINT_FTP_USER" ]     && PFLICHT_FEHLT="$PFLICHT_FEHLT HOSTPOINT_FTP_USER"
            [ -z "$EFF_HOSTPOINT_FTP_PASSWORD" ] && PFLICHT_FEHLT="$PFLICHT_FEHLT HOSTPOINT_FTP_PASSWORD"
            [ -z "$EFF_MAPS_JS_KEY" ]            && PFLICHT_FEHLT="$PFLICHT_FEHLT MAPS_JS_KEY"
          else
            UMGEBUNG=staging
            EFF_DB_HOST="$S_DB_HOST"; EFF_DB_NAME="$S_DB_NAME"
            EFF_DB_USER="$S_DB_USER"; EFF_DB_PASSWORD="$S_DB_PASSWORD"
            EFF_HOSTPOINT_FTP_HOST="$S_HOSTPOINT_FTP_HOST"
            EFF_HOSTPOINT_FTP_USER="$S_HOSTPOINT_FTP_USER"
            EFF_HOSTPOINT_FTP_PASSWORD="$S_HOSTPOINT_FTP_PASSWORD"
            EFF_SMTP_HOST="$S_SMTP_HOST"; EFF_SMTP_PORT="$S_SMTP_PORT"
            EFF_SMTP_VERSCHLUESSELUNG="$S_SMTP_VERSCHLUESSELUNG"
            EFF_SMTP_USER="$S_SMTP_USER"; EFF_SMTP_PASSWORD="$S_SMTP_PASSWORD"
            EFF_SMTP_ABSENDER="$S_SMTP_ABSENDER"; EFF_SMTP_ABSENDER_NAME="$S_SMTP_ABSENDER_NAME"
            EFF_ANTHROPIC_API_KEY="$S_ANTHROPIC_API_KEY"; EFF_MAPS_JS_KEY="$S_MAPS_JS_KEY"
            EFF_STAGING_TESTMAIL="$S_STAGING_TESTMAIL"

            PFLICHT_FEHLT=""
            [ -z "$EFF_DB_HOST" ]                && PFLICHT_FEHLT="$PFLICHT_FEHLT STAGING_DB_HOST"
            [ -z "$EFF_DB_NAME" ]                && PFLICHT_FEHLT="$PFLICHT_FEHLT STAGING_DB_NAME"
            [ -z "$EFF_DB_USER" ]                && PFLICHT_FEHLT="$PFLICHT_FEHLT STAGING_DB_USER"
            [ -z "$EFF_DB_PASSWORD" ]            && PFLICHT_FEHLT="$PFLICHT_FEHLT STAGING_DB_PASSWORD"
            [ -z "$EFF_HOSTPOINT_FTP_HOST" ]     && PFLICHT_FEHLT="$PFLICHT_FEHLT STAGING_HOSTPOINT_FTP_HOST"
            [ -z "$EFF_HOSTPOINT_FTP_USER" ]     && PFLICHT_FEHLT="$PFLICHT_FEHLT STAGING_HOSTPOINT_FTP_USER"
            [ -z "$EFF_HOSTPOINT_FTP_PASSWORD" ] && PFLICHT_FEHLT="$PFLICHT_FEHLT STAGING_HOSTPOINT_FTP_PASSWORD"
            [ -z "$EFF_MAPS_JS_KEY" ]            && PFLICHT_FEHLT="$PFLICHT_FEHLT STAGING_MAPS_JS_KEY"
            [ -z "$EFF_STAGING_TESTMAIL" ]       && PFLICHT_FEHLT="$PFLICHT_FEHLT STAGING_TESTMAIL"
          fi

          # ENT-372: Staging deployt ausschliesslich gegen einen Tag der Form
          # qa-JJJJ-MM-TT-NNN, nie gegen einen Branch. Ohne diese Pruefung
          # wuerde ein Dispatch gegen IRGENDEINEN Branch, der nicht "main"
          # heisst, klaglos mit Staging-Secrets bespielt -- dieselbe Pruefung,
          # die das GitHub-Environment "staging" ueber "Deployment branches
          # and tags" (Muster qa-*) zusaetzlich extern erzwingt.
          if [ "$UMGEBUNG" = "staging" ]; then
            case "${{ github.ref_name }}" in
              qa-*) ;;
              *) echo "::error::Staging-Deploy abgebrochen -- Ref '${{ github.ref_name }}' ist kein qa-*-Tag (ENT-372). Staging deployt ausschliesslich gegen einen Tag der Form qa-JJJJ-MM-TT-NNN, nie gegen einen Branch."
                 exit 1 ;;
            esac
          fi

          if [ -n "$PFLICHT_FEHLT" ]; then
            echo "::error::Deployment abgebrochen -- fuer Environment $UMGEBUNG fehlen erforderliche Secrets:$PFLICHT_FEHLT"
            exit 1
          fi

          # Fuer die folgenden Schritte als Umgebungsvariablen weiterreichen.
          # GitHub maskiert Werte, die einmal ueber "secrets." referenziert
          # wurden, im Log unabhaengig davon, ueber wie viele Variablen sie
          # danach noch laufen.
          {
            echo "UMGEBUNG=$UMGEBUNG"
            echo "EFF_DB_HOST=$EFF_DB_HOST"
            echo "EFF_DB_NAME=$EFF_DB_NAME"
            echo "EFF_DB_USER=$EFF_DB_USER"
            echo "EFF_DB_PASSWORD=$EFF_DB_PASSWORD"
            echo "EFF_HOSTPOINT_FTP_HOST=$EFF_HOSTPOINT_FTP_HOST"
            echo "EFF_HOSTPOINT_FTP_USER=$EFF_HOSTPOINT_FTP_USER"
            echo "EFF_HOSTPOINT_FTP_PASSWORD=$EFF_HOSTPOINT_FTP_PASSWORD"
            echo "EFF_SMTP_HOST=$EFF_SMTP_HOST"
            echo "EFF_SMTP_PORT=$EFF_SMTP_PORT"
            echo "EFF_SMTP_VERSCHLUESSELUNG=$EFF_SMTP_VERSCHLUESSELUNG"
            echo "EFF_SMTP_USER=$EFF_SMTP_USER"
            echo "EFF_SMTP_PASSWORD=$EFF_SMTP_PASSWORD"
            echo "EFF_SMTP_ABSENDER=$EFF_SMTP_ABSENDER"
            echo "EFF_SMTP_ABSENDER_NAME=$EFF_SMTP_ABSENDER_NAME"
            echo "EFF_ANTHROPIC_API_KEY=$EFF_ANTHROPIC_API_KEY"
            echo "EFF_MAPS_JS_KEY=$EFF_MAPS_JS_KEY"
            echo "EFF_STAGING_TESTMAIL=$EFF_STAGING_TESTMAIL"
          } >> "$GITHUB_ENV"

      - name: Platzhalter durch echte Werte ersetzen
        run: |
          mkdir -p dist/api dist/icons dist/fonts dist/img
          cp index.html dist/index.html
          cp dashboard.html dist/dashboard.html
          cp app.html dist/app.html
          # gav.js traegt die GAV-Regeln fuer BEIDE Oberflaechen (ENT-049).
          # Fehlt sie hier, laden dashboard.html und app.html ins Leere und
          # rechnen gar nichts mehr -- derselbe Fallstrick wie bei ENT-040.
          cp gav.js dist/gav.js
          # zeitwahl.js traegt das Zeit-Bedienelement fuer BEIDE Oberflaechen
          # (ENT-110). Fehlt sie hier, sind alle Zeitfelder unsichtbar und es
          # laesst sich keine Zeit mehr eintragen -- derselbe Fallstrick.
          cp zeitwahl.js dist/zeitwahl.js
          # qrcode.js wird von beleg_oeffentlich.php per <script src> geladen
          # (ENT-205), nicht von dashboard.html/app.html -- test_deploy.mjs
          # scannt nur diese beiden auf lokale Skripte, darum hier von Hand
          # eingetragen wie gav.js/zeitwahl.js oben.
          cp qrcode.js dist/qrcode.js
          # unterschrift.js traegt das Unterschriftsfeld fuer BEIDE Oberflaechen
          # (ENT-292) -- derselbe Fallstrick wie bei gav.js/zeitwahl.js oben:
          # fehlt die Zeile, laesst der Kunde live nirgends mehr
          # unterschreiben, und lokal faellt es NICHT auf.
          cp unterschrift.js dist/unterschrift.js
          # testumgebung.js traegt das TESTUMGEBUNG-Kennzeichen fuer ALLE
          # DREI Oberflaechen (ENT-341) -- derselbe Fallstrick wie bei
          # gav.js/zeitwahl.js/unterschrift.js oben: fehlt die Zeile, faellt
          # das Kennzeichen auf Staging lautlos weg, und lokal faellt es
          # NICHT auf. test_deploy.mjs prueft das bereits automatisch mit,
          # weil es jedes <script src> in den drei Seiten gegen diese Liste
          # abgleicht.
          cp testumgebung.js dist/testumgebung.js
          # html2pdf.bundle.min.js (ENT-206): erst bei Klick auf "Herunter-
          # laden" per JS nachgeladen, deshalb kein literales <script>-Tag im
          # HTML -- test_deploy.mjs prueft trotzdem, dass sie hier steht.
          cp html2pdf.bundle.min.js dist/html2pdf.bundle.min.js
          # Leaflet ist seit ENT-269 nicht mehr im Einsatz (Google Maps statt
          # Leaflet/OpenStreetMap fuer die Kontrollpunkt-Kartenauswahl,
          # Revision von ENT-248) -- kein Ordner mehr auszuliefern. Google
          # Maps wird per <script src="https://maps.googleapis.com/..."> in
          # dashboard.html selbst geladen, kein lokaler Kopiervorgang noetig.
          cp manifest.json dist/manifest.json
          cp sw.js dist/sw.js
          cp icons/*.png dist/icons/
          # Inter wird seit ENT-223/OP-224 selbst ausgeliefert statt von
          # Google geladen -- dashboard.html verweist per @font-face auf
          # fonts/. Fehlen diese Zeilen, faellt die Schrift live auf den
          # System-Stapel zurueck, und lokal faellt es NICHT auf, weil die
          # Dateien im Arbeitsverzeichnis ja liegen: derselbe Fallstrick wie
          # bei gav.js/zeitwahl.js oben. test_deploy.mjs prueft es seither
          # auch fuer CSS-url(), nicht nur fuer <script src>.
          # inter-LICENSE.txt gehoert mit: Die SIL Open Font License 1.1
          # verlangt, dass die Lizenz die Schrift begleitet.
          cp fonts/*.woff2 dist/fonts/
          cp fonts/inter-LICENSE.txt dist/fonts/inter-LICENSE.txt
          # Hintergrundfoto der Anmeldemaske auf dem Desktop (ENT-392) --
          # per CSS-url() aus app.html geholt, genau derselbe Fallstrick
          # wie bei den Schriftschnitten oben: fehlt die Datei auf dem
          # Server, faellt der Hintergrund lautlos auf die reine
          # Verlaufsflaeche zurueck, lokal faellt es NICHT auf.
          cp img/anmeldung-nacht.webp dist/img/anmeldung-nacht.webp
          cp backend/db.php dist/db.php
          cp backend/ai.php dist/ai.php
          cp backend/planung.php dist/planung.php
          cp backend/kunden.php dist/kunden.php
          cp backend/mitarbeiter.php dist/mitarbeiter.php
          cp backend/layout.php dist/layout.php
          cp backend/anmeldung.php dist/anmeldung.php
          cp backend/zweifaktor.php dist/zweifaktor.php
          cp backend/rechte.php dist/rechte.php
          cp backend/logbuch.php dist/logbuch.php
          cp backend/ereignisse.php dist/ereignisse.php
          cp backend/auslagen.php dist/auslagen.php
          cp backend/rundgang.php dist/rundgang.php
          cp backend/fahrzeug.php dist/fahrzeug.php
          cp backend/geofence_bereich.php dist/geofence_bereich.php
          cp backend/belege.php dist/belege.php
          cp backend/qrrechnung.php dist/qrrechnung.php
          cp backend/produkte.php dist/produkte.php
          cp backend/mailer.php dist/mailer.php
          cp backend/ferien.php dist/ferien.php
          # Schutzeinstellungen (ENT-075). Im Repository heisst die Datei
          # bewusst ohne fuehrenden Punkt -- sonst uebersieht man sie.
          cp htaccess-hostpoint dist/.htaccess
          cp backend/api/*.php dist/api/
          # setup.php / setup.html bewusst NICHT hier -- Ersteinrichtung ist ein
          # einmaliger manueller Upload, damit die Datei nicht bei jedem Push
          # automatisch neu auf den Server kommt.
          #
          # Ab hier kommen alle Werte aus dem vorigen Schritt (EFF_*,
          # UMGEBUNG) -- nicht mehr direkt aus "secrets.", damit es nur EINE
          # Stelle gibt, an der Produktion und Staging auseinandergehalten
          # werden.
          sed -i "s|__DB_HOST__|$EFF_DB_HOST|g" dist/db.php
          sed -i "s|__DB_NAME__|$EFF_DB_NAME|g" dist/db.php
          sed -i "s|__DB_USER__|$EFF_DB_USER|g" dist/db.php
          sed -i "s|__DB_PASS__|$EFF_DB_PASSWORD|g" dist/db.php
          # APP_ENV (ENT-341, Revision): explizite Umgebungskennung statt
          # Ableitung aus dem Hostnamen -- traegt sowohl db.php als auch
          # testumgebung.js, damit Backend und die drei Frontends dieselbe
          # Quelle der Wahrheit verwenden.
          sed -i "s|__APP_ENV__|$UMGEBUNG|g" dist/db.php
          sed -i "s|__APP_ENV__|$UMGEBUNG|g" dist/testumgebung.js
          sed -i "s|__ANTHROPIC_API_KEY__|$EFF_ANTHROPIC_API_KEY|g" dist/ai.php
          # SMTP fuer den Offert-Versand (ENT-192). Bleiben die Secrets ungesetzt,
          # steht weiterhin woertlich "__SMTP_HOST__" usw. in dist/mailer.php --
          # smtp_konfiguriert() erkennt das und meldet "nicht eingerichtet",
          # statt mit einem Platzhalter als Hostnamen zu verbinden. STAGING_SMTP_*
          # sind eigene, von SMTP_* verschiedene Secret-NAMEN (kein struktureller
          # Rueckfall moeglich, siehe ENT-343 Punkt 1) -- tragen aber seit ENT-367
          # dieselben WERTE wie Production: Hostpoint erlaubt kontoweit nur ein
          # kostenloses Postfach auf *.myhostpoint.ch, das bereits produktiv
          # belegt ist, und sop-plattform hat keine eigene Domain. ENT-371
          # bestaetigt das als bewusste, eng begrenzte Ausnahme von der sonst
          # harten Infrastrukturtrennung (ENT-372) -- gilt AUSSCHLIESSLICH
          # fuer SMTP, kein Praezedenzfall fuer DB/FTP/Storage/API-Keys. Die
          # Umleitung auf STAGING_TESTMAIL bleibt die massgebliche
          # Absicherung, siehe unten; mailer.php kennzeichnet den
          # Absendernamen ausserhalb der Produktion zusaetzlich automatisch
          # mit "[STAGING]" (ENT-371 Bedingung 4).
          sed -i "s|__SMTP_HOST__|$EFF_SMTP_HOST|g" dist/mailer.php
          sed -i "s|__SMTP_PORT__|$EFF_SMTP_PORT|g" dist/mailer.php
          sed -i "s|__SMTP_VERSCHLUESSELUNG__|$EFF_SMTP_VERSCHLUESSELUNG|g" dist/mailer.php
          sed -i "s|__SMTP_USER__|$EFF_SMTP_USER|g" dist/mailer.php
          sed -i "s|__SMTP_PASSWORD__|$EFF_SMTP_PASSWORD|g" dist/mailer.php
          sed -i "s|__SMTP_ABSENDER__|$EFF_SMTP_ABSENDER|g" dist/mailer.php
          sed -i "s|__SMTP_ABSENDER_NAME__|$EFF_SMTP_ABSENDER_NAME|g" dist/mailer.php
          # Staging-Mailmodus (ENT-341): Ausserhalb der Produktion leitet
          # mailer.php JEDE Mail auf diese Adresse um -- unabhaengig davon,
          # ueber welches Postfach (siehe SMTP_* oben) sie verschickt wird.
          # Bleibt das Secret in einer Umgebung ungesetzt, steht weiterhin
          # woertlich "__STAGING_TESTMAIL__" in dist/mailer.php -- smtp_ziel()
          # erkennt das und smtp_senden() bricht dann ab, statt irgendwohin
          # zu senden. Fuer main ist EFF_STAGING_TESTMAIL bewusst leer, das
          # ist unschaedlich: ist_produktion() ist dort wahr, smtp_ziel()
          # fragt die Testadresse in diesem Zweig gar nicht erst ab.
          sed -i "s|__STAGING_TESTMAIL__|$EFF_STAGING_TESTMAIL|g" dist/mailer.php
          # Google-Maps-Browserschluessel (ENT-341): eigener Schluessel je
          # Umgebung, in BEIDEN Oberflaechen, die die Karte laden.
          sed -i "s|__MAPS_JS_KEY__|$EFF_MAPS_JS_KEY|g" dist/dashboard.html
          sed -i "s|__MAPS_JS_KEY__|$EFF_MAPS_JS_KEY|g" dist/app.html

      - name: Nach Hostpoint hochladen (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.EFF_HOSTPOINT_FTP_HOST }}
          username: ${{ env.EFF_HOSTPOINT_FTP_USER }}
          password: ${{ env.EFF_HOSTPOINT_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          # Sowohl der produktive FTP-Account (rapport@itufeden.myhostpoint.ch,
          # fest auf /home/itufeden/www/rapport eingeschraenkt) als auch der
          # separate Staging-Account (ENT-341, auf sein eigenes Verzeichnis
          # eingeschraenkt) sind bereits von Hostpoint auf ihr jeweiliges
          # Verzeichnis begrenzt -- daher hier immer nur "/", nicht der volle
          # Pfad. Welcher Account tatsaechlich verwendet wird, entscheidet
          # ausschliesslich der vorige Schritt (EFF_HOSTPOINT_FTP_*), nicht
          # diese Zeile.
          server-dir: /
