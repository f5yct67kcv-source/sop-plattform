            EFF_DB_HOST="$D_DB_HOST"; EFF_DB_NAME="$D_DB_NAME"
            EFF_DB_USER="$D_DB_USER"; EFF_DB_PASSWORD="$D_DB_PASSWORD"
            EFF_HOSTPOINT_FTP_HOST="$D_HOSTPOINT_FTP_HOST"
            EFF_HOSTPOINT_FTP_USER="$D_HOSTPOINT_FTP_USER"
