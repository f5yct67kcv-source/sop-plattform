name: Deploy Rapport-Tool zu Hostpoint

# DREI Laufzeitumgebungen, EIN Workflow (ENT-341, Variante B; um Demo
# erweitert mit ENT-523): main deployt nach Produktion, ein qa-*-Tag nach
# der Staging-Testinstanz, ein demo-*-Tag nach der Demo-Instanz fuer
# Interessenten. Welches GitHub Environment aktiv ist, entscheidet der
# REF, gegen den der Lauf ausgeloest wird -- Kopierliste und Platzhalter-
# Ersetzung bleiben fuer alle drei identisch, nur die WERTE hinter den
# Secret-Namen unterscheiden sich (Settings → Environments in GitHub).
# Das ist der einzige dauerhafte Unterschied zwischen den Umgebungen --
# nicht drei gepflegte Kopien dieses Workflows.
#
# Staging- UND Demo-Secrets tragen durchgehend ein eigenes Praefix
# (STAGING_ bzw. DEMO_) und sind EIGENE, von den Produktions-Namen UND
# voneinander VERSCHIEDENE Secret-Namen -- nicht nur eigene Werte
# desselben Namens in einem eigenen Environment (verschaerft auf Wunsch
# des Projektinhabers, nachdem die erste Fassung nur auf getrennte
# Environments gesetzt hatte). Grund: GitHub faellt bei einem fehlenden
# Environment-Secret still auf ein gleichnamiges Repository-Secret zurueck.
# Mit identischen Namen in mehreren Environments waere ein vergessenes
# Staging- oder Demo-Secret KEIN Fehler, sondern ein STILLER Rueckgriff
# auf die produktive Datenbank oder den produktiven FTP-Account -- der
# Lauf ginge durch, richtete aber moeglicherweise Schaden an der echten
# Anlage an. Mit eigenen Namen gibt es diesen Rueckfall strukturell nicht:
# Ein fehlendes STAGING_DB_HOST oder DEMO_DB_HOST hat keinen gleichnamigen
# Ersatz, sondern ist schlicht leer -- und der erste Schritt unten erkennt
# genau das und bricht den Lauf ab, bevor irgendetwas kopiert oder
# hochgeladen wird. Dieselbe Trennung gilt zwischen Staging und Demo
# UNTEREINANDER (ENT-523-N1): eine Demo-Mail landet nie im
# Staging-Testpostfach und umgekehrt.
#
# Kein dauerhafter Branch "staging" oder "demo" (ENT-372, revidiert
# ENT-341 Punkt 5): Die neue, vom Projektinhaber als "hoechste
# Architekturvorgabe" bezeichnete Regel verlangt, dass main alleinige
# Source of Truth bleibt und kein umgebungsspezifischer Code entstehen
# kann, der spaeter zurueckgemergt werden muesste. Ein beschreibbarer
# Branch waere genau das -- ein Tag ist es strukturell nicht, es laesst
# sich kein Commit "auf" einen Tag pushen. main wird deshalb
# ausschliesslich per Push deployt (immer Production); Staging entsteht
# ausschliesslich durch einen manuellen "Run workflow" gegen einen Tag der
# Form qa-JJJJ-MM-TT-NNN, Demo ausschliesslich gegen einen Tag der Form
# demo-JJJJ-MM-TT-NNN, beide exakt auf einem bestehenden main-Commit.
# github.ref_name liefert in diesem Fall den Tag-Namen -- die
# Umgebungs-Logik weiter unten unterscheidet dadurch zwischen main
# (Production), einem qa-*-Tag (Staging) und einem demo-*-Tag (Demo).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || (startsWith(github.ref_name, 'demo-') && 'demo' || 'staging') }}
    steps:
      - uses: actions/checkout@v4

      # Erster Schritt, bewusst VOR jedem Kopieren oder Hochladen: waehlt
      # anhand des Refs (main-Branch oder qa-*-Tag, ENT-372) den richtigen
      # Satz Secrets und bricht den
      # gesamten Lauf ab, wenn eines der fuer diese Umgebung ERFORDERLICHEN
      # fehlt. "Erforderlich" heisst: ohne diesen Wert liefe die Anwendung
      # gar nicht (DB, FTP-Ziel) oder ein sichtbares Feature bliebe fuer
      # alle kaputt (Maps-Schluessel, Staging-Testadresse). SMTP_* und
      # ANTHROPIC_API_KEY bleiben absichtlich NICHT erforderlich -- beide
      # Funktionen erkennen einen fehlenden Wert bereits selbst und melden
      # "nicht eingerichtet" statt mit einem Platzhalter zu arbeiten
      # (smtp_konfiguriert() in mailer.php, die Leerpruefung in ai.php).
      - name: Umgebung waehlen und erforderliche Secrets pruefen
        env:
          # Produktion -- bestehende Secret-Namen, unveraendert.
          P_DB_HOST: ${{ secrets.DB_HOST }}
          P_DB_NAME: ${{ secrets.DB_NAME }}
          P_DB_USER: ${{ secrets.DB_USER }}
          P_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          P_HOSTPOINT_FTP_HOST: ${{ secrets.HOSTPOINT_FTP_HOST }}
          P_HOSTPOINT_FTP_USER: ${{ secrets.HOSTPOINT_FTP_USER }}
          P_HOSTPOINT_FTP_PASSWORD: ${{ secrets.HOSTPOINT_FTP_PASSWORD }}
          P_SMTP_HOST: ${{ secrets.SMTP_HOST }}
          P_SMTP_PORT: ${{ secrets.SMTP_PORT }}
          P_SMTP_VERSCHLUESSELUNG: ${{ secrets.SMTP_VERSCHLUESSELUNG }}
          P_SMTP_USER: ${{ secrets.SMTP_USER }}
          P_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          P_SMTP_ABSENDER: ${{ secrets.SMTP_ABSENDER }}
          P_SMTP_ABSENDER_NAME: ${{ secrets.SMTP_ABSENDER_NAME }}
          P_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          P_MAPS_JS_KEY: ${{ secrets.MAPS_JS_KEY }}
          # Empfaenger der Demo-Anfragen von der Homepage. Stand bis hierher
          # in der Datenbank (betrieb.email); seit die Homepage auf ihrer
          # eigenen Domain liegt, gibt es dort keine. Gleiche Regel wie bei
          # APP_BASIS_URL: aus dem Deploy, nie aus der Anfrage (ENT-501).
          # NICHT erforderlich -- fehlt der Wert, sagt das Formular
          # ausdruecklich "noch nicht eingerichtet" (503), statt mit einem
          # Platzhalter zu arbeiten.
          P_DEMO_EMPFAENGER: ${{ secrets.DEMO_EMPFAENGER }}
          # Eigener FTP-Zugang fuer guardops.ch, beschraenkt auf
          # /home/itufeden/www/guardops.ch. Eigene Secret-NAMEN aus demselben
          # Grund wie bei Staging (ENT-343 Punkt 1): kein stiller Rueckfall.
          # NICHT erforderlich -- fehlen sie, wird die Homepage-Domain
          # uebersprungen und das Rapport-Tool trotzdem ausgeliefert.
          P_GUARDOPS_FTP_HOST: ${{ secrets.GUARDOPS_FTP_HOST }}
          P_GUARDOPS_FTP_USER: ${{ secrets.GUARDOPS_FTP_USER }}
          P_GUARDOPS_FTP_PASSWORD: ${{ secrets.GUARDOPS_FTP_PASSWORD }}
          # Eigenes Postfach info@guardops.ch fuer die Demo-Anfrage-Mail
          # (ENT-569/OP-569, sop-projekt), statt sie ueber das mit CUPI 24s
          # eigenen Kunden-Mails geteilte Produktions-Postfach zu schicken
          # (ENT-371). Eigene Secret-NAMEN aus demselben Grund wie bei
          # GUARDOPS_FTP_* und Staging (ENT-343 Punkt 1): kein stiller
          # Rueckfall auf die geteilten SMTP_*-Werte. NICHT erforderlich --
          # fehlen sie, bleibt __SMTP_HOST__ im guardops-Buendel unersetzt,
          # smtp_konfiguriert() erkennt das und das Formular sagt "noch
          # nicht eingerichtet" (503), statt lautlos ueber das falsche
          # Postfach zu senden.
          P_GUARDOPS_SMTP_HOST: ${{ secrets.GUARDOPS_SMTP_HOST }}
          P_GUARDOPS_SMTP_PORT: ${{ secrets.GUARDOPS_SMTP_PORT }}
          P_GUARDOPS_SMTP_VERSCHLUESSELUNG: ${{ secrets.GUARDOPS_SMTP_VERSCHLUESSELUNG }}
          P_GUARDOPS_SMTP_USER: ${{ secrets.GUARDOPS_SMTP_USER }}
          P_GUARDOPS_SMTP_PASSWORD: ${{ secrets.GUARDOPS_SMTP_PASSWORD }}
          # Eigener FTP-Zugang fuer betreiber.guardops.ch, beschraenkt auf
          # /home/itufeden/betreiber.guardops.ch (ENT-580, erste Etappe des
          # schrittweisen Umzugs weg von itufeden.myhostpoint.ch). Eigene
          # Secret-NAMEN aus demselben Grund wie bei GUARDOPS_FTP_* und
          # Staging (ENT-343 Punkt 1): kein stiller Rueckfall. NICHT
          # erforderlich -- fehlen sie, wird diese Domain uebersprungen und
          # das Rapport-Tool trotzdem ausgeliefert, genau wie bei
          # GUARDOPS_FTP_* oben.
          P_BETREIBER_FTP_HOST: ${{ secrets.BETREIBER_FTP_HOST }}
          P_BETREIBER_FTP_USER: ${{ secrets.BETREIBER_FTP_USER }}
          P_BETREIBER_FTP_PASSWORD: ${{ secrets.BETREIBER_FTP_PASSWORD }}
          # Eigene Datenbank der Betreiber-Ebene (OP-518): Mandantenstamm,
          # Betreiber-Konten, Support sollen nicht in der Datenbank des
          # ersten Mandanten liegen. Eigener Secret-Name wie BETREIBER_FTP_*
          # oben, kein stiller Rueckfall. NICHT erforderlich -- fehlen sie,
          # faellt betreiber_db() bewusst auf db() zurueck (Kopf von
          # backend/betreiber.php), solange OP-518 offen ist. Nur Production.
          P_BETREIBER_DB_HOST: ${{ secrets.BETREIBER_DB_HOST }}
          P_BETREIBER_DB_NAME: ${{ secrets.BETREIBER_DB_NAME }}
          P_BETREIBER_DB_USER: ${{ secrets.BETREIBER_DB_USER }}
          P_BETREIBER_DB_PASSWORD: ${{ secrets.BETREIBER_DB_PASSWORD }}
          # OP-526: base64(JSON) {"secret_name":"passwort",...}, NICHT roh --
          # sed weiter unten vertraegt kein "&"/"|" in einem Passwort, base64
          # kennt beide nicht (wie VAPID_PRIVATE_PEM_B64, siehe
          # mandant_secrets_tafel_pruefen() in backend/betreiber.php).
          # Erzeugen: base64 -w0 mandant-secrets.json ("-w0": $GITHUB_ENV ist
          # eine KEY=value-Zeile). Leer bleibt kein Fehler, wie P_BETREIBER_DB_*.
          P_MANDANT_SECRETS: ${{ secrets.MANDANT_SECRETS }}
          # Eigener FTP-Zugang fuer portal.guardops.ch, beschraenkt auf
          # /home/itufeden/www/portal.guardops.ch (ENT-580, zweite Etappe
          # des schrittweisen Umzugs). Eigene Secret-NAMEN aus demselben
          # Grund wie bei BETREIBER_FTP_* und Staging (ENT-343 Punkt 1):
          # kein stiller Rueckfall. NICHT erforderlich -- fehlen sie, wird
          # diese Domain uebersprungen und das Rapport-Tool trotzdem
          # ausgeliefert, genau wie bei BETREIBER_FTP_* oben.
          P_PORTAL_FTP_HOST: ${{ secrets.PORTAL_FTP_HOST }}
          P_PORTAL_FTP_USER: ${{ secrets.PORTAL_FTP_USER }}
          P_PORTAL_FTP_PASSWORD: ${{ secrets.PORTAL_FTP_PASSWORD }}
          # Eigener FTP-Zugang fuer cupi24.guardops.ch (ENT-589): CUPI 24
          # ist Mandantin (ENT-568), das Rapport-Tool zieht mit dem vollen
          # Dateiumfang von der geteilten Testadresse
          # rapport.itufeden.myhostpoint.ch auf ihre eigene Adresse um.
          # Eigene Secret-NAMEN aus demselben Grund wie bei PORTAL_FTP_* und
          # Staging (ENT-343 Punkt 1): kein stiller Rueckfall. NICHT
          # erforderlich -- fehlen sie, wird diese Domain uebersprungen und
          # das Rapport-Tool auf der bisherigen Adresse trotzdem
          # ausgeliefert, genau wie bei PORTAL_FTP_* oben.
          P_CUPI24_FTP_HOST: ${{ secrets.CUPI24_FTP_HOST }}
          P_CUPI24_FTP_USER: ${{ secrets.CUPI24_FTP_USER }}
          P_CUPI24_FTP_PASSWORD: ${{ secrets.CUPI24_FTP_PASSWORD }}
          # Staging -- eigene, von Produktion VERSCHIEDENE Secret-Namen.
          S_DB_HOST: ${{ secrets.STAGING_DB_HOST }}
          S_DB_NAME: ${{ secrets.STAGING_DB_NAME }}
          S_DB_USER: ${{ secrets.STAGING_DB_USER }}
          S_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          S_HOSTPOINT_FTP_HOST: ${{ secrets.STAGING_HOSTPOINT_FTP_HOST }}
          S_HOSTPOINT_FTP_USER: ${{ secrets.STAGING_HOSTPOINT_FTP_USER }}
          S_HOSTPOINT_FTP_PASSWORD: ${{ secrets.STAGING_HOSTPOINT_FTP_PASSWORD }}
          S_SMTP_HOST: ${{ secrets.STAGING_SMTP_HOST }}
          S_SMTP_PORT: ${{ secrets.STAGING_SMTP_PORT }}
          S_SMTP_VERSCHLUESSELUNG: ${{ secrets.STAGING_SMTP_VERSCHLUESSELUNG }}
          S_SMTP_USER: ${{ secrets.STAGING_SMTP_USER }}
          S_SMTP_PASSWORD: ${{ secrets.STAGING_SMTP_PASSWORD }}
          S_SMTP_ABSENDER: ${{ secrets.STAGING_SMTP_ABSENDER }}
          S_SMTP_ABSENDER_NAME: ${{ secrets.STAGING_SMTP_ABSENDER_NAME }}
          S_ANTHROPIC_API_KEY: ${{ secrets.STAGING_ANTHROPIC_API_KEY }}
          S_MAPS_JS_KEY: ${{ secrets.STAGING_MAPS_JS_KEY }}
          S_DEMO_EMPFAENGER: ${{ secrets.STAGING_DEMO_EMPFAENGER }}
          S_STAGING_TESTMAIL: ${{ secrets.STAGING_TESTMAIL }}
          # Demo (ENT-523) -- eigene, von Produktion UND Staging
          # VERSCHIEDENE Secret-Namen, dieselbe Begruendung wie bei S_*
          # oben. DEMO_ANTHROPIC_API_KEY ist hier -- anders als bei
          # Produktion und Staging -- ERFORDERLICH: Der Projektinhaber hat
          # sich bewusst fuer eine aktive KI-Funktion in der Demo
          # entschieden (ENT-523-N1), nicht fuer die sonst uebliche
          # "meldet sich selbst als nicht eingerichtet"-Toleranz.
          D_DB_HOST: ${{ secrets.DEMO_DB_HOST }}
          D_DB_NAME: ${{ secrets.DEMO_DB_NAME }}
          D_DB_USER: ${{ secrets.DEMO_DB_USER }}
          D_DB_PASSWORD: ${{ secrets.DEMO_DB_PASSWORD }}
          D_HOSTPOINT_FTP_HOST: ${{ secrets.DEMO_HOSTPOINT_FTP_HOST }}
          D_HOSTPOINT_FTP_USER: ${{ secrets.DEMO_HOSTPOINT_FTP_USER }}
          D_HOSTPOINT_FTP_PASSWORD: ${{ secrets.DEMO_HOSTPOINT_FTP_PASSWORD }}
          D_SMTP_HOST: ${{ secrets.DEMO_SMTP_HOST }}
          D_SMTP_PORT: ${{ secrets.DEMO_SMTP_PORT }}
          D_SMTP_VERSCHLUESSELUNG: ${{ secrets.DEMO_SMTP_VERSCHLUESSELUNG }}
          D_SMTP_USER: ${{ secrets.DEMO_SMTP_USER }}
          D_SMTP_PASSWORD: ${{ secrets.DEMO_SMTP_PASSWORD }}
          D_SMTP_ABSENDER: ${{ secrets.DEMO_SMTP_ABSENDER }}
          D_SMTP_ABSENDER_NAME: ${{ secrets.DEMO_SMTP_ABSENDER_NAME }}
          D_ANTHROPIC_API_KEY: ${{ secrets.DEMO_ANTHROPIC_API_KEY }}
          D_MAPS_JS_KEY: ${{ secrets.DEMO_MAPS_JS_KEY }}
          # Testadresse des Demo-Mailmodus (ENT-523-N1, backend/mailer.php).
          # EIGENES Secret, kein Rueckfall auf STAGING_TESTMAIL -- siehe
          # Begruendung in smtp_ziel().
          D_TESTMAIL: ${{ secrets.DEMO_TESTMAIL }}
          # Zeitgeber-Zugang fuer den naechtlichen Reset (ENT-523 Punkt 3,
          # api/demo_reset.php) -- gleiches Prinzip wie D_PUSH_CRON_SCHLUESSEL
          # weiter unten, nur umgebungsgebunden statt produktionsweit.
          D_RESET_TOKEN: ${{ secrets.DEMO_RESET_TOKEN }}
          # Zeitgeber fuer den Ablauf der Demo-Zugaenge (ENT-600,
          # api/betreiber_demo_ablauf.php). EIGENES Secret und NICHT
          # DEMO_RESET_TOKEN: Jener gilt nur in der Demo-Umgebung, dieser
          # laeuft auf Produktion -- der Betreiber-Bereich steht dort. Wer
          # beide zusammenlegte, haette einen Zeitgeber-Schluessel, der je
          # nach Umgebung etwas anderes oeffnet.
          # Ohne dieses Secret laeuft der Ablauf nicht von selbst; der
          # Endpunkt verlangt dann eine Betreiber-Sitzung und sagt das auch.
          P_DEMO_ABLAUF_TOKEN: ${{ secrets.DEMO_ABLAUF_TOKEN }}
          # Push-Benachrichtigungen (ENT-424). Eigene, von den
          # Production-Namen VERSCHIEDENE Secret-Namen fuer Staging -- kein
          # struktureller Rueckfall moeglich (ENT-343 Punkt 1). Und
          # ausdruecklich EIGENE WERTE: Ein Schluessel, den sich Staging und
          # Produktion teilen, hiesse, dass ein Testversand auf den echten
          # Telefonen klingelt. Dieselbe Begruendung fuer Demo.
          P_VAPID_PRIVATE_PEM_B64: ${{ secrets.VAPID_PRIVATE_PEM_B64 }}
          P_VAPID_KONTAKT: ${{ secrets.VAPID_KONTAKT }}
          P_PUSH_CRON_SCHLUESSEL: ${{ secrets.PUSH_CRON_SCHLUESSEL }}
          S_VAPID_PRIVATE_PEM_B64: ${{ secrets.STAGING_VAPID_PRIVATE_PEM_B64 }}
          S_VAPID_KONTAKT: ${{ secrets.STAGING_VAPID_KONTAKT }}
          S_PUSH_CRON_SCHLUESSEL: ${{ secrets.STAGING_PUSH_CRON_SCHLUESSEL }}
          D_VAPID_PRIVATE_PEM_B64: ${{ secrets.DEMO_VAPID_PRIVATE_PEM_B64 }}
          D_VAPID_KONTAKT: ${{ secrets.DEMO_VAPID_KONTAKT }}
          D_PUSH_CRON_SCHLUESSEL: ${{ secrets.DEMO_PUSH_CRON_SCHLUESSEL }}
          # APNs (ENT-604). NUR Production: Die native Store-App ist EIN
          # Programm mit EINER Bundle-ID, das immer gegen die echte API
          # spricht -- anders als die Web-Bereiche gibt es fuer sie kein
          # Staging/Demo-Gegenstueck, das eine eigene Apple-Freigabe
          # brauchte. Staging/Demo bekommen darum keinen APNs-Schluessel
          # und bleiben bei push_apns_grund() == "kein_schluessel" stehen --
          # das ist dort richtig, nicht luecke.
          P_APNS_KEY_P8_B64: ${{ secrets.APNS_KEY_P8_B64 }}
          P_APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          P_APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
        run: |
          set -euo pipefail

          # Vorab ermitteln, ob der REF ein demo-*-Tag ist (ENT-523) -- eine
          # einzelne case-Zuweisung statt eines Bash-Musterabgleichs mitten
          # in der if/elif-Kette, damit die Kette selbst mit reinem POSIX
          # "[ ]" auskommt, wie der Rest dieses Schritts.
          case "${{ github.ref_name }}" in
            demo-*) IST_DEMO_REF=1 ;;
            *)      IST_DEMO_REF=0 ;;
          esac

          if [ "${{ github.ref_name }}" = "main" ]; then
            UMGEBUNG=production
            EFF_DB_HOST="$P_DB_HOST"; EFF_DB_NAME="$P_DB_NAME"
            EFF_DB_USER="$P_DB_USER"; EFF_DB_PASSWORD="$P_DB_PASSWORD"
            EFF_HOSTPOINT_FTP_HOST="$P_HOSTPOINT_FTP_HOST"
            EFF_HOSTPOINT_FTP_USER="$P_HOSTPOINT_FTP_USER"
            EFF_HOSTPOINT_FTP_PASSWORD="$P_HOSTPOINT_FTP_PASSWORD"
            EFF_SMTP_HOST="$P_SMTP_HOST"; EFF_SMTP_PORT="$P_SMTP_PORT"
            EFF_SMTP_VERSCHLUESSELUNG="$P_SMTP_VERSCHLUESSELUNG"
            EFF_SMTP_USER="$P_SMTP_USER"; EFF_SMTP_PASSWORD="$P_SMTP_PASSWORD"
            EFF_SMTP_ABSENDER="$P_SMTP_ABSENDER"; EFF_SMTP_ABSENDER_NAME="$P_SMTP_ABSENDER_NAME"
            EFF_ANTHROPIC_API_KEY="$P_ANTHROPIC_API_KEY"; EFF_MAPS_JS_KEY="$P_MAPS_JS_KEY"
            EFF_STAGING_TESTMAIL=""
            EFF_DEMO_TESTMAIL=""
            # Nur die Demo-Umgebung kennt einen Reset -- kein Zeitgeber-Zugang
            # ausserhalb von ihr, aus demselben Grund wie EFF_DEMO_TESTMAIL.
            EFF_DEMO_RESET_TOKEN=""
            # Der Ablauf der Demo-Zugaenge laeuft dagegen AUF Produktion --
            # dort steht der Betreiber-Bereich mit dem Register (ENT-600).
            EFF_DEMO_ABLAUF_TOKEN="$P_DEMO_ABLAUF_TOKEN"
            EFF_VAPID_PRIVATE_PEM_B64="$P_VAPID_PRIVATE_PEM_B64"
            EFF_VAPID_KONTAKT="$P_VAPID_KONTAKT"
            EFF_PUSH_CRON_SCHLUESSEL="$P_PUSH_CRON_SCHLUESSEL"
            EFF_APNS_KEY_P8_B64="$P_APNS_KEY_P8_B64"
            EFF_APNS_KEY_ID="$P_APNS_KEY_ID"
            EFF_APNS_TEAM_ID="$P_APNS_TEAM_ID"
            EFF_DEMO_EMPFAENGER="$P_DEMO_EMPFAENGER"
            EFF_GUARDOPS_FTP_HOST="$P_GUARDOPS_FTP_HOST"
            EFF_GUARDOPS_FTP_USER="$P_GUARDOPS_FTP_USER"
            EFF_GUARDOPS_FTP_PASSWORD="$P_GUARDOPS_FTP_PASSWORD"
            EFF_GUARDOPS_SMTP_HOST="$P_GUARDOPS_SMTP_HOST"
            EFF_GUARDOPS_SMTP_PORT="$P_GUARDOPS_SMTP_PORT"
            EFF_GUARDOPS_SMTP_VERSCHLUESSELUNG="$P_GUARDOPS_SMTP_VERSCHLUESSELUNG"
            EFF_GUARDOPS_SMTP_USER="$P_GUARDOPS_SMTP_USER"
            EFF_GUARDOPS_SMTP_PASSWORD="$P_GUARDOPS_SMTP_PASSWORD"
            EFF_BETREIBER_FTP_HOST="$P_BETREIBER_FTP_HOST"
            EFF_BETREIBER_FTP_USER="$P_BETREIBER_FTP_USER"
            EFF_BETREIBER_FTP_PASSWORD="$P_BETREIBER_FTP_PASSWORD"
            # OP-518: bleiben die vier Secrets ungesetzt (die echte zweite
            # Datenbank existiert noch nicht), ist $EFF_BETREIBER_DB_* leer --
            # betreiber_db() faellt dann bewusst auf db() zurueck, siehe
            # Kopf von backend/betreiber.php. Kein Pflichtwert weiter unten,
            # aus demselben Grund wie bei EFF_BETREIBER_FTP_*: ein fehlendes
            # Secret darf den gesamten Deploy nicht rot werden lassen.
            EFF_BETREIBER_DB_HOST="$P_BETREIBER_DB_HOST"
            EFF_BETREIBER_DB_NAME="$P_BETREIBER_DB_NAME"
            EFF_BETREIBER_DB_USER="$P_BETREIBER_DB_USER"
            EFF_BETREIBER_DB_PASSWORD="$P_BETREIBER_DB_PASSWORD"
            # OP-526, wie EFF_BETREIBER_DB_* zwei Zeilen darueber: leer bleibt
            # kein Fehler, mandant_secret() liest das als "kein Secret".
            EFF_MANDANT_SECRETS="$P_MANDANT_SECRETS"
            EFF_PORTAL_FTP_HOST="$P_PORTAL_FTP_HOST"
            EFF_PORTAL_FTP_USER="$P_PORTAL_FTP_USER"
            EFF_PORTAL_FTP_PASSWORD="$P_PORTAL_FTP_PASSWORD"
            EFF_CUPI24_FTP_HOST="$P_CUPI24_FTP_HOST"
            EFF_CUPI24_FTP_USER="$P_CUPI24_FTP_USER"
            EFF_CUPI24_FTP_PASSWORD="$P_CUPI24_FTP_PASSWORD"
            # Eigene Adresse der Anlage (ENT-501, siehe auch APP_ENV oben):
            # steckt in jedem Link, den der Server per E-Mail verschickt.
            # Bis ENT-501 kam sie aus dem Host-Kopf DER ANFRAGE -- ein Angriff
            # ueber die unangemeldeten Endpunkte liess den Server so einen
            # Link auf eine fremde Adresse verschicken. Jetzt traegt der
            # Deploy-Lauf sein eigenes Ziel ein.
            # Kein Secret (oeffentlich, siehe README.md); ueber APP_BASIS_URL
            # ueberschreibbar, sonst gilt die heutige Adresse.
            EFF_APP_BASIS_URL="${{ vars.APP_BASIS_URL }}"
            if [ -z "$EFF_APP_BASIS_URL" ]; then
              EFF_APP_BASIS_URL="https://rapport.itufeden.myhostpoint.ch"
            fi

            PFLICHT_FEHLT=""
            [ -z "$EFF_DB_HOST" ]                && PFLICHT_FEHLT="$PFLICHT_FEHLT DB_HOST"
            [ -z "$EFF_DB_NAME" ]                && PFLICHT_FEHLT="$PFLICHT_FEHLT DB_NAME"
            [ -z "$EFF_DB_USER" ]                && PFLICHT_FEHLT="$PFLICHT_FEHLT DB_USER"
            [ -z "$EFF_DB_PASSWORD" ]            && PFLICHT_FEHLT="$PFLICHT_FEHLT DB_PASSWORD"
