            EFF_SMTP_HOST="$D_SMTP_HOST"; EFF_SMTP_PORT="$D_SMTP_PORT"
            EFF_SMTP_VERSCHLUESSELUNG="$D_SMTP_VERSCHLUESSELUNG"
