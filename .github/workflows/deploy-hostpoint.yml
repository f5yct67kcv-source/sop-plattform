            # weiter unten.
            EFF_DEMO_EMPFAENGER=""
            # guardops.ch ist die ECHTE Verkaufsdomain, nur fuer Production
            # gedacht (siehe Pruefung "beide guardops-Schritte laufen nur auf
            # Production" in test_deploy.mjs). Leer, kein Rueckfall auf die
            # Production-Werte -- dieselbe Begruendung wie im Staging-Zweig.
            EFF_GUARDOPS_FTP_HOST=""
            EFF_GUARDOPS_FTP_USER=""
            EFF_GUARDOPS_FTP_PASSWORD=""
            # Eigenes SMTP-Postfach info@guardops.ch der Demo-Anfrage-Mail
            # (ENT-570) -- wie EFF_GUARDOPS_FTP_* zwei Zeilen darueber nur fuer
            # Production gedacht, dieselbe Begruendung.
            EFF_GUARDOPS_SMTP_HOST=""
            EFF_GUARDOPS_SMTP_PORT=""
            EFF_GUARDOPS_SMTP_VERSCHLUESSELUNG=""
            EFF_GUARDOPS_SMTP_USER=""
            EFF_GUARDOPS_SMTP_PASSWORD=""
            # betreiber.guardops.ch ist wie guardops.ch nur fuer Production
            # gedacht (ENT-580) -- dieselbe Begruendung wie bei
            # EFF_GUARDOPS_FTP_* zwei Absaetze weiter oben.
            EFF_BETREIBER_FTP_HOST=""
            EFF_BETREIBER_FTP_USER=""
            EFF_BETREIBER_FTP_PASSWORD=""
            # Die eigene Datenbank der Betreiber-Ebene (OP-518) ist wie
