name: Demo-Tag schneiden

# Schneidet einen neuen demo-JJJJ-MM-TT-NNN-Tag auf dem aktuellen main-Stand
# und pusht ihn. Das ist ausdruecklich KEINE Aenderung an der Architektur
# aus ENT-372/ENT-523: Demo bleibt ein bewusst eingefrorener Schnappschuss,
# unabhaengig von jedem main-Push -- dieser Workflow ersetzt nur den
# manuellen "git tag && git push" durch einen Knopfdruck.
#
# Grund fuer den eigenen Workflow statt eines lokalen "git push --tags":
# Coding-Agent-Sitzungen (Claude Code) duerfen in dieser Umgebung nur auf
# die ihnen zugewiesenen Branches pushen, keine neuen Tags anlegen -- das
# ist eine Absicherung der Sitzungsumgebung, keine Einschraenkung dieses
# Repos. Ein Workflow-Lauf traegt dagegen sein eigenes GITHUB_TOKEN mit
# Schreibrecht (permissions: contents: write unten), unabhaengig von der
# Sitzung, die ihn ausgeloest hat.
#
# Ablauf nach diesem Lauf: den in "Zusammenfassung" ausgegebenen Tag-Namen
# gegen den Deploy-Workflow (deploy-hostpoint.yml) als REF manuell
# anstossen (workflow_dispatch) -- das erstellt/pusht dieser Workflow
# bewusst NICHT selbst mit, aus demselben Grund wie das getrennte "main
# pusht, Tag deployt nicht automatisch" oben: ein Tag-Push allein loest
# hier nie einen Deploy aus, das bleibt ein zweiter, expliziter Schritt.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Naechsten freien demo-JJJJ-MM-TT-NNN-Namen ermitteln und Tag pushen
        run: |
          set -euo pipefail
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git fetch --tags --force

          HEUTE=$(date -u +%F)
          LETZTER=$(git tag -l "demo-${HEUTE}-*" | sort | tail -1)

          if [ -z "$LETZTER" ]; then
            NUMMER=1
          else
            LFD="${LETZTER#demo-${HEUTE}-}"
            NUMMER=$(( 10#$LFD + 1 ))
          fi
          NNN=$(printf "%03d" "$NUMMER")
          TAG="demo-${HEUTE}-${NNN}"

          echo "Schneide Tag: $TAG (auf $(git rev-parse --short HEAD))"
          git tag -a "$TAG" -m "Demo-Tag automatisch geschnitten (workflow_dispatch, $(date -u +%FT%TZ))"
          git push origin "$TAG"

          echo "### Demo-Tag geschnitten" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$TAG\` auf Commit \`$(git rev-parse --short HEAD)\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Naechster Schritt: **deploy-hostpoint.yml** manuell (workflow_dispatch) gegen diesen Tag als Ref ausloesen -- dieser Lauf deployt noch nichts von selbst." >> "$GITHUB_STEP_SUMMARY"
