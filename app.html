<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<!-- Kein Zoom (ENT-059) -- dieselbe Begruendung wie im Cockpit.
     viewport-fit=cover bleibt: es haelt den Inhalt aus der Notch. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cockpit</title>
<link rel="icon" href="icons/icon-32.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#16181D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ══════════════════════════════════════════════════════════════════
   MITARBEITER-APP — dieselben Farben wie das Dashboard, aber eigener
   Aufbau: grosse Flächen, untere Reiterleiste, dicke Zeitangaben.
   Gedacht für draussen: kurze Blicke, kalte Finger, helles Licht.
   ══════════════════════════════════════════════════════════════════ */

/* Kein Zoom durch Doppeltippen oder Feld-Fokus (ENT-059). */
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
.inp, input, select, textarea { font-size: 16px; }

:root {
  --shell:  #16181D;  --shell-hi: #1E2128;  --shell-line: #272B33;
  --shell-txt: #9298A5; --shell-txt-hi: #F3F5F8;
  --bg: #F4F6F8;  --surface: #FFFFFF;  --line: #E5E8EC;  --line-soft: #EFF1F4;
  --ink: #14161A;  --ink-2: #545B67;  --ink-3: #8B919D;
  --accent: #2F5BD7;  --accent-hi: #2549B0;  --accent-soft: #EDF2FE;  --accent-line: #CBD9F9;
  --pos: #0E7C55;  --pos-soft: #E6F6EF;
  --neg: #C2382A;  --neg-soft: #FCEDEB;
  --warn: #9A6B08; --warn-soft: #FBF3E0;
  --r-sm: 9px; --r: 14px; --r-lg: 20px;
  --sh-1: 0 1px 2px rgba(16,18,22,.06);
  --sh-2: 0 10px 30px -10px rgba(16,18,22,.22);
  --sh-3: 0 -8px 32px -12px rgba(16,18,22,.24);
  --tab-h: 62px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
}
.num, .zeit, b, strong { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
svg.i { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i-sm { width: 17px; height: 17px; }

/* ── Bedienelemente: grosse Ziele, draussen bedienbar */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 18px; border: 1px solid transparent; border-radius: var(--r-sm);
  font: inherit; font-size: 15px; font-weight: 640; cursor: pointer; text-decoration: none;
  transition: background .13s, border-color .13s; white-space: nowrap;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:active { background: var(--accent-hi); }
.btn-plain { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn-plain:active { background: var(--bg); }
.btn-pos { background: var(--pos-soft); color: var(--pos); border-color: #BCE5D3; }
.btn-neg { background: var(--neg-soft); color: var(--neg); border-color: #F3C8C2; }
.btn-wide { width: 100%; }
.btn:disabled { opacity: .5; }
.f { margin-bottom: 16px; }
.f label { display: block; font-size: 12px; font-weight: 660; color: var(--ink-2); letter-spacing: .4px; text-transform: uppercase; margin-bottom: 7px; }
.inp {
  width: 100%; min-height: 48px; border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 12px 14px; font: inherit; font-size: 16px; color: var(--ink);
  background: var(--surface); -webkit-appearance: none; appearance: none;
}
.inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.msg-err { font-size: 14px; color: var(--neg); background: var(--neg-soft); border-radius: var(--r-sm); padding: 11px 13px; margin-bottom: 16px; }

/* Unterschrift: Knopf und Vorschau kommen aus unterschrift.js (ENT-291), das
   auch index.html laedt -- eine Unterschrift, egal ueber welchen Weg. Das
   kleine 160-px-Feld von ENT-082 ist damit entfallen; es war nicht als
   Unterschriftsfeld zu erkennen und viel zu klein zum Schreiben. */

/* ══════════════════════════════════════════ ZUGANG */
#gate { position: fixed; inset: 0; z-index: 900; background: var(--shell); display: flex; flex-direction: column; padding: 28px 22px calc(28px + env(safe-area-inset-bottom)); }
.gate-oben { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.gate-oben img { width: 66px; height: 66px; border-radius: 18px; background: #fff; padding: 5px; margin-bottom: 18px; }
.gate-oben .wm { color: var(--shell-txt-hi); font-size: 26px; font-weight: 700; letter-spacing: -.5px; }
.gate-oben .sub { color: #656B78; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; margin-top: 4px; }
.gate-form { background: var(--surface); border-radius: var(--r-lg); padding: 22px; box-shadow: var(--sh-2); }

/* ══════════════════════════════════════════ GERÜST */
.app { display: none; min-height: 100%; flex-direction: column; }
.app.on { display: flex; }
.kopf {
  background: var(--shell); color: var(--shell-txt-hi);
  padding: calc(14px + env(safe-area-inset-top)) 20px 16px;
  display: flex; align-items: center; gap: 14px;
}
.kopf .wer { flex: 1; min-width: 0; }
.kopf .wer b { display: block; font-size: 17px; font-weight: 680; letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kopf .wer span { font-size: 12.5px; color: var(--shell-txt); }
.kopf .kreis { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex: none; }

.inhalt { flex: 1; padding: 18px 16px calc(var(--tab-h) + 26px + env(safe-area-inset-bottom)); }
.v { display: none; }
.v.on { display: block; animation: auf .18s ease-out; }
@keyframes auf { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.titel { font-size: 13px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--ink-3); margin: 4px 0 12px; }
.titel:not(:first-child) { margin-top: 28px; }

/* ── Untere Reiterleiste */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  background: rgba(255,255,255,.94); backdrop-filter: saturate(180%) blur(14px); -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-top: 1px solid var(--line);
  display: flex; padding-bottom: env(safe-area-inset-bottom);
}
.tabs button {
  flex: 1; min-height: var(--tab-h); border: none; background: transparent; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--ink-3); font: inherit; font-size: 11px; font-weight: 620; padding: 6px 2px;
}
.tabs button.on { color: var(--accent); }
.tabs button .punkt { width: 5px; height: 5px; border-radius: 50%; background: var(--neg); position: absolute; margin: -16px 0 0 18px; }

/* ── Karten */
.karte { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh-1); margin-bottom: 12px; overflow: hidden; }
.karte-bd { padding: 16px; }
/* Abgeschlossene Schicht (ENT-133): auf einen Blick erkennbar, ohne den
   Rapport-Korrekturweg zu sperren -- die Karte bleibt anklickbar. */
.karte.abgeschlossen { border-color: var(--pos); background: var(--pos-soft); }
.karte-haken { position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; border-radius: 50%;
  background: var(--pos); color: #fff; display: flex; align-items: center; justify-content: center; }
.karte-haken svg { width: 14px; height: 14px; stroke-width: 2.6; }
/* Ueberfaelliger Rapport (ENT-134): Schicht seit ueber 2 Std. zu Ende, kein
   eigener Rapport hinterlegt. Warnfarbe statt Fehlerfarbe -- es ist noch kein
   Fehlschlag, nur eine Erinnerung, und die Karte bleibt so anklickbar wie jede
   andere auch. */
.karte.ueberfaellig { border-color: var(--warn); background: var(--warn-soft); }
.karte-warn { position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; border-radius: 50%;
  background: var(--warn); color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 14px; line-height: 1; }

/* ── Schichtkarte: die Zeit ist die wichtigste Angabe */
.schicht { display: block; width: 100%; text-align: left; border: none; background: transparent; font: inherit; color: inherit; cursor: pointer; padding: 0; }
.schicht .oben { display: flex; align-items: flex-start; gap: 14px; padding: 16px; }
.schicht .zeit { font-size: 21px; font-weight: 720; letter-spacing: -.6px; white-space: nowrap; }
.schicht .zeit .folgetag { display: block; font-size: 11px; font-weight: 620; color: var(--ink-3); letter-spacing: 0; }
.schicht .was { flex: 1; min-width: 0; }
.schicht .was b { display: block; font-size: 15.5px; font-weight: 660; }
.schicht .was span { display: block; font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }
.schicht .balken { width: 4px; align-self: stretch; border-radius: 3px; background: var(--accent); flex: none; }
.schicht .balken.prov { background: var(--warn); }
.schicht .balken.ab { background: var(--ink-3); }
.schicht .balken.best { background: var(--pos); }
.fuss { display: flex; align-items: center; gap: 8px; padding: 11px 16px; border-top: 1px solid var(--line-soft); background: #FCFDFE; flex-wrap: wrap; }

.marke { display: inline-flex; align-items: center; gap: 5px; border-radius: 20px; padding: 4px 11px; font-size: 12px; font-weight: 660; white-space: nowrap; }
.m-n { background: var(--line-soft); color: var(--ink-2); }
.m-a { background: var(--accent-soft); color: var(--accent); }
.m-p { background: var(--pos-soft); color: var(--pos); }
.m-w { background: var(--warn-soft); color: var(--warn); }
.m-x { background: var(--neg-soft); color: var(--neg); }

/* ── Tagesüberschrift im Plan */
/* Der Tageskopf muss auch auf 320px halten: der Wochentag wird notfalls
   gekuerzt, die Anzahl rutscht notfalls auf eine zweite Zeile. */
.tag-kopf { display: flex; flex-wrap: wrap; align-items: baseline; gap: 9px; margin: 22px 2px 10px; }
.tag-kopf > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag-kopf .anz { flex: none; margin-left: auto; }
.tag-kopf b { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
.tag-kopf span { font-size: 12.5px; font-weight: 640; letter-spacing: .6px; text-transform: uppercase; color: var(--ink-3); }
.tag-kopf .sp { flex: 1; }

/* ── Sperrtage (ENT-028) */
.sperr-karte { margin-bottom: 8px; }
.sperr-karte.aus { border-color: var(--warn); background: var(--warn-soft); }
.sperr-zeile { display: flex; align-items: center; gap: 13px; width: 100%; padding: 12px 14px;
  border: none; background: none; font-family: inherit; text-align: left; cursor: pointer; min-height: 58px; }
.sperr-zeile .tg { flex: none; width: 46px; }
.sperr-zeile .tg b { display: block; font-size: 14px; font-weight: 700; }
.sperr-zeile .tg span { display: block; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.sperr-zeile .ws { flex: 1; min-width: 0; }
.sperr-zeile .ws b { display: block; font-size: 14.5px; font-weight: 640; }
.sperr-zeile .ws span { display: block; font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sperr-zeile .ws .warn { color: var(--warn); font-weight: 620; }
/* Der Schalter zeigt den Zustand, ohne dass man den Text lesen muss. */
.schalter { flex: none; width: 48px; height: 28px; border-radius: 999px; background: var(--line); position: relative; transition: background .18s; }
.schalter i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
  background: #fff; box-shadow: var(--sh-1); transition: transform .18s; }
.schalter.an { background: var(--warn); }
.schalter.an i { transform: translateX(20px); }
.sperr-notiz { display: flex; align-items: center; gap: 7px; width: 100%; padding: 10px 14px;
  border: none; border-top: 1px solid rgba(154,107,8,.22); background: none; font-family: inherit;
  font-size: 12.5px; font-weight: 620; color: var(--warn); cursor: pointer; min-height: 42px; }
@media (prefers-reduced-motion: reduce) { .schalter, .schalter i { transition: none; } }

/* ── Leerzustand */
.leer { text-align: center; padding: 46px 22px; }
.leer .ic { width: 52px; height: 52px; border-radius: 16px; background: var(--line-soft); color: var(--ink-3); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px; }
.leer h3 { font-size: 16px; font-weight: 660; margin-bottom: 6px; }
.leer p { font-size: 14px; color: var(--ink-3); line-height: 1.6; }

/* ── Kennzahl-Paar */
.zahlen { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.zahl { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 15px 16px; box-shadow: var(--sh-1); }
.zahl b { display: block; font-size: 25px; font-weight: 720; letter-spacing: -.8px; line-height: 1.15; }
.zahl span { font-size: 11.5px; font-weight: 650; letter-spacing: .5px; text-transform: uppercase; color: var(--ink-3); }
.zahl { position: relative; }
/* Fragezeichen in der Ecke der Zeitbonus-Kachel (ENT-052). Bewusst gross
   genug zum Antippen (42 px), auch wenn das Symbol darin klein ist -- eine
   30-Pixel-Flaeche trifft auf dem Handy niemand zuverlaessig. */
.zahl-info {
  position: absolute; top: 3px; right: 3px; width: 42px; height: 42px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: none; padding: 0; border-radius: 50%;
  color: var(--ink-3); cursor: pointer;
}
.zahl-info:active { background: var(--line-soft); }
/* Hinweis auf noch nicht abgeglichene Schichten (ENT-053). Bewusst in
   ruhigem Grau und nicht in Warnfarbe: Im laufenden Monat ist ein offener
   Abgleich der Normalfall, keine Stoerung. */
.offen-hinweis {
  font-size: 13px; line-height: 1.4; color: var(--ink-3);
  padding: 10px 14px; margin-bottom: 12px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); box-shadow: var(--sh-1);
}
.zahl-info svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ── Angabenliste */
.dl { display: grid; grid-template-columns: 40% 1fr; gap: 0 12px; }
.dl dt { font-size: 12px; font-weight: 650; letter-spacing: .3px; text-transform: uppercase; color: var(--ink-3); padding: 11px 0; border-bottom: 1px solid var(--line-soft); }
.dl dd { font-size: 15px; font-weight: 550; padding: 11px 0; border-bottom: 1px solid var(--line-soft); word-break: break-word; }
.dl dt:last-of-type, .dl dd:last-of-type { border-bottom: none; }

/* Unterlagen zur Schicht (ENT-117). Ganze Zeile als Trefferfläche und
   mindestens 44 px hoch -- am Bauzaun wird das mit Handschuhen getippt. */
/* Wer sonst eingeteilt ist (ENT-121). Der Aufklapper ist ein Bedienelement
   auf einem Telefon und haelt die Trefferflaeche von 44 px ein. */
.team-auf { display: inline-flex; align-items: center; gap: 7px; min-height: 44px;
  padding: 0; border: none; background: none; color: var(--ink); font: inherit;
  font-size: 13.5px; font-weight: 550; cursor: pointer; text-align: left; }
.team-pfeil { width: 15px; height: 15px; flex: none; stroke: currentColor; stroke-width: 2;
  fill: none; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s; }
.team-auf[aria-expanded="true"] .team-pfeil { transform: rotate(180deg); }
.team-liste { display: none; margin: 0 0 6px; padding: 0; list-style: none; }
.team-liste.auf { display: block; }
.team-liste li { font-size: 13.5px; padding: 5px 0 5px 13px; position: relative; color: var(--ink); }
/* Punkt statt Aufzaehlungszeichen -- die Liste steht in einer Datenzeile und
   soll nicht wie ein eigener Absatz wirken. */
.team-liste li::before { content: ''; position: absolute; left: 0; top: 12px;
  width: 4px; height: 4px; border-radius: 50%; background: var(--ink-3); }
.team-liste li.ich { font-weight: 650; }
.team-du { font-size: 11.5px; color: var(--ink-3); font-weight: 500; }

/* Der Routenknopf steht in der Adresszeile und ist ein echtes Bedienelement
   auf einem Telefon -- 44 px Trefferflaeche wie jedes andere auch. */
.route-knopf { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px;
  min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); color: var(--ink); font-size: 13.5px; font-weight: 620;
  text-decoration: none; }
.route-knopf:active { background: var(--flaeche-2, rgba(127,127,127,.12)); }
.route-i { width: 15px; height: 15px; flex: none; stroke: currentColor; stroke-width: 1.9;
  fill: none; stroke-linecap: round; stroke-linejoin: round; }

.dok-kopf { font-size: 12px; font-weight: 650; letter-spacing: .3px; text-transform: uppercase;
  color: var(--ink-3); margin: 18px 0 8px; }
.dok-liste { display: flex; flex-direction: column; gap: 8px; }
.dok-zeile { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 48px;
  padding: 11px 13px; text-align: left; font: inherit; font-size: 15px; font-weight: 550;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-sm); cursor: pointer; }
.dok-zeile:active { background: var(--accent-soft); border-color: var(--accent-line); }
.dok-zeile .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dok-zeile .gr { flex: none; font-size: 12.5px; font-weight: 550; color: var(--ink-3); }

/* Rundgang-Checkliste (Revierdienst-Tool V3, ENT-180/182/145). Die Knoepfe
   nutzen bewusst die bestehende .btn-Klasse, nicht eine eigene Groesse -- sie
   erben damit dieselbe, bereits als OP-111 festgehaltene 44px-Luecke wie der
   Rest der App, statt einer neuen Inkonsistenz (dieser eine Bildschirm
   44px, alle anderen nicht). Die Korrektur ist app-weit, keine Sache dieses
   Bildschirms allein. */
.rd-zeile { padding: 14px 0; border-bottom: 1px solid var(--line-soft); }
.rd-zeile:last-child { border-bottom: none; }
.rd-kopf { display: flex; align-items: flex-start; gap: 11px; }
.rd-nr { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--line-soft);
  color: var(--ink-2); font-size: 12.5px; font-weight: 700; display: flex;
  align-items: center; justify-content: center; }
.rd-fertig .rd-nr { background: var(--pos-soft); color: var(--pos); }
.rd-txt { flex: 1; min-width: 0; }
.rd-bez { font-size: 15px; font-weight: 620; }
.rd-meta { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.rd-fertig { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.rd-haken { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--pos-soft);
  color: var(--pos); display: flex; align-items: center; justify-content: center; font-weight: 700; }
.rd-haken-nv { background: var(--warn-soft); color: var(--warn); }
.rd-haken-es { background: var(--accent-soft); color: var(--accent); font-size: 13px; }
.rd-es-vorschau { max-width: 140px; border-radius: 8px; align-self: flex-start; }
.rd-hinweis { font-size: 12.5px; color: var(--ink-3); margin: 8px 0 0 37px; }
.rd-akt { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0 37px; }
.rd-nv { margin: 10px 0 0 37px; display: flex; flex-direction: column; gap: 8px; }
.rd-nv .inp { margin: 0; }

/* Antippbare Zeile, die eine Unterseite oeffnet (ENT-051). Sieht aus wie ein
   Eintrag, verhaelt sich wie ein Knopf -- darum ein <button>, kein <div> mit
   onclick: nur so ist sie mit der Tastatur und mit Vorlesehilfen erreichbar. */
.nav-zeile {
  display: flex; align-items: center; gap: 13px; width: 100%;
  padding: 16px; background: none; border: none; font: inherit;
  text-align: left; color: inherit; cursor: pointer; min-height: 60px;
}
.nav-zeile:active { background: var(--line-soft); }
.nav-zeile .txt { flex: 1; min-width: 0; }
.nav-zeile .txt b { display: block; font-size: 15px; font-weight: 650; letter-spacing: -.1px; }
.nav-zeile .txt span { display: block; font-size: 13px; color: var(--ink-3); margin-top: 2px; }
.nav-zeile .chev { flex: none; width: 18px; height: 18px; stroke: var(--ink-3); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.seiten-kopf { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.seiten-kopf h2 { font-size: 19px; font-weight: 700; letter-spacing: -.3px; }

/* ── Blatt von unten (Schichtdetail, Passwort) */
.abdunkeln { position: fixed; inset: 0; z-index: 60; background: rgba(16,18,22,.45); opacity: 0; pointer-events: none; transition: opacity .2s; }
.abdunkeln.on { opacity: 1; pointer-events: auto; }
/* Volle Hoehe seit ENT-121. Vorher standen oben rund 12 vh ungenutzt --
   ausgerechnet in der Ansicht, in der am meisten steht (Zeit, Kunde, Ort,
   Route, Unterlagen, Team, Rapport, Rueckmeldung).
   top/bottom statt einer vh-Angabe: Auf dem Telefon wandert die Adressleiste
   beim Scrollen, und 100vh ist dann groesser als das, was man sieht -- der
   Fussbereich mit den Knoepfen rutscht unter den Rand. Mit top: 0 und
   bottom: 0 rechnet der Browser selbst.
   Die Polsterung oben haelt den Griff aus der Statusleiste und der Kamera. */
.blatt {
  position: fixed; left: 0; right: 0; top: 0; bottom: 0; z-index: 61;
  padding-top: env(safe-area-inset-top);
  background: var(--surface); box-shadow: var(--sh-3);
  transform: translateY(100%); transition: transform .24s cubic-bezier(.32,.72,0,1);
  display: flex; flex-direction: column;
}
.blatt.on { transform: none; }
.blatt-griff { padding: 10px 0 4px; display: flex; justify-content: center; flex: none; }
.blatt-griff i { width: 38px; height: 4px; border-radius: 3px; background: var(--line); display: block; }
.blatt-kopf { display: flex; align-items: center; gap: 12px; padding: 6px 20px 14px; border-bottom: 1px solid var(--line-soft); flex: none; }
.blatt-kopf h2 { font-size: 18px; font-weight: 680; letter-spacing: -.3px; flex: 1; min-width: 0; }
.blatt-bd { padding: 18px 20px; overflow-y: auto; flex: 1; }
.blatt-ft { padding: 14px 20px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line-soft); display: flex; gap: 10px; flex: none; }
.blatt-ft .btn { flex: 1; }
/* Beantworteter Zustand (ENT-120): erst die Aussage, darunter die Knoepfe.
   Ueberschrift oben, Wert darunter -- und die Knoepfe stehen nebeneinander,
   damit keiner allein ueber die volle Breite gezogen wird. */
.blatt-ft.gestapelt { flex-direction: column; align-items: stretch; gap: 12px; }
.blatt-ft .ft-stand { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.blatt-ft .ft-txt { font-size: 12.5px; color: var(--ink-3); line-height: 1.5; flex: 1 1 160px; }
.blatt-ft .ft-reihe { display: flex; gap: 10px; }

/* ── Hinweis */
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(var(--tab-h) + 18px + env(safe-area-inset-bottom)); background: var(--shell); color: #fff; padding: 13px 18px; border-radius: var(--r-sm); font-size: 14.5px; font-weight: 560; box-shadow: var(--sh-2); z-index: 200; opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity .18s, transform .18s; text-align: center; }
.toast.on { opacity: 1; transform: none; }

/* ── Skelett */
.sk { background: linear-gradient(90deg, var(--line-soft) 25%, #E4E7EC 50%, var(--line-soft) 75%); background-size: 200% 100%; animation: sh 1.3s infinite; border-radius: var(--r-sm); }
@keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ── Kacheln fuer Menue/Waechter (ENT-234). Optisch identisch zum
   .bk-kachel-Muster aus dashboard.html (Betrieb-Uebersicht, ENT-161) --
   eigener Klassenpraefix, weil beide Dateien getrennte Stylesheets sind,
   dieselben Farb-/Abstands-Werte wie dort. */
.mk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 14px; margin-bottom: 20px; }
.mk-kachel { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh-1);
  padding: 22px 14px; min-height: 132px; width: 100%; cursor: pointer; font: inherit; color: inherit; }
.mk-kachel:active { background: var(--accent-soft); border-color: var(--accent-line); }
.mk-kachel:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mk-kachel-ic { width: 56px; height: 56px; border-radius: 14px; background: var(--accent-soft);
  color: var(--accent); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.mk-kachel-ic svg.i { width: 28px; height: 28px; }
.mk-kachel-lbl { font-size: 13.5px; font-weight: 600; line-height: 1.35; }

/* ── Unterreiter (ENT-234: Plan + Sperren in einem Reiter). Gleiche
   Trefferflaeche wie ein Hauptreiter (44px), aber schmaler und ohne
   Icon -- sichtbar nur unterhalb von "Plan", nicht Teil der globalen
   Tab-Leiste. */
.unterreiter { display: flex; gap: 6px; margin-bottom: 16px; background: var(--line-soft); border-radius: var(--r-sm); padding: 4px; }
.unterreiter button { flex: 1; min-height: 40px; border: none; border-radius: calc(var(--r-sm) - 3px); background: none;
  font: inherit; font-size: 14px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.unterreiter button.on { background: var(--surface); color: var(--ink); box-shadow: var(--sh-1); }

/* ── Hinweis-Chip bei aktivem/pausiertem Rundgang auf "Heute" (ENT-234).
   Fuehrt mit einem Tipp direkt zurueck in die Checkliste, ohne den Weg
   ueber "Wächter" -- waehrend eine Runde laeuft, zaehlt jeder Kontrollpunkt-
   Scan, nicht die Navigation dorthin. */
.rd-chip { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 56px; padding: 12px 16px;
  margin-bottom: 14px; background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: var(--r);
  font: inherit; color: var(--ink); cursor: pointer; text-align: left; }
.rd-chip-ic { flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center; }
.rd-chip-txt { flex: 1; min-width: 0; }
.rd-chip-txt b { display: block; font-size: 14px; font-weight: 650; }
.rd-chip-txt span { display: block; font-size: 12.5px; color: var(--ink-2); margin-top: 1px; }
.rd-chip .chev { flex: none; width: 18px; height: 18px; stroke: var(--ink-3); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

@media (min-width: 700px) {
  /* Auf grösseren Geräten mittig halten statt in die Breite ziehen */
  .app { max-width: 560px; margin: 0 auto; box-shadow: 0 0 0 1px var(--line); min-height: 100vh; }
  .tabs { max-width: 560px; left: 50%; transform: translateX(-50%); }
  .blatt { max-width: 560px; left: 50%; transform: translateX(-50%) translateY(100%); }
  .blatt.on { transform: translateX(-50%); }
  .toast { max-width: 528px; left: 50%; transform: translateX(-50%) translateY(8px); }
  .toast.on { transform: translateX(-50%); }
}
</style>

let token = localStorage.getItem('rv3_token') || '';
let ich = JSON.parse(localStorage.getItem('rv3_user') || 'null');
let schichten = [];
let rapporte = [];
let sperrtage = {};   // Datum -> Bemerkung (ENT-028)
let meineAbwesenheiten = [];   // eigene Abwesenheitsantraege (ENT-255)
let profil = null;
// Die frühere Monatssumme aus den Rapporten ist entfallen (ENT-049): der
// Rapport kennt die tatsächliche Pausenabrechnung noch nicht, die entsteht
// erst im Abgleich. Zwei Stundenzahlen für denselben Monat wären für
// Mitarbeitende nicht auflösbar gewesen.

let blattId = null;
// Rundgang-Durchfuehrung (ENT-180/182/145): der aktuell in der Checkliste

// ── Hilfen
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (n, d) => Number(n || 0).toLocaleString('de-CH', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
const dmy = d => d ? String(d).slice(0, 10).split('-').reverse().join('.') : '–';
const hm = t => t ? String(t).slice(0, 5) : '';
const tagVon = e => String(e.datum || '').slice(0, 10);
const isoTag = d => { d = d || new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const ueberNacht = e => hm(e.bis) <= hm(e.von);

function initialen(s) {
  const p = String(s || '').replace(/[._-]+/g, ' ').trim().split(/\s+/).filter(Boolean);
  return ((p[0] || '?')[0] + (p[1] ? p[1][0] : '')).toUpperCase();
}
function vollerName(o) {
  const n = [o.vorname, o.nachname].filter(Boolean).join(' ').trim();
  return n || o.name || '';
}
function toast(text) {
  const el = $('toast'); el.textContent = text; el.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2800);
}
// Zeitfenster einer Schicht. Endet sie vor ihrem Beginn, läuft sie über
// Mitternacht in den Folgetag.
function spanne(datum, von, bis) {
  const tag = String(datum || '').slice(0, 10);
  const a = Date.parse(tag + 'T' + hm(von) + ':00');
  let b = Date.parse(tag + 'T' + hm(bis) + ':00');
  if (isNaN(a) || isNaN(b)) return null;
  if (b <= a) b += 864e5;
  return [a, b];
}

function api(pfad, opts) {
  opts = opts || {};
  const kopf = { 'Content-Type': 'application/json' };
  if (token) kopf['X-Auth-Token'] = token;
  return fetch(API + pfad, {
    method: opts.method || 'GET', headers: kopf,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(r => r.json().then(data => ({ ok: r.ok, status: r.status, data })).catch(() => ({ ok: false, status: r.status, data: {} })))
    .catch(() => ({ ok: false, status: 0, data: {} }));
}

// ══════════════════════════════════════════ ZUGANG
function anmelden() {
  const name = $('gName').value.trim(), pass = $('gPass').value;
  const err = $('gErr'); err.style.display = 'none';
  if (!name || !pass) { err.textContent = w('beidesNoetig'); err.style.display = ''; return; }
  const b = $('gBtn'); b.disabled = true;
  api('login.php', { method: 'POST', body: { name, password: pass } }).then(({ ok, data }) => {
    b.disabled = false;
    if (!ok || data.status !== 'ok') { err.textContent = data.message || w('fehlerAnmeldung'); err.style.display = ''; return; }
    token = data.token;
    ich = { name: data.name, ist_admin: data.ist_admin };
    localStorage.setItem('rv3_token', token);
    localStorage.setItem('rv3_user', JSON.stringify(ich));
    starten();
  });
}
function abmelden() {
  api('logout.php', { method: 'POST' });
  localStorage.removeItem('rv3_token'); localStorage.removeItem('rv3_user');
  location.reload();
}
function starten() {
  $('gate').style.display = 'none';
  $('app').classList.add('on');
  $('kName').textContent = ich.name;
  $('kKreis').textContent = initialen(ich.name);
  allesLaden();
  // Ueberlebt einen Geraeteneustart oder App-Neuinstallation zwischen den
  // Sitzungen: liegen aus einer frueheren, offline gebliebenen Rundgang-
  // Meldung noch Eintraege in localStorage, wird jetzt ein Sendeversuch
  // unternommen (ENT-132 Punkt 5).
  rdWarteschlangeSenden();
}

// ══════════════════════════════════════════ LADEN
function allesLaden() {
  const b = $('kLaden'); b.disabled = true;
  const heute = new Date();
  $('kDatum').textContent = WOCHENTAG[heute.getDay()] + ', ' + dmy(isoTag(heute));
  return Promise.all([ladeSchichten(), ladeProfil(), ladeRapporte(), ladeSperren(), ladeAbwesenheiten()])
    .then(() => { b.disabled = false; waechterTabAktualisieren(); zeichne(); });
}

// ENT-234, seit ENT-284 umgestellt: "Wächter" erscheint nur mit der
// ausdrücklich gesetzten Berechtigung (Mitarbeiter-Akte, Personal/
// Verwaltung) -- nicht mehr aus der Schicht-Historie hergeleitet. Der
// alte Weg (irgendeine geladene Schicht mit Kontrollpunkten) brach genau
// dann, wenn jemand spontan eine Runde an einem Objekt laufen wollte, dem
// er (noch) nicht zugeteilt war (ENT-282 "unabhängig von den Schichten") --
// ohne eine geladene Schicht blieb der Reiter unerreichbar, gerade im
// Moment, in dem die spontane Übersicht ihn gebraucht hätte.
function waechterSichtbar() {
  return !!(profil && profil.revierdienst_berechtigt);
}
function waechterTabAktualisieren() {
  const sichtbar = waechterSichtbar();
  $('t-waechter').style.display = sichtbar ? '' : 'none';
  if (!sichtbar && reiter === 'waechter') zeige('heute');
}
function ladeSchichten() {
  return api('meine_schichten.php').then(({ ok, status, data }) => {
    if (status === 401) return abmelden();
    schichten = (ok && data.status === 'ok') ? (data.schichten || []) : [];
  });
}
function ladeProfil() {
  return api('mein_profil.php').then(({ ok, data }) => {
    if (ok && data.status === 'ok') { profil = data.profil; }
  });
}
function ladeRapporte() {
  return api('rapport_list.php').then(({ ok, data }) => {
    rapporte = (ok && data.status === 'ok') ? (data.rapporte || []) : [];
  });
}

function zeige(r) {
  reiter = r;

  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('on'));
  $('v-' + r).classList.add('on');

}
function zeichne() {
  beschriften();

  if (reiter === 'rapport') zeichneRapport();

}

const LEER = (t, p, ic) => `<div class="karte"><div class="leer">
  <div class="ic"><svg class="i" viewBox="0 0 24 24">${ic || '<circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'}</svg></div>
  <h3>${esc(t)}</h3><p>${esc(p)}</p></div></div>`;

const STATUS_MARKE = {
  geplant: ['geplant', 'm-n'], bestaetigt: ['bestaetigt', 'm-p'],
  provisorisch: ['provisorisch', 'm-w'], abgesagt: ['abgesagt', 'm-x'],
  // ENT-128: vom Server gesetzt, sobald alle zugesagten Personen rapportiert
  // haben -- dieselbe Bedeutung wie im Dashboard, eigene Kopie, weil app.html
  // seine Markierungen unabhaengig fuehrt.
  abgeschlossen: ['abgeschlossen', 'm-p'],
};
const ZUSAGE_MARKE = { zugesagt: ['zugesagt', 'm-p'], abgelehnt: ['abgelehnt', 'm-x'], offen: ['offen', 'm-n'] };

// Eine Schichtkarte. Die Zeit steht vorne und gross -- danach wird draussen
// zuerst gesucht.
function schichtKarte(e, mitDatum) {
  const abgeschlossen = e.status === 'abgeschlossen';
  const ueberfaellig = !abgeschlossen && schichtUeberfaellig(e);
  const bal = e.status === 'abgesagt' ? 'ab' : (e.status === 'provisorisch' ? 'prov' : (e.status === 'bestaetigt' || abgeschlossen ? 'best' : ''));
  const st = STATUS_MARKE[e.status] || STATUS_MARKE.geplant;
  const zu = ZUSAGE_MARKE[e.zusage] || ZUSAGE_MARKE.offen;
  // Der eigene Rapport, sofern schon eingereicht (ENT-133) -- derselbe
  // Abgleich wie im Schichtblatt, nur zusaetzlich schon auf der Karte
  // sichtbar, ohne dafuer erst hineinklicken zu muessen.
  const rap = abgeschlossen ? rapportFuerSchicht(e.id) : null;
  return `<div class="karte${abgeschlossen ? ' abgeschlossen' : ''}${ueberfaellig ? ' ueberfaellig' : ''}">
    ${abgeschlossen ? `<div class="karte-haken" aria-hidden="true" title="${esc(w(st[0]))}">
      <svg class="i" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>` : ''}
    ${ueberfaellig ? `<div class="karte-warn" aria-hidden="true" title="${esc(w('rapportUeberfaellig'))}">⚠️</div>` : ''}
    <button class="schicht" onclick="blattAuf(${Number(e.id)})">
      <div class="oben">
        <span class="balken ${bal}"></span>
        <span class="zeit">${hm(e.von)}<br>${hm(e.bis)}${ueberNacht(e) ? `<span class="folgetag">${esc(w('folgetag'))}</span>` : ''}</span>
        <span class="was">
          <b>${esc(e.titel || e.kunde_name)}</b>
          <span>${esc(e.ort)}${e.strasse ? ' · ' + esc(e.strasse) : ''}</span>
          ${mitDatum ? `<span>${esc(WOCHENTAG[new Date(tagVon(e) + 'T12:00:00').getDay()])}, ${dmy(e.datum)}</span>` : ''}
        </span>
      </div>
    </button>
    <div class="fuss">
      <span class="marke ${st[1]}">${esc(w(st[0]))}</span>
      ${e.status !== 'abgesagt' ? `<span class="marke ${zu[1]}">${esc(w(zu[0]))}</span>` : ''}
      ${Number(e.im_team) > 1 ? `<span class="marke m-n">${Number(e.im_team)} ${esc(w('imTeam'))}</span>` : ''}
      ${rap ? `<span class="marke m-n">${esc(w('schonRapportiert'))} ${dmy(rap.erfasst_am)}, ${String(rap.erfasst_am).slice(11, 16)}</span>` : ''}
      ${ueberfaellig ? `<span class="marke m-w">${esc(w('rapportUeberfaellig'))}</span>` : ''}
    </div>
  </div>`;
}

// Hinweis-Chip bei aktivem/pausiertem Rundgang (ENT-234) -- fuehrt direkt
// zurueck in die Checkliste, ohne den Umweg ueber "Wächter". rundgangAktiv
// existiert nur innerhalb der laufenden Sitzung (gesetzt beim Start/
// Fortsetzen), das reicht fuer den Zweck: schneller Wiedereinstieg waehrend
// desselben App-Aufenthalts, kein zusaetzlicher Serveraufruf bei jedem Laden.
function rundgangChipHtml() {
  if (!rundgangAktiv || rundgangAktiv.status === 'abgebrochen' || rundgangAktiv.status === 'abgeschlossen') return '';
  const kps = rundgangAktiv.kontrollpunkte || [];
  const erledigt = kps.filter(k => k.erledigt).length;
  const pausiert = rundgangAktiv.status === 'pausiert';
  return `<button type="button" class="rd-chip" onclick="rundgangAnzeigen(${Number(rundgangAktiv.einsatz_id)})">
    <span class="rd-chip-ic"><svg class="i i-sm" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M12 19h4a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2H8a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h4"/></svg></span>
    <span class="rd-chip-txt">
      <b>${esc(pausiert ? w('rundgangChipPausiert') : w('rundgangChipLaeuft'))}</b>
      <span>${erledigt} ${esc(w('von'))} ${kps.length} ${esc(w('erledigt'))}</span>
    </span>
    <svg class="chev" viewBox="0 0 24 24"><polyline points="9 5 16 12 9 19"/></svg>
  </button>`;
}

// ══════════════════════════════════════════ HEUTE
function zeichneHeute() {
  const heute = isoTag();
  const jetzt = Date.now();
  // Eine Nachtschicht von gestern gehört noch zu heute, solange sie läuft.
  const laufend = schichten.filter(e => {
    const sp = spanne(e.datum, e.von, e.bis);
    return sp && sp[0] <= jetzt && jetzt < sp[1];
  });
  const heutige = schichten.filter(e => tagVon(e) === heute);
  const zeigen = [...new Set([...laufend, ...heutige])]
    .sort((a, b) => (spanne(a.datum, a.von, a.bis) || [0])[0] - (spanne(b.datum, b.von, b.bis) || [0])[0]);

  let html = rundgangChipHtml();
  if (!zeigen.length) {
    html += LEER(w('keineHeute'), w('keineHeuteText'), '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>');
    const naechste = schichten
      .filter(e => e.status !== 'abgesagt' && (spanne(e.datum, e.von, e.bis) || [0])[0] > jetzt)
      .sort((a, b) => (spanne(a.datum, a.von, a.bis) || [0])[0] - (spanne(b.datum, b.von, b.bis) || [0])[0])[0];
    if (naechste) html += `<div class="titel">${esc(w('naechste'))}</div>` + schichtKarte(naechste, true);
  } else {
    zeigen.forEach(e => {
      const sp = spanne(e.datum, e.von, e.bis);
      const laeuft = sp && sp[0] <= jetzt && jetzt < sp[1];
      const bald = sp && sp[0] > jetzt && sp[0] - jetzt < 3 * 3600e3;
      if (laeuft) html += `<div class="titel" style="color:var(--pos)">● ${esc(w('jetztLaeuft'))}</div>`;
      else if (bald) html += `<div class="titel" style="color:var(--accent)">${esc(w('gleich'))}</div>`;
      html += schichtKarte(e, tagVon(e) !== heute);
    });
  }
  $('v-heute').innerHTML = html;
}

// ══════════════════════════════════════════ PLAN
// ENT-234: Plan + Sperren in einem Reiter mit Unterreitern. zeichnePlan()
// baut nur noch die Huelle (Unterreiter-Leiste + zwei Container); der
// eigentliche Aufbau steht unveraendert in zeichnePlanListe() (frueher
// zeichnePlan()) und in zeichneSperren() -- beide zielen jetzt auf die
// beiden neuen Container statt auf eigene Hauptreiter.
let planUnter = 'plan';
function planUnterWahl(u) {
  planUnter = u;
  $('pu-plan').classList.toggle('on', u === 'plan');
  $('pu-sperren').classList.toggle('on', u === 'sperren');
  $('pu-abwesenheit').classList.toggle('on', u === 'abwesenheit');
  $('plan-inhalt-plan').style.display = u === 'plan' ? '' : 'none';
  $('plan-inhalt-sperren').style.display = u === 'sperren' ? '' : 'none';
  $('plan-inhalt-abwesenheit').style.display = u === 'abwesenheit' ? '' : 'none';
}
function zeichnePlan() {
  $('v-plan').innerHTML = `
    <div class="unterreiter">
      <button id="pu-plan" class="${planUnter === 'plan' ? 'on' : ''}" onclick="planUnterWahl('plan')">${esc(w('plan'))}</button>
      <button id="pu-sperren" class="${planUnter === 'sperren' ? 'on' : ''}" onclick="planUnterWahl('sperren')">${esc(w('sperren'))}</button>
      <button id="pu-abwesenheit" class="${planUnter === 'abwesenheit' ? 'on' : ''}" onclick="planUnterWahl('abwesenheit')">${esc(w('abwesenheit'))}</button>
    </div>
    <div id="plan-inhalt-plan" style="${planUnter === 'plan' ? '' : 'display:none'}"></div>
    <div id="plan-inhalt-sperren" style="${planUnter === 'sperren' ? '' : 'display:none'}"></div>
    <div id="plan-inhalt-abwesenheit" style="${planUnter === 'abwesenheit' ? '' : 'display:none'}"></div>`;
  zeichnePlanListe();
  zeichneSperren();
  zeichneAbwesenheiten();
}
function zeichnePlanListe() {
  const heute = isoTag();
  // ENT-134: der ganze laufende Monat, nicht nur ab heute -- sonst
  // verschwindet eine bereits abgeschlossene Schicht von vorhin aus dem Plan,
  // noch bevor der Monat vorbei ist.
  const monatsanfang = heute.slice(0, 8) + '01';
  const kommend = schichten.filter(e => tagVon(e) >= monatsanfang)
    .sort((a, b) => tagVon(a).localeCompare(tagVon(b)) || String(a.von).localeCompare(String(b.von)));
  if (!kommend.length) {
    $('plan-inhalt-plan').innerHTML = LEER(w('keinePlan'), w('keinePlanText'),
      '<rect x="3" y="4.5" width="18" height="17" rx="2"/><line x1="3" y1="9.5" x2="21" y2="9.5"/>');
    return;
  }
  let letzter = '', html = '';
  kommend.forEach(e => {
    const tag = tagVon(e);
    if (tag !== letzter) {
      letzter = tag;
      const amTag = kommend.filter(x => tagVon(x) === tag && x.status !== 'abgesagt');
      const wd = WOCHENTAG[new Date(tag + 'T12:00:00').getDay()];
      html += `<div class="tag-kopf">
        <span>${esc(wd)}</span><b>${dmy(tag)}</b>
        ${tag === heute ? `<span class="marke m-a">${esc(w('heute'))}</span>` : ''}
        <span class="sp"></span>
        <span class="anz">${amTag.length} ${esc(amTag.length === 1 ? w('schicht') : w('schichten'))}</span>
      </div>`;
    }
    html += schichtKarte(e, false);
  });
  $('plan-inhalt-plan').innerHTML = html;
}

// ══════════════════════════════════════════ SPERRTAGE (ENT-028)
// Wer nicht kann, sagt es hier. Das ist eine Mitteilung an die Planung --
// kein Anspruch und keine Garantie. Genau so steht es auch im Text.
function ladeSperren() {
  const bis = isoTag(new Date(Date.now() + 90 * 864e5));
  return api(`meine_verfuegbarkeit.php?von=${isoTag()}&bis=${bis}`).then(({ ok, data }) => {
    sperrtage = {};
    if (ok && data.status === 'ok') {
      (data.tage || []).forEach(t => { sperrtage[String(t.datum).slice(0, 10)] = t.bemerkung || ''; });
    }
  });
}

function istGesperrt(t) {
  return Object.prototype.hasOwnProperty.call(sperrtage, t);
}

function zeichneSperren() {
  const heute = isoTag();
  const tage = Array.from({ length: 63 }, (_, i) => isoTag(new Date(Date.now() + i * 864e5)));
  // Wo bin ich schon eingeteilt? Einen solchen Tag zu sperren ist ein
  // Widerspruch -- das gehoert sichtbar daneben, nicht verschwiegen.
  const belegt = {};
  schichten.forEach(e => {
    if (e.status === 'abgesagt') return;
    (belegt[tagVon(e)] = belegt[tagVon(e)] || []).push(e);
  });

  const anzahl = tage.filter(istGesperrt).length;
  let html = `<div class="karte"><div class="karte-bd">
      <div style="font-size:15px;font-weight:660;margin-bottom:5px">${esc(w('sperrenTitel'))}</div>
      <div style="font-size:13px;color:var(--ink-2);line-height:1.55">${esc(w('sperrenText'))}</div>
      ${anzahl ? `<div style="margin-top:10px"><span class="marke m-w">${anzahl} ${anzahl === 1 ? 'Tag' : 'Tage'} gesperrt</span></div>` : ''}
    </div></div>`;

  let woche = '';
  tage.forEach(t => {
    const d = new Date(t + 'T12:00:00');
    const kw = kalenderwoche(d);
    if (kw !== woche) {
      woche = kw;
      html += `<div class="titel">Woche ${esc(kw)}</div>`;
    }
    const g = istGesperrt(t);
    const notiz = g ? sperrtage[t] : '';
    const eingeteilt = (belegt[t] || []).length;
    html += `<div class="karte sperr-karte${g ? ' aus' : ''}">
      <button class="sperr-zeile" onclick="sperreUm('${t}')">
        <span class="tg">
          <b>${esc(WOCHENTAG[d.getDay()].slice(0, 2))}</b>
          <span>${dmy(t).slice(0, 5)}</span>
        </span>
        <span class="ws">
          <b>${g ? esc(w('gesperrt')) : esc(w('frei'))}</b>
          ${eingeteilt ? `<span class="warn">${esc(w('sperreEingeteilt'))}</span>`
            : (notiz ? `<span>${esc(notiz)}</span>` : `<span>${t === heute ? 'heute' : ''}</span>`)}
        </span>
        <span class="schalter${g ? ' an' : ''}"><i></i></span>
      </button>
      ${g ? `<button class="sperr-notiz" onclick="sperreNotiz('${t}')">
        <svg class="i i-sm" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
        ${notiz ? esc(w('sperreNotiz')) + ' ändern' : esc(w('sperreNotiz')) + ' hinzufügen'}
      </button>` : ''}
    </div>`;
  });
  $('plan-inhalt-sperren').innerHTML = html;
}

// ISO-Kalenderwoche -- der Donnerstag der Woche entscheidet über das Jahr.
function kalenderwoche(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  const jahresStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return String(Math.ceil(((t - jahresStart) / 864e5 + 1) / 7));
}

function awAntragSpeichern() {
  const typ = $('awTyp').value, von = $('awVon').value, bis = $('awBis').value;
  const bemerkung = $('awBemerkung').value.trim();
  if (!von || !bis) { toast(w('beideZeitenNoetig')); return; }
  if (bis < von) { toast(w('vonBisFalsch')); return; }
  if (typ === 'ferien' && von < isoTag()) { toast(w('ferienNichtRueckwirkend')); return; }
  api('meine_abwesenheit.php', { method: 'POST', body: { typ, von, bis, bemerkung } }).then(({ ok, data }) => {

    toast(w('antragZurueckgezogen'));
    ladeAbwesenheiten().then(zeichneAbwesenheiten);
  });
}

function sperreUm(t) {
  const neu = !istGesperrt(t);
  const notiz = neu ? '' : undefined;
  sperreSpeichern(t, neu, notiz);
}

function sperreSpeichern(t, gesperrt, bemerkung) {
  const rumpf = { datum: t, gesperrt };
  if (bemerkung !== undefined) rumpf.bemerkung = bemerkung;
  return api('meine_verfuegbarkeit.php', { method: 'POST', body: rumpf }).then(({ ok, data }) => {
    if (!ok || data.status !== 'ok') { toast(data.message || w('netzfehler')); return false; }
    if (gesperrt) { sperrtage[t] = data.bemerkung || ''; } else { delete sperrtage[t]; }
    zeichneSperren();
    toast(gesperrt ? w('sperreGesetzt') : w('sperreWeg'));
    return true;
  });
}

// Zeigt alle aktiven Kontrollrunden-Vorlagen, unabhängig von der eigenen

// der die Person ein Objekt gezielt waehlen muss statt an ihre geplante

// generellen Revierdienst-Bezug geprueft (mein_rundgang_vorlagen_alle.php),

let rdSpontanVorlagen = [];
function rundgangUebersichtOeffnen() {
  api('mein_rundgang_vorlagen_alle.php').then(({ ok, data }) => {

    $('blTitel').textContent = w('waechterUebersichtTitel');

            <div style="font-size:13px;color:var(--ink-3)">${esc(v.objekt_name)} · ${esc(v.kunde_name)}</div>

    blattZeigen();
  });

// Gleiche Fenster-Weiche wie rundgangVorlageWaehlen() (ENT-279): innerhalb
// des Fensters sofortiger Start, ausserhalb zuerst ein Pflichtgrund. Ohne
// bestehenden Einsatz -- der entsteht erst serverseitig beim Start.
function rundgangSpontanWaehlen(vorlageId) {
  const v = rdSpontanVorlagen.find(x => Number(x.id) === Number(vorlageId));
  if (!v) return;
  if (v.fenster_von && v.fenster_bis &&
      !rundgangImFenster(jetztDatetime().slice(11, 16), v.fenster_von, v.fenster_bis, RUNDGANG_FENSTER_TOLERANZ_MIN)) {
    rundgangSpontanAusnahmeGrundWahl(vorlageId);
    return;
  }
  rundgangSpontanStarten(vorlageId, null);
}

function rundgangSpontanAusnahmeGrundWahl(vorlageId) {
  $('blTitel').textContent = w('rundgangAusserhalbFensterTitel');

    </div>
    <div id="rfsErr" class="msg-err" style="display:none"></div>`;
  $('blFuss').innerHTML = `

function rundgangSpontanAusnahmeGrundSenden(vorlageId) {
  const err = $('rfsErr'); err.style.display = 'none';
  const grund = $('rfsGrund').value;
  if (!grund) { err.textContent = w('rundgangAbbrechenGrundPflicht'); err.style.display = ''; return; }
  rundgangSpontanStarten(vorlageId, grund);
}

// Nach Erfolg wird ladeSchichten() neu geladen: der spontan angelegte
// Einsatz muss im lokalen schichten-Array stehen, bevor rundgangAnzeigen()
// ihn dort findet (gleiches Prinzip wie ueberall sonst -- schichten kommt
// ausschliesslich vom Server, nie lokal erfunden).
function rundgangSpontanStarten(vorlageId, ausnahmeGrund) {
  document.querySelectorAll('#blBody button, #rfsBtn').forEach(b => b.disabled = true);
  const body = { vorlage_id: vorlageId };
  if (ausnahmeGrund) body.ausnahme_grund = ausnahmeGrund;
  api('mein_rundgang_spontan_starten.php', { method: 'POST', body }).then(({ ok, data }) => {
    // Dieselbe Vorlage laeuft fuer diese Person schon (ENT-290, gemeldeter
    // Fehler: zweimal angetippt landete bisher in der Doppelbelegungs-Sperre
    // ohne Weg zurueck, siehe Kommentar im Endpunkt) -- die bestehende Runde
    // fortsetzen, genau wie ueber "Plan"/"Heute", statt eine zweite zu
    // versuchen.
    if (ok && data.status === 'laeuft_bereits') {
      ladeSchichten().then(() => rundgangFortsetzen(data.einsatz_id));
      return;
    }
    if (!ok || data.status !== 'ok') {
      document.querySelectorAll('#blBody button, #rfsBtn').forEach(b => b.disabled = false);
      toast(data.message || w('netzfehler'));
      return;
    }
    rundgangAktiv = { id: data.rundgang_id, einsatz_id: data.einsatz_id, status: 'vorbereitet', pausiert_seit: null,
      kontrollpunkte: (data.kontrollpunkte || []).map(k => ({ ...k, erledigt: null })) };
    ladeSchichten().then(() => rundgangAnzeigen(data.einsatz_id));
  });
}

        ${zeile(w('email'), p.email)}
      </dl>
      <p style="font-size:13px;color:var(--ink-3);margin-top:14px">${esc(w('datenHinweis'))}</p>
      </div></div>
    </div>

    <div id="pr-stunden" style="display:none">
      <div class="seiten-kopf">
        <button class="btn btn-plain" onclick="stdSeiteZu()" style="min-height:40px;padding:0 12px" aria-label="${esc(w('zurueckZumMenue'))}" title="${esc(w('zurueckZumMenue'))}">
          <svg class="i i-sm" viewBox="0 0 24 24"><polyline points="15 5 8 12 15 19"/></svg>
        </button>

}

}

// ══════════════════════════════════════════ UNTERSEITE MEINE STUNDEN (ENT-051)
// Im Menü (ENT-234) steht die Stunden-Kachel im Vordergrund, die Zahlen
// liegen eine Ebene tiefer. Zwei Gruende, warum das nicht nur Geschmack ist:
//
// 1. Die Zahlen werden erst geladen, wenn jemand sie sehen will. Vorher steht
//    im Menü nur die Kachel -- KEINE Zahl. Das ist Absicht: Seit ENT-049 darf
//    eine Stundensumme nie ohne den Hinweis erscheinen, dass sie keine
//    Lohnabrechnung ist. Eine "Vorschau" auf der Kachel wuerde genau das tun.
// 2. Beim Verlassen des Menüs faellt die Unterseite von selbst zusammen,
//    weil zeichneMenu() neu zeichnet. Kein Zustand, der haengen bleibt.
function stdSeiteAuf() {
  const h = $('pr-haupt'), u = $('pr-stunden');
  if (!h || !u) return;
  h.style.display = 'none';
  u.style.display = '';
  window.scrollTo(0, 0);
  zeichneStunden();
}
function stdSeiteZu() {
  const h = $('pr-haupt'), u = $('pr-stunden');

  u.style.display = 'none';
