  zeichneStunden();
}
function stdSeiteZu() {
  const h = $('pr-haupt'), u = $('pr-stunden');
  if (!h || !u) return;
  u.style.display = 'none';
  h.style.display = '';
  window.scrollTo(0, 0);
}

// ══════════════════════════════════════════ MEINE STUNDEN (ENT-049)
// Die eigene, abgeglichene Arbeitszeit je Monat. Gerechnet wird mit denselben
// Regeln wie in der Verwaltung -- gav.js liegt beiden Oberflächen zugrunde,
// damit hier nie eine andere Zahl steht als dort.
//
// Gezeigt werden DREI getrennte Werte, nie einer: geleistete Zeit, Zeitbonus,
// Total. Der PAKO-Kommentar zu Art. 12 Abs. 2 verlangt ausdrücklich, dass der
// Zuschlag separat ausgewiesen wird.
//
// Und: der Hinweis darunter ist hier wichtiger als in der Verwaltung. Wer
// seine eigene Zahl liest, hält sie leicht für die Lohnabrechnung -- sie ist
// aber unvollständig (Feiertagsbonus, Zuschlag über 210 Std., Ferien,
// Absenzen fehlen). Art. 12 Ziff. 5 verlangt eine vollständige Abrechnung;
// diese Ansicht ersetzt sie nicht und sagt das im Klartext.
function stdMonatSetzen(n) {
  const m = stdMonat || new Date().toISOString().slice(0, 7);
  const d = new Date(Number(m.slice(0, 4)), Number(m.slice(5, 7)) - 1 + n, 1);
  stdMonat = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  stdSchichten = null;
  zeichneStunden();
}

function stdLaden() {
  const erster = stdMonat + '-01';
  const d = new Date(Number(stdMonat.slice(0, 4)), Number(stdMonat.slice(5, 7)), 0);
  const letzter = `${stdMonat}-${String(d.getDate()).padStart(2, '0')}`;
  return api(`meine_schichten.php?von=${erster}&bis=${letzter}`).then(({ ok, data }) => {
    stdSchichten = ok && data.status === 'ok' ? (data.schichten || []) : [];
    zeichneStunden();
  });
}

function zeichneStunden() {
  const box = $('stdBereich');
  if (!box) return;
  if (!stdMonat) { stdMonat = new Date().toISOString().slice(0, 7); }
  if (stdSchichten === null) {
    box.innerHTML = `<div class="karte"><div class="karte-bd" style="text-align:center;color:var(--ink-3)">…</div></div>`;
    stdLaden();
    return;
  }

  // Nur abgeglichene Schichten -- was nicht geprüft ist, ist kein Nachweis.
  const z = stdSchichten
    .filter(e => (e.ist_status || 'offen') !== 'offen')
    .map(e => {
      const tag = String(e.datum).slice(0, 10);
      const von = e.ist_von ? hm(e.ist_von) : '';
      const bis = e.ist_bis ? hm(e.ist_bis) : '';
      const netto = gavNetto(von, bis, e.ist_pause_min, e.ist_pause_bezahlt_ma);
      // Reinigungsschichten bekommen keinen Zeitbonus (ENT-061): Der GAV fuer
      // private Sicherheitsdienstleistungen gilt fuer sie nicht. Die geleistete
      // Zeit zaehlt selbstverstaendlich weiter -- nur die Bewertung entfaellt.
      const gav = gavGilt(e.sparte);
      return {
        tag, von, bis, netto, gav, titel: e.titel || e.einsatzart, kunde: e.kunde_name,
        pause: e.ist_pause_min, pauseBezahlt: Number(e.ist_pause_bezahlt_ma) === 1,
        nettoMin: netto ? Number(netto.slice(0, 2)) * 60 + Number(netto.slice(3, 5)) : 0,
        bonusMin: (gav && von && bis) ? gavBonusMin(tag, von, bis) : 0,
      };
    })
    .sort((a, b) => a.tag.localeCompare(b.tag) || String(a.von).localeCompare(String(b.von)));

  // Was noch nicht abgeglichen ist, wird nicht gerechnet -- aber es wird auch
  // nicht verschwiegen (ENT-053). Ohne diese Zeile sieht die Person eine Zahl,
  // die ihr zu tief vorkommt, und kann nicht unterscheiden, ob der Abgleich
  // noch aussteht oder ob etwas vergessen ging. Im laufenden Monat ist das
  // der Regelfall, nicht die Ausnahme.
  const offen = stdSchichten.filter(e => (e.ist_status || 'offen') === 'offen').length;
  const offenZeile = offen
    ? `<div class="offen-hinweis" id="stdOffen">${offen === 1
        ? esc(w('offenEine'))
        : `${offen} ${esc(w('offenMehrere'))}`}</div>`
    : '';

  const monatsName = new Date(stdMonat + '-01T12:00:00')
    .toLocaleDateString('de-CH', { month: 'long', year: 'numeric' });
  const blaettern = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <button class="btn btn-plain" id="stdZurueck" onclick="stdMonatSetzen(-1)" style="padding:6px 12px" aria-label="Vormonat">‹</button>
      <div style="flex:1;text-align:center;font-weight:640">${esc(monatsName)}</div>
      <button class="btn btn-plain" id="stdVor" onclick="stdMonatSetzen(1)" style="padding:6px 12px" aria-label="Folgemonat">›</button>
    </div>`;

  if (!z.length) {
    box.innerHTML = blaettern + LEER(w('keineStunden'), w('keineStundenText'),
      '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>') + offenZeile;
    return;
  }

  const netto = z.reduce((a, x) => a + x.nettoMin, 0);
  const ohneRegel = z.some(x => x.bonusMin === null);
  const bonus = z.reduce((a, x) => a + (x.bonusMin || 0), 0);
  const std = min => `${Math.floor(min / 60)}:${String(Math.round(min % 60)).padStart(2, '0')}`;

  // Getrennt nach Sparte (ENT-063). Bis hierher stand eine einzige Zahl da,
  // die GAV-Zeit und Nicht-GAV-Zeit addierte. Solange nur Zeit ANGEZEIGT
  // wird, ist das ertraeglich -- sobald darauf gerechnet wird, ist es falsch:
  // Die 210-Stunden-Schwelle nach Art. 14 Ziff. 3 und die Ferienentschaedigung
  // duerfen nur GAV-Stunden zaehlen. Sechzig Stunden Reinigung wuerden eine
  // Sicherheitskraft sonst kuenstlich ueber die Schwelle heben.
  const nettoGav = z.filter(x => x.gav !== false).reduce((a, x) => a + x.nettoMin, 0);
  const nettoRein = netto - nettoGav;
  const gemischt = nettoRein > 0 && nettoGav > 0;

  box.innerHTML = blaettern + `
    <div class="zahlen" id="stdZahlen">
      <div class="zahl"><b>${esc(std(netto))}</b><span>${esc(w('geleistet'))}</span></div>
      <div class="zahl">
        <button class="zahl-info" id="bonusInfo" onclick="bonusInfoBlatt()" aria-label="${esc(w('infoAria'))}" title="${esc(w('infoAria'))}">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><line x1="12" y1="11" x2="12" y2="16.5"/><line x1="12" y1="7.6" x2="12" y2="7.7"/></svg>
        </button>
        <b>+${esc(std(bonus))}</b><span>${esc(w('zeitbonus'))}</span>
      </div>
      <div class="zahl"><b>${esc(std(netto + bonus))}</b><span>${esc(w('gesamt'))}</span></div>
    </div>
    ${nettoRein > 0 ? `<div class="offen-hinweis" id="stdSparten">
      <b>${esc(w('davon'))}</b> ${esc(std(nettoGav))} ${esc(w('spGav'))} · ${esc(std(nettoRein))} ${esc(w('spRein'))}<br>
      ${esc(gemischt ? w('spGemischt') : w('spNurRein'))}
    </div>` : ''}
    ${offenZeile}
    <div class="karte" id="stdListe"><div class="karte-bd" style="padding:0">
      ${z.map(x => `<div style="padding:11px 14px;border-bottom:1px solid var(--line-soft)">
        <div style="display:flex;justify-content:space-between;gap:10px">
          <div style="min-width:0">
            <div style="font-weight:620">${esc(dmy(x.tag))} · ${esc(x.titel)}</div>
            <div style="font-size:12.5px;color:var(--ink-3)">${esc(x.kunde || '')}${x.von ? ` · ${esc(x.von)}–${esc(x.bis)}` : ''}${
              x.pause ? ` · ${nf(x.pause)} min${x.pauseBezahlt ? ' ' + esc(w('pauseBezahlt')) : ''}` : ''}${
              x.gav === false ? ` · ${esc(w('reinigung'))}` : ''}</div>
          </div>
          <div style="text-align:right;white-space:nowrap">
            <div style="font-weight:700">${esc(x.netto || '–')}</div>
            ${x.bonusMin ? `<div style="font-size:12px;color:var(--accent)">+${esc(std(x.bonusMin))}</div>` : ''}
          </div>
        </div></div>`).join('')}
    </div></div>
    <div class="karte" id="stdHinweis"><div class="karte-bd">
      <div style="font-weight:640;margin-bottom:4px">${esc(w('stundenHinweisTitel'))}</div>
      <p style="font-size:13px;color:var(--ink-3);margin:0">${esc(w('stundenHinweis'))}</p>
      <p style="font-size:13px;color:var(--warn);margin:8px 0 0">${esc(w('feiertagOffen'))}</p>
      ${ohneRegel ? `<p style="font-size:13px;color:var(--warn);margin:8px 0 0">${esc(w('ohneRegelwerk'))}</p>` : ''}
      ${z.some(x => x.gav === false)
        ? `<p style="font-size:13px;color:var(--ink-3);margin:8px 0 0">${esc(w('reinigungHinweis'))}</p>` : ''}
    </div></div>`;
}

// ══════════════════════════════════════════ BLATT
function blattAuf(id) {
  const e = schichten.find(x => Number(x.id) === Number(id));
  if (!e) return;
  blattId = Number(id);
  // Der Planung zeigen, dass diese Schicht angesehen wurde (ENT-113).
  // Beilaeufig: Ohne Rueckmeldung, ohne Wartezeit -- wer seine Schicht
  // ansieht, soll davon nichts merken. Schlaegt es fehl, fehlt das Auge in
  // der Planung; das darf das Oeffnen der Schicht nicht aufhalten.
  if (!e.gesehen_am) {
    e.gesehen_am = 'jetzt';
    api('meine_gesehen.php', { method: 'POST', body: { einsatz_id: Number(id) } }).catch(() => {});
  }
  const st = STATUS_MARKE[e.status] || STATUS_MARKE.geplant;
  const zu = ZUSAGE_MARKE[e.zusage] || ZUSAGE_MARKE.offen;
  const wd = WOCHENTAG[new Date(tagVon(e) + 'T12:00:00').getDay()];

  $('blTitel').textContent = e.titel || e.kunde_name;
  $('blBody').innerHTML = `
    ${e.status === 'abgesagt' ? `<div class="msg-err">${esc(w('abgesagtHinweis'))}</div>` : ''}
    ${e.status === 'provisorisch' ? `<div class="msg-err" style="color:var(--warn);background:var(--warn-soft)">${esc(w('provisorischHinweis'))}</div>` : ''}
    <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:16px">
      <div style="font-size:30px;font-weight:730;letter-spacing:-1px">${hm(e.von)}–${hm(e.bis)}</div>
      ${ueberNacht(e) ? `<div style="font-size:12.5px;color:var(--ink-3);font-weight:620">${esc(w('folgetag'))}</div>` : ''}
    </div>
    <dl class="dl">
      <dt>${esc(w('zeit'))}</dt><dd>${esc(wd)}, ${dmy(e.datum)}</dd>
      <dt>${esc(w('kunde'))}</dt><dd>${esc(e.kunde_name)}</dd>
      ${e.objekt_name ? `<dt>${esc(w('objekt'))}</dt><dd>${esc(e.objekt_name)}</dd>` : ''}
      <dt>${esc(w('arbeitsort'))}</dt><dd>${e.strasse ? esc(e.strasse) + '<br>' : ''}${esc(e.ort)}${e.kanton ? ' ' + esc(e.kanton) : ''}${
        schichtAdresse(e) ? `<br><a class="route-knopf" target="_blank" rel="noopener"
          href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(schichtAdresse(e))}"
          >${ROUTE_IKONE}${esc(w('route'))}</a>` : ''}</dd>
      ${e.treffpunkt ? `<dt>${esc(w('treffpunkt'))}</dt><dd>${esc(e.treffpunkt)}</dd>` : ''}
      ${dienstfahrzeugZeile(e)}
      ${e.kontakt_vorname || e.kontakt_nachname || e.kontakt_telefon ? `<dt>${esc(w('kontaktVorOrt'))}</dt><dd>${
        esc([e.kontakt_vorname, e.kontakt_nachname].filter(Boolean).join(' '))
      }${e.kontakt_telefon ? `${e.kontakt_vorname || e.kontakt_nachname ? '<br>' : ''}<a href="tel:${
        esc(String(e.kontakt_telefon).replace(/[^+0-9]/g, ''))}">${esc(e.kontakt_telefon)}</a>` : ''}</dd>` : ''}
      ${e.taetigkeit ? `<dt>${esc(w('taetigkeit'))}</dt><dd>${esc(e.taetigkeit)}</dd>` : ''}
      ${e.qualifikation ? `<dt>${esc(w('qualifikation'))}</dt><dd>${esc(e.qualifikation)}</dd>` : ''}
      <dt>${esc(w('einsatzart'))}</dt><dd>${esc(e.einsatzart)}</dd>
      <dt>Status</dt><dd><span class="marke ${st[1]}">${esc(w(st[0]))}</span> <span class="marke ${zu[1]}">${esc(w(zu[0]))}</span></dd>
      ${Number(e.im_team) > 1 ? `<dt>${esc(w('schicht'))}</dt><dd>${teamBlock(e)}</dd>` : ''}
      ${e.bemerkung ? `<dt>${esc(w('bemerkung'))}</dt><dd>${esc(e.bemerkung)}</dd>` : ''}
    </dl>
    <!-- Unterlagen des Planers (ENT-117). Der Platz steht schon, der Inhalt
         kommt nach: Die Liste ist eine eigene Abfrage und darf das Öffnen der
         Schicht nicht aufhalten. Ohne Unterlagen bleibt hier nichts stehen. -->
    <div id="blDok"></div>
    <div id="blRundgang"></div>
    ${darfSchichtRapportieren(e) ? `<button class="btn btn-primary btn-wide" style="margin-top:4px" onclick="schichtRapportBlatt(${Number(e.id)})">${esc(w('schichtRapportieren'))}</button>` : ''}
    ${(() => { const r = rapportFuerSchicht(e.id); return r
      ? `<p style="font-size:12.5px;color:var(--ink-3);text-align:center;margin-top:8px">${esc(w('schonRapportiert'))} ${dmy(r.erfasst_am)}, ${String(r.erfasst_am).slice(11, 16)}</p>`
      : ''; })()}`;

  blattDokLaden(Number(e.id));
  rundgangAbschnittZeichnen(e);

  // Eine bereits gegebene Antwort wird nicht noch einmal verlangt (ENT-120).
  antwortOffen = false;
  blattFussZeichnen(e);
  blattZeigen();
}

// ── Fussbereich der Schichtansicht (ENT-120)
//
// Wer zu- oder abgesagt hat, bekommt beim naechsten Oeffnen nicht wieder zwei
// gleich grosse Knoepfe vorgesetzt, die eine Entscheidung verlangen, die
// laengst gefallen ist. Stattdessen steht da, WAS beantwortet wurde.
//
// Die Knoepfe verschwinden aber nicht ersatzlos, sondern hinter „Antwort
// ändern": Auf einem Telefon liegen „Ablehnen" und „Zusagen" nebeneinander,
// und ein Fehlgriff ist schnell passiert. Waere die Antwort danach
// unwiderruflich, plante die Einsatzleitung mit einer Zusage, die niemand so
// gemeint hat -- und wer nach der Zusage krank wird, haette in der App
// ueberhaupt keinen Weg mehr. Eine Rueckmeldung, die sich nicht berichtigen
// laesst, ist schlechter als gar keine.
let antwortOffen = false;

function antwortAendern() {
  antwortOffen = true;
  const e = schichten.find(x => Number(x.id) === blattId);
  if (e) { blattFussZeichnen(e); }
}

function blattFussZeichnen(e) {
  const el = $('blFuss');
  if (!el) { return; }
  const schliessen = `<button class="btn btn-plain" onclick="blattZu()">${esc(w('schliessen'))}</button>`;
  if (e.status === 'abgesagt') { el.className = 'blatt-ft'; el.innerHTML = schliessen; return; }

  /* Entfallen (ENT-347): Diese Einteilung besteht NICHT mehr -- der
     Waechter hat zur selben Zeit eine Revierrunde gestartet und ist dadurch
     aus der Besetzung genommen worden. Hier keine Zusage-Knoepfe: Es gibt
     nichts mehr zuzusagen, und ein „Zusagen" wuerde ihn stillschweigend
     zurueck in eine Schicht setzen, aus der ihn das System bewusst
     herausgenommen hat. Wer wieder hinein will, klaert das mit der
     Einsatzleitung -- deshalb steht die Auskunft da, aber kein Knopf. */
  if (e.zusage === 'entfallen') {
    el.className = 'blatt-ft gestapelt';
    el.innerHTML = `
      <div class="ft-stand">
        <span class="marke m-w">${esc(w('entfallen'))}</span>
        <span class="ft-txt">${esc(w('entfallenTxt'))}</span>
      </div>
      <div class="ft-reihe">${schliessen}</div>`;
    return;
  }
  // Rückmeldung ist freiwillig -- die Einteilung bleibt so oder so bestehen.
  const beantwortet = e.zusage === 'zugesagt' || e.zusage === 'abgelehnt';
  if (!beantwortet || antwortOffen) {
    el.className = 'blatt-ft';
    el.innerHTML = `
      <button class="btn ${e.zusage === 'abgelehnt' ? 'btn-neg' : 'btn-plain'}" onclick="melden('abgelehnt')">${esc(w('ablehnen'))}</button>
      <button class="btn ${e.zusage === 'zugesagt' ? 'btn-pos' : 'btn-primary'}" onclick="melden('zugesagt')">${esc(w('zusagen'))}</button>`;
    return;
  }
  const ja = e.zusage === 'zugesagt';
  el.className = 'blatt-ft gestapelt';
  el.innerHTML = `
    <div class="ft-stand">
      <span class="marke ${ja ? 'm-p' : 'm-x'}">${esc(w(ja ? 'zugesagt' : 'abgelehnt'))}</span>
      <span class="ft-txt">${esc(w(ja ? 'hastZugesagt' : 'hastAbgelehnt'))} ${esc(w('planungSiehtEs'))}</span>
    </div>
    <div class="ft-reihe">
      <button class="btn btn-plain" onclick="antwortAendern()">${esc(w('antwortAendern'))}</button>
      ${schliessen}
    </div>`;
}

// ── Unterlagen zur Schicht (ENT-117) ────────────────────────────────────
// Was der Planer angehängt hat: Objektplan, Verkehrsanordnung,
// Sicherheitskonzept. Der Endpunkt gibt sie nur an Eingeteilte dieses
// Einsatzes heraus -- hier wird nichts zusätzlich geprüft, weil eine Prüfung
// in der Oberfläche keine ist.
// ── Wer sonst auf der Schicht steht (ENT-121) ───────────────────────────
//
// Bis dahin gab es nur die Anzahl. Der Projektinhaber hat das fuer die
// Absprache vor Ort revidiert (ENT-023 Ziff. „nur die Anzahl" ist damit
// ueberholt) -- ausdruecklich NUR die Namen: keine Telefonnummer, keine
// Personalnummer, kein Rueckmeldestand der anderen. Der Endpunkt gibt auch
// nicht mehr heraus; hier wird nur angezeigt, was ankommt.
//
// Eingeklappt, weil die Zahl in den meisten Faellen genuegt. Wer wissen will,
// wen er vor Ort sucht, klappt auf.
const TEAM_PFEIL = '<svg viewBox="0 0 24 24" aria-hidden="true" class="team-pfeil">'
  + '<polyline points="6 9 12 15 18 9"/></svg>';

// ── Dienstfahrzeug der Schicht (ENT-334) ────────────────────────────────
//
// Der Projektinhaber: *"Der MA muss in der APP in der geplanten Schicht sein
// Dienstfahrzeug sehen, dass er verwenden muss."*
//
// ZWEI VERSCHIEDENE AUSSAGEN, zwei verschiedene Texte: Wer als Fahrer
// eingeteilt ist, liest eine AUFGABE ("Du fährst") -- wer mitfährt, eine
// AUSKUNFT ("fährt: …"), damit er weiss, wie das Team hinkommt und wen er
// sucht. Beides an derselben Stelle gleich zu formulieren hiesse, dem Fahrer
// seine Zuständigkeit zu verschweigen.
//
// Die Namen der Eingeteilten zeigt die App ohnehin schon (Schicht > Team,
// ENT-121); mit dem Fahrernamen kommt also nichts Neues über Personen dazu.
//
// Fehlt der Schlüssel ganz, ist die Einrichtung noch nicht gelaufen -- dann
// steht hier nichts, statt "kein Fahrzeug" zu behaupten.
function dienstfahrzeugZeile(e) {
  const f = e.fahrzeug;
  if (!f || !f.kennzeichen) { return ''; }
  const name = [f.kennzeichen, f.bezeichnung].filter(Boolean).join(' · ');
  const wert = f.ich_fahre
    ? `<b>${esc(w('duFaehrst'))}:</b> ${esc(name)}`
    // "noch nicht bestimmt" ist etwas anderes als "niemand fährt".
    : `${esc(name)}<br><span style="color:var(--ink-3)">${f.fahrer_name
        ? esc(w('faehrtWer')) + ': ' + esc(f.fahrer_name)
        : esc(w('fahrerOffen'))}</span>`;
  return `<dt>${esc(w('dienstfahrzeug'))}</dt><dd>${wert}</dd>`;
}

function teamBlock(e) {
  const liste = Array.isArray(e.team) ? e.team : [];
  const zahl = `${Number(e.im_team)} ${esc(w('imTeam'))}`;
  // Ohne Namensliste bleibt es bei der Zahl -- ein Knopf, der nichts
  // aufklappt, ist schlimmer als kein Knopf.
  if (liste.length < 2) { return zahl; }
  return `<button type="button" class="team-auf" aria-expanded="false"
      title="${esc(w('teamZeigen'))}" onclick="teamUm(this)"><span>${zahl}</span>${TEAM_PFEIL}</button>
    <ul class="team-liste">${liste.map(m => `<li${m.bin_ich ? ' class="ich"' : ''}>${esc(m.name)}${
      m.bin_ich ? ` <span class="team-du">${esc(w('duSelbst'))}</span>` : ''}</li>`).join('')}</ul>`;
}

function teamUm(b) {
  const auf = b.getAttribute('aria-expanded') === 'true';
  b.setAttribute('aria-expanded', auf ? 'false' : 'true');
  const l = b.nextElementSibling;
  if (l) { l.classList.toggle('auf', !auf); }
}

// Adresse der Schicht als Zieladresse fuer die Navigation (ENT-119).
//
// ABGRENZUNG: Das hat NICHTS mit der Wegstrecke nach Art. 18 GAV zu tun
// (ENT-116). Dort geht es um die KUERZESTE Strecke ab Hauptanstellungsort als
// Grundlage fuer den Auslagenersatz, sie wird von einem Menschen abgelesen und
// gespeichert, und die Zoneneinteilung ist als GAV-AUS-011 offen. Hier geht es
// nur darum, dass die eingeteilte Person den Ort findet -- eine Navigation vom
// jeweiligen Standort aus, ohne origin, ohne gespeicherte Zahl, ohne jede
// Wirkung auf Lohn oder Rechnung. Diese beiden Wege duerfen nie zusammenlaufen.
//
// Kein origin: Der Startpunkt ist der Standort der Person, den kennt ihr Geraet
// -- und wir wollen ihn nicht wissen.
function schichtAdresse(e) {
  if (!e) { return ''; }
  return [e.strasse, e.ort, e.kanton].map(t => String(t || '').trim()).filter(Boolean).join(', ');
}

const ROUTE_IKONE = '<svg viewBox="0 0 24 24" aria-hidden="true" class="route-i">'
  + '<path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/>'
  + '<circle cx="12" cy="10" r="3"/></svg>';

function blattDokLaden(einsatzId) {
  const el = $('blDok'); if (!el) return;
  el.innerHTML = '';
  api('einsatz_dokument.php?einsatz_id=' + einsatzId).then(({ ok, data }) => {

    if (blattId !== einsatzId) return;
    const dok = (ok && data.status === 'ok') ? (data.dokumente || []) : [];
    if (!dok.length) return;
    el.innerHTML = `<div class="dok-kopf">${esc(w('dokumente'))}</div>
      <div class="dok-liste">${dok.map(d => `
        <button type="button" class="dok-zeile" onclick="dokOeffnen(${Number(d.id)})">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
               stroke-width="1.7" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          <span class="nm">${esc(d.dateiname)}</span>
          <span class="gr">${dokGr(Number(d.groesse) || 0)}</span>
        </button>`).join('')}</div>`;
  }).catch(() => {});
}

const dokGr = b => b >= 1048576 ? nf(b / 1048576, 1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';

// Der Endpunkt verlangt den Anmelde-Kopf, ein <a href> trägt ihn nicht mit.
// Das Fenster wird VOR dem Holen geöffnet: nach einem await gilt der Tipp
// nicht mehr als Nutzeraktion und der Browser blockiert es.
function dokOeffnen(id) {
  const f = window.open('', '_blank');
  fetch(API + 'einsatz_dokument.php?id=' + encodeURIComponent(id),
        { headers: token ? { 'X-Auth-Token': token } : {} })
    .then(r => { if (!r.ok) throw new Error('http'); return r.blob(); })
    .then(b => {
      const url = URL.createObjectURL(b);
      // Hier ist das Umleiten der richtige Rückfall, anders als im Dashboard:
      // In der installierten App gibt es oft gar kein zweites Fenster, und es
      // steht kein Formular offen, das dabei verloren ginge -- die Schicht ist
      // nach dem Zurückgehen einen Fingertipp entfernt.
      if (f) { f.location = url; } else { location.href = url; }
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    })
    .catch(() => { if (f) f.close(); toast(w('dokumentFehler')); });
}

// Nur bei zugesagtem Verkehrsdienst, und erst sobald die Schicht begonnen hat
// -- rapportiert wird, was geschah, nicht, was noch bevorsteht (ENT-082).
function darfSchichtRapportieren(e) {
  if (e.status === 'abgesagt' || e.zusage !== 'zugesagt' || e.einsatzart !== 'Verkehrsdienst') return false;
  const sp = spanne(e.datum, e.von, e.bis);
  return !!sp && sp[0] <= Date.now();
}

// Erinnerung, kein Fehler (ENT-134): mehr als zwei Stunden nach Schichtende
// noch kein eigener Rapport. Nur dort sinnvoll, wo ueberhaupt rapportiert
// werden darf -- sonst waere die Warnung ein Versprechen ohne Knopf dazu.
// Ist die Schicht bereits als "abgeschlossen" markiert, hat diese Person
// zwangslaeufig schon rapportiert (ENT-128 verlangt das von allen
// Zugeteilten), darum reicht die Pruefung ueber rapportFuerSchicht allein.
function schichtUeberfaellig(e) {
  if (!darfSchichtRapportieren(e)) return false;
  const sp = spanne(e.datum, e.von, e.bis);
  if (!sp || Date.now() < sp[1] + 2 * 3600e3) return false;
  return !rapportFuerSchicht(e.id);
}

// "Korrektur, neueste zaehlt": mehrere Schicht-Rapporte zur selben Zuteilung
// sind moeglich, hier zaehlt nur der zuletzt erfasste.
//
// Die Person muss mitgeprueft werden, nicht nur die Schicht: Wer das Recht
// "abgleich" hat, bekommt von rapport_list.php ALLE Rapporte. Auf einer
// Schicht zu zweit waere sonst der Rapport der Kollegin als der eigene
// erschienen -- und die Korrektur haette ihn mit fremden Angaben vorbefuellt.
function rapportFuerSchicht(einsatzId) {
  const treffer = rapporte.filter(r =>
    Number(r.einsatz_id) === Number(einsatzId) && r.mitarbeiter === (ich && ich.name));
  if (!treffer.length) return null;
  return treffer.slice().sort((a, b) => String(b.erfasst_am).localeCompare(String(a.erfasst_am)))[0];
}

function melden(zusage) {
  if (!blattId) return;
  api('meine_zusage.php', { method: 'POST', body: { einsatz_id: blattId, zusage } }).then(({ ok, data }) => {
    if (!ok || data.status !== 'ok') { toast(data.message || w('netzfehler')); return; }
    const e = schichten.find(x => Number(x.id) === blattId);
    if (e) e.zusage = zusage;
    blattZu();
    zeichne();
    toast(w('gemeldet'));
  });
}

// ══════════════════════════════════════════ RUNDGANG (ENT-180/182/145)
//
// Start und Fortsetzen leben in der bestehenden Schicht-Schublade (#blatt),
// gleiches Muster wie schichtRapportBlatt: derselbe Rahmen wird umgebaut statt
// einer eigenen zweiten Oberflaeche. Kein eigener Reiter in der Bodenleiste --
// ein Rundgang gehoert zu genau einem Einsatz, und genau dort wird er auch
// begonnen.
//
// Voraussetzung wie beim Rapport: zugesagt, nicht abgesagt, Schicht bereits
// begonnen (sp[0] <= jetzt) -- zusaetzlich hier: das Objekt hat ueberhaupt
// aktive Kontrollpunkte (e.hat_kontrollpunkte, aus meine_schichten.php).
// Bewusst KEINE Einschraenkung auf eine bestimmte Einsatzart: anders als beim
// Rapport (nur Verkehrsdienst) haengt ein Rundgang einzig am Objekt, nicht an
// der Einsatzart -- so in ENT-132/180/182 nirgends eingeschraenkt.
//
// ENT-279: hat das Objekt mindestens eine Kontrollrunden-Vorlage mit eigenem
// Ausfuehrungsfenster, gilt die Einsatz-Sollzeit hier NICHT mehr als Gate --
// welches Fenster (und ob "jetzt" darin liegt) klaert sich erst bei der
// Vorlage-Auswahl (rundgangVorlageWaehlen()). Ohne Fenster an keiner Vorlage
// bleibt das Verhalten von vor ENT-279 unveraendert: Start erst ab Sollzeit.
function darfRundgang(e) {
  if (e.status === 'abgesagt' || e.zusage !== 'zugesagt' || !e.hat_kontrollpunkte) return false;
  if (e.hat_zeitfenster) return true;
  const sp = spanne(e.datum, e.von, e.bis);
  return !!sp && sp[0] <= Date.now();
}

// Serverseitiges Gegenstueck: rundgang_im_fenster() in backend/rundgang.php --
// eine Aenderung dort muss auch hier nachgezogen werden, es gibt keine
// gemeinsame Quelle zwischen PHP und JS (gleiches Prinzip wie
// RUNDGANG_ABBRUCH_GRUENDE). Nur fuer die Anzeige/UX: die echte Sperre liegt
// serverseitig in mein_rundgang_starten.php.
function rundgangImFenster(jetztHm, fensterVonHm, fensterBisHm, toleranzMin) {
  if (!fensterVonHm || !fensterBisHm) return true;
  const min = hm => Number(hm.slice(0, 2)) * 60 + Number(hm.slice(3, 5));
  let jetzt = min(jetztHm);
  let von = min(fensterVonHm) - toleranzMin;
  let bis = min(fensterBisHm) + toleranzMin;
  if (bis <= von) bis += 1440;
  if (jetzt < von) jetzt += 1440;
  return jetzt >= von && jetzt <= bis;
}
const RUNDGANG_FENSTER_TOLERANZ_MIN = 5;
const RUNDGANG_AUSSERHALB_FENSTER_GRUENDE = {
  planer_freigabe: 'Freigabe durch Planer',
  kurzfristige_umdisposition: 'Kurzfristige Umdisposition',
  kundenwunsch: 'Wunsch des Kunden',
  sonstige: 'Sonstige Gründe',
};

// Geraeteseitiger Zeitstempel im Moment der Erfassung (ENT-132 Punkt 5,
// Offline-Prinzip) -- lokale Zeit wie ueberall sonst im Datenmodell (datum/
// von/bis kennen ebenfalls keine Zeitzone), keine UTC-Umrechnung.
function jetztDatetime() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

// ── Warteschlange fuer die Offline-Uebermittlung (ENT-132 Punkt 5) ──────
// Ein Kontrollpunkt-Ereignis wird sofort lokal festgehalten, unabhaengig vom
// Netzstatus, und erst danach an den Server gemeldet -- der Zeitstempel zaehlt
// den Moment der Erfassung, nicht den der Uebermittlung.
function rdWarteschlangeLesen() {
  try { return JSON.parse(localStorage.getItem(RD_WARTESCHLANGE) || '[]'); } catch { return []; }
}
function rdWarteschlangeSchreiben(liste) {
  try { localStorage.setItem(RD_WARTESCHLANGE, JSON.stringify(liste)); } catch {}
}
function rdWarteschlangeHinzufuegen(eintrag) {
  const liste = rdWarteschlangeLesen();
  liste.push(eintrag);
  rdWarteschlangeSchreiben(liste);
}

// Sendet alle wartenden Meldungen, gruppiert nach Rundgang (der Endpunkt
// verarbeitet mehrere Scans auf einmal -- genau dafuer ist er gebaut). Ohne
// Netz bleibt ein Eintrag einfach stehen und wird beim naechsten Aufruf
// (online-Ereignis, erneutes Oeffnen des Rundgangs) wieder versucht. Lehnt der
// Server einen Punkt inhaltlich ab (z.B. ausserhalb des Geofence-Radius --
// moeglich, wenn offline erfasst und die Position tatsaechlich nicht passte),
// wird er wieder als offen gezeigt, nicht stillschweigend als erledigt
// behauptet (ENT-182: Fehlermeldung + erneuter Versuch, alternativ "nicht
// verfuegbar").
/* Die Warteschlange ueber die Serverdaten legen (ENT-321).

   Vom Projektinhaber im ersten echten Rundgang gefunden: Ein Punkt war
   offline bestaetigt ("wird uebermittelt, sobald wieder Netz da ist") --
   und fiel beim naechsten Laden auf "offen" zurueck. Der Zaehler ging von
   2/2 auf 1/2.

   Ursache: mein_rundgang_offen.php liefert, was der SERVER weiss. Was nur
   im Geraet in der Warteschlange liegt, ist dort naturgemaess nicht dabei
   -- und ueberschrieb beim Laden die richtige Anzeige.

   Der Nachweis war nie verloren; er lag die ganze Zeit im Geraet. Falsch
   war die ANZEIGE, und zwar in der gefaehrlichen Richtung: Sie sagte
   "nicht erledigt", wo erledigt war. Ein Waechter haette denselben Punkt
   ein zweites Mal bestaetigt, und in der Auswertung staenden zwei Scans
   fuer einen Gang.

   Dasselbe Muster wie rdAufgabenOffen() aus ENT-305 -- dort wurde die
   Warteschlange von Anfang an mitgelesen. Hier fehlte es. */
function rdWarteschlangeUeberlagern(kontrollpunkte, rundgangId) {
  const wartend = rdWarteschlangeLesen()
    .filter(e => Number(e.rundgang_id) === Number(rundgangId));
  if (!wartend.length) { return kontrollpunkte; }
  (kontrollpunkte || []).forEach(k => {
    // Der Server hat immer recht, wenn er etwas weiss: Ein bereits
    // angekommener Scan wird nicht von einem Warteschlangen-Eintrag
    // ueberschrieben -- der ist dann nur noch nicht aufgeraeumt.
    if (k.erledigt) { return; }
    const e = wartend.find(x => Number(x.kontrollpunkt_id) === Number(k.id));
    if (!e) { return; }
    k.erledigt = { status: e.status, erfasst_am: e.erfasst_am,
      beschreibung: e.beschreibung || null };
    k.wartend = true;
  });
  return kontrollpunkte;
}

function rdWarteschlangeSenden() {
  const liste = rdWarteschlangeLesen();
  // Auch die Aufgaben-Antworten (ENT-305) muessen einen Rundgang in die
  // Gruppierung bringen koennen. Sonst passiert genau das hier Gefundene:
  // Der Scan ist laengst uebermittelt und aus der Liste, die Antwort kommt
  // Sekunden spaeter dazu -- und wird nie gesendet, weil die Scan-Liste leer
  // ist. Sie bliebe fuer immer in der Warteschlange stehen.
  const aufgabenListe = rdAufgabenWarteschlangeLesen();
  if (!liste.length && !aufgabenListe.length) return Promise.resolve();
  const gruppen = {};
  liste.forEach(e => { (gruppen[e.rundgang_id] = gruppen[e.rundgang_id] || []).push(e); });
  aufgabenListe.forEach(a => { gruppen[a.rundgang_id] = gruppen[a.rundgang_id] || []; });
  return Promise.all(Object.keys(gruppen).map(rid => {
    const scans = gruppen[rid];
    // Antworten desselben Rundgangs reisen mit (ENT-305) -- eine Anfrage,
    // eine Uebermittlung. Getrennt gesendet koennte ein Punkt ankommen und
    // seine Aufgaben nicht, und die Auswertung zeigte einen bestaetigten
    // Punkt ohne die Arbeit, die dort getan wurde.
    const aufg = rdAufgabenWarteschlangeLesen().filter(a => Number(a.rundgang_id) === Number(rid));
    return api('mein_rundgang_scan.php', { method: 'POST', body: {
      rundgang_id: Number(rid),
      scans: scans.map(({ rundgang_id, ...rest }) => rest),
      aufgaben: aufg.map(({ rundgang_id, ...rest }) => rest),
    } }).then(({ ok, data }) => {
      if (!ok || data.status !== 'ok') { return; } // bleibt in der Warteschlange
      // Nur die in DIESER Anfrage tatsaechlich uebermittelten Punkte entfernen
      // -- nicht die gesamte Gruppe. Kommt zwischen Abschicken und Antwort ein
      // weiterer Punkt fuer denselben Rundgang dazu, darf der nicht mit
      // verschwinden, ohne je gesendet worden zu sein.
      const gesendeteIds = new Set(scans.map(s => Number(s.kontrollpunkt_id)));
      rdWarteschlangeSchreiben(rdWarteschlangeLesen().filter(e =>
        !(Number(e.rundgang_id) === Number(rid) && gesendeteIds.has(Number(e.kontrollpunkt_id)))));
      // Nur die Antworten entfernen, die der Server auch angenommen hat.
      // Eine abgelehnte (z.B. fehlender Grund) bleibt stehen und wird erneut
      // versucht, statt lautlos zu verschwinden.
      const angenommen = new Set((data.aufgaben_ergebnisse || [])
        .filter(r => r.status === 'ok').map(r => r.kontrollpunkt_id + ':' + r.aufgabe_id));
      if (aufg.length) {
        rdAufgabenWarteschlangeSchreiben(rdAufgabenWarteschlangeLesen().filter(e =>
          !(Number(e.rundgang_id) === Number(rid)
            && angenommen.has(e.kontrollpunkt_id + ':' + e.aufgabe_id))));
      }
      const ergebnisse = data.ergebnisse || [];
      let abgelehnt = false;
      if (rundgangAktiv && Number(rundgangAktiv.id) === Number(rid)) {
        scans.forEach(s => {
          const k = rundgangAktiv.kontrollpunkte.find(x => Number(x.id) === Number(s.kontrollpunkt_id));
          if (!k) return;
          const r = ergebnisse.find(x => Number(x.kontrollpunkt_id) === Number(s.kontrollpunkt_id));
          if (r && r.status === 'fehler') { k.erledigt = null; k.wartend = false; k.fehler = r.message; abgelehnt = true; }
          else { k.wartend = false; }
        });
        // Schliesst der letzte offene Kontrollpunkt den Rundgang automatisch
        // ab (server-seitig, ENT-182), muss das auch hier ankommen -- sonst
        // bietet der Fuss weiterhin "Beenden" auf einem bereits fertigen
        // Rundgang an.
        if (data.rundgang_status) { rundgangAktiv.status = data.rundgang_status; }
        rundgangListeZeichnen();
      }
      if (abgelehnt) { toast(w('rundgangAbgelehntSpaeter')); }
    }).catch(() => {});
  }));
}
window.addEventListener('online', rdWarteschlangeSenden);
// Ereignismeldungen ziehen beim selben Anlass nach (ENT-295) -- eigene
// Warteschlange, weil sie an einen anderen Endpunkt geht.
window.addEventListener('online', evWarteschlangeSenden);

// ── Abschnitt in der Schicht-Schublade: Start- bzw. Fortsetzen-Knopf ────
// Eigener Platzhalter (#blRundgang, analog #blDok): eine eigene Abfrage darf
// das Oeffnen der Schicht nicht aufhalten, und ohne Berechtigung bleibt der
// Platz schlicht leer.
function rundgangAbschnittZeichnen(e) {
  const el = $('blRundgang'); if (!el) return;
  el.innerHTML = '';
  if (!darfRundgang(e)) return;
  const einsatzId = Number(e.id);
  api('mein_rundgang_offen.php?einsatz_id=' + einsatzId).then(({ ok, data }) => {
    if (blattId !== einsatzId) return; // Schublade inzwischen gewechselt
    const el2 = $('blRundgang'); if (!el2) return;
    const laeuft = ok && data.status === 'ok' && data.rundgang;
    el2.innerHTML = laeuft
      ? `<button class="btn btn-primary btn-wide" style="margin-top:4px" onclick="rundgangFortsetzen(${einsatzId})">${esc(w('rundgangFortsetzen'))}</button>`
      : `<button class="btn btn-primary btn-wide" style="margin-top:4px" onclick="rundgangStarten(${einsatzId})">${esc(w('rundgangStarten'))}</button>`;
  });
}

// Gibt es fuer das Objekt mehrere Kontrollrunden (ENT-204), fragt ein
// Zwischenschritt, welche gemacht wird -- bei keiner oder genau einer
// Vorlage entfaellt die Frage: ohne Vorlage unveraendertes Verhalten von vor
// ENT-204 (alle aktiven Kontrollpunkte), mit genau einer ist die Auswahl
// keine echte Entscheidung.
let rdVorlagenGeladen = [];

// Zweiter Weg in den Rundgang -- derselbe Riegel (ENT-340). Ein Riegel, um
// den ein Weg herumfuehrt, ist keiner.
function rundgangStarten(einsatzId) {
  fzuTor(() => rundgangStartenNachFrage(einsatzId));
}

function rundgangStartenNachFrage(einsatzId) {
  const btn = document.querySelector('#blRundgang button');
  if (btn) btn.disabled = true;
  api('mein_rundgang_vorlagen.php?einsatz_id=' + einsatzId).then(({ ok, data }) => {
    const vorlagen = (ok && data.status === 'ok') ? (data.vorlagen || []) : [];
    rdVorlagenGeladen = vorlagen;
    if (vorlagen.length > 1) {
      if (btn) btn.disabled = false;
      rundgangVorlageWahl(einsatzId, vorlagen);
      return;
    }
    rundgangVorlageWaehlen(einsatzId, vorlagen[0] ? vorlagen[0].id : null);
  });
}

function rundgangVorlageWahl(einsatzId, vorlagen) {
  const e = schichten.find(x => Number(x.id) === Number(einsatzId));
  if (!e) return;
  $('blTitel').textContent = w('rundgangVorlageWahlTitel');
  $('blBody').innerHTML = `
    <div style="font-size:13px;color:var(--ink-3);font-weight:620;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px">${esc(e.objekt_name || e.kunde_name)}</div>
    <p style="margin:0 0 14px">${esc(w('rundgangVorlageWahlHinweis'))}</p>
    <div id="rdVorlageListe" style="display:flex;flex-direction:column;gap:8px">
      ${vorlagen.map(v => `<button class="btn btn-primary btn-wide" onclick="rundgangVorlageWaehlen(${Number(einsatzId)},${Number(v.id)})">${esc(v.name)}</button>`).join('')}
    </div>`;
  $('blFuss').innerHTML = `<button class="btn btn-plain" onclick="blattAuf(${Number(einsatzId)})">${esc(w('zurueck'))}</button>`;
  blattZeigen();
}

// Neu (ENT-279): Weiche zwischen sofortigem Start und Grundauswahl. Liegt
// "jetzt" ausserhalb des Fensters der gewaehlten Vorlage (Toleranz
// eingerechnet), fragt zuerst einen Pflichtgrund ab, statt sofort zu
// starten. Die eigentliche Sperre bleibt serverseitig
// (mein_rundgang_starten.php) -- hier nur die UX-Weiche.
function rundgangVorlageWaehlen(einsatzId, vorlageId) {
  const v = vorlageId ? rdVorlagenGeladen.find(x => Number(x.id) === Number(vorlageId)) : null;
  if (v && v.fenster_von && v.fenster_bis &&
      !rundgangImFenster(jetztDatetime().slice(11, 16), v.fenster_von, v.fenster_bis, RUNDGANG_FENSTER_TOLERANZ_MIN)) {
    rundgangAusnahmeGrundWahl(einsatzId, vorlageId);
    return;
  }
  rundgangStartenMitVorlage(einsatzId, vorlageId, null);
}

// Gleiches UX-Muster wie rundgangAbbrechenAnzeigen() (Grund-Auswahl,
// Pflichtfeld, eigene Fehleranzeige) -- eigene, kleinere Grundliste
// (RUNDGANG_AUSSERHALB_FENSTER_GRUENDE), weil die Situation eine andere ist
// (Start ausserhalb des Fensters, kein Abbruch).
function rundgangAusnahmeGrundWahl(einsatzId, vorlageId) {
  $('blTitel').textContent = w('rundgangAusserhalbFensterTitel');
  $('blBody').innerHTML = `
    <div class="msg-err" style="color:var(--warn);background:var(--warn-soft)">${esc(w('rundgangAusserhalbFensterHinweis'))}</div>
    <div class="f"><label for="rfGrund">${esc(w('rundgangAusserhalbFensterGrund'))}</label>
      <select class="inp" id="rfGrund">
        <option value="">–</option>
        ${Object.entries(RUNDGANG_AUSSERHALB_FENSTER_GRUENDE).map(([code, txt]) =>
          `<option value="${esc(code)}">${esc(txt)}</option>`).join('')}
      </select>
    </div>
    <div id="rfErr" class="msg-err" style="display:none"></div>`;
  $('blFuss').innerHTML = `
    <button class="btn btn-plain" onclick="blattAuf(${Number(einsatzId)})">${esc(w('zurueck'))}</button>
    <button class="btn btn-primary" id="rfBtn" onclick="rundgangAusnahmeGrundSenden(${Number(einsatzId)},${vorlageId ? Number(vorlageId) : 'null'})">${esc(w('rundgangStarten'))}</button>`;
  blattZeigen();
}

function rundgangAusnahmeGrundSenden(einsatzId, vorlageId) {
  const err = $('rfErr'); err.style.display = 'none';
  const grund = $('rfGrund').value;
  if (!grund) { err.textContent = w('rundgangAbbrechenGrundPflicht'); err.style.display = ''; return; }
  rundgangStartenMitVorlage(einsatzId, vorlageId, grund);
}

function rundgangStartenMitVorlage(einsatzId, vorlageId, ausnahmeGrund) {
  document.querySelectorAll('#blRundgang button, #rdVorlageListe button, #rfBtn').forEach(b => b.disabled = true);
  const body = { einsatz_id: einsatzId };
  if (vorlageId) body.vorlage_id = vorlageId;
  if (ausnahmeGrund) body.ausnahme_grund = ausnahmeGrund;
  api('mein_rundgang_starten.php', { method: 'POST', body }).then(({ ok, data }) => {
    if (!ok || data.status !== 'ok') {
      document.querySelectorAll('#blRundgang button, #rdVorlageListe button, #rfBtn').forEach(b => b.disabled = false);
      toast(data.message || w('netzfehler'));
      return;
    }
    rundgangAktiv = { id: data.rundgang_id, einsatz_id: einsatzId, status: 'vorbereitet', pausiert_seit: null,
      vorbereitet_am: jetztDatetime(), pause_minuten: 0,
      kontrollpunkte: (data.kontrollpunkte || []).map(k => ({ ...k, erledigt: null })) };
    rundgangAnzeigen(einsatzId);
  });
}

function rundgangFortsetzen(einsatzId) {
  const btn = document.querySelector('#blRundgang button');
  if (btn) btn.disabled = true;
  api('mein_rundgang_offen.php?einsatz_id=' + einsatzId).then(({ ok, data }) => {
    if (btn) btn.disabled = false;
    if (!ok || data.status !== 'ok' || !data.rundgang) {
      toast(data.message || w('netzfehler'));
      rundgangAbschnittZeichnen(schichten.find(x => Number(x.id) === einsatzId));
      return;
    }
    const r = data.rundgang;
    // Was im Geraet auf die Uebermittlung wartet, gehoert ueber das, was
    // der Server weiss (ENT-321) -- sonst faellt ein offline bestaetigter
    // Punkt beim Laden auf "offen" zurueck.
    r.kontrollpunkte = rdWarteschlangeUeberlagern(r.kontrollpunkte, r.id);
    rundgangAktiv = { id: r.id, einsatz_id: einsatzId, kontrollpunkte: r.kontrollpunkte,
      status: r.status, pausiert_seit: r.pausiert_seit,
      // Fuer den Timer (ENT-306). Beides kommt vom Server, nicht vom Geraet:
      // Wer die Runde auf einem zweiten Geraet fortsetzt, soll dieselbe
      // Laufzeit sehen.
      vorbereitet_am: r.vorbereitet_am || null,
      pause_minuten: Number(r.pause_minuten || 0),
      // Fuer die Endzeit des Timers (ENT-321): Ist die Runde beendet,
      // zaehlt die Uhr bis hierhin und nicht bis jetzt.
      rohzeit_ende: r.rohzeit_ende || null,
      // Objekt, Ansprechpartner und Zentrale (ENT-308). Sie standen bis
      // hierher nur in der Vorschau -- also ausgerechnet vor dem Losgehen und
      // nicht in dem Moment, in dem jemand vor Ort etwas vorfindet. Der
      // Endpunkt liefert sie jetzt mit; ohne diese vier Zeilen kaeme die
      // Funktion "Ansprechpartner und Notruf" waehrend der Runde leer heraus.
      objekt: r.objekt || null,
      kunde_name: r.kunde_name || '',
      ansprechpartner: r.ansprechpartner || [],
      zentrale: r.zentrale || null };
    rundgangAnzeigen(einsatzId);
  });
}

// ── Screen 2: die Checkliste, im selben #blatt wie die Schicht selbst ──
/* Die laufende Runde als Vollseite statt als Schublade (ENT-306).
   Vom Projektinhaber verlangt ("unsere Maske sieht noch sehr, sehr schlicht
   aus"), schrittweise gebaut: zuerst das Geruest -- Reiter, Zaehler, Timer --,
   die Karte folgt.

   Die kurzen Eingaben (Ersatzscan, "nicht verfuegbar", Aufgaben-Rueckfrage,
   Abbruchgrund) bleiben Schubladen UEBER dieser Seite. Genau dafuer wurde die
   Schichtung in ENT-294 gebaut (z-index 55 gegen 61); sie hier nachzubauen
   hiesse, fuenf funktionierende Ablaeufe gleichzeitig anzufassen. */
function rundgangAnzeigen(einsatzId) {
  const e = schichten.find(x => Number(x.id) === Number(einsatzId));
  if (!e || !rundgangAktiv) return;
  // Eine offene Schublade gehoert zu einem Schritt, der jetzt vorbei ist.
  blattZu();
  rgsModus = 'lauf';
  rgsAnsicht = 'uebersicht';
  rgsVorlageId = null;
  // Ist die Runde beendet oder abgebrochen, gehoert der Blick auf die
  // Kontrollpunkte: Dort steht, was daraus geworden ist. Im Funktionen-Reiter
  // stuende der Nutzer sonst vor einer Liste, aus der gerade alles
  // verschwunden ist.
  if (rundgangAktiv.status === 'abgebrochen' || rundgangAktiv.status === 'abgeschlossen') {
    rgsReiter = 'punkte';
  } else if (rgsReiter !== 'karte' && !rgsLaufBegonnen
             && rgKarteDaten(rundgangAktiv.kontrollpunkte).zeigbar.length) {
    /* Eine frisch begonnene Runde startet auf der KARTE (ENT-331), Vorgabe
       des Projektinhabers. Sie beantwortet die Frage, die man beim
       Losgehen wirklich hat: wo bin ich, wo ist der nächste Punkt. Die
       Liste beantwortet „was ist schon erledigt" -- das interessiert
       später.
       Nur beim ERSTEN Zeichnen der Runde: Wer danach bewusst auf einen
       anderen Reiter wechselt, soll dort bleiben, auch wenn die Seite
       neu gezeichnet wird (das geschieht bei jeder neuen Position).

       Und nur, wenn die Karte überhaupt etwas zeigen kann: Eine Runde aus
       lauter NFC-Punkten hat keine Koordinaten. Dort auf die Karte zu
       springen hiesse, den Wächter mit „keine darstellbaren Punkte" zu
       begrüssen — und ihm den einen Reiter wegzunehmen, der ihm hilft. */
    rgsReiter = 'karte';
  }
  rgsLaufBegonnen = true;
  rgsLaufTitel = e.objekt_name || e.kunde_name || w('rgsLaufTitel');
  $('rgsTitel').textContent = rgsLaufTitel;
  $('rgsFuss').innerHTML = '';
  $('rgsFuss').hidden = true;
  $('rgsReiter').hidden = false;
  rgZahlenAn(true);
  $('rgSeite').classList.add('on');
  $('rgSeite').setAttribute('aria-hidden', 'false');
  rgLaufReiterZeichnen();
  rgLaufZeichnen();
  rgTimerStarten();
  // Ortung nur, solange die Runde tatsaechlich laeuft (ENT-317). Auf einer
  // beendeten, abgebrochenen oder pausierten Runde hat sie nichts zu suchen
  // -- so vom Projektinhaber verlangt ("wenn der Rundgang beendet wird, wird
  // die Verfolgung nicht mehr aktiv"). Der Zustand wird bei jedem Zeichnen
  // neu beurteilt, nicht nur hier: Eine Runde kann waehrend der Anzeige
  // enden, etwa mit dem letzten Kontrollpunkt.
  rgOrtungNachfuehren();
  // Der Tonkanal muss aus einer Nutzeraktion heraus entstehen, sonst bleibt
  // er auf iOS stumm (ENT-319). Das Oeffnen der Runde IST eine -- jemand
  // hat getippt, um hierherzukommen.
  rgTonEntsperren();
  rdWarteschlangeSenden();
}

/* Eine Stelle entscheidet, ob geortet wird -- nicht fuenf verstreute
   Aufrufe. Wer das an jedem Zustandswechsel einzeln einbaut, vergisst
   genau den einen, nach dem die Ortung weiterlaeuft. */
function rgOrtungNachfuehren() {
  const laeuft = rgsModus === 'lauf' && rundgangAktiv
    && rundgangAktiv.status !== 'abgeschlossen'
    && rundgangAktiv.status !== 'abgebrochen'
    && rundgangAktiv.status !== 'pausiert';
  if (laeuft) { rgOrtungStarten(); } else { rgOrtungStoppen(); }
}

function rgLaufReiterZeichnen() {
  // Nur Reiter, die etwas zeigen. Ein "Karte"-Reiter mit dem Hinweis "folgt"
  // waere ein Knopf, der nichts tut -- der zweite Schritt bringt ihn samt
  // Inhalt.
  const offeneAufgaben = (rundgangAktiv ? rundgangAktiv.kontrollpunkte : [])
    .reduce((n, k) => n + (k.erledigt ? rdAufgabenOffen(k).length : 0), 0);
  // Auf der Karte darstellbar ist nur, was Koordinaten hat -- NFC-Punkte
  // haben keine (ENT-265). Die Zahl am Reiter nennt darum die DARSTELLBAREN,
  // und die Karte selbst sagt, wie viele sie nicht zeigt.
  const kartePunkte = rgKarteDaten(rundgangAktiv ? rundgangAktiv.kontrollpunkte : []);
  $('rgsReiter').innerHTML = [
    ['karte', w('rgsReiterKarte'),
      '<polygon points="1 6 8 3 16 6 23 3 23 18 16 21 8 18 1 21"/><line x1="8" y1="3" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="21"/>', 0],
    ['punkte', w('rgsReiterPunkte'),
      '<circle cx="12" cy="10" r="3"/><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/>', 0],
    ['funktionen', w('rgsReiterFunktionen'),
      '<circle cx="12" cy="12" r="1.6"/><circle cx="5" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>', offeneAufgaben],
  ].map(([id, lbl, pfad, zahl]) => `<button type="button" id="rgsRt-${id}"
      class="${rgsReiter === id ? 'an' : ''}" onclick="rgLaufReiter('${id}')">
      <span style="position:relative;display:inline-flex">
        <svg class="i i-sm" viewBox="0 0 24 24">${pfad}</svg>
        ${zahl ? `<span class="zahl">${zahl}</span>` : ''}
      </span>
      <span>${esc(lbl)}</span>
    </button>`).join('');
}

function rgLaufReiter(id) {
  rgsReiter = id;
  rgLaufReiterZeichnen();
  rgLaufZeichnen();
}

function rgLaufZeichnen() {
  if (rgsModus !== 'lauf' || !rundgangAktiv) return;
  // NACH dem Riegel und nicht davor (ENT-317): Die Ortung ist eine
  // Zusatzfunktion; sie darf das Zeichnen der Seite weder verhindern noch
  // verzoegern. Beim Bauen stand sie eine Zeile zu frueh -- ein Fehler in
  // watchPosition riss die ganze Seite mit und der Waechter sah einen
  // leeren Rumpf statt seiner Kontrollpunkte. Von der Regression gefunden.
  rgOrtungNachfuehren();
  rgWachAnfordern();
  // Erst abraeumen, dann setzt nur der echte Kartenpfad die Klasse wieder.
  // Anders herum bliebe sie stehen, wenn die Karte nichts zu zeigen hat und
  // stattdessen ein Warnblock erscheint -- der klebte dann am Bildschirmrand.
  rgVollflaeche(false);
  if (rgsReiter === 'karte') { rgKarteZeichnen(); }
  else if (rgsReiter === 'funktionen') { rgLaufFunktionen(); }
  else {
    // rdFortschritt bleibt bestehen, traegt aber seit ENT-306 nur noch den
    // ZUSTAND ("abgebrochen"/"abgeschlossen"). Die Zahl steht im Kopf, wo sie
    // auch beim Scrollen sichtbar bleibt -- sie zweimal zu zeigen waere
    // dieselbe Angabe an zwei Orten, die auseinanderlaufen koennen.
    // Die Warnung gehoert AUCH hierher (ENT-320): Der Waechter steht vor
    // dem Kontrollpunkt und tippt auf "Bestaetigen", nicht auf die Karte.
    // Nur unter der Karte zu warnen hiesse, sie dort zu verstecken, wo er
    // gerade nicht hinsieht.
    // Hier gibt es keine Karte, auf die etwas gelegt werden koennte -- darum
    // stehen dieselben Chips als schmale Zeile oben (ENT-361).
    $('rgsBody').innerHTML =
      rgZahlenChipsHtml(false)
      + rgOrtungHinweisHtml()
      + `<div id="rdFortschritt" class="rd-zustand"></div><div id="rdBanner"></div><div id="rdListe"></div>`;
    rundgangListeZeichnen();
  }
  rgLaufKopfZeichnen();
}

// Zaehler und Timer. Der Zaehler nennt erledigte UND gesamte Punkte -- eine
// blosse Zahl liesse offen, wovon (CLAUDE.md: keine Zahl ohne Bezug).
function rgLaufKopfZeichnen() {
  if (rgsModus !== 'lauf' || !rundgangAktiv) return;
  const kps = rundgangAktiv.kontrollpunkte || [];
  const fertig = kps.filter(k => k.erledigt).length;
  const z = $('rgsZaehler'); if (z) { z.textContent = `${fertig} / ${kps.length}`; }
  const t = $('rgsTimer');
  if (t) { t.textContent = rgLaufzeit(); }
  // Die Ortungsanzeige auf der Karte altert mit der Zeit ("steht seit 3 min")
  // -- sie muss darum mit demselben Takt nachgefuehrt werden wie die Uhr,
  // sonst bliebe sie auf dem Stand der letzten Positionsmeldung stehen.
  rgOrtChipZeichnen();
}

/* Laufzeit seit Rundgangbeginn, PAUSEN ABGEZOGEN.
   Bewusst nicht die Rohzeit: Die beginnt nach ENT-145 erst mit dem ersten
   bestaetigten Punkt und stuende auf 00:00, waehrend der Waechter noch zum
   ersten Tor laeuft. Der Timer beantwortet "wie lange bin ich dran", nicht
   "was wird verrechnet" -- die Rohzeit bleibt davon unberuehrt und wird
   weiterhin allein serverseitig gefuehrt. */
function rgLaufzeit() {
  const start = rundgangAktiv && (rundgangAktiv.vorbereitet_am || rundgangAktiv.gestartet_am);
  if (!start) return '–';
  const ms = Date.parse(String(start).replace(' ', 'T')) || 0;
  if (!ms) return '–';
  // Eine BEENDETE Runde zaehlt nicht weiter (ENT-321). Vom Projektinhaber
  // im ersten echten Rundgang gefunden: Es stand "Rundgang abgeschlossen"
  // da, und die Uhr lief trotzdem -- nach vier Minuten auf 5:50, nach einer
  // Stunde auf 1:33:17. Der Timer beantwortet "wie lange bin ich dran";
  // wer fertig ist, ist gar nicht mehr dran.
  //
  // Gerechnet wird bis zum ENDE, nicht bis jetzt. Das Ende ist die
  // Serverzeit (rohzeit_ende), solange sie da ist; fehlt sie -- etwa weil
  // der letzte Punkt offline erfasst wurde --, faellt die Uhr auf den
  // letzten erfassten Scan zurueck. Sie einfach stehen zu lassen waere
  // ungenau: Beim naechsten Oeffnen staende sonst eine andere Zahl.
  const bis = rgLaufEndeMs();
  let sek = Math.max(0, Math.floor(((bis || Date.now()) - ms) / 1000));
  sek -= Math.max(0, Number(rundgangAktiv.pause_minuten || 0)) * 60;
  // Laufende Pause mitrechnen: Sonst liefe die Uhr weiter, waehrend die
  // Runde steht -- und zeigte am Ende mehr, als gearbeitet wurde.
  // Auf einer beendeten Runde entfaellt das: Dort ist nichts mehr laufend.
  if (!bis && rundgangAktiv.status === 'pausiert' && rundgangAktiv.pausiert_seit) {
    const pms = Date.parse(String(rundgangAktiv.pausiert_seit).replace(' ', 'T'));
    if (pms) { sek -= Math.max(0, Math.floor((Date.now() - pms) / 1000)); }
  }
  sek = Math.max(0, sek);
  const p = n => String(n).padStart(2, '0');
  return `${p(Math.floor(sek / 3600))}:${p(Math.floor(sek / 60) % 60)}:${p(sek % 60)}`;
}

/* Wann die Runde geendet hat -- oder null, wenn sie noch laeuft (ENT-321).
   Drei Quellen in dieser Reihenfolge, weil sie unterschiedlich verlaesslich
   sind:
     1. rohzeit_ende vom Server -- die Wahrheit, sobald sie da ist
     2. der spaeteste erfasste Scan -- wenn der letzte Punkt offline
        bestaetigt wurde und der Server es noch nicht weiss
     3. null -- die Runde laeuft wirklich noch */
function rgLaufEndeMs() {
  if (!rundgangAktiv) { return null; }
  const kps = rundgangAktiv.kontrollpunkte || [];
  const beendet = rundgangAktiv.status === 'abgeschlossen'
    || rundgangAktiv.status === 'abgebrochen'
    || (kps.length > 0 && kps.every(k => k.erledigt));
  if (!beendet) { return null; }
  const ende = rundgangAktiv.rohzeit_ende || rundgangAktiv.beendet_am;
  if (ende) {
    const t = Date.parse(String(ende).replace(' ', 'T'));
    if (t) { return t; }
  }
  let letzte = 0;
  kps.forEach(k => {
    if (!k.erledigt || !k.erledigt.erfasst_am) { return; }
    const t = Date.parse(String(k.erledigt.erfasst_am).replace(' ', 'T'));
    if (t && t > letzte) { letzte = t; }
  });
  return letzte || null;
}

function rgTimerStarten() {
  rgTimerStoppen();
  rgsTimerLauf = setInterval(() => {
    rgLaufKopfZeichnen();
    // Sobald die Runde zu Ende ist, hoert die Uhr auf zu ticken. Einmal
    // zeichnet sie noch -- damit die Endzeit dasteht -- und dann ist Ruhe.
    // Ohne das liefe ein Zeitgeber im Sekundentakt weiter, auf einer Seite,
    // an der sich nichts mehr aendert.
    if (rgLaufEndeMs() !== null) { rgTimerStoppen(); }
  }, 1000);
}
function rgTimerStoppen() {
  if (rgsTimerLauf) { clearInterval(rgsTimerLauf); rgsTimerLauf = null; }
}

// Funktionen-Reiter der laufenden Runde. Vier Eintraege, alle aus
// rundgangAktiv allein bedienbar -- Ansprechpartner und Notruf brauchen die
// Vorschau-Daten und kommen mit dem zweiten Schritt dazu.
function rgLaufFunktionen() {
  const einsatzId = Number(rundgangAktiv.einsatz_id);
  const pausiert = rundgangAktiv.status === 'pausiert';
  // NICHT nur am Status: Wird der letzte Punkt offline erfasst, ist die Runde
  // faktisch fertig, waehrend der Server sie noch als 'laeuft' fuehrt. Genau
  // dieselbe Bedingung nutzte der frueher hier stehende Fuss (ENT-146) --
  // sonst boete die Seite Pausieren auf einer erledigten Runde an.
  const kpsAlle = rundgangAktiv.kontrollpunkte || [];
  const beendet = rundgangAktiv.status === 'abgeschlossen' || rundgangAktiv.status === 'abgebrochen'
    || (kpsAlle.length > 0 && kpsAlle.every(k => k.erledigt));
  const aufgabenGesamt = (rundgangAktiv.kontrollpunkte || [])
    .reduce((n, k) => n + ((k.aufgaben || []).length), 0);
  const modul = (id, wort, pfad, extra) => `<button type="button" class="rgs-modul" id="${id}" ${extra || ''}>
      <span class="rgs-modul-ic"><svg class="i i-sm" viewBox="0 0 24 24">${pfad}</svg></span>
      <span>${esc(wort)}</span>
    </button>`;
  $('rgsBody').innerHTML = `
    ${rgZahlenChipsHtml(false)}
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="rgs-mod-lb" id="rgsFunktionenLb">${esc(w('rgsFunktionen'))}</div>
      ${modul('rgsLaufEreignis', w('evTitel'),
        '<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
        'onclick="evOeffnen()"')}
      ${aufgabenGesamt ? `<button type="button" class="rgs-modul" id="rgsLaufAufgaben" onclick="rgLaufAufgabenListe()">
        <span class="rgs-modul-ic"><svg class="i i-sm" viewBox="0 0 24 24"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><polyline points="4 6 5 7 7 5"/><polyline points="4 12 5 13 7 11"/><polyline points="4 18 5 19 7 17"/></svg></span>
        <span>${esc(w('afTitel'))}</span>
        <span class="rgs-modul-zahl">${aufgabenGesamt}</span>
      </button>` : ''}
      ${beendet ? '' : modul('rgsLaufPause', pausiert ? w('rgsFortsetzen') : w('rgsPausieren'),
        pausiert ? '<polygon points="6 4 20 12 6 20 6 4"/>'
                 : '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>',
        `onclick="rgLaufPause(${einsatzId})"`)}
      ${(!beendet && rgWachMoeglich()) ? `<button type="button" class="rgs-modul" id="rgsLaufWach"
        onclick="rgWachUm()" aria-pressed="${rgWachAn() ? 'true' : 'false'}">
        <span class="rgs-modul-ic"><svg class="i i-sm" viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg></span>
        <span>${esc(w('rgsWach'))}</span>
        <span class="rgs-modul-zust${rgWachAn() ? ' an' : ''}" id="rgsLaufWachZust">${esc(w(rgWachAn() ? 'rgsWachEin' : 'rgsWachAus'))}</span>
      </button>
      <div class="rgs-modul-txt" id="rgsLaufWachTxt">${esc(w('rgsWachTxt'))}</div>` : ''}
      ${modul('rgsLaufKontakte', w('rgsHilfe'),
        '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.4-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
        'onclick="rgLaufKontakte()"')}
      ${beendet ? '' : modul('rgsLaufAbbrechen', w('rgsAbbrechenModul'),
        '<circle cx="12" cy="12" r="9"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/>',
        `onclick="rundgangAbbrechenAnzeigen(${einsatzId})"`)}
    </div>`;
}

/* ══ Karte der laufenden Runde (ENT-308) ═══════════════════════════════
   Google Maps, wie in ENT-157 fuer das Dashboard entschieden und dort seit
   ENT-269 im Einsatz -- derselbe clientseitige Browserschluessel, dieselbe
   Referrer-Einschraenkung. Kein zweiter Kartenanbieter fuer dieselbe Aufgabe.

   Drei Dinge, die diese Karte anders machen muss als die im Dashboard:
   1. Sie laeuft OHNE NETZ ins Leere. Der Waechter steht im Keller. Statt
      eines grauen Rechtecks sagt sie dann, was los ist -- und weist auf die
      Liste hin, die offline weiterhin vollstaendig da ist.
   2. NFC-Punkte haben keine Koordinaten (ENT-265) und koennen gar nicht
      erscheinen. Die Karte nennt darum ausdruecklich, wie viele sie NICHT
      zeigt: "nicht darstellbar" darf nie wie "nicht vorhanden" aussehen
      (CLAUDE.md).
   3. Die eigene Position wird GEZEIGT, aber nicht aufgezeichnet -- ENT-131
      schliesst die kontinuierliche Positionsverfolgung aus. Kein watchPosition,
      keine Uebermittlung, nur ein einmaliger Abruf auf Knopfdruck. */
// Platzhalter, beim Deploy aus GitHub Secrets ersetzt (ENT-341) -- eigener
// Schluessel je Umgebung, damit die produktive Referrer-Beschraenkung in
// der Google-Cloud-Konsole unangetastet bleibt und Staging-Tests nicht
// dasselbe Kontingent verbrauchen. Vorher stand hier der Schluessel im
// Klartext; das Sichtbarwerden im Quelltext war schon davor normal und
// unvermeidbar (Client-Schluessel), der Schutz laeuft weiterhin ueber die
// Referrer-Einschraenkung, nicht ueber Geheimhaltung.
const RGS_MAPS_SCHLUESSEL = '__MAPS_JS_KEY__';
let rgsMapsVersprechen = null;
let rgsKarte = null, rgsKartenMarken = [], rgsKartenKreise = [], rgsStandortMarke = null;
// Der Schluessel wurde vom Kartenanbieter abgelehnt (ENT-309). Eigener
// Zustand, weil dieser Fall NICHT ueber das Versprechen laeuft: Das Skript
// laedt, google.maps ist da, `new google.maps.Map` gelingt -- und erst
// danach meldet der Anbieter asynchron, dass der Schluessel fuer diese
// Seite nicht gilt. Bis hierher fiel das durch beide Netze und der
// Waechter sah die graue Tafel des Anbieters mit dem Rat, die
// JavaScript-Konsole zu oeffnen. Auf einem Diensthandy nachts ist das
// keine Auskunft.
let rgsMapsAbgelehnt = false;

/* Der Kartenanbieter ruft diese Funktion beim Namen auf, wenn er den
   Schluessel ablehnt -- falscher Schluessel, nicht freigegebene Adresse,
   abgeschaltete Abrechnung. Sie ist die einzige Stelle, an der sich das
   ueberhaupt abfangen laesst; einen Fehlercode uebergibt er dabei nicht,
   der steht nur in der Konsole. Darum sagt der Text, WAS zu tun ist
   (melden, weiterarbeiten), und nicht, was schiefging. */
window.gm_authFailure = function () {
  rgsMapsAbgelehnt = true;
  rgKarteGesperrtZeigen();
};

/* Eine Karte, die STEHT, wird nicht zugedeckt (ENT-312).
   Vom Projektinhaber gemeldet: "Die Karte laedt nun kurz und danach kommt
   deine Meldung, die die Karte wieder ueberdeckt."

   Der Anbieter ruft gm_authFailure auch dann, wenn die Kacheln bereits
   gezeichnet sind. Die erste Fassung (ENT-309) raeumte daraufhin den
   Container leer und legte den Text ueber die ganze Flaeche -- richtig
   gegen ein graues Rechteck, falsch gegen eine benutzbare Karte. Sie nahm
   dem Waechter genau das weg, wofuer die Meldung eigentlich warnt.

   Darum zwei Faelle statt einem:
   - Karte steht  -> schmaler Streifen UNTER der Karte, sie bleibt bedienbar.
   - Karte fehlt  -> weiterhin die ganze Flaeche, sonst bliebe ein graues
                     Rechteck ohne Erklaerung (der Fall aus ENT-309). */
function rgKarteGesperrtZeigen() {
  const karte = $('rgsKarte');
  if (!karte) { return; }

  if (rgsKarte) {
    const huelle = karte.closest('.rgs-karte-huelle');
    if (huelle && !$('rgsKarteWarnung')) {
      const streifen = document.createElement('div');
      streifen.className = 'rgs-karte-hinweis fehler';
      streifen.id = 'rgsKarteWarnung';
      streifen.textContent = w('rgsKarteGesperrtKurz');
      huelle.parentNode.insertBefore(streifen, huelle.nextSibling);
    }
    return;
  }

  karte.innerHTML = '';
  rgsKartenMarken = []; rgsKartenKreise = []; rgsStandortMarke = null;
  let stand = $('rgsKarteStand');
  if (!stand) {
    stand = document.createElement('div');
    stand.className = 'rgs-karte-stand';
    stand.id = 'rgsKarteStand';
    karte.parentNode.appendChild(stand);
  }
  stand.textContent = w('rgsKarteGesperrt');
  stand.classList.add('fehler');
  // Der Zentrieren-Knopf zentriert nichts mehr -- ein Knopf, der nichts tut,
  // ist schlimmer als keiner.
  const btn = $('rgsZentrieren'); if (btn) { btn.remove(); }
}

function rgsMapsLaden() {
  if (rgsMapsVersprechen) { return rgsMapsVersprechen; }
  rgsMapsVersprechen = new Promise((resolve, reject) => {
    if (window.google && window.google.maps) { resolve(); return; }
    const skript = document.createElement('script');
    skript.src = 'https://maps.googleapis.com/maps/api/js?key=' + RGS_MAPS_SCHLUESSEL;
    // NICHT einfach resolve: Ein blockiertes oder leer beantwortetes Skript
    // loest ebenfalls onload aus, ohne google.maps zu definieren -- so
    // gefunden in der Pruefung, die maps.googleapis.com abweist. Ohne diese
    // Weiche bekaeme der Waechter ein graues Rechteck ohne jede Erklaerung,
    // also genau das, was diese Karte vermeiden soll.
    skript.onload = () => {
      if (window.google && window.google.maps) { resolve(); return; }
      rgsMapsVersprechen = null;
      reject(new Error('maps-leer'));
    };
    skript.onerror = () => {
      // Beim naechsten Versuch neu laden duerfen: Ohne das Zuruecksetzen
      // bliebe ein einmaliger Netzaussetzer fuer den Rest der Sitzung
      // haengen -- und der Waechter kaeme aus dem Keller heraus nie mehr an
      // die Karte.
      rgsMapsVersprechen = null;
      reject(new Error('maps'));
    };
    document.head.appendChild(skript);
  });
  return rgsMapsVersprechen;
}

/* Was laesst sich zeichnen, was nicht -- als reine Funktion, damit es sich
   ohne geladene Karte pruefen laesst. */
function rgKarteDaten(kontrollpunkte) {
  const zeigbar = [], ohneOrt = [];
  (kontrollpunkte || []).forEach((k, i) => {
    const lat = Number(k.lat), lng = Number(k.lng);
    if (k.lat === null || k.lat === undefined || k.lng === null || k.lng === undefined
        || !isFinite(lat) || !isFinite(lng)) { ohneOrt.push(k); return; }
    zeigbar.push({ nr: i + 1, id: Number(k.id), bezeichnung: k.bezeichnung, lat, lng,
      radius: Number(k.geofence_radius_m || 0) || 20,
      erledigt: k.erledigt ? k.erledigt.status : null });
  });
  return { zeigbar, ohneOrt };
}

/* Nachtsicht (ENT-331), Vorgabe des Projektinhabers nach dem Vorbild von
   Coredinate. Ein Kartenstil, kein zusätzlicher Dienst: Google Maps nimmt
   die Farben als `styles`-Angabe entgegen, das kostet keinen weiteren
   Aufruf und keine weitere Abrechnung.

   Der Grund ist derselbe, aus dem die ganze Rundgang-Seite dunkel ist
   (siehe Kommentar bei .rgs): Die Runde läuft abends und nachts, und ein
   weisser Vollbildschirm blendet und zerstört die Nachtsicht. Eine helle
   Karte mitten in einer dunklen Seite ist genau dieser Fehler, nur kleiner.

   Deshalb ist Nachtsicht die VORGABE und nicht ein Schalter, den man erst
   finden muss -- abschaltbar bleibt sie trotzdem, für den seltenen Fall
   einer Tagesrunde. Die Wahl überdauert die Sitzung (localStorage). */
const RG_NACHT_SCHLUESSEL = 'sop_rundgang_nachtsicht';
const RG_NACHT_STIL = [
  { elementType: 'geometry', stylers: [{ color: '#1B2230' }] },
  { elementType: 'labels.text.fill', stylers: [{ color: '#9AA3B2' }] },
  { elementType: 'labels.text.stroke', stylers: [{ color: '#0F1117' }] },
  { featureType: 'poi', stylers: [{ visibility: 'off' }] },
  { featureType: 'transit', stylers: [{ visibility: 'off' }] },
  { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#2A3147' }] },
  { featureType: 'road', elementType: 'geometry.stroke', stylers: [{ color: '#151B27' }] },
  { featureType: 'road.highway', elementType: 'geometry', stylers: [{ color: '#3A4360' }] },
  { featureType: 'road.local', elementType: 'labels.text.fill', stylers: [{ color: '#7E8798' }] },
  { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#101725' }] },
  { featureType: 'landscape.man_made', elementType: 'geometry', stylers: [{ color: '#202838' }] },
];

function rgNachtAn() {
  try { return localStorage.getItem(RG_NACHT_SCHLUESSEL) !== 'aus'; }
  catch (e) { return true; }   // kein Speicher: die Vorgabe gilt trotzdem
}

function rgNachtUm() {
  const neu = rgNachtAn() ? 'aus' : 'an';
  try { localStorage.setItem(RG_NACHT_SCHLUESSEL, neu); } catch (e) {}
  if (rgsKarte) { rgsKarte.setOptions({ styles: neu === 'an' ? RG_NACHT_STIL : [] }); }
  const btn = $('rgsNachtsicht');
  if (btn) {
    btn.classList.toggle('an', neu === 'an');
    btn.setAttribute('aria-pressed', neu === 'an' ? 'true' : 'false');
  }
}

/* ══ Bildschirm wach halten (ENT-355) ═════════════════════════════════
   Vorgabe des Projektinhabers nach dem Vorbild von Coredinate.

   Der Grund ist kein Komfort, sondern Datenqualitaet: Sperrt sich der
   Bildschirm, haelt der Browser watchPosition an. Die Runde bekommt dann
   eine Luecke, ohne dass irgendwo ein Fehler auftaucht -- genau der Fall,
   den die Ortungsmarke jetzt als "Ortung steht seit x min" meldet. Dieser
   Schalter ist die Gegenmassnahme dazu.

   AUS als Vorgabe, ausdruecklich so entschieden: Eine Runde lief im
   Echtbetrieb ueber neun Stunden. Ein Bildschirm, der neun Stunden an
   bleibt, leert den Akku, und ein leeres Geraet ortet gar nicht mehr --
   die Vorgabe "an" wuerde das Problem also nicht loesen, sondern nur
   verschieben. Wer eine kurze Runde mit lueckenloser Spur braucht, schaltet
   ein; die Wahl bleibt auf dem Geraet (localStorage).

   Die Sperre geht beim Wegschalten der Seite von sich aus verloren -- so
   ist die Schnittstelle gebaut. Darum wird sie beim Zurueckkommen neu
   angefordert, sonst waere sie nach dem ersten Blick auf eine andere App
   still weg, waehrend der Schalter weiter "Ein" zeigt. */
const RG_WACH_SCHLUESSEL = 'sop_rundgang_wachhalten';
let rgsWachSperre = null;

function rgWachMoeglich() {
  try { return !!(navigator.wakeLock && navigator.wakeLock.request); }
  catch (e) { return false; }
}

function rgWachAn() {
  try { return localStorage.getItem(RG_WACH_SCHLUESSEL) === 'an'; }
  catch (e) { return false; }   // kein Speicher: die Vorgabe (aus) gilt
}

async function rgWachAnfordern() {
  if (!rgWachMoeglich() || !rgWachAn() || rgsWachSperre) { return; }
  // Nur waehrend einer laufenden Runde. Ein Schalter, der den Bildschirm
  // auch auf der Uebersicht wachhaelt, waere ein Akkufresser ohne Zweck.
  if (rgsModus !== 'lauf' || !rundgangAktiv) { return; }
  try {
    rgsWachSperre = await navigator.wakeLock.request('screen');
    rgsWachSperre.addEventListener('release', () => { rgsWachSperre = null; });
  } catch (e) { rgsWachSperre = null; }   // z.B. wenig Akku: das Geraet darf nein sagen
}

function rgWachFreigeben() {
  if (!rgsWachSperre) { return; }
  try { rgsWachSperre.release(); } catch (e) {}
  rgsWachSperre = null;
}

function rgWachUm() {
  const neu = rgWachAn() ? 'aus' : 'an';
  try { localStorage.setItem(RG_WACH_SCHLUESSEL, neu); } catch (e) {}
  if (neu === 'an') { rgWachAnfordern(); } else { rgWachFreigeben(); }
  if (rgsReiter === 'funktionen') { rgLaufFunktionen(); }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { rgWachAnfordern(); }
});

function rgKarteZeichnen() {
  const d = rgKarteDaten(rundgangAktiv ? rundgangAktiv.kontrollpunkte : []);
  const hinweis = d.ohneOrt.length
    ? `<div class="rgs-karte-hinweis" id="rgsKarteOhneOrt">${d.ohneOrt.length} ${esc(d.ohneOrt.length === 1 ? w('rgsReiterPunkte').slice(0, -1) : w('rgsReiterPunkte'))} ${esc(w('rgsKarteOhneOrt'))}</div>`
    : '';
  if (!d.zeigbar.length) {
    $('rgsBody').innerHTML = `<div class="rgs-warn" id="rgsKarteLeer">
      <svg class="i i-sm" style="flex:none" viewBox="0 0 24 24"><polygon points="1 6 8 3 16 6 23 3 23 18 16 21 8 18 1 21"/><line x1="8" y1="3" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="21"/></svg>
      <span>${esc(w('rgsKarteLeer'))}</span></div>${hinweis}`;
    return;
  }
  // Wer geortet wird, muss es sehen koennen (ENT-317). Nicht Kosmetik: Eine
  // Ortung, von der der Betroffene nichts weiss, ist etwas anderes als eine,
  // die offen angezeigt wird -- rechtlich wie menschlich. Steht dort,
  // solange die Verfolgung laeuft, und verschwindet mit ihr.
  const ortungHinweis = rgOrtungHinweisHtml(true);
  rgVollflaeche(true);
  $('rgsBody').innerHTML = `
    <div class="rgs-karte-huelle">
      <div class="rgs-karte" id="rgsKarte"></div>
      <div class="rgs-karte-stand" id="rgsKarteStand">${esc(w('rgsKarteLaedt'))}</div>
      ${rgZahlenChipsHtml(true)}${rgOrtChipHtml()}
      <button type="button" class="rgs-karte-btn" id="rgsZentrieren" onclick="rgKarteZentrieren()">
        <svg class="i i-sm" viewBox="0 0 24 24"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
        <span>${esc(w('rgsZentrieren'))}</span>
      </button>
      <button type="button" class="rgs-karte-btn2${rgNachtAn() ? ' an' : ''}" id="rgsNachtsicht"
          onclick="rgNachtUm()" aria-pressed="${rgNachtAn() ? 'true' : 'false'}">
        <svg class="i i-sm" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span>${esc(w('rgsNachtsicht'))}</span>
      </button>
    </div>${ortungHinweis}${hinweis}`;

  // Frueher wurde hier abgebrochen, sobald der Schluessel einmal abgelehnt
  // war. Das war falsch (ENT-312): Wird die Freigabe beim Anbieter in
  // Ordnung gebracht -- was bis zu fuenf Minuten dauert --, bekaeme der
  // Waechter fuer den Rest der Sitzung trotzdem keine Karte mehr, obwohl
  // sie laengst wieder ginge. Es wird jetzt jedes Mal gebaut; scheitert es
  // erneut, meldet sich der Anbieter von selbst wieder.

  rgsMapsLaden().then(() => {
    // Der Reiter kann waehrend des Ladens gewechselt worden sein.
    if (!$('rgsKarte')) { return; }
    // Die alte Standortmarke haengt an der eben ersetzten Karte und ist
    // damit weg -- sie muss vergessen werden, sonst haelt die App eine
    // Marke fuer gesetzt, die in keinem Dokument mehr steht, und der eigene
    // Standort bliebe nach jedem Reiterwechsel unsichtbar (ENT-331; vorher
    // verdeckt davon, dass der Zentrieren-Knopf jedes Mal eine neue baute).
    rgsStandortMarke = null;
    rgsKarte = new google.maps.Map($('rgsKarte'), {
      center: { lat: d.zeigbar[0].lat, lng: d.zeigbar[0].lng }, zoom: 17,
      streetViewControl: false, mapTypeControl: false, fullscreenControl: false,
      styles: rgNachtAn() ? RG_NACHT_STIL : [],
    });
    rgKartePunkteZeichnen(d.zeigbar);
    rgStandortZeichnen();   // eine bereits bekannte Position sofort wieder zeigen
    rgKarteZentrieren();
    // Den Hinweis erst entfernen, wenn die Karte wirklich steht. Wird er
    // vorher weggeraeumt und das Bauen scheitert, bleibt eine graue Flaeche
    // ohne Erklaerung zurueck.
    const stand = $('rgsKarteStand'); if (stand) { stand.remove(); }
  }).catch(() => {
    const stand = $('rgsKarteStand');
    if (stand) { stand.textContent = w('rgsKarteFehler'); stand.classList.add('fehler'); }
  });
}

// Farbe UND Form: erledigt ist gefuellt-gruen mit Haken, offen ist blau mit
// Nummer, "nicht verfuegbar"/Ersatzscan tragen ein Ausrufezeichen. Wer die
// Farben nicht unterscheidet, liest die Zeichen.
function rgKartePunkteZeichnen(punkte) {
  rgsKartenMarken.forEach(m => m.setMap(null));
  rgsKartenKreise.forEach(k => k.setMap(null));
  rgsKartenMarken = []; rgsKartenKreise = [];
  punkte.forEach(p => {
    const fertig = p.erledigt === 'bestaetigt';
    const abweichend = p.erledigt && p.erledigt !== 'bestaetigt';
    const farbe = fertig ? '#4FCE96' : abweichend ? '#E2B156' : '#7098F7';
    const zeichen = fertig ? '✓' : abweichend ? '!' : String(p.nr);
    rgsKartenKreise.push(new google.maps.Circle({
      map: rgsKarte, center: { lat: p.lat, lng: p.lng }, radius: p.radius,
      strokeColor: farbe, strokeOpacity: 0.7, strokeWeight: 1,
      fillColor: farbe, fillOpacity: 0.12,
    }));
    const marke = new google.maps.Marker({
      map: rgsKarte, position: { lat: p.lat, lng: p.lng }, title: p.bezeichnung,
      label: { text: zeichen, color: '#0F1117', fontWeight: '700', fontSize: '12px' },
      icon: {
        path: google.maps.SymbolPath.CIRCLE, scale: 13,
        fillColor: farbe, fillOpacity: 1, strokeColor: '#0F1117', strokeWeight: 2,
      },
    });
    // Ein Tipp auf die Marke fuehrt in die Liste -- gemeldet wird dort, nicht
    // auf der Karte: Die Bestaetigung haengt an Standortpruefung, Ersatzscan
    // und Aufgaben-Rueckfrage, und die alle in eine Kartenblase zu holen
    // hiesse, denselben Ablauf ein zweites Mal zu bauen.
    marke.addListener('click', () => rgLaufReiter('punkte'));
    rgsKartenMarken.push(marke);
  });
}

/* ══ Laufende Ortung waehrend der Runde (ENT-317) ═════════════════════
   Revidiert ENT-131 teilweise. Vom Projektinhaber entschieden und
   begruendet: "das System, so wie wir es bauen, braucht die kontinuierliche
   Ortung, damit es sauber klappt ... ansonsten koennen solche kleine Radien
   und auf kurzer Distanz nicht umgesetzt werden."

   ENT-131 verwarf die laufende Ortung 2026-08-25 mit "hoeheres rechtliches
   Risiko, KEIN bisher benannter Bedarf". Der Bedarf ist jetzt benannt: Ein
   Radius von 20-25 m laesst sich ohne laufende Anzeige nicht bedienen -- der
   Waechter erfuehre erst beim Antippen, dass er zu weit weg ist.

   Zwei Dinge sind bewusst GETRENNT gebaut:
   - Die Ortung im Geraet (hier). Sie macht die Bedienung erst moeglich und
     verlaesst das Geraet nicht.
   - Die Uebermittlung der Spur (Schritt 2). Sie ist der rechtlich heikle
     Teil und laesst sich abschalten, ohne dass die Bedienbarkeit leidet.

   Die Verfolgung laeuft NUR, solange eine Runde laeuft -- nicht pausiert,
   nicht beendet, nicht im Hintergrund. Das hat der Projektinhaber
   ausdruecklich so verlangt. */
let rgsOrtWache = null;       // Kennung von watchPosition
let rgsMeinOrt = null;        // { lat, lng, genauigkeit, zeit } -- nur im Speicher
/* Warum KEIN Standort da ist (ENT-320). Drei Zustaende, die sich
   unterscheiden muessen:
     null            -- noch keine Antwort, es laeuft
     'verweigert'    -- gesperrt; kommt nie, ohne dass jemand etwas aendert
     'nicht_da'      -- Sensor findet nichts (Keller, Tiefgarage); kann
                        von selbst wiederkommen
   Bis hierher wurde der Fehler-Rueckruf mit () => {} verschluckt. Die Folge
   war die schlimmste Art Fehler: Es stand "Standort wird verfolgt" da,
   waehrend gar nichts verfolgt wurde -- keine Entfernungen, keine
   gesperrten Knoepfe, keine Signale, keine Spur. Vom Projektinhaber im
   Betrieb gefunden, mit Safari auf "Nie". */
let rgsOrtFehler = null;

// Haversine, dieselbe Rechnung wie geo_distanz_meter() in backend/rundgang.php.
// Bewusst nachgebaut statt den Server zu fragen: Die Pruefung muss OHNE Netz
// funktionieren, sonst ist sie genau dann weg, wenn sie gebraucht wird.
function rgDistanzMeter(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const rad = g => g * Math.PI / 180;
  const dLat = rad(lat2 - lat1), dLng = rad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2
    + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}

// Entfernung zu einem Kontrollpunkt, oder null wenn etwas fehlt.
// null heisst "unbekannt" und darf nie wie "zu weit" behandelt werden.
function rdEntfernungZu(k) {
  if (!rgsMeinOrt || !k || k.lat === null || k.lat === undefined
      || k.lng === null || k.lng === undefined) { return null; }
  const lat = Number(k.lat), lng = Number(k.lng);
  if (!isFinite(lat) || !isFinite(lng)) { return null; }
  return rgDistanzMeter(rgsMeinOrt.lat, rgsMeinOrt.lng, lat, lng);
}

function rdRadiusVon(k) { return Number(k && k.geofence_radius_m) || 20; }

function rgOrtungStarten() {
  if (rgsOrtWache !== null || !navigator.geolocation) { return; }
  // Alles gekapselt: Ein Geraet ohne Standortdienst, eine verweigerte
  // Berechtigung oder ein Browser, der watchPosition anders behandelt, darf
  // niemals die Runde lahmlegen. Die Runde geht auch ohne Ortung weiter --
  // der Server prueft den Radius ohnehin.
  try {
  rgsOrtWache = navigator.geolocation.watchPosition(pos => {
    // VOR der Zuweisung merken -- danach ist rgsMeinOrt immer gesetzt und
    // die Frage waere sinnlos. Beim ersten Anlauf stand die Zeile darunter
    // und war damit wirkungslos; von der Pruefung gefunden.
    const ersterOrt = !rgsMeinOrt;
    rgsMeinOrt = { lat: pos.coords.latitude, lng: pos.coords.longitude,
      genauigkeit: pos.coords.accuracy, zeit: Date.now() };
    // Kommt der Standort zurueck, verschwindet die Warnung von selbst --
    // wer aus dem Keller herauskommt, soll sie nicht wegklicken muessen.
    // Und beim ERSTEN Standort ebenfalls neu zeichnen, sonst bleibt
    // "Standort wird gesucht ..." stehen, obwohl er laengst da ist: Der
    // Rueckruf unten zeichnet nur die LISTE neu, nicht den Hinweis darueber.
    if (rgsOrtFehler !== null || ersterOrt) {
      rgsOrtFehler = null;
      try { rgLaufZeichnen(); } catch (e) {}
    }
    try { rgStandortZeichnen(); } catch (e) {}
    try { rgSpurAufnehmen(rgsMeinOrt); } catch (e) {}
    try { rgBereichPruefen(); } catch (e) {}
    // Die Liste zeigt Entfernungen -- sie muss mitwandern. Nur wenn sie
