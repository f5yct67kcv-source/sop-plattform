// ══════════════════════════════════════════ SOCKEL (ENT-429)
// Auf dem iPhone stand die Reiterleiste sichtbar ueber dem unteren
// Bildschirmrand -- aber nur auf "Heute" und "Wächter", nicht auf "Plan".
// Der Unterschied ist nicht der Reiter, sondern die Laenge: Plan ist
// laenger als der Bildschirm und scrollt, Heute und Wächter nicht.
//
// Gemessen an den Bildschirmfotos des Projektinhabers (iPhone, 393 x 852
// Punkte): Die Leiste endete 59 px ueber der Kante -- genau die Hoehe der
// Statusleiste. Die App laeuft dort vom Startbildschirm aus im Vollbild
// (apple-mobile-web-app-capable + black-translucent + viewport-fit=cover);
// -- black-translucent ist seit ENT-477 weg, siehe der Kopf der Datei.
// Damit ist der ganze Sockel GEGENSTANDSLOS: Er misst dann ueberall 0.
// Er bleibt vorerst stehen, weil ENT-477 bewusst NUR die eine Zeile
// aendert -- eine Sache pro Deploy, die Lehre aus dem Zwischenfall vom
// 08.09. Ausgebaut wird er, sobald am Geraet bestaetigt ist, dass der
// Streifen weg ist.
// der Bildschirmbereich, an dem "position: fixed; bottom: 0" haengt, ist
// dabei um die Statusleiste kuerzer als das, was man sieht. Sobald die
// Seite scrollt, rechnet iOS neu -- daher der Unterschied zwischen den
// Reitern und daher auch das saubere Bild, solange man zieht.
//
// Gemessen, nicht geraten, und vor allem: NICHT ueberschiessend. Der feste
// untere Rand liegt bei window.innerHeight, der sichtbare Bildschirm endet
// bei screen.height. Die Differenz ist genau der Streifen, der uebrig
// bleibt -- die Leiste kann durch diese Korrektur also nie tiefer rutschen
// als bis an die Bildschirmkante.
//
// Alles ausserhalb dieses einen Falls bekommt 0 und bleibt unveraendert:
// jeder Browser mit Adresszeile (dort ist die Differenz gross und gehoert
// der Adresszeile, nicht uns), jedes Android-Geraet, jeder Desktop.
// ZWEITER ANLAUF (ENT-439). Der erste rechnete screen.height minus
// window.innerHeight. Auf dem Geraet des Projektinhabers sind beide Werte
// GLEICH (852) -- der fehlende Streifen ist ueber sie nicht zu sehen, und
// die Korrektur blieb wirkungslos. Nachgemessen an den Bildschirmfotos
// nach dem Deploy: unveraendert 59 Punkte.
//
// Sichtbar wird der Unterschied nur dort, wo er entsteht: beim ZEICHNEN.
// Wird die Leiste hoeher gezeichnet, als das Layout sie kennt, dann trifft
// ein Punkt OBERHALB ihrer Layout-Oberkante sie trotzdem. Der Abstand
// zwischen der Kante, die das Layout meldet, und der Kante, an der man sie
// wirklich trifft, IST der Sockel.
//
// Findet der Browser keinen Unterschied -- jeder gesunde Fall --, kommt 0
// heraus und nichts aendert sich.
// Rueckgabe: eine Zahl, wenn sich etwas sagen laesst -- sonst null fuer
// "nicht messbar". Der Unterschied ist wichtig: "kein Versatz" und "ich
// kann gerade nicht hinsehen" sind zwei verschiedene Aussagen, und wer sie
// gleich behandelt, loescht bei der naechsten Messung einen richtigen Wert
// (CLAUDE.md: "unbekannt" darf nie wie "keine" aussehen). Genau das ist im
// Prueflauf passiert -- ein noch ausfahrendes Blatt verdeckte die Leiste.
function sockelAmBild() {
  const leiste = document.querySelector('.tabs');
  if (!leiste) { return null; }
  const r = leiste.getBoundingClientRect();
  if (r.height < 10 || r.width < 10 || r.top < 90) { return null; }
  const x = Math.round(r.left + r.width / 2);
  const inLeiste = y => {
    if (y < 0) { return false; }
    const e = document.elementFromPoint(x, Math.round(y));
    return !!(e && (e === leiste || leiste.contains(e)));
  };
  // Erst die Gegenprobe zur Messung selbst: Trifft die Leiste ueberhaupt
  // sich selbst? Wenn nicht, liegt etwas darueber, und die
  // Trefferpruefung sagt hier gar nichts -- dann wird nichts angefasst.
  //
  // Geprueft wird dicht unter der OBERKANTE, nicht in der Mitte. Wandert
  // das Bild nach oben, liegt die Mitte der Layout-Kante bereits unter
  // dem gezeichneten Balken -- die Gegenprobe schluege dann genau in dem
  // Fall fehl, den sie absichern soll, und die Messung waere immer 0.
  // Ein Punkt dicht unter der Oberkante liegt in beiden Lagen im Balken --
  // solange die beiden Lagen sich ueberhaupt noch ueberschneiden, und
  // genau so weit reicht die Suche unten auch.
  if (!inLeiste(r.top + 3)) { return null; }
  // Liegt direkt ueber der Layout-Oberkante schon die Leiste?
  if (!inLeiste(r.top - 4)) { return 0; }
  // Ja -- also die gezeichnete Oberkante einkreisen. Zwei Grenzen: Mehr
  // als 80 px waere etwas anderes als eine Statusleiste. Und mehr als die
  // Hoehe der Leiste liesse sich gar nicht mehr messen -- dann ueberdeckt
  // die gezeichnete Lage die gemeldete nicht mehr, und die Trefferpruefung
  // koennte die Leiste nicht von irgendetwas anderem unterscheiden.
  const grenze = Math.min(80, r.height - 6);
  if (grenze < 8) { return null; }
  let oben = r.top - grenze, unten = r.top - 4;
  // Trifft schon der oberste Suchpunkt die Leiste, liegt die gezeichnete
  // Kante noch weiter oben, als hier gesucht wird. Dann ist der Versatz
  // NICHT MESSBAR -- nicht null. Er als 0 zu melden hiesse, einen
  // ungeklaerten Zustand als geklaerten auszugeben.
  if (inLeiste(oben)) { return null; }
  for (let i = 0; i < 8; i++) {
    const m = (oben + unten) / 2;
    if (inLeiste(m)) { unten = m; } else { oben = m; }
  }
  return Math.round(r.top - unten);
}

// Rueckgabe wie oben: Zahl oder null fuer "nicht messbar".
function sockelMessen() {
  let fehlt = 0;
  // 1. Was der Browser von sich aus sagt. navigator.standalone gibt es nur
  //    auf iOS und ist nur dann true, wenn die App vom Startbildschirm
  //    laeuft -- also genau im Vollbildfall. visualViewport ist dabei der
  //    Bereich, den man SIEHT; er kann kleiner sein als innerHeight.
  if (window.navigator.standalone === true) {
    const schirm = (window.screen && window.screen.height) || 0;
    if (schirm) {
      fehlt = Math.max(fehlt, schirm - window.innerHeight);
      if (window.visualViewport) {
        fehlt = Math.max(fehlt, schirm - window.visualViewport.height);
      }
    }
  }
  // 2. Was am gezeichneten Bild zu messen ist. Kein Vollbild-Vorbehalt:
  //    Das hier ist eine Messung, keine Annahme -- sie findet nur etwas,
  //    wenn tatsaechlich etwas da ist.
  const amBild = sockelAmBild();
  if (amBild === null && !fehlt) { return null; }   // nichts gesehen, nichts zu sagen
  fehlt = Math.round(Math.max(fehlt, amBild || 0));
  // Obergrenze 80: Eine Statusleiste ist hoechstens rund 60 px hoch. Was
  // darueber liegt, ist etwas anderes (aufgeklappte Tastatur, Querformat,
  // ein Geraet, das screen.height anders zaehlt) und wird nicht angefasst.
  return (fehlt > 0 && fehlt <= 80) ? fehlt : 0;
}

function sockelSetzen() {
  const stil = document.documentElement.style;
  // Gemessen wird am UNKORRIGIERTEN Zustand -- als Vorsichtsmassnahme.
  // Ehrlich dazu: In der Gegenprobe liess sich KEIN Fall herstellen, in
  // dem diese Zeile das Ergebnis aendert. Layout- und gezeichnete Kante
  // wandern beide mit dem Sockel, ihr Abstand bleibt gleich, und die
  // Werte aus dem Browser haengen ohnehin nicht am Sockel. Sie steht hier,
  // weil das Messen an einem bereits korrigierten Zustand ein Fehler
  // waere, sobald jemand die Rechnung oben aendert -- nicht, weil sie
  // heute etwas verhindert. Die Prueflauf-Zusicherung dazu (zweimal messen
  // ergibt denselben Sockel) gilt unabhaengig davon.
  const vorher = stil.getPropertyValue('--sockel');
  stil.setProperty('--sockel', '0px');
  void document.documentElement.offsetHeight;
  const wert = sockelMessen();
  // Nicht messbar heisst: den bisherigen Wert behalten, nicht auf 0
  // zuruecksetzen. Sonst nimmt ein offenes Blatt der Leiste ihren Sockel.
  if (wert === null) { stil.setProperty('--sockel', vorher || '0px'); return; }
  stil.setProperty('--sockel', wert + 'px');
}

// Die Zahlen, aus denen der Sockel entsteht -- als eine Zeile im Menue.
// Ohne sie liesse sich aus der Ferne nicht entscheiden, warum eine
// Korrektur nicht greift; genau daran ist der erste Anlauf gescheitert.
function technikZeile() {
  const r = document.querySelector('.tabs');
  const lage = r ? r.getBoundingClientRect() : null;
  const vv = window.visualViewport;
  const gezeichnet = sockelAmBild();
  return [
    'Bildschirm ' + ((window.screen && window.screen.height) || '?'),
    'Fenster ' + window.innerHeight,
    'Sicht ' + (vv ? Math.round(vv.height) : '–'),
    'Leiste ' + (lage ? Math.round(lage.top) + '–' + Math.round(lage.bottom) : '–'),
    'gezeichnet ' + (gezeichnet === null ? 'nicht messbar'
      : gezeichnet ? '−' + gezeichnet : 'deckungsgleich'),
    'Sockel ' + (getComputedStyle(document.documentElement).getPropertyValue('--sockel') || '?').trim(),
    'Vollbild ' + (window.navigator.standalone === true ? 'ja' : 'nein')
  ].join(' · ');
}

// ══════════════════════════════════════════ ZIEHEN ZUM AKTUALISIEREN (ENT-438)
// Kraeftig nach unten ziehen laedt neu -- dieselbe Geste wie in den
// meisten Apps, und derselbe Vorgang wie der Knopf in der Kopfzeile.
//
// Bewusst OHNE preventDefault: Das Telefon federt die Seite von sich aus
// mit, und dieses Mitfedern ist die halbe Rueckmeldung. Wer es abschaltet,
// muss die Bewegung selbst nachbauen -- und faengt sich dabei jeden Fall
// ein, in dem die Bedingungen unten daneben liegen: Dann scrollt gar
// nichts mehr.
const PTR_DAEMPFUNG = 0.55;   // Fingerweg -> gezaehlter Weg
const PTR_SCHWELLE  = 62;     // ab hier loest das Loslassen aus
const PTR_MAX       = 96;     // weiter wird nicht gezaehlt
// Wie weit der Kreis dabei SICHTBAR wandert. Bewusst kuerzer als der
// gezaehlte Weg und so gewaehlt, dass er dort stehen bleibt, wo er
// anschliessend dreht (translateY(0), knapp unter der Kopfzeile): Sonst
// wandert er beim Loslassen noch einmal ein Stueck zurueck -- und auf einem
// kurzen Bildschirm stuende er mitten in der ersten Karte.
const PTR_SICHT     = 58;
const PTR_RUHE      = 52;     // Ruhelage: so weit oberhalb, ausserhalb des Bildes
let ptrY0 = null, ptrWeg = 0, ptrLaedt = false;

// Gezogen wird nur auf der Reiterflaeche selbst. Liegt etwas darueber --
// Anmeldung, Blatt, Einsatzmodus, Mitteilungen --, hat das seinen eigenen
// Rumpf mit eigenem Bildlauf; ein Zug dort ist ein Zug DORT.
function ptrErlaubt() {
  if (ptrLaedt) { return false; }
  if (!$('app').classList.contains('on')) { return false; }
  for (const id of ['blatt', 'rgSeite', 'mitSeite', 'mitDlg']) {
    const e = document.getElementById(id);
    if (e && e.classList.contains('on')) { return false; }
  }
  return window.scrollY <= 0;
}

function ptrZeichnen() {
  const k = $('ptrKreis'), h = $('ptr');
  const anteil = Math.min(ptrWeg / PTR_SCHWELLE, 1);
  k.style.opacity = String(Math.min(ptrWeg / 26, 1));
  k.style.transform = 'translateY(' + (Math.min(ptrWeg, PTR_SICHT) - PTR_RUHE) + 'px) '
    + 'rotate(' + Math.round(anteil * 300) + 'deg)';
  h.classList.toggle('reif', ptrWeg >= PTR_SCHWELLE);
}
function ptrZuruecksetzen() {
  const k = $('ptrKreis'), h = $('ptr');
  h.classList.add('zurueck');
  h.classList.remove('reif', 'laedt');
  k.style.opacity = '';
  k.style.transform = '';
  ptrY0 = null; ptrWeg = 0;
}
function ptrAusloesen() {
  const k = $('ptrKreis'), h = $('ptr');
  ptrLaedt = true; ptrY0 = null; ptrWeg = 0;
  h.classList.add('zurueck', 'laedt');
  h.classList.remove('reif');
  // Die Klasse traegt Lage und Drehung -- die Angaben am Element selbst
  // muessen weg, sonst schlagen sie die Klasse (Stil am Element vor jeder
  // Regel im Stilteil).
  k.style.opacity = '';
  k.style.transform = '';
  // Mindestens einen Moment sichtbar bleiben: Kommt die Antwort in 80 ms,
  // blitzt der Kreis sonst nur auf, und die Geste sieht aus, als haette sie
  // nichts getan.
  Promise.all([Promise.resolve().then(allesLaden), new Promise(f => setTimeout(f, 550))])
    .catch(() => {})
    .then(() => { ptrLaedt = false; ptrZuruecksetzen(); });
}

document.addEventListener('touchstart', e => {
  if (e.touches.length !== 1 || !ptrErlaubt()) { ptrY0 = null; return; }
  ptrY0 = e.touches[0].clientY;
  ptrWeg = 0;
  $('ptr').classList.remove('zurueck');
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (ptrY0 === null || e.touches.length !== 1) { return; }
  // Sobald die Seite doch scrollt oder der Finger nach oben geht, ist es
  // kein Ziehen mehr, sondern ein Bildlauf.
  if (window.scrollY > 0) { if (ptrWeg) { ptrZuruecksetzen(); } ptrY0 = null; return; }
  const roh = e.touches[0].clientY - ptrY0;
  if (roh <= 0) { if (ptrWeg) { ptrWeg = 0; ptrZeichnen(); } return; }
  ptrWeg = Math.min(roh * PTR_DAEMPFUNG, PTR_MAX);
  ptrZeichnen();
}, { passive: true });

document.addEventListener('touchend', () => {
  if (ptrY0 === null) { return; }
  if (ptrWeg >= PTR_SCHWELLE) { ptrAusloesen(); } else { ptrZuruecksetzen(); }
}, { passive: true });

document.addEventListener('touchcancel', () => {
  if (ptrY0 !== null) { ptrZuruecksetzen(); }
}, { passive: true });

// ENT-234, seit ENT-284 umgestellt: "Wächter" erscheint nur mit der
// ausdrücklich gesetzten Berechtigung (Mitarbeiter-Akte, Personal/
// Verwaltung) -- nicht mehr aus der Schicht-Historie hergeleitet. Der
// alte Weg (irgendeine geladene Schicht mit Kontrollpunkten) brach genau
// dann, wenn jemand spontan eine Runde an einem Objekt laufen wollte, dem
// er (noch) nicht zugeteilt war (ENT-282 "unabhängig von den Schichten") --
// ohne eine geladene Schicht blieb der Reiter unerreichbar, gerade im
// Moment, in dem die spontane Übersicht ihn gebraucht hätte.
function waechterSichtbar() {
  return !!(profil && profil.revierdienst_berechtigt);
}
function waechterTabAktualisieren() {
  const sichtbar = waechterSichtbar();
  $('t-waechter').style.display = sichtbar ? '' : 'none';
  if (!sichtbar && reiter === 'waechter') zeige('heute');
}
function ladeSchichten() {
  return api('meine_schichten.php').then(({ ok, status, data }) => {
    if (status === 401) return abmelden();
    schichten = (ok && data.status === 'ok') ? (data.schichten || []) : [];
  });
}
function ladeProfil() {
  return api('mein_profil.php').then(({ ok, data }) => {
    if (ok && data.status === 'ok') {
      profil = data.profil;
      selbstAenderbar = Array.isArray(data.selbst_aenderbar) ? data.selbst_aenderbar : [];
    }
  });
}
function ladeRapporte() {
  return api('rapport_list.php').then(({ ok, data }) => {
    rapporte = (ok && data.status === 'ok') ? (data.rapporte || []) : [];
  });
}

// ══════════════════════════════════════════ NAVIGATION
function zeige(r) {
  reiter = r;
  document.querySelectorAll('.v').forEach(v => v.classList.remove('on'));
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('on'));
  $('v-' + r).classList.add('on');
  $('t-' + r).classList.add('on');
  // Im Menue traegt die Profilkarte, was sonst die Kopfzeile sagt -- und
  // zwar besser (voller Name statt Anmeldename). Nur dort faellt sie
  // darum weg (ENT-402), siehe .app.ohne-kopf im Regelwerk.
  $('app').classList.toggle('ohne-kopf', r === 'menu');
  window.scrollTo(0, 0);
  zeichne();
  // NACH dem Zeichnen: Im Menue wird die Profilkarte erst dort gebaut --
  // vorher gaebe es kein Ziel, und die Glocke bliebe in der ausgeblendeten
  // Kopfzeile stehen (ENT-421).
  mitGlockeVerorten();
}
// ══════════════════════════════════════════ SCHREIBTISCH-LEISTE (ENT-447)
// Fuenf Zugaenge auf VORHANDENE Ansichten. Keine neuen Inhalte, keine
// zweite Fassung -- nur ein anderer Weg dorthin, ohne den Umweg ueber das
// Menue. Am Handy ruehrt nichts davon irgendetwas an.
const TISCH_REITER = ['mitteilungen', 'plan', 'stunden', 'abwesenheit', 'daten'];

function zeigeTisch(ziel) {
  // Die Mitteilungen liegen in einer eigenen Ebene. Wer woanders hinwill,
  // schliesst sie zuerst -- sonst laegen sie ueber dem neuen Reiter.
  if (ziel !== 'mitteilungen') mitSeiteZu();
  if (ziel === 'mitteilungen')     { mitSeiteAuf(); }
  else if (ziel === 'plan')        { planUnter = 'plan';        zeige('plan'); }
  else if (ziel === 'abwesenheit') { planUnter = 'abwesenheit'; zeige('plan'); }
  else if (ziel === 'stunden')     { zeige('menu'); stdSeiteAuf(); }
  else if (ziel === 'daten')       { zeige('menu'); datenSeiteAuf(); }
  tischMarkeSetzen();
}

// ABGELEITET, nicht gespeichert. Ein zweiter Zustand neben reiter,
// planUnter und der offenen Unterseite koennte von ihnen abweichen -- und
// eine Leiste, die den falschen Reiter hervorhebt, ist schlimmer als eine,
// die gar keinen hervorhebt.
function tischAktiv() {
  const mit = $('mitSeite');
  if (mit && mit.classList.contains('on')) return 'mitteilungen';
  if (reiter === 'plan') return planUnter === 'abwesenheit' ? 'abwesenheit' : 'plan';
  if (reiter === 'menu') {
    const st = $('pr-stunden'), da = $('pr-daten');
    if (st && st.style.display !== 'none') return 'stunden';
    if (da && da.style.display !== 'none') return 'daten';
  }
  // "Heute", "Rapport", "Waechter", die Sperren und das Menue selbst haben
  // am Schreibtisch keinen eigenen Reiter. Dann ist KEINER hervorgehoben --
  // einen falschen zu setzen waere eine Behauptung.
  return '';
}
// Die Mitteilungen liegen als eigene Ebene ueber allem. Am Schreibtisch
// sollen Kopfzeile und Leiste sichtbar bleiben -- sonst waere der Reiter,
// den man gerade gedrueckt hat, verschwunden, und niemand saehe, wo er ist.
// Wie hoch beides zusammen ist, wird gemessen: im Menue faellt die
// Kopfzeile weg (ENT-402), dann ist es nur die Leiste.
function tischKopfMessen() {
  const kopf = document.querySelector('.kopf');
  const leiste = $('tabsTisch');
  if (!leiste) return;
  const h = amSchreibtisch()
    ? Math.round((kopf ? kopf.getBoundingClientRect().height : 0)
               + leiste.getBoundingClientRect().height)
    : 0;
  document.documentElement.style.setProperty('--tisch-kopf', h + 'px');
}

function tischMarkeSetzen() {
  const a = tischAktiv();
  TISCH_REITER.forEach(r => {
    const b = $('ts-' + r);
    if (b) b.classList.toggle('on', r === a);
  });
  // Die Zahl ungelesener Mitteilungen steht am Schreibtisch im Reiter,
  // nicht an der Glocke. EINE Quelle: was an der Glocke steht, wird
  // uebernommen, nicht zweitgerechnet.
  const q = $('mitZahl'), z = $('tsZahl');
  if (q && z) { z.textContent = q.textContent; z.hidden = q.hidden; }
  // Steht die Mitteilungs-Seite, hat sie keinen Hintergrund mehr. Sie liegt
  // als feste Ebene ueber der Seite; scrollt die Seite darunter weiter,
  // wandern Kopfzeile und Leiste weg, waehrend die Ebene stehenbleibt --
  // und durch die entstehende Luecke schaut der Plan. Gemessen: nach 600 px
  // Scrollen 600 px Luecke. Ohne Inhalt dahinter gibt es nichts zu
  // scrollen; die Liste selbst scrollt in ihrem eigenen Kasten (.mit-bd).
  const rumpf = $('app');
  if (rumpf) rumpf.classList.toggle('mit-offen', a === 'mitteilungen' && amSchreibtisch());
  tischKopfMessen();
}

// Die Marke nach JEDEM Wechsel nachziehen, ohne acht Funktionen einzeln
// anzufassen. Wer spaeter eine weitere Unterseite baut, muss daran nicht
// denken -- genau die Sorte Regel, die sonst von neuem Code nicht geerbt
// wird (CLAUDE.md). Laeuft erst beim Start, wenn alle Funktionen stehen.
function tischMarkeAnhaengen() {
  ['zeige', 'stdSeiteAuf', 'stdSeiteZu', 'datenSeiteAuf', 'datenSeiteZu',
   'mitSeiteAuf', 'mitSeiteZu', 'abwesenheitAusMenue', 'planUnterWahl'].forEach(n => {
    const f = window[n];
    if (typeof f !== 'function' || f.tischMarke) return;
    const g = function (...a) { const r = f.apply(this, a); tischMarkeSetzen(); return r; };
    g.tischMarke = true;
    window[n] = g;
  });
}

function zeichne() {
  beschriften();
  if (reiter === 'heute') zeichneHeute();
  if (reiter === 'plan') zeichnePlan();
  if (reiter === 'rapport') zeichneRapport();
  if (reiter === 'waechter') zeichneWaechter();
  if (reiter === 'menu') zeichneMenu();
}

const LEER = (t, p, ic) => `<div class="karte"><div class="leer">
  <div class="ic"><svg class="i" viewBox="0 0 24 24">${ic || '<circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'}</svg></div>
  <h3>${esc(t)}</h3><p>${esc(p)}</p></div></div>`;

const STATUS_MARKE = {
  geplant: ['geplant', 'm-n'], bestaetigt: ['bestaetigt', 'm-p'],
  provisorisch: ['provisorisch', 'm-w'], abgesagt: ['abgesagt', 'm-x'],
  // ENT-128: vom Server gesetzt, sobald alle zugesagten Personen rapportiert
  // haben -- dieselbe Bedeutung wie im Dashboard, eigene Kopie, weil app.html
  // seine Markierungen unabhaengig fuehrt.
  abgeschlossen: ['abgeschlossen', 'm-p'],
};
const ZUSAGE_MARKE = { zugesagt: ['zugesagt', 'm-p'], abgelehnt: ['abgelehnt', 'm-x'], offen: ['offen', 'm-n'] };

// Eine Schichtkarte. Die Zeit steht vorne und gross -- danach wird draussen
// zuerst gesucht.
function schichtKarte(e, mitDatum) {
  const abgeschlossen = e.status === 'abgeschlossen';
  const ueberfaellig = !abgeschlossen && schichtUeberfaellig(e);
  const bal = e.status === 'abgesagt' ? 'ab' : (e.status === 'provisorisch' ? 'prov' : (e.status === 'bestaetigt' || abgeschlossen ? 'best' : ''));
  const st = STATUS_MARKE[e.status] || STATUS_MARKE.geplant;
  const zu = ZUSAGE_MARKE[e.zusage] || ZUSAGE_MARKE.offen;
  // Der eigene Rapport, sofern schon eingereicht (ENT-133) -- derselbe
  // Abgleich wie im Schichtblatt, nur zusaetzlich schon auf der Karte
  // sichtbar, ohne dafuer erst hineinklicken zu muessen.
  const rap = abgeschlossen ? rapportFuerSchicht(e.id) : null;
  return `<div class="karte${abgeschlossen ? ' abgeschlossen' : ''}${ueberfaellig ? ' ueberfaellig' : ''}">
    ${abgeschlossen ? `<div class="karte-haken" aria-hidden="true" title="${esc(w(st[0]))}">
      <svg class="i" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>` : ''}
    ${ueberfaellig ? `<div class="karte-warn" aria-hidden="true" title="${esc(w('rapportUeberfaellig'))}">⚠️</div>` : ''}
    <button class="schicht" onclick="blattAuf(${Number(e.id)})">
      <div class="oben">
        <span class="balken ${bal}"></span>
        <span class="zeit">${hm(e.von)}<br>${hm(e.bis)}${ueberNacht(e) ? `<span class="folgetag">${esc(w('folgetag'))}</span>` : ''}</span>
        <span class="was">
          <b>${esc(e.titel || e.kunde_name)}</b>
          <span>${esc(e.ort)}${e.strasse ? ' · ' + esc(e.strasse) : ''}</span>
          ${mitDatum ? `<span>${esc(WOCHENTAG[new Date(tagVon(e) + 'T12:00:00').getDay()])}, ${dmy(e.datum)}</span>` : ''}
        </span>
      </div>
    </button>
    <div class="fuss">
      <span class="marke ${st[1]}">${esc(w(st[0]))}</span>
      ${e.status !== 'abgesagt' ? `<span class="marke ${zu[1]}">${esc(w(zu[0]))}</span>` : ''}
      ${Number(e.im_team) > 1 ? `<span class="marke m-n">${Number(e.im_team)} ${esc(w('imTeam'))}</span>` : ''}
      ${rap ? `<span class="marke m-n">${esc(w('schonRapportiert'))} ${dmy(rap.erfasst_am)}, ${String(rap.erfasst_am).slice(11, 16)}</span>` : ''}
      ${ueberfaellig ? `<span class="marke m-w">${esc(w('rapportUeberfaellig'))}</span>` : ''}
    </div>
  </div>`;
}

// Hinweis-Chip bei aktivem/pausiertem Rundgang (ENT-234) -- fuehrt direkt
// zurueck in die Checkliste, ohne den Umweg ueber "Wächter". rundgangAktiv
// existiert nur innerhalb der laufenden Sitzung (gesetzt beim Start/
// Fortsetzen), das reicht fuer den Zweck: schneller Wiedereinstieg waehrend
// desselben App-Aufenthalts, kein zusaetzlicher Serveraufruf bei jedem Laden.
function rundgangChipHtml() {
  if (!rundgangAktiv || rundgangAktiv.status === 'abgebrochen' || rundgangAktiv.status === 'abgeschlossen') return '';
  const kps = rundgangAktiv.kontrollpunkte || [];
  const erledigt = kps.filter(k => k.erledigt).length;
  const pausiert = rundgangAktiv.status === 'pausiert';
  return `<button type="button" class="rd-chip" onclick="rundgangAnzeigen(${Number(rundgangAktiv.einsatz_id)})">
    <span class="rd-chip-ic"><svg class="i i-sm" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M12 19h4a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2H8a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h4"/></svg></span>
    <span class="rd-chip-txt">
      <b>${esc(pausiert ? w('rundgangChipPausiert') : w('rundgangChipLaeuft'))}</b>
      <span>${erledigt} ${esc(w('von'))} ${kps.length} ${esc(w('erledigt'))}</span>
    </span>
    <svg class="chev" viewBox="0 0 24 24"><polyline points="9 5 16 12 9 19"/></svg>
  </button>`;
}

// ══════════════════════════════════════════ HEUTE
function zeichneHeute() {
  const heute = isoTag();
  const jetzt = Date.now();
  // Eine Nachtschicht von gestern gehört noch zu heute, solange sie läuft.
  const laufend = schichten.filter(e => {
    const sp = spanne(e.datum, e.von, e.bis);
    return sp && sp[0] <= jetzt && jetzt < sp[1];
  });
  const heutige = schichten.filter(e => tagVon(e) === heute);
  const zeigen = [...new Set([...laufend, ...heutige])]
    .sort((a, b) => (spanne(a.datum, a.von, a.bis) || [0])[0] - (spanne(b.datum, b.von, b.bis) || [0])[0]);

  let html = rundgangChipHtml();
  if (!zeigen.length) {
    html += LEER(w('keineHeute'), w('keineHeuteText'), '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>');
    const naechste = schichten
      .filter(e => e.status !== 'abgesagt' && (spanne(e.datum, e.von, e.bis) || [0])[0] > jetzt)
      .sort((a, b) => (spanne(a.datum, a.von, a.bis) || [0])[0] - (spanne(b.datum, b.von, b.bis) || [0])[0])[0];
    if (naechste) html += `<div class="titel">${esc(w('naechste'))}</div>` + schichtKarte(naechste, true);
  } else {
    zeigen.forEach(e => {
      const sp = spanne(e.datum, e.von, e.bis);
      const laeuft = sp && sp[0] <= jetzt && jetzt < sp[1];
      const bald = sp && sp[0] > jetzt && sp[0] - jetzt < 3 * 3600e3;
      if (laeuft) html += `<div class="titel" style="color:var(--pos)">● ${esc(w('jetztLaeuft'))}</div>`;
      else if (bald) html += `<div class="titel" style="color:var(--accent)">${esc(w('gleich'))}</div>`;
      html += schichtKarte(e, tagVon(e) !== heute);
    });
  }
  $('v-heute').innerHTML = html;
}

// ══════════════════════════════════════════ PLAN
// ENT-234: Plan + Sperren in einem Reiter mit Unterreitern. zeichnePlan()
// baut nur noch die Huelle (Unterreiter-Leiste + zwei Container); der
// eigentliche Aufbau steht unveraendert in zeichnePlanListe() (frueher
// zeichnePlan()) und in zeichneSperren() -- beide zielen jetzt auf die
// beiden neuen Container statt auf eigene Hauptreiter.
let planUnter = 'plan';
function planUnterWahl(u) {
  planUnter = u;
  $('pu-plan').classList.toggle('on', u === 'plan');
  $('pu-sperren').classList.toggle('on', u === 'sperren');
  $('pu-abwesenheit').classList.toggle('on', u === 'abwesenheit');
  $('plan-inhalt-plan').style.display = u === 'plan' ? '' : 'none';
  $('plan-inhalt-sperren').style.display = u === 'sperren' ? '' : 'none';
  $('plan-inhalt-abwesenheit').style.display = u === 'abwesenheit' ? '' : 'none';
}
function zeichnePlan() {
  $('v-plan').innerHTML = `
    <div class="unterreiter${planUnter === 'abwesenheit' ? ' abw-oben' : ''}">
      <button id="pu-plan" class="${planUnter === 'plan' ? 'on' : ''}" onclick="planUnterWahl('plan')">${esc(w('plan'))}</button>
      <button id="pu-sperren" class="${planUnter === 'sperren' ? 'on' : ''}" onclick="planUnterWahl('sperren')">${esc(w('sperren'))}</button>
      <button id="pu-abwesenheit" class="${planUnter === 'abwesenheit' ? 'on' : ''}" onclick="planUnterWahl('abwesenheit')">${esc(w('abwesenheit'))}</button>
    </div>
    <div id="plan-inhalt-plan" style="${planUnter === 'plan' ? '' : 'display:none'}"></div>
    <div id="plan-inhalt-sperren" style="${planUnter === 'sperren' ? '' : 'display:none'}"></div>
    <div id="plan-inhalt-abwesenheit" style="${planUnter === 'abwesenheit' ? '' : 'display:none'}"></div>`;
  zeichnePlanListe();
  zeichneSperren();
  zeichneAbwesenheiten();
}
// ══════════════════════════════════════════ MONATSTABELLE (Schreibtisch)
// Am Handy bleibt der Plan eine Liste des Kommenden -- man scrollt mit dem
// Daumen und will wissen, was als Naechstes ansteht. Am Schreibtisch ist
// die Frage eine andere: "arbeite ich am 15.?" Darum eine Zeile pro TAG,
// auch fuer Tage OHNE Schicht. Einen Monat mit Luecken sieht man nur,
// wenn die Luecken auch dastehen.
//
// Nur hier, nicht am Handy: Was am Schreibtisch entsteht, wird nicht
// automatisch auch fuers Handy gebaut (CLAUDE.md, so schon ENT-235).

// Liest den Schalter, den die Media Query umlegt. Die Grenze steht damit
// an genau EINER Stelle -- im Regelwerk. Eine zweite Zahl hier wuerde beim
// naechsten Verschieben stillschweigend danebenliegen.
const amSchreibtisch = () =>
  getComputedStyle(document.documentElement).getPropertyValue('--schreibtisch-an').trim() === '1';

const MONATSNAME = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni',
  'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];

let monatStand = '';        // 'JJJJ-MM' -- der angezeigte Monat
// Eigener Bestand, NICHT "schichten" ueberschreiben: daran haengen Heute,
// die Sperren und der Einsatzmodus. Ein Blick in den Mai darf nicht dazu
// fuehren, dass die App den heutigen Einsatz vergisst.
let monatSchichten = [];
// leer = noch nie geladen, laedt, da, fehler. Vier Zustaende, weil sie
// vier verschiedene Aussagen sind -- "wird geladen", "ging schief" und
// "der Monat ist frei" duerfen einander nie sehen (CLAUDE.md).
let monatZustand = 'leer';

function monatTage(ym) {
  const [j, m] = ym.split('-').map(Number);
  const letzter = new Date(Date.UTC(j, m, 0)).getUTCDate();
  return Array.from({ length: letzter }, (_, i) => `${ym}-${String(i + 1).padStart(2, '0')}`);
}
function monatVerschoben(ym, schritt) {
  const [j, m] = ym.split('-').map(Number);
  const d = new Date(Date.UTC(j, m - 1 + schritt, 1));
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`;
}
// Dauer in Minuten. Endet die Schicht rechnerisch vor ihrem Beginn, lief
// sie ueber Mitternacht -- dieselbe Annahme wie ueberNacht(). Fehlt eine
// Zeit, kommt null zurueck und nicht 0: eine unbekannte Dauer ist keine
// Dauer von null.
function schichtMinuten(e) {
  const zu = t => {
    const [h, m] = String(t || '').slice(0, 5).split(':').map(Number);
    return (Number.isFinite(h) && Number.isFinite(m)) ? h * 60 + m : null;
  };
  const a = zu(e.von), b = zu(e.bis);
  if (a === null || b === null) return null;
  return b > a ? b - a : b + 1440 - a;
}
// Eine Dauer wird NICHT als "8:00" geschrieben. In einer Tabelle, in der
// daneben "06:00-14:00" steht, liest sich das wie eine Uhrzeit -- und
// Einheiten werden nicht vermischt (CLAUDE.md). "8 h" und "8 h 30" kann
// man mit keiner Uhrzeit verwechseln.
const dauerText = min => {
  const h = Math.floor(min / 60), m = min % 60;
  return m ? `${h} h ${String(m).padStart(2, '0')}` : `${h} h`;
};

function ladeMonat(ym) {
  monatStand = ym;
  monatZustand = 'laedt';
  zeichnePlanListe();
  const tage = monatTage(ym);
  return api(`meine_schichten.php?von=${tage[0]}&bis=${tage[tage.length - 1]}`)
    .then(({ ok, status, data }) => {
      if (status === 401) return abmelden();
      // Zwischenzeitlich weitergeblaettert? Dann gehoert diese Antwort zu
      // einem Monat, der nicht mehr auf dem Schirm steht.
      if (ym !== monatStand) return;
      if (ok && data.status === 'ok') { monatSchichten = data.schichten || []; monatZustand = 'da'; }
      else { monatSchichten = []; monatZustand = 'fehler'; }
      zeichnePlanListe();
    });
}
function monatWechsel(schritt) { ladeMonat(monatVerschoben(monatStand, schritt)); }
function monatNochmal() { ladeMonat(monatStand); }

function zeichnePlanMonat() {
  if (!monatStand) { ladeMonat(isoTag().slice(0, 7)); return; }
  const [j, m] = monatStand.split('-').map(Number);
  const heute = isoTag();
  const pfeil = (schritt, d, txt) => `<button class="mt-pfeil" onclick="monatWechsel(${schritt})"
      aria-label="${esc(txt)}" title="${esc(txt)}">
      <svg class="i i-sm" viewBox="0 0 24 24"><polyline points="${d}"/></svg></button>`;
  const kopf = `<div class="mt-kopf">
      ${pfeil(-1, '15 5 8 12 15 19', w('monatZurueck'))}
      <b>${esc(MONATSNAME[m - 1])} ${j}</b>
      <span class="mt-kopf-rechts">
        ${pfeil(1, '9 5 16 12 9 19', w('monatVor'))}
        <button class="mt-drucken" onclick="window.print()" title="${esc(w('drucken'))}">
          <svg class="i i-sm" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          <span>${esc(w('drucken'))}</span>
        </button>
      </span>
    </div>
    <!-- Nur auf dem Papier sichtbar. Ein ausgedruckter Dienstplan ohne
         Namen und Monat ist ein Blatt Papier mit Zahlen darauf. -->
    <div class="mt-papierkopf" aria-hidden="true">
      <b>${esc(w('dienstplan'))} · ${esc(MONATSNAME[m - 1])} ${j}</b>
      <span>${esc((profil && (profil.vorname || profil.nachname))
        ? [profil.vorname, profil.nachname].filter(Boolean).join(' ')
        : (ich && ich.name) || '')}</span>
    </div>`;

  // "wird geladen", "ging schief" und "der Monat ist frei" sind drei
  // verschiedene Aussagen und bekommen drei verschiedene Texte. Ein Monat
  // voller Zeilen "Keine Schicht geplant" waere bei einem Serverfehler
  // eine Falschaussage -- genau die Verwechslung, vor der CLAUDE.md warnt.
  if (monatZustand === 'laedt' || monatZustand === 'leer') {
    $('plan-inhalt-plan').innerHTML = kopf +
      `<div class="karte"><div class="leer"><b>${esc(w('monatLaedt'))}</b></div></div>`;
    return;
  }
  if (monatZustand === 'fehler') {
    $('plan-inhalt-plan').innerHTML = kopf +
      `<div class="karte"><div class="leer">
         <b>${esc(w('monatFehler'))}</b><p>${esc(w('monatFehlerText'))}</p>
         <button class="btn" onclick="monatNochmal()">${esc(w('nochmal'))}</button>
       </div></div>`;
    return;
  }

  const proTag = {};
  monatSchichten.forEach(e => { (proTag[tagVon(e)] = proTag[tagVon(e)] || []).push(e); });
  let summe = 0, unbekannt = 0, zeilen = '';
  monatTage(monatStand).forEach(t => {
    const wd = new Date(t + 'T12:00:00').getDay();
    const frei = wd === 0 || wd === 6;
    const kl = `${frei ? ' mt-wochenende' : ''}${t === heute ? ' mt-heute' : ''}`;
    const datum = `<td class="mt-datum">${esc(WOCHENTAG[wd].slice(0, 2))}. ${dmy(t)}</td>`;
    const eintraege = (proTag[t] || []).sort((a, b) => String(a.von).localeCompare(String(b.von)));
    if (!eintraege.length) {
      zeilen += `<tr class="mt-ohne${kl}">${datum}<td colspan="7">${esc(w('keineSchichtGeplant'))}</td></tr>`;
      return;
    }
    eintraege.forEach((e, i) => {
      const min = schichtMinuten(e);
      if (e.status !== 'abgesagt') { min === null ? unbekannt++ : summe += min; }
      const st = STATUS_MARKE[e.status] || STATUS_MARKE.geplant;
      const zu = ZUSAGE_MARKE[e.zusage] || ZUSAGE_MARKE.offen;
      zeilen += `<tr class="mt-zeile${kl}${e.status === 'abgesagt' ? ' mt-abgesagt' : ''}"
          tabindex="0" role="button" onclick="blattAuf(${Number(e.id)})"
          onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();blattAuf(${Number(e.id)})}">
        ${i === 0 ? datum : '<td class="mt-datum mt-weiter"></td>'}
        <td class="mt-zeit">${esc(hm(e.von))}–${esc(hm(e.bis))}${ueberNacht(e) ? `<span class="mt-ft">${esc(w('folgetag'))}</span>` : ''}</td>
        <td class="mt-dauer">${min === null ? '–' : esc(dauerText(min))}</td>
        <td><b>${esc(e.titel || e.kunde_name || '')}</b>${e.objekt_name ? `<span class="mt-neben">${esc(e.objekt_name)}</span>` : ''}</td>
        <td>${esc(e.ort || '')}${e.strasse ? `<span class="mt-neben">${esc(e.strasse)}</span>` : ''}</td>
        <td>${esc(e.treffpunkt || '')}</td>
        <td>${esc(e.bemerkung || '')}</td>
        <td class="mt-status"><span class="marke ${st[1]}">${esc(w(st[0]))}</span>${e.status !== 'abgesagt' ? `<span class="marke ${zu[1]}">${esc(w(zu[0]))}</span>` : ''}</td>
      </tr>`;
    });
  });

  // Planwert aus den Schichtzeiten -- ausdruecklich KEINE Lohngrundlage.
  // Rohzeit, bewertete Zeit, Bonus und Zuschlag bleiben getrennt (GAV,
  // CLAUDE.md); hier steht nur die eine, unbewertete Groesse, und der Text
  // sagt das auch. Eine Schicht ohne Zeitangabe wird MITGEZAEHLT als
  // unbekannt und nicht stillschweigend als null verrechnet.
  const fuss = `<tr><td colspan="8" class="mt-summe-zelle"><div class="mt-summe">
      <b>${esc(w('geplanteStunden'))}: ${esc(dauerText(summe))}</b>
      ${unbekannt ? `<span class="mt-warn">${unbekannt} ${esc(w(unbekannt === 1 ? 'ohneZeitangabe1' : 'ohneZeitangabe'))}</span>` : ''}
      <span class="mt-neben">${esc(w('planwertHinweis'))}</span>
    </div></td></tr>`;

  $('plan-inhalt-plan').innerHTML = kopf + `<div class="mt-rahmen"><table class="mt">
      <thead><tr>
        <th>${esc(w('spDatum'))}</th><th>${esc(w('spZeit'))}</th><th>${esc(w('spDauer'))}</th>
        <th>${esc(w('spEinsatz'))}</th><th>${esc(w('spOrt'))}</th><th>${esc(w('spTreffpunkt'))}</th>
        <th>${esc(w('spBemerkung'))}</th><th>${esc(w('spStatus'))}</th>
      </tr></thead>
      <tbody>${zeilen}</tbody>
      <tfoot>${fuss}</tfoot>
    </table></div>`;
}

// Das Regelwerk wechselt beim Ziehen des Fensters von selbst -- der vom
// Skript gebaute Inhalt nicht. Ohne diesen Umschalter bliebe nach dem
// Ueberschreiten der Grenze die Darstellung der anderen Seite stehen.
// Angehaengt an dieselbe Grenze wie das Regelwerk, damit beide nie
// auseinanderlaufen koennen.
matchMedia('(min-width: 1080px)').addEventListener('change', () => {
  if (typeof reiter !== 'undefined' && reiter === 'plan') zeichnePlan();
});

function zeichnePlanListe() {
  if (amSchreibtisch()) return zeichnePlanMonat();
  return zeichnePlanListeHandy();
}
function zeichnePlanListeHandy() {
  const heute = isoTag();
  // ENT-134: der ganze laufende Monat, nicht nur ab heute -- sonst
  // verschwindet eine bereits abgeschlossene Schicht von vorhin aus dem Plan,
  // noch bevor der Monat vorbei ist.
  const monatsanfang = heute.slice(0, 8) + '01';
  const kommend = schichten.filter(e => tagVon(e) >= monatsanfang)
    .sort((a, b) => tagVon(a).localeCompare(tagVon(b)) || String(a.von).localeCompare(String(b.von)));
  if (!kommend.length) {
    $('plan-inhalt-plan').innerHTML = LEER(w('keinePlan'), w('keinePlanText'),
      '<rect x="3" y="4.5" width="18" height="17" rx="2"/><line x1="3" y1="9.5" x2="21" y2="9.5"/>');
    return;
  }
  let letzter = '', html = '';
  kommend.forEach(e => {
    const tag = tagVon(e);
    if (tag !== letzter) {
      letzter = tag;
      const amTag = kommend.filter(x => tagVon(x) === tag && x.status !== 'abgesagt');
      const wd = WOCHENTAG[new Date(tag + 'T12:00:00').getDay()];
      html += `<div class="tag-kopf">
        <span>${esc(wd)}</span><b>${dmy(tag)}</b>
        ${tag === heute ? `<span class="marke m-a">${esc(w('heute'))}</span>` : ''}
        <span class="sp"></span>
        <span class="anz">${amTag.length} ${esc(amTag.length === 1 ? w('schicht') : w('schichten'))}</span>
      </div>`;
    }
    html += schichtKarte(e, false);
  });
  $('plan-inhalt-plan').innerHTML = html;
}

// ══════════════════════════════════════════ SPERRTAGE (ENT-028)
// Wer nicht kann, sagt es hier. Das ist eine Mitteilung an die Planung --
// kein Anspruch und keine Garantie. Genau so steht es auch im Text.
function ladeSperren() {
  const bis = isoTag(new Date(Date.now() + 90 * 864e5));
  return api(`meine_verfuegbarkeit.php?von=${isoTag()}&bis=${bis}`).then(({ ok, data }) => {
    sperrtage = {};
    if (ok && data.status === 'ok') {
      (data.tage || []).forEach(t => { sperrtage[String(t.datum).slice(0, 10)] = t.bemerkung || ''; });
    }
  });
}

function istGesperrt(t) {
  return Object.prototype.hasOwnProperty.call(sperrtage, t);
}

function zeichneSperren() {
  const heute = isoTag();
  const tage = Array.from({ length: 63 }, (_, i) => isoTag(new Date(Date.now() + i * 864e5)));
  // Wo bin ich schon eingeteilt? Einen solchen Tag zu sperren ist ein
  // Widerspruch -- das gehoert sichtbar daneben, nicht verschwiegen.
  const belegt = {};
  schichten.forEach(e => {
    if (e.status === 'abgesagt') return;
    (belegt[tagVon(e)] = belegt[tagVon(e)] || []).push(e);
  });

  const anzahl = tage.filter(istGesperrt).length;
  let html = `<div class="karte"><div class="karte-bd">
      <div style="font-size:15px;font-weight:660;margin-bottom:5px">${esc(w('sperrenTitel'))}</div>
      <div style="font-size:13px;color:var(--ink-2);line-height:1.55">${esc(w('sperrenText'))}</div>
      ${anzahl ? `<div style="margin-top:10px"><span class="marke m-w">${anzahl} ${anzahl === 1 ? 'Tag' : 'Tage'} gesperrt</span></div>` : ''}
    </div></div>`;

  let woche = '';
  tage.forEach(t => {
    const d = new Date(t + 'T12:00:00');
    const kw = kalenderwoche(d);
    if (kw !== woche) {
      woche = kw;
      html += `<div class="titel">Woche ${esc(kw)}</div>`;
    }
    const g = istGesperrt(t);
    const notiz = g ? sperrtage[t] : '';
    const eingeteilt = (belegt[t] || []).length;
    html += `<div class="karte sperr-karte${g ? ' aus' : ''}">
      <button class="sperr-zeile" onclick="sperreUm('${t}')">
        <span class="tg">
          <b>${esc(WOCHENTAG[d.getDay()].slice(0, 2))}</b>
          <span>${dmy(t).slice(0, 5)}</span>
        </span>
        <span class="ws">
          <b>${g ? esc(w('gesperrt')) : esc(w('frei'))}</b>
          ${eingeteilt ? `<span class="warn">${esc(w('sperreEingeteilt'))}</span>`
            : (notiz ? `<span>${esc(notiz)}</span>` : `<span>${t === heute ? 'heute' : ''}</span>`)}
        </span>
        <span class="schalter${g ? ' an' : ''}"><i></i></span>
      </button>
      ${g ? `<button class="sperr-notiz" onclick="sperreNotiz('${t}')">
        <svg class="i i-sm" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
        ${notiz ? esc(w('sperreNotiz')) + ' ändern' : esc(w('sperreNotiz')) + ' hinzufügen'}
      </button>` : ''}
    </div>`;
  });
  $('plan-inhalt-sperren').innerHTML = html;
}

// ISO-Kalenderwoche -- der Donnerstag der Woche entscheidet über das Jahr.
function kalenderwoche(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  const jahresStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return String(Math.ceil(((t - jahresStart) / 864e5 + 1) / 7));
}

// ══════════════════════════════════════════ ABWESENHEITEN (ENT-255)
// Dritter Unterreiter neben Plan/Sperren -- eigene Antraege stellen,
// ansehen und (solange unentschieden) zurueckziehen. Der Feriensaldo steht
// hier bewusst NICHT: das ist eine Auswertung fuer die Verwaltung
// (Dashboard), keine Selbstbedienungsfunktion, und die Kuerzungsregel bei
// langer Krankheit laeuft mit einer ausdruecklich als ANNAHME markierten
// Auslegung (siehe GAV-AUS-012) -- die gehoert nicht ungefragt aufs Handy.
const AW_TYP_TEXT = { ferien: 'typFerien', krankheit: 'typKrankheit', unfall: 'typUnfall',
  militaer: 'typMilitaer', schwangerschaft: 'typSchwangerschaft' };
const AW_STATUS_MARKE = { beantragt: 'm-w', genehmigt: 'm-p', abgelehnt: 'm-x' };
const AW_STATUS_TEXT = { beantragt: 'statusBeantragt', genehmigt: 'statusGenehmigt', abgelehnt: 'statusAbgelehnt' };

function ladeAbwesenheiten() {
  return api('meine_abwesenheit.php').then(({ ok, data }) => {
    meineAbwesenheiten = ok && data.status === 'ok' ? (data.abwesenheiten || []) : [];
  });
}

function zeichneAbwesenheiten() {
  const el = $('plan-inhalt-abwesenheit');
  if (!el) { return; }
  let html = `<div style="padding:14px 16px 6px">
    <button class="btn btn-primary aw-neu" onclick="awNeuerAntrag()">${esc(w('neuerAntrag'))}</button>
  </div>`;
  if (!meineAbwesenheiten.length) {
    html += LEER(w('keineAbwesenheiten'), w('keineAbwesenheitenText'),
      '<rect x="3" y="4.5" width="18" height="17" rx="2"/><line x1="3" y1="9.5" x2="21" y2="9.5"/>');
    el.innerHTML = html;
    return;
  }
  const sortiert = [...meineAbwesenheiten].sort((a, b) => String(b.von).localeCompare(String(a.von)));
  html += sortiert.map(a => `
    <div class="karte">
      <div class="karte-bd">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <b style="font-size:14.5px">${esc(w(AW_TYP_TEXT[a.typ] || a.typ))}</b>
          <span class="marke ${AW_STATUS_MARKE[a.status] || 'm-n'}">${esc(w(AW_STATUS_TEXT[a.status] || a.status))}</span>
        </div>
        <div style="font-size:13px;color:var(--ink-2);margin-top:4px">${dmy(a.von)} – ${dmy(a.bis)}</div>
        ${a.bemerkung ? `<div style="font-size:13px;color:var(--ink-2);margin-top:2px">${esc(a.bemerkung)}</div>` : ''}
        ${a.status === 'abgelehnt' && a.ablehnung_grund ? `<div style="font-size:13px;color:var(--neg);margin-top:6px">${esc(a.ablehnung_grund)}</div>` : ''}
        ${a.status === 'beantragt' ? `<button class="btn btn-plain" style="margin-top:10px" onclick="awStornieren(${a.id})">${esc(w('zurueckziehen'))}</button>` : ''}
      </div>
    </div>`).join('');
  el.innerHTML = html;
}

function awNeuerAntrag() {
  blattId = null;
  $('blTitel').textContent = w('abwesenheitTitel');
  $('blBody').innerHTML = `
    <div class="f"><label for="awTyp">${esc(w('abwesenheitArt'))}</label>
      <select class="inp" id="awTyp">
        ${Object.entries(AW_TYP_TEXT).map(([k, txt]) => `<option value="${k}">${esc(w(txt))}</option>`).join('')}
      </select></div>
    <div class="f"><label for="awVon">${esc(w('abwesenheitVon'))}</label><input class="inp" type="date" id="awVon" value="${isoTag()}"></div>
    <div class="f"><label for="awBis">${esc(w('abwesenheitBis'))}</label><input class="inp" type="date" id="awBis" value="${isoTag()}"></div>
    <div class="f"><label for="awBemerkung">${esc(w('bemerkung'))}</label><input class="inp" id="awBemerkung" maxlength="500"></div>`;
  $('blFuss').innerHTML = `
    <button class="btn btn-plain" onclick="blattZu()">${esc(w('abbrechen'))}</button>
    <button class="btn btn-primary" onclick="awAntragSpeichern()">${esc(w('senden'))}</button>`;
  blattZeigen();
}

function awAntragSpeichern() {
  const typ = $('awTyp').value, von = $('awVon').value, bis = $('awBis').value;
  const bemerkung = $('awBemerkung').value.trim();
  if (!von || !bis) { toast(w('beideZeitenNoetig')); return; }
  if (bis < von) { toast(w('vonBisFalsch')); return; }
  if (typ === 'ferien' && von < isoTag()) { toast(w('ferienNichtRueckwirkend')); return; }
  api('meine_abwesenheit.php', { method: 'POST', body: { typ, von, bis, bemerkung } }).then(({ ok, data }) => {
    if (!ok || data.status !== 'ok') { toast(data.message || w('netzfehler')); return; }
    toast(w('antragGesendet'));
    blattZu();
    ladeAbwesenheiten().then(zeichneAbwesenheiten);
  });
}

function awStornieren(id) {
  api('meine_abwesenheit.php', { method: 'POST', body: { id, stornieren: true } }).then(({ ok, data }) => {
    if (!ok || data.status !== 'ok') { toast(data.message || w('netzfehler')); return; }
    toast(w('antragZurueckgezogen'));
    ladeAbwesenheiten().then(zeichneAbwesenheiten);
  });
}

function sperreUm(t) {
  const neu = !istGesperrt(t);
  const notiz = neu ? '' : undefined;
  sperreSpeichern(t, neu, notiz);
}

function sperreSpeichern(t, gesperrt, bemerkung) {
  const rumpf = { datum: t, gesperrt };
  if (bemerkung !== undefined) rumpf.bemerkung = bemerkung;
  return api('meine_verfuegbarkeit.php', { method: 'POST', body: rumpf }).then(({ ok, data }) => {
    if (!ok || data.status !== 'ok') { toast(data.message || w('netzfehler')); return false; }
    if (gesperrt) { sperrtage[t] = data.bemerkung || ''; } else { delete sperrtage[t]; }
    zeichneSperren();
    toast(gesperrt ? w('sperreGesetzt') : w('sperreWeg'));
    return true;
  });
}

function sperreNotiz(t) {
  blattId = null;
  $('blTitel').textContent = dmy(t);
  $('blBody').innerHTML = `
    <p style="font-size:13.5px;color:var(--ink-2);line-height:1.55;margin-bottom:14px">${esc(w('sperreNotizText'))}</p>
    <div class="f"><label for="spNotiz">${esc(w('sperreNotiz'))}</label>
      <input class="inp" id="spNotiz" maxlength="200" value="${esc(sperrtage[t] || '')}" placeholder="z. B. erst ab 18 Uhr"></div>`;
  $('blFuss').innerHTML = `
    <button class="btn btn-plain" onclick="blattZu()">${esc(w('abbrechen'))}</button>
    <button class="btn btn-primary" onclick="sperreNotizSpeichern('${t}')">${esc(w('speichern'))}</button>`;
  blattZeigen();
}

function sperreNotizSpeichern(t) {
  sperreSpeichern(t, true, $('spNotiz').value.trim()).then(gut => { if (gut) blattZu(); });
}

      <svg class="i i-sm" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      ${esc(w('neuerRapport'))}

    <div class="titel">${esc(w('meineRapporte'))}</div>`;

  if (!rapporte.length) {
    html += LEER(w('keineRapporte'), w('keineRapporteText'),
      '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>');
  } else {
    html += rapporte.slice(0, 40).map(r => `<div class="karte"><div class="oben" style="display:flex;gap:14px;padding:16px">
        <span class="zeit" style="font-size:16px">${dmy(r.datum)}</span>
        <span class="was" style="flex:1;min-width:0">

        </span>
        <span class="marke m-p">${nf(r.netto_h, 2)} h</span>

}
