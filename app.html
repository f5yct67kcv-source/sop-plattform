}

// ══════════════════════════════════════════ MEINE STUNDEN (ENT-049)
// Die eigene, abgeglichene Arbeitszeit je Monat. Gerechnet wird mit denselben
// Regeln wie in der Verwaltung -- gav.js liegt beiden Oberflächen zugrunde,
// damit hier nie eine andere Zahl steht als dort.
//
// Gezeigt werden DREI getrennte Werte, nie einer: geleistete Zeit, Zeitbonus,
// Total. Der PAKO-Kommentar zu Art. 12 Abs. 2 verlangt ausdrücklich, dass der
// Zuschlag separat ausgewiesen wird.
//
// Und: der Hinweis darunter ist hier wichtiger als in der Verwaltung. Wer
// seine eigene Zahl liest, hält sie leicht für die Lohnabrechnung -- sie ist
// aber unvollständig (Feiertagsbonus, Zuschlag über 210 Std., Ferien,
// Absenzen fehlen). Art. 12 Ziff. 5 verlangt eine vollständige Abrechnung;
// diese Ansicht ersetzt sie nicht und sagt das im Klartext.
function stdMonatSetzen(n) {
  const m = stdMonat || new Date().toISOString().slice(0, 7);
  const d = new Date(Number(m.slice(0, 4)), Number(m.slice(5, 7)) - 1 + n, 1);
  stdMonat = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  stdSchichten = null;
  zeichneStunden();
}

function stdLaden() {
  const erster = stdMonat + '-01';
  const d = new Date(Number(stdMonat.slice(0, 4)), Number(stdMonat.slice(5, 7)), 0);
  const letzter = `${stdMonat}-${String(d.getDate()).padStart(2, '0')}`;
  return api(`meine_schichten.php?von=${erster}&bis=${letzter}`).then(({ ok, data }) => {
    stdSchichten = ok && data.status === 'ok' ? (data.schichten || []) : [];
    zeichneStunden();
  });
}

function zeichneStunden() {
  const box = $('stdBereich');
  if (!box) return;
  if (!stdMonat) { stdMonat = new Date().toISOString().slice(0, 7); }
  if (stdSchichten === null) {
    box.innerHTML = `<div class="karte"><div class="karte-bd" style="text-align:center;color:var(--ink-3)">…</div></div>`;
    stdLaden();
    return;
  }

  // Nur abgeglichene Schichten -- was nicht geprüft ist, ist kein Nachweis.
  const z = stdSchichten
    .filter(e => (e.ist_status || 'offen') !== 'offen')
    .map(e => {
      const tag = String(e.datum).slice(0, 10);
      const von = e.ist_von ? hm(e.ist_von) : '';
      const bis = e.ist_bis ? hm(e.ist_bis) : '';
      const netto = gavNetto(von, bis, e.ist_pause_min, e.ist_pause_bezahlt_ma);
      // Reinigungsschichten bekommen keinen Zeitbonus (ENT-061): Der GAV fuer
      // private Sicherheitsdienstleistungen gilt fuer sie nicht. Die geleistete
      // Zeit zaehlt selbstverstaendlich weiter -- nur die Bewertung entfaellt.
      const gav = gavGilt(e.sparte);
      return {
        tag, von, bis, netto, gav, titel: e.titel || e.einsatzart, kunde: e.kunde_name,
        pause: e.ist_pause_min, pauseBezahlt: Number(e.ist_pause_bezahlt_ma) === 1,
        nettoMin: netto ? Number(netto.slice(0, 2)) * 60 + Number(netto.slice(3, 5)) : 0,
        bonusMin: (gav && von && bis) ? gavBonusMin(tag, von, bis) : 0,
      };
    })
    .sort((a, b) => a.tag.localeCompare(b.tag) || String(a.von).localeCompare(String(b.von)));

  // Was noch nicht abgeglichen ist, wird nicht gerechnet -- aber es wird auch
  // nicht verschwiegen (ENT-053). Ohne diese Zeile sieht die Person eine Zahl,
  // die ihr zu tief vorkommt, und kann nicht unterscheiden, ob der Abgleich
  // noch aussteht oder ob etwas vergessen ging. Im laufenden Monat ist das
  // der Regelfall, nicht die Ausnahme.
  const offen = stdSchichten.filter(e => (e.ist_status || 'offen') === 'offen').length;
  const offenZeile = offen
    ? `<div class="offen-hinweis" id="stdOffen">${offen === 1
        ? esc(w('offenEine'))
        : `${offen} ${esc(w('offenMehrere'))}`}</div>`
    : '';

  const monatsName = new Date(stdMonat + '-01T12:00:00')
    .toLocaleDateString('de-CH', { month: 'long', year: 'numeric' });
  const blaettern = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <button class="btn btn-plain" id="stdZurueck" onclick="stdMonatSetzen(-1)" style="padding:6px 12px" aria-label="Vormonat">‹</button>
      <div style="flex:1;text-align:center;font-weight:640">${esc(monatsName)}</div>
      <button class="btn btn-plain" id="stdVor" onclick="stdMonatSetzen(1)" style="padding:6px 12px" aria-label="Folgemonat">›</button>
    </div>`;

  if (!z.length) {
    box.innerHTML = blaettern + LEER(w('keineStunden'), w('keineStundenText'),
      '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>') + offenZeile;
    return;
  }

  const netto = z.reduce((a, x) => a + x.nettoMin, 0);
  const ohneRegel = z.some(x => x.bonusMin === null);
  const bonus = z.reduce((a, x) => a + (x.bonusMin || 0), 0);
  const std = min => `${Math.floor(min / 60)}:${String(Math.round(min % 60)).padStart(2, '0')}`;

  // Getrennt nach Sparte (ENT-063). Bis hierher stand eine einzige Zahl da,
  // die GAV-Zeit und Nicht-GAV-Zeit addierte. Solange nur Zeit ANGEZEIGT
  // wird, ist das ertraeglich -- sobald darauf gerechnet wird, ist es falsch:
  // Die 210-Stunden-Schwelle nach Art. 14 Ziff. 3 und die Ferienentschaedigung
  // duerfen nur GAV-Stunden zaehlen. Sechzig Stunden Reinigung wuerden eine
  // Sicherheitskraft sonst kuenstlich ueber die Schwelle heben.
  const nettoGav = z.filter(x => x.gav !== false).reduce((a, x) => a + x.nettoMin, 0);
  const nettoRein = netto - nettoGav;
  const gemischt = nettoRein > 0 && nettoGav > 0;

  box.innerHTML = blaettern + `
    <div class="zahlen" id="stdZahlen">
      <div class="zahl"><b>${esc(std(netto))}</b><span>${esc(w('geleistet'))}</span></div>
      <div class="zahl">
        <button class="zahl-info" id="bonusInfo" onclick="bonusInfoBlatt()" aria-label="${esc(w('infoAria'))}" title="${esc(w('infoAria'))}">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><line x1="12" y1="11" x2="12" y2="16.5"/><line x1="12" y1="7.6" x2="12" y2="7.7"/></svg>
        </button>
        <b>+${esc(std(bonus))}</b><span>${esc(w('zeitbonus'))}</span>
      </div>
      <div class="zahl"><b>${esc(std(netto + bonus))}</b><span>${esc(w('gesamt'))}</span></div>
    </div>
    ${nettoRein > 0 ? `<div class="offen-hinweis" id="stdSparten">
      <b>${esc(w('davon'))}</b> ${esc(std(nettoGav))} ${esc(w('spGav'))} · ${esc(std(nettoRein))} ${esc(w('spRein'))}<br>
      ${esc(gemischt ? w('spGemischt') : w('spNurRein'))}
    </div>` : ''}
    ${offenZeile}
    <div class="karte" id="stdListe"><div class="karte-bd" style="padding:0">
      ${z.map(x => `<div style="padding:11px 14px;border-bottom:1px solid var(--line-soft)">
        <div style="display:flex;justify-content:space-between;gap:10px">
          <div style="min-width:0">
            <div style="font-weight:620">${esc(dmy(x.tag))} · ${esc(x.titel)}</div>
            <div style="font-size:12.5px;color:var(--ink-3)">${esc(x.kunde || '')}${x.von ? ` · ${esc(x.von)}–${esc(x.bis)}` : ''}${
              x.pause ? ` · ${nf(x.pause)} min${x.pauseBezahlt ? ' ' + esc(w('pauseBezahlt')) : ''}` : ''}${
              x.gav === false ? ` · ${esc(w('reinigung'))}` : ''}</div>
          </div>
          <div style="text-align:right;white-space:nowrap">
            <div style="font-weight:700">${esc(x.netto || '–')}</div>
            ${x.bonusMin ? `<div style="font-size:12px;color:var(--accent)">+${esc(std(x.bonusMin))}</div>` : ''}
          </div>
        </div></div>`).join('')}
    </div></div>
    <div class="karte" id="stdHinweis"><div class="karte-bd">
      <div style="font-weight:640;margin-bottom:4px">${esc(w('stundenHinweisTitel'))}</div>
      <p style="font-size:13px;color:var(--ink-3);margin:0">${esc(w('stundenHinweis'))}</p>
      <p style="font-size:13px;color:var(--warn);margin:8px 0 0">${esc(w('feiertagOffen'))}</p>
      ${ohneRegel ? `<p style="font-size:13px;color:var(--warn);margin:8px 0 0">${esc(w('ohneRegelwerk'))}</p>` : ''}
      ${z.some(x => x.gav === false)
        ? `<p style="font-size:13px;color:var(--ink-3);margin:8px 0 0">${esc(w('reinigungHinweis'))}</p>` : ''}
    </div></div>`;
}

// ══════════════════════════════════════════ BLATT
function blattAuf(id) {
  const e = schichten.find(x => Number(x.id) === Number(id));
  if (!e) return;
  blattId = Number(id);
  // Der Planung zeigen, dass diese Schicht angesehen wurde (ENT-113).
  // Beilaeufig: Ohne Rueckmeldung, ohne Wartezeit -- wer seine Schicht
  // ansieht, soll davon nichts merken. Schlaegt es fehl, fehlt das Auge in
  // der Planung; das darf das Oeffnen der Schicht nicht aufhalten.
  if (!e.gesehen_am) {
    e.gesehen_am = 'jetzt';
    api('meine_gesehen.php', { method: 'POST', body: { einsatz_id: Number(id) } }).catch(() => {});
  }
  const st = STATUS_MARKE[e.status] || STATUS_MARKE.geplant;
  const zu = ZUSAGE_MARKE[e.zusage] || ZUSAGE_MARKE.offen;
  const wd = WOCHENTAG[new Date(tagVon(e) + 'T12:00:00').getDay()];

  $('blTitel').textContent = e.titel || e.kunde_name;
  $('blBody').innerHTML = `
    ${e.status === 'abgesagt' ? `<div class="msg-err">${esc(w('abgesagtHinweis'))}</div>` : ''}
    ${e.status === 'provisorisch' ? `<div class="msg-err" style="color:var(--warn);background:var(--warn-soft)">${esc(w('provisorischHinweis'))}</div>` : ''}
    <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:16px">
      <div style="font-size:30px;font-weight:730;letter-spacing:-1px">${hm(e.von)}–${hm(e.bis)}</div>
      ${ueberNacht(e) ? `<div style="font-size:12.5px;color:var(--ink-3);font-weight:620">${esc(w('folgetag'))}</div>` : ''}
    </div>
    <dl class="dl">
      <dt>${esc(w('zeit'))}</dt><dd>${esc(wd)}, ${dmy(e.datum)}</dd>
      <dt>${esc(w('kunde'))}</dt><dd>${esc(e.kunde_name)}</dd>
      ${e.objekt_name ? `<dt>${esc(w('objekt'))}</dt><dd>${esc(e.objekt_name)}</dd>` : ''}
      <dt>${esc(w('arbeitsort'))}</dt><dd>${e.strasse ? esc(e.strasse) + '<br>' : ''}${esc(e.ort)}${e.kanton ? ' ' + esc(e.kanton) : ''}${
        schichtAdresse(e) ? `<br><a class="route-knopf" target="_blank" rel="noopener"
          href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(schichtAdresse(e))}"
          >${ROUTE_IKONE}${esc(w('route'))}</a>` : ''}</dd>
      ${e.treffpunkt ? `<dt>${esc(w('treffpunkt'))}</dt><dd>${esc(e.treffpunkt)}</dd>` : ''}
      ${e.kontakt_vorname || e.kontakt_nachname || e.kontakt_telefon ? `<dt>${esc(w('kontaktVorOrt'))}</dt><dd>${
        esc([e.kontakt_vorname, e.kontakt_nachname].filter(Boolean).join(' '))
      }${e.kontakt_telefon ? `${e.kontakt_vorname || e.kontakt_nachname ? '<br>' : ''}<a href="tel:${
        esc(String(e.kontakt_telefon).replace(/[^+0-9]/g, ''))}">${esc(e.kontakt_telefon)}</a>` : ''}</dd>` : ''}
      ${e.taetigkeit ? `<dt>${esc(w('taetigkeit'))}</dt><dd>${esc(e.taetigkeit)}</dd>` : ''}
      ${e.qualifikation ? `<dt>${esc(w('qualifikation'))}</dt><dd>${esc(e.qualifikation)}</dd>` : ''}
      <dt>${esc(w('einsatzart'))}</dt><dd>${esc(e.einsatzart)}</dd>
      <dt>Status</dt><dd><span class="marke ${st[1]}">${esc(w(st[0]))}</span> <span class="marke ${zu[1]}">${esc(w(zu[0]))}</span></dd>
      ${Number(e.im_team) > 1 ? `<dt>${esc(w('schicht'))}</dt><dd>${teamBlock(e)}</dd>` : ''}
      ${e.bemerkung ? `<dt>${esc(w('bemerkung'))}</dt><dd>${esc(e.bemerkung)}</dd>` : ''}
    </dl>
    <!-- Unterlagen des Planers (ENT-117). Der Platz steht schon, der Inhalt
         kommt nach: Die Liste ist eine eigene Abfrage und darf das Öffnen der
         Schicht nicht aufhalten. Ohne Unterlagen bleibt hier nichts stehen. -->
    <div id="blDok"></div>
    <div id="blRundgang"></div>
    ${darfSchichtRapportieren(e) ? `<button class="btn btn-primary btn-wide" style="margin-top:4px" onclick="schichtRapportBlatt(${Number(e.id)})">${esc(w('schichtRapportieren'))}</button>` : ''}
    ${(() => { const r = rapportFuerSchicht(e.id); return r
      ? `<p style="font-size:12.5px;color:var(--ink-3);text-align:center;margin-top:8px">${esc(w('schonRapportiert'))} ${dmy(r.erfasst_am)}, ${String(r.erfasst_am).slice(11, 16)}</p>`
      : ''; })()}`;

  blattDokLaden(Number(e.id));
  rundgangAbschnittZeichnen(e);

  // Eine bereits gegebene Antwort wird nicht noch einmal verlangt (ENT-120).
  antwortOffen = false;
  blattFussZeichnen(e);
  blattZeigen();
}

// ── Fussbereich der Schichtansicht (ENT-120)
//
// Wer zu- oder abgesagt hat, bekommt beim naechsten Oeffnen nicht wieder zwei
// gleich grosse Knoepfe vorgesetzt, die eine Entscheidung verlangen, die
// laengst gefallen ist. Stattdessen steht da, WAS beantwortet wurde.
//
// Die Knoepfe verschwinden aber nicht ersatzlos, sondern hinter „Antwort
// ändern": Auf einem Telefon liegen „Ablehnen" und „Zusagen" nebeneinander,
// und ein Fehlgriff ist schnell passiert. Waere die Antwort danach
// unwiderruflich, plante die Einsatzleitung mit einer Zusage, die niemand so
// gemeint hat -- und wer nach der Zusage krank wird, haette in der App
// ueberhaupt keinen Weg mehr. Eine Rueckmeldung, die sich nicht berichtigen
// laesst, ist schlechter als gar keine.
let antwortOffen = false;

function antwortAendern() {
  antwortOffen = true;
  const e = schichten.find(x => Number(x.id) === blattId);
  if (e) { blattFussZeichnen(e); }
}

function blattFussZeichnen(e) {
  const el = $('blFuss');
  if (!el) { return; }
  const schliessen = `<button class="btn btn-plain" onclick="blattZu()">${esc(w('schliessen'))}</button>`;
  if (e.status === 'abgesagt') { el.className = 'blatt-ft'; el.innerHTML = schliessen; return; }

  // Rückmeldung ist freiwillig -- die Einteilung bleibt so oder so bestehen.
  const beantwortet = e.zusage === 'zugesagt' || e.zusage === 'abgelehnt';
  if (!beantwortet || antwortOffen) {
    el.className = 'blatt-ft';
    el.innerHTML = `
      <button class="btn ${e.zusage === 'abgelehnt' ? 'btn-neg' : 'btn-plain'}" onclick="melden('abgelehnt')">${esc(w('ablehnen'))}</button>
      <button class="btn ${e.zusage === 'zugesagt' ? 'btn-pos' : 'btn-primary'}" onclick="melden('zugesagt')">${esc(w('zusagen'))}</button>`;
    return;
  }
  const ja = e.zusage === 'zugesagt';
  el.className = 'blatt-ft gestapelt';
  el.innerHTML = `
    <div class="ft-stand">
      <span class="marke ${ja ? 'm-p' : 'm-x'}">${esc(w(ja ? 'zugesagt' : 'abgelehnt'))}</span>
      <span class="ft-txt">${esc(w(ja ? 'hastZugesagt' : 'hastAbgelehnt'))} ${esc(w('planungSiehtEs'))}</span>
    </div>
    <div class="ft-reihe">
      <button class="btn btn-plain" onclick="antwortAendern()">${esc(w('antwortAendern'))}</button>
      ${schliessen}
    </div>`;
}

// ── Unterlagen zur Schicht (ENT-117) ────────────────────────────────────
// Was der Planer angehängt hat: Objektplan, Verkehrsanordnung,
// Sicherheitskonzept. Der Endpunkt gibt sie nur an Eingeteilte dieses
// Einsatzes heraus -- hier wird nichts zusätzlich geprüft, weil eine Prüfung
// in der Oberfläche keine ist.
// ── Wer sonst auf der Schicht steht (ENT-121) ───────────────────────────
//
// Bis dahin gab es nur die Anzahl. Der Projektinhaber hat das fuer die
// Absprache vor Ort revidiert (ENT-023 Ziff. „nur die Anzahl" ist damit
// ueberholt) -- ausdruecklich NUR die Namen: keine Telefonnummer, keine
// Personalnummer, kein Rueckmeldestand der anderen. Der Endpunkt gibt auch
// nicht mehr heraus; hier wird nur angezeigt, was ankommt.
//
// Eingeklappt, weil die Zahl in den meisten Faellen genuegt. Wer wissen will,
// wen er vor Ort sucht, klappt auf.
const TEAM_PFEIL = '<svg viewBox="0 0 24 24" aria-hidden="true" class="team-pfeil">'
  + '<polyline points="6 9 12 15 18 9"/></svg>';

function teamBlock(e) {
  const liste = Array.isArray(e.team) ? e.team : [];
  const zahl = `${Number(e.im_team)} ${esc(w('imTeam'))}`;
  // Ohne Namensliste bleibt es bei der Zahl -- ein Knopf, der nichts
  // aufklappt, ist schlimmer als kein Knopf.
  if (liste.length < 2) { return zahl; }
  return `<button type="button" class="team-auf" aria-expanded="false"
      title="${esc(w('teamZeigen'))}" onclick="teamUm(this)"><span>${zahl}</span>${TEAM_PFEIL}</button>
    <ul class="team-liste">${liste.map(m => `<li${m.bin_ich ? ' class="ich"' : ''}>${esc(m.name)}${
      m.bin_ich ? ` <span class="team-du">${esc(w('duSelbst'))}</span>` : ''}</li>`).join('')}</ul>`;
}

function teamUm(b) {
  const auf = b.getAttribute('aria-expanded') === 'true';
  b.setAttribute('aria-expanded', auf ? 'false' : 'true');
  const l = b.nextElementSibling;
  if (l) { l.classList.toggle('auf', !auf); }
}

// Adresse der Schicht als Zieladresse fuer die Navigation (ENT-119).
//
// ABGRENZUNG: Das hat NICHTS mit der Wegstrecke nach Art. 18 GAV zu tun
// (ENT-116). Dort geht es um die KUERZESTE Strecke ab Hauptanstellungsort als
// Grundlage fuer den Auslagenersatz, sie wird von einem Menschen abgelesen und
// gespeichert, und die Zoneneinteilung ist als GAV-AUS-011 offen. Hier geht es
// nur darum, dass die eingeteilte Person den Ort findet -- eine Navigation vom
// jeweiligen Standort aus, ohne origin, ohne gespeicherte Zahl, ohne jede
// Wirkung auf Lohn oder Rechnung. Diese beiden Wege duerfen nie zusammenlaufen.
//
// Kein origin: Der Startpunkt ist der Standort der Person, den kennt ihr Geraet
// -- und wir wollen ihn nicht wissen.
function schichtAdresse(e) {
  if (!e) { return ''; }
  return [e.strasse, e.ort, e.kanton].map(t => String(t || '').trim()).filter(Boolean).join(', ');
}

const ROUTE_IKONE = '<svg viewBox="0 0 24 24" aria-hidden="true" class="route-i">'
  + '<path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/>'
  + '<circle cx="12" cy="10" r="3"/></svg>';

function blattDokLaden(einsatzId) {
  const el = $('blDok'); if (!el) return;
  el.innerHTML = '';
  api('einsatz_dokument.php?einsatz_id=' + einsatzId).then(({ ok, data }) => {
    // Blatt inzwischen gewechselt? Dann gehört diese Antwort nicht mehr hierher.
    if (blattId !== einsatzId) return;
    const dok = (ok && data.status === 'ok') ? (data.dokumente || []) : [];
    if (!dok.length) return;
    el.innerHTML = `<div class="dok-kopf">${esc(w('dokumente'))}</div>
      <div class="dok-liste">${dok.map(d => `
        <button type="button" class="dok-zeile" onclick="dokOeffnen(${Number(d.id)})">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
               stroke-width="1.7" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          <span class="nm">${esc(d.dateiname)}</span>
          <span class="gr">${dokGr(Number(d.groesse) || 0)}</span>
        </button>`).join('')}</div>`;
  }).catch(() => {});
}

const dokGr = b => b >= 1048576 ? nf(b / 1048576, 1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';

// Der Endpunkt verlangt den Anmelde-Kopf, ein <a href> trägt ihn nicht mit.
// Das Fenster wird VOR dem Holen geöffnet: nach einem await gilt der Tipp
// nicht mehr als Nutzeraktion und der Browser blockiert es.
function dokOeffnen(id) {
  const f = window.open('', '_blank');
  fetch(API + 'einsatz_dokument.php?id=' + encodeURIComponent(id),
        { headers: token ? { 'X-Auth-Token': token } : {} })
    .then(r => { if (!r.ok) throw new Error('http'); return r.blob(); })
    .then(b => {
      const url = URL.createObjectURL(b);
      // Hier ist das Umleiten der richtige Rückfall, anders als im Dashboard:
      // In der installierten App gibt es oft gar kein zweites Fenster, und es
      // steht kein Formular offen, das dabei verloren ginge -- die Schicht ist
      // nach dem Zurückgehen einen Fingertipp entfernt.
      if (f) { f.location = url; } else { location.href = url; }
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    })
    .catch(() => { if (f) f.close(); toast(w('dokumentFehler')); });
}

// Nur bei zugesagtem Verkehrsdienst, und erst sobald die Schicht begonnen hat
// -- rapportiert wird, was geschah, nicht, was noch bevorsteht (ENT-082).
function darfSchichtRapportieren(e) {
  if (e.status === 'abgesagt' || e.zusage !== 'zugesagt' || e.einsatzart !== 'Verkehrsdienst') return false;
  const sp = spanne(e.datum, e.von, e.bis);
  return !!sp && sp[0] <= Date.now();
}

// Erinnerung, kein Fehler (ENT-134): mehr als zwei Stunden nach Schichtende
// noch kein eigener Rapport. Nur dort sinnvoll, wo ueberhaupt rapportiert
// werden darf -- sonst waere die Warnung ein Versprechen ohne Knopf dazu.
// Ist die Schicht bereits als "abgeschlossen" markiert, hat diese Person
// zwangslaeufig schon rapportiert (ENT-128 verlangt das von allen
// Zugeteilten), darum reicht die Pruefung ueber rapportFuerSchicht allein.
function schichtUeberfaellig(e) {
  if (!darfSchichtRapportieren(e)) return false;
  const sp = spanne(e.datum, e.von, e.bis);
  if (!sp || Date.now() < sp[1] + 2 * 3600e3) return false;
  return !rapportFuerSchicht(e.id);
}

// "Korrektur, neueste zaehlt": mehrere Schicht-Rapporte zur selben Zuteilung
// sind moeglich, hier zaehlt nur der zuletzt erfasste.
//
// Die Person muss mitgeprueft werden, nicht nur die Schicht: Wer das Recht
// "abgleich" hat, bekommt von rapport_list.php ALLE Rapporte. Auf einer
// Schicht zu zweit waere sonst der Rapport der Kollegin als der eigene
// erschienen -- und die Korrektur haette ihn mit fremden Angaben vorbefuellt.
function rapportFuerSchicht(einsatzId) {
  const treffer = rapporte.filter(r =>
    Number(r.einsatz_id) === Number(einsatzId) && r.mitarbeiter === (ich && ich.name));
  if (!treffer.length) return null;
  return treffer.slice().sort((a, b) => String(b.erfasst_am).localeCompare(String(a.erfasst_am)))[0];
}

function melden(zusage) {
  if (!blattId) return;
  api('meine_zusage.php', { method: 'POST', body: { einsatz_id: blattId, zusage } }).then(({ ok, data }) => {
    if (!ok || data.status !== 'ok') { toast(data.message || w('netzfehler')); return; }
    const e = schichten.find(x => Number(x.id) === blattId);
    if (e) e.zusage = zusage;
    blattZu();
    zeichne();
    toast(w('gemeldet'));
  });
}

// ══════════════════════════════════════════ RUNDGANG (ENT-180/182/145)
//
// Start und Fortsetzen leben in der bestehenden Schicht-Schublade (#blatt),
// gleiches Muster wie schichtRapportBlatt: derselbe Rahmen wird umgebaut statt
// einer eigenen zweiten Oberflaeche. Kein eigener Reiter in der Bodenleiste --
// ein Rundgang gehoert zu genau einem Einsatz, und genau dort wird er auch
// begonnen.
//
// Voraussetzung wie beim Rapport: zugesagt, nicht abgesagt, Schicht bereits
// begonnen (sp[0] <= jetzt) -- zusaetzlich hier: das Objekt hat ueberhaupt
// aktive Kontrollpunkte (e.hat_kontrollpunkte, aus meine_schichten.php).
// Bewusst KEINE Einschraenkung auf eine bestimmte Einsatzart: anders als beim
// Rapport (nur Verkehrsdienst) haengt ein Rundgang einzig am Objekt, nicht an
// der Einsatzart -- so in ENT-132/180/182 nirgends eingeschraenkt.
//
// ENT-279: hat das Objekt mindestens eine Kontrollrunden-Vorlage mit eigenem
// Ausfuehrungsfenster, gilt die Einsatz-Sollzeit hier NICHT mehr als Gate --
// welches Fenster (und ob "jetzt" darin liegt) klaert sich erst bei der
// Vorlage-Auswahl (rundgangVorlageWaehlen()). Ohne Fenster an keiner Vorlage
// bleibt das Verhalten von vor ENT-279 unveraendert: Start erst ab Sollzeit.
function darfRundgang(e) {
  if (e.status === 'abgesagt' || e.zusage !== 'zugesagt' || !e.hat_kontrollpunkte) return false;
  if (e.hat_zeitfenster) return true;
  const sp = spanne(e.datum, e.von, e.bis);
  return !!sp && sp[0] <= Date.now();
}

// Serverseitiges Gegenstueck: rundgang_im_fenster() in backend/rundgang.php --
// eine Aenderung dort muss auch hier nachgezogen werden, es gibt keine
// gemeinsame Quelle zwischen PHP und JS (gleiches Prinzip wie
// RUNDGANG_ABBRUCH_GRUENDE). Nur fuer die Anzeige/UX: die echte Sperre liegt
// serverseitig in mein_rundgang_starten.php.
function rundgangImFenster(jetztHm, fensterVonHm, fensterBisHm, toleranzMin) {
  if (!fensterVonHm || !fensterBisHm) return true;
  const min = hm => Number(hm.slice(0, 2)) * 60 + Number(hm.slice(3, 5));
  let jetzt = min(jetztHm);
  let von = min(fensterVonHm) - toleranzMin;
  let bis = min(fensterBisHm) + toleranzMin;
  if (bis <= von) bis += 1440;
  if (jetzt < von) jetzt += 1440;
  return jetzt >= von && jetzt <= bis;
}
const RUNDGANG_FENSTER_TOLERANZ_MIN = 5;
const RUNDGANG_AUSSERHALB_FENSTER_GRUENDE = {
  planer_freigabe: 'Freigabe durch Planer',
  kurzfristige_umdisposition: 'Kurzfristige Umdisposition',
  kundenwunsch: 'Wunsch des Kunden',
  sonstige: 'Sonstige Gründe',
};

// Geraeteseitiger Zeitstempel im Moment der Erfassung (ENT-132 Punkt 5,
// Offline-Prinzip) -- lokale Zeit wie ueberall sonst im Datenmodell (datum/
// von/bis kennen ebenfalls keine Zeitzone), keine UTC-Umrechnung.
function jetztDatetime() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

// ── Warteschlange fuer die Offline-Uebermittlung (ENT-132 Punkt 5) ──────
// Ein Kontrollpunkt-Ereignis wird sofort lokal festgehalten, unabhaengig vom
// Netzstatus, und erst danach an den Server gemeldet -- der Zeitstempel zaehlt
// den Moment der Erfassung, nicht den der Uebermittlung.
function rdWarteschlangeLesen() {
  try { return JSON.parse(localStorage.getItem(RD_WARTESCHLANGE) || '[]'); } catch { return []; }
}
function rdWarteschlangeSchreiben(liste) {
  try { localStorage.setItem(RD_WARTESCHLANGE, JSON.stringify(liste)); } catch {}
}
function rdWarteschlangeHinzufuegen(eintrag) {
  const liste = rdWarteschlangeLesen();
  liste.push(eintrag);
  rdWarteschlangeSchreiben(liste);
}

// Sendet alle wartenden Meldungen, gruppiert nach Rundgang (der Endpunkt
// verarbeitet mehrere Scans auf einmal -- genau dafuer ist er gebaut). Ohne
// Netz bleibt ein Eintrag einfach stehen und wird beim naechsten Aufruf
// (online-Ereignis, erneutes Oeffnen des Rundgangs) wieder versucht. Lehnt der
// Server einen Punkt inhaltlich ab (z.B. ausserhalb des Geofence-Radius --
// moeglich, wenn offline erfasst und die Position tatsaechlich nicht passte),
// wird er wieder als offen gezeigt, nicht stillschweigend als erledigt
// behauptet (ENT-182: Fehlermeldung + erneuter Versuch, alternativ "nicht
// verfuegbar").
function rdWarteschlangeSenden() {
  const liste = rdWarteschlangeLesen();
  if (!liste.length) return Promise.resolve();
  const gruppen = {};
  liste.forEach(e => { (gruppen[e.rundgang_id] = gruppen[e.rundgang_id] || []).push(e); });
  return Promise.all(Object.keys(gruppen).map(rid => {
    const scans = gruppen[rid];
    return api('mein_rundgang_scan.php', { method: 'POST', body: {
      rundgang_id: Number(rid),
      scans: scans.map(({ rundgang_id, ...rest }) => rest),
    } }).then(({ ok, data }) => {
      if (!ok || data.status !== 'ok') { return; } // bleibt in der Warteschlange
      // Nur die in DIESER Anfrage tatsaechlich uebermittelten Punkte entfernen
      // -- nicht die gesamte Gruppe. Kommt zwischen Abschicken und Antwort ein
      // weiterer Punkt fuer denselben Rundgang dazu, darf der nicht mit
      // verschwinden, ohne je gesendet worden zu sein.
      const gesendeteIds = new Set(scans.map(s => Number(s.kontrollpunkt_id)));
      rdWarteschlangeSchreiben(rdWarteschlangeLesen().filter(e =>
        !(Number(e.rundgang_id) === Number(rid) && gesendeteIds.has(Number(e.kontrollpunkt_id)))));
      const ergebnisse = data.ergebnisse || [];
      let abgelehnt = false;
      if (rundgangAktiv && Number(rundgangAktiv.id) === Number(rid)) {
        scans.forEach(s => {
          const k = rundgangAktiv.kontrollpunkte.find(x => Number(x.id) === Number(s.kontrollpunkt_id));
          if (!k) return;
          const r = ergebnisse.find(x => Number(x.kontrollpunkt_id) === Number(s.kontrollpunkt_id));
          if (r && r.status === 'fehler') { k.erledigt = null; k.wartend = false; k.fehler = r.message; abgelehnt = true; }
          else { k.wartend = false; }
        });
        // Schliesst der letzte offene Kontrollpunkt den Rundgang automatisch
        // ab (server-seitig, ENT-182), muss das auch hier ankommen -- sonst
        // bietet der Fuss weiterhin "Beenden" auf einem bereits fertigen
        // Rundgang an.
        if (data.rundgang_status) { rundgangAktiv.status = data.rundgang_status; }
        rundgangListeZeichnen();
      }
      if (abgelehnt) { toast(w('rundgangAbgelehntSpaeter')); }
    }).catch(() => {});
  }));
}
window.addEventListener('online', rdWarteschlangeSenden);

// ── Abschnitt in der Schicht-Schublade: Start- bzw. Fortsetzen-Knopf ────
// Eigener Platzhalter (#blRundgang, analog #blDok): eine eigene Abfrage darf
// das Oeffnen der Schicht nicht aufhalten, und ohne Berechtigung bleibt der
// Platz schlicht leer.
function rundgangAbschnittZeichnen(e) {
  const el = $('blRundgang'); if (!el) return;
  el.innerHTML = '';
  if (!darfRundgang(e)) return;
  const einsatzId = Number(e.id);
  api('mein_rundgang_offen.php?einsatz_id=' + einsatzId).then(({ ok, data }) => {
    if (blattId !== einsatzId) return; // Schublade inzwischen gewechselt
    const el2 = $('blRundgang'); if (!el2) return;
    const laeuft = ok && data.status === 'ok' && data.rundgang;
    el2.innerHTML = laeuft
      ? `<button class="btn btn-primary btn-wide" style="margin-top:4px" onclick="rundgangFortsetzen(${einsatzId})">${esc(w('rundgangFortsetzen'))}</button>`
      : `<button class="btn btn-primary btn-wide" style="margin-top:4px" onclick="rundgangStarten(${einsatzId})">${esc(w('rundgangStarten'))}</button>`;
  });
}

// Gibt es fuer das Objekt mehrere Kontrollrunden (ENT-204), fragt ein
// Zwischenschritt, welche gemacht wird -- bei keiner oder genau einer
// Vorlage entfaellt die Frage: ohne Vorlage unveraendertes Verhalten von vor
// ENT-204 (alle aktiven Kontrollpunkte), mit genau einer ist die Auswahl
// keine echte Entscheidung.
let rdVorlagenGeladen = [];

function rundgangStarten(einsatzId) {
  const btn = document.querySelector('#blRundgang button');
  if (btn) btn.disabled = true;
  api('mein_rundgang_vorlagen.php?einsatz_id=' + einsatzId).then(({ ok, data }) => {
    const vorlagen = (ok && data.status === 'ok') ? (data.vorlagen || []) : [];
    rdVorlagenGeladen = vorlagen;
    if (vorlagen.length > 1) {
      if (btn) btn.disabled = false;
      rundgangVorlageWahl(einsatzId, vorlagen);
      return;
    }
    rundgangVorlageWaehlen(einsatzId, vorlagen[0] ? vorlagen[0].id : null);
  });
}

function rundgangVorlageWahl(einsatzId, vorlagen) {
  const e = schichten.find(x => Number(x.id) === Number(einsatzId));
  if (!e) return;
  $('blTitel').textContent = w('rundgangVorlageWahlTitel');
  $('blBody').innerHTML = `
    <div style="font-size:13px;color:var(--ink-3);font-weight:620;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px">${esc(e.objekt_name || e.kunde_name)}</div>
    <p style="margin:0 0 14px">${esc(w('rundgangVorlageWahlHinweis'))}</p>
    <div id="rdVorlageListe" style="display:flex;flex-direction:column;gap:8px">
      ${vorlagen.map(v => `<button class="btn btn-primary btn-wide" onclick="rundgangVorlageWaehlen(${Number(einsatzId)},${Number(v.id)})">${esc(v.name)}</button>`).join('')}
    </div>`;
  $('blFuss').innerHTML = `<button class="btn btn-plain" onclick="blattAuf(${Number(einsatzId)})">${esc(w('zurueck'))}</button>`;
  blattZeigen();
}

// Neu (ENT-279): Weiche zwischen sofortigem Start und Grundauswahl. Liegt
// "jetzt" ausserhalb des Fensters der gewaehlten Vorlage (Toleranz
// eingerechnet), fragt zuerst einen Pflichtgrund ab, statt sofort zu
// starten. Die eigentliche Sperre bleibt serverseitig
// (mein_rundgang_starten.php) -- hier nur die UX-Weiche.
function rundgangVorlageWaehlen(einsatzId, vorlageId) {
  const v = vorlageId ? rdVorlagenGeladen.find(x => Number(x.id) === Number(vorlageId)) : null;
  if (v && v.fenster_von && v.fenster_bis &&
      !rundgangImFenster(jetztDatetime().slice(11, 16), v.fenster_von, v.fenster_bis, RUNDGANG_FENSTER_TOLERANZ_MIN)) {
    rundgangAusnahmeGrundWahl(einsatzId, vorlageId);
    return;
  }
  rundgangStartenMitVorlage(einsatzId, vorlageId, null);
}

// Gleiches UX-Muster wie rundgangAbbrechenAnzeigen() (Grund-Auswahl,
// Pflichtfeld, eigene Fehleranzeige) -- eigene, kleinere Grundliste
// (RUNDGANG_AUSSERHALB_FENSTER_GRUENDE), weil die Situation eine andere ist
// (Start ausserhalb des Fensters, kein Abbruch).
function rundgangAusnahmeGrundWahl(einsatzId, vorlageId) {
  $('blTitel').textContent = w('rundgangAusserhalbFensterTitel');
  $('blBody').innerHTML = `
    <div class="msg-err" style="color:var(--warn);background:var(--warn-soft)">${esc(w('rundgangAusserhalbFensterHinweis'))}</div>
    <div class="f"><label for="rfGrund">${esc(w('rundgangAusserhalbFensterGrund'))}</label>
      <select class="inp" id="rfGrund">
        <option value="">–</option>
        ${Object.entries(RUNDGANG_AUSSERHALB_FENSTER_GRUENDE).map(([code, txt]) =>
          `<option value="${esc(code)}">${esc(txt)}</option>`).join('')}
      </select>
    </div>
    <div id="rfErr" class="msg-err" style="display:none"></div>`;
  $('blFuss').innerHTML = `
    <button class="btn btn-plain" onclick="blattAuf(${Number(einsatzId)})">${esc(w('zurueck'))}</button>
    <button class="btn btn-primary" id="rfBtn" onclick="rundgangAusnahmeGrundSenden(${Number(einsatzId)},${vorlageId ? Number(vorlageId) : 'null'})">${esc(w('rundgangStarten'))}</button>`;
  blattZeigen();
}

function rundgangAusnahmeGrundSenden(einsatzId, vorlageId) {
  const err = $('rfErr'); err.style.display = 'none';
  const grund = $('rfGrund').value;
  if (!grund) { err.textContent = w('rundgangAbbrechenGrundPflicht'); err.style.display = ''; return; }
  rundgangStartenMitVorlage(einsatzId, vorlageId, grund);
}

function rundgangStartenMitVorlage(einsatzId, vorlageId, ausnahmeGrund) {
  document.querySelectorAll('#blRundgang button, #rdVorlageListe button, #rfBtn').forEach(b => b.disabled = true);
  const body = { einsatz_id: einsatzId };
  if (vorlageId) body.vorlage_id = vorlageId;
  if (ausnahmeGrund) body.ausnahme_grund = ausnahmeGrund;
  api('mein_rundgang_starten.php', { method: 'POST', body }).then(({ ok, data }) => {
    if (!ok || data.status !== 'ok') {
      document.querySelectorAll('#blRundgang button, #rdVorlageListe button, #rfBtn').forEach(b => b.disabled = false);
      toast(data.message || w('netzfehler'));
      return;
    }
    rundgangAktiv = { id: data.rundgang_id, einsatz_id: einsatzId, status: 'vorbereitet', pausiert_seit: null,
      kontrollpunkte: (data.kontrollpunkte || []).map(k => ({ ...k, erledigt: null })) };
    rundgangAnzeigen(einsatzId);
  });
}

function rundgangFortsetzen(einsatzId) {
  const btn = document.querySelector('#blRundgang button');
  if (btn) btn.disabled = true;
  api('mein_rundgang_offen.php?einsatz_id=' + einsatzId).then(({ ok, data }) => {
    if (btn) btn.disabled = false;
    if (!ok || data.status !== 'ok' || !data.rundgang) {
      toast(data.message || w('netzfehler'));
      rundgangAbschnittZeichnen(schichten.find(x => Number(x.id) === einsatzId));
      return;
    }
    const r = data.rundgang;
    rundgangAktiv = { id: r.id, einsatz_id: einsatzId, kontrollpunkte: r.kontrollpunkte,
      status: r.status, pausiert_seit: r.pausiert_seit };
    rundgangAnzeigen(einsatzId);
  });
}

// ── Screen 2: die Checkliste, im selben #blatt wie die Schicht selbst ──
function rundgangAnzeigen(einsatzId) {
  const e = schichten.find(x => Number(x.id) === Number(einsatzId));
  if (!e || !rundgangAktiv) return;
  $('blTitel').textContent = w('rundgangTitel');
  $('blBody').innerHTML = `
    <div style="font-size:13px;color:var(--ink-3);font-weight:620;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px">${esc(e.objekt_name || e.kunde_name)}</div>
    <div id="rdFortschritt" style="font-size:15px;font-weight:600;margin-bottom:16px"></div>
    <div id="rdBanner"></div>
    <div id="rdListe"></div>`;
  rundgangFussZeichnen();
  blattZeigen();
  rdWarteschlangeSenden();
  rundgangListeZeichnen();
}

// Eigene Funktion statt Teil von rundgangAnzeigen(): der Fuss muss sich auch
// OHNE Neuaufbau des ganzen Bildschirms aktualisieren, sobald sich der Status
// aendert -- z.B. wenn der letzte Kontrollpunkt bestaetigt wird und der
// Rundgang dadurch automatisch abschliesst (kein "Beenden" mehr auf einem
// bereits fertigen Rundgang).
function rundgangFussZeichnen() {
  if (!rundgangAktiv) return;
  const einsatzId = rundgangAktiv.einsatz_id;
  const fertig = rundgangAktiv.kontrollpunkte.length > 0 && rundgangAktiv.kontrollpunkte.every(k => k.erledigt);
  const zurueck = `<button class="btn btn-plain" onclick="blattAuf(${Number(einsatzId)})">${esc(w('zurueck'))}</button>`;
  let aktion = '';
  let gestapelt = false;
  if (rundgangAktiv.status === 'pausiert') {
    // "Abbrechen" fehlte hier bisher komplett (ENT-290, gemeldeter Fehler)
    // -- ein pausierter Rundgang liess sich nur fortsetzen, nie beenden.
    // Fuehrt ueber denselben Pflichtgrund-Dialog wie aus dem aktiven Zustand
    // (rundgangAbbrechenAnzeigen, ENT-146) -- keine zweite, schwaechere
    // Abbruch-Variante nur fuer diesen Fall.
    aktion = `<button class="btn btn-neg" onclick="rundgangAbbrechenAnzeigen(${Number(einsatzId)})">${esc(w('rundgangAbbrechenKnopf'))}</button>`
      + `<button class="btn btn-primary" onclick="rundgangWiederAufnehmen(${Number(einsatzId)})">${esc(w('rundgangPauseWiederaufnehmen'))}</button>`;
    gestapelt = true;
  } else if (rundgangAktiv.status !== 'abgebrochen' && rundgangAktiv.status !== 'abgeschlossen' && !fertig) {
    aktion = `<button class="btn btn-neg" onclick="rundgangBeendenAnzeigen(${Number(einsatzId)})">${esc(w('rundgangBeenden'))}</button>`;
  }
  const fussEl = $('blFuss');
  // Drei Knoepfe nebeneinander (Zurueck/Abbrechen/Fortsetzen) waeren auf einem
  // Telefon zu schmal -- gestapelt statt nebeneinander, nur fuer diesen Fall
  // (bestehendes Muster .gestapelt).
  if (fussEl) { fussEl.classList.toggle('gestapelt', gestapelt); }
  $('blFuss').innerHTML = zurueck + aktion;
}

function rundgangListeZeichnen() {
  if (!rundgangAktiv) return;
  rundgangFussZeichnen();
  const kps = rundgangAktiv.kontrollpunkte;
  const erledigt = kps.filter(k => k.erledigt).length;
  const fEl = $('rdFortschritt');
  if (fEl) {
    fEl.textContent = rundgangAktiv.status === 'abgebrochen' ? w('rundgangAbgebrochen')
      : (kps.length > 0 && erledigt === kps.length) ? w('rundgangAbgeschlossen')
      : `${erledigt} ${w('von')} ${kps.length} ${w('erledigt')}`;
  }
  const bEl = $('rdBanner');
  if (bEl) {
    bEl.innerHTML = rundgangAktiv.status === 'pausiert'
      ? `<div class="msg-err" style="color:var(--ink-2);background:var(--line-soft)">${esc(w('rundgangPausiertHinweis'))}${rundgangAktiv.pausiert_seit ? ' (' + esc(w('rundgangPausiertSeit')) + ' ' + esc(String(rundgangAktiv.pausiert_seit).slice(11, 16)) + ')' : ''}</div>`
      : rundgangAktiv.status === 'abgebrochen'
      ? `<div class="msg-err">${esc(RUNDGANG_ABBRUCH_GRUENDE[rundgangAktiv.abbruch_grund] || w('rundgangAbgebrochen'))}${rundgangAktiv.abbruch_freitext ? ' — ' + esc(rundgangAktiv.abbruch_freitext) : ''}</div>`
      : '';
  }
  const gesperrt = rundgangAktiv.status === 'pausiert' || rundgangAktiv.status === 'abgebrochen';
  const lEl = $('rdListe');
  if (lEl) { lEl.innerHTML = kps.map((k, i) => rdZeile(k, i + 1, gesperrt)).join(''); }
}

function rdZeile(k, nr, gesperrt) {
  const typLabel = k.typ === 'nfc' ? w('kpTypNfc') : w('kpTypGeofence');
  if (k.erledigt) {
    const istNv = k.erledigt.status === 'nicht_verfuegbar';
    const istEs = k.erledigt.status === 'ersatzscan';
    const zeit = String(k.erledigt.erfasst_am || '').slice(11, 16);
    const statusTxt = istNv ? w('kpNichtVerfuegbar') : istEs ? w('kpErsatzscan') : w('kpBestaetigt') + ' ' + zeit;
    const hakenKlasse = istNv ? 'rd-haken-nv' : istEs ? 'rd-haken-es' : '';
    const hakenZeichen = istNv ? '!' : istEs ? '📷' : '✓';
    return `<div class="rd-zeile rd-fertig">
      <div class="rd-kopf">
        <span class="rd-nr">${nr}</span>
        <div class="rd-txt">
          <div class="rd-bez">${esc(k.bezeichnung)}</div>
          <div class="rd-meta">${esc(typLabel)} · ${esc(statusTxt)}${k.wartend ? ' · ' + esc(w('kpWirdGesendet')) : ''}</div>
        </div>
      </div>
      <span class="rd-haken ${hakenKlasse}">${hakenZeichen}</span>
    </div>`;
  }
  // NFC ist auf diesem Geraet ehrlich als nicht verfuegbar ausgewiesen, statt
  // eine Scan-Funktion vorzutaeuschen, die auf dem Wachpersonal-Handy (fast
  // ausschliesslich iPhone) technisch gar nicht laufen kann -- Web-NFC gibt es
  // auf iOS/Safari plattformbedingt nicht, unabhaengig von der Browserwahl.
  const kannScannen = k.typ === 'geofence';
  return `<div class="rd-zeile">
    <div class="rd-kopf">
      <span class="rd-nr">${nr}</span>
      <div class="rd-txt">
        <div class="rd-bez">${esc(k.bezeichnung)}</div>
        <div class="rd-meta">${esc(typLabel)}</div>
      </div>
    </div>
    ${!kannScannen && !gesperrt ? `<div class="rd-hinweis">${esc(w('kpNfcNichtVerfuegbarGeraet'))}</div>` : ''}
    ${k.fehler ? `<div class="msg-err" style="margin:10px 0 0 37px">${esc(k.fehler)}</div>` : ''}
    ${gesperrt ? '' : `
    <div class="rd-akt">
      ${kannScannen ? `<button class="btn btn-primary" id="rdBtn${k.id}" onclick="rdBestaetigen(${k.id})">${esc(w('kpBestaetigen'))}</button>` : ''}
      <button class="btn btn-plain" onclick="rdEsUm(${k.id})">${esc(w('kpErsatzscan'))}</button>
      <button class="btn btn-plain" onclick="rdNvUm(${k.id})">${esc(w('kpNichtVerfuegbar'))}</button>
    </div>
    <div class="rd-nv" id="rdEs${k.id}" style="display:none">
      <input type="file" accept="image/*" capture="environment" id="rdEsInput${k.id}" onchange="rdEsFotoGewaehlt(${k.id})" style="display:none">
      <button class="btn btn-plain" onclick="document.getElementById('rdEsInput${k.id}').click()">${esc(w('kpEsFotoAufnehmen'))}</button>
      <img class="rd-es-vorschau" id="rdEsVorschau${k.id}" style="display:none" alt="">
      <textarea class="inp" id="rdEsText${k.id}" rows="2" placeholder="${esc(w('kpBeschreibungPflicht'))}"></textarea>
      <button class="btn btn-neg" onclick="rdEsSenden(${k.id})">${esc(w('kpEsMelden'))}</button>
    </div>
    <div class="rd-nv" id="rdNv${k.id}" style="display:none">
      <textarea class="inp" id="rdNvText${k.id}" rows="2" placeholder="${esc(w('kpBeschreibungPflicht'))}"></textarea>
      <button class="btn btn-neg" onclick="rdNvSenden(${k.id})">${esc(w('kpNichtVerfuegbarMelden'))}</button>
    </div>
    <div class="msg-err" id="rdFehler${k.id}" style="display:none;margin:10px 0 0 37px"></div>`}
  </div>`;
}

function rdZeigeFehler(kontrollpunktId, message) {
  const el = $('rdFehler' + kontrollpunktId);
  if (el) { el.textContent = message; el.style.display = ''; }
}

// Geofence-Bestaetigung: ein einzelner Standortabruf im Moment des Antippens,
// kein watchPosition() -- die Live-Sicht bildet ausdruecklich nur diskrete
// Kontrollpunkt-Ereignisse ab, keine kontinuierliche Positionsverfolgung
// (ENT-131).
function rdBestaetigen(kontrollpunktId) {
  const k = rundgangAktiv.kontrollpunkte.find(x => Number(x.id) === kontrollpunktId);
  if (!k) return;
  if (!navigator.geolocation) { rdZeigeFehler(kontrollpunktId, w('kpStandortFehler')); return; }
  const btn = $('rdBtn' + kontrollpunktId);
  if (btn) btn.disabled = true;
  navigator.geolocation.getCurrentPosition(
    pos => rdScanEintragen(k, 'bestaetigt', { lat: pos.coords.latitude, lng: pos.coords.longitude }),
    () => { if (btn) btn.disabled = false; rdZeigeFehler(kontrollpunktId, w('kpStandortFehler')); },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

function rdNvUm(kontrollpunktId) {
  const el = $('rdNv' + kontrollpunktId);
  if (el) { el.style.display = el.style.display === 'none' ? '' : 'none'; }
}
function rdNvSenden(kontrollpunktId) {
  const k = rundgangAktiv.kontrollpunkte.find(x => Number(x.id) === kontrollpunktId);
  if (!k) return;
  const feld = $('rdNvText' + kontrollpunktId);
  const text = feld ? feld.value.trim() : '';
  if (!text) { rdZeigeFehler(kontrollpunktId, w('kpBeschreibungPflicht')); return; }
  rdScanEintragen(k, 'nicht_verfuegbar', {}, text);
}

function rdScanEintragen(k, status, ort, beschreibung, foto) {
  const erfasst_am = jetztDatetime();
  k.fehler = null;
  k.erledigt = { status, erfasst_am, beschreibung: beschreibung || null };
  k.wartend = true;
  rdWarteschlangeHinzufuegen({
    rundgang_id: rundgangAktiv.id, kontrollpunkt_id: k.id, status, erfasst_am,
    lat: (ort && ort.lat != null) ? ort.lat : null, lng: (ort && ort.lng != null) ? ort.lng : null,
    beschreibung: beschreibung || null,
    foto: foto || null,
  });
  rundgangListeZeichnen();
  rdWarteschlangeSenden();
}

// ── Ersatzscan (Q-22 in sop-projekt): Fotobeleg statt technischer Pruefung,
// wenn NFC/Geofence nicht moeglich ist (Chip zerstoert, Punkt nicht
// auffindbar). Weder NFC- noch Geofence-Verifikation, dafuer Foto UND
// Begruendung zwingend -- sonst waere ein Ersatzscan ein unbelegter Klick.
// Startet bewusst NICHT die Rohzeit (Projektinhaber-Entscheid 2026-08-28,
// gleiche Begruendung wie bei "nicht verfuegbar" in ENT-145): ein Foto ist
// kein technischer Vor-Ort-Nachweis wie NFC/Geofence.
const rdEsFotos = {};   // Kontrollpunkt-Id -> komprimiertes Foto (data: URL), bis "Melden" gedrueckt wird

function rdEsUm(kontrollpunktId) {
  const el = $('rdEs' + kontrollpunktId);
  if (el) { el.style.display = el.style.display === 'none' ? '' : 'none'; }
}

// Verkleinert das Kamerafoto vor dem Versand: ein unkomprimiertes Handyfoto
// (haeufig mehrere MB) wuerde sowohl das Server-Limit als auch den Platz der
// Offline-Warteschlange (localStorage) sprengen. Ein Fotobeleg fuer "war ich
// vor Ort" braucht keine Druckaufloesung -- 1280px Kantenlaenge und JPEG-
// Qualitaet 0.7 ergeben typischerweise 100-400 KB.
function rdEsKomprimieren(datei) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('lesen fehlgeschlagen'));
    reader.onload = () => {
      const bild = new Image();
      bild.onerror = () => reject(new Error('dekodieren fehlgeschlagen'));
      bild.onload = () => {
        const MAX_KANTE = 1280;
        const skala = Math.min(1, MAX_KANTE / Math.max(bild.width, bild.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(bild.width * skala);
        canvas.height = Math.round(bild.height * skala);
        canvas.getContext('2d').drawImage(bild, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      bild.src = reader.result;
    };
    reader.readAsDataURL(datei);
  });
}

function rdEsFotoGewaehlt(kontrollpunktId) {
  const input = $('rdEsInput' + kontrollpunktId);
  const datei = input && input.files && input.files[0];
  if (!datei) return;
  rdEsKomprimieren(datei).then(dataUrl => {
    rdEsFotos[kontrollpunktId] = dataUrl;
    const vorschau = $('rdEsVorschau' + kontrollpunktId);
    if (vorschau) { vorschau.src = dataUrl; vorschau.style.display = ''; }
  }).catch(() => rdZeigeFehler(kontrollpunktId, w('kpEsFotoFehler')));
}

function rdEsSenden(kontrollpunktId) {
  const k = rundgangAktiv.kontrollpunkte.find(x => Number(x.id) === kontrollpunktId);
  if (!k) return;
  const dataUrl = rdEsFotos[kontrollpunktId];
  if (!dataUrl) { rdZeigeFehler(kontrollpunktId, w('kpEsFotoPflicht')); return; }
  const feld = $('rdEsText' + kontrollpunktId);
  const text = feld ? feld.value.trim() : '';
  if (!text) { rdZeigeFehler(kontrollpunktId, w('kpBeschreibungPflicht')); return; }
  const foto = dataUrl.slice(dataUrl.indexOf(',') + 1);   // "data:image/jpeg;base64," abtrennen
  delete rdEsFotos[kontrollpunktId];
  rdScanEintragen(k, 'ersatzscan', {}, text, foto);
}

// ══════════════════════════════════════════ ZEITBONUS ERKLAERT (ENT-052)
// Der Zeitbonus steht als Zahl auf der Kachel, aber die wenigsten kennen den
// GAV. Eine Zahl, die niemand einordnen kann, erzeugt Rueckfragen oder --
// schlimmer -- stilles Misstrauen.
//
// Der Text sagt AUSSCHLIESSLICH, was im Wortlaut von Art. 12 Ziff. 2 steht,
// geprueft gegen gav-2026.pdf, plus die vom PAKO-Kommentar bestaetigte Regel
// "nur einmal, nicht doppelt" (GAV-AUS-001). Keine eigene Auslegung -- das
// verbietet CLAUDE.md ausdruecklich, und hier liest es die betroffene Person.
//
// Was NICHT drinsteht und bewusst nicht: die anteilige Berechnung bei
// angebrochenen Stunden. Die ist bis heute eine vorlaeufige Annahme
// (GAV-AUS-008, Status offen) und darf niemandem als Regel verkauft werden.
function bonusInfoBlatt() {
  blattId = null;
  $('blTitel').textContent = w('bonusInfoTitel');
  const punkt = (k, t) => `<div style="margin-bottom:14px">
      <div style="font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px">${esc(k)}</div>
      <div style="font-size:15px;line-height:1.45">${esc(t)}</div>
    </div>`;
  $('blBody').innerHTML =
    punkt(w('bonusInfoWofuer'), w('bonusInfoWofuerT')) +
    punkt(w('bonusInfoWieviel'), w('bonusInfoWievielT')) +
    punkt(w('bonusInfoWas'), w('bonusInfoWasT')) +
    punkt(w('bonusInfoEinmal'), w('bonusInfoEinmalT')) +
    `<div style="font-size:13.5px;color:var(--warn);font-weight:600;margin-bottom:12px">${esc(w('bonusInfoLuecke'))}</div>
     <div style="font-size:12.5px;color:var(--ink-3)">${esc(w('bonusInfoQuelle'))}</div>`;
  $('blFuss').innerHTML =
    `<button class="btn btn-primary" onclick="blattZu()">${esc(w('schliessen'))}</button>`;
  blattZeigen();
}

function passwortBlatt() {
  blattId = null;
  $('blTitel').textContent = w('passwortAendern');
  $('blBody').innerHTML = `
    <div class="msg-err" id="pwErr" style="display:none"></div>
    <div class="f"><label for="pwAlt">${esc(w('altesPasswort'))}</label><input class="inp" id="pwAlt" type="password" autocomplete="current-password"></div>
    <div class="f"><label for="pwNeu">${esc(w('neuesPasswort'))}</label><input class="inp" id="pwNeu" type="password" placeholder="${esc(w('mind6'))}" autocomplete="new-password"></div>`;
  $('blFuss').innerHTML = `
    <button class="btn btn-plain" onclick="blattZu()">${esc(w('abbrechen'))}</button>
    <button class="btn btn-primary" id="pwBtn" onclick="passwortSpeichern()">${esc(w('speichern'))}</button>`;
  blattZeigen();
}
function passwortSpeichern() {
  const err = $('pwErr'); err.style.display = 'none';
  const alt = $('pwAlt').value, neu = $('pwNeu').value;
  if (neu.length < 6) { err.textContent = w('mind6'); err.style.display = ''; return; }
  const b = $('pwBtn'); b.disabled = true;
  api('mein_passwort.php', { method: 'POST', body: { alt, neu } }).then(({ ok, data }) => {
    b.disabled = false;
    if (!ok || data.status !== 'ok') { err.textContent = data.message || w('netzfehler'); err.style.display = ''; return; }
    blattZu();
    toast(w('passwortOk'));
  });
}

function blattZeigen() {
  $('abdunkeln').classList.add('on');
  $('blatt').classList.add('on');
  $('blatt').setAttribute('aria-hidden', 'false');
}
function blattZu() {
  $('abdunkeln').classList.remove('on');
  $('blatt').classList.remove('on');
  $('blatt').setAttribute('aria-hidden', 'true');
  blattId = null;
}

// ══════════════════════════════════════════ START
document.addEventListener('keydown', e => { if (e.key === 'Escape') blattZu(); });
$('gPass').addEventListener('keydown', e => { if (e.key === 'Enter') anmelden(); });
$('gName').addEventListener('keydown', e => { if (e.key === 'Enter') $('gPass').focus(); });

beschriften();
if (token && ich) starten();
</script>
</body>
</html>
