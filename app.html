  if (rundgangAktiv.status === 'abgebrochen' || rundgangAktiv.status === 'abgeschlossen') {
    rgsReiter = 'punkte';
  } else if (rgsReiter !== 'karte' && !rgsLaufBegonnen
             && rgKarteDaten(rundgangAktiv.kontrollpunkte).zeigbar.length) {
    /* Eine frisch begonnene Runde startet auf der KARTE (ENT-331), Vorgabe
       des Projektinhabers. Sie beantwortet die Frage, die man beim
       Losgehen wirklich hat: wo bin ich, wo ist der nächste Punkt. Die
       Liste beantwortet „was ist schon erledigt" -- das interessiert
       später.
       Nur beim ERSTEN Zeichnen der Runde: Wer danach bewusst auf einen
       anderen Reiter wechselt, soll dort bleiben, auch wenn die Seite
       neu gezeichnet wird (das geschieht bei jeder neuen Position).

       Und nur, wenn die Karte überhaupt etwas zeigen kann: Eine Runde aus
       lauter NFC-Punkten hat keine Koordinaten. Dort auf die Karte zu
       springen hiesse, den Wächter mit „keine darstellbaren Punkte" zu
       begrüssen — und ihm den einen Reiter wegzunehmen, der ihm hilft. */
    rgsReiter = 'karte';
  }
  rgsLaufBegonnen = true;
  rgsLaufTitel = e.objekt_name || e.kunde_name || w('rgsLaufTitel');
  $('rgsTitel').textContent = rgsLaufTitel;
  $('rgsFuss').innerHTML = '';
  $('rgsFuss').hidden = true;
  $('rgsReiter').hidden = false;
  rgZahlenAn(true);
  $('rgSeite').classList.add('on');
  $('rgSeite').setAttribute('aria-hidden', 'false');
  rgLaufReiterZeichnen();
  rgLaufZeichnen();
  rgTimerStarten();
  // Ortung nur, solange die Runde tatsaechlich laeuft (ENT-317). Auf einer
  // beendeten, abgebrochenen oder pausierten Runde hat sie nichts zu suchen
  // -- so vom Projektinhaber verlangt ("wenn der Rundgang beendet wird, wird
  // die Verfolgung nicht mehr aktiv"). Der Zustand wird bei jedem Zeichnen
  // neu beurteilt, nicht nur hier: Eine Runde kann waehrend der Anzeige
  // enden, etwa mit dem letzten Kontrollpunkt.
  rgOrtungNachfuehren();
  // Der Tonkanal muss aus einer Nutzeraktion heraus entstehen, sonst bleibt
  // er auf iOS stumm (ENT-319). Das Oeffnen der Runde IST eine -- jemand
  // hat getippt, um hierherzukommen.
  rgTonEntsperren();
  rdWarteschlangeSenden();
}

/* Eine Stelle entscheidet, ob geortet wird -- nicht fuenf verstreute
   Aufrufe. Wer das an jedem Zustandswechsel einzeln einbaut, vergisst
   genau den einen, nach dem die Ortung weiterlaeuft. */
function rgOrtungNachfuehren() {
  const laeuft = rgsModus === 'lauf' && rundgangAktiv
    && rundgangAktiv.status !== 'abgeschlossen'
    && rundgangAktiv.status !== 'abgebrochen'
    && rundgangAktiv.status !== 'pausiert';
  if (laeuft) { rgOrtungStarten(); } else { rgOrtungStoppen(); }
}

function rgLaufReiterZeichnen() {
  // Nur Reiter, die etwas zeigen. Ein "Karte"-Reiter mit dem Hinweis "folgt"
  // waere ein Knopf, der nichts tut -- der zweite Schritt bringt ihn samt
  // Inhalt.
  const offeneAufgaben = (rundgangAktiv ? rundgangAktiv.kontrollpunkte : [])
    .reduce((n, k) => n + (k.erledigt ? rdAufgabenOffen(k).length : 0), 0);
  // Auf der Karte darstellbar ist nur, was Koordinaten hat -- NFC-Punkte
  // haben keine (ENT-265). Die Zahl am Reiter nennt darum die DARSTELLBAREN,
  // und die Karte selbst sagt, wie viele sie nicht zeigt.
  const kartePunkte = rgKarteDaten(rundgangAktiv ? rundgangAktiv.kontrollpunkte : []);
  $('rgsReiter').innerHTML = [
    ['karte', w('rgsReiterKarte'),
      '<polygon points="1 6 8 3 16 6 23 3 23 18 16 21 8 18 1 21"/><line x1="8" y1="3" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="21"/>', 0],
    ['punkte', w('rgsReiterPunkte'),
      '<circle cx="12" cy="10" r="3"/><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/>', 0],
    ['funktionen', w('rgsReiterFunktionen'),
      '<circle cx="12" cy="12" r="1.6"/><circle cx="5" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>', offeneAufgaben],
  ].map(([id, lbl, pfad, zahl]) => `<button type="button" id="rgsRt-${id}"
      class="${rgsReiter === id ? 'an' : ''}" onclick="rgLaufReiter('${id}')">
      <span style="position:relative;display:inline-flex">
        <svg class="i i-sm" viewBox="0 0 24 24">${pfad}</svg>
        ${zahl ? `<span class="zahl">${zahl}</span>` : ''}
      </span>
      <span>${esc(lbl)}</span>
    </button>`).join('');
}

function rgLaufReiter(id) {
  rgsReiter = id;
  rgLaufReiterZeichnen();
  rgLaufZeichnen();
}

function rgLaufZeichnen() {
  if (rgsModus !== 'lauf' || !rundgangAktiv) return;
  // NACH dem Riegel und nicht davor (ENT-317): Die Ortung ist eine
  // Zusatzfunktion; sie darf das Zeichnen der Seite weder verhindern noch
  // verzoegern. Beim Bauen stand sie eine Zeile zu frueh -- ein Fehler in
  // watchPosition riss die ganze Seite mit und der Waechter sah einen
  // leeren Rumpf statt seiner Kontrollpunkte. Von der Regression gefunden.
  rgOrtungNachfuehren();
  rgWachAnfordern();
  // Erst abraeumen, dann setzt nur der echte Kartenpfad die Klasse wieder.
  // Anders herum bliebe sie stehen, wenn die Karte nichts zu zeigen hat und
  // stattdessen ein Warnblock erscheint -- der klebte dann am Bildschirmrand.
  rgVollflaeche(false);
  if (rgsReiter === 'karte') { rgKarteZeichnen(); }
  else if (rgsReiter === 'funktionen') { rgLaufFunktionen(); }
  else {
    // Seit ENT-541 steht hier ein eigener Kopfblock statt der Zahlen-Chips
    // und statt #rdFortschritt: Zustand, Name der Runde, Zeitfenster,
    // Fortschrittsbalken, Zaehler und Restzeit -- an EINER Stelle. Die
    // beiden frueheren Traeger sind damit weg, nicht zusaetzlich da: Zwei
    // Orte fuer denselben Zustand laufen auseinander (schon ENT-306).
    // Die Warnung gehoert AUCH hierher (ENT-320): Der Waechter steht vor
    // dem Kontrollpunkt und tippt auf "Bestaetigen", nicht auf die Karte.
    // Nur unter der Karte zu warnen hiesse, sie dort zu verstecken, wo er
    // gerade nicht hinsieht.
    $('rgsBody').innerHTML =
      rgLaufKopfblockHtml()
      + rgOrtungHinweisHtml()
      + `<div id="rdBanner"></div><div id="rdListe" class="rd-liste"></div>`;
    rundgangListeZeichnen();
  }
  rgLaufKopfZeichnen();
}

// Zaehler und Timer. Der Zaehler nennt erledigte UND gesamte Punkte -- eine
// blosse Zahl liesse offen, wovon (CLAUDE.md: keine Zahl ohne Bezug).
function rgLaufKopfZeichnen() {
  if (rgsModus !== 'lauf' || !rundgangAktiv) return;
  const kps = rundgangAktiv.kontrollpunkte || [];
  const fertig = kps.filter(k => k.erledigt).length;
  /* Derselbe Zaehler, zwei Schreibweisen (ENT-541): Im Chip ueber der Karte
     ist Platz fuer "5 / 8", im Kopfblock des Punkte-Reiters steht der ganze
     Satz "5 von 8 Kontrollpunkten". Beide nennen BEIDE Zahlen -- keine Zahl
     ohne Bezug (CLAUDE.md). Welche Schreibweise gilt, sagt das Element
     selbst, damit es nicht zwei Nachfuehrwege gibt. */
  const z = $('rgsZaehler');
  if (z) {
    z.textContent = z.dataset.satz
      ? `${fertig} ${w('von')} ${kps.length} ${w('rgpPunkteSatz')}`
      : `${fertig} / ${kps.length}`;
  }
  const t = $('rgsTimer');
  if (t) { t.textContent = rgLaufzeit(); }
  // Balken und Restzeit gibt es nur im Kopfblock; auf der Karte fehlen sie.
  const b = $('rgpBalken');
  if (b) { b.style.width = (kps.length ? Math.round((fertig / kps.length) * 100) : 0) + '%'; }
  const kEl = $('rgpKopf'), lEl2 = $('rgpLage');
  if (kEl && lEl2) {
    const l = rgpLage();
    kEl.className = 'rgp-kopf ' + l.kl;
    lEl2.textContent = l.txt;
  }
  const rEl = $('rgpRest');
  if (rEl) {
    const r = rgpRestTxt();
    rEl.textContent = r ? r.txt : '';
    rEl.className = 'rgp-rest' + (r && r.kl ? ' ' + r.kl : '');
    rEl.style.display = r ? '' : 'none';
  }
  // Die Ortungsanzeige auf der Karte altert mit der Zeit ("steht seit 3 min")
  // -- sie muss darum mit demselben Takt nachgefuehrt werden wie die Uhr,
  // sonst bliebe sie auf dem Stand der letzten Positionsmeldung stehen.
  rgOrtChipZeichnen();
  // Dasselbe gilt fuer den Richtungspfeil (ENT-542): Er altert ebenfalls.
  try { rgRichtungMarkeNachfuehren(); } catch (e) {}
}

/* Laufzeit seit Rundgangbeginn, PAUSEN ABGEZOGEN.
   Bewusst nicht die Rohzeit: Die beginnt nach ENT-145 erst mit dem ersten
   bestaetigten Punkt und stuende auf 00:00, waehrend der Waechter noch zum
   ersten Tor laeuft. Der Timer beantwortet "wie lange bin ich dran", nicht
   "was wird verrechnet" -- die Rohzeit bleibt davon unberuehrt und wird
   weiterhin allein serverseitig gefuehrt. */
function rgLaufzeit() {
  const start = rundgangAktiv && (rundgangAktiv.vorbereitet_am || rundgangAktiv.gestartet_am);
  if (!start) return '–';
  const ms = Date.parse(String(start).replace(' ', 'T')) || 0;
  if (!ms) return '–';
  // Eine BEENDETE Runde zaehlt nicht weiter (ENT-321). Vom Projektinhaber
  // im ersten echten Rundgang gefunden: Es stand "Rundgang abgeschlossen"
  // da, und die Uhr lief trotzdem -- nach vier Minuten auf 5:50, nach einer
  // Stunde auf 1:33:17. Der Timer beantwortet "wie lange bin ich dran";
  // wer fertig ist, ist gar nicht mehr dran.
  //
  // Gerechnet wird bis zum ENDE, nicht bis jetzt. Das Ende ist die
  // Serverzeit (rohzeit_ende), solange sie da ist; fehlt sie -- etwa weil
  // der letzte Punkt offline erfasst wurde --, faellt die Uhr auf den
  // letzten erfassten Scan zurueck. Sie einfach stehen zu lassen waere
  // ungenau: Beim naechsten Oeffnen staende sonst eine andere Zahl.
  const bis = rgLaufEndeMs();
  let sek = Math.max(0, Math.floor(((bis || Date.now()) - ms) / 1000));
  sek -= Math.max(0, Number(rundgangAktiv.pause_minuten || 0)) * 60;
  // Laufende Pause mitrechnen: Sonst liefe die Uhr weiter, waehrend die
  // Runde steht -- und zeigte am Ende mehr, als gearbeitet wurde.
  // Auf einer beendeten Runde entfaellt das: Dort ist nichts mehr laufend.
  if (!bis && rundgangAktiv.status === 'pausiert' && rundgangAktiv.pausiert_seit) {
    const pms = Date.parse(String(rundgangAktiv.pausiert_seit).replace(' ', 'T'));
    if (pms) { sek -= Math.max(0, Math.floor((Date.now() - pms) / 1000)); }
  }
  sek = Math.max(0, sek);
  const p = n => String(n).padStart(2, '0');
  return `${p(Math.floor(sek / 3600))}:${p(Math.floor(sek / 60) % 60)}:${p(sek % 60)}`;
}

/* Wann die Runde geendet hat -- oder null, wenn sie noch laeuft (ENT-321).
   Drei Quellen in dieser Reihenfolge, weil sie unterschiedlich verlaesslich
   sind:
     1. rohzeit_ende vom Server -- die Wahrheit, sobald sie da ist
     2. der spaeteste erfasste Scan -- wenn der letzte Punkt offline
        bestaetigt wurde und der Server es noch nicht weiss
     3. null -- die Runde laeuft wirklich noch */
function rgLaufEndeMs() {
  if (!rundgangAktiv) { return null; }
  const kps = rundgangAktiv.kontrollpunkte || [];
  const beendet = rundgangAktiv.status === 'abgeschlossen'
    || rundgangAktiv.status === 'abgebrochen'
    || (kps.length > 0 && kps.every(k => k.erledigt));
  if (!beendet) { return null; }
  const ende = rundgangAktiv.rohzeit_ende || rundgangAktiv.beendet_am;
  if (ende) {
    const t = Date.parse(String(ende).replace(' ', 'T'));
    if (t) { return t; }
  }
  let letzte = 0;
  kps.forEach(k => {
    if (!k.erledigt || !k.erledigt.erfasst_am) { return; }
    const t = Date.parse(String(k.erledigt.erfasst_am).replace(' ', 'T'));
    if (t && t > letzte) { letzte = t; }
  });
  return letzte || null;
}

function rgTimerStarten() {
  rgTimerStoppen();
  rgsTimerLauf = setInterval(() => {
    rgLaufKopfZeichnen();
    // Sobald die Runde zu Ende ist, hoert die Uhr auf zu ticken. Einmal
    // zeichnet sie noch -- damit die Endzeit dasteht -- und dann ist Ruhe.
    // Ohne das liefe ein Zeitgeber im Sekundentakt weiter, auf einer Seite,
    // an der sich nichts mehr aendert.
    if (rgLaufEndeMs() !== null) { rgTimerStoppen(); }
  }, 1000);
}
function rgTimerStoppen() {
  if (rgsTimerLauf) { clearInterval(rgsTimerLauf); rgsTimerLauf = null; }
}

// Funktionen-Reiter der laufenden Runde. Vier Eintraege, alle aus
// rundgangAktiv allein bedienbar -- Ansprechpartner und Notruf brauchen die
// Vorschau-Daten und kommen mit dem zweiten Schritt dazu.
function rgLaufFunktionen() {
  const einsatzId = Number(rundgangAktiv.einsatz_id);
  const pausiert = rundgangAktiv.status === 'pausiert';
  // NICHT nur am Status: Wird der letzte Punkt offline erfasst, ist die Runde
  // faktisch fertig, waehrend der Server sie noch als 'laeuft' fuehrt. Genau
  // dieselbe Bedingung nutzte der frueher hier stehende Fuss (ENT-146) --
  // sonst boete die Seite Pausieren auf einer erledigten Runde an.
  const kpsAlle = rundgangAktiv.kontrollpunkte || [];
  const beendet = rundgangAktiv.status === 'abgeschlossen' || rundgangAktiv.status === 'abgebrochen'
    || (kpsAlle.length > 0 && kpsAlle.every(k => k.erledigt));
  const aufgabenGesamt = (rundgangAktiv.kontrollpunkte || [])
    .reduce((n, k) => n + ((k.aufgaben || []).length), 0);
  const modul = (id, wort, pfad, extra) => `<button type="button" class="rgs-modul" id="${id}" ${extra || ''}>
      <span class="rgs-modul-ic"><svg class="i i-sm" viewBox="0 0 24 24">${pfad}</svg></span>
      <span>${esc(wort)}</span>
    </button>`;
  $('rgsBody').innerHTML = `
    ${rgZahlenChipsHtml(false)}
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="rgs-mod-lb" id="rgsFunktionenLb">${esc(w('rgsFunktionen'))}</div>
      ${modul('rgsLaufEreignis', w('evTitel'),
        '<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
        'onclick="evOeffnen()"')}
      ${aufgabenGesamt ? `<button type="button" class="rgs-modul" id="rgsLaufAufgaben" onclick="rgLaufAufgabenListe()">
        <span class="rgs-modul-ic"><svg class="i i-sm" viewBox="0 0 24 24"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><polyline points="4 6 5 7 7 5"/><polyline points="4 12 5 13 7 11"/><polyline points="4 18 5 19 7 17"/></svg></span>
        <span>${esc(w('afTitel'))}</span>
        <span class="rgs-modul-zahl">${aufgabenGesamt}</span>
      </button>` : ''}
      ${beendet ? '' : modul('rgsLaufPause', pausiert ? w('rgsFortsetzen') : w('rgsPausieren'),
        pausiert ? '<polygon points="6 4 20 12 6 20 6 4"/>'
                 : '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>',
        `onclick="rgLaufPause(${einsatzId})"`)}
      ${(!beendet && rgWachMoeglich()) ? `<button type="button" class="rgs-modul" id="rgsLaufWach"
        onclick="rgWachUm()" aria-pressed="${rgWachAn() ? 'true' : 'false'}">
        <span class="rgs-modul-ic"><svg class="i i-sm" viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg></span>
        <span>${esc(w('rgsWach'))}</span>
        <span class="rgs-modul-zust${rgWachAn() ? ' an' : ''}" id="rgsLaufWachZust">${esc(w(rgWachAn() ? 'rgsWachEin' : 'rgsWachAus'))}</span>
      </button>
      <div class="rgs-modul-txt" id="rgsLaufWachTxt">${esc(w('rgsWachTxt'))}</div>` : ''}
      ${modul('rgsLaufKontakte', w('rgsHilfe'),
        '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.4-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
        'onclick="rgLaufKontakte()"')}
      ${beendet ? '' : modul('rgsLaufAbbrechen', w('rgsAbbrechenModul'),
        '<circle cx="12" cy="12" r="9"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/>',
        `onclick="rundgangAbbrechenAnzeigen(${einsatzId})"`)}
    </div>`;
}

/* ══ Karte der laufenden Runde (ENT-308) ═══════════════════════════════
   Google Maps, wie in ENT-157 fuer das Dashboard entschieden und dort seit
   ENT-269 im Einsatz -- derselbe clientseitige Browserschluessel, dieselbe
   Referrer-Einschraenkung. Kein zweiter Kartenanbieter fuer dieselbe Aufgabe.

   Drei Dinge, die diese Karte anders machen muss als die im Dashboard:
   1. Sie laeuft OHNE NETZ ins Leere. Der Waechter steht im Keller. Statt
      eines grauen Rechtecks sagt sie dann, was los ist -- und weist auf die
      Liste hin, die offline weiterhin vollstaendig da ist.
   2. NFC-Punkte haben keine Koordinaten (ENT-265) und koennen gar nicht
      erscheinen. Die Karte nennt darum ausdruecklich, wie viele sie NICHT
      zeigt: "nicht darstellbar" darf nie wie "nicht vorhanden" aussehen
      (CLAUDE.md).
   3. Die eigene Position wird GEZEIGT, aber nicht aufgezeichnet -- ENT-131
      schliesst die kontinuierliche Positionsverfolgung aus. Kein watchPosition,
      keine Uebermittlung, nur ein einmaliger Abruf auf Knopfdruck. */
// Platzhalter, beim Deploy aus GitHub Secrets ersetzt (ENT-341) -- eigener
// Schluessel je Umgebung, damit die produktive Referrer-Beschraenkung in
// der Google-Cloud-Konsole unangetastet bleibt und Staging-Tests nicht
// dasselbe Kontingent verbrauchen. Vorher stand hier der Schluessel im
// Klartext; das Sichtbarwerden im Quelltext war schon davor normal und
// unvermeidbar (Client-Schluessel), der Schutz laeuft weiterhin ueber die
// Referrer-Einschraenkung, nicht ueber Geheimhaltung.
const RGS_MAPS_SCHLUESSEL = '__MAPS_JS_KEY__';
let rgsMapsVersprechen = null;
let rgsKarte = null, rgsKartenMarken = [], rgsKartenKreise = [], rgsStandortMarke = null;
// Der Richtungspfeil (ENT-542) haengt an derselben Karte wie die
// Standortmarke und wird ueberall zusammen mit ihr vergessen.
let rgsRichtungsMarke = null;
/* An WELCHES Element die Karte gebaut wurde (ENT-543). Daran, und nicht an
   rgsKarte allein, erkennt man, ob die stehende Karte noch die im Dokument
   ist: Nach einem Reiterwechsel wird der Rumpf ersetzt, rgsKarte zeigt dann
   auf eine Karte in einem Knoten, den es nicht mehr gibt. */
let rgsKarteEl = null;
/* Zoom, Ausschnitt und Drehung, die ein Neubau uebernehmen soll -- heute nur
   beim Umschalten der Nachtsicht, die sich nicht ohne Neubau aendern laesst. */
let rgsKarteAnsicht = null;
/* Woran sich erkennen laesst, ob sich an den Kontrollpunkten etwas geaendert
   hat. Ohne diesen Vergleich wuerden bei jeder Positionsmeldung alle Marken
   abgeraeumt und neu gebaut -- sichtbar als Flackern. */
let rgsKartenSignatur = null;
/* Welcher Aufbau der aktuelle ist (ENT-543). Zwischen dem Aufbau des Rumpfs
   und dem fertig geladenen Kartenskript liegt ein Wartepunkt; wird in dieser
   Zeit ein zweiter Aufbau angestossen, kommen BEIDE Rueckrufe an und bauen
   nacheinander in dasselbe Element. Ergebnis: zwei Karten uebereinander,
   jede mit eigenem Schild und eigenen Kontrollpunkt-Marken. Gemessen: fuenf
   Marken, wo drei hingehoeren -- und die App versetzte danach die falsche,
   sodass das Waechter-Schild auf der alten Stelle stehenblieb.
   Nur der juengste Aufbau darf zu Ende gehen. */
let rgsKarteBauLauf = 0;
// Der Schluessel wurde vom Kartenanbieter abgelehnt (ENT-309). Eigener
// Zustand, weil dieser Fall NICHT ueber das Versprechen laeuft: Das Skript
// laedt, google.maps ist da, `new google.maps.Map` gelingt -- und erst
// danach meldet der Anbieter asynchron, dass der Schluessel fuer diese
// Seite nicht gilt. Bis hierher fiel das durch beide Netze und der
// Waechter sah die graue Tafel des Anbieters mit dem Rat, die
// JavaScript-Konsole zu oeffnen. Auf einem Diensthandy nachts ist das
// keine Auskunft.
let rgsMapsAbgelehnt = false;

/* Der Kartenanbieter ruft diese Funktion beim Namen auf, wenn er den
   Schluessel ablehnt -- falscher Schluessel, nicht freigegebene Adresse,
   abgeschaltete Abrechnung. Sie ist die einzige Stelle, an der sich das
   ueberhaupt abfangen laesst; einen Fehlercode uebergibt er dabei nicht,
   der steht nur in der Konsole. Darum sagt der Text, WAS zu tun ist
   (melden, weiterarbeiten), und nicht, was schiefging. */
window.gm_authFailure = function () {
  rgsMapsAbgelehnt = true;
  rgKarteGesperrtZeigen();
};

/* Eine Karte, die STEHT, wird nicht zugedeckt (ENT-312).
   Vom Projektinhaber gemeldet: "Die Karte laedt nun kurz und danach kommt
   deine Meldung, die die Karte wieder ueberdeckt."

   Der Anbieter ruft gm_authFailure auch dann, wenn die Kacheln bereits
   gezeichnet sind. Die erste Fassung (ENT-309) raeumte daraufhin den
   Container leer und legte den Text ueber die ganze Flaeche -- richtig
   gegen ein graues Rechteck, falsch gegen eine benutzbare Karte. Sie nahm
   dem Waechter genau das weg, wofuer die Meldung eigentlich warnt.

   Darum zwei Faelle statt einem:
   - Karte steht  -> schmaler Streifen UNTER der Karte, sie bleibt bedienbar.
   - Karte fehlt  -> weiterhin die ganze Flaeche, sonst bliebe ein graues
                     Rechteck ohne Erklaerung (der Fall aus ENT-309). */
function rgKarteGesperrtZeigen() {
  const karte = $('rgsKarte');
  if (!karte) { return; }

  if (rgsKarte) {
    const huelle = karte.closest('.rgs-karte-huelle');
    if (huelle && !$('rgsKarteWarnung')) {
      const streifen = document.createElement('div');
      streifen.className = 'rgs-karte-hinweis fehler';
      streifen.id = 'rgsKarteWarnung';
      streifen.textContent = w('rgsKarteGesperrtKurz');
      huelle.parentNode.insertBefore(streifen, huelle.nextSibling);
    }
    return;
  }

  karte.innerHTML = '';
  rgsKartenMarken = []; rgsKartenKreise = []; rgsStandortMarke = null;
  rgsRichtungsMarke = null;
  // Die Karte selbst gilt damit ebenfalls als weg (ENT-543) -- sonst hielte
  // der Aktualisierungsweg eine Karte fuer stehend, die es nicht mehr gibt.
  rgsKarte = null; rgsKarteEl = null; rgsKartenSignatur = null;
  let stand = $('rgsKarteStand');
  if (!stand) {
    stand = document.createElement('div');
    stand.className = 'rgs-karte-stand';
    stand.id = 'rgsKarteStand';
    karte.parentNode.appendChild(stand);
  }
  stand.textContent = w('rgsKarteGesperrt');
  stand.classList.add('fehler');
  // Der Zentrieren-Knopf zentriert nichts mehr -- ein Knopf, der nichts tut,
  // ist schlimmer als keiner.
  const btn = $('rgsZentrieren'); if (btn) { btn.remove(); }
}

function rgsMapsLaden() {
  if (rgsMapsVersprechen) { return rgsMapsVersprechen; }
  rgsMapsVersprechen = new Promise((resolve, reject) => {
    if (window.google && window.google.maps) { resolve(); return; }
    const skript = document.createElement('script');
    skript.src = 'https://maps.googleapis.com/maps/api/js?key=' + RGS_MAPS_SCHLUESSEL;
    // NICHT einfach resolve: Ein blockiertes oder leer beantwortetes Skript
    // loest ebenfalls onload aus, ohne google.maps zu definieren -- so
    // gefunden in der Pruefung, die maps.googleapis.com abweist. Ohne diese
    // Weiche bekaeme der Waechter ein graues Rechteck ohne jede Erklaerung,
    // also genau das, was diese Karte vermeiden soll.
    skript.onload = () => {
      if (window.google && window.google.maps) { resolve(); return; }
      rgsMapsVersprechen = null;
      reject(new Error('maps-leer'));
    };
    skript.onerror = () => {
      // Beim naechsten Versuch neu laden duerfen: Ohne das Zuruecksetzen
      // bliebe ein einmaliger Netzaussetzer fuer den Rest der Sitzung
      // haengen -- und der Waechter kaeme aus dem Keller heraus nie mehr an
      // die Karte.
      rgsMapsVersprechen = null;
      reject(new Error('maps'));
    };
    document.head.appendChild(skript);
  });
  return rgsMapsVersprechen;
}

/* Was laesst sich zeichnen, was nicht -- als reine Funktion, damit es sich
   ohne geladene Karte pruefen laesst. */
function rgKarteDaten(kontrollpunkte) {
  const zeigbar = [], ohneOrt = [];
  (kontrollpunkte || []).forEach((k, i) => {
    const lat = Number(k.lat), lng = Number(k.lng);
    if (k.lat === null || k.lat === undefined || k.lng === null || k.lng === undefined
        || !isFinite(lat) || !isFinite(lng)) { ohneOrt.push(k); return; }
    zeigbar.push({ nr: i + 1, id: Number(k.id), bezeichnung: k.bezeichnung, lat, lng,
      radius: Number(k.geofence_radius_m || 0) || 20,
      erledigt: k.erledigt ? k.erledigt.status : null });
  });
  return { zeigbar, ohneOrt };
}

/* Nachtsicht (ENT-331), Vorgabe des Projektinhabers nach dem Vorbild von
   Coredinate. Ein Kartenstil, kein zusätzlicher Dienst: Google Maps nimmt
   die Farben als `styles`-Angabe entgegen, das kostet keinen weiteren
   Aufruf und keine weitere Abrechnung.

   Der Grund ist derselbe, aus dem die ganze Rundgang-Seite dunkel ist
   (siehe Kommentar bei .rgs): Die Runde läuft abends und nachts, und ein
   weisser Vollbildschirm blendet und zerstört die Nachtsicht. Eine helle
   Karte mitten in einer dunklen Seite ist genau dieser Fehler, nur kleiner.

   Deshalb ist Nachtsicht die VORGABE und nicht ein Schalter, den man erst
   finden muss -- abschaltbar bleibt sie trotzdem, für den seltenen Fall
   einer Tagesrunde. Die Wahl überdauert die Sitzung (localStorage). */
const RG_NACHT_SCHLUESSEL = 'sop_rundgang_nachtsicht';
/* Die fruehere Nachtsicht-Stilvorschrift (RG_NACHT_STIL) ist mit ENT-543
   entfallen: Eine Vektorkarte ignoriert Stilvorschriften aus dem Code, sie
   faerbt ueber colorScheme oder ueber einen Stil in der Google-Cloud-
   Konsole. Die frueheren Farbwerte stehen im Entscheidungsprotokoll
   (ENT-543) -- wer spaeter einen Cloud-Stil anlegt, hat sie dort. */

function rgNachtAn() {
  try { return localStorage.getItem(RG_NACHT_SCHLUESSEL) !== 'aus'; }
  catch (e) { return true; }   // kein Speicher: die Vorgabe gilt trotzdem
}

/* Zoom, Mitte und Drehung der stehenden Karte -- oder null. Gekapselt,
   weil getHeading() nur auf einer Vektorkarte existiert und eine aeltere
   API-Fassung sonst hier abbraeche. */
function rgKarteAnsichtLesen() {
  if (!rgsKarte) { return null; }
  try {
    const z = rgsKarte.getZoom(), m = rgsKarte.getCenter();
    if (typeof z !== 'number' || !m) { return null; }
    return { zoom: z, lat: m.lat(), lng: m.lng(),
      heading: typeof rgsKarte.getHeading === 'function' ? (rgsKarte.getHeading() || 0) : 0 };
  } catch (e) { return null; }
}

function rgNachtUm() {
  const neu = rgNachtAn() ? 'aus' : 'an';
  try { localStorage.setItem(RG_NACHT_SCHLUESSEL, neu); } catch (e) {}
  /* Seit ENT-543 ist die Karte eine Vektorkarte, und dort faerbt das
     eingebaute Farbschema statt einer Stilvorschrift. Das Farbschema laesst
     sich nur beim Bauen setzen -- der Schalter baut die Karte also neu.

     Das ist der eine Neubau, der bleibt: Er geschieht auf ausdrueckliches
     Tippen, nicht im Sekundentakt. Und er nimmt Zoom, Ausschnitt und
     Drehung mit, damit der Schalter nicht nebenbei die Ansicht wegwirft. */
  if (rgsKarte) {
    rgsKarteAnsicht = rgKarteAnsichtLesen();
    rgsKarte = null; rgsKarteEl = null; rgsKartenSignatur = null;
    rgsStandortMarke = null; rgsRichtungsMarke = null;
    try { rgKarteZeichnen(); } catch (e) {}
  }
  const btn = $('rgsNachtsicht');
  if (btn) {
    btn.classList.toggle('an', neu === 'an');
    btn.setAttribute('aria-pressed', neu === 'an' ? 'true' : 'false');
  }
}

/* ══ Bildschirm wach halten (ENT-355) ═════════════════════════════════
   Vorgabe des Projektinhabers nach dem Vorbild von Coredinate.

   Der Grund ist kein Komfort, sondern Datenqualitaet: Sperrt sich der
   Bildschirm, haelt der Browser watchPosition an. Die Runde bekommt dann
   eine Luecke, ohne dass irgendwo ein Fehler auftaucht -- genau der Fall,
   den die Ortungsmarke jetzt als "Ortung steht seit x min" meldet. Dieser
   Schalter ist die Gegenmassnahme dazu.

   AUS als Vorgabe, ausdruecklich so entschieden: Eine Runde lief im
   Echtbetrieb ueber neun Stunden. Ein Bildschirm, der neun Stunden an
   bleibt, leert den Akku, und ein leeres Geraet ortet gar nicht mehr --
   die Vorgabe "an" wuerde das Problem also nicht loesen, sondern nur
   verschieben. Wer eine kurze Runde mit lueckenloser Spur braucht, schaltet
   ein; die Wahl bleibt auf dem Geraet (localStorage).

   Die Sperre geht beim Wegschalten der Seite von sich aus verloren -- so
   ist die Schnittstelle gebaut. Darum wird sie beim Zurueckkommen neu
   angefordert, sonst waere sie nach dem ersten Blick auf eine andere App
   still weg, waehrend der Schalter weiter "Ein" zeigt. */
const RG_WACH_SCHLUESSEL = 'sop_rundgang_wachhalten';
let rgsWachSperre = null;

function rgWachMoeglich() {
  try { return !!(navigator.wakeLock && navigator.wakeLock.request); }
  catch (e) { return false; }
}

function rgWachAn() {
  try { return localStorage.getItem(RG_WACH_SCHLUESSEL) === 'an'; }
  catch (e) { return false; }   // kein Speicher: die Vorgabe (aus) gilt
}

async function rgWachAnfordern() {
  if (!rgWachMoeglich() || !rgWachAn() || rgsWachSperre) { return; }
  // Nur waehrend einer laufenden Runde. Ein Schalter, der den Bildschirm
  // auch auf der Uebersicht wachhaelt, waere ein Akkufresser ohne Zweck.
  if (rgsModus !== 'lauf' || !rundgangAktiv) { return; }
  try {
    rgsWachSperre = await navigator.wakeLock.request('screen');
    rgsWachSperre.addEventListener('release', () => { rgsWachSperre = null; });
  } catch (e) { rgsWachSperre = null; }   // z.B. wenig Akku: das Geraet darf nein sagen
}

function rgWachFreigeben() {
  if (!rgsWachSperre) { return; }
  try { rgsWachSperre.release(); } catch (e) {}
  rgsWachSperre = null;
}

function rgWachUm() {
  const neu = rgWachAn() ? 'aus' : 'an';
  try { localStorage.setItem(RG_WACH_SCHLUESSEL, neu); } catch (e) {}
  if (neu === 'an') { rgWachAnfordern(); } else { rgWachFreigeben(); }
  if (rgsReiter === 'funktionen') { rgLaufFunktionen(); }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { rgWachAnfordern(); }
});

function rgKarteZeichnen() {
  const d = rgKarteDaten(rundgangAktiv ? rundgangAktiv.kontrollpunkte : []);
  const hinweis = d.ohneOrt.length
    ? `<div class="rgs-karte-hinweis" id="rgsKarteOhneOrt">${d.ohneOrt.length} ${esc(d.ohneOrt.length === 1 ? w('rgsReiterPunkte').slice(0, -1) : w('rgsReiterPunkte'))} ${esc(w('rgsKarteOhneOrt'))}</div>`
    : '';
  if (!d.zeigbar.length) {
    $('rgsBody').innerHTML = `<div class="rgs-warn" id="rgsKarteLeer">
      <svg class="i i-sm" style="flex:none" viewBox="0 0 24 24"><polygon points="1 6 8 3 16 6 23 3 23 18 16 21 8 18 1 21"/><line x1="8" y1="3" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="21"/></svg>
      <span>${esc(w('rgsKarteLeer'))}</span></div>${hinweis}`;
    return;
  }
  // Wer geortet wird, muss es sehen koennen (ENT-317). Nicht Kosmetik: Eine
  // Ortung, von der der Betroffene nichts weiss, ist etwas anderes als eine,
  // die offen angezeigt wird -- rechtlich wie menschlich. Steht dort,
  // solange die Verfolgung laeuft, und verschwindet mit ihr.
  const ortungHinweis = rgOrtungHinweisHtml(true);
  rgVollflaeche(true);
  /* Steht die Karte schon, wird sie NICHT neu gebaut (ENT-543).

     Vom Projektinhaber gemeldet, dass sich die Karte nicht drehen laesst --
     beim Nachmessen kam heraus, dass eine Drehung ohnehin nichts genuetzt
     haette: Diese Stelle hat bis hierher bei JEDEM Aufruf den ganzen Rumpf
     ersetzt und eine neue Karte gebaut. Gemessen: Zoomstufe 19 und ein
     selbst gewaehlter Ausschnitt waren nach einer einzigen neuen Position
     wieder auf Stufe 16 und auf der Uebersicht.

     Ausgeloest wurde das nicht von der Position selbst, sondern vom Wechsel
     des Ortungszustands: Ein kurzer Aussetzer setzt rgsOrtFehler, die
     naechste Position raeumt ihn weg, und BEIDE zeichnen neu. Draussen
     zwischen Haeusern passiert das dauernd.

     Der Aufruf ist trotzdem berechtigt -- der Hinweis unter der Karte muss
     sich ja aendern. Falsch war nur, dafuer alles wegzuwerfen. */
  if (rgsKarte && rgsKarteEl && rgsKarteEl === $('rgsKarte')) {
    rgKarteAktualisieren(d, ortungHinweis, hinweis);
    return;
  }
  $('rgsBody').innerHTML = `
    <div class="rgs-karte-huelle">
      <div class="rgs-karte" id="rgsKarte"></div>
      <div class="rgs-karte-stand" id="rgsKarteStand">${esc(w('rgsKarteLaedt'))}</div>
      ${rgZahlenChipsHtml(true)}${rgOrtChipHtml()}
      <button type="button" class="rgs-karte-btn" id="rgsZentrieren" onclick="rgKarteZentrieren()">
        <svg class="i i-sm" viewBox="0 0 24 24"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
        <span>${esc(w('rgsZentrieren'))}</span>
      </button>
      <button type="button" class="rgs-karte-btn2${rgNachtAn() ? ' an' : ''}" id="rgsNachtsicht"
          onclick="rgNachtUm()" aria-pressed="${rgNachtAn() ? 'true' : 'false'}">
        <svg class="i i-sm" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span>${esc(w('rgsNachtsicht'))}</span>
      </button>
    </div>${ortungHinweis}${hinweis}`;

  // Frueher wurde hier abgebrochen, sobald der Schluessel einmal abgelehnt
  // war. Das war falsch (ENT-312): Wird die Freigabe beim Anbieter in
  // Ordnung gebracht -- was bis zu fuenf Minuten dauert --, bekaeme der
  // Waechter fuer den Rest der Sitzung trotzdem keine Karte mehr, obwohl
  // sie laengst wieder ginge. Es wird jetzt jedes Mal gebaut; scheitert es
  // erneut, meldet sich der Anbieter von selbst wieder.

  const bauLauf = ++rgsKarteBauLauf;
  rgsMapsLaden().then(() => {
    // Ein neuerer Aufbau hat inzwischen uebernommen -- dieser hier ist
    // ueberholt und darf nichts mehr in die Karte schreiben.
    if (bauLauf !== rgsKarteBauLauf) { return; }
    // Der Reiter kann waehrend des Ladens gewechselt worden sein.
    if (!$('rgsKarte')) { return; }
    // Die alte Standortmarke haengt an der eben ersetzten Karte und ist
    // damit weg -- sie muss vergessen werden, sonst haelt die App eine
    // Marke fuer gesetzt, die in keinem Dokument mehr steht, und der eigene
    // Standort bliebe nach jedem Reiterwechsel unsichtbar (ENT-331; vorher
    // verdeckt davon, dass der Zentrieren-Knopf jedes Mal eine neue baute).
    rgsStandortMarke = null;
    rgsRichtungsMarke = null;   // haengt an derselben, eben ersetzten Karte
    rgsKarteEl = $('rgsKarte');
    rgsKarte = new google.maps.Map(rgsKarteEl, {
      center: { lat: d.zeigbar[0].lat, lng: d.zeigbar[0].lng }, zoom: 17,
      streetViewControl: false, mapTypeControl: false, fullscreenControl: false,
      /* Vektorkarte statt Rasterkarte (ENT-543), Wunsch des Projektinhabers:
         „Die Karte kann man zwar zoomen, jedoch nicht rotieren."

         Drehen kann Google Maps NUR auf einer Vektorkarte -- auf einer
         Rasterkarte gibt es ueberhaupt keinen Kartenwinkel. Der
         renderingType laesst sich direkt setzen; eine Kennung aus der
         Google-Cloud-Konsole braucht es dafuer nicht.

         Neigen bleibt AUS. Gefragt war Drehen, und eine gekippte Karte
         macht Beschriftungen und Kontrollpunkt-Kreise schlechter lesbar --
         auf einer Nachtrunde genau das Falsche. */
      renderingType: 'VECTOR',
      headingInteractionEnabled: true,
      tiltInteractionEnabled: false,
      /* Die Nachtsicht war bis hierher eine Stilvorschrift im Code
         (RG_NACHT_STIL). Auf einer Vektorkarte wird die IGNORIERT -- der
         Schalter waere ab sofort wirkungslos gewesen, ohne dass etwas
         kaputtgeht. Statt dessen das eingebaute Farbschema. Es laesst sich
         nur beim Bauen setzen; darum baut rgNachtUm() die Karte neu. */
      colorScheme: rgNachtAn() ? 'DARK' : 'LIGHT',
    });
    /* Dreht der Waechter die Karte, zeigt der Richtungspfeil noch in die
       alte Richtung: Marken drehen sich NICHT mit der Karte mit, ihre
       Drehung gilt gegenueber dem Bildschirm. Der Pfeil muss darum
       gegenhalten -- siehe rgRichtungAufKarte(). */
    try { rgsKarte.addListener('heading_changed', () => rgRichtungMarkeNachfuehren()); } catch (e) {}
    rgsKartenSignatur = rgKartenSignatur(d.zeigbar);
    rgKartePunkteZeichnen(d.zeigbar);
    rgStandortZeichnen();   // eine bereits bekannte Position sofort wieder zeigen
    /* Beim Neubau nach einem Nachtsicht-Wechsel bleibt die Ansicht stehen.
       Sonst spraenge die Karte bei jedem Tippen auf den Schalter auf die
       Uebersicht zurueck -- dieselbe Sorte Aerger, gegen die dieser Umbau
       ueberhaupt entstanden ist. */
    if (rgsKarteAnsicht) {
      const a = rgsKarteAnsicht; rgsKarteAnsicht = null;
      try {
        rgsKarte.setCenter({ lat: a.lat, lng: a.lng });
        rgsKarte.setZoom(a.zoom);
        if (a.heading && typeof rgsKarte.setHeading === 'function') { rgsKarte.setHeading(a.heading); }
      } catch (e) { rgKarteZentrieren(); }
    } else {
      rgKarteZentrieren();
    }
    // Den Hinweis erst entfernen, wenn die Karte wirklich steht. Wird er
    // vorher weggeraeumt und das Bauen scheitert, bleibt eine graue Flaeche
    // ohne Erklaerung zurueck.
    const stand = $('rgsKarteStand'); if (stand) { stand.remove(); }
  }).catch(() => {
    const stand = $('rgsKarteStand');
    if (stand) { stand.textContent = w('rgsKarteFehler'); stand.classList.add('fehler'); }
  });
}

/* Was sich ohne Neubau aendern kann (ENT-543).

   Genau die vier Dinge, die an der Karte haengen und nicht die Karte selbst
   sind. Alles andere -- Zoom, Ausschnitt, Drehung, geladene Kacheln --
   bleibt unberuehrt, und genau darum geht es. */
function rgKarteAktualisieren(d, ortungHinweis, hinweis) {
  // 1. Der Hinweis UNTER der Karte (Ortungszustand) und der Vermerk ueber
  //    Punkte ohne Koordinaten. Beide stehen als Geschwister nach der
  //    Huelle -- sie werden zusammen ersetzt, mit demselben HTML wie beim
  //    Aufbau. Zwei Wege, die dasselbe erzeugen, laufen sonst auseinander.
  const huelle = $('rgsBody') ? $('rgsBody').querySelector('.rgs-karte-huelle') : null;
  if (huelle) {
    while (huelle.nextSibling) { huelle.nextSibling.remove(); }
    huelle.insertAdjacentHTML('afterend', ortungHinweis + hinweis);
  }
  // 2. Die Ortungsmarke AUF der Karte. Sie kann neu dazukommen oder
  //    wegfallen -- sie sitzt vor dem Zentrieren-Knopf.
  const chipAlt = $('rgsOrtChip');
  const chipNeu = rgOrtChipHtml();
  if (chipAlt && !chipNeu) { chipAlt.remove(); }
  else if (!chipAlt && chipNeu && $('rgsZentrieren')) {
    $('rgsZentrieren').insertAdjacentHTML('beforebegin', chipNeu);
  }
  rgOrtChipZeichnen();
  // 3. Die Kontrollpunkt-Marken, aber nur wenn sich an ihnen etwas geaendert
  //    hat. Sonst flackerten sie bei jeder Positionsmeldung.
  const sig = rgKartenSignatur(d.zeigbar);
  if (sig !== rgsKartenSignatur) {
    rgsKartenSignatur = sig;
    rgKartePunkteZeichnen(d.zeigbar);
  }
  // 4. Der eigene Standort samt Richtungspfeil.
  rgStandortZeichnen();
}

/* Woran sich eine Aenderung an den Kontrollpunkten erkennen laesst: Nummer,
   Ort, Radius und Zustand. Bewusst nicht die Bezeichnung -- die steht nur im
   Titel der Marke und aendert sich waehrend einer Runde nicht. */
function rgKartenSignatur(punkte) {
  return (punkte || []).map(p =>
    `${p.nr}:${p.lat}:${p.lng}:${p.radius}:${p.erledigt || ''}`).join('|');
}

// Farbe UND Form: erledigt ist gefuellt-gruen mit Haken, offen ist blau mit
// Nummer, "nicht verfuegbar"/Ersatzscan tragen ein Ausrufezeichen. Wer die
// Farben nicht unterscheidet, liest die Zeichen.
function rgKartePunkteZeichnen(punkte) {
  rgsKartenMarken.forEach(m => m.setMap(null));
  rgsKartenKreise.forEach(k => k.setMap(null));
  rgsKartenMarken = []; rgsKartenKreise = [];
  punkte.forEach(p => {
    const fertig = p.erledigt === 'bestaetigt';
    const abweichend = p.erledigt && p.erledigt !== 'bestaetigt';
    const farbe = fertig ? '#4FCE96' : abweichend ? '#E2B156' : '#7098F7';
    const zeichen = fertig ? '✓' : abweichend ? '!' : String(p.nr);
    rgsKartenKreise.push(new google.maps.Circle({
      map: rgsKarte, center: { lat: p.lat, lng: p.lng }, radius: p.radius,
      strokeColor: farbe, strokeOpacity: 0.7, strokeWeight: 1,
      fillColor: farbe, fillOpacity: 0.12,
    }));
    const marke = new google.maps.Marker({
      map: rgsKarte, position: { lat: p.lat, lng: p.lng }, title: p.bezeichnung,
      label: { text: zeichen, color: '#0F1117', fontWeight: '700', fontSize: '12px' },
      icon: {
        path: google.maps.SymbolPath.CIRCLE, scale: 13,
        fillColor: farbe, fillOpacity: 1, strokeColor: '#0F1117', strokeWeight: 2,
      },
    });
    // Ein Tipp auf die Marke fuehrt in die Liste -- gemeldet wird dort, nicht
    // auf der Karte: Die Bestaetigung haengt an Standortpruefung, Ersatzscan
    // und Aufgaben-Rueckfrage, und die alle in eine Kartenblase zu holen
    // hiesse, denselben Ablauf ein zweites Mal zu bauen.
    marke.addListener('click', () => rgLaufReiter('punkte'));
    rgsKartenMarken.push(marke);
  });
}

/* ══ Laufende Ortung waehrend der Runde (ENT-317) ═════════════════════
   Revidiert ENT-131 teilweise. Vom Projektinhaber entschieden und
   begruendet: "das System, so wie wir es bauen, braucht die kontinuierliche
   Ortung, damit es sauber klappt ... ansonsten koennen solche kleine Radien
   und auf kurzer Distanz nicht umgesetzt werden."

   ENT-131 verwarf die laufende Ortung 2026-08-25 mit "hoeheres rechtliches
   Risiko, KEIN bisher benannter Bedarf". Der Bedarf ist jetzt benannt: Ein
   Radius von 20-25 m laesst sich ohne laufende Anzeige nicht bedienen -- der
   Waechter erfuehre erst beim Antippen, dass er zu weit weg ist.

   Zwei Dinge sind bewusst GETRENNT gebaut:
   - Die Ortung im Geraet (hier). Sie macht die Bedienung erst moeglich und
     verlaesst das Geraet nicht.
   - Die Uebermittlung der Spur (Schritt 2). Sie ist der rechtlich heikle
     Teil und laesst sich abschalten, ohne dass die Bedienbarkeit leidet.

   Die Verfolgung laeuft NUR, solange eine Runde laeuft -- nicht pausiert,
   nicht beendet, nicht im Hintergrund. Das hat der Projektinhaber
   ausdruecklich so verlangt. */
let rgsOrtWache = null;       // Kennung von watchPosition
let rgsMeinOrt = null;        // { lat, lng, genauigkeit, zeit, richtung, richtungZeit } -- nur im Speicher
/* Warum KEIN Standort da ist (ENT-320). Drei Zustaende, die sich
   unterscheiden muessen:
     null            -- noch keine Antwort, es laeuft
     'verweigert'    -- gesperrt; kommt nie, ohne dass jemand etwas aendert
     'nicht_da'      -- Sensor findet nichts (Keller, Tiefgarage); kann
                        von selbst wiederkommen
   Bis hierher wurde der Fehler-Rueckruf mit () => {} verschluckt. Die Folge
   war die schlimmste Art Fehler: Es stand "Standort wird verfolgt" da,
   waehrend gar nichts verfolgt wurde -- keine Entfernungen, keine
   gesperrten Knoepfe, keine Signale, keine Spur. Vom Projektinhaber im
   Betrieb gefunden, mit Safari auf "Nie". */
let rgsOrtFehler = null;

// Haversine, dieselbe Rechnung wie geo_distanz_meter() in backend/rundgang.php.
// Bewusst nachgebaut statt den Server zu fragen: Die Pruefung muss OHNE Netz
// funktionieren, sonst ist sie genau dann weg, wenn sie gebraucht wird.
function rgDistanzMeter(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const rad = g => g * Math.PI / 180;
  const dLat = rad(lat2 - lat1), dLng = rad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2
    + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}

/* ══ Bewegungsrichtung (ENT-542) ═══════════════════════════════════════
   Wunsch des Projektinhabers: "ein ganz kleiner Pfeil beim Wachmann
   Symbol, in welche Richtung man sich gerade bewegt".

   Gemeint ist die Richtung der BEWEGUNG, nicht die Blickrichtung. Das ist
   ein Unterschied: Wer stehen bleibt und sich umdreht, bewegt sich nicht --
   dafuer braeuchte es den Kompass des Geraets, und der verlangt auf dem
   iPhone eine eigene Erlaubnis. Hier wird nur ausgewertet, was die Ortung
   ohnehin schon liefert; es kommt keine zweite Abfrage dazu.

   Zwei Quellen, in dieser Reihenfolge:
   1. coords.heading des Geraets. Es rechnet aus mehr als zwei Messungen und
      glaettet; nach Norm ist der Wert NaN im Stillstand und null, wenn das
      Geraet ihn gar nicht liefern kann -- beides faellt hier durch.
   2. Die Peilung zwischen voriger und neuer Position. Aber erst ab einer
      Mindeststrecke: Zwei Messungen am selben Ort unterscheiden sich um ein
      paar Meter Rauschen, und eine Peilung daraus zeigt irgendwohin. Ein
      Pfeil, der im Stand kreiselt, behauptet eine Bewegung, die es nicht
      gibt -- und das ist schlimmer als kein Pfeil.

   Ist beides nichts, bleibt die zuletzt bekannte Richtung stehen, solange
   sie frisch ist, und danach gibt es KEINEN Pfeil. "Unbekannt" darf nie wie
   "bekannt" aussehen (CLAUDE.md) -- ein alter Pfeil ist genau das: eine
   Richtung, die aussieht wie die aktuelle. */
const RG_RICHTUNG_MIN_M = 12;       // darunter ist es Rauschen, keine Bewegung
const RG_RICHTUNG_ALT_MS = 30000;   // aelter: die Richtung gilt nicht mehr

/* Peilung von a nach b in Grad, 0 = Norden, im Uhrzeigersinn. Dieselbe
   Kugelrechnung wie rgDistanzMeter() -- auf 20 m Strecke waere eine ebene
   Naeherung zwar auch genau genug, aber zwei verschiedene Erdmodelle in
   derselben Datei sind eine Gelegenheit, sich zu vertun. */
function rgPeilung(vonLat, vonLng, nachLat, nachLng) {
  const rad = Math.PI / 180;
  const b1 = vonLat * rad, b2 = nachLat * rad, dl = (nachLng - vonLng) * rad;
  const y = Math.sin(dl) * Math.cos(b2);
  const x = Math.cos(b1) * Math.sin(b2) - Math.sin(b1) * Math.cos(b2) * Math.cos(dl);
  return (Math.atan2(y, x) / rad + 360) % 360;
}

function rgRichtungBestimmen(vorher, neu, geraeteKurs) {
  if (!neu) { return; }
  if (Number.isFinite(geraeteKurs)) {
    neu.richtung = ((geraeteKurs % 360) + 360) % 360;
    neu.richtungZeit = neu.zeit;
    return;
  }
  if (vorher && rgDistanzMeter(vorher.lat, vorher.lng, neu.lat, neu.lng) >= RG_RICHTUNG_MIN_M) {
    neu.richtung = rgPeilung(vorher.lat, vorher.lng, neu.lat, neu.lng);
    neu.richtungZeit = neu.zeit;
    return;
  }
  neu.richtung = vorher ? (vorher.richtung != null ? vorher.richtung : null) : null;
  neu.richtungZeit = vorher ? (vorher.richtungZeit || 0) : 0;
}

/* Die Richtung, die JETZT gilt -- oder null.

   Das Altern wird hier geprueft und nicht beim Eintreffen einer Position:
   watchPosition meldet nur bei BEWEGUNG. Wer stehen bleibt, bekommt keine
   neue Meldung mehr, und eine Pruefung, die nur dort stuende, liefe nie
   wieder. Der Pfeil bliebe stehen, bis sich jemand wieder bewegt. */
function rgRichtungJetzt() {
  if (!rgsMeinOrt || rgsMeinOrt.richtung == null) { return null; }
  if (Date.now() - (rgsMeinOrt.richtungZeit || 0) > RG_RICHTUNG_ALT_MS) { return null; }
  return rgsMeinOrt.richtung;
}

// Entfernung zu einem Kontrollpunkt, oder null wenn etwas fehlt.
// null heisst "unbekannt" und darf nie wie "zu weit" behandelt werden.
function rdEntfernungZu(k) {
  if (!rgsMeinOrt || !k || k.lat === null || k.lat === undefined
      || k.lng === null || k.lng === undefined) { return null; }
  const lat = Number(k.lat), lng = Number(k.lng);
  if (!isFinite(lat) || !isFinite(lng)) { return null; }
  return rgDistanzMeter(rgsMeinOrt.lat, rgsMeinOrt.lng, lat, lng);
}

function rdRadiusVon(k) { return Number(k && k.geofence_radius_m) || 20; }

function rgOrtungStarten() {
  if (rgsOrtWache !== null || !navigator.geolocation) { return; }
  // Alles gekapselt: Ein Geraet ohne Standortdienst, eine verweigerte
  // Berechtigung oder ein Browser, der watchPosition anders behandelt, darf
  // niemals die Runde lahmlegen. Die Runde geht auch ohne Ortung weiter --
  // der Server prueft den Radius ohnehin.
  try {
  rgsOrtWache = navigator.geolocation.watchPosition(pos => {
    // VOR der Zuweisung merken -- danach ist rgsMeinOrt immer gesetzt und
    // die Frage waere sinnlos. Beim ersten Anlauf stand die Zeile darunter
    // und war damit wirkungslos; von der Pruefung gefunden.
    const ersterOrt = !rgsMeinOrt;
    const vorher = rgsMeinOrt;
    rgsMeinOrt = { lat: pos.coords.latitude, lng: pos.coords.longitude,
      genauigkeit: pos.coords.accuracy, zeit: Date.now() };
    // Bewegungsrichtung (ENT-542) -- braucht die VORIGE Position, darum
    // hier und nicht spaeter.
    rgRichtungBestimmen(vorher, rgsMeinOrt, pos.coords.heading);
    // Kommt der Standort zurueck, verschwindet die Warnung von selbst --
    // wer aus dem Keller herauskommt, soll sie nicht wegklicken muessen.
    // Und beim ERSTEN Standort ebenfalls neu zeichnen, sonst bleibt
    // "Standort wird gesucht ..." stehen, obwohl er laengst da ist: Der
    // Rueckruf unten zeichnet nur die LISTE neu, nicht den Hinweis darueber.
    if (rgsOrtFehler !== null || ersterOrt) {
      rgsOrtFehler = null;
      try { rgLaufZeichnen(); } catch (e) {}
    }
    try { rgStandortZeichnen(); } catch (e) {}
    try { rgSpurAufnehmen(rgsMeinOrt); } catch (e) {}
    try { rgBereichPruefen(); } catch (e) {}
    // Die Liste zeigt Entfernungen -- sie muss mitwandern. Nur wenn sie
    // gerade sichtbar ist: sonst wuerde ein offenes Formular (Ersatzscan,
    // "nicht verfuegbar") beim naechsten Positionswechsel weggeworfen.
    if (rgsReiter === 'punkte' && abPunktId === null) { rundgangListeZeichnen(); }
  }, fehler => {
    // Ausgewertet statt verschluckt (ENT-320).
    // 1 = PERMISSION_DENIED, 2 = POSITION_UNAVAILABLE, 3 = TIMEOUT.
    // Ein Zeitablauf ist KEIN Fehlschlag: watchPosition versucht es weiter,
    // und wer gerade im Treppenhaus steht, bekommt gleich wieder Empfang.
    // Ihn als Fehler zu zeigen hiesse, im Minutentakt zu warnen.
    if (fehler && fehler.code === 3) { return; }
    rgsOrtFehler = (fehler && fehler.code === 1) ? 'verweigert' : 'nicht_da';
    try { rgLaufZeichnen(); } catch (e) {}
  }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 5000 });
  } catch (e) { rgsOrtWache = null; }
}

/* ══ Signal beim Erreichen eines Kontrollpunkts (ENT-319) ═════════════
   Vom Projektinhaber verlangt: "wenn der MA in den Radius vom
   Kontrollpunkt gelangt und dieser greift, braucht es akustisch ein
   deutliches Signal. Ebenso ein haptisches Feedback mit einer starken
   Vibration. Damit der MA eine gute Rueckmeldung hat."

   WAS AUF WELCHEM GERAET GEHT -- unbedingt so gebaut, dass das Fehlende
   nicht still fehlt:
   - Ton: funktioniert, sobald einmal getippt wurde (der Tonkanal ist auf
     iOS bis dahin gesperrt). Er wird beim Oeffnen der Runde entsperrt.
   - Vibration: navigator.vibrate gibt es in iOS Safari NICHT -- Apple
     unterstuetzt die Schnittstelle nicht. Auf Android schon. Darum kommt
     zusaetzlich immer eine deutliche SICHTBARE Rueckmeldung; sie ist der
     einzige Kanal, der auf jedem Geraet ankommt.

   Der Ton wird gerechnet statt als Datei ausgeliefert: kein zusaetzlicher
   Download, kein Ladefehler unterwegs, und die Lautstaerke laesst sich
   nicht versehentlich von einer Datei abhaengig machen. */
let rgsTonKanal = null;

// Der Tonkanal muss aus einer NUTZERAKTION heraus entstehen, sonst bleibt
// er auf iOS stumm -- und zwar dauerhaft, nicht nur beim ersten Mal.
function rgTonEntsperren() {
  try {
    if (!rgsTonKanal) {
      const K = window.AudioContext || window.webkitAudioContext;
      if (!K) { return; }
      rgsTonKanal = new K();
    }
    if (rgsTonKanal.state === 'suspended') { rgsTonKanal.resume(); }
  } catch (e) { rgsTonKanal = null; }
}

/* Zwei kurze, hohe Toene -- durchdringender als ein langer tiefer, und
   unverwechselbar gegenueber einer Mitteilung des Telefons. */
function rgTonSignal() {
  if (!rgsTonKanal || rgsTonKanal.state !== 'running') { return false; }
  try {
    const jetzt = rgsTonKanal.currentTime;
    [[880, 0], [1320, 0.16]].forEach(([hz, ab]) => {
      const o = rgsTonKanal.createOscillator();
      const g = rgsTonKanal.createGain();
      o.type = 'square';        // traegt weiter als ein Sinus
      o.frequency.value = hz;
      // Kurz ein- und ausblenden: Ein hart geschalteter Rechteckton knackt.
      g.gain.setValueAtTime(0.0001, jetzt + ab);
      g.gain.exponentialRampToValueAtTime(0.5, jetzt + ab + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, jetzt + ab + 0.14);
      o.connect(g); g.connect(rgsTonKanal.destination);
      o.start(jetzt + ab); o.stop(jetzt + ab + 0.15);
    });
    return true;
  } catch (e) { return false; }
}

// Gibt zurueck, ob wirklich vibriert wurde -- auf iOS ist das immer false,
// und die Oberflaeche soll sich nicht darauf verlassen.
function rgVibrieren() {
  try {
    if (!navigator.vibrate) { return false; }
    // Kraeftiges Muster statt eines kurzen Zuckens: lang - Pause - lang.
    return navigator.vibrate([300, 120, 300]) === true;
  } catch (e) { return false; }
}

/* Die sichtbare Rueckmeldung. Sie ist NICHT die Zugabe, sondern der
   verlaesslichste der drei Kanaele: Ton kann stummgeschaltet sein, die
   Vibration gibt es auf dem iPhone gar nicht -- was man sieht, kommt
   immer an. */
function rgSichtSignal(text) {
  let el = $('rgSignal');
  if (!el) {
    el = document.createElement('div');
    el.id = 'rgSignal';
    el.className = 'rg-signal';
    document.body.appendChild(el);
  }
  el.textContent = text;
  el.classList.remove('an');
  void el.offsetWidth;          // erzwingt den Neustart der Bewegung
  el.classList.add('an');
  clearTimeout(el._weg);
  el._weg = setTimeout(() => { el.classList.remove('an'); }, 2600);
}

/* Was unter der Karte steht (ENT-320) -- und es ist NICHT immer dasselbe.

   Bis hierher stand dort ausnahmslos "Standort wird waehrend der Runde
   verfolgt", sobald watchPosition registriert war. Ob je eine Position
   ankam, spielte keine Rolle. Bei gesperrtem Standortzugriff behauptete
   die App damit genau das Gegenteil dessen, was passierte.

   Jetzt vier Zustaende mit vier verschiedenen Aussagen -- und der
   wichtigste davon ist eine Handlungsanweisung, keine Fehlermeldung: Wer
   nachts vor einem Kontrollpunkt steht, den er nicht bestaetigen kann,
   braucht den WEG zur Einstellung, nicht die Diagnose. */
/* Zaehler und Laufzeit (ENT-361, revidiert ENT-355).

   ENT-355 stellte beide Zahlen gross heraus -- in einer eigenen Zeile UNTER
   dem Kopf, mit Beschriftung darueber. Das war zu viel des Guten: Kopf und
   Zahlenzeile zusammen frassen rund 146 px, und die Karte, die das zentrale
   Element dieser Seite ist, bekam den Rest. Der Projektinhaber, woertlich:
   „Hier hast du leider viiiel zu viel Platz verschenkt! Die Karte ist das
   zentrale Element."

   Jetzt liegen beide Werte ALS UEBERLAGERUNG auf der Karte. Das ist der
   springende Punkt: Eine Ueberlagerung kostet keine Layouthoehe -- die Karte
   reicht darunter durch. So sind beide Zahlen weiterhin ohne Scrollen
   sichtbar, und die Karte hat trotzdem die volle Hoehe.

   Auf den Reitern "Kontrollpunkte" und "Funktionen" gibt es keine Karte, auf
   die etwas gelegt werden koennte -- dort stehen dieselben Chips als schmale
   Zeile oben im Rumpf. Gleiches Aussehen, andere Verankerung.

   Kleiner als in ENT-355 (16 px statt 25 px) und ohne die Beschriftung
   darueber: Ein Symbol sagt hier dasselbe wie ein Wort und braucht eine
   Zeile weniger. Die Regel „keine Zahl ohne Bezug" ist damit erfuellt --
   nicht durch Weglassen des Bezugs, sondern durch ein anderes Zeichen
   dafuer. */
let rgsZahlenAn = false;

function rgZahlenAn(ja) {
  rgsZahlenAn = !!ja;
  const seite = $('rgSeite');
  if (seite) { seite.classList.toggle('zahlen', rgsZahlenAn); }
}

/* Vollflaechen-Modus: Rumpf ohne Rand, Seite ohne Abstand (ENT-361). */
function rgVollflaeche(ja) {
  const seite = $('rgSeite'); if (seite) { seite.classList.toggle('voll', !!ja); }
  const bd = $('rgsBody'); if (bd) { bd.classList.toggle('voll', !!ja); }
}

function rgZahlenChipsHtml(aufKarte) {
  if (!rgsZahlenAn) { return ''; }
  return `<div class="rgs-zchips${aufKarte ? ' auf-karte' : ''}" id="rgsZchips">
    <span class="rgs-zchip" id="rgsZaehlerChip" title="${esc(w('rgsZaehlerLb'))}">
      <svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="10" r="3"/><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/></svg>
      <span class="rgs-zchip-wert" id="rgsZaehler">–</span>
      <span class="vh" id="rgsZaehlerLb">${esc(w('rgsZaehlerLb'))}</span>
    </span>
    <span class="rgs-zchip" id="rgsTimerChip" title="${esc(w('rgsTimerLb'))}">
      <svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
      <span class="rgs-zchip-wert" id="rgsTimer">–</span>
      <span class="vh" id="rgsTimerLb">${esc(w('rgsTimerLb'))}</span>
    </span>
  </div>`;
}

/* Wie es um die Runde steht -- eine Stelle, zwei Verwender (das Geruest
   unten und rgLaufKopfZeichnen(), das die Zeile bei jedem Takt nachfuehrt).

   "Fertig" heisst: an jedem Punkt war jemand. Das haengt an den ERFASSTEN
   Punkten, nicht allein am Status vom Server -- eine offline gelaufene Runde
   ist gelaufen, auch wenn die Bestaetigung noch in der Warteschlange liegt
   (ENT-321: Erfassung zaehlt, nicht Uebermittlung). #rdFortschritt hat das
   vor ENT-541 genauso gerechnet; ginge die Zeile hier verloren, meldete eine
   im Funkloch vollstaendig abgelaufene Runde weiterhin "laeuft". */
function rgpLage() {
  const st = rundgangAktiv ? rundgangAktiv.status : null;
  const kps = (rundgangAktiv && rundgangAktiv.kontrollpunkte) || [];
  const alleErfasst = kps.length > 0 && kps.every(k => k.erledigt);
  const kl = st === 'pausiert' ? 'pause' : st === 'abgebrochen' ? 'ab'
    : (st === 'abgeschlossen' || alleErfasst) ? 'fertig' : 'laeuft';
  const txt = kl === 'pause' ? w('rgsIstPausiert')
    : kl === 'ab' ? w('rgpAbgebrochen')
    : kl === 'fertig' ? w('rundgangAbgeschlossen') : w('rgsLaeuft');
  return { kl, txt };
}

/* ══ Kopfblock der laufenden Runde, Reiter "Kontrollpunkte" (ENT-541) ══

   Vorlage war ein Bildschirmfoto des Projektinhabers: Zustandszeile, Name
   der Runde, Zeitfenster, Fortschrittsbalken, darunter links der Zaehler und
   rechts die verbleibende Zeit. Er ersetzt die schmale Chip-Zeile aus
   ENT-361 UND #rdFortschritt aus ENT-306 -- beide sagten einen Teil davon,
   an zwei Stellen.

   Drei Abweichungen von der Vorlage, jede mit Grund:

   1. Gross steht der NAME DER RUNDE, nicht der des Objekts. Das Objekt steht
      schon in der Kopfzeile der Seite (#rgsTitel), die immer sichtbar
      bleibt; es hier zu wiederholen waere dieselbe Angabe an zwei Orten.
      Der Name der Runde dagegen stand bisher nirgends -- an einem Objekt
      mit "Nacht A" und "Nacht B" ist er das einzige Unterscheidungsmerkmal.
   2. Rechts unter dem Balken steht "noch 49 min", nicht "im Rahmen". Eine
      Bewertung des Tempos braucht eine festgelegte Regel; es gibt keine.
      Die verbleibende Zeit ist dagegen gemessen und pruefbar.
   3. Die Laufzeit steht als hh:mm:ss, nicht als "41 MIN" -- dasselbe Format
      wie auf dem Karten-Reiter, damit nicht zwei Schreibweisen derselben
      Zahl nebeneinander stehen.

   Die Ids #rgsZaehler und #rgsTimer bleiben bewusst dieselben wie in den
   Chips: Es zeichnet nur EIN Reiter gleichzeitig, und rgLaufKopfZeichnen()
   fuehrt so beide Darstellungen ueber denselben Weg nach. */
function rgLaufKopfblockHtml() {
  if (!rundgangAktiv) { return ''; }
  const { kl: lage, txt: lageTxt } = rgpLage();
  return `<div class="rgp-kopf ${lage}" id="rgpKopf">
    <div class="rgp-lage">
      <span class="rgp-pkt" aria-hidden="true"></span>
      <span id="rgpLage">${esc(lageTxt)}</span>
      <span class="rgp-uhr" id="rgsTimer">–</span>
      <span class="vh" id="rgsTimerLb">${esc(w('rgsTimerLb'))}</span>
    </div>
    <div class="rgp-name" id="rgpName">${esc(rundgangAktiv.vorlage_name || w('rgpAlleP'))}</div>
    <div class="rgp-unter" id="rgpFenster">${esc(rgpFensterTxt())}</div>
    <div class="rgp-balken"><span id="rgpBalken" style="width:0%"></span></div>
    <div class="rgp-zahlen">
      <span class="rgp-zahl" id="rgsZaehler" data-satz="1">–</span>
      <span class="rgp-rest" id="rgpRest">–</span>
    </div>
  </div>`;
}

/* Das Zeitfenster als Text. Ohne Fenster steht "Ohne Zeitfenster" da und
   nicht nichts: Eine leere Zeile saehe aus, als sei die Angabe verloren
   gegangen -- "unbekannt" darf nie wie "keine" aussehen (CLAUDE.md). */
function rgpFensterTxt() {
  const von = rundgangAktiv ? rundgangAktiv.fenster_von : null;
  const bis = rundgangAktiv ? rundgangAktiv.fenster_bis : null;
  if (von && bis) { return w('rgpFensterVonBis').replace('{von}', hm(von)).replace('{bis}', hm(bis)); }
  if (bis) { return w('rgpFensterBis').replace('{bis}', hm(bis)); }
  return w('rgpOhneFenster');
}

/* Verbleibende Minuten im Zeitfenster, oder null, wenn es keines gibt.

   Die Mitternachtsgrenze ist hier der Normalfall und nicht der Sonderfall:
   Eine Nachtrunde laeuft von 22:00 bis 02:00. Gerechnet wird darum in
   Minuten seit Tagesbeginn mit demselben Umbruch wie rundgangImFenster()
   -- ohne ihn zeigte eine Runde um 23:00 Uhr "noch -1260 min". */
function rgpRestMin() {
  const bis = rundgangAktiv ? rundgangAktiv.fenster_bis : null;
  if (!bis) { return null; }
  const min = t => Number(String(t).slice(0, 2)) * 60 + Number(String(t).slice(3, 5));
  const ende0 = min(bis);
  if (!Number.isFinite(ende0)) { return null; }
  let jetzt = min(jetztDatetime().slice(11, 16));
  let ende = ende0;
  const von = rundgangAktiv.fenster_von;
  if (von) {
    const start = min(von);
    if (Number.isFinite(start) && ende <= start) {
      ende += 1440;
      if (jetzt < start) { jetzt += 1440; }
    }
  }
  return ende - jetzt;
}

/* "noch 1 h 05 min" / "noch 49 min". Keine Sekunden: Das Zeitfenster ist auf
   die Minute genau festgelegt, eine laufende Sekundenanzeige taeuschte eine
   Genauigkeit vor, die die Vorgabe gar nicht hat. */
function rgpDauerTxt(minuten) {
  const m = Math.max(0, Math.round(minuten));
  if (m < 60) { return `${m} ${w('rgpMin')}`; }
  return `${Math.floor(m / 60)} ${w('rgpStd')} ${String(m % 60).padStart(2, '0')} ${w('rgpMin')}`;
}

/* Die Restzeit beantwortet "wie lange habe ich noch". Auf einer beendeten
   oder abgebrochenen Runde gibt es diese Frage nicht mehr -- dort stuende
   "noch 49 min" neben "Rundgang abgeschlossen" und laese sich wie eine
   Aufforderung. Pausiert bleibt sie stehen: Das Fenster laeuft weiter. */
function rgpRestTxt() {
  const st = rundgangAktiv ? rundgangAktiv.status : null;
  if (st === 'abgeschlossen' || st === 'abgebrochen') { return null; }
  const r = rgpRestMin();
  if (r === null) { return { txt: w('rgpKeinFenster'), kl: 'mut' }; }
  if (r < 0) { return { txt: w('rgpFensterVorbei'), kl: 'vorbei' }; }
  return { txt: w('rgpRest').replace('{t}', rgpDauerTxt(r)), kl: '' };
}

/* Wie es der Ortung GERADE geht -- eine Stelle, zwei Anzeigen (ENT-355).

   Neu ist der Zustand 'steht': Bis hierher kannte die App nur "es kommt
   etwas" und "es kommt nichts mehr, weil ein Fehler da ist". Der haeufigste
   Fall draussen ist aber ein dritter: Der Bildschirm sperrt sich, das Geraet
   haelt watchPosition an, es kommt kein Fehler -- und die App zeigte
   weiterhin die alte Position, als waere sie aktuell. Das ist genau der
   Fehler, den CLAUDE.md verbietet: „unbekannt" darf nie wie „bekannt"
   aussehen. Nach 90 Sekunden ohne neue Position sagt sie es jetzt.

   Die 90 Sekunden sind bewusst grosszuegig: watchPosition meldet nur bei
   BEWEGUNG neu. Wer zwei Minuten an einem Tor steht, ist nicht "ohne
   Ortung" -- darum keine Schwelle im Sekundenbereich, die dauernd
   Fehlalarm gaebe. */
const RG_ORT_STILL_MS = 90000;

function rgOrtLage() {
  if (rgsOrtWache === null) { return { art: 'aus', min: 0 }; }
  if (rgsOrtFehler === 'verweigert') { return { art: 'verweigert', min: 0 }; }
  if (rgsOrtFehler === 'nicht_da') { return { art: 'nicht_da', min: 0 }; }
  if (!rgsMeinOrt) { return { art: 'sucht', min: 0 }; }
  const alt = Date.now() - (rgsMeinOrt.zeit || 0);
  if (rgsMeinOrt.zeit && alt > RG_ORT_STILL_MS) {
    return { art: 'steht', min: Math.max(1, Math.round(alt / 60000)) };
  }
  return { art: 'laeuft', min: 0 };
}

/* Die Marke auf der Karte (ENT-355). Sie ersetzt die Zeile UNTER der Karte,
   die dort bis hierher stand ("Standort wird waehrend der Runde verfolgt").

   Der Satz verschwindet nicht, er zieht um: ENT-317 gilt unveraendert --
   wer geortet wird, muss es sehen koennen. Auf der Karte steht die Aussage
   sogar naeher an der Sache, statt als Fusszeile, ueber die man hinwegliest.
   Gewonnen sind rund 20 px Hoehe, die jetzt die Karte hat, und die beiden
   Knoepfe sitzen tiefer. */
function rgOrtChipHtml() {
  const l = rgOrtLage();
  if (l.art !== 'laeuft' && l.art !== 'sucht' && l.art !== 'steht') { return ''; }
  return `<div class="rgs-ortchip" id="rgsOrtChip">
    <span class="rgs-ortchip-pkt"></span><span class="rgs-ortchip-tx"></span>
  </div>`;
}

function rgOrtChipZeichnen() {
  const el = $('rgsOrtChip');
  if (!el) { return; }
  const l = rgOrtLage();
  const tx = el.querySelector('.rgs-ortchip-tx');
  el.classList.toggle('steht', l.art === 'steht');
  el.classList.toggle('sucht', l.art === 'sucht');
  if (l.art === 'steht') {
    if (tx) { tx.textContent = w('rgsOrtSteht').replace('{min}', String(l.min)); }
    el.title = w('rgsOrtStehtTitel').replace('{min}', String(l.min));
  } else {
    if (tx) { tx.textContent = w(l.art === 'sucht' ? 'rgsOrtSucht' : 'rgsOrtLaeuft'); }
    el.removeAttribute('title');
  }
}

function rgOrtungHinweisHtml(aufKarte) {
  if (rgsOrtWache === null) { return ''; }
  if (rgsOrtFehler === 'verweigert') {
    const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    return `<div class="rgs-ortwarn" id="rgsOrtWarn">
      <div class="rgs-ortwarn-tt">${esc(w('rgOrtAusTitel'))}</div>
      <div>${esc(w('rgOrtVerweigert'))}</div>
      <div class="rgs-ortwarn-weg">${esc(w(iOS ? 'rgOrtWegIos' : 'rgOrtWegAndroid'))}</div>
      <button type="button" class="btn btn-plain btn-wide" style="margin-top:12px"
        onclick="rgOrtungErneut()">${esc(w('rgOrtErneut'))}</button>
    </div>`;
  }
  if (rgsOrtFehler === 'nicht_da') {
    return `<div class="rgs-ortwarn" id="rgsOrtWarn">
      <div class="rgs-ortwarn-tt">${esc(w('rgOrtAusTitel'))}</div>
      <div>${esc(w('rgOrtKeinSignal'))}</div>
      <button type="button" class="btn btn-plain btn-wide" style="margin-top:12px"
        onclick="rgOrtungErneut()">${esc(w('rgOrtErneut'))}</button>
    </div>`;
  }
  // Auf der Karte tragen diese beiden Zustaende die Marke, nicht die Zeile.
  // Auf dem Punkte-Reiter gibt es keine Karte -- dort bleibt die Zeile, sonst
  // stuende dem Waechter dort gar nichts mehr ueber seine Ortung (ENT-317).
  if (aufKarte) { return ''; }
  const l = rgOrtLage();
  if (l.art === 'steht') {
    return `<div class="rgs-karte-hinweis fehler" id="rgsOrtungHinweis">${
      esc(w('rgsOrtSteht').replace('{min}', String(l.min)))}</div>`;
  }
  if (!rgsMeinOrt) {
    return `<div class="rgs-karte-hinweis" id="rgsOrtungHinweis">${esc(w('rgOrtWartet'))}</div>`;
  }
  return `<div class="rgs-karte-hinweis" id="rgsOrtungHinweis">${esc(w('rgsOrtungLaeuft'))}</div>`;
}

// Neu anlaufen lassen, nachdem jemand die Einstellung geaendert hat. Auf
// iOS greift eine neue Berechtigung erst bei einer neuen Anfrage -- ohne
// diesen Knopf muesste die ganze App neu geladen werden.
function rgOrtungErneut() {
  rgOrtungStoppen();
  rgsOrtFehler = null;
  rgOrtungNachfuehren();
  rgLaufZeichnen();
}

function rgSignalGeben(text) {
  rgTonSignal();
  rgVibrieren();
  rgSichtSignal(text);
}

/* Wann das Signal kommt -- und vor allem, wann NICHT (ENT-319).

   Der Uebergang draussen -> drinnen loest aus, nicht der Zustand
   "drinnen". Ohne diese Unterscheidung piepte es bei jeder Messung neu,
   also alle paar Sekunden, solange jemand am Punkt steht.

   Und mit ABSTAND zurueckgesetzt (Hysterese): Eine GPS-Messung springt um
   ein paar Meter, auch wenn man stillsteht. Genau am Radiusrand faellt sie
   dadurch abwechselnd rein und raus -- ohne Hysterese ergaebe das eine
   Kette von Signalen, und der Waechter schaltete den Ton nach der zweiten
   Nacht ab. Erst wenn er RG_SIGNAL_ABSTAND Meter ausserhalb war, gilt er
   wieder als draussen.

   Erledigte Punkte loesen nichts aus: Wer an einem schon bestaetigten
   Punkt vorbeigeht, bekommt keine Meldung mehr. */
const RG_SIGNAL_ABSTAND = 15;

// Reine Funktion, damit sich die Weiche ohne Geraet pruefen laesst.
// drin: aktueller Zustand, war: gemerkter Zustand.
function rgSignalNoetig(war, dist, radius) {
  if (dist === null || dist === undefined) { return { signal: false, drin: war }; }
  if (dist <= radius) { return { signal: war !== true, drin: true }; }
  if (dist > radius + RG_SIGNAL_ABSTAND) { return { signal: false, drin: false }; }
  return { signal: false, drin: war };   // im Zwischenband: Zustand behalten
}

function rgBereichPruefen() {
  if (!rundgangAktiv || !rgsMeinOrt) { return; }
  (rundgangAktiv.kontrollpunkte || []).forEach(k => {
    if (k.typ !== 'geofence' || k.erledigt) { k._drin = false; return; }
    const e = rgSignalNoetig(k._drin, rdEntfernungZu(k), rdRadiusVon(k));
    k._drin = e.drin;
    if (e.signal) { rgSignalGeben(w('rgSignalDrin') + ' — ' + k.bezeichnung); }
  });
}

/* ══ Uebermittlung der Bewegungsspur (ENT-318) ════════════════════════
   Vom Projektinhaber beauftragt. Bewusst so gebaut, dass so wenig anfaellt
   wie moeglich, ohne den Zweck zu verfehlen:

   - Gedrosselt: hoechstens alle RG_SPUR_SEKUNDEN ein Punkt, und nur wenn
     man sich mindestens RG_SPUR_METER bewegt hat. Wer zwanzig Minuten an
     einem Tor steht, erzeugt EINEN Punkt, nicht achtzig.
   - Ungenaue Messungen fliegen raus. Ein Punkt mit 500 m Streuung sagt
     nichts, faellt in einer Auswertung aber als "war dort" auf.
   - Eigene Warteschlange, damit eine Position nie einen Scan blockiert.
   - Die Spur wird VERWORFEN, sobald sie angekommen ist -- das Geraet ist
     kein Archiv. */
const RG_SPUR_SEKUNDEN = 15;
const RG_SPUR_METER = 10;
const RG_SPUR_GENAUIGKEIT_MAX = 100;   // Meter; darueber ist die Messung wertlos
let rgsSpurLetzte = null;              // letzter AUFGENOMMENER Punkt
let rgsSpurSendetGerade = false;

function rgSpurLesen() {
  try { return JSON.parse(localStorage.getItem(RD_POSITIONEN) || '[]'); } catch { return []; }
}
function rgSpurSchreiben(liste) {
  // Obergrenze: Nach einer sehr langen Offline-Phase darf der Speicher des
  // Geraets nicht volllaufen. Die AELTESTEN fliegen raus, nicht die
  // neuesten -- die juengste Bewegung ist die, die noch jemanden
  // interessiert.
  try { localStorage.setItem(RD_POSITIONEN, JSON.stringify(liste.slice(-2000))); } catch {}
}

// Entscheidet, ob eine Position in die Spur gehoert. Reine Funktion, damit
// sich die Drosselung ohne Geraet pruefen laesst.
function rgSpurNehmen(letzte, neu) {
  if (!neu || !isFinite(neu.lat) || !isFinite(neu.lng)) { return false; }
  if (neu.genauigkeit != null && neu.genauigkeit > RG_SPUR_GENAUIGKEIT_MAX) { return false; }
  if (!letzte) { return true; }
  if ((neu.zeit - letzte.zeit) < RG_SPUR_SEKUNDEN * 1000) { return false; }
  return rgDistanzMeter(letzte.lat, letzte.lng, neu.lat, neu.lng) >= RG_SPUR_METER;
}

function rgSpurAufnehmen(ort) {
  if (!rundgangAktiv || !rgSpurNehmen(rgsSpurLetzte, ort)) { return; }
  rgsSpurLetzte = ort;
  const liste = rgSpurLesen();
  liste.push({ rundgang_id: rundgangAktiv.id, lat: ort.lat, lng: ort.lng,
    genauigkeit_m: ort.genauigkeit == null ? null : Math.round(ort.genauigkeit),
    erfasst_am: jetztDatetime() });
  rgSpurSchreiben(liste);
  rgSpurSenden();
}

function rgSpurSenden() {
  if (rgsSpurSendetGerade) { return; }
  const alle = rgSpurLesen();
  if (!alle.length) { return; }
  // Nach Runde gruppieren: Die Warteschlange kann Punkte aus mehreren
  // Runden enthalten, wenn eine davon offline zu Ende ging.
  const rid = Number(alle[0].rundgang_id);
  const dieser = alle.filter(x => Number(x.rundgang_id) === rid).slice(0, 200);
  rgsSpurSendetGerade = true;
  api('mein_rundgang_position.php', { method: 'POST',
    body: { rundgang_id: rid, positionen: dieser.map(x => ({
      lat: x.lat, lng: x.lng, genauigkeit_m: x.genauigkeit_m, erfasst_am: x.erfasst_am })) },
  }).then(({ ok, data }) => {
    rgsSpurSendetGerade = false;
    if (ok && data && data.status === 'ok') {
      // Nur die tatsaechlich gesendeten entfernen -- in der Zwischenzeit
      // koennen neue dazugekommen sein.
      const weg = new Set(dieser.map(x => x.erfasst_am + '|' + x.lat + '|' + x.lng));
      rgSpurSchreiben(rgSpurLesen().filter(x =>
        !(Number(x.rundgang_id) === rid && weg.has(x.erfasst_am + '|' + x.lat + '|' + x.lng))));
      return;
    }
    // Nimmt der Server sie dauerhaft nicht an -- Runde beendet, Tabelle
    // fehlt --, wird die Spur dieser Runde VERWORFEN statt ewig
    // weitergeschleppt. Eine Position, die niemand mehr haben will, gehoert
    // nicht auf dem Geraet aufbewahrt.
    const code = data && data.code;
    if (code === 'nicht_laufend' || code === 'keine_tabelle') {
      rgSpurSchreiben(rgSpurLesen().filter(x => Number(x.rundgang_id) !== rid));
    }
  });
}

function rgOrtungStoppen() {
  if (rgsOrtWache === null) { return; }
  try { navigator.geolocation.clearWatch(rgsOrtWache); } catch (e) {}
  rgsOrtWache = null;
  // Die Runde ist vorbei -- der Bildschirm darf sich wieder sperren. Ohne
  // diese Zeile bliebe er nach einer beendeten Runde bis zum Schliessen der
  // App an, und der Akku waere fuer nichts weg.
  rgWachFreigeben();
  rgsSpurLetzte = null;
  rgsOrtFehler = null;
  /* Der Richtungspfeil geht mit der Ortung (ENT-542). Wo nicht mehr geortet
     wird, gibt es keine aktuelle Bewegungsrichtung -- und der zuletzt
     gezeichnete Pfeil saehe aus wie eine. Nicht auf das Altern warten: Nach
     dem Ende der Runde steht auch die Uhr, die das Altern nachfuehrt. */
  if (rgsMeinOrt) { rgsMeinOrt.richtung = null; rgsMeinOrt.richtungZeit = 0; }
  if (rgsRichtungsMarke) {
    try { rgsRichtungsMarke.setMap(null); } catch (e) {}
    rgsRichtungsMarke = null;
  }
  // Was noch im Geraet liegt, jetzt noch loswerden -- der Server nimmt es
  // an, solange die Runde laeuft. Endet sie in derselben Sekunde, weist er
  // es ab und die App verwirft es; beides ist besser, als es liegenzulassen.
  try { rgSpurSenden(); } catch (e) {}
}

// Der eigene Standort auf der Karte -- wird bei jeder neuen Position
// versetzt, statt jedes Mal eine neue Marke anzulegen.
//
// EINE Stelle baut diese Marke (ENT-331). Vorher waren es zwei: die
// laufende Ortung hier und der Zentrieren-Knopf weiter unten, der die
// bestehende Marke sogar wegwarf und eine eigene setzte. Beim Umstellen
// auf das Wachmann-Zeichen blieb die zweite ein weisser Punkt -- ein Tipp
// auf "Zentrieren" haette das Zeichen wieder in einen Punkt zurueck-
// verwandelt. Von der Pruefung gefunden, nicht vermutet.
function rgStandortMarkeSetzen(ort) {
  if (!rgsKarte || !window.google) { return; }
  if (rgsStandortMarke) { rgsStandortMarke.setPosition(ort); return; }
  /* Ein Schild statt eines weissen Punktes (ENT-331), Wunsch des
     Projektinhabers: „beim Trackersymbol wäre es cool, wenn es etwas geben
     würde wie Wachmann, oder ein Symbol das auf Security hinweist".

     Das Schild ist das Zeichen, das im Haus schon für den Revierdienst
     steht (Navigationspunkt „Auswertung"/Wächter im Dashboard) -- kein
     neues Sinnbild erfunden. Es ist ausserdem auf einer Karte auf einen
     Blick von einem Kontrollpunkt-Kreis zu unterscheiden, und genau darum
     geht es: Der eigene Standort darf nicht aussehen wie ein Ziel.

     Weisse Füllung mit dunklem Rand bleibt: Auf einer Nachtsicht-Karte ist
     Weiss die einzige Farbe, die sich gegen alles durchsetzt. */
  rgsStandortMarke = new google.maps.Marker({
    // Bewusst UNTER den Kontrollpunkten (zIndex 1, wie beim frueheren
    // Punkt): Die Kontrollpunkt-Marken tragen ihren Zustand als Zeichen
    // (Haken, Ausrufezeichen, Nummer). Das Schild ist deutlich groesser als
    // der alte Punkt -- oben drueber wuerde es genau diese Auskunft
    // verdecken, und zwar in dem Moment, in dem man davorsteht.
    map: rgsKarte, position: ort, title: w('rgsMeinStandort'), zIndex: 1,
    icon: {
      path: 'M12 2 4 5.2v6.1c0 5 3.4 9.6 8 10.7 4.6-1.1 8-5.7 8-10.7V5.2L12 2z'
        + 'M12 7.2a2.1 2.1 0 1 0 0 4.2 2.1 2.1 0 0 0 0-4.2z'
        + 'M8.2 16.6c0-2 1.7-3.1 3.8-3.1s3.8 1.1 3.8 3.1v.6H8.2v-.6z',
      fillColor: '#F2F4F8', fillOpacity: 1, strokeColor: '#0F1117', strokeWeight: 1.4,
      scale: 1.35, anchor: new google.maps.Point(12, 12),
    },
  });
}

function rgStandortZeichnen() {
  if (!rgsMeinOrt) { return; }
  rgStandortMarkeSetzen({ lat: rgsMeinOrt.lat, lng: rgsMeinOrt.lng });
  rgRichtungMarkeSetzen({ lat: rgsMeinOrt.lat, lng: rgsMeinOrt.lng }, rgRichtungJetzt());
}

/* Der Richtungspfeil (ENT-542). Eine EIGENE Marke neben dem Schild, nicht
   ein gedrehtes Schild: Das Schild zeigt einen Menschen, und ein gekippter
   Mensch sieht nach Umfallen aus, nicht nach Nordwest.

   Der Drehpunkt (anchor) liegt UNTER der Pfeilform, auf dem Standort. Damit
   dreht sich der Pfeil nicht um sich selbst, sondern kreist um das Schild
   -- wie der Kegel am blauen Punkt in Karten-Apps. Der Abstand ist so
   gewaehlt, dass er das Schild (16 px Halbhoehe) nicht beruehrt.

   Ohne bekannte Richtung wird die Marke ENTFERNT, nicht versteckt und nicht
   auf einem alten Wert stehen gelassen. */
/* Die Drehung, mit der der Pfeil auf dem BILDSCHIRM gezeichnet wird
   (ENT-543).

   Eine Marke dreht sich nicht mit der Karte mit -- ihre Drehung gilt
   gegenueber dem Bildschirm, damit Beschriftungen lesbar bleiben. Seit die
   Karte drehbar ist, sind Nordrichtung und Bildschirm-Oben darum nicht mehr
   dasselbe: Ist die Karte um 90 Grad gedreht, zeigt Norden nach links.

   Der Pfeil haelt dagegen. Solange niemand dreht (Kartenwinkel 0) ist das
   Ergebnis unveraendert die Bewegungsrichtung selbst. */
function rgRichtungAufKarte(richtung) {
  let winkel = 0;
  try {
    if (rgsKarte && typeof rgsKarte.getHeading === 'function') {
      winkel = rgsKarte.getHeading() || 0;
    }
  } catch (e) { winkel = 0; }
  return ((richtung - winkel) % 360 + 360) % 360;
}

function rgRichtungMarkeSetzen(ort, richtung) {
  if (!rgsKarte || !window.google) { return; }
  if (richtung === null || richtung === undefined) {
    if (rgsRichtungsMarke) { rgsRichtungsMarke.setMap(null); rgsRichtungsMarke = null; }
    return;
  }
  const symbol = {
    // Pfeilspitze im oberen Teil des 24er-Rasters, Drehpunkt bei (12, 24)
    // -- also 24 Einheiten darunter, dort wo der Standort liegt.
    path: 'M12 1.5 17 10.5 12 8.2 7 10.5z',
    fillColor: '#F2F4F8', fillOpacity: 1,
    strokeColor: '#0F1117', strokeWeight: 1.2,
    scale: 1.35, rotation: rgRichtungAufKarte(richtung),
    anchor: new google.maps.Point(12, 24),
  };
  if (rgsRichtungsMarke) {
    rgsRichtungsMarke.setPosition(ort);
    rgsRichtungsMarke.setIcon(symbol);
    return;
  }
  rgsRichtungsMarke = new google.maps.Marker({
    // Dieselbe Ebene wie das Schild: Beide gehoeren zusammen und beide
    // bleiben unter den Kontrollpunkten, deren Zeichen die Auskunft tragen.
    map: rgsKarte, position: ort, title: w('rgsRichtung'), zIndex: 1,
    icon: symbol,
  });
}

/* Im Takt der Uhr nachgefuehrt, nicht nur bei neuer Position: Wer stehen
   bleibt, bekommt keine neue Position -- und genau dann muss der Pfeil nach
   einer halben Minute verschwinden. */
function rgRichtungMarkeNachfuehren() {
  if (!rgsKarte || !rgsMeinOrt) { return; }
  rgRichtungMarkeSetzen({ lat: rgsMeinOrt.lat, lng: rgsMeinOrt.lng }, rgRichtungJetzt());
}

/* Zentrieren: alle Punkte ins Bild, danach einmalig die eigene Position
   dazuholen. Einmalig, nicht laufend -- ENT-131. */
function rgKarteZentrieren() {
  if (!rgsKarte || !window.google) { return; }
  const d = rgKarteDaten(rundgangAktiv ? rundgangAktiv.kontrollpunkte : []);
  if (!d.zeigbar.length) { return; }
  const grenzen = new google.maps.LatLngBounds();
  d.zeigbar.forEach(p => grenzen.extend({ lat: p.lat, lng: p.lng }));
  if (d.zeigbar.length === 1) {
    rgsKarte.setCenter({ lat: d.zeigbar[0].lat, lng: d.zeigbar[0].lng });
    rgsKarte.setZoom(17);
  } else {
