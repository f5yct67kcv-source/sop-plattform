/* Zentrale und Notruf (ENT-299). Nicht ausklappbar, anders als der
   Ansprechpartner-Block darueber: Wer diese Nummern braucht, hat keine Hand
   frei zum Aufklappen. Reihenfolge vom Projektinhaber vorgegeben -- eigene
   Zentrale zuoberst, oeffentlicher Notruf darunter.

   Die Zentrale traegt die Akzentfarbe (unser Weg), die Notrufnummern das
   Rot der Negativ-Farbe (fremder Weg, letzte Stufe). Der Unterschied haengt
   nicht allein an der Farbe: Die Zentrale ist eine breite Zeile mit Namen,
   der Notruf sind drei gleich grosse Kacheln. */
.rgs-hilfe { display: flex; flex-direction: column; gap: 8px; }
.rgs-zentrale { display: flex; align-items: center; gap: 13px; min-height: 60px; padding: 0 16px; border: 1px solid var(--accent-line); border-radius: var(--r); background: var(--accent-soft); color: var(--ink); text-decoration: none; }
.rgs-zentrale-ic { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--accent); color: var(--accent); display: flex; align-items: center; justify-content: center; }
/* Als Spalte, nicht als Zeile: Die drei Angaben sind <span> (in einem <a>
   ist kein <div> erlaubt) und laegen sonst nebeneinander -- die
   Beschriftung stuende dann NEBEN der Nummer statt darueber. */
.rgs-zentrale-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
/* Beschriftung oben, Nummer darunter (CLAUDE.md) -- gleiches Muster wie die
   Kennzahlen weiter oben, damit die Seite eine Ordnung hat. */
.rgs-zentrale-lb { font-size: 11px; font-weight: 640; letter-spacing: .6px; text-transform: uppercase; color: var(--ink-3); }
.rgs-zentrale-nr { font-size: 16px; font-weight: 660; color: var(--accent); margin-top: 2px; }
.rgs-zentrale-name { font-size: 13px; color: var(--ink-2); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rgs-notruf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
/* 60px wie die Funktionen darunter -- eine Notrufkachel darf nicht das
   kleinste Ziel des Bildschirms sein. */
.rgs-notruf a { min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border: 1px solid var(--neg); border-radius: var(--r); background: var(--neg-soft); color: var(--neg); text-decoration: none; }
.rgs-notruf-nr { font-size: 19px; font-weight: 720; letter-spacing: -.3px; }
.rgs-notruf-wort { font-size: 11.5px; font-weight: 600; color: var(--ink-2); }

/* Rueckfrage vor einer Zustandsaenderung (ENT-298). Liegt INNERHALB der
   Seite (position:absolute), nicht im Schublade-System: Die Schublade
   (z-index 61) wuerde die Seite dahinter verdecken und faehrt von unten ein
   -- fuer eine Ja/Nein-Frage ist das der falsche Weg und die falsche
   Bewegung. Der Dialog bleibt ueber der Seite und laesst sehen, worauf er
   sich bezieht. */
.rgs-dlg { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(8,10,16,.62); }
/* Ohne diese Zeile bliebe der Dialog sichtbar: display:flex aus der Regel
   darueber schlaegt die Browser-Vorgabe fuer [hidden] (Autorenregeln gehen
   Browserregeln vor, unabhaengig von der Spezifitaet). */
.rgs-dlg[hidden] { display: none; }
.rgs-dlg-box { width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh-2); padding: 20px 20px 16px; }
/* Beschriftung oben, Aussage darunter -- dasselbe Muster wie ueberall sonst. */
.rgs-dlg-lb { font-size: 11px; font-weight: 640; letter-spacing: .6px; text-transform: uppercase; color: var(--warn); }
.rgs-dlg-frage { font-size: 17px; font-weight: 660; line-height: 1.3; margin-top: 6px; }
/* pre-line (ENT-342): Der Text wird mit textContent gesetzt -- ein
   Zeilenumbruch darin bliebe sonst wirkungslos, und zwei Saetze liefen
   ineinander. Gefunden am gerenderten Zustand, nicht im Quelltext: Die
   Kollision („Muster AG 12:00-18:00") klebte am folgenden Satz. */
.rgs-dlg-txt { font-size: 14px; color: var(--ink-2); line-height: 1.5; margin-top: 10px; white-space: pre-line; }
/* "Nein" links und zuerst: der harmlose Ausgang ist der leicht erreichbare. */
.rgs-dlg-fuss { display: flex; gap: 10px; margin-top: 20px; }
.rgs-dlg-fuss .btn { flex: 1; }

/* ── Hinweis */
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(var(--tab-h) + 18px + env(safe-area-inset-bottom)); background: var(--shell); color: #fff; padding: 13px 18px; border-radius: var(--r-sm); font-size: 14.5px; font-weight: 560; box-shadow: var(--sh-2); z-index: 200; opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity .18s, transform .18s; text-align: center; }
.toast.on { opacity: 1; transform: none; }

/* ── Skelett */
.sk { background: linear-gradient(90deg, var(--line-soft) 25%, var(--sk-hi) 50%, var(--line-soft) 75%); background-size: 200% 100%; animation: sh 1.3s infinite; border-radius: var(--r-sm); }
@keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ── Kacheln fuer Menue/Waechter (ENT-234). Optisch identisch zum
   .bk-kachel-Muster aus dashboard.html (Betrieb-Uebersicht, ENT-161) --
   eigener Klassenpraefix, weil beide Dateien getrennte Stylesheets sind,
   dieselben Farb-/Abstands-Werte wie dort. */
.mk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 14px; margin-bottom: 20px; }
.mk-kachel { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh-1);
  padding: 22px 14px; min-height: 132px; width: 100%; cursor: pointer; font: inherit; color: inherit;
  text-decoration: none; }
.mk-kachel:active { background: var(--accent-soft); border-color: var(--accent-line); }
.mk-kachel:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mk-kachel-ic { width: 56px; height: 56px; border-radius: 14px; background: var(--accent-soft);
  color: var(--accent); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.mk-kachel-ic svg.i { width: 28px; height: 28px; }
.mk-kachel-lbl { font-size: 13.5px; font-weight: 600; line-height: 1.35; }
.mk-kachel-txt { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.mk-kachel-sub { font-size: 11.5px; font-weight: 650; color: var(--accent); }

/* ── Kopf der Profilkarte im Menue (ENT-402). Seit die Kopfzeile im Menue
   wegfaellt, ist diese Karte das oberste Element -- und traegt darum den
   Abmelde-Knopf, dort wo vorher der Aktualisieren-Knopf sass.
   Er steht am rechten Rand auf halber Hoehe, nicht in die Ecke gequetscht:
   44 px Trefferflaeche brauchen Platz, und in der Ecke einer 90-px-Karte
   sieht ein Knopf wie ein Schliessen-Kreuz aus. */
.pr-kopf { display: flex; align-items: center; gap: 14px; }
.pr-kopf-txt { flex: 1; min-width: 0; }
.pr-kopf-name { font-size: 18px; font-weight: 700; letter-spacing: -.3px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr-kopf-sub { font-size: 13px; color: var(--ink-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr-abmelden { flex: none; width: 44px; height: 44px; margin-right: -8px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: 0; border-radius: var(--r-sm);
  color: var(--ink-3); cursor: pointer; }
.pr-abmelden:active { background: var(--neg-soft); color: var(--neg); }
.pr-abmelden:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* ── Einstellungen (ENT-398). Eine Zeile, keine Kachel: Der Schalter
   selbst ist mit 30 px zu flach fuer den Daumen (CLAUDE.md: 44 px), darum
   ist die GANZE Zeile der Schalter -- Beschriftung, Erklaerung und
   Schieber liegen in einem Knopf mit role="switch". Trefferflaeche 64 px
   statt 30. Der Schieber daneben ist nur noch Anzeige (aria-hidden),
   damit Vorleseprogramme nicht zwei Bedienelemente melden, wo eines ist. */
.einst-zeile { display: flex; align-items: center; gap: 14px; width: 100%;
  min-height: 64px; padding: 12px 16px; background: none; border: 0;
  color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.einst-zeile + .einst-zeile { border-top: 1px solid var(--line-soft); }
.einst-zeile:active { background: var(--accent-soft); }
.einst-zeile:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.einst-txt { flex: 1; min-width: 0; }
.einst-txt b { display: block; font-size: 15px; font-weight: 640; }
.einst-txt span { display: block; font-size: 12.5px; color: var(--ink-3); line-height: 1.4; margin-top: 2px; }

/* Derselbe Schiebeschalter wie im Cockpit (dashboard.html, ENT-029/067):
   Sonne und Mond blenden ineinander, der Knopf wandert. Die Werte sind von
   dort uebernommen, nicht neu erfunden -- ein zweiter Schalter, der anders
   aussieht als der erste, waere fuer denselben Zweck eine zweite Sprache. */
.thema-schalter { flex: none; width: 52px; height: 30px; border-radius: 999px; padding: 0;
  border: 1px solid var(--line); background: var(--bg); position: relative; pointer-events: none; }
.thema-schalter .knopf { position: absolute; top: 2px; left: 2px; width: 24px; height: 24px;
  border-radius: 50%; background: var(--surface); box-shadow: var(--sh-1);
  display: flex; align-items: center; justify-content: center; transition: transform .2s; }
.thema-schalter svg { width: 14px; height: 14px; fill: none; stroke-width: 2.1;
  stroke-linecap: round; stroke-linejoin: round; position: absolute; transition: opacity .16s; }
.thema-schalter .i-sonne { stroke: var(--warn); opacity: 1; }
.thema-schalter .i-mond  { stroke: var(--accent); opacity: 0; }
html[data-thema="dunkel"] .thema-schalter { background: var(--accent-soft); border-color: var(--accent-line); }
html[data-thema="dunkel"] .thema-schalter .knopf { transform: translateX(22px); }
html[data-thema="dunkel"] .thema-schalter .i-sonne { opacity: 0; }
html[data-thema="dunkel"] .thema-schalter .i-mond  { opacity: 1; }
@media (prefers-reduced-motion: reduce) {
  .thema-schalter .knopf, .thema-schalter svg { transition: none; }
}

/* ── Unterreiter (ENT-234: Plan + Sperren in einem Reiter). Gleiche
   Trefferflaeche wie ein Hauptreiter (44px), aber schmaler und ohne
   Icon -- sichtbar nur unterhalb von "Plan", nicht Teil der globalen
   Tab-Leiste. */
.unterreiter { display: flex; gap: 6px; margin-bottom: 16px; background: var(--line-soft); border-radius: var(--r-sm); padding: 4px; }
.unterreiter button { flex: 1; min-height: 40px; border: none; border-radius: calc(var(--r-sm) - 3px); background: none;
  font: inherit; font-size: 14px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.unterreiter button.on { background: var(--surface); color: var(--ink); box-shadow: var(--sh-1); }

/* ── Hinweis-Chip bei aktivem/pausiertem Rundgang auf "Heute" (ENT-234).
   Fuehrt mit einem Tipp direkt zurueck in die Checkliste, ohne den Weg
   ueber "Wächter" -- waehrend eine Runde laeuft, zaehlt jeder Kontrollpunkt-
   Scan, nicht die Navigation dorthin. */
.rd-chip { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 56px; padding: 12px 16px;
  margin-bottom: 14px; background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: var(--r);
  font: inherit; color: var(--ink); cursor: pointer; text-align: left; }
.rd-chip-ic { flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--auf-farbe);
  display: flex; align-items: center; justify-content: center; }
.rd-chip-txt { flex: 1; min-width: 0; }
.rd-chip-txt b { display: block; font-size: 14px; font-weight: 650; }
.rd-chip-txt span { display: block; font-size: 12.5px; color: var(--ink-2); margin-top: 1px; }
.rd-chip .chev { flex: none; width: 18px; height: 18px; stroke: var(--ink-3); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* ══ BENACHRICHTIGUNGEN (ENT-424) ═════════════════════════════════════
   Der Schalter in den Einstellungen benutzt den VORHANDENEN .schalter von
   den Sperrtagen -- ein zweiter Schalter, der anders aussieht als der
   erste, waere fuer denselben Zweck eine zweite Sprache. Nur die Farbe im
   Zustand "an" wechselt: Dort steht Orange fuer "gesperrt", hier waere es
   eine Warnung ohne Anlass. */
.schalter.blau.an { background: var(--accent); }
/* Nicht bedienbar (kein Push moeglich, Server nicht eingerichtet, im
   Browser abgelehnt): gedaempft -- und die Zeile sagt darunter, WARUM.
   Ein ausgegrauter Schalter ohne Begruendung ist die schlechteste
   Auskunft von allen. */
.einst-zeile[aria-disabled="true"] { cursor: default; }
.einst-zeile[aria-disabled="true"] .schalter { opacity: .45; }
.einst-zeile[aria-disabled="true"]:active { background: none; }

/* Die Anleitung fuers iPhone. Steht nur da, wenn sie tatsaechlich noetig
   ist -- eine dauerhaft sichtbare Anleitung fuer etwas, das schon erledigt
   ist, liest niemand mehr. */
.push-hinweis { font-size: 12.5px; color: var(--ink-2); line-height: 1.55;
  background: var(--accent-soft); border: 1px solid var(--accent-line);
  border-radius: var(--r-sm); padding: 12px 14px; margin: 10px 2px 0; }
.push-hinweis b { display: block; margin-bottom: 4px; color: var(--ink); }
.push-hinweis ol { margin: 6px 0 0 18px; padding: 0; }
.push-hinweis li { margin-bottom: 3px; }
/* ══ MITTEILUNGEN (ENT-421) ═══════════════════════════════════════════
   Glocke in der Kopfzeile statt eines sechsten Reiters. Vom Projektinhaber
   so entschieden: *"die Leute kennen dies von Social Media bereits ... wenn
   sie dort eine Veränderung sehen, tippen sie instinktiv immer zuerst
   darauf"* -- und sechs Reiter sind ihm zu viel. Die Reiterleiste bleibt
   damit unverändert bei fünf; Heute und Plan bleiben getrennt.

   Derselbe Ort wie im Cockpit (ENT-416, Glocke neben dem Logo). Zwei
   Oberflächen, dieselbe Sache, derselbe Platz.

   44 px Trefferfläche (CLAUDE.md) -- auf dem Handy ist die obere Ecke die
   ungünstigste Stelle, die es gibt; ein 32-px-Symbol wäre dort nicht
   zuverlässig zu treffen. */
.mit-glocke { position: relative; flex: none; min-width: 44px; min-height: 44px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: 0; padding: 0; cursor: pointer; color: var(--shell-txt-hi); }
.mit-glocke svg.i { width: 24px; height: 24px; }
/* Im Menü sitzt dieselbe Glocke in der Profilkarte (mitGlockeVerorten) --
   dort auf hellem Grund, also mit der Textfarbe der Karte statt der der
   Kopfzeile. */
.pr-kopf .mit-glocke { color: var(--ink-2); }
/* Der Zähler. min-width statt fester Breite: zweistellig darf er wachsen,
   ohne dass die Ziffern am Rand kleben. Ab 100 steht "99+" -- eine
   dreistellige Zahl passt in keinen Punkt dieser Grösse. */
.mit-zahl { position: absolute; top: 2px; right: 2px; min-width: 17px; height: 17px; padding: 0 4px;
  border-radius: 9px; background: var(--neg); color: #fff; font-size: 10.5px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; line-height: 1; }
.mit-zahl[hidden] { display: none; }

/* Die Mitteilungsseite. Eigene Vollseite über der Reiterleiste, wie der
   Einsatzmodus (.rgs) -- nicht als Reiter-Ansicht: Sie gehört zu keinem
   Reiter, und der Weg zurück muss dorthin führen, wo man herkam. */
.mit-seite { position: fixed; left: 0; right: 0; top: 0; bottom: calc(0px - var(--sockel)); z-index: 56;
  display: none; flex-direction: column; background: var(--bg); color: var(--ink);
  padding-top: env(safe-area-inset-top); }
.mit-seite.on { display: flex; }
.mit-kopf { display: flex; align-items: center; gap: 6px; padding: 10px 14px 12px; flex: none;
  background: var(--surface); border-bottom: 1px solid var(--line-soft); }
.mit-kopf h2 { font-size: 17px; font-weight: 680; letter-spacing: -.3px; flex: 1; min-width: 0; }
.mit-zurueck { min-height: 44px; min-width: 44px; padding: 0; margin-left: -10px; display: flex;
  align-items: center; justify-content: center; background: none; border: 0; color: var(--ink); cursor: pointer; }
.mit-bd { padding: 16px 16px calc(16px + env(safe-area-inset-bottom) + var(--sockel)); overflow-y: auto; flex: 1; min-height: 0; }

/* Eine Mitteilung in der Liste. Überschrift oben, Text darunter (CLAUDE.md:
   Überschrift oben, Wert darunter) -- die Zeile mit Absender und Datum
   steht unten und klein, sie beantwortet keine Frage, die man zuerst
   stellt. */
.mit-karte { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: var(--sh-1); padding: 16px; margin-bottom: 12px; }
/* Ungelesen: ein farbiger Streifen links. Nicht die ganze Karte einfärben --
   bei fünf ungelesenen Mitteilungen wäre der Bildschirm dann blau, und die
   eine wichtige darin fiele nicht mehr auf. */
.mit-karte.neu { border-left: 3px solid var(--accent); }
.mit-karte.wichtig { border-left: 3px solid var(--neg); }
.mit-karte h3 { font-size: 15.5px; font-weight: 680; letter-spacing: -.2px; margin-bottom: 6px; }
.mit-karte .mit-text { font-size: 14px; line-height: 1.55; color: var(--ink-2); white-space: pre-wrap; }
.mit-karte .mit-fuss { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  margin-top: 12px; font-size: 12px; color: var(--ink-3); }
.mit-marken { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
/* Termin (ENT-436). Die Zeitangabe steht als eigene Zeile ueber dem Text --
   sie ist die eine Angabe, wegen der jemand zu- oder absagt. */
.mit-karte.termin { border-left: 3px solid var(--accent); }
.mit-termin-zeit { display: flex; gap: 8px; align-items: baseline; margin: 8px 0 2px;
  font-size: 14px; font-weight: 640; color: var(--ink); }
.mit-termin-ort { font-size: 13px; color: var(--ink-3); margin-bottom: 2px; }
/* Zwei gleich grosse Knoepfe nebeneinander, beide mindestens 44 px hoch
   (CLAUDE.md). Der eigene Stand ist nicht nur farblich markiert, sondern
   steht darunter auch als Satz -- Farbe allein ist keine Auskunft. */
.mit-antwort { display: flex; gap: 8px; margin-top: 12px; }
.mit-antwort .btn { flex: 1; min-height: 44px; }
.mit-antwort .btn.an { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.mit-antwort .btn.ab.an { border-color: var(--neg); box-shadow: inset 0 0 0 1px var(--neg); }
.mit-antwort-stand { margin-top: 8px; font-size: 13px; font-weight: 620; color: var(--ink-2); }
.mit-antwort-stand.offen { color: var(--neg); }

/* Das Fenster für eine wichtige Mitteilung. Es unterbricht -- also sitzt es
   über allem, auch über dem Einsatzmodus, und lässt sich nicht durch einen
   Klick daneben schliessen: Genau das wäre das versehentliche Wegwischen,
   das der Bestätigung ihren Wert nähme. */
.mit-dlg { position: fixed; inset: 0; bottom: calc(0px - var(--sockel)); z-index: 70; display: none;
  align-items: center; justify-content: center; padding: 20px 20px calc(20px + var(--sockel));
  background: rgba(0,0,0,.55); }
.mit-dlg.on { display: flex; }
.mit-dlg-box { background: var(--surface); color: var(--ink); border-radius: var(--r);
  box-shadow: 0 18px 50px rgba(0,0,0,.35); width: 100%; max-width: 420px;
  max-height: 80vh; display: flex; flex-direction: column; overflow: hidden; }
.mit-dlg-kopf { padding: 18px 20px 0; }
.mit-dlg-lb { font-size: 11.5px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--neg); }
.mit-dlg-kopf h3 { font-size: 18px; font-weight: 700; letter-spacing: -.3px; margin-top: 6px; }
.mit-dlg-bd { padding: 12px 20px 0; overflow-y: auto; font-size: 14.5px; line-height: 1.55;
  color: var(--ink-2); white-space: pre-wrap; }
.mit-dlg-meta { padding: 12px 20px 0; font-size: 12px; color: var(--ink-3); }
.mit-dlg-fuss { padding: 16px 20px calc(16px + env(safe-area-inset-bottom)); }
/* Der Knopf steht allein in seiner Zeile -- und wird trotzdem NICHT über
   die volle Breite gestreckt (CLAUDE.md). Rechtsbündig, wie ein Abschluss. */
.mit-dlg-fuss { display: flex; justify-content: flex-end; gap: 8px; }
/* .btn setzt display selbst -- ohne diese Zeile bliebe ein Knopf mit
   [hidden] sichtbar (dieselbe Falle wie bei .mit-zahl). Aufgefallen in der
   Prüfung: "Verstanden" stand neben den Termin-Knöpfen. */
.mit-dlg-fuss .btn[hidden] { display: none; }

@media (min-width: 700px) {
  .md-paar-sh { grid-template-columns: 3fr 1fr; }
  .md-paar-po { grid-template-columns: 1fr 3fr; }
  .md-paar-gleich { grid-template-columns: 1fr 1fr; }
  /* Auf grösseren Geräten mittig halten statt in die Breite ziehen */
  .app { max-width: 560px; margin: 0 auto; box-shadow: 0 0 0 1px var(--line); min-height: 100vh; }
  .tabs { max-width: 560px; left: 50%; transform: translateX(-50%); }
  .blatt { max-width: 560px; left: 50%; transform: translateX(-50%) translateY(100%); }
  .blatt.on { transform: translateX(-50%); }
  .toast { max-width: 528px; left: 50%; transform: translateX(-50%) translateY(8px); }
  .toast.on { transform: translateX(-50%); }
  /* Der Einsatzmodus folgt demselben Muster wie alles andere (ENT-294) --
     ohne diese Zeile lief er als einziger Bereich ueber die volle
     Bildschirmbreite, mit einem 1400px breiten "Rundgang starten". */
  .rgs { max-width: 560px; left: 50%; transform: translateX(-50%); box-shadow: 0 0 0 1px var(--line); }
  .mit-seite { max-width: 560px; left: 50%; transform: translateX(-50%); box-shadow: 0 0 0 1px var(--line); }
}

/* ── Schreibtisch-Zuschnitt fuer Mitarbeitende ────────────────────────
   ENT-443 (Status VORLAEUFIG). Ausgerollt, damit der Projektinhaber den
   Zuschnitt am lebenden Stand ansehen kann. Vorlaeufig heisst: er bleibt,
   bis der Projektinhaber ihn ausdruecklich bestaetigt oder verwirft.
   Vergangene Dienstplaene fehlen weiterhin -- OP-432, bewusst offen.

   Am Handy ist die Reiterleiste unten die richtige Bedienung: Daumen
   erreichen sie. Ab Notebook-Breite ist sie es nicht mehr -- dort liegt der
   Blick oben links, und unten am Fensterrand steht sonst eine Leiste, die
   niemand ansieht. Die Leiste WANDERT deshalb, sie wird nicht ersetzt:
   dasselbe Auszeichnungsgeruest, dieselben fuenf Knoepfe, dieselbe
   zeige()-Funktion. Geaendert wird ausschliesslich, WO sie liegt.

   Genau das ist der Grund fuer diese Bauweise: Es gibt weiterhin EINE
   Quelle fuer die Mitarbeiter-Ansichten. Eine zweite Oberflaeche haette
   "meine Schichten" ein zweites Mal -- und zwei Fassungen derselben Ansicht
   laufen nach ein paar Monaten auseinander, ohne dass es jemandem auffaellt.

   Die Grenze liegt bei 1080 px und nicht bei 900: Ein quergedrehtes Tablet
   (1024) soll die vertraute Handy-Bedienung behalten. */
/* ══ Monatstabelle (ENT-445) ══════════════════════════════════════════
   ABSICHTLICH AUSSERHALB der Breitenabfrage. Zwei Gruende:
   1. Die Auszeichnung entsteht ohnehin nur am Schreibtisch -- was es
      nicht gibt, braucht keine Breitenbedingung.
   2. A4 ist rund 794 px breit. Beim DRUCKEN greift "min-width: 1080px"
      also nicht, und die Tabelle stuende ohne ihr Regelwerk auf dem
      Papier. Gemessen und nicht vermutet: siehe test_drucken.
*/
/* ── Monatstabelle ─────────────────────────────────────────────────
   Mittiges gehoert in die Mitte des CONTAINERS, nicht zwischen zwei
   ungleich breite Nachbarn: darum 1fr auto 1fr und kein Flex-
   Abstandhalter (CLAUDE.md). */
.mt-kopf { display: grid; grid-template-columns: 1fr auto 1fr;
           align-items: center; gap: 12px; margin: 0 0 14px; }
.mt-kopf > b { font-size: 17px; font-weight: 700; letter-spacing: -.2px; }
.mt-kopf > button:first-child { justify-self: start; }
.mt-kopf > button:last-child { justify-self: end; }
.mt-pfeil { display: flex; align-items: center; justify-content: center;
            width: 38px; height: 38px; border-radius: 10px; cursor: pointer;
            border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); }
.mt-pfeil:hover { border-color: var(--accent-line); color: var(--accent); }

/* Die Tabelle scrollt in IHREM Kasten, nicht die Seite. Bei schmalem
   Fenster und acht Spalten ist das der Unterschied zwischen "man kann
   sie ansehen" und "die ganze Seite verrutscht". */
.mt-rahmen { overflow-x: auto; border: 1px solid var(--line);
             border-radius: var(--r-sm); background: var(--surface); }
.mt { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.mt th { text-align: left; padding: 11px 12px; white-space: nowrap;
         font-size: 11px; font-weight: 700; letter-spacing: .5px;
         text-transform: uppercase; color: var(--ink-3);
         border-bottom: 1px solid var(--line); background: var(--surface-2); }
.mt td { padding: 9px 12px; vertical-align: top; color: var(--ink);
         border-bottom: 1px solid var(--line-soft); }
.mt tbody tr:last-child td { border-bottom: 0; }
.mt-datum { white-space: nowrap; font-weight: 620; }
.mt-weiter { border-bottom-color: transparent; }
.mt-zeit, .mt-dauer { white-space: nowrap; font-variant-numeric: tabular-nums; }
.mt-dauer { color: var(--ink-2); }
.mt-neben { display: block; font-size: 12px; color: var(--ink-3); font-weight: 400; }
.mt-ft { display: inline-block; margin-left: 5px; font-size: 11px; color: var(--ink-3); }
.mt-status { white-space: nowrap; }

/* Ein Tag ohne Schicht ist eine Aussage, kein Loch. Er steht darum
   ausgeschrieben da -- nur leiser als ein Tag mit Einsatz. */
.mt-ohne td { color: var(--ink-3); font-style: italic; }
.mt-wochenende td { background: var(--surface-2); }
.mt-heute td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.mt-heute .mt-datum { color: var(--accent); }
.mt-abgesagt td { text-decoration: line-through; color: var(--ink-3); }
.mt-zeile { cursor: pointer; }
.mt-zeile:hover td { background: var(--accent-soft); }
.mt-zeile:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

.mt-summe-zelle { padding: 0; background: var(--surface-2); }
.mt-summe { display: flex; flex-wrap: wrap; align-items: baseline;
            gap: 4px 14px; padding: 12px; }
.mt-summe b { font-size: 14.5px; }
.mt-summe .mt-neben { display: inline; }
.mt-warn { color: var(--warn); font-size: 12.5px; font-weight: 620; }

/* Der Kopf der Monatstabelle: Pfeil links, Monat mittig, Pfeil und
   Drucken rechts. 1fr auto 1fr haelt den Monat in der Mitte des
   CONTAINERS, nicht zwischen zwei ungleich breiten Nachbarn. */
.mt-kopf-rechts { display: flex; align-items: center; gap: 8px; justify-self: end; }
.mt-drucken { display: inline-flex; align-items: center; gap: 7px; height: 38px;
  padding: 0 14px; border-radius: 10px; cursor: pointer; font: inherit;
  font-size: 13.5px; font-weight: 620;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); }
.mt-drucken:hover { border-color: var(--accent-line); color: var(--accent); }
.mt-papierkopf { display: none; }

/* ══ PAPIER ═══════════════════════════════════════════════════════════
   Gedruckt wird der Plan, nicht die Bedienung.

   Wichtig: A4 ist rund 794 px breit, die Breitenabfrage fuer den
   Schreibtisch greift hier also NICHT. Alles, was sonst dort verborgen
   wird, muss hier eigens verborgen werden -- sonst kaeme die Handy-
   Reiterleiste auf dem Papier zurueck. Genau das ist beim ersten Versuch
   passiert und wird von test_drucken bewacht. */
@media print {
  .kopf, .tabs, .ptr, .unterreiter, .mt-pfeil, .mt-drucken,
  .mit-seite, .blatt, .sperr-hinweis { display: none !important; }
  html, body, .app, main.inhalt { background: #fff !important; color: #000 !important; }
  .app.on { display: block !important; }
  main.inhalt { padding: 0 !important; max-width: none !important; }
  main.inhalt > .v { max-width: none !important; margin: 0 !important; }
  /* Nur der Plan geht aufs Papier. Die anderen Abschnitte sind ohnehin
     nicht "on", aber ein Ausdruck darf sich darauf nicht verlassen. */
  .v:not(.on) { display: none !important; }
  .mt-kopf { display: none !important; }
  .mt-papierkopf { display: flex !important; justify-content: space-between;
    align-items: baseline; gap: 12px; margin: 0 0 10px; font-size: 13pt; }
  .mt-papierkopf span { font-size: 11pt; }
  .mt-rahmen { overflow: visible !important; border: 0 !important; background: none !important; }
  .mt { font-size: 9pt; }
  /* Der Tabellenkopf wiederholt sich auf jeder Seite -- ohne ihn ist ab
     Seite zwei nicht mehr zu erkennen, welche Spalte was ist. */
  .mt thead { display: table-header-group; }
  .mt tfoot { display: table-footer-group; }
  .mt tr { break-inside: avoid; page-break-inside: avoid; }
  .mt th { background: none !important; color: #000 !important;
    border-bottom: 1pt solid #000 !important; padding: 4pt 5pt; }
  .mt td { color: #000 !important; border-bottom: .5pt solid #999 !important; padding: 3pt 5pt; }
  /* Auf Papier gibt es keine Farbe, auf die man sich verlassen kann.
     Wochenende und heute stehen ohnehin im Datum -- die Flaechen fallen
     weg, statt als grauer Schleier den Text zu schwaechen. */
  .mt-wochenende td, .mt-heute td, .mt-summe-zelle { background: none !important; }
  .mt-heute td:first-child { box-shadow: none !important; }
  .mt-heute .mt-datum { color: #000 !important; font-weight: 700; }
  .mt-ohne td { color: #555 !important; }
  .mt-neben, .mt-ft { color: #444 !important; }
  .mt-summe { padding: 6pt 5pt; border-top: 1pt solid #000; }
  .marke { border: .5pt solid #999 !important; background: none !important; color: #000 !important; }
  @page { margin: 12mm; }
}

@media (min-width: 1080px) {
  /* Ein Schalter, den auch das Skript lesen kann. Die Grenze steht damit
     an EINER Stelle -- in der Media Query darueber. Eine zweite Zahl im
     Skript wuerde beim naechsten Verschieben stillschweigend danebenliegen,
     und niemand saehe es. */
  :root { --schreibtisch-an: 1; }

  /* Drei Zeilen uebereinander: Kopf, Reiterleiste, Inhalt. Die Leiste liegt
     OBEN und ueber die volle Breite. Zuerst stand sie links -- das kostete
     236 px, und die braucht die Monatstabelle. Oben kostet sie nur Hoehe,
     und Hoehe ist reichlich da (gemessen: vier von fuenf Reitern liessen
     660 bis 1300 px darunter leer). */
  .app { max-width: none; }
  .app.on { display: grid; grid-template-columns: 1fr;
            grid-template-rows: auto auto 1fr; align-content: start; }
  .kopf { grid-row: 1; }
  /* Reihenfolge im Auszeichnungstext ist kopf, main, tabs -- die Zeilen
     werden darum ausdruecklich gesetzt, statt sich auf sie zu verlassen. */
  .tabs { grid-row: 2; }
  main.inhalt { grid-row: 3; }

  /* Die Leiste steht jetzt im Fluss, statt am Fensterrand zu kleben. Ohne
     Milchglas: dahinter liegt nichts mehr, was durchscheinen koennte. */
  .tabs { position: static; transform: none; bottom: auto; max-width: none;
          border-top: 0; border-bottom: 1px solid var(--line);
          background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none;
          justify-content: center; gap: 6px; padding: 8px 26px 0; }
  /* Symbol und Wort nebeneinander. Die Knoepfe teilen sich die Breite --
     aber nur bis 220 px: auf einem sehr breiten Schirm haette ein Reiter
     sonst die Flaeche einer Kachel. */
  .tabs button { flex: 1 1 0; max-width: 220px; flex-direction: row;
                 justify-content: center; gap: 9px; min-height: 46px;
                 font-size: 13.5px; font-weight: 620; padding: 0 12px;
                 border-radius: 10px 10px 0 0;
                 border-bottom: 2px solid transparent; }
  .tabs button.on { background: var(--accent-soft); border-bottom-color: var(--accent); }
  .tabs button .punkt { position: static; margin: 0; }

  /* main.inhalt, NICHT main: .inhalt ist ein Klassenselektor und schlaegt
     jedes blosse "main" -- unabhaengig von Reihenfolge und Media Query.
     Mit "main" allein blieb die Polsterung hier wirkungslos, und unten
     stand weiter der Platz fuer die Reiterleiste, die am Schreibtisch
     gar nicht mehr unten liegt (88 px Leere). Gemessen, nicht gelesen. */
  main.inhalt { padding: 22px 26px 40px; min-width: 0; }
  /* Die Kopfzeile bleibt am Schreibtisch IMMER stehen. Am Handy faellt
     sie im Menue weg, weil dort die Profilkarte dasselbe sagt (ENT-402) --
     am Schreibtisch traegt sie aber den Konto-Knopf, und der ist der
     einzige Weg zu Spesen, Passwort, Einstellungen, Cockpit und
     Abmelden. Ohne diese Zeile war er auf "Meine Stunden", "Meine Daten"
     und "Mitteilungen" verschwunden -- gemessen, dieselbe Sackgasse wie
     zuvor, nur eine Ebene tiefer. */
  .app.ohne-kopf .kopf { display: flex; }
  .app.ohne-kopf main.inhalt { padding-top: 22px; }

  /* Lesbares Mass fuer alles, was Text ist: eine Zeile ueber 1200 px
     verliert man beim Zeilenwechsel. Die Breite ist kein Selbstzweck.
     LINKSBUENDIG, nicht mittig: Beim Wechsel zwischen Plan (volle Breite)
     und einer Textseite sprang die linke Kante sonst von 26 px auf 240 px
     -- gemessen. Jede Seite beginnt jetzt an derselben Stelle, nur ihr
     rechtes Ende ist verschieden. */
  main.inhalt > .v { max-width: 1200px; margin-right: auto; }
  /* Die Ausnahme ist der Plan. Die Monatstabelle ist der Grund dafuer,
     dass die Seite ueberhaupt breit sein soll. */
  main.inhalt > #v-plan { max-width: none; }
  /* ... aber nur die TABELLE. Sperren und Abwesenheit sind Listen und
     Text; sie ueber 1590 px zu ziehen macht sie nicht lesbarer, nur
     leerer. Dieselbe Grenze wie fuer jede andere Textseite. */
  #plan-inhalt-sperren, #plan-inhalt-abwesenheit { max-width: 1200px; }

  /* ── Zweite Leiste (ENT-447) ────────────────────────────────────────
     Am Schreibtisch fuehrt die Schreibtisch-Leiste, die Handy-Leiste
     verschwindet. Nicht ".tabs" allein ausblenden: die zweite traegt
     dieselbe Klasse und wuerde mit verschwinden. */
  .tabs:not(.tabs-tisch) { display: none; }
  .tabs-tisch { display: flex; }
  /* Die Zahl ungelesener Mitteilungen sitzt im Reiter, nicht daneben. */
  .ts-zahl { min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px;
             background: var(--neg); color: #fff; font-size: 11px; font-weight: 700;
             display: inline-flex; align-items: center; justify-content: center; }
  /* Ohne diese Zeile macht das eigene "display" das Attribut [hidden]
     wirkungslos -- die Browser-Vorgabe [hidden]{display:none} verliert
     gegen jede Autorenregel. Eine rote NULL als Alarmzeichen war die
     Folge. Dieselbe Falle wie bei .mit-zahl, .rgs-dlg und .rgs-reiter;
     sie steht im Haus schon dreimal, und neuer Code erbt sie nicht. */
  .ts-zahl[hidden] { display: none; }

  /* Die Mitteilungen bleiben eine eigene Ebene, ruecken aber unter
     Kopfzeile und Leiste -- der gedrueckte Reiter bleibt sichtbar.
     --tisch-kopf ist gemessen, keine geratene Zahl. */
  /* Die Mitteilungen sind am Schreibtisch eine SEITE, keine Ueberlagerung.
     Die 700-px-Query weiter oben haelt sie sonst in derselben 560-px-Saeule
     wie am Tablet -- gemessen stand sie als 560 px breiter Streifen bei
     x=560 mitten ueber der Monatstabelle, die dahinter sichtbar blieb.
     Diese vier Zeilen heben genau das auf; ohne sie sieht der Reiter aus
     wie ein Fehler. .blatt, .rgs und .toast bleiben bewusst schmal: Das
     sind Dialoge, keine Seiten (fuer .rgs ausdruecklich ENT-294). */
  .mit-seite { top: var(--tisch-kopf); bottom: 0; left: 0; right: 0;
               max-width: none; transform: none; box-shadow: none;
               border-top: 1px solid var(--line); }
  /* Dieselbe linke Kante wie jede andere Seite -- 26 px, wie main.inhalt.
     Springt die Kante beim Reiterwechsel, wirkt die Anwendung unruhig,
     ohne dass man sagen koennte warum.

     "width: 100%" und NICHT "margin-right: auto": .mit-seite ist ein
     Spalten-Flex, und ein automatischer Rand in der Querachse hebt dort
     das Strecken auf. Genau damit schrumpften Kopf und Inhalt auf ihren
     Text zusammen -- gemessen 149 px fuer die Ueberschrift. Eine feste
     Breite laesst den Kasten links beginnen, ohne das Strecken zu
     brauchen. */
  .mit-seite .mit-kopf, #mitBody { width: 100%; max-width: 1226px;
                                   padding-left: 26px; padding-right: 26px; }
  /* Kein Seitentitel, der den Reiter wiederholt. Der aktive Reiter steht
     zwei Zentimeter darueber und sagt dasselbe -- eine Ueberschrift
     daneben ist Wiederholung ohne neue Aussage. Ausserdem hatten drei von
     fuenf Seiten eine und zwei keine; das war der eigentliche Fehler.
     Betroffen sind nur die Seiten, die ein REITER oeffnet. Spesen und
     Einstellungen behalten ihren Kopf samt Rueckweg: Die erreicht man
     ueber "Konto", und dorthin muss man zurueckkommen. */
  /* Kein Hintergrund hinter der Mitteilungs-Seite: Was nicht da ist, kann
     nicht wegscrollen. Gesetzt wird die Klasse in tischMarkeSetzen(), nicht
     ueber :has() -- der Kasten steht VOR der Ebene im Auszeichnungstext,
     und eine Regel, die von einem spaeteren Geschwister abhaengt, ist
     schwerer zu durchschauen als ein Umschalter an einer Stelle. */
  .app.mit-offen main.inhalt { display: none; }

  .mit-seite .mit-kopf { display: none; }
  #mitBody { padding-top: 22px; }
  #pr-stunden > .seiten-kopf, #pr-daten > .seiten-kopf { display: none; }

  /* Ein Knopf wird nicht gestreckt, nur weil Platz da ist (CLAUDE.md).
     "Neuer Antrag" lief ueber die vollen 1590 px. */
  .aw-neu { width: auto; min-width: 220px; }
  .mit-seite .mit-zurueck { display: none; }   /* der Reiter IST der Weg zurueck */

  /* Aus demselben Grund verschwinden die Zurueck-zum-Menue-Knoepfe: Am
     Schreibtisch gibt es keinen Reiter "Menü" mehr, in den man
     zurueckkoennte -- der Knopf zeigte auf einen Ort, den es dort nicht
     gibt. Gemessen war er in "Meine Stunden" und "Meine Daten" sichtbar. */
  .zur-menue { display: none; }

  /* Drei Knoepfe, die sich 1600 px teilen, sind keine Reiter mehr,
     sondern Banner (gemessen: 536 px je Knopf). Am Handy fuellen sie die
     Zeile zu Recht -- dort IST die Zeile schmal. Hier bekommen sie ihr
     Mass: "ein Knopf wird nicht gestreckt, nur weil Platz da ist"
     (CLAUDE.md). Links buendig, weil darunter eine Tabelle beginnt und
     nicht ein zweiter mittiger Block. */
  .unterreiter { max-width: 520px; margin-right: auto; }
  /* "Abwesenheit" ist am Schreibtisch ein eigener Reiter oben (ENT-447).
     Unten stehenzulassen waere ein zweiter Weg zum selben Ziel -- und wer
     ueber den oberen Reiter kommt, braucht darunter keine Auswahl mehr. */
  #pu-abwesenheit { display: none; }
  .unterreiter.abw-oben { display: none; }

  .k-konto { display: inline-flex; align-items: center; gap: 7px; }
  /* Was oben schon ein Reiter ist, steht im Menue nicht noch einmal --
     sonst gaebe es zwei sichtbare Wege zum selben Ziel. Uebrig bleiben
     genau die Punkte ohne eigenen Reiter: Spesen, Passwort, Einstellungen,
     Cockpit, Abmelden. */
  #mk-daten, #mk-stunden, #mk-abwesenheit { display: none; }

}
</style>
</head>
<body>

<!-- ══════════════════════════ ANMELDUNG ══════════════════════════ -->
<div id="gate">
 <!-- Video-Hintergrund auf dem Desktop (ENT-394). WebM/VP9 zuerst -- kleiner
      und von den meisten Desktop-Browsern unterstuetzt --, MP4/H.264 als
      Ausweiche fuer Safari/iOS, das kein WebM zuverlaessig abspielt. Kein
      "type"-Attribut je Quelle im Sinne einer harten Anforderung, sondern
      im Sinne der Web-Norm: der Browser waehlt die erste Quelle, die er
      abspielen kann, und ignoriert den Rest -- pro Besuch wird darum nur
      EINE der beiden Dateien tatsaechlich geladen, nicht beide. Kein
      "poster": das CSS-Foto darunter (siehe #gate-Regel oben) uebernimmt
      genau diese Rolle schon, ein zweites Bild waere dieselbe Datei
      zweimal eingebunden. -->
 <video class="gate-video" autoplay muted loop playsinline>
   <source src="img/anmeldung-nacht.webm" type="video/webm">
   <source src="img/anmeldung-nacht.mp4" type="video/mp4">
 </video>
 <div class="gate-schleier"></div>
 <div class="gate-mitte">
  <div class="gate-oben">
    <img src="icons/icon-192.png" alt="">
    <div class="sub">CUPI 24 GmbH</div>
  </div>
  <div class="gate-form" id="gate-login">
    <div id="gErr" class="msg-err" style="display:none"></div>
    <div class="f"><label for="gName" id="lb-name">Name</label><input class="inp" id="gName" autocomplete="username" autocapitalize="none"></div>
    <div class="f"><label for="gPass" id="lb-pass">Passwort</label>
      <div class="pw-feld"><input class="inp" id="gPass" type="password" autocomplete="current-password">
        <button type="button" class="pw-toggle" aria-label="Passwort anzeigen"
                onclick="togglePw('gPass', this)">👁</button></div></div>
    <button class="btn btn-primary btn-wide" id="gBtn" onclick="anmelden()">Anmelden</button>
    <button type="button" class="gate-link" id="lb-pwvergessen" onclick="pwVergessenZeigen()">Passwort vergessen?</button>
  </div>

  <!-- "Passwort vergessen" (ENT-373): Anmeldename eingeben, ein Link geht
       -- falls hinterlegt -- per E-Mail raus. Bewusst im GATE-Container und
       NICHT in der Schublade (.blatt): Die Schublade sitzt auf z-index 61,
       das Gate auf z-index 900 -- vor der Anmeldung waere sie unsichtbar
       dahinter verschwunden (dieselbe Art Fehler wie bei ENT-345/346,
       diesmal vor dem Bauen gefunden statt danach). -->
  <div class="gate-form" id="gate-vergessen" style="display:none">
    <div id="gvErr" class="msg-err" style="display:none"></div>
    <div id="gvOk" class="msg-ok" style="display:none"></div>
    <p class="gate-hinweis" id="gvHinweis">Anmeldename eingeben. Ist eine E-Mail-Adresse hinterlegt, geht ein Link zum Zurücksetzen dorthin.</p>
    <div id="gvFelder">
      <div class="f"><label for="gvName" id="lb-gvname">Anmeldename</label><input class="inp" id="gvName" autocomplete="username" autocapitalize="none"></div>
      <button class="btn btn-primary btn-wide" id="gvBtn" onclick="pwVergessenSenden()">Link anfordern</button>
    </div>
    <button type="button" class="gate-link" id="lb-gvzurueck" onclick="pwVergessenZurueck()">Zurück zur Anmeldung</button>
  </div>

  <!-- Neues Passwort setzen (ENT-373): erscheint anstelle der Anmeldung,
       sobald die Adresszeile ?reset=<token> traegt (siehe ganz unten im
       Skript). Der Token wird sofort aus der Adresszeile entfernt -- er ist
       ein Geheimnis und hat im Verlauf nichts zu suchen (gleiches Muster
       wie die Fahrzeug-Kennung, ENT-340). -->
  <div class="gate-form" id="gate-reset" style="display:none">
    <div id="grErr" class="msg-err" style="display:none"></div>
    <p class="gate-hinweis">Neues Passwort für dieses Konto festlegen.</p>
    <div class="f"><label for="grNeu" id="lb-grneu">Neues Passwort</label>
      <div class="pw-feld"><input class="inp" id="grNeu" type="password" placeholder="mind. 10 Zeichen" autocomplete="new-password">
        <button type="button" class="pw-toggle" aria-label="Passwort anzeigen"
                onclick="togglePw('grNeu', this)">👁</button></div></div>
    <!-- Wiederholung (ENT-379, Wunsch des Projektinhabers): Ohne sie faellt
         ein Tippfehler erst beim naechsten Anmeldeversuch auf -- und genau
         dann, wenn das alte Passwort schon vergessen und das neue falsch
         eingetippt ist, kommt niemand mehr rein. Gleiches Muster wie im
         Cockpit bei mitarbeiter_reset_password.php ("Neues Passwort" /
         "Zur Bestaetigung wiederholen"). -->
    <div class="f"><label for="grNeu2" id="lb-grneu2">Zur Bestätigung wiederholen</label>
      <div class="pw-feld"><input class="inp" id="grNeu2" type="password" placeholder="nochmals dasselbe" autocomplete="new-password">
        <button type="button" class="pw-toggle" aria-label="Passwort anzeigen"
                onclick="togglePw('grNeu2', this)">👁</button></div></div>
    <button class="btn btn-primary btn-wide" id="grBtn" onclick="pwResetSpeichern()">Passwort speichern</button>
  </div>
 </div>
</div>

<div class="app" id="app">
  <header class="kopf">

    <button class="btn btn-plain k-konto" id="kKonto" onclick="zeige('menu')"

      <span id="lb-konto">Konto</span>

  <main class="inhalt">

// Zeitfenster einer Schicht. Endet sie vor ihrem Beginn, läuft sie über
// Mitternacht in den Folgetag.
function spanne(datum, von, bis) {
  const tag = String(datum || '').slice(0, 10);
  const a = Date.parse(tag + 'T' + hm(von) + ':00');
  let b = Date.parse(tag + 'T' + hm(bis) + ':00');
  if (isNaN(a) || isNaN(b)) return null;
  if (b <= a) b += 864e5;
  return [a, b];
}
