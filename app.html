const LEER = (t, p, ic) => `<div class="karte"><div class="leer">
  <div class="ic"><svg class="i" viewBox="0 0 24 24">${ic || '<circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'}</svg></div>
  <h3>${esc(t)}</h3><p>${esc(p)}</p></div></div>`;

const STATUS_MARKE = {
  geplant: ['geplant', 'm-n'], bestaetigt: ['bestaetigt', 'm-p'],
  provisorisch: ['provisorisch', 'm-w'], abgesagt: ['abgesagt', 'm-x'],
  // ENT-128: vom Server gesetzt, sobald alle zugesagten Personen rapportiert
  // haben -- dieselbe Bedeutung wie im Dashboard, eigene Kopie, weil app.html
  // seine Markierungen unabhaengig fuehrt.
  abgeschlossen: ['abgeschlossen', 'm-p'],
};
const ZUSAGE_MARKE = { zugesagt: ['zugesagt', 'm-p'], abgelehnt: ['abgelehnt', 'm-x'], offen: ['offen', 'm-n'] };

// Eine Schichtkarte. Die Zeit steht vorne und gross -- danach wird draussen
// zuerst gesucht.
function schichtKarte(e, mitDatum) {
  const abgeschlossen = e.status === 'abgeschlossen';
  const ueberfaellig = !abgeschlossen && schichtUeberfaellig(e);
  const bal = e.status === 'abgesagt' ? 'ab' : (e.status === 'provisorisch' ? 'prov' : (e.status === 'bestaetigt' || abgeschlossen ? 'best' : ''));
  const st = STATUS_MARKE[e.status] || STATUS_MARKE.geplant;
  const zu = ZUSAGE_MARKE[e.zusage] || ZUSAGE_MARKE.offen;
  // Der eigene Rapport, sofern schon eingereicht (ENT-133) -- derselbe
  // Abgleich wie im Schichtblatt, nur zusaetzlich schon auf der Karte
  // sichtbar, ohne dafuer erst hineinklicken zu muessen.
  const rap = abgeschlossen ? rapportFuerSchicht(e.id) : null;
  return `<div class="karte${abgeschlossen ? ' abgeschlossen' : ''}${ueberfaellig ? ' ueberfaellig' : ''}">
    ${abgeschlossen ? `<div class="karte-haken" aria-hidden="true" title="${esc(w(st[0]))}">
      <svg class="i" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>` : ''}
    ${ueberfaellig ? `<div class="karte-warn" aria-hidden="true" title="${esc(w('rapportUeberfaellig'))}">⚠️</div>` : ''}
    <button class="schicht" onclick="blattAuf(${Number(e.id)})">
      <div class="oben">
        <span class="balken ${bal}"></span>
        <span class="zeit">${hm(e.von)}<br>${hm(e.bis)}${ueberNacht(e) ? `<span class="folgetag">${esc(w('folgetag'))}</span>` : ''}</span>
        <span class="was">
          <b>${esc(e.titel || e.kunde_name)}</b>
          <span>${esc(e.ort)}${e.strasse ? ' · ' + esc(e.strasse) : ''}</span>
          ${mitDatum ? `<span>${esc(WOCHENTAG[new Date(tagVon(e) + 'T12:00:00').getDay()])}, ${dmy(e.datum)}</span>` : ''}
        </span>
      </div>
    </button>
    <div class="fuss">
      <span class="marke ${st[1]}">${esc(w(st[0]))}</span>
      ${e.status !== 'abgesagt' ? `<span class="marke ${zu[1]}">${esc(w(zu[0]))}</span>` : ''}
      ${Number(e.im_team) > 1 ? `<span class="marke m-n">${Number(e.im_team)} ${esc(w('imTeam'))}</span>` : ''}
      ${rap ? `<span class="marke m-n">${esc(w('schonRapportiert'))} ${dmy(rap.erfasst_am)}, ${String(rap.erfasst_am).slice(11, 16)}</span>` : ''}
      ${ueberfaellig ? `<span class="marke m-w">${esc(w('rapportUeberfaellig'))}</span>` : ''}
    </div>
  </div>`;
}

// Hinweis-Chip bei aktivem/pausiertem Rundgang (ENT-234) -- fuehrt direkt
// zurueck in die Checkliste, ohne den Umweg ueber "Wächter". rundgangAktiv
// existiert nur innerhalb der laufenden Sitzung (gesetzt beim Start/
// Fortsetzen), das reicht fuer den Zweck: schneller Wiedereinstieg waehrend
// desselben App-Aufenthalts, kein zusaetzlicher Serveraufruf bei jedem Laden.
function rundgangChipHtml() {
  if (!rundgangAktiv || rundgangAktiv.status === 'abgebrochen' || rundgangAktiv.status === 'abgeschlossen') return '';
  const kps = rundgangAktiv.kontrollpunkte || [];
  const erledigt = kps.filter(k => k.erledigt).length;
  const pausiert = rundgangAktiv.status === 'pausiert';
  return `<button type="button" class="rd-chip" onclick="rundgangAnzeigen(${Number(rundgangAktiv.einsatz_id)})">
    <span class="rd-chip-ic"><svg class="i i-sm" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M12 19h4a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2H8a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h4"/></svg></span>
    <span class="rd-chip-txt">
      <b>${esc(pausiert ? w('rundgangChipPausiert') : w('rundgangChipLaeuft'))}</b>
      <span>${erledigt} ${esc(w('von'))} ${kps.length} ${esc(w('erledigt'))}</span>
    </span>
    <svg class="chev" viewBox="0 0 24 24"><polyline points="9 5 16 12 9 19"/></svg>
  </button>`;
}

// ══════════════════════════════════════════ HEUTE
function zeichneHeute() {
  const heute = isoTag();
  const jetzt = Date.now();
  // Eine Nachtschicht von gestern gehört noch zu heute, solange sie läuft.
  const laufend = schichten.filter(e => {
    const sp = spanne(e.datum, e.von, e.bis);
    return sp && sp[0] <= jetzt && jetzt < sp[1];
  });
  const heutige = schichten.filter(e => tagVon(e) === heute);
  const zeigen = [...new Set([...laufend, ...heutige])]
    .sort((a, b) => (spanne(a.datum, a.von, a.bis) || [0])[0] - (spanne(b.datum, b.von, b.bis) || [0])[0]);

  let html = rundgangChipHtml();
  if (!zeigen.length) {
    html += LEER(w('keineHeute'), w('keineHeuteText'), '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>');
    const naechste = schichten
      .filter(e => e.status !== 'abgesagt' && (spanne(e.datum, e.von, e.bis) || [0])[0] > jetzt)
      .sort((a, b) => (spanne(a.datum, a.von, a.bis) || [0])[0] - (spanne(b.datum, b.von, b.bis) || [0])[0])[0];
    if (naechste) html += `<div class="titel">${esc(w('naechste'))}</div>` + schichtKarte(naechste, true);
  } else {
    zeigen.forEach(e => {
      const sp = spanne(e.datum, e.von, e.bis);
      const laeuft = sp && sp[0] <= jetzt && jetzt < sp[1];
      const bald = sp && sp[0] > jetzt && sp[0] - jetzt < 3 * 3600e3;
      if (laeuft) html += `<div class="titel" style="color:var(--pos)">● ${esc(w('jetztLaeuft'))}</div>`;
      else if (bald) html += `<div class="titel" style="color:var(--accent)">${esc(w('gleich'))}</div>`;
      html += schichtKarte(e, tagVon(e) !== heute);
    });
  }
  $('v-heute').innerHTML = html;
}

// ══════════════════════════════════════════ PLAN
// ENT-234: Plan + Sperren in einem Reiter mit Unterreitern. zeichnePlan()
// baut nur noch die Huelle (Unterreiter-Leiste + zwei Container); der
// eigentliche Aufbau steht unveraendert in zeichnePlanListe() (frueher
// zeichnePlan()) und in zeichneSperren() -- beide zielen jetzt auf die
// beiden neuen Container statt auf eigene Hauptreiter.
let planUnter = 'plan';
function planUnterWahl(u) {
  planUnter = u;
  $('pu-plan').classList.toggle('on', u === 'plan');
  $('pu-sperren').classList.toggle('on', u === 'sperren');
  $('pu-abwesenheit').classList.toggle('on', u === 'abwesenheit');
  $('plan-inhalt-plan').style.display = u === 'plan' ? '' : 'none';
  $('plan-inhalt-sperren').style.display = u === 'sperren' ? '' : 'none';
  $('plan-inhalt-abwesenheit').style.display = u === 'abwesenheit' ? '' : 'none';
}
function zeichnePlan() {
  $('v-plan').innerHTML = `
    <div class="unterreiter">
      <button id="pu-plan" class="${planUnter === 'plan' ? 'on' : ''}" onclick="planUnterWahl('plan')">${esc(w('plan'))}</button>
      <button id="pu-sperren" class="${planUnter === 'sperren' ? 'on' : ''}" onclick="planUnterWahl('sperren')">${esc(w('sperren'))}</button>
      <button id="pu-abwesenheit" class="${planUnter === 'abwesenheit' ? 'on' : ''}" onclick="planUnterWahl('abwesenheit')">${esc(w('abwesenheit'))}</button>
    </div>
    <div id="plan-inhalt-plan" style="${planUnter === 'plan' ? '' : 'display:none'}"></div>
    <div id="plan-inhalt-sperren" style="${planUnter === 'sperren' ? '' : 'display:none'}"></div>
    <div id="plan-inhalt-abwesenheit" style="${planUnter === 'abwesenheit' ? '' : 'display:none'}"></div>`;
  zeichnePlanListe();
  zeichneSperren();
  zeichneAbwesenheiten();
}
function zeichnePlanListe() {
  const heute = isoTag();
  // ENT-134: der ganze laufende Monat, nicht nur ab heute -- sonst
  // verschwindet eine bereits abgeschlossene Schicht von vorhin aus dem Plan,
  // noch bevor der Monat vorbei ist.
  const monatsanfang = heute.slice(0, 8) + '01';
  const kommend = schichten.filter(e => tagVon(e) >= monatsanfang)
    .sort((a, b) => tagVon(a).localeCompare(tagVon(b)) || String(a.von).localeCompare(String(b.von)));
  if (!kommend.length) {
    $('plan-inhalt-plan').innerHTML = LEER(w('keinePlan'), w('keinePlanText'),
      '<rect x="3" y="4.5" width="18" height="17" rx="2"/><line x1="3" y1="9.5" x2="21" y2="9.5"/>');
    return;
  }
  let letzter = '', html = '';
  kommend.forEach(e => {
    const tag = tagVon(e);
    if (tag !== letzter) {
      letzter = tag;
      const amTag = kommend.filter(x => tagVon(x) === tag && x.status !== 'abgesagt');
      const wd = WOCHENTAG[new Date(tag + 'T12:00:00').getDay()];
      html += `<div class="tag-kopf">
        <span>${esc(wd)}</span><b>${dmy(tag)}</b>
        ${tag === heute ? `<span class="marke m-a">${esc(w('heute'))}</span>` : ''}
        <span class="sp"></span>
        <span class="anz">${amTag.length} ${esc(amTag.length === 1 ? w('schicht') : w('schichten'))}</span>
      </div>`;
    }
    html += schichtKarte(e, false);
  });
  $('plan-inhalt-plan').innerHTML = html;
}

// ══════════════════════════════════════════ SPERRTAGE (ENT-028)
// Wer nicht kann, sagt es hier. Das ist eine Mitteilung an die Planung --
// kein Anspruch und keine Garantie. Genau so steht es auch im Text.
function ladeSperren() {
  const bis = isoTag(new Date(Date.now() + 90 * 864e5));
  return api(`meine_verfuegbarkeit.php?von=${isoTag()}&bis=${bis}`).then(({ ok, data }) => {
    sperrtage = {};
    if (ok && data.status === 'ok') {
      (data.tage || []).forEach(t => { sperrtage[String(t.datum).slice(0, 10)] = t.bemerkung || ''; });
    }
  });
}

function istGesperrt(t) {
  return Object.prototype.hasOwnProperty.call(sperrtage, t);
}

function zeichneSperren() {
  const heute = isoTag();
  const tage = Array.from({ length: 63 }, (_, i) => isoTag(new Date(Date.now() + i * 864e5)));
  // Wo bin ich schon eingeteilt? Einen solchen Tag zu sperren ist ein
  // Widerspruch -- das gehoert sichtbar daneben, nicht verschwiegen.
  const belegt = {};
  schichten.forEach(e => {
    if (e.status === 'abgesagt') return;
    (belegt[tagVon(e)] = belegt[tagVon(e)] || []).push(e);
  });

  const anzahl = tage.filter(istGesperrt).length;
  let html = `<div class="karte"><div class="karte-bd">
      <div style="font-size:15px;font-weight:660;margin-bottom:5px">${esc(w('sperrenTitel'))}</div>
      <div style="font-size:13px;color:var(--ink-2);line-height:1.55">${esc(w('sperrenText'))}</div>
      ${anzahl ? `<div style="margin-top:10px"><span class="marke m-w">${anzahl} ${anzahl === 1 ? 'Tag' : 'Tage'} gesperrt</span></div>` : ''}
    </div></div>`;

  let woche = '';
  tage.forEach(t => {
    const d = new Date(t + 'T12:00:00');
    const kw = kalenderwoche(d);
    if (kw !== woche) {
      woche = kw;
      html += `<div class="titel">Woche ${esc(kw)}</div>`;
    }
    const g = istGesperrt(t);
    const notiz = g ? sperrtage[t] : '';
    const eingeteilt = (belegt[t] || []).length;
    html += `<div class="karte sperr-karte${g ? ' aus' : ''}">
      <button class="sperr-zeile" onclick="sperreUm('${t}')">
        <span class="tg">
          <b>${esc(WOCHENTAG[d.getDay()].slice(0, 2))}</b>
          <span>${dmy(t).slice(0, 5)}</span>
        </span>
        <span class="ws">
          <b>${g ? esc(w('gesperrt')) : esc(w('frei'))}</b>
          ${eingeteilt ? `<span class="warn">${esc(w('sperreEingeteilt'))}</span>`
            : (notiz ? `<span>${esc(notiz)}</span>` : `<span>${t === heute ? 'heute' : ''}</span>`)}
        </span>
        <span class="schalter${g ? ' an' : ''}"><i></i></span>
      </button>
      ${g ? `<button class="sperr-notiz" onclick="sperreNotiz('${t}')">
        <svg class="i i-sm" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
        ${notiz ? esc(w('sperreNotiz')) + ' ändern' : esc(w('sperreNotiz')) + ' hinzufügen'}
      </button>` : ''}
    </div>`;
  });
  $('plan-inhalt-sperren').innerHTML = html;
}

// ISO-Kalenderwoche -- der Donnerstag der Woche entscheidet über das Jahr.
function kalenderwoche(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  const jahresStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return String(Math.ceil(((t - jahresStart) / 864e5 + 1) / 7));
}

// ══════════════════════════════════════════ ABWESENHEITEN (ENT-255)
// Dritter Unterreiter neben Plan/Sperren -- eigene Antraege stellen,
// ansehen und (solange unentschieden) zurueckziehen. Der Feriensaldo steht
// hier bewusst NICHT: das ist eine Auswertung fuer die Verwaltung
// (Dashboard), keine Selbstbedienungsfunktion, und die Kuerzungsregel bei
// langer Krankheit laeuft mit einer ausdruecklich als ANNAHME markierten
// Auslegung (siehe GAV-AUS-012) -- die gehoert nicht ungefragt aufs Handy.
const AW_TYP_TEXT = { ferien: 'typFerien', krankheit: 'typKrankheit', unfall: 'typUnfall',
  militaer: 'typMilitaer', schwangerschaft: 'typSchwangerschaft' };
const AW_STATUS_MARKE = { beantragt: 'm-w', genehmigt: 'm-p', abgelehnt: 'm-x' };
const AW_STATUS_TEXT = { beantragt: 'statusBeantragt', genehmigt: 'statusGenehmigt', abgelehnt: 'statusAbgelehnt' };

function ladeAbwesenheiten() {
  return api('meine_abwesenheit.php').then(({ ok, data }) => {
    meineAbwesenheiten = ok && data.status === 'ok' ? (data.abwesenheiten || []) : [];
  });
}

function zeichneAbwesenheiten() {
  const el = $('plan-inhalt-abwesenheit');
  if (!el) { return; }
  let html = `<div style="padding:14px 16px 6px">
    <button class="btn btn-primary" style="width:100%" onclick="awNeuerAntrag()">${esc(w('neuerAntrag'))}</button>
  </div>`;
  if (!meineAbwesenheiten.length) {
    html += LEER(w('keineAbwesenheiten'), w('keineAbwesenheitenText'),
      '<rect x="3" y="4.5" width="18" height="17" rx="2"/><line x1="3" y1="9.5" x2="21" y2="9.5"/>');
    el.innerHTML = html;
    return;
  }
  const sortiert = [...meineAbwesenheiten].sort((a, b) => String(b.von).localeCompare(String(a.von)));
  html += sortiert.map(a => `
    <div class="karte">
      <div class="karte-bd">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <b style="font-size:14.5px">${esc(w(AW_TYP_TEXT[a.typ] || a.typ))}</b>
          <span class="marke ${AW_STATUS_MARKE[a.status] || 'm-n'}">${esc(w(AW_STATUS_TEXT[a.status] || a.status))}</span>
        </div>
        <div style="font-size:13px;color:var(--ink-2);margin-top:4px">${dmy(a.von)} – ${dmy(a.bis)}</div>
        ${a.bemerkung ? `<div style="font-size:13px;color:var(--ink-2);margin-top:2px">${esc(a.bemerkung)}</div>` : ''}
        ${a.status === 'abgelehnt' && a.ablehnung_grund ? `<div style="font-size:13px;color:var(--neg);margin-top:6px">${esc(a.ablehnung_grund)}</div>` : ''}
        ${a.status === 'beantragt' ? `<button class="btn btn-plain" style="margin-top:10px" onclick="awStornieren(${a.id})">${esc(w('zurueckziehen'))}</button>` : ''}
      </div>
    </div>`).join('');
  el.innerHTML = html;
}

function awNeuerAntrag() {
  blattId = null;
  $('blTitel').textContent = w('abwesenheitTitel');
  $('blBody').innerHTML = `
    <div class="f"><label for="awTyp">${esc(w('abwesenheitArt'))}</label>
      <select class="inp" id="awTyp">
        ${Object.entries(AW_TYP_TEXT).map(([k, txt]) => `<option value="${k}">${esc(w(txt))}</option>`).join('')}
      </select></div>
    <div class="f"><label for="awVon">${esc(w('abwesenheitVon'))}</label><input class="inp" type="date" id="awVon" value="${isoTag()}"></div>
    <div class="f"><label for="awBis">${esc(w('abwesenheitBis'))}</label><input class="inp" type="date" id="awBis" value="${isoTag()}"></div>
    <div class="f"><label for="awBemerkung">${esc(w('bemerkung'))}</label><input class="inp" id="awBemerkung" maxlength="500"></div>`;
  $('blFuss').innerHTML = `
    <button class="btn btn-plain" onclick="blattZu()">${esc(w('abbrechen'))}</button>
    <button class="btn btn-primary" onclick="awAntragSpeichern()">${esc(w('senden'))}</button>`;
  blattZeigen();
}

function awAntragSpeichern() {
  const typ = $('awTyp').value, von = $('awVon').value, bis = $('awBis').value;
  const bemerkung = $('awBemerkung').value.trim();
  if (!von || !bis) { toast(w('beideZeitenNoetig')); return; }
  if (bis < von) { toast(w('vonBisFalsch')); return; }
  if (typ === 'ferien' && von < isoTag()) { toast(w('ferienNichtRueckwirkend')); return; }
  api('meine_abwesenheit.php', { method: 'POST', body: { typ, von, bis, bemerkung } }).then(({ ok, data }) => {
    if (!ok || data.status !== 'ok') { toast(data.message || w('netzfehler')); return; }
    toast(w('antragGesendet'));
    blattZu();
    ladeAbwesenheiten().then(zeichneAbwesenheiten);
  });
}

function awStornieren(id) {
  api('meine_abwesenheit.php', { method: 'POST', body: { id, stornieren: true } }).then(({ ok, data }) => {
    if (!ok || data.status !== 'ok') { toast(data.message || w('netzfehler')); return; }
    toast(w('antragZurueckgezogen'));
    ladeAbwesenheiten().then(zeichneAbwesenheiten);
  });
}

function sperreUm(t) {
  const neu = !istGesperrt(t);
  const notiz = neu ? '' : undefined;
  sperreSpeichern(t, neu, notiz);
}

function sperreSpeichern(t, gesperrt, bemerkung) {
  const rumpf = { datum: t, gesperrt };
  if (bemerkung !== undefined) rumpf.bemerkung = bemerkung;
  return api('meine_verfuegbarkeit.php', { method: 'POST', body: rumpf }).then(({ ok, data }) => {
    if (!ok || data.status !== 'ok') { toast(data.message || w('netzfehler')); return false; }
    if (gesperrt) { sperrtage[t] = data.bemerkung || ''; } else { delete sperrtage[t]; }
    zeichneSperren();
    toast(gesperrt ? w('sperreGesetzt') : w('sperreWeg'));
    return true;
  });
}

function sperreNotiz(t) {
  blattId = null;

// ══════════════════════════════════════════ RAPPORT
function zeichneRapport() {
  // Keine Stundensumme mehr aus den Rapporten (ENT-049) -- massgeblich ist
  // die abgeglichene Zeit unter Profil > Meine Stunden. Eine zweite Zahl
  // zwei Fingertipps daneben haette ihr nur widersprochen.
  let html = `<a class="btn btn-primary btn-wide" href="index.html" style="margin-bottom:8px">
      <svg class="i i-sm" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      ${esc(w('neuerRapport'))}
    </a>
    <p style="font-size:13px;color:var(--ink-3);text-align:center;margin-bottom:6px">${esc(w('zurErfassung'))}</p>
    <div class="titel">${esc(w('meineRapporte'))}</div>`;

  if (!rapporte.length) {
    html += LEER(w('keineRapporte'), w('keineRapporteText'),
      '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>');
  } else {
    html += rapporte.slice(0, 40).map(r => `<div class="karte"><div class="oben" style="display:flex;gap:14px;padding:16px">
        <span class="zeit" style="font-size:16px">${dmy(r.datum)}</span>
        <span class="was" style="flex:1;min-width:0">
          <b>${esc(r.kunde)}</b>
          <span>${esc(r.ort)} · ${hm(r.von)}–${hm(r.bis)}</span>
        </span>
        <span class="marke m-p">${nf(r.netto_h, 2)} h</span>
      </div></div>`).join('');
  }
  $('v-rapport').innerHTML = html;
}

// ══════════════════════════════════════════ WÄCHTER (ENT-234)
// Kachel-Uebersicht, nur sichtbar mit Revierdienst-Bezug (waechterSichtbar(),
// gesetzt in waechterTabAktualisieren()). "Rundgänge" oeffnet die
// objektuebergreifende Uebersicht (rundgangUebersichtOeffnen(), ENT-279-
// Fortsetzung) -- die eigene, bereits zugeteilte Schicht bleibt daneben
// weiterhin ueber "Heute"/"Plan" erreichbar (rundgangAbschnittZeichnen,
// ENT-180/182/145/146/153), keine zweite Checkliste fuer denselben Fall.
// "Fahrzeugübernahme" (ENT-340) steht bewusst NEBEN "Rundgänge" und nicht
// darin: Sie gehoert zum Antritt, nicht zur Runde. Vom Projektinhaber so
// verlangt -- *"bevor ein Rundgang angeklickt wird, die Frage kommt, ob ein
// Dienstfahrzeug im Einsatz ist"* --, weil der Waechter sonst losfaehrt und
// die Uebernahme vergisst. Der Riegel dazu sitzt in fzuTor(); die Kachel ist
// der Weg fuer alle uebrigen Faelle (zweites Fahrzeug am selben Tag, Fahrt
// ohne Rundgang).
// "Schluesselverwaltung" ist inhaltlich entschieden (ENT-149), aber noch
// nicht gebaut -- gleicher Platzhalter-Umgang wie bei den Betrieb-Kacheln
// in dashboard.html (onclick -> toast).
function zeichneWaechter() {
  $('v-waechter').innerHTML = `
    <div class="mk-grid">
      <button type="button" id="mk-rundgang" class="mk-kachel" onclick="rundgangUebersichtOeffnen()">
        <span class="mk-kachel-ic"><svg class="i" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M12 19h4a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2H8a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h4"/></svg></span>
        <span class="mk-kachel-txt"><span class="mk-kachel-lbl">${esc(w('waechterRundgangLbl'))}</span></span>
      </button>
      <button type="button" id="mk-fahrzeug" class="mk-kachel" onclick="fzuOeffnen()">
        <span class="mk-kachel-ic"><svg class="i" viewBox="0 0 24 24"><path d="M5 17H3v-5l2-5h14l2 5v5h-2"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/><line x1="9.5" y1="17" x2="14.5" y2="17"/></svg></span>
        <span class="mk-kachel-txt" id="mk-fahrzeug-txt"><span class="mk-kachel-lbl">${esc(w('fzuKachel'))}</span></span>
      </button>
      <button type="button" id="mk-schluessel" class="mk-kachel" onclick="toast('Folgt in einem späteren Schritt.')">
        <span class="mk-kachel-ic"><svg class="i" viewBox="0 0 24 24"><circle cx="7" cy="15" r="4"/><line x1="10" y1="12" x2="20" y2="2"/><line x1="15" y1="7" x2="18" y2="10"/><line x1="18" y1="4" x2="21" y2="7"/></svg></span>
        <span class="mk-kachel-txt"><span class="mk-kachel-lbl">${esc(w('waechterSchluesselLbl'))}</span></span>
      </button>
    </div>`;
  fzuKachelHinweisZeigen();
}

// Der Hinweis "Aktiv: …" auf der Kachel selbst (Rückmeldung nach ENT-354:
// "kein Hinweis, dass eine Übernahme stattgefunden hat"). Braucht einen
// eigenen Datenabruf, weil die Kachel vorher nie etwas lud -- bewusst erst
// NACH dem synchronen Grundgerüst in zeichneWaechter(), damit das Öffnen
// des Bereichs nicht auf das Netz wartet.
//
// BEWUSST NICHT über fzuLaden(): Diese Funktion würde fzuFahrzeuge,
// fzuHeuteBeantwortet und fzuEingerichtet gleich mit überschreiben -- Felder,
// von denen der tägliche Riegel (fzuTor) abhängt. Ein zusätzlicher,
// beiläufiger Abruf beim blossen Öffnen des Wächter-Bereichs darf den
// bereits bekannten Riegel-Stand nicht überschreiben; er braucht nur EIN
// Feld aus derselben Antwort und liest darum isoliert.
function fzuKachelHinweisZeigen() {
  api('meine_fahrzeuge.php').then(({ ok, data }) => {
    if (!ok || !data || data.status !== 'ok' || !data.mein_aktives_fahrzeug) return;
    const ziel = $('mk-fahrzeug-txt');
    if (!ziel || ziel.querySelector('.mk-kachel-sub')) return;
    ziel.insertAdjacentHTML('beforeend', `<span class="mk-kachel-sub">${esc(w('fzuKachelAktiv')
      .replace('{kennzeichen}', data.mein_aktives_fahrzeug.kennzeichen || ''))}</span>`);
  });
}

/* ══ FAHRZEUGÜBERNAHME (ENT-340) ═══════════════════════════════════════
   Der Weg, den der Projektinhaber beschrieben hat: *"Mitarbeiter steigt in
   Dienstfahrzeug scannt Code, fotografiert Tacho und/oder trägt KM ein,
   wählt Dienstfahrzeug aus, Schickt ab fertig."*

   DREI EINSTIEGE, EIN FORMULAR:
    1. der Aufkleber im Auto (?fz=… beim Start der App, fzuAusUrl),
    2. die Kachel im Wächter-Bereich (fzuOeffnen),
    3. der Riegel vor dem Rundgang (fzuTor).

   Der Riegel ist der eigentliche Auftrag: *"bevor ein Rundgang angeklickt
   wird, die Frage kommt, ob ein Dienstfahrzeug im Einsatz ist... dass der
   Mitarbeiter nicht schon losfährt zum Objekt, in die Rundgänge geht und
   der Prozess der Fahrzeugübernahme vergisst."* Er sitzt vor BEIDEN Wegen
   in den Rundgang -- Kachel und eigene Schicht. Ein Riegel, um den ein Weg
   herumführt, ist keiner.

   Er fragt EINMAL PRO TAG, nicht bei jedem Antippen: Wer die Frage bei
   jeder Runde derselben Nacht wieder sieht, klickt sie weg, ohne sie zu
   lesen -- und dann hat man eine Nachfrage gebaut, die nichts mehr sichert.
   Und "kein Dienstfahrzeug" wird MITGESCHRIEBEN, nicht bloss durchgelassen:
   Sonst liesse sich später nicht unterscheiden, ob jemand ohne Fahrzeug
   unterwegs war oder die Frage nie gesehen hat.

   NIE BLOCKIEREND: Lässt sich die Frage nicht laden, geht es weiter. Der
   Rundgang ist die Pflicht, die Übernahme die Begleitung -- ein Netzfehler
   darf keinen Wächter vor einem verschlossenen Bildschirm stehen lassen. */
let fzuFahrzeuge = null;        // null = noch nicht geladen (nicht: keine)
let fzuEingerichtet = null;     // null = unbekannt, false = Einrichtung fehlt
let fzuHeuteBeantwortet = false;
let fzuGewaehlt = null;         // {id, kennzeichen, bezeichnung, letzter_stand}
let fzuKennung = null;          // aus dem Aufkleber, verlässt das Gerät nur beim Senden
let fzuFoto = null;
let fzuDanach = null;           // was nach dem Abschicken geschehen soll (Riegel)
let fzuMeinAktiv = null;        // {id, kennzeichen, bezeichnung, seit} (ENT-354)
let fzuFremdBestaetigt = false; // zweiter Tipp nach der Doppelbuchungs-Warnung (ENT-354)

function fzuLaden() {
  return api('meine_fahrzeuge.php').then(({ ok, data }) => {
    if (!ok || data.status !== 'ok') { fzuEingerichtet = null; return false; }
    fzuEingerichtet = data.eingerichtet !== false;
    fzuFahrzeuge = data.fahrzeuge || [];
    fzuHeuteBeantwortet = !!data.heute_beantwortet;
    fzuMeinAktiv = data.mein_aktives_fahrzeug || null;
    return true;
  });
}

// "03.09. 06:12" -- fuer die Doppelbuchungs-Warnung und die eigene
// "Aktuell bei dir"-Anzeige (ENT-354). Kein geteilter Formatierer in dieser
// Datei fuer Datum+Zeit zusammen; bewusst lokal statt einer neuen
// Hilfsfunktion fuer diese eine Stelle.
function fzuZeitText(iso) {
  const d = new Date(String(iso || '').replace(' ', 'T'));
  if (isNaN(d)) { return iso || ''; }
  return d.toLocaleDateString('de-CH', { day: '2-digit', month: '2-digit' }) + ' '
       + d.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
}

// Der Riegel. weiter() wird in JEDEM Fall irgendwann aufgerufen -- entweder
// sofort oder nachdem die Frage beantwortet ist.
function fzuTor(weiter) {
  if (fzuHeuteBeantwortet) { weiter(); return; }
  fzuLaden().then(geladen => {
    if (!geladen) { toast(w('fzuNichtAbrufbar')); weiter(); return; }
    // Nicht eingerichtet und "kein Fahrzeug erfasst" sind zwei verschiedene
    // Aussagen -- gefragt wird in beiden Fällen nicht, aber sie werden nicht
    // in einen Topf geworfen: Wer nie ein Fahrzeug erfasst hat, soll keine
    // Frage sehen, und wer die Einrichtung schuldet, merkt es im Cockpit.
    if (!fzuEingerichtet || fzuHeuteBeantwortet || !(fzuFahrzeuge || []).length) { weiter(); return; }
    fzuFrageZeigen(weiter);
  });
}

function fzuFrageZeigen(weiter) {
  fzuDanach = weiter || null;
  $('blTitel').textContent = w('fzuFrageTitel');
  $('blBody').innerHTML = `
    <p style="margin:0 0 6px;font-weight:650">${esc(w('fzuFrage'))}</p>
    <p style="margin:0 0 16px;font-size:13px;color:var(--ink-3)">${esc(w('fzuFrageHinweis'))}</p>
    <div id="fzuFrageErr" class="msg-err" style="display:none"></div>`;
  // Die beiden Antworten stehen UNTEREINANDER, nicht nebeneinander:
  // Nebeneinander passten die zwei Texte auf einem 390-px-Telefon nicht --
  // der rechte Knopf wurde am Rand abgeschnitten. Gemessen am gerenderten
  // Zustand, im Quelltext war davon nichts zu sehen. .gestapelt ist das
  // bestehende Muster dafür (siehe rundgangFussZeichnen).
  const fuss = $('blFuss');
  fuss.className = 'blatt-ft gestapelt';
  fuss.innerHTML = `
    <button class="btn btn-primary" onclick="fzuFormular()">${esc(w('fzuJa'))}</button>
    <button class="btn btn-plain" id="fzuNeinBtn" onclick="fzuOhneFahrzeug()">${esc(w('fzuNein'))}</button>`;
  blattZeigen();
}

// Rein informativ -- kein Scan-Vorgang im Browser. Eine Webseite kann die
// Kamera-App des Telefons nicht im Scan-Modus starten, das kann nur der
// Mensch selbst; ein echter In-App-Scanner (Kamera-Vorschau + JS-Bibliothek)
// wäre mehr Code für etwas, das die eingebaute Kamera bereits zuverlässiger
// kann (ENT-340). Erreichbar über den Hinweis im Formular (fzuFormular).
// Nach dem Lesen scannt die Person mit der eigenen Kamera-App ausserhalb
// dieser Seite -- das öffnet die App über fzuAusKennung() neu.
//
// Ursprünglich stand davor eine eigene Wegwahl-Zwischenmaske (ENT-346).
// Wieder entfernt (ENT-347): Sie sieht nur, wer die App OHNE Scan öffnet --
// wer scannt, kommt über den Aufkleber-Link direkt ins Formular und sieht
// die Wegwahl nie. Für die übrigen war "möchtest du stattdessen scannen?"
// bei jedem Mal ein zusätzlicher Tipp für eine Entscheidung, die durch das
// blosse Öffnen der App ohne Kamera faktisch schon gefallen war. Ein
// Hinweis direkt im Formular sagt dasselbe, ohne den zusätzlichen Schritt.
function fzuAnleitung() {
  $('blTitel').textContent = w('fzuAnleitungTitel');
  $('blBody').innerHTML = `<p style="margin:0;font-size:15px;line-height:1.6">${esc(w('fzuAnleitungText'))}</p>`;
  $('blFuss').className = 'blatt-ft';
  $('blFuss').innerHTML = `<button class="btn btn-plain" onclick="fzuFormular()">${esc(w('zurueck'))}</button>`;
  blattZeigen();
}

// "Nein" ist eine Antwort und wird gespeichert. Scheitert das Speichern,
// geht es trotzdem weiter -- aber der Tag gilt dann NICHT als beantwortet,
// die Frage kommt beim nächsten Mal wieder.
function fzuOhneFahrzeug() {
  const btn = $('fzuNeinBtn'); if (btn) btn.disabled = true;
  api('meine_fahrzeug_uebernahme.php', { method: 'POST', body: { art: 'ohne_fahrzeug' } })
    .then(({ ok, data }) => {
      if (ok && data.status === 'ok') { fzuHeuteBeantwortet = true; toast(w('fzuOhneGespeichert')); }
      else { toast(data.message || w('netzfehler')); }
      fzuWeiter();
    });
}

// Nach dem Abschicken: zurück in den Ablauf, aus dem der Riegel kam. Ohne
// Riegel (Kachel oder Aufkleber) bleibt der Wächter-Bereich stehen.
function fzuWeiter() {
  const w2 = fzuDanach; fzuDanach = null;
  blattZu();
  if (w2) { w2(); }
}

// "Zurück" im Formular heisst ZURÜCK ZUR FRAGE, nicht weiter in den
// Rundgang -- sonst wäre der Riegel mit einem Knopf zu umgehen, und zwar
// mit dem, den man drückt, wenn man sich vertippt hat. Ohne Riegel (Kachel,
// Aufkleber) schliesst er die Schublade.
function fzuZurueck() {
  if (fzuDanach) { fzuFrageZeigen(fzuDanach); return; }
  blattZu();
}

// Die Kachel im Wächter-Bereich. Ist gerade ein Fahrzeug bei dieser Person
// aktiv (ENT-354), steht das zuerst -- "in seiner Maske sichtbar", nicht
// erst nach einer neuen Übernahme-Frage. Über den Riegel (fzuTor) oder den
// Aufkleber (fzuAusKennung) läuft das bewusst NICHT mit: Beide sind eigene,
// bereits ausführlich geprüfte Abläufe, in die diese Anzeige nicht
// hineingehört.
function fzuOeffnen() {
  fzuDanach = null;
  fzuLaden().then(geladen => {
    if (!geladen) { toast(w('fzuNichtAbrufbar')); return; }
    if (fzuMeinAktiv) { fzuAktivZeigen(); return; }
    fzuFormular();
  });
}

// "Aktuell bei dir" (ENT-354) -- rein informativ, kein Riegel. "Abgeben"
// löst nichts in der Kette aus, siehe meine_fahrzeug_uebernahme.php.
function fzuAktivZeigen() {
  const f = fzuMeinAktiv;
  $('blTitel').textContent = w('fzuTitel');
  $('blBody').innerHTML = `
    <p style="margin:0 0 4px;font-size:12.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-3)">${esc(w('fzuAktivLabel'))}</p>
    <p style="margin:0 0 4px;font-size:24px;font-weight:650">${esc(f.kennzeichen || '')}</p>
    <p style="margin:0;font-size:13px;color:var(--ink-3)">${f.bezeichnung ? esc(f.bezeichnung) + ' — ' : ''}${esc(w('fzuAktivSeit'))} ${esc(fzuZeitText(f.seit))}</p>`;
  $('blFuss').className = 'blatt-ft gestapelt';
  $('blFuss').innerHTML = `
    <button class="btn btn-plain" onclick="fzuFormular()">${esc(w('fzuWeiteresFahrzeug'))}</button>
    <button class="btn btn-primary" id="fzuAbgebenBtn" onclick="fzuAbgeben()">${esc(w('fzuAbgeben'))}</button>`;
  blattZeigen();
}

function fzuAbgeben() {
  const f = fzuMeinAktiv; if (!f) return;
  const btn = $('fzuAbgebenBtn'); if (btn) btn.disabled = true;
  api('meine_fahrzeug_uebernahme.php', { method: 'POST', body: { art: 'abgabe', fahrzeug_id: Number(f.id) } })
    .then(({ ok, data }) => {
      if (!ok || data.status !== 'ok') {
        if (btn) btn.disabled = false;
        toast(data.message || w('netzfehler'));
        return;
      }
      fzuMeinAktiv = null;
      toast(w('fzuAbgabeGespeichert'));
      fzuWeiter();
    });
}

// Der Aufkleber im Auto. Das Kennzeichen wird SERVERSEITIG aufgelöst; die
// Kennung selbst wird hier nur weitergereicht und nie angezeigt.
function fzuAusKennung(kennung) {
  api('meine_fahrzeuge.php?kennung=' + encodeURIComponent(kennung)).then(({ ok, data }) => {
    if (!ok || data.status !== 'ok' || !data.fahrzeug) {
      toast(data.message || w('fzuScanUnbekannt'));
      fzuOeffnen();
      return;
    }
    fzuEingerichtet = true;
    fzuKennung = kennung;
    fzuGewaehlt = data.fahrzeug;
    fzuDanach = null;
    fzuFormular();
  });
}

function fzuFormular() {
  const liste = fzuFahrzeuge || [];
  $('blTitel').textContent = w('fzuTitel');
  // Ein Abstecher zur Anleitung und zurück soll keine stehengebliebene
  // Bestätigung mitbringen -- lieber einmal zu oft bestätigen als einmal zu
  // wenig gewarnt werden (ENT-354).
  fzuFremdBestaetigt = false;

  // Vier verschiedene Aussagen, vier Texte.
  if (fzuEingerichtet === false) {
    $('blBody').innerHTML = LEER(w('fzuNichtEingerichtet'), w('fzuNichtEingerichtetText'),
      '<path d="M5 17H3v-5l2-5h14l2 5v5h-2"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/>');
    $('blFuss').className = 'blatt-ft';
    $('blFuss').innerHTML = `<button class="btn btn-plain" onclick="fzuWeiter()">${esc(w('zurueck'))}</button>`;
    blattZeigen();
    return;
  }
  if (!fzuGewaehlt && !liste.length) {
    $('blBody').innerHTML = LEER(w('fzuKeineFahrzeuge'), w('fzuKeineFahrzeugeText'),
      '<path d="M5 17H3v-5l2-5h14l2 5v5h-2"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/>');
    $('blFuss').className = 'blatt-ft';
    $('blFuss').innerHTML = `<button class="btn btn-plain" onclick="fzuWeiter()">${esc(w('zurueck'))}</button>`;
    blattZeigen();
    return;
  }

  // Kam die Person über den Aufkleber, steht das Fahrzeug fest und wird
  // GENANNT statt zur Wahl gestellt: Sie steht davor, eine Auswahlliste wäre
  // eine Gelegenheit, sich zu vertun. "Fest" heisst darum: über den Aufkleber
  // gekommen (fzuKennung gesetzt) -- NICHT einfach "schon einmal etwas
  // gewählt". Sonst zeigte ein erneuter Aufruf dieses Formulars (z. B. nach
  // einem Abstecher zur Anleitung und zurück) fälschlich wieder die feste
  // Anzeige der zuletzt gewählten Zeile, obwohl die Auswahl gar nicht aus
  // dem Aufkleber stammte. Ohne "fest" wird jede stehengebliebene Auswahl
  // verworfen, damit Dropdown und Stand-Zeile zusammenpassen.
  const fest = fzuKennung ? fzuGewaehlt : null;
  if (!fest) { fzuGewaehlt = null; }
  const feld = fest
    ? `<div class="rgs-fakt" style="border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:14px">
         <div class="rgs-fakt-lb">${esc(w('fzuFahrzeug'))}</div>
         <div class="rgs-fakt-wert">${esc(fest.kennzeichen)}</div>
         ${fest.bezeichnung ? `<div class="rgs-leer" style="padding:4px 0 0;font-size:12.5px">${esc(fest.bezeichnung)}</div>` : ''}
       </div>`
    : `<div class="f"><label for="fzuWahl">${esc(w('fzuFahrzeug'))}</label>
         <select class="inp" id="fzuWahl" onchange="fzuWahlGeaendert()">
           <option value="">${esc(w('fzuFahrzeugWahl'))}</option>
           ${liste.map(f => `<option value="${Number(f.id)}">${esc(f.kennzeichen)}${f.bezeichnung ? ' · ' + esc(f.bezeichnung) : ''}</option>`).join('')}
         </select>
       </div>`;

  // Hinweis auf den Aufkleber -- nur, wenn noch keiner gescannt wurde (sonst
  // stände er neben einem bereits feststehenden Fahrzeug und wäre unnötig).
  // Kein Zwischenschritt mehr davor (ENT-347): Wer scannt, kommt ohnehin nie
  // hierher vorbei, und für alle anderen ist ein Hinweis in der Zeile
  // schneller gelesen als ein zusätzlicher Tipp durch eine eigene Maske.
  // Als eigener, ganz antippbarer Knopf statt eines Wort-Links im
  // Fliesstext: Ein Link am Satzende mass am Handy nur rund 33 px hoch --
  // unter den 44 px, die CLAUDE.md für Bedienelemente verlangt. Gemessen
  // am gerenderten Zustand, nicht angenommen.
  const scanHinweis = !fest
    ? `<button type="button" onclick="fzuAnleitung()" style="display:flex;align-items:center;gap:8px;
         width:100%;min-height:44px;margin:0 0 14px;padding:10px 12px;text-align:left;
         font-size:13px;color:var(--ink-2);background:var(--accent-soft);
         border:1px solid var(--accent-line);border-radius:var(--r-sm)">
         <span style="flex:1">${esc(w('fzuTippScan'))}</span>
         <span style="color:var(--accent);font-weight:620;white-space:nowrap">${esc(w('fzuTippScanLink'))}</span>
       </button>`
    : '';

  $('blBody').innerHTML = `
    ${fzuHeuteBeantwortet ? `<p style="margin:0 0 12px;font-size:13px;color:var(--ink-3)">${esc(w('fzuSchonHeute'))}</p>` : ''}
    ${scanHinweis}
    ${feld}
    <div id="fzuStand" style="margin:-4px 0 14px;font-size:13px;color:var(--ink-3)"></div>
    <div class="f"><label for="fzuKm">${esc(w('fzuKm'))}</label>
      <input class="inp" id="fzuKm" type="number" inputmode="numeric" min="0" step="1">
      <div style="font-size:12.5px;color:var(--ink-3);margin-top:4px">${esc(w('fzuKmHinweis'))}</div>
    </div>
    <div class="f" style="margin-bottom:0">
      <label>${esc(w('fzuFoto'))}</label>
      <div id="fzuFotoBereich">
        <button type="button" class="btn btn-plain" style="min-height:44px" onclick="document.getElementById('fzuFotoInput').click()">
          <svg class="i i-sm" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          ${esc(w('fzuFotoAufnehmen'))}
        </button>
      </div>
      <input type="file" accept="image/*" capture="environment" id="fzuFotoInput" onchange="fzuFotoGewaehlt()" style="display:none">
    </div>
    <div id="fzuErr" class="msg-err" style="display:none;margin-top:12px"></div>`;
  // Stapelung der Frage wieder aufheben -- sie gehört zu jenem Schritt.
  $('blFuss').className = 'blatt-ft';
  $('blFuss').innerHTML = `
    <button class="btn btn-plain" onclick="fzuZurueck()">${esc(w('zurueck'))}</button>
    <button class="btn btn-primary" id="fzuBtn" onclick="fzuSenden()">${esc(w('fzuUebernehmen'))}</button>`;
  blattZeigen();
  fzuStandZeichnen();
  if (fzuFoto) { fzuFotoVorschau(); }
}

// Ist die letzte Übernahme dieses Fahrzeugs von jemand anderem als der
// eingeloggten Person? Dieselbe Auskunft entscheidet die Warnung hier UND
// die Bestätigung beim Abschicken (fzuSenden) -- eine Stelle, nicht zwei,
// die auseinanderlaufen könnten (ENT-354).
//
// NUR bei Auswahl aus der Liste, NICHT beim gescannten Aufkleber
// (fzuKennung gesetzt): Wer den Aufkleber scannt, steht vor genau diesem
// Fahrzeug -- eine normale Schichtübergabe scannt routinemässig ein
// Fahrzeug, das zuletzt eine andere Person hatte, und das wäre sonst bei
// JEDER Übergabe eine Warnung, die nichts mehr warnt. Das Risiko, das diese
// Warnung abfängt (ein falsch angetipptes Fahrzeug in der Liste), gibt es
// beim Scan gar nicht.
function fzuIstFremd(st) {
  return !fzuKennung && !!st && st.quelle === 'uebernahme' && st.eigene === false;
}

// Der bekannte Stand -- worauf die Eingabe aufsetzt. "Noch keiner" ist eine
// eigene Aussage und darf nicht wie "0 km" aussehen. Gehört das Fahrzeug
// laut Kette gerade jemand anderem, steht das WARNEND davor (ENT-354) --
// nicht als Ersatz für die Bestätigungspflicht beim Abschicken, sondern
// damit ein falsch angetipptes Fahrzeug schon beim Auswählen auffällt, nicht
// erst beim Absenden.
function fzuStandZeichnen() {
  const el = $('fzuStand'); if (!el) return;
  const st = fzuGewaehlt ? fzuGewaehlt.letzter_stand : null;
  if (!fzuGewaehlt) { el.innerHTML = ''; return; }
  if (!st) { el.textContent = w('fzuStandKeiner'); return; }
  const wann = String(st.zeitpunkt || '').slice(0, 10);
  const standText = w('fzuLetzterStand') + ': ' + Number(st.tacho_km).toLocaleString('de-CH') + ' km'
    + (wann ? ' (' + wann.slice(8, 10) + '.' + wann.slice(5, 7) + '.' + wann.slice(0, 4) + ')' : '')
    + (st.person ? ' — ' + st.person : (st.quelle === 'stammdaten' ? ' — ' + w('fzuStandStamm') : ''));
  if (fzuIstFremd(st)) {
    el.innerHTML = `<div>${esc(standText)}</div>
      <div style="margin-top:6px;color:var(--warn);font-weight:600">${esc(w('fzuFremdWarnung')
        .replace('{person}', st.person || '').replace('{zeit}', fzuZeitText(st.zeitpunkt)))}</div>`;
  } else {
    el.textContent = standText;
  }
}

// Der bekannte Stand kommt mit der Liste, nicht per Nachladen: Ein
// Nachladen je Auswahl wäre ein Wettlauf, an dessen Ende der Stand des
// vorigen Fahrzeugs neben dem neuen stehen kann.
function fzuWahlGeaendert() {
  const el = $('fzuWahl'); if (!el) return;
  const id = Number(el.value || 0);
  fzuGewaehlt = id ? ((fzuFahrzeuge || []).find(f => Number(f.id) === id) || null) : null;
  // Eine neue Auswahl braucht eine neue Bestätigung -- sonst bliebe die
  // Bestätigung eines zuvor gewählten fremden Fahrzeugs an einem später
  // gewählten hängen (ENT-354).
  fzuFremdBestaetigt = false;
  const btn = $('fzuBtn'); if (btn) { btn.textContent = w('fzuUebernehmen'); }
  fzuStandZeichnen();
}

function fzuFotoGewaehlt() {
  const input = $('fzuFotoInput');
  const datei = input && input.files && input.files[0];
  if (!datei) return;
  // Dieselbe Komprimierung wie beim Ersatzscan -- ein rohes Handyfoto
  // sprengt die Grenze im Server.
  rdEsKomprimieren(datei).then(dataUrl => { fzuFoto = dataUrl; fzuFotoVorschau(); })
    .catch(() => toast(w('fzuFotoFehler')));
}

function fzuFotoVorschau() {
  const bereich = $('fzuFotoBereich'); if (!bereich || !fzuFoto) return;
  bereich.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px">
      <img src="${fzuFoto}" alt="" class="rd-es-vorschau">
      <button type="button" class="btn btn-plain" style="min-height:44px" onclick="fzuFotoEntfernen()">${esc(w('fzuFotoEntfernen'))}</button>
    </div>`;
}

function fzuFotoEntfernen() {
  fzuFoto = null;
  const bereich = $('fzuFotoBereich'); if (!bereich) return;
  bereich.innerHTML = `
    <button type="button" class="btn btn-plain" style="min-height:44px" onclick="document.getElementById('fzuFotoInput').click()">
      <svg class="i i-sm" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      ${esc(w('fzuFotoAufnehmen'))}
    </button>`;
}

function fzuSenden() {
  const err = $('fzuErr'); if (err) { err.style.display = 'none'; }
  const zeig = t => { if (err) { err.textContent = t; err.style.display = ''; } else { toast(t); } };
  if (!fzuGewaehlt) { zeig(w('fzuFahrzeugPflicht')); return; }
  const kmEl = $('fzuKm');
  const km = kmEl ? String(kmEl.value).trim() : '';
  if (km === '' || !/^\d+$/.test(km)) { zeig(w('fzuKmPflicht')); return; }
  // Seit ENT-352 Pflicht (vorher ENT-340: "umkehrbar, falls sich das im
  // Betrieb anders anfuehlt") -- eine 5-6-stellige, von Hand eingetippte
  // Zahl vertippt sich leicht, und ohne Beleg faellt das niemandem auf.
  if (!fzuFoto) { zeig(w('fzuFotoPflicht')); return; }

  // Warnung statt Riegel (ENT-354): Steht das Fahrzeug laut Kette gerade bei
  // jemand anderem, braucht es einen zweiten, bestätigenden Tipp -- fängt
  // ein falsch angetipptes Fahrzeug ab, ohne eine normale Übergabe zu
  // blockieren (die selbst genau denselben Ablauf ist: eine andere Person
  // übernimmt, was zuletzt jemand anders hatte). fzuIstFremd() schliesst
  // den gescannten Aufkleber bereits aus.
  const stFuerWarnung = fzuGewaehlt ? fzuGewaehlt.letzter_stand : null;
  if (fzuIstFremd(stFuerWarnung) && !fzuFremdBestaetigt) {
    fzuFremdBestaetigt = true;
    zeig(w('fzuFremdWarnung').replace('{person}', stFuerWarnung.person || '')
      .replace('{zeit}', fzuZeitText(stFuerWarnung.zeitpunkt)));
    const warnBtn = $('fzuBtn'); if (warnBtn) { warnBtn.textContent = w('fzuFremdBestaetigen'); }
    return;
  }

  const btn = $('fzuBtn'); if (btn) btn.disabled = true;
  const body = { art: 'uebernahme', tacho_km: Number(km) };
  // Die Kennung geht mit, wenn der Weg über den Aufkleber lief -- daran
  // hängt, ob der Server die Übernahme als 'qr' oder als 'liste' vermerkt.
  if (fzuKennung) { body.kennung = fzuKennung; } else { body.fahrzeug_id = Number(fzuGewaehlt.id); }
  // Der Einsatz, falls gerade einer läuft -- der Server prüft nach, ob er
  // wirklich der eigene ist, und verwirft ihn sonst.
  const eigener = fzuLaufenderEinsatz();
  if (eigener) { body.einsatz_id = eigener; }
  if (fzuFoto) { body.foto = fzuFoto.replace(/^data:[^,]+,/, ''); }

  api('meine_fahrzeug_uebernahme.php', { method: 'POST', body }).then(({ ok, data }) => {
    if (!ok || data.status !== 'ok') {
      if (btn) btn.disabled = false;
      zeig(data.message || w('netzfehler'));
      return;
    }
    fzuHeuteBeantwortet = true;
    fzuFoto = null; fzuKennung = null; fzuGewaehlt = null;
    toast(data.km_seither !== null && data.km_seither !== undefined
      ? w('fzuGespeichert') + ' ' + w('fzuSeither') + ': ' + Number(data.km_seither).toLocaleString('de-CH') + ' km.'
      : w('fzuGespeichert'));
    fzuWeiter();
  });
}

// Die Schicht, in der die Person gerade steckt -- nur zur Zuordnung. Fehlt
// sie, bleibt die Übernahme trotzdem gültig: Eine spontane Fahrt gehört
// ausdrücklich in die Kette.
function fzuLaufenderEinsatz() {
  if (rundgangAktiv && rundgangAktiv.einsatz_id) { return Number(rundgangAktiv.einsatz_id); }
  const heute = jetztDatetime().slice(0, 10);
  const treffer = (schichten || []).find(e => String(e.datum || '').slice(0, 10) === heute);
  return treffer ? Number(treffer.id) : null;
}

// ── Rundgänge-Übersicht, objektübergreifend (ENT-279-Fortsetzung) ──────
// Zeigt alle aktiven Kontrollrunden-Vorlagen, unabhängig von der eigenen
// Zuteilung des Tages -- fuer den Fall einer spontanen Umdisposition, bei
// der die Person ein Objekt gezielt waehlen muss statt an ihre geplante
// Schicht gebunden zu bleiben. Serverseitig zusaetzlich gegen einen
// generellen Revierdienst-Bezug geprueft (mein_rundgang_vorlagen_alle.php),
// hier keine weitere Bedingung noetig.
let rdSpontanVorlagen = [];
// Der Riegel aus ENT-340 sitzt VOR dem Laden, nicht danach: Wer die Liste
// schon sieht, ist gedanklich unterwegs. Beide Wege in den Rundgang gehen
// hier durch -- dieser und rundgangStarten() an der eigenen Schicht.
function rundgangUebersichtOeffnen() {
  fzuTor(() => rundgangUebersichtLaden());
}

function rundgangUebersichtLaden() {
  api('mein_rundgang_vorlagen_alle.php').then(({ ok, status, data }) => {
    /* Fehlschlag ist nicht dasselbe wie Leere (ENT-338). Vom Projektinhaber
       gemeldet: Ein freigegebener Waechter sah „Es sind aktuell keine
       Kontrollrunden hinterlegt" -- obwohl Runden hinterlegt waren und der
       Server mit 403 geantwortet hatte. Die Meldung war falsch, und sie
       nahm ihm zugleich die Auskunft, was zu tun ist. */
    const gelungen = ok && data.status === 'ok';
    const vorlagen = gelungen ? (data.vorlagen || []) : [];
    rdSpontanVorlagen = vorlagen;
    blattId = null;
    $('blTitel').textContent = w('waechterUebersichtTitel');
    if (!gelungen) {
      const gesperrt = status === 403;
      $('blBody').innerHTML =
        LEER(w(gesperrt ? 'waechterKeinZugriff' : 'waechterLadefehler'),
             gesperrt ? w('waechterKeinZugriffText')
                      : ((data && data.message) || w('waechterLadefehlerText')),
             gesperrt
               ? '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'
               : '<circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>')
        // Ein Funkloch geht vorbei -- dann muss man es erneut versuchen
        // koennen, ohne die Seite zu verlassen. Eine fehlende Freigabe geht
        // nicht vorbei; dort waere der Knopf eine leere Zusage.
        + (gesperrt ? '' : `<button class="btn btn-plain btn-wide" style="margin-top:10px"
             onclick="rundgangUebersichtOeffnen()">${esc(w('nochmal'))}</button>`);
      $('blFuss').innerHTML = `<button class="btn btn-plain" onclick="zeige('waechter')">${esc(w('zurueck'))}</button>`;
      blattZeigen();
      return;
    }
    $('blBody').innerHTML = vorlagen.length
      ? `<div style="display:flex;flex-direction:column;gap:8px">${vorlagen.map(v => `
          <button type="button" class="btn btn-plain btn-wide" style="display:flex;flex-direction:column;align-items:flex-start;height:auto;min-height:44px;padding:12px 14px;white-space:normal;text-align:left;gap:2px" onclick="rgSeiteOeffnen(${Number(v.id)})">
            <div style="font-weight:650">${esc(v.name)}</div>
            <div style="font-size:13px;color:var(--ink-3)">${esc(v.objekt_name)} · ${esc(v.kunde_name)}</div>
            ${v.fenster_von && v.fenster_bis ? `<div style="font-size:13px;color:var(--ink-3)">${esc(hm(v.fenster_von))}–${esc(hm(v.fenster_bis))}</div>` : ''}
          </button>`).join('')}</div>`
      : LEER(w('waechterUebersichtLeer'), w('waechterUebersichtLeerText'),
          '<circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M12 19h4a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2H8a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h4"/>');
    $('blFuss').innerHTML = `<button class="btn btn-plain" onclick="zeige('waechter')">${esc(w('zurueck'))}</button>`;
    blattZeigen();
  });
}

// Gleiche Fenster-Weiche wie rundgangVorlageWaehlen() (ENT-279): innerhalb
// des Fensters sofortiger Start, ausserhalb zuerst ein Pflichtgrund. Ohne
// bestehenden Einsatz -- der entsteht erst serverseitig beim Start.
function rundgangSpontanWaehlen(vorlageId) {
  const v = rdSpontanVorlagen.find(x => Number(x.id) === Number(vorlageId));
  if (!v) return;
  if (v.fenster_von && v.fenster_bis &&
      !rundgangImFenster(jetztDatetime().slice(11, 16), v.fenster_von, v.fenster_bis, RUNDGANG_FENSTER_TOLERANZ_MIN)) {
    rundgangSpontanAusnahmeGrundWahl(vorlageId);
    return;
  }
  rundgangSpontanStarten(vorlageId, null);
}

/* ══ EINSATZMODUS RUNDGANG (ENT-294) ═══════════════════════════════════
   Vorschau einer Kontrollrunde als eigene, dunkle Vollseite -- der
   Zwischenschritt zwischen "Runde angetippt" und "Runde gestartet", den es
   bisher nicht gab: Ein Antippen startete sofort und legte serverseitig
   Einsatz samt Zuteilung an, weshalb blosses Nachschauen Karteileichen
   hinterliess. Diese Seite ist rein lesend (mein_rundgang_uebersicht.php);
   erst der Knopf am Fuss loest den unveraenderten Startweg aus --
   einschliesslich der Fenster-Weiche aus ENT-279, die weiterhin allein in
   rundgangSpontanWaehlen() sitzt und hier NICHT nachgebaut wird. */
// Oeffentliche Notrufnummern der Schweiz (ENT-299). Fest, nicht pflegbar:
// Sie sind gesetzlich vorgegeben und fuer jeden Betrieb dieselben -- ein
// Einstellungsfeld dafuer waere eine Fehlerquelle ohne Nutzen (CLAUDE.md:
// gesetzlich Verbindliches wird korrekt standardisiert, nicht frei
// veraenderbar gemacht). 1414 (Rega) und 145 (Tox) bewusst NICHT dabei: Drei
// Kacheln bleiben im Blick, sechs nicht -- und wer die Rega braucht, erreicht
// sie ueber 144.
const RGS_NOTRUF = [
  { nr: '117', wort: 'rgsPolizei' },
  { nr: '118', wort: 'rgsFeuerwehr' },
  { nr: '144', wort: 'rgsSanitaet' },
];

let rgsVorlageId = null;
let rgsAnsicht = 'uebersicht';   // 'uebersicht' | 'ereignis' | 'aufgaben' -- welche Ebene der Seite offen ist
// Die Seite hat zwei Betriebsarten (ENT-306): 'vorschau' zeigt eine Runde,
// BEVOR sie laeuft (ENT-294), 'lauf' zeigt die laufende. Dieselbe Seite,
// weil es fuer den Waechter derselbe Ort ist -- und weil ein zweiter,
// fast gleicher Vollbildschirm zwei Stellen waeren, die beide stimmen
// muessten.
let rgsModus = 'vorschau';
let rgsReiter = 'punkte';        // 'punkte' | 'karte' | 'funktionen'
// Ob die laufende Runde in dieser Sitzung schon einmal gezeichnet wurde
// (ENT-331). Ohne dieses Merkmal spränge die Ansicht bei jeder neuen
// Position auf die Karte zurück -- wer die Liste offen hat, verlöre sie
// im Sekundentakt.
let rgsLaufBegonnen = false;
let rgsTimerLauf = null;
let rgsLaufTitel = '';
let rgsDaten = null;             // zuletzt geladene Vorschau, damit der Rueckweg keinen neuen Abruf braucht

function rgSeiteOeffnen(vorlageId) {
  rgsVorlageId = Number(vorlageId);
  rgsModus = 'vorschau';
  rgTimerStoppen();
  $('rgsReiter').hidden = true;
  rgZahlenAn(false);
  $('rgsFuss').hidden = false;
  $('rgsTitel').textContent = '–';
  $('rgsBody').innerHTML = `<div class="sk" style="height:104px"></div><div class="sk" style="height:64px"></div>`;
  $('rgsFuss').innerHTML = '';
  rgsFrageZu();
  $('rgSeite').classList.add('on');
  $('rgSeite').setAttribute('aria-hidden', 'false');
  // Die Schublade schliessen: Sie liegt ueber dieser Seite (z-index 61 vs.
  // 55) und wuerde sie sonst verdecken.
  blattZu();
  api('mein_rundgang_uebersicht.php?vorlage_id=' + rgsVorlageId).then(({ ok, data }) => {
    if (rgsVorlageId !== Number(vorlageId)) return;   // zwischenzeitlich weitergetippt
    if (!ok || data.status !== 'ok') {
      rgSeiteZu();
      toast(data.message || w('netzfehler'));
      return;
    }
    rgSeiteZeichnen(data);
  });
}

function rgSeiteZu() {
  rgsVorlageId = null;
  rgsAnsicht = 'uebersicht';
  rgsDaten = null;
  rgsModus = 'vorschau';
  rgsReiter = 'punkte';
  rgsLaufBegonnen = false;   // die naechste Runde beginnt wieder auf der Karte
  rgTimerStoppen();   // sonst tickt er unsichtbar weiter
  rgOrtungStoppen();  // sonst ortet das Geraet weiter, ohne dass es jemand sieht
  rgsMeinOrt = null;  // die Position ueberdauert die Runde nicht
  $('rgsReiter').hidden = true;
  rgZahlenAn(false);
  $('rgsFuss').hidden = false;
  rgsFrageZu();   // eine offene Rueckfrage darf die naechste Seite nicht erben
  $('rgSeite').classList.remove('on');
  $('rgSeite').setAttribute('aria-hidden', 'true');
}

// Der Zurueck-Pfeil im Kopf fuehrt immer genau eine Ebene zurueck: von einer
// Modul-Unterseite auf die Uebersicht, von der Uebersicht aus der Seite
// heraus. Ein Pfeil, der aus einer Unterseite gleich alles schliesst, waere
// derselbe Sackgassen-Fehler wie der fehlende Rueckweg aus ENT-289.
/* Die Zustaende, in denen eine Runde noch laeuft. Als Liste und nicht als
   drei verstreute Vergleiche: Sie wird an mehreren Stellen gebraucht, und
   ein vergessener Zustand hiesse, dass sich die Runde dort doch verlassen
   laesst. */
const RUNDGANG_OFFENE_STATUS = ['vorbereitet', 'laeuft', 'pausiert'];

function rgLaufOffen() {
  return rgsModus === 'lauf' && !!rundgangAktiv
    && RUNDGANG_OFFENE_STATUS.includes(rundgangAktiv.status);
}

function rgSeiteZurueck() {
  if (rgsAnsicht !== 'uebersicht') { rgSeiteZurueckZurUebersicht(); return; }
  /* Eine laufende Runde wird NICHT stillschweigend verlassen (ENT-324).

     Vom Projektinhaber gemeldet: „Bei einem gestarteten Rundgang darf der
     Bereich nicht über den Pfeil verlassen werden ohne Grundangabe."

     Er hat recht, und der Fehler war eine Luecke, keine Entscheidung: Das
     Sicherheitsmuster aus ENT-146 (Beenden fuehrt nie direkt zu einer
     Aenderung, sondern erst zu Pausieren/Abbrechen/Weiter) haengt seit
     jeher am Knopf „Beenden" -- der Zurueck-Pfeil daneben ging daran
     vorbei. Wer ihn drueckte, liess eine Runde offen im System stehen,
     ohne Pause und ohne Abbruchgrund: In der Auswertung sieht das aus wie
     eine Runde, die noch laeuft, waehrend der Waechter laengst weg ist.

     Der Pfeil aendert selbst nichts -- er stellt dieselbe Frage wie
     „Beenden". „Weiter" ist der sichere Ausgang und tut gar nichts. */
  if (rgLaufOffen()) { rundgangBeendenAnzeigen(rundgangAktiv.einsatz_id, 'pfeil'); return; }
  rgSeiteZu();
}

function rgSeiteZurueckZurUebersicht() {
  rgsAnsicht = 'uebersicht';
  // In der laufenden Runde fuehrt der Rueckweg auf den Reiter zurueck, aus
  // dem die Unterseite geoeffnet wurde -- nicht auf die Vorschau, die es
  // hier gar nicht gibt.
  if (rgsModus === 'lauf') {
    $('rgsReiter').hidden = false;
    $('rgsFuss').hidden = true;
    $('rgsFuss').innerHTML = '';
    rgZahlenAn(true);
    $('rgsTitel').textContent = rgsLaufTitel || w('rgsLaufTitel');
    rgLaufZeichnen();
    return;
  }
  if (rgsDaten) { rgSeiteZeichnen(rgsDaten); return; }
  rgSeiteZu();
}

  // Sperre hier waere eine zweite, abweichende Regel.
  // Laeuft die Runde bereits, heisst der Knopf nicht mehr "starten" (ENT-298):

  $('rgsFuss').innerHTML = lf

            }).join('')}</div>

    ${rgsModus === 'lauf' ? `<div class="rgs-mod-lb" id="rgsHilfeLb">${esc(w('rgsHilfe'))}</div>`
    : `<div class="rgs-klapp${rgHilfeOffen() ? ' auf' : ''}" id="rgsKlappHilfe">
      <button type="button" class="rgs-klapp-kopf" onclick="rgHilfeKlapp()"
          aria-expanded="${rgHilfeOffen() ? 'true' : 'false'}">
        <svg class="i i-sm rgs-klapp-pfeil" viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
        <span id="rgsHilfeLb">${esc(w('rgsHilfe'))}</span>
        <span class="rgs-klapp-zahl rgs-klapp-nr">${RGS_NOTRUF.map(n => n.nr).join(' · ')}</span>
      </button>
      <div class="rgs-klapp-bd">`}
    <div class="rgs-hilfe">
      ${z ? `<a class="rgs-zentrale" id="rgsZentrale" href="tel:${esc(String(z.telefon).replace(/\s/g, ''))}">
        <span class="rgs-zentrale-ic">
          <svg class="i i-sm" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.4-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
        </span>
        <span class="rgs-zentrale-txt">
          <span class="rgs-zentrale-lb">${esc(w('rgsZentrale'))}</span>
          <span class="rgs-zentrale-nr">${esc(z.telefon)}</span>
          ${z.name ? `<span class="rgs-zentrale-name">${esc(z.name)}</span>` : ''}
        </span>
      </a>` : `<div class="rgs-leer" id="rgsKeineZentrale" style="padding:2px 2px 6px">${esc(w('rgsKeineZentrale'))}</div>`}
      <div class="rgs-notruf" id="rgsNotruf">
        ${RGS_NOTRUF.map(n => `<a href="tel:${n.nr}" aria-label="${esc(w(n.wort))} ${n.nr}">
          <span class="rgs-notruf-nr">${n.nr}</span>
          <span class="rgs-notruf-wort">${esc(w(n.wort))}</span>

/* Zentrale und Notruf ausklappbar (ENT-335), Wunsch des Projektinhabers:
   „um mehr Übersicht zu erzeugen". Der Block ist der höchste auf der Seite;
   zugeklappt passt die Vorschau auf einen Bildschirm.

   Das REVIDIERT ENT-299 Ziffer 4 („Nicht ausklappbar ... Wer diese Nummern
   braucht, hat keine Hand frei zum Aufklappen") -- aber nur zur Hälfte, und
   die andere Hälfte bleibt bewusst stehen:

   - NUR in der Vorschau, also VOR dem Losgehen. Dort ist niemand im
     Ernstfall, und dort stand der Block dem Überblick im Weg.
   - In der LAUFENDEN Runde bleibt er unverändert offen und ohne Schalter.
     Genau dort greift das Argument aus ENT-299, und es ist nicht schwächer
     geworden: Wer 117 wählen muss, darf nicht vorher aufklappen müssen.
   - Auch zugeklappt NENNT der Kopf die Nummern (117 · 118 · 144). Wer sie
     im Ernstfall sucht, sieht sie ohne einen einzigen Tipp; getippt wird
     nur zum Wählen. Ein Klappblock, der verschweigt, was er verbirgt, wäre
     hier das Falsche.
   - Die Wahl überdauert die Sitzung. Wer den Block offen lässt, findet ihn
     offen wieder -- niemand muss ihn vor jeder Runde erneut aufklappen. */
const RGS_HILFE_SCHLUESSEL = 'sop_rundgang_hilfe_offen';

function rgHilfeOffen() {
  try { return localStorage.getItem(RGS_HILFE_SCHLUESSEL) === 'ja'; }
  catch (e) { return false; }
}

function rgHilfeKlapp() {
  const auf = !rgHilfeOffen();
  try { localStorage.setItem(RGS_HILFE_SCHLUESSEL, auf ? 'ja' : 'nein'); } catch (e) {}
  rgSeiteKlapp('rgsKlappHilfe');
}

function rgSeiteKlapp(id) {
  const el = $(id);
  if (!el) return;
  const auf = el.classList.toggle('auf');
  const kopf = el.querySelector('.rgs-klapp-kopf');
  if (kopf) kopf.setAttribute('aria-expanded', auf ? 'true' : 'false');
}

function rgSeiteStarten() {
  if (rgsVorlageId === null) return;
  rundgangSpontanWaehlen(rgsVorlageId);
}

function rgSeiteZumRundgang() {
  const lf = rgsDaten && rgsDaten.laufend;
  if (!lf) return;
  // ladeSchichten() zuerst: rundgangAnzeigen() sucht den Einsatz im lokalen
  // schichten-Array. Wer diese Seite direkt ueber die objektuebergreifende
  // Uebersicht geoeffnet hat, hat den spontan angelegten Einsatz dort noch
  // nicht -- gleiches Prinzip wie in rundgangSpontanStarten().
  ladeSchichten().then(() => rundgangFortsetzen(lf.einsatz_id));
}

/* ── Rundgang pausieren als Funktion (ENT-298) ─────────────────────────
   Pausieren gab es seit ENT-146, aber nur hinter dem roten "Beenden" in der
   Schublade -- wer nur kurz unterbrechen wollte, musste erst auf einen Knopf
   tippen, der nach Abbruch aussieht. Hier steht es als eigene Funktion.

   Die Rueckfrage ist kein Zierrat: Ein pausierter Rundgang sperrt die
   Kontrollpunkte (rundgangListeZeichnen), und die Pausendauer laeuft in
   pause_minuten mit. Ein Fehlgriff kostet also echte Zeit in einer echten
   Abrechnung. "Nein" ist der Default und tut nichts.

   Es bleiben zwei Wege zum Pausieren (hier und in der Schublade), aber nur
   ein Verhalten: Beide rufen denselben Endpunkt. Der Weg in der Schublade
   bleibt unangetastet -- dort ist die Schublade selbst schon die Rueckfrage,
   eine zweite waere eine Frage auf eine Frage. */
let rgsFrageJa = null;

function rgsFrage(frage, text, jaWort, jaFn) {
  /* Die Schublade zuerst schliessen (ENT-345). Sie liegt mit z-index 61
     UEBER der Rundgang-Seite (55), und dieser Dialog ist ein KIND dieser
     Seite -- sein eigener z-index von 5 gilt nur innerhalb ihres
     Stapelkontexts und kann die Schublade darum nie ueberholen.

     Folge, vom Projektinhaber gemeldet: Wer im Fenster „Ausserhalb der
     üblichen Zeit" einen Grund wählte und auf „Rundgang starten" tippte,
     sah scheinbar NICHTS geschehen -- die Rückfrage stand hinter der
     Maske. Erst das Schliessen über das Kreuz brachte sie zum Vorschein.

     Die Sperre sitzt hier und nicht bei dem einen Aufrufer, der sie
     ausgelöst hat: Jeder künftige rgsFrage()-Aufruf aus einer offenen
     Schublade lief in dieselbe Falle, und der nächste würde sie so wenig
     kommen sehen wie ich. rgSeiteOeffnen() macht es aus demselben Grund
     schon lange so. */
  blattZu();
  rgsFrageJa = jaFn;
  $('rgsDlgLb').textContent = w('rgsWarnung');
  $('rgsDlgFrage').textContent = frage;
  $('rgsDlgTxt').textContent = text || '';
  $('rgsDlgTxt').style.display = text ? '' : 'none';
  $('rgsDlgNein').textContent = w('rgsNein');
  const ja = $('rgsDlgJa');
  ja.textContent = jaWort;
  ja.disabled = false;
  ja.onclick = () => { if (rgsFrageJa) rgsFrageJa(); };
  $('rgsDlg').hidden = false;
  // Der harmlose Ausgang bekommt den Fokus, nicht der folgenreiche.
  $('rgsDlgNein').focus();
}

function rgsFrageZu() {
  rgsFrageJa = null;
  $('rgsDlg').hidden = true;
}

function rgSeitePauseFragen() {
  if (!rgsDaten || !rgsDaten.laufend) return;
  rgsFrage(w('rgsPausierenFrage'), w('rgsPausierenTxt'), w('rgsJa'), rgSeitePausieren);
}

function rgSeitePausieren() {
  const lf = rgsDaten && rgsDaten.laufend;
  if (!lf) return;
  const ja = $('rgsDlgJa'); ja.disabled = true;
  api('mein_rundgang_pausieren.php', { method: 'POST', body: { rundgang_id: lf.id } }).then(({ ok, data }) => {
    ja.disabled = false;
    if (!ok || data.status !== 'ok') { toast(data.message || w('netzfehler')); return; }
    rgsFrageZu();
    lf.status = 'pausiert';
    lf.pausiert_seit = jetztDatetime();
    rgsLaufendUebernehmen(lf);
    rgSeiteZeichnen(rgsDaten);
  });
}

// Fortsetzen ohne Rueckfrage: Es macht die Sperre auf, statt sie zu setzen --
// ein Fehlgriff hier ist folgenlos und sofort umkehrbar.
function rgSeiteFortsetzen() {
  const lf = rgsDaten && rgsDaten.laufend;
  if (!lf) return;
  const btn = $('rgsModPause'); if (btn) btn.disabled = true;
  api('mein_rundgang_fortsetzen.php', { method: 'POST', body: { rundgang_id: lf.id } }).then(({ ok, data }) => {
    if (btn) btn.disabled = false;
    if (!ok || data.status !== 'ok') { toast(data.message || w('netzfehler')); return; }
    lf.status = data.rundgang_status;
    lf.pausiert_seit = null;
    rgsLaufendUebernehmen(lf);
    rgSeiteZeichnen(rgsDaten);
  });
}

// Ist dieselbe Runde auch in der Schublade offen, muss sie denselben Status
// tragen -- sonst zeigt die Checkliste nach dem Zurueckgehen noch den alten
// Zustand und liesse Kontrollpunkte melden, die der Server bereits sperrt.
function rgsLaufendUebernehmen(lf) {
  if (!rundgangAktiv || Number(rundgangAktiv.id) !== Number(lf.id)) return;
  rundgangAktiv.status = lf.status;
  rundgangAktiv.pausiert_seit = lf.pausiert_seit;
}

/* ══ EREIGNIS ERFASSEN (ENT-295) ═══════════════════════════════════════
   Vorfallmeldung als eigene Unterseite im Einsatzmodus -- die erste der
   Modul-Unterseiten, die der Projektinhaber verlangt hat ("die anderen
   bereiche haben alle eigenstaendige unterseiten").

   Bewusst NICHT uebernommen aus dem Vorbild: ein "Anzahl"-Feld (steht bei
   den meisten Arten dauerhaft auf 1 und traegt nichts bei) und die freie
   Aenderbarkeit des Zeitstempels. Bei einer Vorfallmeldung ist der
   Zeitpunkt Teil des Nachweises: erfasst_am steht fest, ein davon
   abweichender Vorfallzeitpunkt wird daneben erfasst statt darueber --
   dasselbe Prinzip wie Rohzeit/bewertete Zeit im GAV-Teil.

   Die Arten kommen aus dem Stammdaten-Katalog (ENT-164), nicht aus einer
   Liste im Quelltext -- die Verwaltung muss sie erweitern koennen. */
const EV_WARTESCHLANGE = 'sop_ereignis_warteschlange';
let evArten = [];
let evFoto = null;      // komprimiertes Foto (data: URL), bis gemeldet wird
let evObjekt = null;    // { id, name } des Objekts, zu dem gemeldet wird

function evWarteschlangeLesen() {
  try { return JSON.parse(localStorage.getItem(EV_WARTESCHLANGE) || '[]'); } catch { return []; }
}
function evWarteschlangeSchreiben(liste) {
  try { localStorage.setItem(EV_WARTESCHLANGE, JSON.stringify(liste)); } catch {}
}

// Sendet alle wartenden Meldungen. Der Endpunkt nimmt mehrere auf einmal --
// wie bei den Kontrollpunkt-Scans. Eine inhaltlich abgelehnte Meldung (z.B.
// zwischenzeitlich entfernte Ereignisart) wird NICHT ewig wiederholt: Sie
// verschwindet aus der Warteschlange, sonst blockiert sie alle spaeteren.
function evWarteschlangeSenden() {
  const liste = evWarteschlangeLesen();
  if (!liste.length) return Promise.resolve();
  return api('mein_ereignis_melden.php', { method: 'POST', body: { meldungen: liste } })
    .then(({ ok, data }) => {
      if (!ok || data.status !== 'ok') return;   // bleibt liegen, naechster Versuch
      const erledigt = new Set((data.ergebnisse || []).map(e => String(e.lokal_id)));
      evWarteschlangeSchreiben(evWarteschlangeLesen().filter(m => !erledigt.has(String(m.lokal_id))));
    })
    .catch(() => {});
}

/* ── Aufgaben je Kontrollpunkt (ENT-304) ──────────────────────────────
   Katalog und Verknuepfung stammen aus ENT-302 (Verwaltungsseite, parallele
   Sitzung). Hier werden sie zum ersten Mal dem gezeigt, der sie ausfuehrt.

   Gruppiert nach Kontrollpunkt, nicht als flache Liste: "Tuere verschliessen"
   heisst an der Tiefgarage etwas anderes als am Haupteingang, und die Runde
   laeuft ohnehin Punkt fuer Punkt. Punkte OHNE Aufgabe stehen bewusst mit
   drin -- sonst liesse sich nicht unterscheiden, ob ein Punkt keine Aufgabe
   hat oder ob er in dieser Runde gar nicht vorkommt (CLAUDE.md: "unbekannt"
   darf nie wie "keine" aussehen).

   Rein lesend, so vom Projektinhaber verlangt ("rein visuell"). Der Hinweis
   am Kopf sagt das ausdruecklich, damit niemand auf eine Zeile tippt und auf
   einen Haken wartet, den es noch nicht gibt. */

  return (punkte || []).reduce((n, k) => n + ((k.aufgaben || []).length), 0);
}

function evSenden() {
  const err = $('evErr');
  err.style.display = 'none';
  const artEl = $('evArt');
  const artId = artEl ? Number(artEl.value) : 0;
  if (!artId) { err.textContent = w('evArtPflicht'); err.style.display = ''; return; }

  const erfasstAm = jetztDatetime();
  let vorfallAm = null;
  const vEl = $('evVorfall');
  if (vEl && vEl.value) {
    vorfallAm = vEl.value.replace('T', ' ') + ':00';
    if (vorfallAm > erfasstAm) { err.textContent = w('evVorfallZukunft'); err.style.display = ''; return; }
  }

  const btn = $('evSpeichern');
  if (btn) btn.disabled = true;

  // Standort einmalig im Moment des Meldens -- macht die Meldung als
  // Nachweis brauchbar. Ausdruecklich keine Verfolgung (ENT-131): kein
  // watchPosition, und ohne Standortfreigabe wird trotzdem gemeldet.
  const standort = new Promise(fertig => {
    if (!navigator.geolocation) { fertig({}); return; }
    let erledigt = false;
    const einmal = wert => { if (!erledigt) { erledigt = true; fertig(wert); } };
    navigator.geolocation.getCurrentPosition(
      p => einmal({ lat: p.coords.latitude, lng: p.coords.longitude }), () => einmal({}));
    setTimeout(() => einmal({}), 4000);
  });

  standort.then(ort => {
    const meldung = {
      lokal_id: 'ev' + Date.now() + Math.random().toString(36).slice(2, 7),
      objekt_id: evObjekt ? Number(evObjekt.id) : 0,
      rundgang_id: (rundgangAktiv && rundgangAktiv.id) || null,
      einsatz_id: (rundgangAktiv && rundgangAktiv.einsatz_id) || null,
      ereignisart_id: artId,
      erfasst_am: erfasstAm,
      vorfall_am: vorfallAm,
      bemerkung: ($('evText') && $('evText').value.trim()) || '',
      foto: evFoto ? evFoto.split(',')[1] : null,
      lat: ort.lat !== undefined ? ort.lat : null,
      lng: ort.lng !== undefined ? ort.lng : null,
    };
    // Erst lokal festhalten, dann senden -- der Erfassungszeitpunkt zaehlt,
    // nicht die Uebermittlung (ENT-132). Bricht das Netz weg, steht die
    // Meldung trotzdem und geht beim naechsten Netzkontakt raus.
    const liste = evWarteschlangeLesen();
    liste.push(meldung);
    evWarteschlangeSchreiben(liste);

    return api('mein_ereignis_melden.php', { method: 'POST', body: { meldungen: [meldung] } })
      .then(({ ok, data }) => {
        if (btn) btn.disabled = false;
        const erg = ok && data.status === 'ok' ? (data.ergebnisse || [])[0] : null;
        if (erg && erg.status === 'fehler') {
          // Inhaltlich abgelehnt: nicht in der Warteschlange liegen lassen,
          // sie wuerde sonst bei jedem Netzkontakt erneut scheitern.
          evWarteschlangeSchreiben(evWarteschlangeLesen().filter(m => m.lokal_id !== meldung.lokal_id));
          err.textContent = erg.message || w('netzfehler');
          err.style.display = '';
          return;
        }
        if (erg && erg.status === 'ok') {
          evWarteschlangeSchreiben(evWarteschlangeLesen().filter(m => m.lokal_id !== meldung.lokal_id));
          toast(w('evGemeldet'));
        } else {
          toast(w('evWartet'));   // bleibt in der Warteschlange
        }
        rgSeiteZurueckZurUebersicht();
      })
      .catch(() => {
        if (btn) btn.disabled = false;
        toast(w('evWartet'));
        rgSeiteZurueckZurUebersicht();
      });
  });
}

// Nach Erfolg wird ladeSchichten() neu geladen: der spontan angelegte
// Einsatz muss im lokalen schichten-Array stehen, bevor rundgangAnzeigen()
// ihn dort findet (gleiches Prinzip wie ueberall sonst -- schichten kommt
// ausschliesslich vom Server, nie lokal erfunden).
/* trotzDoppel: der zweite Anlauf, nachdem die Kollision bestaetigt wurde
   (ENT-342). Die Sperre ist gefallen -- der Disponent plant kurzfristig um,
   der Waechter steht vor dem Objekt, und dann ist der Planer oft nicht am
   Telefon. Geblieben ist die Rueckfrage: blockieren, bis es GESEHEN ist,
   nicht bis es aufgeloest ist (gleiches Muster wie ENT-284). */
function rundgangSpontanStarten(vorlageId, ausnahmeGrund, trotzDoppel) {
  document.querySelectorAll('#blBody button, #rfsBtn').forEach(b => b.disabled = true);
  const body = { vorlage_id: vorlageId };
  if (ausnahmeGrund) body.ausnahme_grund = ausnahmeGrund;
  if (trotzDoppel) body.trotz_doppelbelegung = true;
  api('mein_rundgang_spontan_starten.php', { method: 'POST', body }).then(({ ok, data }) => {
    // Dieselbe Vorlage laeuft fuer diese Person schon (ENT-290, gemeldeter
    // Fehler: zweimal angetippt landete bisher in der Doppelbelegungs-Sperre
    // ohne Weg zurueck, siehe Kommentar im Endpunkt) -- die bestehende Runde
    // fortsetzen, genau wie ueber "Plan"/"Heute", statt eine zweite zu
    // versuchen.
    if (ok && data.status === 'laeuft_bereits') {
      ladeSchichten().then(() => rundgangFortsetzen(data.einsatz_id));
      return;
    }
    // Zur selben Zeit anderswo eingeteilt: fragen statt sperren (ENT-342).
    // Der Klartext der Kollision steht in der Frage -- wer sie liest, kann
    // selbst entscheiden, ob er vorher doch kurz anruft.
    if (!ok && data && data.code === 'doppelbelegung') {
      document.querySelectorAll('#blBody button, #rfsBtn').forEach(b => b.disabled = false);
      rgsFrage(w('rgsDoppelFrage'),
        ((data.kollision && data.kollision.was) ? data.kollision.was + '\n\n' : '')
          + w('rgsDoppelTxt'),
        w('rgsDoppelJa'),
        () => { rgsFrageZu(); rundgangSpontanStarten(vorlageId, ausnahmeGrund, true); });
      return;
    }
    if (!ok || data.status !== 'ok') {
      document.querySelectorAll('#blBody button, #rfsBtn').forEach(b => b.disabled = false);
      toast(data.message || w('netzfehler'));
      return;
    }
    // Der Start ist gelungen, aber die Meldung an die Disposition nicht
    // (ENT-342). Das gehoert gesagt -- der Waechter darf nicht glauben,
    // die Umplanung sei damit dokumentiert.
    if (data.ereignis_fehler) { toast(data.ereignis_fehler); }
    rundgangAktiv = { id: data.rundgang_id, einsatz_id: data.einsatz_id, status: 'vorbereitet', pausiert_seit: null,
      vorbereitet_am: jetztDatetime(), pause_minuten: 0,
      kontrollpunkte: (data.kontrollpunkte || []).map(k => ({ ...k, erledigt: null })) };
    ladeSchichten().then(() => rundgangAnzeigen(data.einsatz_id));
  });
}

//

//    im Menü nur die Kachel -- KEINE Zahl. Das ist Absicht: Seit ENT-049 darf
//    eine Stundensumme nie ohne den Hinweis erscheinen, dass sie keine
//    Lohnabrechnung ist. Eine "Vorschau" auf der Kachel wuerde genau das tun.
// 2. Beim Verlassen des Menüs faellt die Unterseite von selbst zusammen,
//    weil zeichneMenu() neu zeichnet. Kein Zustand, der haengen bleibt.
function stdSeiteAuf() {

  if (!h || !u) return;

  u.style.display = '';
