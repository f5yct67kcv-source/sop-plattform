<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<!-- Kein Zoom (ENT-059) -- dieselbe Begruendung wie im Cockpit.
     viewport-fit=cover bleibt: es haelt den Inhalt aus der Notch. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cockpit</title>
<link rel="icon" href="icons/icon-32.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#16181D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ══════════════════════════════════════════════════════════════════
   MITARBEITER-APP — dieselben Farben wie das Dashboard, aber eigener
   Aufbau: grosse Flächen, untere Reiterleiste, dicke Zeitangaben.
   Gedacht für draussen: kurze Blicke, kalte Finger, helles Licht.
   ══════════════════════════════════════════════════════════════════ */

/* Kein Zoom durch Doppeltippen oder Feld-Fokus (ENT-059). */
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
.inp, input, select, textarea { font-size: 16px; }

:root {
  --shell:  #16181D;  --shell-hi: #1E2128;  --shell-line: #272B33;
  --shell-txt: #9298A5; --shell-txt-hi: #F3F5F8;
  --bg: #F4F6F8;  --surface: #FFFFFF;  --line: #E5E8EC;  --line-soft: #EFF1F4;
  --ink: #14161A;  --ink-2: #545B67;  --ink-3: #8B919D;
  --accent: #2F5BD7;  --accent-hi: #2549B0;  --accent-soft: #EDF2FE;  --accent-line: #CBD9F9;
  --pos: #0E7C55;  --pos-soft: #E6F6EF;
  --neg: #C2382A;  --neg-soft: #FCEDEB;
  --warn: #9A6B08; --warn-soft: #FBF3E0;
  --r-sm: 9px; --r: 14px; --r-lg: 20px;
  --sh-1: 0 1px 2px rgba(16,18,22,.06);
  --sh-2: 0 10px 30px -10px rgba(16,18,22,.22);
  --sh-3: 0 -8px 32px -12px rgba(16,18,22,.24);
  --tab-h: 62px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
}
.num, .zeit, b, strong { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
svg.i { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i-sm { width: 17px; height: 17px; }

/* ── Bedienelemente: grosse Ziele, draussen bedienbar */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 18px; border: 1px solid transparent; border-radius: var(--r-sm);
  font: inherit; font-size: 15px; font-weight: 640; cursor: pointer; text-decoration: none;
  transition: background .13s, border-color .13s; white-space: nowrap;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:active { background: var(--accent-hi); }
.btn-plain { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn-plain:active { background: var(--bg); }
.btn-pos { background: var(--pos-soft); color: var(--pos); border-color: #BCE5D3; }
.btn-neg { background: var(--neg-soft); color: var(--neg); border-color: #F3C8C2; }
.btn-wide { width: 100%; }
/* Ein Knopf mit Unterzeile (ENT-324). Der Grundknopf ist eine waagrechte
   Flex-Reihe mit nowrap -- ein zweizeiliger Inhalt braucht darum beides
   umgestellt, sonst stuenden Titel und Erklaerung nebeneinander und der
   Text liefe aus dem Knopf heraus. Die Mindesthoehe waechst mit: 48 px
   reichen fuer eine Zeile, nicht fuer zwei. */
.btn-unter { display: block; font-size: 12.5px; font-weight: 450; opacity: .8;
  margin-top: 3px; white-space: normal; line-height: 1.35; }
.btn:has(.btn-unter) { flex-direction: column; justify-content: center; gap: 0;
  min-height: 60px; padding: 11px 16px; white-space: normal; text-align: center; }
.btn:disabled { opacity: .5; }
.f { margin-bottom: 16px; }
.f label { display: block; font-size: 12px; font-weight: 660; color: var(--ink-2); letter-spacing: .4px; text-transform: uppercase; margin-bottom: 7px; }
.inp {
  width: 100%; min-height: 48px; border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 12px 14px; font: inherit; font-size: 16px; color: var(--ink);
  background: var(--surface); -webkit-appearance: none; appearance: none;
}
/* Passwortfeld mit Auge (ENT-291). Gleiche Bedienung wie im Cockpit:
   maskiert als Normalzustand, sichtbar nur auf Knopfdruck und nur bis die
   Maske neu aufgebaut wird. Auf dem Handy ist das Auge die volle Feldhoehe
   hoch (48 px), damit es mit dem Daumen zu treffen ist. */
.pw-feld { position: relative; }
.pw-feld .inp { padding-right: 50px; }
.pw-toggle {
  position: absolute; right: 0; top: 0; bottom: 0; width: 46px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: 0; padding: 0; cursor: pointer;
  font-size: 18px; line-height: 1; opacity: .55;
}
.pw-toggle:hover { opacity: 1; }
.pw-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.msg-err { font-size: 14px; color: var(--neg); background: var(--neg-soft); border-radius: var(--r-sm); padding: 11px 13px; margin-bottom: 16px; }
.msg-ok { font-size: 14px; color: var(--pos); background: var(--pos-soft); border-radius: var(--r-sm); padding: 11px 13px; margin-bottom: 16px; }
/* Passwort-vergessen/-zuruecksetzen im Gate (ENT-373). */
.gate-link { display: block; width: 100%; margin-top: 14px; padding: 4px; background: none; border: 0;
  color: var(--ink-2); font: inherit; font-size: 13.5px; font-weight: 620; text-align: center; cursor: pointer;
  min-height: 44px; }
.gate-hinweis { font-size: 13.5px; color: var(--ink-2); line-height: 1.5; margin: 0 0 16px; }

/* Unterschrift: Knopf und Vorschau kommen aus unterschrift.js (ENT-292), das
   auch index.html laedt -- eine Unterschrift, egal ueber welchen Weg. Das
   kleine 160-px-Feld von ENT-082 ist damit entfallen; es war nicht als
   Unterschriftsfeld zu erkennen und viel zu klein zum Schreiben. */

/* ══════════════════════════════════════════ ZUGANG */
#gate { position: fixed; inset: 0; z-index: 900; background: var(--shell); display: flex; flex-direction: column; padding: 28px 22px calc(28px + env(safe-area-inset-bottom)); }
.gate-oben { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.gate-oben img { width: 66px; height: 66px; border-radius: 18px; background: #fff; padding: 5px; margin-bottom: 18px; }
.gate-oben .wm { color: var(--shell-txt-hi); font-size: 26px; font-weight: 700; letter-spacing: -.5px; }
.gate-oben .sub { color: #656B78; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; margin-top: 4px; }
.gate-form { background: var(--surface); border-radius: var(--r-lg); padding: 22px; box-shadow: var(--sh-2); }

/* ══════════════════════════════════════════ GERÜST */
.app { display: none; min-height: 100%; flex-direction: column; }
.app.on { display: flex; }
.kopf {
  background: var(--shell); color: var(--shell-txt-hi);
  padding: calc(14px + env(safe-area-inset-top)) 20px 16px;
  display: flex; align-items: center; gap: 14px;
}
.kopf .wer { flex: 1; min-width: 0; }
.kopf .wer b { display: block; font-size: 17px; font-weight: 680; letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kopf .wer span { font-size: 12.5px; color: var(--shell-txt); }
.kopf .kreis { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex: none; }

.inhalt { flex: 1; padding: 18px 16px calc(var(--tab-h) + 26px + env(safe-area-inset-bottom)); }
.v { display: none; }
.v.on { display: block; animation: auf .18s ease-out; }
@keyframes auf { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.titel { font-size: 13px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--ink-3); margin: 4px 0 12px; }
.titel:not(:first-child) { margin-top: 28px; }

/* ── Untere Reiterleiste */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  background: rgba(255,255,255,.94); backdrop-filter: saturate(180%) blur(14px); -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-top: 1px solid var(--line);
  display: flex; padding-bottom: env(safe-area-inset-bottom);
}
.tabs button {
  flex: 1; min-height: var(--tab-h); border: none; background: transparent; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--ink-3); font: inherit; font-size: 11px; font-weight: 620; padding: 6px 2px;
}
.tabs button.on { color: var(--accent); }
.tabs button .punkt { width: 5px; height: 5px; border-radius: 50%; background: var(--neg); position: absolute; margin: -16px 0 0 18px; }

/* ── Karten */
.karte { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh-1); margin-bottom: 12px; overflow: hidden; }
.karte-bd { padding: 16px; }
/* Abgeschlossene Schicht (ENT-133): auf einen Blick erkennbar, ohne den
   Rapport-Korrekturweg zu sperren -- die Karte bleibt anklickbar. */
.karte.abgeschlossen { border-color: var(--pos); background: var(--pos-soft); }
.karte-haken { position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; border-radius: 50%;
  background: var(--pos); color: #fff; display: flex; align-items: center; justify-content: center; }
.karte-haken svg { width: 14px; height: 14px; stroke-width: 2.6; }
/* Ueberfaelliger Rapport (ENT-134): Schicht seit ueber 2 Std. zu Ende, kein
   eigener Rapport hinterlegt. Warnfarbe statt Fehlerfarbe -- es ist noch kein
   Fehlschlag, nur eine Erinnerung, und die Karte bleibt so anklickbar wie jede
   andere auch. */
.karte.ueberfaellig { border-color: var(--warn); background: var(--warn-soft); }
.karte-warn { position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; border-radius: 50%;
  background: var(--warn); color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 14px; line-height: 1; }

/* ── Schichtkarte: die Zeit ist die wichtigste Angabe */
.schicht { display: block; width: 100%; text-align: left; border: none; background: transparent; font: inherit; color: inherit; cursor: pointer; padding: 0; }
.schicht .oben { display: flex; align-items: flex-start; gap: 14px; padding: 16px; }
.schicht .zeit { font-size: 21px; font-weight: 720; letter-spacing: -.6px; white-space: nowrap; }
.schicht .zeit .folgetag { display: block; font-size: 11px; font-weight: 620; color: var(--ink-3); letter-spacing: 0; }
.schicht .was { flex: 1; min-width: 0; }
.schicht .was b { display: block; font-size: 15.5px; font-weight: 660; }
.schicht .was span { display: block; font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }
.schicht .balken { width: 4px; align-self: stretch; border-radius: 3px; background: var(--accent); flex: none; }
.schicht .balken.prov { background: var(--warn); }
.schicht .balken.ab { background: var(--ink-3); }
.schicht .balken.best { background: var(--pos); }
.fuss { display: flex; align-items: center; gap: 8px; padding: 11px 16px; border-top: 1px solid var(--line-soft); background: #FCFDFE; flex-wrap: wrap; }

.marke { display: inline-flex; align-items: center; gap: 5px; border-radius: 20px; padding: 4px 11px; font-size: 12px; font-weight: 660; white-space: nowrap; }
.m-n { background: var(--line-soft); color: var(--ink-2); }
.m-a { background: var(--accent-soft); color: var(--accent); }
.m-p { background: var(--pos-soft); color: var(--pos); }
.m-w { background: var(--warn-soft); color: var(--warn); }
.m-x { background: var(--neg-soft); color: var(--neg); }

/* ── Tagesüberschrift im Plan */
/* Der Tageskopf muss auch auf 320px halten: der Wochentag wird notfalls
   gekuerzt, die Anzahl rutscht notfalls auf eine zweite Zeile. */
.tag-kopf { display: flex; flex-wrap: wrap; align-items: baseline; gap: 9px; margin: 22px 2px 10px; }
.tag-kopf > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag-kopf .anz { flex: none; margin-left: auto; }
.tag-kopf b { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
.tag-kopf span { font-size: 12.5px; font-weight: 640; letter-spacing: .6px; text-transform: uppercase; color: var(--ink-3); }
.tag-kopf .sp { flex: 1; }

/* ── Sperrtage (ENT-028) */
.sperr-karte { margin-bottom: 8px; }
.sperr-karte.aus { border-color: var(--warn); background: var(--warn-soft); }
.sperr-zeile { display: flex; align-items: center; gap: 13px; width: 100%; padding: 12px 14px;
  border: none; background: none; font-family: inherit; text-align: left; cursor: pointer; min-height: 58px; }
.sperr-zeile .tg { flex: none; width: 46px; }
.sperr-zeile .tg b { display: block; font-size: 14px; font-weight: 700; }
.sperr-zeile .tg span { display: block; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.sperr-zeile .ws { flex: 1; min-width: 0; }
.sperr-zeile .ws b { display: block; font-size: 14.5px; font-weight: 640; }
.sperr-zeile .ws span { display: block; font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sperr-zeile .ws .warn { color: var(--warn); font-weight: 620; }
/* Der Schalter zeigt den Zustand, ohne dass man den Text lesen muss. */
.schalter { flex: none; width: 48px; height: 28px; border-radius: 999px; background: var(--line); position: relative; transition: background .18s; }
.schalter i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
  background: #fff; box-shadow: var(--sh-1); transition: transform .18s; }
.schalter.an { background: var(--warn); }
.schalter.an i { transform: translateX(20px); }
.sperr-notiz { display: flex; align-items: center; gap: 7px; width: 100%; padding: 10px 14px;
  border: none; border-top: 1px solid rgba(154,107,8,.22); background: none; font-family: inherit;
  font-size: 12.5px; font-weight: 620; color: var(--warn); cursor: pointer; min-height: 42px; }
@media (prefers-reduced-motion: reduce) { .schalter, .schalter i { transition: none; } }

/* ── Leerzustand */
.leer { text-align: center; padding: 46px 22px; }
.leer .ic { width: 52px; height: 52px; border-radius: 16px; background: var(--line-soft); color: var(--ink-3); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px; }
.leer h3 { font-size: 16px; font-weight: 660; margin-bottom: 6px; }
.leer p { font-size: 14px; color: var(--ink-3); line-height: 1.6; }

/* ── Kennzahl-Paar */
.zahlen { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.zahl { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 15px 16px; box-shadow: var(--sh-1); }
.zahl b { display: block; font-size: 25px; font-weight: 720; letter-spacing: -.8px; line-height: 1.15; }
.zahl span { font-size: 11.5px; font-weight: 650; letter-spacing: .5px; text-transform: uppercase; color: var(--ink-3); }
.zahl { position: relative; }
/* Fragezeichen in der Ecke der Zeitbonus-Kachel (ENT-052). Bewusst gross
   genug zum Antippen (42 px), auch wenn das Symbol darin klein ist -- eine
   30-Pixel-Flaeche trifft auf dem Handy niemand zuverlaessig. */
.zahl-info {
  position: absolute; top: 3px; right: 3px; width: 42px; height: 42px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: none; padding: 0; border-radius: 50%;
  color: var(--ink-3); cursor: pointer;
}
.zahl-info:active { background: var(--line-soft); }
/* Hinweis auf noch nicht abgeglichene Schichten (ENT-053). Bewusst in
   ruhigem Grau und nicht in Warnfarbe: Im laufenden Monat ist ein offener
   Abgleich der Normalfall, keine Stoerung. */
.offen-hinweis {
  font-size: 13px; line-height: 1.4; color: var(--ink-3);
  padding: 10px 14px; margin-bottom: 12px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); box-shadow: var(--sh-1);
}
.zahl-info svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ── Angabenliste */
.dl { display: grid; grid-template-columns: 40% 1fr; gap: 0 12px; }
.dl dt { font-size: 12px; font-weight: 650; letter-spacing: .3px; text-transform: uppercase; color: var(--ink-3); padding: 11px 0; border-bottom: 1px solid var(--line-soft); }
.dl dd { font-size: 15px; font-weight: 550; padding: 11px 0; border-bottom: 1px solid var(--line-soft); word-break: break-word; }
.dl dt:last-of-type, .dl dd:last-of-type { border-bottom: none; }

/* Unterlagen zur Schicht (ENT-117). Ganze Zeile als Trefferfläche und
   mindestens 44 px hoch -- am Bauzaun wird das mit Handschuhen getippt. */
/* Wer sonst eingeteilt ist (ENT-121). Der Aufklapper ist ein Bedienelement
   auf einem Telefon und haelt die Trefferflaeche von 44 px ein. */
.team-auf { display: inline-flex; align-items: center; gap: 7px; min-height: 44px;
  padding: 0; border: none; background: none; color: var(--ink); font: inherit;
  font-size: 13.5px; font-weight: 550; cursor: pointer; text-align: left; }
.team-pfeil { width: 15px; height: 15px; flex: none; stroke: currentColor; stroke-width: 2;
  fill: none; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s; }
.team-auf[aria-expanded="true"] .team-pfeil { transform: rotate(180deg); }
.team-liste { display: none; margin: 0 0 6px; padding: 0; list-style: none; }
.team-liste.auf { display: block; }
.team-liste li { font-size: 13.5px; padding: 5px 0 5px 13px; position: relative; color: var(--ink); }
/* Punkt statt Aufzaehlungszeichen -- die Liste steht in einer Datenzeile und
   soll nicht wie ein eigener Absatz wirken. */
.team-liste li::before { content: ''; position: absolute; left: 0; top: 12px;
  width: 4px; height: 4px; border-radius: 50%; background: var(--ink-3); }
.team-liste li.ich { font-weight: 650; }
.team-du { font-size: 11.5px; color: var(--ink-3); font-weight: 500; }

/* Der Routenknopf steht in der Adresszeile und ist ein echtes Bedienelement
   auf einem Telefon -- 44 px Trefferflaeche wie jedes andere auch. */
.route-knopf { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px;
  min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); color: var(--ink); font-size: 13.5px; font-weight: 620;
  text-decoration: none; }
.route-knopf:active { background: var(--flaeche-2, rgba(127,127,127,.12)); }
.route-i { width: 15px; height: 15px; flex: none; stroke: currentColor; stroke-width: 1.9;
  fill: none; stroke-linecap: round; stroke-linejoin: round; }

.dok-kopf { font-size: 12px; font-weight: 650; letter-spacing: .3px; text-transform: uppercase;
  color: var(--ink-3); margin: 18px 0 8px; }
.dok-liste { display: flex; flex-direction: column; gap: 8px; }
.dok-zeile { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 48px;
  padding: 11px 13px; text-align: left; font: inherit; font-size: 15px; font-weight: 550;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-sm); cursor: pointer; }
.dok-zeile:active { background: var(--accent-soft); border-color: var(--accent-line); }
.dok-zeile .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dok-zeile .gr { flex: none; font-size: 12.5px; font-weight: 550; color: var(--ink-3); }

/* Rundgang-Checkliste (Revierdienst-Tool V3, ENT-180/182/145). Die Knoepfe
   nutzen bewusst die bestehende .btn-Klasse, nicht eine eigene Groesse -- sie
   erben damit dieselbe, bereits als OP-111 festgehaltene 44px-Luecke wie der
   Rest der App, statt einer neuen Inkonsistenz (dieser eine Bildschirm
   44px, alle anderen nicht). Die Korrektur ist app-weit, keine Sache dieses
   Bildschirms allein. */
.rd-zeile { padding: 14px 0; border-bottom: 1px solid var(--line-soft); }
.rd-zeile:last-child { border-bottom: none; }
.rd-kopf { display: flex; align-items: flex-start; gap: 11px; }
.rd-nr { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--line-soft);
  color: var(--ink-2); font-size: 12.5px; font-weight: 700; display: flex;
  align-items: center; justify-content: center; }
.rd-fertig .rd-nr { background: var(--pos-soft); color: var(--pos); }
.rd-txt { flex: 1; min-width: 0; }
.rd-bez { font-size: 15px; font-weight: 620; }
.rd-meta { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.rd-fertig { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.rd-haken { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--pos-soft);
  color: var(--pos); display: flex; align-items: center; justify-content: center; font-weight: 700; }
.rd-haken-nv { background: var(--warn-soft); color: var(--warn); }
.rd-haken-es { background: var(--accent-soft); color: var(--accent); font-size: 13px; }
.rd-es-vorschau { max-width: 140px; border-radius: 8px; align-self: flex-start; }
/* Entfernung zum Kontrollpunkt (ENT-317). Drei Zustaende, drei Farben --
   "unbekannt" traegt bewusst die stille Farbe und nicht die warnende:
   Wer nicht weiss, wo er ist, hat nichts falsch gemacht. */
/* Das sichtbare Signal beim Erreichen eines Kontrollpunkts (ENT-319).
   Es liegt ueber ALLEM -- auch ueber der Vollseite der laufenden Runde und
   ueber offenen Schubladen (z-index 300 gegen 200 beim Toast): Wer gerade
   eine Aufgabe beantwortet und dabei den naechsten Punkt erreicht, soll es
   trotzdem sehen.

   Gross und kraeftig, nicht dezent: Auf dem iPhone gibt es keine
   Vibration (Apple unterstuetzt die Schnittstelle nicht), und der Ton kann
   stummgeschaltet sein. Was man sieht, ist dort der einzige Kanal, der
   sicher ankommt -- also darf er nicht wie ein Hinweis am Rand aussehen.

   pointer-events: none, damit das Signal nie einen Knopf abfaengt, den der
   Waechter gerade druecken wollte. */
.rg-signal {
  position: fixed; left: 50%; top: 22%; transform: translate(-50%, -12px);
  z-index: 300; pointer-events: none;
  max-width: min(88vw, 420px); padding: 18px 24px;
  background: var(--pos); color: #0F1117;
  border-radius: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.45);
  font-size: 19px; font-weight: 720; line-height: 1.35; text-align: center;
  opacity: 0; transition: opacity .18s ease, transform .18s ease;
}
.rg-signal.an { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .rg-signal { transition: opacity .18s ease; } }
.rd-ort { font-size: 13px; margin: 8px 0 0 37px; font-weight: 560; }
.rd-ort.drin { color: var(--pos); }
.rd-ort.weit { color: var(--warn); }
.rd-ort.mut { color: var(--ink-3); font-weight: 400; }
.rd-hinweis { font-size: 12.5px; color: var(--ink-3); margin: 8px 0 0 37px; }
.rd-akt { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0 37px; }
.rd-nv { margin: 10px 0 0 37px; display: flex; flex-direction: column; gap: 8px; }
.rd-nv .inp { margin: 0; }

/* Antippbare Zeile, die eine Unterseite oeffnet (ENT-051). Sieht aus wie ein
   Eintrag, verhaelt sich wie ein Knopf -- darum ein <button>, kein <div> mit
   onclick: nur so ist sie mit der Tastatur und mit Vorlesehilfen erreichbar. */
.nav-zeile {
  display: flex; align-items: center; gap: 13px; width: 100%;
  padding: 16px; background: none; border: none; font: inherit;
  text-align: left; color: inherit; cursor: pointer; min-height: 60px;
}
.nav-zeile:active { background: var(--line-soft); }
.nav-zeile .txt { flex: 1; min-width: 0; }
.nav-zeile .txt b { display: block; font-size: 15px; font-weight: 650; letter-spacing: -.1px; }
.nav-zeile .txt span { display: block; font-size: 13px; color: var(--ink-3); margin-top: 2px; }
.nav-zeile .chev { flex: none; width: 18px; height: 18px; stroke: var(--ink-3); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.seiten-kopf { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.seiten-kopf h2 { font-size: 19px; font-weight: 700; letter-spacing: -.3px; }

/* ── Blatt von unten (Schichtdetail, Passwort) */
.abdunkeln { position: fixed; inset: 0; z-index: 60; background: rgba(16,18,22,.45); opacity: 0; pointer-events: none; transition: opacity .2s; }
.abdunkeln.on { opacity: 1; pointer-events: auto; }
/* Volle Hoehe seit ENT-121. Vorher standen oben rund 12 vh ungenutzt --
   ausgerechnet in der Ansicht, in der am meisten steht (Zeit, Kunde, Ort,
   Route, Unterlagen, Team, Rapport, Rueckmeldung).
   top/bottom statt einer vh-Angabe: Auf dem Telefon wandert die Adressleiste
   beim Scrollen, und 100vh ist dann groesser als das, was man sieht -- der
   Fussbereich mit den Knoepfen rutscht unter den Rand. Mit top: 0 und
   bottom: 0 rechnet der Browser selbst.
   Die Polsterung oben haelt den Griff aus der Statusleiste und der Kamera. */
.blatt {
  position: fixed; left: 0; right: 0; top: 0; bottom: 0; z-index: 61;
  padding-top: env(safe-area-inset-top);
  background: var(--surface); box-shadow: var(--sh-3);
  transform: translateY(100%); transition: transform .24s cubic-bezier(.32,.72,0,1);
  display: flex; flex-direction: column;
}
.blatt.on { transform: none; }
.blatt-griff { padding: 10px 0 4px; display: flex; justify-content: center; flex: none; }
.blatt-griff i { width: 38px; height: 4px; border-radius: 3px; background: var(--line); display: block; }
.blatt-kopf { display: flex; align-items: center; gap: 12px; padding: 6px 20px 14px; border-bottom: 1px solid var(--line-soft); flex: none; }
.blatt-kopf h2 { font-size: 18px; font-weight: 680; letter-spacing: -.3px; flex: 1; min-width: 0; }
.blatt-bd { padding: 18px 20px; overflow-y: auto; flex: 1; }
.blatt-ft { padding: 14px 20px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line-soft); display: flex; gap: 10px; flex: none; }
.blatt-ft .btn { flex: 1; }
/* Beantworteter Zustand (ENT-120): erst die Aussage, darunter die Knoepfe.
   Ueberschrift oben, Wert darunter -- und die Knoepfe stehen nebeneinander,
   damit keiner allein ueber die volle Breite gezogen wird. */
.blatt-ft.gestapelt { flex-direction: column; align-items: stretch; gap: 12px; }
.blatt-ft .ft-stand { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.blatt-ft .ft-txt { font-size: 12.5px; color: var(--ink-3); line-height: 1.5; flex: 1 1 160px; }
.blatt-ft .ft-reihe { display: flex; gap: 10px; }

/* ══ Einsatzmodus Rundgang (ENT-294) ══════════════════════════════════
   Eigene Vollseite statt Schublade, und der einzige dunkle Bereich der
   App. ENT-029 hat den Dunkelmodus ausdruecklich aufs Dashboard begrenzt,
   weil "beide draussen bei Tageslicht benutzt werden" -- fuer den
   Revierdienst-Rundgang trifft genau das nicht zu: Er laeuft abends und
   nachts, wo ein weisser Vollbildschirm blendet und die Nachtsicht
   zerstoert. Dieselbe Ueberlegung wie bei Navi-Apps.

   Die Farbwerte sind NICHT neu erfunden, sondern Zeichen fuer Zeichen die
   des Dashboard-Dunkelmodus (dashboard.html, html[data-thema="dunkel"]).
   Sie stehen hier als lokale Ueberschreibung auf dem Container: Dadurch
   werden .karte, .btn, .marke und alles andere in diesem Bereich von selbst
   dunkel, ohne dass eine einzige bestehende Regel angefasst werden muss --
   und keine andere Ansicht der App aendert sich.

   z-index 55: ueber der Reiterleiste (50), aber UNTER Abdunkeln/Blatt
   (60/61). Kurze Eingaben (Grund waehlen, Abbruch bestaetigen) erscheinen
   damit weiterhin als Schublade darueber, statt hier nachgebaut zu werden. */
.rgs {
  position: fixed; left: 0; right: 0; top: 0; bottom: 0; z-index: 55;
  display: none; flex-direction: column;
  background: var(--bg); color: var(--ink);
  padding-top: env(safe-area-inset-top);

  --bg:           #0F1117;
  --surface:      #161B27;
  --surface-2:    #1E2535;
  --line:         #2A3147;
  --line-soft:    #232A3B;
  --ink:          #F2F4F8;
  --ink-2:        #B6BCC8;
  --ink-3:        #868D9A;
  --accent:       #7098F7;
  --accent-hi:    #8DAEFA;
  --accent-soft:  #1A2440;
  --accent-line:  #2D3D63;
  --pos: #4FCE96;  --pos-soft: #10281E;
  --neg: #F27F70;  --neg-soft: #2E1A18;
  --warn: #E2B156; --warn-soft: #2B2314;
  /* Auf dunklem Grund traegt der Rand, nicht der Schatten (ENT-029/227). */
  --sh-1: none;
  --sh-2: 0 8px 28px -8px rgba(0,0,0,.6);
  color-scheme: dark;
}
.rgs.on { display: flex; }
.rgs-kopf { display: flex; align-items: center; gap: 6px; padding: 10px 14px 12px; flex: none; background: var(--surface); }
.rgs-kopf h2 { font-size: 17px; font-weight: 680; letter-spacing: -.3px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rgs-kopf { border-bottom: 1px solid var(--line-soft); }
/* Waehrend der Runde tritt der Firmenname zurueck (ENT-355): kleiner,
   gedaempft, nicht mehr fett. Er bleibt lesbar -- auf dem Handy ist die
   Kopfzeile der einzige Ort, der sagt, wo man ist (CLAUDE.md) --, aber er
   spielt sich nicht mehr auf. Ohne laufende Runde bleibt er gross: Dort gibt
   es keine Zahlen, hinter die er zuruecktreten muesste.
   Der Kopf ist ausserdem schmaler geworden (ENT-361) -- jede Zeile, die er
   nicht braucht, gehoert der Karte. */
.rgs.zahlen .rgs-kopf { padding: 6px 14px 8px; }
.rgs.zahlen .rgs-kopf h2 { font-size: 13.5px; font-weight: 600; color: var(--ink-3); letter-spacing: 0; }
/* 44px Trefferflaeche (CLAUDE.md), der negative Rand haelt das Symbol
   trotzdem buendig an der Kante -- sonst steht der Titel eingerueckt. */
.rgs-zurueck { min-height: 44px; min-width: 44px; padding: 0; margin-left: -10px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: var(--ink); cursor: pointer; }
.rgs-bd { padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); overflow-y: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; }
/* KEIN Bloecke-Zusammendruecken (ENT-335). Der Rumpf ist eine Flex-Spalte;
   Flex-Kinder duerfen von sich aus schrumpfen. Normalerweise schuetzt sie
   ihre automatische Mindesthoehe davor -- die faellt aber auf 0, sobald ein
   Block `overflow: hidden` traegt. Genau das tun .karte, .rgs-fakten und
   .rgs-klapp (sie brauchen es fuer ihre abgerundeten Ecken).

   Folge auf einem kurzen Bildschirm: Passt der Inhalt nicht mehr, wurden
   genau diese drei Bloecke auf wenige Pixel zusammengedrueckt und ihr Text
   abgeschnitten -- Objekt, Kunde, Adresse, Zeitfenster und Ansprechpartner
   verschwanden, waehrend alles darunter normal dastand. Vom Projektinhaber
   gemeldet und am Bildschirmfoto nachgemessen: Auf 720 px Hoehe schrumpfte
   .rgs-fakten von 50 auf 16 px, auf 660 px auf 0.

   Der Rumpf scrollt ohnehin (overflow-y: auto) -- die Bloecke sollen ihn
   also laenger machen, nicht kleiner werden. */
.rgs-bd > * { flex-shrink: 0; }

/* Kopfkarte: Objekt, Kunde, Adresse -- Reihenfolge vom Projektinhaber
   vorgegeben. Das Routen-Symbol steht rechts daneben, nicht darunter:
   es gehoert zur Adresse, nicht zum naechsten Block. */
.rgs-objekt { display: flex; align-items: flex-start; gap: 12px; }
.rgs-objekt-txt { flex: 1; min-width: 0; }
.rgs-obj-name { font-size: 19px; font-weight: 700; letter-spacing: -.3px; line-height: 1.25; }
.rgs-obj-kunde { font-size: 14.5px; color: var(--ink-2); margin-top: 2px; }
/* Fehlende Angabe: sichtbar, aber erkennbar keine echte Angabe (ENT-331).
   Kursiv und gedaempft -- niemand liest das versehentlich als Kundenname. */
.rgs-obj-name.fehlt, .rgs-obj-kunde.fehlt { color: var(--ink-3); font-style: italic; font-weight: 500; }
.rgs-obj-name.fehlt { font-size: 16px; }
.rgs-klapp-zahl.leer { opacity: .55; }
/* Die Notrufnummern im zugeklappten Kopf (ENT-335): lesbar, aber erkennbar
   eine Vorschau auf den Inhalt und kein Knopf. Auf schmalen Geraeten darf
   sie den Titel nicht verdraengen -- darum darf sie verschwinden, bevor
   „Zentrale und Notruf" abgeschnitten wuerde. */
.rgs-klapp-nr { font-variant-numeric: tabular-nums; letter-spacing: .2px; white-space: nowrap; }
@media (max-width: 359px) { .rgs-klapp-nr { display: none; } }
/* Die Adresse traegt --ink-2, nicht die blasseste Stufe: Fuer jemanden, der
   nachts erst hinfahren muss, ist sie Kerninformation, kein Beiwerk. */
.rgs-obj-adr { font-size: 14.5px; color: var(--ink-2); margin-top: 10px; line-height: 1.45; }
.rgs-route { flex: none; min-height: 44px; min-width: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2); color: var(--accent); }

/* Zustandsstreifen: nur sichtbar, solange auf dieser Runde tatsaechlich eine
   eigene Runde offen ist (ENT-298). Er steht ganz oben, weil er die Seite
   umdeutet -- aus "was erwartet mich" wird "was laeuft gerade". Der Punkt
   links ist Farbe UND Form derselben Aussage, damit sie nicht allein an der
   Farbe haengt: gefuellt = laeuft, hohl = pausiert. */
.rgs-status { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 10px 14px; border: 1px solid var(--accent-line); border-radius: var(--r-sm); background: var(--accent-soft); font-size: 14.5px; font-weight: 620; color: var(--ink); }
.rgs-status-pkt { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.rgs-status.pause { border-color: var(--warn); background: var(--warn-soft); }
.rgs-status.pause .rgs-status-pkt { background: none; border: 2px solid var(--warn); }
.rgs-status-zeit { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--ink-2); }

/* Kennzahlen: Beschriftung OBEN, Wert darunter (CLAUDE.md), beide Seiten
   nach demselben Muster und in derselben Schriftgroesse. */
.rgs-fakten { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line-soft); border-radius: var(--r-sm); overflow: hidden; }
.rgs-fakt { background: var(--surface); padding: 12px 14px; }
.rgs-fakt-lb { font-size: 11px; font-weight: 640; letter-spacing: .6px; text-transform: uppercase; color: var(--ink-3); }
.rgs-fakt-wert { font-size: 16px; font-weight: 650; margin-top: 4px; color: var(--ink); }

/* Ausklappbarer Block (Coredinate-Muster: "> Ansprechpartner"). */
.rgs-klapp { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.rgs-klapp-kopf { width: 100%; min-height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: none; border: 0; color: var(--ink); font: inherit; font-size: 15.5px; font-weight: 620; cursor: pointer; text-align: left; }
.rgs-klapp-pfeil { flex: none; transition: transform .18s; color: var(--ink-3); }
.rgs-klapp.auf .rgs-klapp-pfeil { transform: rotate(90deg); }
.rgs-klapp-zahl { margin-left: auto; font-size: 13px; color: var(--ink-3); font-weight: 600; }
.rgs-klapp-bd { display: none; padding: 2px 16px 14px; border-top: 1px solid var(--line-soft); }
.rgs-klapp.auf .rgs-klapp-bd { display: block; }
.rgs-person { padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
.rgs-person:last-child { border-bottom: 0; padding-bottom: 2px; }
.rgs-person-name { font-size: 15px; font-weight: 620; }
/* Herkunft und Funktion der Person (ENT-300). Wer nachts anruft, muss wissen,
   wen er weckt: der Hauswart vor Ort ist ein anderer Anruf als die
   Kontaktperson beim Kunden. Das Kennzeichen traegt Farbe UND Wort -- nicht
   nur Farbe, sonst waere die Unterscheidung fuer manche gar keine. */
.rgs-person-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 3px; }
.rgs-quelle { font-size: 10.5px; font-weight: 680; letter-spacing: .5px; text-transform: uppercase; padding: 2px 7px; border-radius: 9px; background: var(--line-soft); color: var(--ink-2); border: 1px solid var(--line); }
.rgs-quelle.vorort { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.rgs-person-fkt { font-size: 13px; color: var(--ink-2); }
/* Anrufen/Mailen sind echte Ziele mit dem Daumen -- 44px, nicht nur Text. */
.rgs-weg { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; color: var(--accent); font-size: 14.5px; font-weight: 600; text-decoration: none; margin-right: 16px; }
.rgs-leer { font-size: 14px; color: var(--ink-3); padding: 10px 0 2px; line-height: 1.5; }

/* Module: Liste mit eigenstaendigen Unterseiten (vom Projektinhaber so
   gewaehlt). Die Zahl rechts ist die Anzahl, nicht der Fortschritt. */
/* Die Beschriftung gehoert zur Liste darunter, nicht zur Karte darueber --
   deshalb oben mehr Luft als unten, statt gleichmaessigem Abstand
   (CLAUDE.md: Luft ist Teil der Gestaltung, kein Rest). */
.rgs-mod-lb { font-size: 11px; font-weight: 640; letter-spacing: .6px; text-transform: uppercase; color: var(--ink-3); padding: 6px 2px 7px; }
.rgs-modul { width: 100%; min-height: 60px; display: flex; align-items: center; gap: 13px; padding: 0 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); font: inherit; font-size: 15.5px; font-weight: 620; cursor: pointer; text-align: left; }
.rgs-modul-ic { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--accent); color: var(--accent); display: flex; align-items: center; justify-content: center; }
.rgs-modul-zahl { margin-left: auto; min-width: 26px; height: 26px; padding: 0 8px; border-radius: 13px; background: var(--accent); color: #0F1117; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.rgs-modul-zahl.leer { background: var(--neg-soft); color: var(--neg); }
/* Zustandswort rechts am Schalter (ENT-355). Ein Umschalter, der immer
   gleich aussieht, sagt nichts (dieselbe Ueberlegung wie bei Nachtsicht):
   eingeschaltet in der Akzentfarbe, ausgeschaltet neutral -- und zusaetzlich
   mit WORT, nicht nur mit Farbe. */
.rgs-modul-zust { margin-left: auto; flex: none; padding: 4px 11px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-3);
  font-size: 12.5px; font-weight: 700; letter-spacing: .3px; }
.rgs-modul-zust.an { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent); }
/* Der erklaerende Satz unter dem Schalter: Wer eine Einstellung trifft, die
   Akku kostet, soll das vorher wissen und nicht hinterher merken. */
.rgs-modul-txt { font-size: 12.5px; line-height: 1.5; color: var(--ink-3); padding: 0 4px; margin-top: -4px; }
/* Aufgaben je Kontrollpunkt (ENT-304). Punkt als Kopf, Aufgaben darunter --
   dieselbe Ordnung wie die Runde selbst. Ein Punkt OHNE Aufgabe bleibt
   sichtbar, aber gedaempft: Er sagt "hier ist nichts zu tun", nicht "hier
   fehlt etwas". */
.af-punkt { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; margin-bottom: 10px; }
/* Der Zusatz heisst "ohne", NICHT "leer": .leer ist bereits eine globale
   Klasse dieser App (text-align:center, padding:46px 22px) fuer ganzseitige
   Leerzustaende. Die erste Fassung hiess .af-punkt.leer und hat sich diese
   Polsterung und die Zentrierung eingefangen -- der Block war doppelt so hoch
   wie noetig und der Text stand mittig. Im Quelltext unsichtbar, erst am
   gerenderten Zustand aufgefallen. */
.af-punkt.ohne { background: none; }
.af-punkt-kopf { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
.af-punkt.ohne .af-punkt-kopf { border-bottom: 0; }
.af-nr { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--line-soft); color: var(--ink-2); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.af-punkt-bez { flex: 1; min-width: 0; font-size: 15px; font-weight: 640; }
.af-punkt.ohne .af-punkt-bez { color: var(--ink-3); font-weight: 600; }
.af-punkt-zahl { flex: none; min-width: 24px; height: 24px; padding: 0 8px; border-radius: 12px; background: var(--accent); color: #0F1117; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.af-zeile { padding: 11px 14px 12px 46px; border-bottom: 1px solid var(--line-soft); }
.af-zeile:last-child { border-bottom: 0; }
/* Die Bezeichnung traegt --ink, die Erlaeuterung --ink-2: Was zu tun ist,
   steht vor dem, was dazu zu wissen ist. */
.af-bez { font-size: 15px; font-weight: 600; line-height: 1.35; }
.af-info { font-size: 13.5px; color: var(--ink-2); line-height: 1.5; margin-top: 3px; white-space: pre-line; }
.af-ohne { padding: 0 14px 12px 46px; font-size: 13px; color: var(--ink-3); }

/* Aufgabe bestaetigen (ENT-305). Die Wahl faerbt den gewaehlten Knopf --
   Farbe UND Rahmen, damit die Unterscheidung nicht allein an der Farbe
   haengt. "Nicht moeglich" bekommt das Warnrot, nicht das Gruen: Es ist eine
   Abweichung, keine Erledigung. */
.ab-karte { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 14px; margin-bottom: 12px; }
.ab-bez { font-size: 15.5px; font-weight: 650; line-height: 1.35; }
.ab-info { font-size: 13.5px; color: var(--ink-2); line-height: 1.5; margin-top: 4px; white-space: pre-line; }
.ab-wahl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
/* 48px wie jeder .btn -- die beiden Knoepfe sind die eigentliche Handlung
   dieser Schublade und duerfen nicht kleiner sein als der Rest. */
.ab-btn { min-height: 48px; }
.ab-btn.ab-an { border-color: var(--pos); background: var(--pos-soft); color: var(--pos); font-weight: 700; }
.ab-btn.ab-an-neg { border-color: var(--neg); background: var(--neg-soft); color: var(--neg); }
/* Hinweis an der erledigten Zeile, dass noch Aufgaben offen sind. */
.ab-offen { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; margin-top: 4px; padding: 0 12px 0 10px; border: 1px solid var(--warn); border-radius: var(--r-sm); background: var(--warn-soft); color: var(--warn); font: inherit; font-size: 13.5px; font-weight: 640; cursor: pointer; }
.ab-fertig { font-size: 12.5px; color: var(--pos); font-weight: 600; margin-top: 4px; }

/* Zaehler und Timer im Kopf (ENT-306). Sie stehen bewusst NICHT im Rumpf:
   Wer scrollt, soll trotzdem sehen, wie weit er ist und wie lange er dran
   ist -- das ist im Vorbild genauso geloest. Feste Ziffernbreite, damit die
   Zeile nicht bei jeder Sekunde springt. */
/* Karte der laufenden Runde (ENT-308). Sie fuellt den Rumpf, statt in einer
   festen Hoehe zu stecken: Wer nachts einen Punkt sucht, braucht Flaeche.
   Der Rumpf ist eine Flex-Spalte -- ohne min-height:0 wuchse die Karte ueber
   den Bildschirm hinaus statt sich einzupassen. */
/* Volle Bildschirmbreite (ENT-331), ausdrückliche Vorgabe des
   Projektinhabers. Der Rumpf (.rgs-bd) hat 16 px Rand -- der wird hier mit
   einem negativen Aussenabstand aufgehoben, statt den Rand für alle Reiter
   zu entfernen: Die Liste und die Hinweise sollen ihn behalten.
   Ohne seitlichen Rahmen und ohne Eckenrundung, sonst sähe eine Karte, die
   bis an den Rand geht, aus wie eine, die abgeschnitten wurde. */
.rgs-karte-huelle { position: relative; flex: 1; min-height: 260px;
  margin: 0 -16px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  overflow: hidden; background: var(--surface-2); }
/* Die Karte bekommt den ganzen Rumpf (ENT-361). Zwischen Kopf und Karte lagen
   12 px Abstand der Seite plus 16 px Innenrand des Rumpfs, unter der Karte
   dasselbe noch einmal -- zusammen 56 px Leerraum um das Element herum, das
   das wichtigste dieser Seite ist. Auf dem Karten-Reiter fallen beide weg.
   Auf den anderen Reitern bleiben sie: Dort steht eine Liste, und eine Liste
   ohne Rand klebt am Bildschirmrand. */
.rgs.voll { gap: 0; }
.rgs-bd.voll { padding: 0; }
.rgs-bd.voll .rgs-karte-huelle { margin: 0; border-top: 0; }
/* Was ausser der Karte noch im Rumpf steht -- die Ortungswarnungen -- braucht
   seinen Rand zurueck, sonst klebte der Warntext an der Kante. */
.rgs-bd.voll > :not(.rgs-karte-huelle) { margin: 0 16px; }
.rgs-bd.voll > :last-child:not(.rgs-karte-huelle) { margin-bottom: calc(12px + env(safe-area-inset-bottom)); }
.rgs-karte { position: absolute; inset: 0; }
/* Ladehinweis und Fehlermeldung an derselben Stelle: Beides beantwortet
   dieselbe Frage ("warum sehe ich nichts"), darum derselbe Ort. */
.rgs-karte-stand { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 14px; line-height: 1.5; color: var(--ink-3); }
.rgs-karte-stand.fehler { color: var(--warn); }
/* Zweiter Knopf rechts: Nachtsicht. Gleiche Bauart wie „Zentrieren",
   damit auf der Karte EIN Knopfmuster gilt -- nur die Farbe sagt, ob er an
   ist: eingeschaltet in der Akzentfarbe wie „Zentrieren", ausgeschaltet
   neutral. Ein Umschalter, der immer gleich aussieht, sagt nichts. */
.rgs-karte-btn2 { position: absolute; right: 12px; bottom: 28px; min-height: 44px;
  display: inline-flex; align-items: center; gap: 8px; padding: 0 14px;
  border: 1px solid var(--line); border-radius: var(--r-sm);
  background: var(--surface); color: var(--ink-2); font: inherit; font-size: 14px;
  font-weight: 640; cursor: pointer; box-shadow: var(--sh-2); }
.rgs-karte-btn2.an { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent); }
/* Unten links wie im Vorbild, und mit 44px Trefferflaeche. */
.rgs-karte-btn { position: absolute; left: 12px; bottom: 28px; min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; border: 1px solid var(--accent-line); border-radius: var(--r-sm); background: var(--accent-soft); color: var(--accent); font: inherit; font-size: 14px; font-weight: 640; cursor: pointer; box-shadow: var(--sh-2); }
/* Beide Kartenknoepfe sitzen bewusst 28 px ueber der Kante, nicht 12
   (ENT-355). Darunter laeuft die Leiste des Kartenanbieters mit dem
   Kartendaten-Hinweis und dem Link auf seine Nutzungsbedingungen. Sie darf
   nach den Nutzungsbedingungen von Google Maps Platform weder entfernt noch
   verdeckt oder veraendert werden -- ein Knopf, der halb darauf liegt,
   verdeckt sie. Der Projektinhaber wollte die Knoepfe naeher an die Kante;
   das ist erfuellt, weil unter der Karte gleichzeitig die Ortungszeile
   weggefallen ist und die Karte entsprechend hoeher reicht. Wer den
   Anbieterhinweis wirklich loswerden will, muss den Kartenanbieter
   wechseln, nicht die Leiste ueberdecken. */

/* Die Ortungsmarke, oben links auf der Karte -- die Ecke, in der weder ein
   Knopf noch der Anbieterhinweis liegt. */
/* Unter den Wert-Chips (ENT-361): Die Ortungsmarke ist die dritte
   Ueberlagerung in derselben Ecke und darf die beiden Zahlen nicht
   verdecken. 10 px Rand + 34 px Chiphoehe + 8 px Luft = 52 px. */
.rgs-ortchip { position: absolute; left: 10px; top: 52px; z-index: 2; display: inline-flex;
  align-items: center; gap: 7px; max-width: calc(100% - 20px); padding: 6px 11px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
  color: var(--ink-2); font-size: 12.5px; font-weight: 620; line-height: 1.2;
  box-shadow: var(--sh-2); }
/* Bewusst NICHT pointer-events:none: Im Zustand "steht" haengt am Chip der
   erklaerende Text, warum die Ortung steht und was dagegen hilft -- der
   waere sonst unerreichbar. Die Flaeche ist klein und sitzt in der Ecke;
   die Karte laesst sich ueberall sonst weiterhin schieben. */
.rgs-ortchip-pkt { width: 8px; height: 8px; border-radius: 50%; flex: none;
  background: var(--pos); animation: rgsOrtPuls 2s ease-in-out infinite; }
.rgs-ortchip.sucht .rgs-ortchip-pkt { background: var(--ink-3); }
/* Steht die Ortung, ist das keine Verzierung mehr, sondern eine Aussage
   ueber die Datenqualitaet der laufenden Runde -- darum Warnfarbe und ein
   ruhiger Punkt statt eines pulsierenden. */
.rgs-ortchip.steht { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); }
.rgs-ortchip.steht .rgs-ortchip-pkt { background: var(--warn); animation: none; }
@keyframes rgsOrtPuls { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
/* Wer die Bewegung im System abgeschaltet hat, bekommt sie auch hier nicht. */
@media (prefers-reduced-motion: reduce) { .rgs-ortchip-pkt { animation: none; } }

/* "Nicht darstellbar" darf nie wie "nicht vorhanden" aussehen (CLAUDE.md) --
   darum steht dieser Satz unter der Karte, nicht nur in der Liste. */
.rgs-karte-hinweis { flex: none; font-size: 13px; color: var(--ink-3); line-height: 1.5; padding: 2px; }
/* Die Warnung des Kartenanbieters als schmaler Streifen unter der Karte
   (ENT-312) -- sie darf eine funktionierende Karte nicht zudecken. Eigene
   Regel, weil .fehler bisher nur fuer .rgs-karte-stand galt: Ohne sie
   bliebe die Klasse wirkungslos, ohne dass etwas kaputtgeht. */
.rgs-karte-hinweis.fehler { color: var(--warn); font-weight: 560; }
/* Die Warnung bei fehlendem Standort (ENT-320). Bewusst ein Block und
   keine Zeile: Sie ist eine Handlungsanweisung, kein Hinweis am Rand --
   ohne Standort laesst sich kein einziger Kontrollpunkt bestaetigen. */
.rgs-ortwarn { flex: none; border: 1px solid var(--warn); border-radius: var(--r);
  background: var(--warn-soft); color: var(--ink); padding: 14px 16px;
  font-size: 14px; line-height: 1.5; }
.rgs-ortwarn-tt { font-weight: 700; color: var(--warn); margin-bottom: 6px; font-size: 15px; }
.rgs-ortwarn-weg { margin-top: 10px; font-size: 13px; color: var(--ink-2); line-height: 1.55; }

.rd-zustand { font-size: 15px; font-weight: 640; margin-bottom: 12px; }
/* Nur fuer Vorlesewerkzeuge sichtbar. Das Symbol im Chip sagt einem
   sehenden Auge, was die Zahl bedeutet; einer Vorlesestimme sagt es nichts. */
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }

/* Zaehler und Laufzeit als Chips (ENT-361, revidiert ENT-355).
   Auf der Karte als Ueberlagerung -- das kostet keine Layouthoehe, die Karte
   reicht darunter durch. Auf den Reitern ohne Karte als schmale Zeile. */
.rgs-zchips { display: flex; align-items: center; gap: 8px; flex: none; flex-wrap: wrap; }
.rgs-zchips.auf-karte { position: absolute; left: 10px; top: 10px; z-index: 2;
  max-width: calc(100% - 20px); }
.rgs-zchip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
  color: var(--ink-2); box-shadow: var(--sh-2); }
.rgs-zchip .i { flex: none; color: var(--ink-3); }
.rgs-zchip-wert { font-size: 16px; line-height: 1.15; font-weight: 700; color: var(--ink);
  font-variant-numeric: tabular-nums; letter-spacing: -.2px; }

/* Reiterleiste der laufenden Runde (ENT-306). Unten, wo der Daumen ist --
   dieselbe Stelle wie die Reiterleiste der App selbst, damit niemand zwei
   Bedienlogiken lernen muss. */
.rgs-reiter { display: flex; flex: none; border-top: 1px solid var(--line); background: var(--surface); padding-bottom: env(safe-area-inset-bottom); }
.rgs-reiter[hidden] { display: none; }
.rgs-reiter button { flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: 0; border-top: 2px solid transparent; margin-top: -1px; color: var(--ink-3); font: inherit; font-size: 11.5px; font-weight: 620; cursor: pointer; }
/* Der aktive Reiter traegt Farbe UND einen Balken -- nicht nur Farbe. */
.rgs-reiter button.an { color: var(--accent); border-top-color: var(--accent); }
.rgs-reiter .zahl { position: absolute; transform: translate(14px, -10px); min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--warn); color: #0F1117; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

.rgs-fuss { padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line-soft); background: var(--surface); flex: none; }
.rgs-warn { display: flex; gap: 9px; font-size: 13.5px; line-height: 1.5; color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn); border-radius: var(--r-sm); padding: 11px 13px; }

/* Zentrale und Notruf (ENT-299). Nicht ausklappbar, anders als der
   Ansprechpartner-Block darueber: Wer diese Nummern braucht, hat keine Hand
   frei zum Aufklappen. Reihenfolge vom Projektinhaber vorgegeben -- eigene
   Zentrale zuoberst, oeffentlicher Notruf darunter.

   Die Zentrale traegt die Akzentfarbe (unser Weg), die Notrufnummern das
   Rot der Negativ-Farbe (fremder Weg, letzte Stufe). Der Unterschied haengt
   nicht allein an der Farbe: Die Zentrale ist eine breite Zeile mit Namen,
   der Notruf sind drei gleich grosse Kacheln. */
.rgs-hilfe { display: flex; flex-direction: column; gap: 8px; }
.rgs-zentrale { display: flex; align-items: center; gap: 13px; min-height: 60px; padding: 0 16px; border: 1px solid var(--accent-line); border-radius: var(--r); background: var(--accent-soft); color: var(--ink); text-decoration: none; }
.rgs-zentrale-ic { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--accent); color: var(--accent); display: flex; align-items: center; justify-content: center; }
/* Als Spalte, nicht als Zeile: Die drei Angaben sind <span> (in einem <a>
   ist kein <div> erlaubt) und laegen sonst nebeneinander -- die
   Beschriftung stuende dann NEBEN der Nummer statt darueber. */
.rgs-zentrale-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
/* Beschriftung oben, Nummer darunter (CLAUDE.md) -- gleiches Muster wie die
   Kennzahlen weiter oben, damit die Seite eine Ordnung hat. */
.rgs-zentrale-lb { font-size: 11px; font-weight: 640; letter-spacing: .6px; text-transform: uppercase; color: var(--ink-3); }
.rgs-zentrale-nr { font-size: 16px; font-weight: 660; color: var(--accent); margin-top: 2px; }
.rgs-zentrale-name { font-size: 13px; color: var(--ink-2); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rgs-notruf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
/* 60px wie die Funktionen darunter -- eine Notrufkachel darf nicht das
   kleinste Ziel des Bildschirms sein. */
.rgs-notruf a { min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border: 1px solid var(--neg); border-radius: var(--r); background: var(--neg-soft); color: var(--neg); text-decoration: none; }
.rgs-notruf-nr { font-size: 19px; font-weight: 720; letter-spacing: -.3px; }
.rgs-notruf-wort { font-size: 11.5px; font-weight: 600; color: var(--ink-2); }

/* Rueckfrage vor einer Zustandsaenderung (ENT-298). Liegt INNERHALB der
   Seite (position:absolute), nicht im Schublade-System: Die Schublade
   (z-index 61) wuerde die Seite dahinter verdecken und faehrt von unten ein
   -- fuer eine Ja/Nein-Frage ist das der falsche Weg und die falsche
   Bewegung. Der Dialog bleibt ueber der Seite und laesst sehen, worauf er
   sich bezieht. */
.rgs-dlg { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(8,10,16,.62); }
/* Ohne diese Zeile bliebe der Dialog sichtbar: display:flex aus der Regel
   darueber schlaegt die Browser-Vorgabe fuer [hidden] (Autorenregeln gehen
   Browserregeln vor, unabhaengig von der Spezifitaet). */
.rgs-dlg[hidden] { display: none; }
.rgs-dlg-box { width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh-2); padding: 20px 20px 16px; }
/* Beschriftung oben, Aussage darunter -- dasselbe Muster wie ueberall sonst. */
.rgs-dlg-lb { font-size: 11px; font-weight: 640; letter-spacing: .6px; text-transform: uppercase; color: var(--warn); }
.rgs-dlg-frage { font-size: 17px; font-weight: 660; line-height: 1.3; margin-top: 6px; }
/* pre-line (ENT-342): Der Text wird mit textContent gesetzt -- ein
   Zeilenumbruch darin bliebe sonst wirkungslos, und zwei Saetze liefen
   ineinander. Gefunden am gerenderten Zustand, nicht im Quelltext: Die
   Kollision („Muster AG 12:00-18:00") klebte am folgenden Satz. */
.rgs-dlg-txt { font-size: 14px; color: var(--ink-2); line-height: 1.5; margin-top: 10px; white-space: pre-line; }
/* "Nein" links und zuerst: der harmlose Ausgang ist der leicht erreichbare. */
.rgs-dlg-fuss { display: flex; gap: 10px; margin-top: 20px; }
.rgs-dlg-fuss .btn { flex: 1; }

/* ── Hinweis */
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(var(--tab-h) + 18px + env(safe-area-inset-bottom)); background: var(--shell); color: #fff; padding: 13px 18px; border-radius: var(--r-sm); font-size: 14.5px; font-weight: 560; box-shadow: var(--sh-2); z-index: 200; opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity .18s, transform .18s; text-align: center; }
.toast.on { opacity: 1; transform: none; }

/* ── Skelett */
.sk { background: linear-gradient(90deg, var(--line-soft) 25%, #E4E7EC 50%, var(--line-soft) 75%); background-size: 200% 100%; animation: sh 1.3s infinite; border-radius: var(--r-sm); }
@keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ── Kacheln fuer Menue/Waechter (ENT-234). Optisch identisch zum
   .bk-kachel-Muster aus dashboard.html (Betrieb-Uebersicht, ENT-161) --
   eigener Klassenpraefix, weil beide Dateien getrennte Stylesheets sind,
   dieselben Farb-/Abstands-Werte wie dort. */
.mk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 14px; margin-bottom: 20px; }
.mk-kachel { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh-1);
  padding: 22px 14px; min-height: 132px; width: 100%; cursor: pointer; font: inherit; color: inherit; }
.mk-kachel:active { background: var(--accent-soft); border-color: var(--accent-line); }
.mk-kachel:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mk-kachel-ic { width: 56px; height: 56px; border-radius: 14px; background: var(--accent-soft);
  color: var(--accent); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.mk-kachel-ic svg.i { width: 28px; height: 28px; }
.mk-kachel-lbl { font-size: 13.5px; font-weight: 600; line-height: 1.35; }
.mk-kachel-txt { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.mk-kachel-sub { font-size: 11.5px; font-weight: 650; color: var(--accent); }

/* ── Unterreiter (ENT-234: Plan + Sperren in einem Reiter). Gleiche
   Trefferflaeche wie ein Hauptreiter (44px), aber schmaler und ohne
   Icon -- sichtbar nur unterhalb von "Plan", nicht Teil der globalen
   Tab-Leiste. */
.unterreiter { display: flex; gap: 6px; margin-bottom: 16px; background: var(--line-soft); border-radius: var(--r-sm); padding: 4px; }
.unterreiter button { flex: 1; min-height: 40px; border: none; border-radius: calc(var(--r-sm) - 3px); background: none;
  font: inherit; font-size: 14px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.unterreiter button.on { background: var(--surface); color: var(--ink); box-shadow: var(--sh-1); }

/* ── Hinweis-Chip bei aktivem/pausiertem Rundgang auf "Heute" (ENT-234).
   Fuehrt mit einem Tipp direkt zurueck in die Checkliste, ohne den Weg
   ueber "Wächter" -- waehrend eine Runde laeuft, zaehlt jeder Kontrollpunkt-
   Scan, nicht die Navigation dorthin. */
.rd-chip { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 56px; padding: 12px 16px;
  margin-bottom: 14px; background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: var(--r);
  font: inherit; color: var(--ink); cursor: pointer; text-align: left; }
.rd-chip-ic { flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center; }
.rd-chip-txt { flex: 1; min-width: 0; }
.rd-chip-txt b { display: block; font-size: 14px; font-weight: 650; }
.rd-chip-txt span { display: block; font-size: 12.5px; color: var(--ink-2); margin-top: 1px; }
.rd-chip .chev { flex: none; width: 18px; height: 18px; stroke: var(--ink-3); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

@media (min-width: 700px) {
  /* Auf grösseren Geräten mittig halten statt in die Breite ziehen */
  .app { max-width: 560px; margin: 0 auto; box-shadow: 0 0 0 1px var(--line); min-height: 100vh; }
  .tabs { max-width: 560px; left: 50%; transform: translateX(-50%); }
  .blatt { max-width: 560px; left: 50%; transform: translateX(-50%) translateY(100%); }
  .blatt.on { transform: translateX(-50%); }
  .toast { max-width: 528px; left: 50%; transform: translateX(-50%) translateY(8px); }
  .toast.on { transform: translateX(-50%); }
  /* Der Einsatzmodus folgt demselben Muster wie alles andere (ENT-294) --
     ohne diese Zeile lief er als einziger Bereich ueber die volle
     Bildschirmbreite, mit einem 1400px breiten "Rundgang starten". */
  .rgs { max-width: 560px; left: 50%; transform: translateX(-50%); box-shadow: 0 0 0 1px var(--line); }
}
</style>
</head>
<body>

<!-- ══════════════════════════ ANMELDUNG ══════════════════════════ -->
<div id="gate">
  <div class="gate-oben">
    <img src="icons/icon-192.png" alt="">
    <div class="wm">Cockpit</div>
    <div class="sub">CUPI 24 GmbH</div>
  </div>
  <div class="gate-form" id="gate-login">
    <div id="gErr" class="msg-err" style="display:none"></div>
    <div class="f"><label for="gName" id="lb-name">Name</label><input class="inp" id="gName" autocomplete="username" autocapitalize="none"></div>
    <div class="f"><label for="gPass" id="lb-pass">Passwort</label>
      <div class="pw-feld"><input class="inp" id="gPass" type="password" autocomplete="current-password">
        <button type="button" class="pw-toggle" aria-label="Passwort anzeigen"
                onclick="togglePw('gPass', this)">👁</button></div></div>
    <button class="btn btn-primary btn-wide" id="gBtn" onclick="anmelden()">Anmelden</button>
    <button type="button" class="gate-link" id="lb-pwvergessen" onclick="pwVergessenZeigen()">Passwort vergessen?</button>
  </div>

  <!-- "Passwort vergessen" (ENT-373): Anmeldename eingeben, ein Link geht
       -- falls hinterlegt -- per E-Mail raus. Bewusst im GATE-Container und
       NICHT in der Schublade (.blatt): Die Schublade sitzt auf z-index 61,
       das Gate auf z-index 900 -- vor der Anmeldung waere sie unsichtbar
       dahinter verschwunden (dieselbe Art Fehler wie bei ENT-345/346,
       diesmal vor dem Bauen gefunden statt danach). -->
  <div class="gate-form" id="gate-vergessen" style="display:none">

// Muss zu PASSWORT_MIN in backend/anmeldung.php passen -- und zu der Zahl,
// die W.mind6 dem Nutzer nennt. test_passwortfelder.mjs vergleicht alle
// drei. Die Zahl steht in dashboard.html, index.html und hier je einmal;
// eine gemeinsame Datei gaebe es nur fuer zwei der drei Oberflaechen,
// darum haelt die Pruefung sie zusammen statt der Ladereihenfolge.
const PW_MIN = 6;

const WOCHENTAG = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];

// ── Zustand
const API = 'api/';
let token = localStorage.getItem('rv3_token') || '';
let ich = JSON.parse(localStorage.getItem('rv3_user') || 'null');
let schichten = [];
let rapporte = [];
let sperrtage = {};   // Datum -> Bemerkung (ENT-028)

// Rapport kennt die tatsächliche Pausenabrechnung noch nicht, die entsteht
// erst im Abgleich. Zwei Stundenzahlen für denselben Monat wären für
// Mitarbeitende nicht auflösbar gewesen.
let stdMonat = '';          // JJJJ-MM des angezeigten Monats
let stdSchichten = null;    // null = noch nicht geladen
let reiter = 'heute';
let blattId = null;
// Rundgang-Durchfuehrung (ENT-180/182/145): der aktuell in der Checkliste
// gezeigte Rundgang, oder null ausserhalb dieses Bildschirms.
let rundgangAktiv = null;
const RD_WARTESCHLANGE = 'sop_rundgang_warteschlange';
// Eigene Ablage fuer die Aufgaben-Antworten (ENT-305). Sie reisen ueber
// DENSELBEN Endpunkt wie die Scans, brauchen aber einen eigenen Schluessel:
// Ein Scan wird je Kontrollpunkt einmal gemeldet, Antworten koennen zu
// einem Punkt mehrere sein.
const RD_AUFGABEN_WARTESCHLANGE = 'sop_rundgang_aufgaben';
// Bewegungsspur, die noch nicht uebermittelt ist (ENT-318). Eigene
// Warteschlange und nicht die der Scans: Ein Scan ist ein Nachweis und muss
// ankommen; eine Position ist eine Zugabe. Werden sie gemeinsam gefuehrt,
// koennte eine gescheiterte Position einen Scan blockieren -- die falsche
// Rangfolge.
const RD_POSITIONEN = 'sop_rundgang_positionen';

// ── Hilfen
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (n, d) => Number(n || 0).toLocaleString('de-CH', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
const dmy = d => d ? String(d).slice(0, 10).split('-').reverse().join('.') : '–';
const hm = t => t ? String(t).slice(0, 5) : '';
const tagVon = e => String(e.datum || '').slice(0, 10);
const isoTag = d => { d = d || new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const ueberNacht = e => hm(e.bis) <= hm(e.von);

function initialen(s) {
  const p = String(s || '').replace(/[._-]+/g, ' ').trim().split(/\s+/).filter(Boolean);
  return ((p[0] || '?')[0] + (p[1] ? p[1][0] : '')).toUpperCase();
}
function vollerName(o) {
  const n = [o.vorname, o.nachname].filter(Boolean).join(' ').trim();
  return n || o.name || '';
}
function toast(text) {
  const el = $('toast'); el.textContent = text; el.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2800);
}
// Zeitfenster einer Schicht. Endet sie vor ihrem Beginn, läuft sie über
// Mitternacht in den Folgetag.
function spanne(datum, von, bis) {
  const tag = String(datum || '').slice(0, 10);
  const a = Date.parse(tag + 'T' + hm(von) + ':00');
  let b = Date.parse(tag + 'T' + hm(bis) + ':00');
  if (isNaN(a) || isNaN(b)) return null;
  if (b <= a) b += 864e5;
  return [a, b];
}

function api(pfad, opts) {
  opts = opts || {};
  const kopf = { 'Content-Type': 'application/json' };
  if (token) kopf['X-Auth-Token'] = token;
  return fetch(API + pfad, {
    method: opts.method || 'GET', headers: kopf,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(r => r.json().then(data => ({ ok: r.ok, status: r.status, data })).catch(() => ({ ok: false, status: r.status, data: {} })))
    .catch(() => ({ ok: false, status: 0, data: {} }));
}

// "Passwort vergessen" / "Neues Passwort setzen" (ENT-373). Drei Zustaende
// EINES Containers (#gate), nicht drei Seiten -- passt zum Rest der App
// (siehe planUnterWahl: ein Container, mehrere sichtbare Teile).
let pwResetToken = null;   // gesetzt, sobald ?reset=<token> gelesen wurde
function gateZeige(teil) {
  $('gate-login').style.display = teil === 'login' ? '' : 'none';
  $('gate-vergessen').style.display = teil === 'vergessen' ? '' : 'none';
  $('gate-reset').style.display = teil === 'reset' ? '' : 'none';
}
function pwVergessenZeigen() {
  $('gvName').value = $('gName').value;   // was schon eingetippt war, nicht nochmal verlangen
  $('gvErr').style.display = 'none';
  $('gvOk').style.display = 'none';
  $('gvHinweis').style.display = '';
  gateZeige('vergessen');
}
function pwVergessenZurueck() {
  gateZeige('login');
}
function pwVergessenSenden() {
  const name = $('gvName').value.trim();
  const err = $('gvErr'); err.style.display = 'none';
  if (!name) { err.textContent = 'Anmeldename erforderlich'; err.style.display = ''; return; }
  const b = $('gvBtn'); b.disabled = true;
  api('passwort_vergessen.php', { method: 'POST', body: { name } }).then(({ data }) => {
    b.disabled = false;
    // Die Antwort ist absichtlich in JEDEM Fall dieselbe (siehe
    // passwort_vergessen.php) -- hier wird sie unveraendert gezeigt, es gibt
    // nichts zu unterscheiden.
    $('gvHinweis').style.display = 'none';
    $('gvOk').textContent = data.message || 'Falls dieser Anmeldename mit einer hinterlegten E-Mail-Adresse verknüpft ist, wurde eine Nachricht verschickt.';
    $('gvOk').style.display = '';
  });
}
function pwResetSpeichern() {
  const neu = $('grNeu').value;
  const err = $('grErr'); err.style.display = 'none';
  if (neu.length < PW_MIN) { err.textContent = 'Passwort mindestens ' + PW_MIN + ' Zeichen'; err.style.display = ''; return; }
  const b = $('grBtn'); b.disabled = true;
  api('passwort_zuruecksetzen.php', { method: 'POST', body: { token: pwResetToken, neu } }).then(({ ok, data }) => {
    b.disabled = false;
    if (!ok || data.status !== 'ok') { err.textContent = data.message || w('netzfehler'); err.style.display = ''; return; }
    pwResetToken = null;
    $('grNeu').value = '';
    $('gName').value = data.name || '';
    $('gPass').value = '';
    gateZeige('login');
    toast('Passwort gesetzt -- bitte anmelden');
  });
}

function anmelden() {
  const name = $('gName').value.trim(), pass = $('gPass').value;
  const err = $('gErr'); err.style.display = 'none';
  if (!name || !pass) { err.textContent = w('beidesNoetig'); err.style.display = ''; return; }
  const b = $('gBtn'); b.disabled = true;
  api('login.php', { method: 'POST', body: { name, password: pass } }).then(({ ok, data }) => {
    b.disabled = false;
    if (!ok || data.status !== 'ok') { err.textContent = data.message || w('fehlerAnmeldung'); err.style.display = ''; return; }
    token = data.token;
    ich = { name: data.name, ist_admin: data.ist_admin };
    localStorage.setItem('rv3_token', token);
    localStorage.setItem('rv3_user', JSON.stringify(ich));
    starten();
  });
}
function abmelden() {
  api('logout.php', { method: 'POST' });
  localStorage.removeItem('rv3_token'); localStorage.removeItem('rv3_user');
  location.reload();
}
function starten() {
  $('gate').style.display = 'none';
  $('app').classList.add('on');
  $('kName').textContent = ich.name;
  $('kKreis').textContent = initialen(ich.name);
  allesLaden();
  // Ueberlebt einen Geraeteneustart oder App-Neuinstallation zwischen den
  // Sitzungen: liegen aus einer frueheren, offline gebliebenen Rundgang-
  // Meldung noch Eintraege in localStorage, wird jetzt ein Sendeversuch
  // unternommen (ENT-132 Punkt 5).
  rdWarteschlangeSenden();
  // Der Aufkleber im Fahrzeug (ENT-340) fuehrt auf app.html?fz=<Kennung>.
  // Bewusst die normale Kamera-App des Telefons als Scanner: Sie kann jedes
  // Geraet, sie oeffnet die Adresse selbst, und ein eigener Scanner im
  // Browser waere auf iOS-Safari ohnehin nicht zuverlaessig verfuegbar.
  //
  // Die Kennung wird SOFORT aus der Adresszeile entfernt: Sie ist das
  // Geheimnis hinter dem Aufkleber und hat weder im Verlauf noch in einem
  // geteilten Link etwas zu suchen.
  const start = new URLSearchParams(location.search);
  const fzKennung = start.get('fz');
  if (fzKennung) {
    history.replaceState(null, '', location.pathname);
    fzuAusKennung(fzKennung);
  }
}

function allesLaden() {
  const b = $('kLaden'); b.disabled = true;
  const heute = new Date();
  $('kDatum').textContent = WOCHENTAG[heute.getDay()] + ', ' + dmy(isoTag(heute));
  return Promise.all([ladeSchichten(), ladeProfil(), ladeRapporte(), ladeSperren(), ladeAbwesenheiten()])
    .then(() => { b.disabled = false; waechterTabAktualisieren(); zeichne(); });
}

// ENT-234, seit ENT-284 umgestellt: "Wächter" erscheint nur mit der
// ausdrücklich gesetzten Berechtigung (Mitarbeiter-Akte, Personal/
// Verwaltung) -- nicht mehr aus der Schicht-Historie hergeleitet. Der
// alte Weg (irgendeine geladene Schicht mit Kontrollpunkten) brach genau
// dann, wenn jemand spontan eine Runde an einem Objekt laufen wollte, dem
// er (noch) nicht zugeteilt war (ENT-282 "unabhängig von den Schichten") --
// ohne eine geladene Schicht blieb der Reiter unerreichbar, gerade im
// Moment, in dem die spontane Übersicht ihn gebraucht hätte.
function waechterSichtbar() {
  return !!(profil && profil.revierdienst_berechtigt);
}
