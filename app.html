<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<!-- Kein Zoom (ENT-059) -- dieselbe Begruendung wie im Cockpit.
     viewport-fit=cover bleibt: es haelt den Inhalt aus der Notch. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cockpit</title>
<link rel="icon" href="icons/icon-32.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#16181D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ══════════════════════════════════════════════════════════════════
   MITARBEITER-APP — dieselben Farben wie das Dashboard, aber eigener
   Aufbau: grosse Flächen, untere Reiterleiste, dicke Zeitangaben.
   Gedacht für draussen: kurze Blicke, kalte Finger, helles Licht.
   ══════════════════════════════════════════════════════════════════ */

/* Kein Zoom durch Doppeltippen oder Feld-Fokus (ENT-059). */
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
.inp, input, select, textarea { font-size: 16px; }

:root {
  --shell:  #16181D;  --shell-hi: #1E2128;  --shell-line: #272B33;
  --shell-txt: #9298A5; --shell-txt-hi: #F3F5F8;
  --bg: #F4F6F8;  --surface: #FFFFFF;  --line: #E5E8EC;  --line-soft: #EFF1F4;
  --ink: #14161A;  --ink-2: #545B67;  --ink-3: #8B919D;
  --accent: #2F5BD7;  --accent-hi: #2549B0;  --accent-soft: #EDF2FE;  --accent-line: #CBD9F9;
  --pos: #0E7C55;  --pos-soft: #E6F6EF;
  --neg: #C2382A;  --neg-soft: #FCEDEB;
  --warn: #9A6B08; --warn-soft: #FBF3E0;
  --r-sm: 9px; --r: 14px; --r-lg: 20px;
  --sh-1: 0 1px 2px rgba(16,18,22,.06);
  --sh-2: 0 10px 30px -10px rgba(16,18,22,.22);
  --sh-3: 0 -8px 32px -12px rgba(16,18,22,.24);
  --tab-h: 62px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
}
.num, .zeit, b, strong { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
svg.i { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i-sm { width: 17px; height: 17px; }

/* ── Bedienelemente: grosse Ziele, draussen bedienbar */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 18px; border: 1px solid transparent; border-radius: var(--r-sm);
  font: inherit; font-size: 15px; font-weight: 640; cursor: pointer; text-decoration: none;
  transition: background .13s, border-color .13s; white-space: nowrap;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:active { background: var(--accent-hi); }
.btn-plain { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn-plain:active { background: var(--bg); }
.btn-pos { background: var(--pos-soft); color: var(--pos); border-color: #BCE5D3; }
.btn-neg { background: var(--neg-soft); color: var(--neg); border-color: #F3C8C2; }
.btn-wide { width: 100%; }
.btn:disabled { opacity: .5; }
.f { margin-bottom: 16px; }
.f label { display: block; font-size: 12px; font-weight: 660; color: var(--ink-2); letter-spacing: .4px; text-transform: uppercase; margin-bottom: 7px; }
.inp {
  width: 100%; min-height: 48px; border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 12px 14px; font: inherit; font-size: 16px; color: var(--ink);
  background: var(--surface); -webkit-appearance: none; appearance: none;
}
.inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.msg-err { font-size: 14px; color: var(--neg); background: var(--neg-soft); border-radius: var(--r-sm); padding: 11px 13px; margin-bottom: 16px; }

/* Unterschrift-Canvas fuer "Schicht rapportieren" (ENT-082), gleiches Muster
   wie im bestehenden Rapport Tool (index.html). */
.sig-wrap { border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; background: var(--surface); position: relative; margin-bottom: 16px; }
.sig-wrap canvas { display: block; width: 100%; touch-action: none; cursor: crosshair; }
.sig-actions { display: flex; justify-content: flex-end; padding: 8px 10px; border-top: 1px solid var(--line); }
/* 44px auch hier: "Loeschen" ist ein Bedienelement auf dem Handy wie jedes
   andere, und danebengetippt heisst hier, die Unterschrift des Kunden zu
   verlieren. Im alten Rapport Tool (index.html) ist er kleiner -- das ist
   kein Grund, den Fehler mitzunehmen. */
.sig-clear { font-size: 13.5px; color: var(--neg); background: none; border: none; cursor: pointer; font-weight: 640; padding: 0 12px; border-radius: 6px; min-height: 44px; }
.sig-placeholder { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 13px; color: var(--ink-3); pointer-events: none; text-align: center; line-height: 1.5; }

/* ══════════════════════════════════════════ ZUGANG */
#gate { position: fixed; inset: 0; z-index: 900; background: var(--shell); display: flex; flex-direction: column; padding: 28px 22px calc(28px + env(safe-area-inset-bottom)); }
.gate-oben { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.gate-oben img { width: 66px; height: 66px; border-radius: 18px; background: #fff; padding: 5px; margin-bottom: 18px; }
.gate-oben .wm { color: var(--shell-txt-hi); font-size: 26px; font-weight: 700; letter-spacing: -.5px; }
.gate-oben .sub { color: #656B78; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; margin-top: 4px; }
.gate-form { background: var(--surface); border-radius: var(--r-lg); padding: 22px; box-shadow: var(--sh-2); }

/* ══════════════════════════════════════════ GERÜST */
.app { display: none; min-height: 100%; flex-direction: column; }
.app.on { display: flex; }
.kopf {
  background: var(--shell); color: var(--shell-txt-hi);
  padding: calc(14px + env(safe-area-inset-top)) 20px 16px;
  display: flex; align-items: center; gap: 14px;
}
.kopf .wer { flex: 1; min-width: 0; }
.kopf .wer b { display: block; font-size: 17px; font-weight: 680; letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kopf .wer span { font-size: 12.5px; color: var(--shell-txt); }
.kopf .kreis { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex: none; }

.inhalt { flex: 1; padding: 18px 16px calc(var(--tab-h) + 26px + env(safe-area-inset-bottom)); }
.v { display: none; }
.v.on { display: block; animation: auf .18s ease-out; }
@keyframes auf { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.titel { font-size: 13px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--ink-3); margin: 4px 0 12px; }
.titel:not(:first-child) { margin-top: 28px; }

/* ── Untere Reiterleiste */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  background: rgba(255,255,255,.94); backdrop-filter: saturate(180%) blur(14px); -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-top: 1px solid var(--line);
  display: flex; padding-bottom: env(safe-area-inset-bottom);
}
.tabs button {
  flex: 1; min-height: var(--tab-h); border: none; background: transparent; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--ink-3); font: inherit; font-size: 11px; font-weight: 620; padding: 6px 2px;
}
.tabs button.on { color: var(--accent); }
.tabs button .punkt { width: 5px; height: 5px; border-radius: 50%; background: var(--neg); position: absolute; margin: -16px 0 0 18px; }

/* ── Karten */
.karte { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh-1); margin-bottom: 12px; overflow: hidden; }
.karte-bd { padding: 16px; }

/* ── Schichtkarte: die Zeit ist die wichtigste Angabe */
.schicht { display: block; width: 100%; text-align: left; border: none; background: transparent; font: inherit; color: inherit; cursor: pointer; padding: 0; }
.schicht .oben { display: flex; align-items: flex-start; gap: 14px; padding: 16px; }
.schicht .zeit { font-size: 21px; font-weight: 720; letter-spacing: -.6px; white-space: nowrap; }
.schicht .zeit .folgetag { display: block; font-size: 11px; font-weight: 620; color: var(--ink-3); letter-spacing: 0; }
.schicht .was { flex: 1; min-width: 0; }
.schicht .was b { display: block; font-size: 15.5px; font-weight: 660; }
.schicht .was span { display: block; font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }
.schicht .balken { width: 4px; align-self: stretch; border-radius: 3px; background: var(--accent); flex: none; }
.schicht .balken.prov { background: var(--warn); }
.schicht .balken.ab { background: var(--ink-3); }
.schicht .balken.best { background: var(--pos); }
.fuss { display: flex; align-items: center; gap: 8px; padding: 11px 16px; border-top: 1px solid var(--line-soft); background: #FCFDFE; flex-wrap: wrap; }

.marke { display: inline-flex; align-items: center; gap: 5px; border-radius: 20px; padding: 4px 11px; font-size: 12px; font-weight: 660; white-space: nowrap; }
.m-n { background: var(--line-soft); color: var(--ink-2); }
.m-a { background: var(--accent-soft); color: var(--accent); }
.m-p { background: var(--pos-soft); color: var(--pos); }
.m-w { background: var(--warn-soft); color: var(--warn); }
.m-x { background: var(--neg-soft); color: var(--neg); }

/* ── Tagesüberschrift im Plan */
/* Der Tageskopf muss auch auf 320px halten: der Wochentag wird notfalls
   gekuerzt, die Anzahl rutscht notfalls auf eine zweite Zeile. */
.tag-kopf { display: flex; flex-wrap: wrap; align-items: baseline; gap: 9px; margin: 22px 2px 10px; }
.tag-kopf > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag-kopf .anz { flex: none; margin-left: auto; }
.tag-kopf b { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
.tag-kopf span { font-size: 12.5px; font-weight: 640; letter-spacing: .6px; text-transform: uppercase; color: var(--ink-3); }
.tag-kopf .sp { flex: 1; }

/* ── Sperrtage (ENT-028) */
.sperr-karte { margin-bottom: 8px; }
.sperr-karte.aus { border-color: var(--warn); background: var(--warn-soft); }
.sperr-zeile { display: flex; align-items: center; gap: 13px; width: 100%; padding: 12px 14px;
  border: none; background: none; font-family: inherit; text-align: left; cursor: pointer; min-height: 58px; }
.sperr-zeile .tg { flex: none; width: 46px; }
.sperr-zeile .tg b { display: block; font-size: 14px; font-weight: 700; }
.sperr-zeile .tg span { display: block; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.sperr-zeile .ws { flex: 1; min-width: 0; }
.sperr-zeile .ws b { display: block; font-size: 14.5px; font-weight: 640; }
.sperr-zeile .ws span { display: block; font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sperr-zeile .ws .warn { color: var(--warn); font-weight: 620; }
/* Der Schalter zeigt den Zustand, ohne dass man den Text lesen muss. */
.schalter { flex: none; width: 48px; height: 28px; border-radius: 999px; background: var(--line); position: relative; transition: background .18s; }
.schalter i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
  background: #fff; box-shadow: var(--sh-1); transition: transform .18s; }
.schalter.an { background: var(--warn); }
.schalter.an i { transform: translateX(20px); }
.sperr-notiz { display: flex; align-items: center; gap: 7px; width: 100%; padding: 10px 14px;
  border: none; border-top: 1px solid rgba(154,107,8,.22); background: none; font-family: inherit;
  font-size: 12.5px; font-weight: 620; color: var(--warn); cursor: pointer; min-height: 42px; }
@media (prefers-reduced-motion: reduce) { .schalter, .schalter i { transition: none; } }

/* ── Leerzustand */
.leer { text-align: center; padding: 46px 22px; }
.leer .ic { width: 52px; height: 52px; border-radius: 16px; background: var(--line-soft); color: var(--ink-3); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px; }
.leer h3 { font-size: 16px; font-weight: 660; margin-bottom: 6px; }
.leer p { font-size: 14px; color: var(--ink-3); line-height: 1.6; }

/* ── Kennzahl-Paar */
.zahlen { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.zahl { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 15px 16px; box-shadow: var(--sh-1); }
.zahl b { display: block; font-size: 25px; font-weight: 720; letter-spacing: -.8px; line-height: 1.15; }
.zahl span { font-size: 11.5px; font-weight: 650; letter-spacing: .5px; text-transform: uppercase; color: var(--ink-3); }
.zahl { position: relative; }
/* Fragezeichen in der Ecke der Zeitbonus-Kachel (ENT-052). Bewusst gross
   genug zum Antippen (42 px), auch wenn das Symbol darin klein ist -- eine
   30-Pixel-Flaeche trifft auf dem Handy niemand zuverlaessig. */
.zahl-info {
  position: absolute; top: 3px; right: 3px; width: 42px; height: 42px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: none; padding: 0; border-radius: 50%;
  color: var(--ink-3); cursor: pointer;
}
.zahl-info:active { background: var(--line-soft); }
/* Hinweis auf noch nicht abgeglichene Schichten (ENT-053). Bewusst in
   ruhigem Grau und nicht in Warnfarbe: Im laufenden Monat ist ein offener
   Abgleich der Normalfall, keine Stoerung. */
.offen-hinweis {
  font-size: 13px; line-height: 1.4; color: var(--ink-3);
  padding: 10px 14px; margin-bottom: 12px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); box-shadow: var(--sh-1);
}
.zahl-info svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ── Angabenliste */
.dl { display: grid; grid-template-columns: 40% 1fr; gap: 0 12px; }
.dl dt { font-size: 12px; font-weight: 650; letter-spacing: .3px; text-transform: uppercase; color: var(--ink-3); padding: 11px 0; border-bottom: 1px solid var(--line-soft); }
.dl dd { font-size: 15px; font-weight: 550; padding: 11px 0; border-bottom: 1px solid var(--line-soft); word-break: break-word; }
.dl dt:last-of-type, .dl dd:last-of-type { border-bottom: none; }

/* Unterlagen zur Schicht (ENT-117). Ganze Zeile als Trefferfläche und
   mindestens 44 px hoch -- am Bauzaun wird das mit Handschuhen getippt. */
/* Der Routenknopf steht in der Adresszeile und ist ein echtes Bedienelement
   auf einem Telefon -- 44 px Trefferflaeche wie jedes andere auch. */
.route-knopf { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px;
  min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); color: var(--ink); font-size: 13.5px; font-weight: 620;
  text-decoration: none; }
.route-knopf:active { background: var(--flaeche-2, rgba(127,127,127,.12)); }
.route-i { width: 15px; height: 15px; flex: none; stroke: currentColor; stroke-width: 1.9;
  fill: none; stroke-linecap: round; stroke-linejoin: round; }

.dok-kopf { font-size: 12px; font-weight: 650; letter-spacing: .3px; text-transform: uppercase;
  color: var(--ink-3); margin: 18px 0 8px; }
.dok-liste { display: flex; flex-direction: column; gap: 8px; }
.dok-zeile { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 48px;
  padding: 11px 13px; text-align: left; font: inherit; font-size: 15px; font-weight: 550;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-sm); cursor: pointer; }
.dok-zeile:active { background: var(--accent-soft); border-color: var(--accent-line); }
.dok-zeile .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dok-zeile .gr { flex: none; font-size: 12.5px; font-weight: 550; color: var(--ink-3); }

/* Antippbare Zeile, die eine Unterseite oeffnet (ENT-051). Sieht aus wie ein
   Eintrag, verhaelt sich wie ein Knopf -- darum ein <button>, kein <div> mit
   onclick: nur so ist sie mit der Tastatur und mit Vorlesehilfen erreichbar. */
.nav-zeile {
  display: flex; align-items: center; gap: 13px; width: 100%;
  padding: 16px; background: none; border: none; font: inherit;
  text-align: left; color: inherit; cursor: pointer; min-height: 60px;
}
.nav-zeile:active { background: var(--line-soft); }
.nav-zeile .txt { flex: 1; min-width: 0; }
.nav-zeile .txt b { display: block; font-size: 15px; font-weight: 650; letter-spacing: -.1px; }
.nav-zeile .txt span { display: block; font-size: 13px; color: var(--ink-3); margin-top: 2px; }
.nav-zeile .chev { flex: none; width: 18px; height: 18px; stroke: var(--ink-3); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.seiten-kopf { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.seiten-kopf h2 { font-size: 19px; font-weight: 700; letter-spacing: -.3px; }

/* ── Blatt von unten (Schichtdetail, Passwort) */
.abdunkeln { position: fixed; inset: 0; z-index: 60; background: rgba(16,18,22,.45); opacity: 0; pointer-events: none; transition: opacity .2s; }
.abdunkeln.on { opacity: 1; pointer-events: auto; }
.blatt {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; max-height: 88vh;
  background: var(--surface); border-radius: var(--r-lg) var(--r-lg) 0 0; box-shadow: var(--sh-3);
  transform: translateY(100%); transition: transform .24s cubic-bezier(.32,.72,0,1);
  display: flex; flex-direction: column;
}
.blatt.on { transform: none; }
.blatt-griff { padding: 10px 0 4px; display: flex; justify-content: center; flex: none; }
.blatt-griff i { width: 38px; height: 4px; border-radius: 3px; background: var(--line); display: block; }
.blatt-kopf { display: flex; align-items: center; gap: 12px; padding: 6px 20px 14px; border-bottom: 1px solid var(--line-soft); flex: none; }
.blatt-kopf h2 { font-size: 18px; font-weight: 680; letter-spacing: -.3px; flex: 1; min-width: 0; }
.blatt-bd { padding: 18px 20px; overflow-y: auto; flex: 1; }
.blatt-ft { padding: 14px 20px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line-soft); display: flex; gap: 10px; flex: none; }
.blatt-ft .btn { flex: 1; }
/* Beantworteter Zustand (ENT-120): erst die Aussage, darunter die Knoepfe.
   Ueberschrift oben, Wert darunter -- und die Knoepfe stehen nebeneinander,
   damit keiner allein ueber die volle Breite gezogen wird. */
.blatt-ft.gestapelt { flex-direction: column; align-items: stretch; gap: 12px; }
.blatt-ft .ft-stand { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.blatt-ft .ft-txt { font-size: 12.5px; color: var(--ink-3); line-height: 1.5; flex: 1 1 160px; }
.blatt-ft .ft-reihe { display: flex; gap: 10px; }

/* ── Hinweis */
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(var(--tab-h) + 18px + env(safe-area-inset-bottom)); background: var(--shell); color: #fff; padding: 13px 18px; border-radius: var(--r-sm); font-size: 14.5px; font-weight: 560; box-shadow: var(--sh-2); z-index: 200; opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity .18s, transform .18s; text-align: center; }
.toast.on { opacity: 1; transform: none; }

/* ── Skelett */
.sk { background: linear-gradient(90deg, var(--line-soft) 25%, #E4E7EC 50%, var(--line-soft) 75%); background-size: 200% 100%; animation: sh 1.3s infinite; border-radius: var(--r-sm); }
@keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }

@media (min-width: 700px) {
  /* Auf grösseren Geräten mittig halten statt in die Breite ziehen */
  .app { max-width: 560px; margin: 0 auto; box-shadow: 0 0 0 1px var(--line); min-height: 100vh; }
  .tabs { max-width: 560px; left: 50%; transform: translateX(-50%); }
  .blatt { max-width: 560px; left: 50%; transform: translateX(-50%) translateY(100%); }
  .blatt.on { transform: translateX(-50%); }
  .toast { max-width: 528px; left: 50%; transform: translateX(-50%) translateY(8px); }
  .toast.on { transform: translateX(-50%); }
}
</style>
</head>
<body>

<!-- ══════════════════════════ ANMELDUNG ══════════════════════════ -->
<div id="gate">
  <div class="gate-oben">
    <img src="icons/icon-192.png" alt="">
    <div class="wm">Cockpit</div>
    <div class="sub">CUPI 24 GmbH</div>
  </div>
  <div class="gate-form">
    <div id="gErr" class="msg-err" style="display:none"></div>
    <div class="f"><label for="gName" id="lb-name">Name</label><input class="inp" id="gName" autocomplete="username" autocapitalize="none"></div>

    datenHinweis: 'Änderungen an deinen Daten macht die Verwaltung.',

const w = k => W[k] || k;

const WOCHENTAG = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];

// ── Zustand
const API = 'api/';
let token = localStorage.getItem('rv3_token') || '';
let ich = JSON.parse(localStorage.getItem('rv3_user') || 'null');
let schichten = [];
let rapporte = [];
let sperrtage = {};   // Datum -> Bemerkung (ENT-028)
let profil = null;
// Die frühere Monatssumme aus den Rapporten ist entfallen (ENT-049): der
// Rapport kennt die tatsächliche Pausenabrechnung noch nicht, die entsteht
// erst im Abgleich. Zwei Stundenzahlen für denselben Monat wären für
// Mitarbeitende nicht auflösbar gewesen.
let stdMonat = '';          // JJJJ-MM des angezeigten Monats
let stdSchichten = null;    // null = noch nicht geladen
let reiter = 'heute';
let blattId = null;
// Unterschrift-Canvas fuer "Schicht rapportieren" (ENT-082).
let sigCtx = null, isDrawing = false, lastX = 0, lastY = 0, sigDirty = false;

// ── Hilfen
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (n, d) => Number(n || 0).toLocaleString('de-CH', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
const dmy = d => d ? String(d).slice(0, 10).split('-').reverse().join('.') : '–';
const hm = t => t ? String(t).slice(0, 5) : '';
const tagVon = e => String(e.datum || '').slice(0, 10);
const isoTag = d => { d = d || new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const ueberNacht = e => hm(e.bis) <= hm(e.von);

function initialen(s) {
  const p = String(s || '').replace(/[._-]+/g, ' ').trim().split(/\s+/).filter(Boolean);
  return ((p[0] || '?')[0] + (p[1] ? p[1][0] : '')).toUpperCase();
}
function vollerName(o) {
  const n = [o.vorname, o.nachname].filter(Boolean).join(' ').trim();
  return n || o.name || '';
}
function toast(text) {
  const el = $('toast'); el.textContent = text; el.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2800);
}
// Zeitfenster einer Schicht. Endet sie vor ihrem Beginn, läuft sie über
// Mitternacht in den Folgetag.
function spanne(datum, von, bis) {
  const tag = String(datum || '').slice(0, 10);
  const a = Date.parse(tag + 'T' + hm(von) + ':00');
  let b = Date.parse(tag + 'T' + hm(bis) + ':00');
  if (isNaN(a) || isNaN(b)) return null;
  if (b <= a) b += 864e5;
  return [a, b];
}

function api(pfad, opts) {
  opts = opts || {};
  const kopf = { 'Content-Type': 'application/json' };
  if (token) kopf['X-Auth-Token'] = token;
  return fetch(API + pfad, {
    method: opts.method || 'GET', headers: kopf,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(r => r.json().then(data => ({ ok: r.ok, status: r.status, data })).catch(() => ({ ok: false, status: r.status, data: {} })))
    .catch(() => ({ ok: false, status: 0, data: {} }));
}

function beschriften() {
  $('lb-name').textContent = w('name');
  $('lb-pass').textContent = w('passwort');
  $('gBtn').textContent = w('anmelden');
  $('lb-tab-heute').textContent = w('heute');
  $('lb-tab-plan').textContent = w('plan');
  $('lb-tab-sperren').textContent = w('sperren');
  $('lb-tab-rapport').textContent = w('rapport');
  $('lb-tab-profil').textContent = w('profil');
}

// ══════════════════════════════════════════ ZUGANG
function anmelden() {
  const name = $('gName').value.trim(), pass = $('gPass').value;
  const err = $('gErr'); err.style.display = 'none';
  if (!name || !pass) { err.textContent = w('beidesNoetig'); err.style.display = ''; return; }
  const b = $('gBtn'); b.disabled = true;
  api('login.php', { method: 'POST', body: { name, password: pass } }).then(({ ok, data }) => {
    b.disabled = false;
    if (!ok || data.status !== 'ok') { err.textContent = data.message || w('fehlerAnmeldung'); err.style.display = ''; return; }
    token = data.token;
    ich = { name: data.name, ist_admin: data.ist_admin };
    localStorage.setItem('rv3_token', token);
    localStorage.setItem('rv3_user', JSON.stringify(ich));
    starten();
  });
}
function abmelden() {
  api('logout.php', { method: 'POST' });
  localStorage.removeItem('rv3_token'); localStorage.removeItem('rv3_user');
  location.reload();
}
function starten() {
  $('gate').style.display = 'none';
  $('app').classList.add('on');
  $('kName').textContent = ich.name;
  $('kKreis').textContent = initialen(ich.name);
  allesLaden();
}

// ══════════════════════════════════════════ LADEN
function allesLaden() {
  const b = $('kLaden'); b.disabled = true;
  const heute = new Date();
  $('kDatum').textContent = WOCHENTAG[heute.getDay()] + ', ' + dmy(isoTag(heute));
  return Promise.all([ladeSchichten(), ladeProfil(), ladeRapporte(), ladeSperren()])
    .then(() => { b.disabled = false; zeichne(); });
}
function ladeSchichten() {
  return api('meine_schichten.php').then(({ ok, status, data }) => {
    if (status === 401) return abmelden();
    schichten = (ok && data.status === 'ok') ? (data.schichten || []) : [];
  });
}
function ladeProfil() {
  return api('mein_profil.php').then(({ ok, data }) => {
    if (ok && data.status === 'ok') { profil = data.profil; }
  });
}
function ladeRapporte() {
  return api('rapport_list.php').then(({ ok, data }) => {
    rapporte = (ok && data.status === 'ok') ? (data.rapporte || []) : [];
  });
}

// ══════════════════════════════════════════ NAVIGATION
function zeige(r) {
  reiter = r;
  document.querySelectorAll('.v').forEach(v => v.classList.remove('on'));
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('on'));
  $('v-' + r).classList.add('on');
  $('t-' + r).classList.add('on');
  window.scrollTo(0, 0);
  zeichne();
}
function zeichne() {
  beschriften();
  if (reiter === 'heute') zeichneHeute();
  if (reiter === 'plan') zeichnePlan();
  if (reiter === 'sperren') zeichneSperren();
  if (reiter === 'rapport') zeichneRapport();
  if (reiter === 'profil') zeichneProfil();
}

const LEER = (t, p, ic) => `<div class="karte"><div class="leer">
  <div class="ic"><svg class="i" viewBox="0 0 24 24">${ic || '<circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'}</svg></div>
  <h3>${esc(t)}</h3><p>${esc(p)}</p></div></div>`;

const STATUS_MARKE = {
  geplant: ['geplant', 'm-n'], bestaetigt: ['bestaetigt', 'm-p'],
  provisorisch: ['provisorisch', 'm-w'], abgesagt: ['abgesagt', 'm-x']
};
const ZUSAGE_MARKE = { zugesagt: ['zugesagt', 'm-p'], abgelehnt: ['abgelehnt', 'm-x'], offen: ['offen', 'm-n'] };

// Eine Schichtkarte. Die Zeit steht vorne und gross -- danach wird draussen
// zuerst gesucht.
function schichtKarte(e, mitDatum) {
  const bal = e.status === 'abgesagt' ? 'ab' : (e.status === 'provisorisch' ? 'prov' : (e.status === 'bestaetigt' ? 'best' : ''));
  const st = STATUS_MARKE[e.status] || STATUS_MARKE.geplant;
  const zu = ZUSAGE_MARKE[e.zusage] || ZUSAGE_MARKE.offen;
  return `<div class="karte">
    <button class="schicht" onclick="blattAuf(${Number(e.id)})">
      <div class="oben">
        <span class="balken ${bal}"></span>
        <span class="zeit">${hm(e.von)}<br>${hm(e.bis)}${ueberNacht(e) ? `<span class="folgetag">${esc(w('folgetag'))}</span>` : ''}</span>
        <span class="was">
          <b>${esc(e.titel || e.kunde_name)}</b>
          <span>${esc(e.ort)}${e.strasse ? ' · ' + esc(e.strasse) : ''}</span>
          ${mitDatum ? `<span>${esc(WOCHENTAG[new Date(tagVon(e) + 'T12:00:00').getDay()])}, ${dmy(e.datum)}</span>` : ''}
        </span>
      </div>
    </button>
    <div class="fuss">
      <span class="marke ${st[1]}">${esc(w(st[0]))}</span>
      ${e.status !== 'abgesagt' ? `<span class="marke ${zu[1]}">${esc(w(zu[0]))}</span>` : ''}
      ${Number(e.im_team) > 1 ? `<span class="marke m-n">${Number(e.im_team)} ${esc(w('imTeam'))}</span>` : ''}
    </div>
  </div>`;
}

// ══════════════════════════════════════════ HEUTE
function zeichneHeute() {
  const heute = isoTag();
  const jetzt = Date.now();
  // Eine Nachtschicht von gestern gehört noch zu heute, solange sie läuft.
  const laufend = schichten.filter(e => {
    const sp = spanne(e.datum, e.von, e.bis);
    return sp && sp[0] <= jetzt && jetzt < sp[1];
  });
  const heutige = schichten.filter(e => tagVon(e) === heute);
  const zeigen = [...new Set([...laufend, ...heutige])]
    .sort((a, b) => (spanne(a.datum, a.von, a.bis) || [0])[0] - (spanne(b.datum, b.von, b.bis) || [0])[0]);

  let html = '';
  if (!zeigen.length) {
    html = LEER(w('keineHeute'), w('keineHeuteText'), '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>');
    const naechste = schichten
      .filter(e => e.status !== 'abgesagt' && (spanne(e.datum, e.von, e.bis) || [0])[0] > jetzt)
      .sort((a, b) => (spanne(a.datum, a.von, a.bis) || [0])[0] - (spanne(b.datum, b.von, b.bis) || [0])[0])[0];
    if (naechste) html += `<div class="titel">${esc(w('naechste'))}</div>` + schichtKarte(naechste, true);
  } else {
    zeigen.forEach(e => {
      const sp = spanne(e.datum, e.von, e.bis);
      const laeuft = sp && sp[0] <= jetzt && jetzt < sp[1];
      const bald = sp && sp[0] > jetzt && sp[0] - jetzt < 3 * 3600e3;
      if (laeuft) html += `<div class="titel" style="color:var(--pos)">● ${esc(w('jetztLaeuft'))}</div>`;
      else if (bald) html += `<div class="titel" style="color:var(--accent)">${esc(w('gleich'))}</div>`;
      html += schichtKarte(e, tagVon(e) !== heute);
    });
  }
  $('v-heute').innerHTML = html;
}

// ══════════════════════════════════════════ PLAN
function zeichnePlan() {
  const heute = isoTag();
  const kommend = schichten.filter(e => tagVon(e) >= heute)
    .sort((a, b) => tagVon(a).localeCompare(tagVon(b)) || String(a.von).localeCompare(String(b.von)));
  if (!kommend.length) {
    $('v-plan').innerHTML = LEER(w('keinePlan'), w('keinePlanText'),
      '<rect x="3" y="4.5" width="18" height="17" rx="2"/><line x1="3" y1="9.5" x2="21" y2="9.5"/>');
    return;
  }
  let letzter = '', html = '';
  kommend.forEach(e => {
    const tag = tagVon(e);
    if (tag !== letzter) {
      letzter = tag;
      const amTag = kommend.filter(x => tagVon(x) === tag && x.status !== 'abgesagt');
      const wd = WOCHENTAG[new Date(tag + 'T12:00:00').getDay()];
      html += `<div class="tag-kopf">
        <span>${esc(wd)}</span><b>${dmy(tag)}</b>
        ${tag === heute ? `<span class="marke m-a">${esc(w('heute'))}</span>` : ''}
        <span class="sp"></span>
        <span class="anz">${amTag.length} ${esc(amTag.length === 1 ? w('schicht') : w('schichten'))}</span>
      </div>`;
    }
    html += schichtKarte(e, false);
  });
  $('v-plan').innerHTML = html;
}

// ══════════════════════════════════════════ SPERRTAGE (ENT-028)
// Wer nicht kann, sagt es hier. Das ist eine Mitteilung an die Planung --
// kein Anspruch und keine Garantie. Genau so steht es auch im Text.
function ladeSperren() {
  const bis = isoTag(new Date(Date.now() + 90 * 864e5));
  return api(`meine_verfuegbarkeit.php?von=${isoTag()}&bis=${bis}`).then(({ ok, data }) => {
    sperrtage = {};
    if (ok && data.status === 'ok') {
      (data.tage || []).forEach(t => { sperrtage[String(t.datum).slice(0, 10)] = t.bemerkung || ''; });
    }
  });
}

function istGesperrt(t) {
  return Object.prototype.hasOwnProperty.call(sperrtage, t);
}

function zeichneSperren() {
  const heute = isoTag();
  const tage = Array.from({ length: 63 }, (_, i) => isoTag(new Date(Date.now() + i * 864e5)));
  // Wo bin ich schon eingeteilt? Einen solchen Tag zu sperren ist ein
  // Widerspruch -- das gehoert sichtbar daneben, nicht verschwiegen.
  const belegt = {};
  schichten.forEach(e => {
    if (e.status === 'abgesagt') return;
    (belegt[tagVon(e)] = belegt[tagVon(e)] || []).push(e);
  });

  const anzahl = tage.filter(istGesperrt).length;
  let html = `<div class="karte"><div class="karte-bd">
      <div style="font-size:15px;font-weight:660;margin-bottom:5px">${esc(w('sperrenTitel'))}</div>
      <div style="font-size:13px;color:var(--ink-2);line-height:1.55">${esc(w('sperrenText'))}</div>
      ${anzahl ? `<div style="margin-top:10px"><span class="marke m-w">${anzahl} ${anzahl === 1 ? 'Tag' : 'Tage'} gesperrt</span></div>` : ''}
    </div></div>`;

  let woche = '';
  tage.forEach(t => {
    const d = new Date(t + 'T12:00:00');
    const kw = kalenderwoche(d);
    if (kw !== woche) {
      woche = kw;
      html += `<div class="titel">Woche ${esc(kw)}</div>`;
    }
    const g = istGesperrt(t);
    const notiz = g ? sperrtage[t] : '';
    const eingeteilt = (belegt[t] || []).length;
    html += `<div class="karte sperr-karte${g ? ' aus' : ''}">
      <button class="sperr-zeile" onclick="sperreUm('${t}')">
        <span class="tg">
          <b>${esc(WOCHENTAG[d.getDay()].slice(0, 2))}</b>
          <span>${dmy(t).slice(0, 5)}</span>
        </span>
        <span class="ws">
          <b>${g ? esc(w('gesperrt')) : esc(w('frei'))}</b>
          ${eingeteilt ? `<span class="warn">${esc(w('sperreEingeteilt'))}</span>`
            : (notiz ? `<span>${esc(notiz)}</span>` : `<span>${t === heute ? 'heute' : ''}</span>`)}
        </span>
        <span class="schalter${g ? ' an' : ''}"><i></i></span>
      </button>
      ${g ? `<button class="sperr-notiz" onclick="sperreNotiz('${t}')">
        <svg class="i i-sm" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
        ${notiz ? esc(w('sperreNotiz')) + ' ändern' : esc(w('sperreNotiz')) + ' hinzufügen'}
      </button>` : ''}
    </div>`;
  });
  $('v-sperren').innerHTML = html;
}

// ISO-Kalenderwoche -- der Donnerstag der Woche entscheidet über das Jahr.
function kalenderwoche(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  const jahresStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return String(Math.ceil(((t - jahresStart) / 864e5 + 1) / 7));
}

function sperreUm(t) {
  const neu = !istGesperrt(t);
  const notiz = neu ? '' : undefined;
  sperreSpeichern(t, neu, notiz);
}

function sperreSpeichern(t, gesperrt, bemerkung) {
  const rumpf = { datum: t, gesperrt };
  if (bemerkung !== undefined) rumpf.bemerkung = bemerkung;
  return api('meine_verfuegbarkeit.php', { method: 'POST', body: rumpf }).then(({ ok, data }) => {
    if (!ok || data.status !== 'ok') { toast(data.message || w('netzfehler')); return false; }
    if (gesperrt) { sperrtage[t] = data.bemerkung || ''; } else { delete sperrtage[t]; }
    zeichneSperren();
    toast(gesperrt ? w('sperreGesetzt') : w('sperreWeg'));
    return true;
  });
}

function sperreNotiz(t) {
  blattId = null;
  $('blTitel').textContent = dmy(t);
  $('blBody').innerHTML = `
    <p style="font-size:13.5px;color:var(--ink-2);line-height:1.55;margin-bottom:14px">${esc(w('sperreNotizText'))}</p>
    <div class="f"><label for="spNotiz">${esc(w('sperreNotiz'))}</label>
      <input class="inp" id="spNotiz" maxlength="200" value="${esc(sperrtage[t] || '')}" placeholder="z. B. erst ab 18 Uhr"></div>`;
  $('blFuss').innerHTML = `
    <button class="btn btn-plain" onclick="blattZu()">${esc(w('abbrechen'))}</button>
    <button class="btn btn-primary" onclick="sperreNotizSpeichern('${t}')">${esc(w('speichern'))}</button>`;
  blattZeigen();
}

function sperreNotizSpeichern(t) {
  sperreSpeichern(t, true, $('spNotiz').value.trim()).then(gut => { if (gut) blattZu(); });
}

// ══════════════════════════════════════════ UNTERSEITE MEINE STUNDEN (ENT-051)
// Die Personalien stehen im Profil im Vordergrund, die Stunden liegen eine
// Ebene tiefer. Zwei Gruende, warum das nicht nur Geschmack ist:
//
// 1. Die Zahlen werden erst geladen, wenn jemand sie sehen will. Vorher steht
//    im Profil nur die Zeile -- KEINE Zahl. Das ist Absicht: Seit ENT-049 darf
//    eine Stundensumme nie ohne den Hinweis erscheinen, dass sie keine
//    Lohnabrechnung ist. Eine "Vorschau" in der Zeile wuerde genau das tun.
// 2. Beim Verlassen des Profils faellt die Unterseite von selbst zusammen,
//    weil zeichneProfil() neu zeichnet. Kein Zustand, der haengen bleibt.
function stdSeiteAuf() {
  const h = $('pr-haupt'), u = $('pr-stunden');
  if (!h || !u) return;
  h.style.display = 'none';
  u.style.display = '';
  window.scrollTo(0, 0);
  zeichneStunden();
}
function stdSeiteZu() {
  const h = $('pr-haupt'), u = $('pr-stunden');
  if (!h || !u) return;
  u.style.display = 'none';
  h.style.display = '';
  window.scrollTo(0, 0);
}

// ══════════════════════════════════════════ MEINE STUNDEN (ENT-049)
// Die eigene, abgeglichene Arbeitszeit je Monat. Gerechnet wird mit denselben
// Regeln wie in der Verwaltung -- gav.js liegt beiden Oberflächen zugrunde,
// damit hier nie eine andere Zahl steht als dort.
//
// Gezeigt werden DREI getrennte Werte, nie einer: geleistete Zeit, Zeitbonus,
// Total. Der PAKO-Kommentar zu Art. 12 Abs. 2 verlangt ausdrücklich, dass der
// Zuschlag separat ausgewiesen wird.
//
// Und: der Hinweis darunter ist hier wichtiger als in der Verwaltung. Wer
// seine eigene Zahl liest, hält sie leicht für die Lohnabrechnung -- sie ist
// aber unvollständig (Feiertagsbonus, Zuschlag über 210 Std., Ferien,
// Absenzen fehlen). Art. 12 Ziff. 5 verlangt eine vollständige Abrechnung;
// diese Ansicht ersetzt sie nicht und sagt das im Klartext.
function stdMonatSetzen(n) {
  const m = stdMonat || new Date().toISOString().slice(0, 7);
  const d = new Date(Number(m.slice(0, 4)), Number(m.slice(5, 7)) - 1 + n, 1);
  stdMonat = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  stdSchichten = null;
  zeichneStunden();
}

function stdLaden() {
  const erster = stdMonat + '-01';
  const d = new Date(Number(stdMonat.slice(0, 4)), Number(stdMonat.slice(5, 7)), 0);
  const letzter = `${stdMonat}-${String(d.getDate()).padStart(2, '0')}`;
  return api(`meine_schichten.php?von=${erster}&bis=${letzter}`).then(({ ok, data }) => {
    stdSchichten = ok && data.status === 'ok' ? (data.schichten || []) : [];
    zeichneStunden();
  });
}

function zeichneStunden() {
  const box = $('stdBereich');
  if (!box) return;
  if (!stdMonat) { stdMonat = new Date().toISOString().slice(0, 7); }
  if (stdSchichten === null) {
    box.innerHTML = `<div class="karte"><div class="karte-bd" style="text-align:center;color:var(--ink-3)">…</div></div>`;
    stdLaden();
    return;
  }

  // Nur abgeglichene Schichten -- was nicht geprüft ist, ist kein Nachweis.
  const z = stdSchichten
    .filter(e => (e.ist_status || 'offen') !== 'offen')
    .map(e => {
      const tag = String(e.datum).slice(0, 10);
      const von = e.ist_von ? hm(e.ist_von) : '';
      const bis = e.ist_bis ? hm(e.ist_bis) : '';
      const netto = gavNetto(von, bis, e.ist_pause_min, e.ist_pause_bezahlt_ma);
      // Reinigungsschichten bekommen keinen Zeitbonus (ENT-061): Der GAV fuer
      // private Sicherheitsdienstleistungen gilt fuer sie nicht. Die geleistete
      // Zeit zaehlt selbstverstaendlich weiter -- nur die Bewertung entfaellt.
      const gav = gavGilt(e.sparte);
      return {
        tag, von, bis, netto, gav, titel: e.titel || e.einsatzart, kunde: e.kunde_name,
        pause: e.ist_pause_min, pauseBezahlt: Number(e.ist_pause_bezahlt_ma) === 1,
        nettoMin: netto ? Number(netto.slice(0, 2)) * 60 + Number(netto.slice(3, 5)) : 0,
        bonusMin: (gav && von && bis) ? gavBonusMin(tag, von, bis) : 0,
      };
    })
    .sort((a, b) => a.tag.localeCompare(b.tag) || String(a.von).localeCompare(String(b.von)));

  // Was noch nicht abgeglichen ist, wird nicht gerechnet -- aber es wird auch
  // nicht verschwiegen (ENT-053). Ohne diese Zeile sieht die Person eine Zahl,
  // die ihr zu tief vorkommt, und kann nicht unterscheiden, ob der Abgleich
  // noch aussteht oder ob etwas vergessen ging. Im laufenden Monat ist das
  // der Regelfall, nicht die Ausnahme.
  const offen = stdSchichten.filter(e => (e.ist_status || 'offen') === 'offen').length;
  const offenZeile = offen
    ? `<div class="offen-hinweis" id="stdOffen">${offen === 1
        ? esc(w('offenEine'))
        : `${offen} ${esc(w('offenMehrere'))}`}</div>`
    : '';

  const monatsName = new Date(stdMonat + '-01T12:00:00')
    .toLocaleDateString('de-CH', { month: 'long', year: 'numeric' });
  const blaettern = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <button class="btn btn-plain" id="stdZurueck" onclick="stdMonatSetzen(-1)" style="padding:6px 12px" aria-label="Vormonat">‹</button>
      <div style="flex:1;text-align:center;font-weight:640">${esc(monatsName)}</div>
      <button class="btn btn-plain" id="stdVor" onclick="stdMonatSetzen(1)" style="padding:6px 12px" aria-label="Folgemonat">›</button>
    </div>`;

  if (!z.length) {
    box.innerHTML = blaettern + LEER(w('keineStunden'), w('keineStundenText'),
      '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>') + offenZeile;
    return;
  }

  const netto = z.reduce((a, x) => a + x.nettoMin, 0);
  const ohneRegel = z.some(x => x.bonusMin === null);
  const bonus = z.reduce((a, x) => a + (x.bonusMin || 0), 0);
  const std = min => `${Math.floor(min / 60)}:${String(Math.round(min % 60)).padStart(2, '0')}`;

  // Getrennt nach Sparte (ENT-063). Bis hierher stand eine einzige Zahl da,
  // die GAV-Zeit und Nicht-GAV-Zeit addierte. Solange nur Zeit ANGEZEIGT
  // wird, ist das ertraeglich -- sobald darauf gerechnet wird, ist es falsch:
  // Die 210-Stunden-Schwelle nach Art. 14 Ziff. 3 und die Ferienentschaedigung
  // duerfen nur GAV-Stunden zaehlen. Sechzig Stunden Reinigung wuerden eine
  // Sicherheitskraft sonst kuenstlich ueber die Schwelle heben.
  const nettoGav = z.filter(x => x.gav !== false).reduce((a, x) => a + x.nettoMin, 0);
  const nettoRein = netto - nettoGav;
  const gemischt = nettoRein > 0 && nettoGav > 0;

  box.innerHTML = blaettern + `
    <div class="zahlen" id="stdZahlen">
      <div class="zahl"><b>${esc(std(netto))}</b><span>${esc(w('geleistet'))}</span></div>
      <div class="zahl">
        <button class="zahl-info" id="bonusInfo" onclick="bonusInfoBlatt()" aria-label="${esc(w('infoAria'))}" title="${esc(w('infoAria'))}">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><line x1="12" y1="11" x2="12" y2="16.5"/><line x1="12" y1="7.6" x2="12" y2="7.7"/></svg>
        </button>
        <b>+${esc(std(bonus))}</b><span>${esc(w('zeitbonus'))}</span>
      </div>
      <div class="zahl"><b>${esc(std(netto + bonus))}</b><span>${esc(w('gesamt'))}</span></div>
    </div>
    ${nettoRein > 0 ? `<div class="offen-hinweis" id="stdSparten">
      <b>${esc(w('davon'))}</b> ${esc(std(nettoGav))} ${esc(w('spGav'))} · ${esc(std(nettoRein))} ${esc(w('spRein'))}<br>
      ${esc(gemischt ? w('spGemischt') : w('spNurRein'))}
    </div>` : ''}
    ${offenZeile}
    <div class="karte" id="stdListe"><div class="karte-bd" style="padding:0">
      ${z.map(x => `<div style="padding:11px 14px;border-bottom:1px solid var(--line-soft)">
        <div style="display:flex;justify-content:space-between;gap:10px">
          <div style="min-width:0">
            <div style="font-weight:620">${esc(dmy(x.tag))} · ${esc(x.titel)}</div>
            <div style="font-size:12.5px;color:var(--ink-3)">${esc(x.kunde || '')}${x.von ? ` · ${esc(x.von)}–${esc(x.bis)}` : ''}${
              x.pause ? ` · ${nf(x.pause)} min${x.pauseBezahlt ? ' ' + esc(w('pauseBezahlt')) : ''}` : ''}${
              x.gav === false ? ` · ${esc(w('reinigung'))}` : ''}</div>
          </div>
          <div style="text-align:right;white-space:nowrap">
            <div style="font-weight:700">${esc(x.netto || '–')}</div>
            ${x.bonusMin ? `<div style="font-size:12px;color:var(--accent)">+${esc(std(x.bonusMin))}</div>` : ''}
          </div>
        </div></div>`).join('')}
    </div></div>
    <div class="karte" id="stdHinweis"><div class="karte-bd">
      <div style="font-weight:640;margin-bottom:4px">${esc(w('stundenHinweisTitel'))}</div>
      <p style="font-size:13px;color:var(--ink-3);margin:0">${esc(w('stundenHinweis'))}</p>
      <p style="font-size:13px;color:var(--warn);margin:8px 0 0">${esc(w('feiertagOffen'))}</p>
      ${ohneRegel ? `<p style="font-size:13px;color:var(--warn);margin:8px 0 0">${esc(w('ohneRegelwerk'))}</p>` : ''}
      ${z.some(x => x.gav === false)
        ? `<p style="font-size:13px;color:var(--ink-3);margin:8px 0 0">${esc(w('reinigungHinweis'))}</p>` : ''}
    </div></div>`;
}

// ══════════════════════════════════════════ BLATT
function blattAuf(id) {
  const e = schichten.find(x => Number(x.id) === Number(id));
  if (!e) return;
  blattId = Number(id);
  // Der Planung zeigen, dass diese Schicht angesehen wurde (ENT-113).
  // Beilaeufig: Ohne Rueckmeldung, ohne Wartezeit -- wer seine Schicht
  // ansieht, soll davon nichts merken. Schlaegt es fehl, fehlt das Auge in
  // der Planung; das darf das Oeffnen der Schicht nicht aufhalten.
  if (!e.gesehen_am) {
    e.gesehen_am = 'jetzt';
    api('meine_gesehen.php', { method: 'POST', body: { einsatz_id: Number(id) } }).catch(() => {});
  }
  const st = STATUS_MARKE[e.status] || STATUS_MARKE.geplant;
  const zu = ZUSAGE_MARKE[e.zusage] || ZUSAGE_MARKE.offen;
  const wd = WOCHENTAG[new Date(tagVon(e) + 'T12:00:00').getDay()];

  $('blTitel').textContent = e.titel || e.kunde_name;
  $('blBody').innerHTML = `
    ${e.status === 'abgesagt' ? `<div class="msg-err">${esc(w('abgesagtHinweis'))}</div>` : ''}
    ${e.status === 'provisorisch' ? `<div class="msg-err" style="color:var(--warn);background:var(--warn-soft)">${esc(w('provisorischHinweis'))}</div>` : ''}
    <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:16px">
      <div style="font-size:30px;font-weight:730;letter-spacing:-1px">${hm(e.von)}–${hm(e.bis)}</div>
      ${ueberNacht(e) ? `<div style="font-size:12.5px;color:var(--ink-3);font-weight:620">${esc(w('folgetag'))}</div>` : ''}
    </div>
    <dl class="dl">
      <dt>${esc(w('zeit'))}</dt><dd>${esc(wd)}, ${dmy(e.datum)}</dd>
      <dt>${esc(w('kunde'))}</dt><dd>${esc(e.kunde_name)}</dd>
      ${e.objekt_name ? `<dt>${esc(w('objekt'))}</dt><dd>${esc(e.objekt_name)}</dd>` : ''}
      <dt>${esc(w('arbeitsort'))}</dt><dd>${e.strasse ? esc(e.strasse) + '<br>' : ''}${esc(e.ort)}${e.kanton ? ' ' + esc(e.kanton) : ''}${
        schichtAdresse(e) ? `<br><a class="route-knopf" target="_blank" rel="noopener"
          href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(schichtAdresse(e))}"
          >${ROUTE_IKONE}${esc(w('route'))}</a>` : ''}</dd>
      ${e.treffpunkt ? `<dt>${esc(w('treffpunkt'))}</dt><dd>${esc(e.treffpunkt)}</dd>` : ''}
      ${e.kontakt_vorname || e.kontakt_nachname || e.kontakt_telefon ? `<dt>${esc(w('kontaktVorOrt'))}</dt><dd>${
        esc([e.kontakt_vorname, e.kontakt_nachname].filter(Boolean).join(' '))
      }${e.kontakt_telefon ? `${e.kontakt_vorname || e.kontakt_nachname ? '<br>' : ''}<a href="tel:${
        esc(String(e.kontakt_telefon).replace(/[^+0-9]/g, ''))}">${esc(e.kontakt_telefon)}</a>` : ''}</dd>` : ''}
      ${e.taetigkeit ? `<dt>${esc(w('taetigkeit'))}</dt><dd>${esc(e.taetigkeit)}</dd>` : ''}
      ${e.qualifikation ? `<dt>${esc(w('qualifikation'))}</dt><dd>${esc(e.qualifikation)}</dd>` : ''}
      <dt>${esc(w('einsatzart'))}</dt><dd>${esc(e.einsatzart)}</dd>
      <dt>Status</dt><dd><span class="marke ${st[1]}">${esc(w(st[0]))}</span> <span class="marke ${zu[1]}">${esc(w(zu[0]))}</span></dd>
      ${Number(e.im_team) > 1 ? `<dt>${esc(w('schicht'))}</dt><dd>${Number(e.im_team)} ${esc(w('imTeam'))}</dd>` : ''}
      ${e.bemerkung ? `<dt>${esc(w('bemerkung'))}</dt><dd>${esc(e.bemerkung)}</dd>` : ''}
    </dl>
    <!-- Unterlagen des Planers (ENT-117). Der Platz steht schon, der Inhalt
         kommt nach: Die Liste ist eine eigene Abfrage und darf das Öffnen der
         Schicht nicht aufhalten. Ohne Unterlagen bleibt hier nichts stehen. -->
    <div id="blDok"></div>
    ${darfSchichtRapportieren(e) ? `<button class="btn btn-primary btn-wide" style="margin-top:4px" onclick="schichtRapportBlatt(${Number(e.id)})">${esc(w('schichtRapportieren'))}</button>` : ''}
    ${(() => { const r = rapportFuerSchicht(e.id); return r
      ? `<p style="font-size:12.5px;color:var(--ink-3);text-align:center;margin-top:8px">${esc(w('schonRapportiert'))} ${dmy(r.erfasst_am)}, ${String(r.erfasst_am).slice(11, 16)}</p>`
      : ''; })()}`;

  blattDokLaden(Number(e.id));

  // Eine bereits gegebene Antwort wird nicht noch einmal verlangt (ENT-120).
  antwortOffen = false;
  blattFussZeichnen(e);
  blattZeigen();
}

// ── Fussbereich der Schichtansicht (ENT-120)
//
// Wer zu- oder abgesagt hat, bekommt beim naechsten Oeffnen nicht wieder zwei
// gleich grosse Knoepfe vorgesetzt, die eine Entscheidung verlangen, die
// laengst gefallen ist. Stattdessen steht da, WAS beantwortet wurde.
//
// Die Knoepfe verschwinden aber nicht ersatzlos, sondern hinter „Antwort
// ändern": Auf einem Telefon liegen „Ablehnen" und „Zusagen" nebeneinander,
// und ein Fehlgriff ist schnell passiert. Waere die Antwort danach
// unwiderruflich, plante die Einsatzleitung mit einer Zusage, die niemand so
// gemeint hat -- und wer nach der Zusage krank wird, haette in der App
// ueberhaupt keinen Weg mehr. Eine Rueckmeldung, die sich nicht berichtigen
// laesst, ist schlechter als gar keine.
let antwortOffen = false;

function antwortAendern() {
  antwortOffen = true;
  const e = schichten.find(x => Number(x.id) === blattId);
  if (e) { blattFussZeichnen(e); }
}

function blattFussZeichnen(e) {
  const el = $('blFuss');
  if (!el) { return; }
  const schliessen = `<button class="btn btn-plain" onclick="blattZu()">${esc(w('schliessen'))}</button>`;
  if (e.status === 'abgesagt') { el.className = 'blatt-ft'; el.innerHTML = schliessen; return; }

  // Rückmeldung ist freiwillig -- die Einteilung bleibt so oder so bestehen.
  const beantwortet = e.zusage === 'zugesagt' || e.zusage === 'abgelehnt';
  if (!beantwortet || antwortOffen) {
    el.className = 'blatt-ft';
    el.innerHTML = `
      <button class="btn ${e.zusage === 'abgelehnt' ? 'btn-neg' : 'btn-plain'}" onclick="melden('abgelehnt')">${esc(w('ablehnen'))}</button>
      <button class="btn ${e.zusage === 'zugesagt' ? 'btn-pos' : 'btn-primary'}" onclick="melden('zugesagt')">${esc(w('zusagen'))}</button>`;
    return;
  }
  const ja = e.zusage === 'zugesagt';
  el.className = 'blatt-ft gestapelt';
  el.innerHTML = `
    <div class="ft-stand">
      <span class="marke ${ja ? 'm-p' : 'm-x'}">${esc(w(ja ? 'zugesagt' : 'abgelehnt'))}</span>
      <span class="ft-txt">${esc(w(ja ? 'hastZugesagt' : 'hastAbgelehnt'))} ${esc(w('planungSiehtEs'))}</span>
    </div>
    <div class="ft-reihe">
      <button class="btn btn-plain" onclick="antwortAendern()">${esc(w('antwortAendern'))}</button>
      ${schliessen}
    </div>`;
}

// ── Unterlagen zur Schicht (ENT-117) ────────────────────────────────────
// Was der Planer angehängt hat: Objektplan, Verkehrsanordnung,
// Sicherheitskonzept. Der Endpunkt gibt sie nur an Eingeteilte dieses
// Einsatzes heraus -- hier wird nichts zusätzlich geprüft, weil eine Prüfung
// in der Oberfläche keine ist.
// Adresse der Schicht als Zieladresse fuer die Navigation (ENT-119).
//
// ABGRENZUNG: Das hat NICHTS mit der Wegstrecke nach Art. 18 GAV zu tun
// (ENT-116). Dort geht es um die KUERZESTE Strecke ab Hauptanstellungsort als
// Grundlage fuer den Auslagenersatz, sie wird von einem Menschen abgelesen und
// gespeichert, und die Zoneneinteilung ist als GAV-AUS-011 offen. Hier geht es
// nur darum, dass die eingeteilte Person den Ort findet -- eine Navigation vom
// jeweiligen Standort aus, ohne origin, ohne gespeicherte Zahl, ohne jede
// Wirkung auf Lohn oder Rechnung. Diese beiden Wege duerfen nie zusammenlaufen.
//
// Kein origin: Der Startpunkt ist der Standort der Person, den kennt ihr Geraet
// -- und wir wollen ihn nicht wissen.
function schichtAdresse(e) {
  if (!e) { return ''; }
  return [e.strasse, e.ort, e.kanton].map(t => String(t || '').trim()).filter(Boolean).join(', ');
}

const ROUTE_IKONE = '<svg viewBox="0 0 24 24" aria-hidden="true" class="route-i">'
  + '<path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/>'
  + '<circle cx="12" cy="10" r="3"/></svg>';

function blattDokLaden(einsatzId) {
  const el = $('blDok'); if (!el) return;
  el.innerHTML = '';
  api('einsatz_dokument.php?einsatz_id=' + einsatzId).then(({ ok, data }) => {
    // Blatt inzwischen gewechselt? Dann gehört diese Antwort nicht mehr hierher.
    if (blattId !== einsatzId) return;
    const dok = (ok && data.status === 'ok') ? (data.dokumente || []) : [];
    if (!dok.length) return;
    el.innerHTML = `<div class="dok-kopf">${esc(w('dokumente'))}</div>
      <div class="dok-liste">${dok.map(d => `
        <button type="button" class="dok-zeile" onclick="dokOeffnen(${Number(d.id)})">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
               stroke-width="1.7" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          <span class="nm">${esc(d.dateiname)}</span>
          <span class="gr">${dokGr(Number(d.groesse) || 0)}</span>
        </button>`).join('')}</div>`;
  }).catch(() => {});
}

const dokGr = b => b >= 1048576 ? nf(b / 1048576, 1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';

// Der Endpunkt verlangt den Anmelde-Kopf, ein <a href> trägt ihn nicht mit.
// Das Fenster wird VOR dem Holen geöffnet: nach einem await gilt der Tipp
// nicht mehr als Nutzeraktion und der Browser blockiert es.
function dokOeffnen(id) {
  const f = window.open('', '_blank');
  fetch(API + 'einsatz_dokument.php?id=' + encodeURIComponent(id),
        { headers: token ? { 'X-Auth-Token': token } : {} })
    .then(r => { if (!r.ok) throw new Error('http'); return r.blob(); })
    .then(b => {
      const url = URL.createObjectURL(b);
      // Hier ist das Umleiten der richtige Rückfall, anders als im Dashboard:
      // In der installierten App gibt es oft gar kein zweites Fenster, und es
      // steht kein Formular offen, das dabei verloren ginge -- die Schicht ist
      // nach dem Zurückgehen einen Fingertipp entfernt.
      if (f) { f.location = url; } else { location.href = url; }
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    })
    .catch(() => { if (f) f.close(); toast(w('dokumentFehler')); });
}

// Nur bei zugesagtem Verkehrsdienst, und erst sobald die Schicht begonnen hat
// -- rapportiert wird, was geschah, nicht, was noch bevorsteht (ENT-082).
function darfSchichtRapportieren(e) {
  if (e.status === 'abgesagt' || e.zusage !== 'zugesagt' || e.einsatzart !== 'Verkehrsdienst') return false;
  const sp = spanne(e.datum, e.von, e.bis);
  return !!sp && sp[0] <= Date.now();
}

// "Korrektur, neueste zaehlt": mehrere Schicht-Rapporte zur selben Zuteilung
// sind moeglich, hier zaehlt nur der zuletzt erfasste.
//
// Die Person muss mitgeprueft werden, nicht nur die Schicht: Wer das Recht
// "abgleich" hat, bekommt von rapport_list.php ALLE Rapporte. Auf einer
// Schicht zu zweit waere sonst der Rapport der Kollegin als der eigene
// erschienen -- und die Korrektur haette ihn mit fremden Angaben vorbefuellt.
function rapportFuerSchicht(einsatzId) {
  const treffer = rapporte.filter(r =>
    Number(r.einsatz_id) === Number(einsatzId) && r.mitarbeiter === (ich && ich.name));
  if (!treffer.length) return null;
  return treffer.slice().sort((a, b) => String(b.erfasst_am).localeCompare(String(a.erfasst_am)))[0];
}

function melden(zusage) {
  if (!blattId) return;
  api('meine_zusage.php', { method: 'POST', body: { einsatz_id: blattId, zusage } }).then(({ ok, data }) => {
    if (!ok || data.status !== 'ok') { toast(data.message || w('netzfehler')); return; }
    const e = schichten.find(x => Number(x.id) === blattId);
    if (e) e.zusage = zusage;
    blattZu();
    zeichne();
    toast(w('gemeldet'));
  });
}

function schichtRapportSenden(einsatzId) {
  const e = schichten.find(x => Number(x.id) === Number(einsatzId));
  if (!e) return;
  const err = $('srErr'); err.style.display = 'none';
  const von = $('srVon').value, bis = $('srBis').value;
  if (!von || !bis) { err.textContent = w('beideZeitenNoetig'); err.style.display = ''; return; }
  const b = $('srBtn'); b.disabled = true;
  api('rapport_create.php', { method: 'POST', body: {
    einsatz_id: einsatzId,
    datum: String(e.datum).slice(0, 10),
    kunde: $('srKunde').value.trim(), strasse: $('srStrasse').value.trim(), ort: $('srOrt').value.trim(),
    einsatzart: $('srEinsatzart').value.trim(),
    von, bis, pause: $('srPause').value,
    bemerkung: $('srBemerkung').value.trim(),
    sigName: $('srSigName').value.trim(),
    sig: getSigData(),
  } }).then(({ ok, data }) => {
    b.disabled = false;
    if (!ok || data.status !== 'ok') { err.textContent = data.message || w('netzfehler'); err.style.display = ''; return; }
    blattZu();
    ladeRapporte().then(zeichne);
    toast(w('rapportGesendet'));
  });
}

// Unterschrift-Canvas, gleiches Muster wie im bestehenden Rapport Tool
// (index.html) -- dieselbe Aufzeichnung, hier nur fuer die Vorbefuellung
// aus der Schicht statt aus einem leeren Formular.
function initSig() {
  const canvas = $('sigCanvas');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.parentElement.clientWidth * dpr;
  canvas.height = 160 * dpr;
  canvas.style.height = '160px';
  sigCtx = canvas.getContext('2d');
  sigCtx.scale(dpr, dpr);
  sigCtx.strokeStyle = '#1A1D23'; sigCtx.lineWidth = 2.2; sigCtx.lineCap = 'round'; sigCtx.lineJoin = 'round';
  sigDirty = false;
  const pos = e => { const r = canvas.getBoundingClientRect(), s = e.touches ? e.touches[0] : e; return [s.clientX - r.left, s.clientY - r.top]; };
  const start = e => { e.preventDefault(); isDrawing = true; [lastX, lastY] = pos(e); $('sigPlaceholder').style.display = 'none'; };
  const draw = e => { e.preventDefault(); if (!isDrawing) return; const [x, y] = pos(e); sigCtx.beginPath(); sigCtx.moveTo(lastX, lastY); sigCtx.lineTo(x, y); sigCtx.stroke(); [lastX, lastY] = [x, y]; sigDirty = true; };
  const stop = e => { e.preventDefault(); isDrawing = false; };
  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stop);    canvas.addEventListener('mouseleave', stop);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', draw, { passive: false });
  canvas.addEventListener('touchend', stop, { passive: false });
}
function clearSig() {
  const c = $('sigCanvas');
  sigCtx.clearRect(0, 0, c.width, c.height); sigDirty = false;
  $('sigPlaceholder').style.display = '';
}
const getSigData = () => sigDirty ? $('sigCanvas').toDataURL('image/png') : null;

// ══════════════════════════════════════════ ZEITBONUS ERKLAERT (ENT-052)
// Der Zeitbonus steht als Zahl auf der Kachel, aber die wenigsten kennen den
// GAV. Eine Zahl, die niemand einordnen kann, erzeugt Rueckfragen oder --
// schlimmer -- stilles Misstrauen.
//
// Der Text sagt AUSSCHLIESSLICH, was im Wortlaut von Art. 12 Ziff. 2 steht,
// geprueft gegen gav-2026.pdf, plus die vom PAKO-Kommentar bestaetigte Regel
// "nur einmal, nicht doppelt" (GAV-AUS-001). Keine eigene Auslegung -- das
// verbietet CLAUDE.md ausdruecklich, und hier liest es die betroffene Person.
//
// Was NICHT drinsteht und bewusst nicht: die anteilige Berechnung bei
// angebrochenen Stunden. Die ist bis heute eine vorlaeufige Annahme
// (GAV-AUS-008, Status offen) und darf niemandem als Regel verkauft werden.
function bonusInfoBlatt() {
  blattId = null;
  $('blTitel').textContent = w('bonusInfoTitel');
  const punkt = (k, t) => `<div style="margin-bottom:14px">
      <div style="font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px">${esc(k)}</div>
      <div style="font-size:15px;line-height:1.45">${esc(t)}</div>
    </div>`;
  $('blBody').innerHTML =
    punkt(w('bonusInfoWofuer'), w('bonusInfoWofuerT')) +
    punkt(w('bonusInfoWieviel'), w('bonusInfoWievielT')) +
    punkt(w('bonusInfoWas'), w('bonusInfoWasT')) +
    punkt(w('bonusInfoEinmal'), w('bonusInfoEinmalT')) +
    `<div style="font-size:13.5px;color:var(--warn);font-weight:600;margin-bottom:12px">${esc(w('bonusInfoLuecke'))}</div>
     <div style="font-size:12.5px;color:var(--ink-3)">${esc(w('bonusInfoQuelle'))}</div>`;
  $('blFuss').innerHTML =
    `<button class="btn btn-primary" onclick="blattZu()">${esc(w('schliessen'))}</button>`;
  blattZeigen();
}

function passwortBlatt() {
  blattId = null;
  $('blTitel').textContent = w('passwortAendern');
  $('blBody').innerHTML = `
    <div class="msg-err" id="pwErr" style="display:none"></div>
    <div class="f"><label for="pwAlt">${esc(w('altesPasswort'))}</label><input class="inp" id="pwAlt" type="password" autocomplete="current-password"></div>
    <div class="f"><label for="pwNeu">${esc(w('neuesPasswort'))}</label><input class="inp" id="pwNeu" type="password" placeholder="${esc(w('mind6'))}" autocomplete="new-password"></div>`;
  $('blFuss').innerHTML = `
    <button class="btn btn-plain" onclick="blattZu()">${esc(w('abbrechen'))}</button>
    <button class="btn btn-primary" id="pwBtn" onclick="passwortSpeichern()">${esc(w('speichern'))}</button>`;
  blattZeigen();
}
function passwortSpeichern() {
  const err = $('pwErr'); err.style.display = 'none';
  const alt = $('pwAlt').value, neu = $('pwNeu').value;
  if (neu.length < 6) { err.textContent = w('mind6'); err.style.display = ''; return; }
  const b = $('pwBtn'); b.disabled = true;
  api('mein_passwort.php', { method: 'POST', body: { alt, neu } }).then(({ ok, data }) => {
    b.disabled = false;
    if (!ok || data.status !== 'ok') { err.textContent = data.message || w('netzfehler'); err.style.display = ''; return; }
    blattZu();
    toast(w('passwortOk'));
  });
}

function blattZeigen() {
  $('abdunkeln').classList.add('on');
  $('blatt').classList.add('on');
  $('blatt').setAttribute('aria-hidden', 'false');
}
function blattZu() {
  $('abdunkeln').classList.remove('on');
  $('blatt').classList.remove('on');
  $('blatt').setAttribute('aria-hidden', 'true');
  blattId = null;
}

// ══════════════════════════════════════════ START
document.addEventListener('keydown', e => { if (e.key === 'Escape') blattZu(); });
$('gPass').addEventListener('keydown', e => { if (e.key === 'Enter') anmelden(); });
$('gName').addEventListener('keydown', e => { if (e.key === 'Enter') $('gPass').focus(); });

beschriften();
if (token && ich) starten();
</script>
</body>
</html>
