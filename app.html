    rgsKarte.fitBounds(grenzen, 48);
  }
  if (!navigator.geolocation) { return; }
  navigator.geolocation.getCurrentPosition(pos => {
    if (!rgsKarte || !window.google) { return; }
    // Dieselbe Marke wie bei der laufenden Ortung (ENT-331) -- nicht eine
    // zweite, eigene. Der eigene Standort sieht auf beiden Wegen gleich aus.
    rgStandortMarkeSetzen({ lat: pos.coords.latitude, lng: pos.coords.longitude });
    // Der Pfeil kommt aus der laufenden Ortung, nicht aus diesem einen
    // Abruf: Eine einzelne Messung hat keine Vorgaengerin und damit keine
    // Richtung. Ist gerade eine bekannt, wird sie mitgezeichnet.
    rgRichtungMarkeSetzen({ lat: pos.coords.latitude, lng: pos.coords.longitude }, rgRichtungJetzt());
  }, () => {}, { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 });
}

// Pausieren aus dem Funktionen-Reiter: dieselbe Rueckfrage wie im
// Einsatzmodus (ENT-298), damit es nicht zwei verschiedene Pausen gibt.
function rgLaufPause(einsatzId) {
  if (rundgangAktiv.status === 'pausiert') { rundgangWiederAufnehmen(einsatzId); return; }
  rgsFrage(w('rgsPausierenFrage'), w('rgsPausierenTxt'), w('rgsJa'), () => {
    rgsFrageZu();
    rundgangPausieren(einsatzId);
  });
}

/* Ansprechpartner, Zentrale und Notruf waehrend der Runde (ENT-308).
   Bis hierher standen sie nur in der Vorschau -- also ausgerechnet vor dem
   Losgehen, nicht in dem Moment, in dem jemand etwas vorfindet. Dieselbe
   Darstellung wie dort (ENT-299/ENT-300), aus den Daten, die
   mein_rundgang_offen.php jetzt mitliefert. */
function rgLaufKontakte() {
  if (!rundgangAktiv) return;
  rgsAnsicht = 'kontakte';
  rgUnterseiteAn();
  $('rgsTitel').textContent = w('rgsHilfe');
  $('rgsFuss').innerHTML =
    `<button class="btn btn-plain btn-wide" onclick="rgSeiteZurueckZurUebersicht()">${esc(w('zurueck'))}</button>`;
  // Die Vorschau-Zeichnung erwartet ihre Daten in rgsDaten -- hier aus dem
  // laufenden Rundgang zusammengesetzt, damit es nur EINE Darstellung gibt.
  const daten = {
    objekt: rundgangAktiv.objekt || {},
    kunde_name: rundgangAktiv.kunde_name || '',
    ansprechpartner: rundgangAktiv.ansprechpartner || [],
    zentrale: rundgangAktiv.zentrale || null,
  };
  $('rgsBody').innerHTML = rgsKontakteHtml(daten);
}

// Aufgabenliste der laufenden Runde -- dieselbe Darstellung wie in der
// Vorschau (ENT-304), nur aus rundgangAktiv statt aus rgsDaten gespeist.
function rgLaufAufgabenListe() {
  rgsDaten = { kontrollpunkte: rundgangAktiv.kontrollpunkte || [] };
  afOeffnen();
}

// Eigene Funktion statt Teil von rundgangAnzeigen(): der Fuss muss sich auch
// OHNE Neuaufbau des ganzen Bildschirms aktualisieren, sobald sich der Status
// aendert -- z.B. wenn der letzte Kontrollpunkt bestaetigt wird und der
// Rundgang dadurch automatisch abschliesst (kein "Beenden" mehr auf einem
// bereits fertigen Rundgang).
function rundgangFussZeichnen() {
  if (!rundgangAktiv) return;
  // Laeuft die Runde als Vollseite (ENT-306), gibt es keinen Schubladenfuss
  // mehr: "Abbrechen" steht als Funktion, "Zurueck" ist der Pfeil im Kopf.
  if (rgsModus === 'lauf') { rgLaufKopfZeichnen(); rgLaufReiterZeichnen(); return; }
  // Steht die Aufgaben-Rueckfrage offen (ENT-305), gehoert der Fuss ihr. Ohne
  // diese Weiche loeschte das Neuzeichnen nach dem Senden der Warteschlange
  // den "Bestaetigen"-Knopf -- die Schublade bliebe offen und unbedienbar.
  // Gefunden, weil die Pruefung auf den Knopf wartete; im Betrieb waere es
  // erst jemandem nachts vor einer toten Schublade aufgefallen.
  if (abPunktId !== null) return;
  const einsatzId = rundgangAktiv.einsatz_id;
  const fertig = rundgangAktiv.kontrollpunkte.length > 0 && rundgangAktiv.kontrollpunkte.every(k => k.erledigt);
  const zurueck = `<button class="btn btn-plain" onclick="blattAuf(${Number(einsatzId)})">${esc(w('zurueck'))}</button>`;
  let aktion = '';
  let gestapelt = false;
  if (rundgangAktiv.status === 'pausiert') {
    // "Abbrechen" fehlte hier bisher komplett (ENT-290, gemeldeter Fehler)
    // -- ein pausierter Rundgang liess sich nur fortsetzen, nie beenden.
    // Fuehrt ueber denselben Pflichtgrund-Dialog wie aus dem aktiven Zustand
    // (rundgangAbbrechenAnzeigen, ENT-146) -- keine zweite, schwaechere
    // Abbruch-Variante nur fuer diesen Fall.
    aktion = `<button class="btn btn-neg" onclick="rundgangAbbrechenAnzeigen(${Number(einsatzId)})">${esc(w('rundgangAbbrechenKnopf'))}</button>`
      + `<button class="btn btn-primary" onclick="rundgangWiederAufnehmen(${Number(einsatzId)})">${esc(w('rundgangPauseWiederaufnehmen'))}</button>`;
    gestapelt = true;
  } else if (rundgangAktiv.status !== 'abgebrochen' && rundgangAktiv.status !== 'abgeschlossen' && !fertig) {
    aktion = `<button class="btn btn-neg" onclick="rundgangBeendenAnzeigen(${Number(einsatzId)})">${esc(w('rundgangBeenden'))}</button>`;
  }
  const fussEl = $('blFuss');
  // Drei Knoepfe nebeneinander (Zurueck/Abbrechen/Fortsetzen) waeren auf einem
  // Telefon zu schmal -- gestapelt statt nebeneinander, nur fuer diesen Fall
  // (bestehendes Muster .gestapelt).
  if (fussEl) { fussEl.classList.toggle('gestapelt', gestapelt); }
  $('blFuss').innerHTML = zurueck + aktion;
}

function rundgangListeZeichnen() {
  if (!rundgangAktiv) return;
  rundgangFussZeichnen();
  const kps = rundgangAktiv.kontrollpunkte;
  // #rdFortschritt ist mit ENT-541 entfallen: Den Zustand der Runde nennt
  // jetzt die Zustandszeile des Kopfblocks (#rgpLage), und zwar nur dort.
  // Zwei Traeger fuer dieselbe Aussage laufen auseinander.
  const bEl = $('rdBanner');
  if (bEl) {
    bEl.innerHTML = rundgangAktiv.status === 'pausiert'
      ? `<div class="msg-err" style="color:var(--ink-2);background:var(--line-soft)">${esc(w('rundgangPausiertHinweis'))}${rundgangAktiv.pausiert_seit ? ' (' + esc(w('rundgangPausiertSeit')) + ' ' + esc(String(rundgangAktiv.pausiert_seit).slice(11, 16)) + ')' : ''}</div>`
      : rundgangAktiv.status === 'abgebrochen'
      ? `<div class="msg-err">${esc(RUNDGANG_ABBRUCH_GRUENDE[rundgangAktiv.abbruch_grund] || w('rundgangAbgebrochen'))}${rundgangAktiv.abbruch_freitext ? ' — ' + esc(rundgangAktiv.abbruch_freitext) : ''}</div>`
      : '';
    // Ein leerer Banner ist kein Banner -- sonst bliebe im Rumpf (Raster mit
    // festem Abstand) eine Luecke stehen, fuer die nichts da ist.
    bEl.style.display = bEl.innerHTML ? '' : 'none';
  }
  const gesperrt = rundgangAktiv.status === 'pausiert' || rundgangAktiv.status === 'abgebrochen';
  const lEl = $('rdListe');
  // Eingetipptes zuerst ins Datenmodell zuruecklesen: Die Liste wird bei
  // jeder neuen Position neu gezeichnet (ENT-317), und was nur im Feld
  // stand, waere sonst nach Sekundenbruchteilen weg (ENT-324).
  kps.forEach(k => { if (k.offen) { rdFormularStandSichern(k); } });
  /* Der "naechste" Punkt ist der erste noch offene in der Reihenfolge der
     Runde (ENT-541). Er ist eine reine ANZEIGE, keine Sperre: Wer vor einem
     spaeteren Punkt steht, tippt dessen Zeile an und bekommt dieselben
     Knoepfe. Eine erzwungene Reihenfolge waere eine fachliche Aenderung und
     gehoerte ausserdem in den Server, nicht in die Oberflaeche.

     Eine ABGEBROCHENE Runde hat keinen naechsten Punkt mehr. Der Pfeil
     bliebe sonst auf einer Zeile stehen, zu der niemand mehr hingeht -- das
     sieht aus wie "hier weiter" und ist das Gegenteil. Pausiert behaelt ihn:
     Dort geht es weiter, nur spaeter. */
  const naechster = rundgangAktiv.status === 'abgebrochen' ? null : kps.find(k => !k.erledigt);
  const naechsterId = naechster ? Number(naechster.id) : null;
  // Ohne laufende Nummer: Die Reihenfolge steht in der Liste selbst, und die
  // Zeitspalte links traegt jetzt die Uhrzeit (ENT-541).
  if (lEl) { lEl.innerHTML = kps.map(k => rdZeile(k, gesperrt, naechsterId)).join(''); }
}

/* Welche Zeilen ihre Knoepfe ausgeklappt zeigen, ausser der naechsten
   (ENT-541). Bewusst NICHT im localStorage: Das gilt fuer diesen Blick auf
   diese Liste, nicht fuer morgen. */
const rdAufgeklappt = new Set();

function rdUmklappen(kontrollpunktId) {
  const id = Number(kontrollpunktId);
  if (rdAufgeklappt.has(id)) { rdAufgeklappt.delete(id); } else { rdAufgeklappt.add(id); }
  rundgangListeZeichnen();
}

/* Eine Zeile der Kontrollpunkt-Liste, als Zeitleiste (ENT-541).

   Aufbau, links nach rechts, fuer JEDE Zeile gleich (CLAUDE.md: gleiches
   Muster auf beiden Seiten):

     Zeitspalte | Zeichen | Bezeichnung + Unterzeile | Kennzeichen rechts

   Die Zeitspalte traegt bei erledigten Punkten die Uhrzeit der Erfassung
   -- bis hierher stand sie klein in der Meta-Zeile, obwohl sie der
   eigentliche Nachweis ist. Bei offenen Punkten steht dort ein Pfeil (der
   naechste) oder ein Strich (spaeter).

   Das Kennzeichen rechts nennt bei erledigten Punkten, WIE der Nachweis
   zustande kam (NFC / Geofence / Ersatzscan / nicht verfuegbar), bei
   offenen, wie er zustande kommen soll. Bei einem Ersatzscan verschwindet
   damit der geplante Typ aus der Zeile -- richtig so: Was zaehlt, ist der
   erbrachte Nachweis, und der war eben KEIN NFC-Lesen.

   Der gruene Haken allein sagt einem Screenreader nichts. Das Statuswort
   steht darum unsichtbar (.vh) daneben, statt sichtbar in jeder Zeile Platz
   zu kosten.

   Knoepfe zeigt nur, wer sie gerade braucht (Entscheid des Projektinhabers,
   2026-09-11): der naechste Punkt, jeder Punkt, in dessen Geofence man
   GERADE steht, jeder mit offenem Formular und jeder, den man selbst
   aufgeklappt hat. Die uebrigen bleiben eine ruhige Zeile und klappen beim
   Antippen auf. Weggeblendet werden nur die Knoepfe -- Entfernung, NFC-
   Hinweis und Fehlermeldung bleiben in JEDER offenen Zeile stehen: Sie
   beantworten "wohin als naechstes" und "warum ging das nicht", und dafuer
   darf man nicht erst tippen muessen. */
function rdZeile(k, gesperrt, naechsterId) {
  const typLabel = k.typ === 'nfc' ? w('kpTypNfc') : w('kpTypGeofence');
  if (k.erledigt) {
    const istNv = k.erledigt.status === 'nicht_verfuegbar';
    const istEs = k.erledigt.status === 'ersatzscan';
    const zeit = String(k.erledigt.erfasst_am || '').slice(11, 16);
    const hakenKlasse = istNv ? 'rd-haken-nv' : istEs ? 'rd-haken-es' : '';
    const hakenZeichen = istNv ? '!' : istEs ? '📷' : '✓';
    const marke = istNv ? w('kpNichtVerfuegbar') : istEs ? w('kpErsatzscan') : typLabel;
    // Offene Aufgaben an einem bereits erfassten Punkt (ENT-305): Wer die
    // Schublade wegschiebt, muss hier sehen, dass noch etwas aussteht -- und
    // sie erneut oeffnen koennen. Ein still verschwundener Auftrag waere
    // schlimmer als die Frage selbst.
    const offen = rdAufgabenOffen(k);
    const hatAufgaben = (k.aufgaben || []).length;
    return `<div class="rd-zeile rd-fertig${istNv ? ' rd-war-nv' : istEs ? ' rd-war-es' : ''}">
      <span class="rd-zeit">${esc(zeit || '–')}</span>
      <span class="rd-haken ${hakenKlasse}" aria-hidden="true">${hakenZeichen}</span>
      <div class="rd-txt">
        <div class="rd-bez">${esc(k.bezeichnung)}</div>
        ${(istNv || istEs) ? '' : `<span class="vh">${esc(w('kpBestaetigt'))}</span>`}
        ${k.wartend ? `<div class="rd-meta">${esc(w('kpWirdGesendet'))}</div>` : ''}
        ${offen.length ? `<button type="button" class="ab-offen" id="abOffen${Number(k.id)}"
            onclick="rdAufgabenOeffnen(${Number(k.id)})">
          <svg class="i i-sm" viewBox="0 0 24 24"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
          <span>${offen.length} ${esc(offen.length === 1 ? w('abOffen') : w('abOffenMehr'))}</span>
        </button>` : (hatAufgaben ? `<div class="ab-fertig" id="abFertig${Number(k.id)}">${esc(w('abFertig'))}</div>` : '')}
      </div>
      <span class="rd-marke">${esc(marke)}</span>
    </div>`;
  }
  // NFC ist auf diesem Geraet ehrlich als nicht verfuegbar ausgewiesen, statt
  // eine Scan-Funktion vorzutaeuschen, die auf dem Wachpersonal-Handy (fast
  // ausschliesslich iPhone) technisch gar nicht laufen kann -- Web-NFC gibt es
  // auf iOS/Safari plattformbedingt nicht, unabhaengig von der Browserwahl.
  const kannScannen = k.typ === 'geofence';
  // Entfernung zum Punkt (ENT-317). Drei Zustaende, nicht zwei:
  //   Zahl  -- Position bekannt
  //   null  -- Position noch UNBEKANNT
  // "Unbekannt" darf nie wie "zu weit" aussehen (CLAUDE.md) und sperrt
  // darum auch nichts: Wer nicht weiss, wo er ist, wird nicht gehindert --
  // der Server entscheidet ohnehin noch einmal.
  const dist = kannScannen ? rdEntfernungZu(k) : null;
  const drin = dist === null ? null : dist <= rdRadiusVon(k);
  // "Standort noch unbekannt" ist zu harmlos, wenn er GESPERRT ist -- das
  // eine geht vorbei, das andere nie (ENT-320).
  const ortTxt = !kannScannen ? ''
    : rgsOrtFehler === 'verweigert' ? `<div class="rd-ort weit">${esc(w('rgOrtAusTitel'))}</div>`
    : dist === null ? `<div class="rd-ort mut">${esc(w('rdOrtUnbekannt'))}</div>`
    : drin ? `<div class="rd-ort drin">${esc(w('rdImBereich'))}</div>`
    : `<div class="rd-ort weit">${esc(w('rdEntfernung').replace('{m}', String(Math.round(dist))))}</div>`;
  const jetzt = naechsterId !== null && Number(k.id) === Number(naechsterId);
  // Wer im Bereich steht, kann diesen Punkt JETZT bestaetigen -- dann gehoert
  // ihm der Knopf, auch wenn er nicht an der Reihe ist. Ohne diese Zeile
  // muesste der Waechter am Ziel erst aufklappen, was er gerade erreicht hat.
  const auf = !gesperrt && (jetzt || drin === true || !!k.offen || rdAufgeklappt.has(Number(k.id)));
  const aufgabenN = (k.aufgaben || []).length;
  const aufgabenTxt = aufgabenN === 1
    ? w('rgpAufgabe').replace('{was}', String((k.aufgaben[0] || {}).bezeichnung || ''))
    : aufgabenN > 1 ? w('rgpAufgabenN').replace('{n}', String(aufgabenN)) : '';
  const kopfInhalt = `
      <span class="rd-zeit" aria-hidden="true">${jetzt ? '→' : '–'}</span>
      <span class="rd-haken" aria-hidden="true"></span>
      <span class="rd-txt">
        <span class="rd-bez">${esc(k.bezeichnung)}</span>
        ${jetzt ? `<span class="vh">${esc(w('rgpNaechster'))}</span>` : ''}
        ${aufgabenTxt ? `<span class="rd-meta">${esc(aufgabenTxt)}</span>` : ''}
      </span>
      <span class="rd-marke">${esc(typLabel)}</span>`;
  return `<div class="rd-zeile rd-offen${jetzt ? ' rd-jetzt' : ''}${auf ? ' rd-auf' : ''}">
    ${gesperrt
      // Pausiert oder abgebrochen gibt es nichts umzuklappen -- dann ist der
      // Kopf kein Knopf. Ein Knopf, der nichts tut, ist schlimmer als keiner.
      ? `<div class="rd-kopf">${kopfInhalt}</div>`
      : `<button type="button" class="rd-kopf" id="rdKopf${Number(k.id)}"
           aria-expanded="${auf ? 'true' : 'false'}"
           aria-label="${esc((auf ? w('rgpSchliessen') : w('rgpOeffnen')) + ' — ' + k.bezeichnung)}"
           onclick="rdUmklappen(${Number(k.id)})">${kopfInhalt}</button>`}
    ${gesperrt ? '' : ortTxt}
    ${!kannScannen && !gesperrt ? `<div class="rd-hinweis">${esc(w('kpNfcNichtVerfuegbarGeraet'))}</div>` : ''}
    ${k.fehler ? `<div class="msg-err rd-einzug">${esc(k.fehler)}</div>` : ''}
    ${!auf ? '' : `
    <div class="rd-akt">
      ${kannScannen ? `<button class="btn btn-primary" id="rdBtn${k.id}"${drin === false ? ' disabled' : ''} onclick="rdBestaetigen(${k.id})">${esc(w('kpBestaetigen'))}</button>` : ''}
      <button class="btn btn-plain" onclick="rdEsUm(${k.id})">${esc(w('kpErsatzscan'))}</button>
      <button class="btn btn-plain" onclick="rdNvUm(${k.id})">${esc(w('kpNichtVerfuegbar'))}</button>
    </div>
    <div class="rd-nv" id="rdEs${k.id}"${k.offen === 'es' ? '' : ' style="display:none"'}>
      <input type="file" accept="image/*" capture="environment" id="rdEsInput${k.id}" onchange="rdEsFotoGewaehlt(${k.id})" style="display:none">
      <button class="btn btn-plain" onclick="document.getElementById('rdEsInput${k.id}').click()">${esc(w('kpEsFotoAufnehmen'))}</button>
      <img class="rd-es-vorschau" id="rdEsVorschau${k.id}"${rdEsFotos[k.id] ? ` src="${rdEsFotos[k.id]}"` : ' style="display:none"'} alt="">
      <textarea class="inp" id="rdEsText${k.id}" rows="2" placeholder="${esc(w('kpBeschreibungPflicht'))}">${esc(k.esText || '')}</textarea>
      <button class="btn btn-neg" onclick="rdEsSenden(${k.id})">${esc(w('kpEsMelden'))}</button>
    </div>
    <div class="rd-nv" id="rdNv${k.id}"${k.offen === 'nv' ? '' : ' style="display:none"'}>
      <textarea class="inp" id="rdNvText${k.id}" rows="2" placeholder="${esc(w('kpBeschreibungPflicht'))}">${esc(k.nvText || '')}</textarea>
      <button class="btn btn-neg" onclick="rdNvSenden(${k.id})">${esc(w('kpNichtVerfuegbarMelden'))}</button>
    </div>
    <div class="msg-err rd-einzug" id="rdFehler${k.id}" style="display:none"></div>`}
  </div>`;
}

function rdZeigeFehler(kontrollpunktId, message) {
  // Auch am Kontrollpunkt vermerken, nicht nur ins DOM schreiben (ENT-317).
  // Seit die Ortung laeuft, zeichnet jede neue Position die Liste neu -- eine
  // Meldung, die nur im DOM stand, war nach Sekundenbruchteilen weg. Der
  // Waechter haette gesehen, dass der Knopf nicht reagiert, aber nicht warum.
  const k = rundgangAktiv && rundgangAktiv.kontrollpunkte
    ? rundgangAktiv.kontrollpunkte.find(x => Number(x.id) === Number(kontrollpunktId)) : null;
  if (k) { k.fehler = message; }
  const el = $('rdFehler' + kontrollpunktId);
  if (el) { el.textContent = message; el.style.display = ''; }
}

// Geofence-Bestaetigung: ein einzelner Standortabruf im Moment des Antippens,
// kein watchPosition() -- die Live-Sicht bildet ausdruecklich nur diskrete
// Kontrollpunkt-Ereignisse ab, keine kontinuierliche Positionsverfolgung
// (ENT-131).
function rdBestaetigen(kontrollpunktId) {
  const k = rundgangAktiv.kontrollpunkte.find(x => Number(x.id) === kontrollpunktId);
  if (!k) return;
  if (!navigator.geolocation) { rdZeigeFehler(kontrollpunktId, w('kpStandortFehler')); return; }
  const btn = $('rdBtn' + kontrollpunktId);
  if (btn) btn.disabled = true;

  // Die laufende Ortung hat bereits eine frische Position -- die wird
  // genommen, statt eine zweite Messung anzustossen (ENT-317). Das ist
  // nicht nur schneller und sparsamer: Zwei gleichzeitige Abfragen an
  // denselben Sensor koennen einander blockieren, und genau das ist beim
  // Bauen passiert -- getCurrentPosition antwortete gar nicht mehr, solange
  // watchPosition lief. Nur wenn keine frische Position vorliegt, wird
  // einmalig gemessen (etwa direkt nach dem Oeffnen).
  const frisch = rgsMeinOrt && (Date.now() - rgsMeinOrt.zeit) < 20000
    ? { lat: rgsMeinOrt.lat, lng: rgsMeinOrt.lng } : null;
  if (frisch) { rdMitOrt(k, kontrollpunktId, frisch, btn); return; }

  navigator.geolocation.getCurrentPosition(
    pos => rdMitOrt(k, kontrollpunktId,
      { lat: pos.coords.latitude, lng: pos.coords.longitude }, btn),
    () => { if (btn) btn.disabled = false; rdZeigeFehler(kontrollpunktId, w('kpStandortFehler')); },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

/* Der eigentliche Riegel (ENT-317) -- eine Stelle, gleich ob die Position
   aus der laufenden Ortung stammt oder aus einer Einzelmessung. */
function rdMitOrt(k, kontrollpunktId, ort, btn) {
  // Vorab im GERAET pruefen, nicht erst am Server (ENT-317).
  //
  // Bis hierher wurde der Punkt sofort als erledigt angezeigt und in die
  // Warteschlange gelegt; erst der Server wies ihn ab, und die App nahm die
  // Bestaetigung wieder zurueck. Mit Netz dauert das Sekunden -- OHNE Netz
  // passiert es gar nicht. Der Waechter konnte im Auto sitzend jeden Punkt
  // "bestaetigen", alles sah gruen aus, und die Ruecknahme kam Stunden
  // spaeter. Fuer ein Werkzeug, dessen Zweck der Nachweis ist, war das die
  // gefaehrlichste Stelle im ganzen Ablauf.
  //
  // Die Koordinaten und der Radius liegen seit ENT-308 ohnehin im Geraet --
  // die App kann also dieselbe Rechnung anstellen wie der Server, auch
  // offline. Der Server prueft UNVERAENDERT weiter: Ein Geraet darf nie die
  // letzte Instanz sein, sonst genuegte ein veraenderter Browser.
  if (k.typ === 'geofence' && k.lat !== null && k.lat !== undefined) {
    const dist = rgDistanzMeter(ort.lat, ort.lng, Number(k.lat), Number(k.lng));
    if (dist > rdRadiusVon(k)) {
      if (btn) { btn.disabled = false; }
      rdZeigeFehler(kontrollpunktId, w('rdZuWeit').replace('{m}', String(Math.round(dist))));
      return;
    }
  }
  rdScanEintragen(k, 'bestaetigt', ort);
}

function rdNvUm(kontrollpunktId) { rdFormularUm(kontrollpunktId, 'nv'); }
function rdNvSenden(kontrollpunktId) {
  const k = rundgangAktiv.kontrollpunkte.find(x => Number(x.id) === kontrollpunktId);
  if (!k) return;
  const feld = $('rdNvText' + kontrollpunktId);
  const text = feld ? feld.value.trim() : '';
  if (!text) { rdZeigeFehler(kontrollpunktId, w('kpBeschreibungPflicht')); return; }
  k.offen = null; k.nvText = '';
  rdScanEintragen(k, 'nicht_verfuegbar', {}, text);
}

function rdScanEintragen(k, status, ort, beschreibung, foto) {
  const erfasst_am = jetztDatetime();
  k.fehler = null;
  k.erledigt = { status, erfasst_am, beschreibung: beschreibung || null };
  k.wartend = true;
  rdWarteschlangeHinzufuegen({
    rundgang_id: rundgangAktiv.id, kontrollpunkt_id: k.id, status, erfasst_am,
    lat: (ort && ort.lat != null) ? ort.lat : null, lng: (ort && ort.lng != null) ? ort.lng : null,
    beschreibung: beschreibung || null,
    foto: foto || null,
  });
  rundgangListeZeichnen();
  rdWarteschlangeSenden();
  // Haengen an diesem Punkt Aufgaben, poppen sie jetzt auf (ENT-305). Der
  // Scan ist zu diesem Zeitpunkt bereits festgehalten -- er darf nicht davon
  // abhaengen, dass jemand die Schublade zu Ende bedient.
  if (rdAufgabenOffen(k).length) { rdAufgabenOeffnen(k.id); }
}

/* ══ Aufgabe bestaetigen waehrend der Runde (ENT-305) ══════════════════
   Vom Projektinhaber: "wenn der MA aktiv auf seiner Runde unterwegs ist und
   ein Kontrollpunkt erfasst mit einer gekoppelten Aufgabe, ploppt diese auf
   und er muss diese Aufgabe bestaetigen."

   Zwei Wege, nicht einer: "Erledigt" oder "Nicht moeglich" mit Pflichtgrund
   -- so entschieden. Gaebe es nur "Erledigt", tippte auch der darauf, der die
   Aufgabe nicht ausfuehren konnte, und die Auswertung behauptete etwas, das
   nicht stimmt. Dasselbe Muster hat der Kontrollpunkt selbst schon
   (bestaetigt / nicht verfuegbar / Ersatzscan).

   Der Scan wird NICHT zurueckgehalten, bis die Aufgaben beantwortet sind: Der
   Punkt ist erfasst, das ist eine Tatsache. Wer die Schublade wegschiebt,
   sieht an der Zeile weiter, dass etwas offen ist, und kann sie erneut
   oeffnen -- ein verworfener Scan waere der groessere Schaden. */
function rdAufgabenWarteschlangeLesen() {
  try { return JSON.parse(localStorage.getItem(RD_AUFGABEN_WARTESCHLANGE) || '[]'); } catch { return []; }
}
function rdAufgabenWarteschlangeSchreiben(liste) {
  try { localStorage.setItem(RD_AUFGABEN_WARTESCHLANGE, JSON.stringify(liste)); } catch {}
}

// Noch unbeantwortete Aufgaben eines Punktes -- beantwortet ist, was der
// Server kennt ODER was in der Warteschlange auf die Uebermittlung wartet.
function rdAufgabenOffen(k) {
  if (!k || !rundgangAktiv) return [];
  const wartend = new Set(rdAufgabenWarteschlangeLesen()
    .filter(a => Number(a.rundgang_id) === Number(rundgangAktiv.id)
      && Number(a.kontrollpunkt_id) === Number(k.id))
    .map(a => Number(a.aufgabe_id)));
  return (k.aufgaben || []).filter(a => !a.erledigt && !wartend.has(Number(a.id)));
}

let abPunktId = null;

function rdAufgabenOeffnen(kontrollpunktId) {
  const k = rundgangAktiv && rundgangAktiv.kontrollpunkte.find(x => Number(x.id) === Number(kontrollpunktId));
  if (!k) return;
  const offen = rdAufgabenOffen(k);
  if (!offen.length) return;
  abPunktId = Number(kontrollpunktId);
  $('blTitel').textContent = w('abTitel');
  $('blBody').innerHTML = `
    <div style="font-size:13px;color:var(--ink-3);font-weight:620;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px">${esc(k.bezeichnung)}</div>
    <div style="font-size:14px;color:var(--ink-2);margin-bottom:16px">${esc(w('abHinweis'))}</div>
    <div id="abErr" class="msg-err" style="display:none"></div>
    ${offen.map(a => `<div class="ab-karte" id="abK${Number(a.id)}" data-aufgabe="${Number(a.id)}">
      <div class="ab-bez">${esc(a.bezeichnung)}</div>
      ${a.information ? `<div class="ab-info">${esc(a.information)}</div>` : ''}
      <div class="ab-wahl">
        <button type="button" class="btn btn-plain ab-btn" data-wert="erledigt"
                onclick="rdAufgabeWahl(${Number(a.id)}, 'erledigt')">${esc(w('abErledigt'))}</button>
        <button type="button" class="btn btn-plain ab-btn" data-wert="nicht_moeglich"
                onclick="rdAufgabeWahl(${Number(a.id)}, 'nicht_moeglich')">${esc(w('abNichtMoeglich'))}</button>
      </div>
      <div class="f ab-grund" id="abG${Number(a.id)}" style="display:none;margin-top:12px">
        <label for="abT${Number(a.id)}">${esc(w('abGrund'))}</label>
        <textarea class="inp" id="abT${Number(a.id)}" rows="2"></textarea>
        <div class="rgs-leer" style="padding:6px 2px 0">${esc(w('abGrundHinweis'))}</div>
      </div>
    </div>`).join('')}`;
  $('blFuss').innerHTML =
    `<button class="btn btn-primary btn-wide" id="abBtn" onclick="rdAufgabenSenden()">${esc(w('abSenden'))}</button>`;
  blattZeigen();
}

// Die Wahl wird nur gemerkt und angezeigt -- gesendet wird erst mit
// "Bestaetigen". So laesst sich eine versehentliche Wahl korrigieren, bevor
// sie ein Nachweis wird.
function rdAufgabeWahl(aufgabeId, wert) {
  const karte = $('abK' + Number(aufgabeId));
  if (!karte) return;
  karte.dataset.wahl = wert;
  karte.querySelectorAll('.ab-btn').forEach(b => {
    b.classList.toggle('ab-an', b.dataset.wert === wert);
    b.classList.toggle('ab-an-neg', b.dataset.wert === wert && wert === 'nicht_moeglich');
  });
  const grund = $('abG' + Number(aufgabeId));
  if (grund) { grund.style.display = wert === 'nicht_moeglich' ? '' : 'none'; }
}

function rdAufgabenSenden() {
  const k = rundgangAktiv && rundgangAktiv.kontrollpunkte.find(x => Number(x.id) === Number(abPunktId));
  if (!k) return;
  const err = $('abErr'); if (err) err.style.display = 'none';
  const karten = [...document.querySelectorAll('#blBody .ab-karte')];
  const eintraege = [];
  for (const karte of karten) {
    const id = Number(karte.dataset.aufgabe);
    const wahl = karte.dataset.wahl;
    if (!wahl) {
      if (err) { err.textContent = w('abHinweis'); err.style.display = ''; }
      karte.scrollIntoView({ block: 'center' });
      return;
    }
    const feld = $('abT' + id);
    const grund = feld ? feld.value.trim() : '';
    if (wahl === 'nicht_moeglich' && !grund) {
      if (err) { err.textContent = w('abGrundPflicht'); err.style.display = ''; }
      if (feld) feld.focus();
      return;
    }
    eintraege.push({ rundgang_id: rundgangAktiv.id, kontrollpunkt_id: k.id,
      aufgabe_id: id, status: wahl, grund: grund || null, erfasst_am: jetztDatetime() });
  }
  const liste = rdAufgabenWarteschlangeLesen();
  eintraege.forEach(e => liste.push(e));
  rdAufgabenWarteschlangeSchreiben(liste);
  // Sofort im lokalen Stand vermerken, damit die Zeile nicht weiter "offen"
  // meldet, waehrend die Uebermittlung noch laeuft.
  eintraege.forEach(e => {
    const a = (k.aufgaben || []).find(x => Number(x.id) === Number(e.aufgabe_id));
    if (a) { a.erledigt = { status: e.status, grund: e.grund, erfasst_am: e.erfasst_am }; }
  });
  abPunktId = null;
  rundgangAnzeigen(rundgangAktiv.einsatz_id);
  rdWarteschlangeSenden();
}

// ── Ersatzscan (Q-22 in sop-projekt): Fotobeleg statt technischer Pruefung,
// wenn NFC/Geofence nicht moeglich ist (Chip zerstoert, Punkt nicht
// auffindbar). Weder NFC- noch Geofence-Verifikation, dafuer Foto UND
// Begruendung zwingend -- sonst waere ein Ersatzscan ein unbelegter Klick.
// Startet bewusst NICHT die Rohzeit (Projektinhaber-Entscheid 2026-08-28,
// gleiche Begruendung wie bei "nicht verfuegbar" in ENT-145): ein Foto ist
// kein technischer Vor-Ort-Nachweis wie NFC/Geofence.
const rdEsFotos = {};   // Kontrollpunkt-Id -> komprimiertes Foto (data: URL), bis "Melden" gedrueckt wird

/* Welches Formular an einem Punkt offen ist, steht am KONTROLLPUNKT und
   nicht nur im DOM (ENT-324).

   Der gemeldete Fehler: „Ersatzscan Foto kann man nicht tippen, verschwindet
   die Funktion direkt wieder." Ursache: Seit die Ortung laeuft (ENT-317),
   zeichnet JEDE neue Position die Liste neu, damit die Entfernungen
   mitwandern. Das Formular lebte aber ausschliesslich in `style.display` --
   und war beim naechsten Standortwechsel, also nach Sekundenbruchteilen,
   wieder zu. Mit ihm verschwanden der eingetippte Grund und die Fotovorschau.

   Genau dieselbe Falle hatte ENT-317 schon einmal bei den Fehlermeldungen
   (rdZeigeFehler schreibt seither `k.fehler`); der Kommentar am Neuzeichnen
   behauptete sogar ausdruecklich, offene Formulare seien geschuetzt -- sie
   waren es nie. Ein Kommentar ist keine Pruefung.

   Die Alternative waere gewesen, das Neuzeichnen zu unterdruecken, solange
   ein Formular offen ist. Das ist schlechter: Dann friert die Entfernung
   ein, und „im Bereich" erschiene nicht mehr, waehrend jemand am Formular
   steht. Der Zustand gehoert an die Daten, nicht die Anzeige angehalten. */
function rdFormularUm(kontrollpunktId, welches) {
  const k = rundgangAktiv && rundgangAktiv.kontrollpunkte
    ? rundgangAktiv.kontrollpunkte.find(x => Number(x.id) === Number(kontrollpunktId)) : null;
  if (!k) { return; }
  // Vor dem Umschalten sichern, was schon getippt wurde -- sonst ist es beim
  // Wiederaufklappen weg.
  rdFormularStandSichern(k);
  k.offen = k.offen === welches ? null : welches;
  rundgangListeZeichnen();
}

// Liest die beiden Textfelder eines Punktes ins Datenmodell zurueck. Wird
// vor jedem Neuzeichnen aufgerufen: Ohne das ginge jeder Tastendruck
// verloren, der zwischen zwei Standortmeldungen faellt.
function rdFormularStandSichern(k) {
  const es = $('rdEsText' + k.id);
  if (es) { k.esText = es.value; }
  const nv = $('rdNvText' + k.id);
  if (nv) { k.nvText = nv.value; }
}

function rdEsUm(kontrollpunktId) { rdFormularUm(kontrollpunktId, 'es'); }

// Verkleinert das Kamerafoto vor dem Versand: ein unkomprimiertes Handyfoto
// (haeufig mehrere MB) wuerde sowohl das Server-Limit als auch den Platz der
// Offline-Warteschlange (localStorage) sprengen. Ein Fotobeleg fuer "war ich
// vor Ort" braucht keine Druckaufloesung -- 1280px Kantenlaenge und JPEG-
// Qualitaet 0.7 ergeben typischerweise 100-400 KB.
function rdEsKomprimieren(datei) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('lesen fehlgeschlagen'));
    reader.onload = () => {
      const bild = new Image();
      bild.onerror = () => reject(new Error('dekodieren fehlgeschlagen'));
      bild.onload = () => {
        const MAX_KANTE = 1280;
        const skala = Math.min(1, MAX_KANTE / Math.max(bild.width, bild.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(bild.width * skala);
        canvas.height = Math.round(bild.height * skala);
        canvas.getContext('2d').drawImage(bild, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      bild.src = reader.result;
    };
    reader.readAsDataURL(datei);
  });
}

function rdEsFotoGewaehlt(kontrollpunktId) {
  const input = $('rdEsInput' + kontrollpunktId);
  const datei = input && input.files && input.files[0];
  if (!datei) return;
  rdEsKomprimieren(datei).then(dataUrl => {
    rdEsFotos[kontrollpunktId] = dataUrl;
    const vorschau = $('rdEsVorschau' + kontrollpunktId);
    if (vorschau) { vorschau.src = dataUrl; vorschau.style.display = ''; }
  }).catch(() => rdZeigeFehler(kontrollpunktId, w('kpEsFotoFehler')));
}

function rdEsSenden(kontrollpunktId) {
  const k = rundgangAktiv.kontrollpunkte.find(x => Number(x.id) === kontrollpunktId);
  if (!k) return;
  const dataUrl = rdEsFotos[kontrollpunktId];
  if (!dataUrl) { rdZeigeFehler(kontrollpunktId, w('kpEsFotoPflicht')); return; }
  const feld = $('rdEsText' + kontrollpunktId);
  const text = feld ? feld.value.trim() : '';
  if (!text) { rdZeigeFehler(kontrollpunktId, w('kpBeschreibungPflicht')); return; }
  const foto = dataUrl.slice(dataUrl.indexOf(',') + 1);   // "data:image/jpeg;base64," abtrennen
  delete rdEsFotos[kontrollpunktId];
  // Der Zustand des Formulars gehoert mit weggeraeumt (ENT-324) -- sonst
  // klappte es beim naechsten Zeichnen wieder auf, mit altem Text darin.
  k.offen = null; k.esText = '';
  rdScanEintragen(k, 'ersatzscan', {}, text, foto);
}

// ── Pausieren/Abbrechen (ENT-146) ────────────────────────────────────
// Dieselben vier bei Coredinate beobachteten Kategorien wie
// RUNDGANG_ABBRUCH_GRUENDE in backend/rundgang.php -- eine Aenderung dort
// muss auch hier nachgezogen werden, es gibt keine gemeinsame Quelle fuer
// vier feste Texte zwischen PHP und JS.
const RUNDGANG_ABBRUCH_GRUENDE = {
  stelle_nicht_gefunden: 'Stelle nicht gefunden',
  nicht_genug_zeit: 'Nicht genug Zeit',
  notfall_gebunden: 'Durch Notfall anderweitig gebunden',
  sonstige: 'Sonstige Gründe',
};

// UX-Sicherheitsmuster aus ENT-146: "Beenden" fuehrt NIE direkt zu einer
// Aenderung, sondern erst zu diesem Dialog mit drei Optionen. "Schliessen"
// ist der sichere Default und tut nichts weiter, als zur Checkliste
// zurueckzukehren.
/* $woher (ENT-324): 'pfeil', wenn die Frage aus dem Zurueck-Pfeil kommt.
   Dann ist der WUNSCH, die Seite zu verlassen -- Pausieren und Abbrechen
   fuehren anschliessend hinaus. Ueber den Knopf „Beenden" ist es
   umgekehrt: Dort will jemand den Zustand aendern und danach sehen, dass
   es geschehen ist; die Seite bleibt stehen. Zwei verschiedene Absichten,
   und derselbe Dialog darf sie nicht gleich behandeln. */
function rundgangBeendenAnzeigen(einsatzId, woher) {
  const inLauf = rgsModus === 'lauf';
  const raus = woher === 'pfeil' ? ', true' : '';
  $('blTitel').textContent = w('rundgangBeendenTitel');
  // Unter jedem Knopf steht, was er bewirkt. Bei „Abbrechen" ist das keine
  // Hoeflichkeit: Es ist der einzige Knopf hier, der sich nicht rueckgaengig
  // machen laesst, und wer ihn statt „Pausieren" drueckt, kann die Runde
  // nicht mehr aufnehmen.
  $('blBody').innerHTML = `
    <p style="font-size:15px;margin-bottom:20px">${esc(w('rundgangBeendenFrage'))}</p>
    <button class="btn btn-plain btn-wide" style="margin-bottom:10px" onclick="rundgangPausieren(${Number(einsatzId)}${raus})">
      ${esc(w('rundgangPausierenKnopf'))}<span class="btn-unter">${esc(w('rundgangPausierenUnter'))}</span></button>
    <button class="btn btn-neg btn-wide" onclick="rundgangAbbrechenAnzeigen(${Number(einsatzId)}, 'beenden'${raus})">
      ${esc(w('rundgangAbbrechenKnopf'))}<span class="btn-unter">${esc(w('rundgangAbbrechenUnter'))}</span></button>`;
  // In der Vollseite fuehrt „Weiter" nur aus dem Dialog heraus: Ein Aufruf
  // von rundgangAnzeigen() oeffnete dort die alte Schublade ueber der
  // laufenden Seite -- zwei Darstellungen derselben Runde uebereinander.
  $('blFuss').innerHTML = `<button class="btn btn-primary btn-wide" onclick="${inLauf
    ? 'blattZu()' : `rundgangAnzeigen(${Number(einsatzId)})`}">
      ${esc(w('rundgangWeiterKnopf'))}<span class="btn-unter">${esc(w('rundgangWeiterUnter'))}</span></button>`;
  // Selbst oeffnen: Aus dem Zurueck-Pfeil der Vollseite heraus ist die
  // Schublade zu, und ein Dialog ausserhalb des Bildschirms waere schlimmer
  // als gar keiner -- dieselbe Falle wie bei rundgangAbbrechenAnzeigen.
  blattZeigen();
}

// $raus (ENT-324): Kam die Frage aus dem Zurueck-Pfeil, fuehrt Pausieren
// anschliessend wirklich hinaus -- sonst haette der Pfeil zwar gefragt, aber
// nichts bewirkt. Die Runde bleibt dabei erreichbar: Der Chip auf „Heute"
// ist ausdruecklich fuer den aktiven UND den pausierten Rundgang gebaut
// (ENT-234), er ist der Weg zurueck.
function rundgangPausieren(einsatzId, raus) {
  api('mein_rundgang_pausieren.php', { method: 'POST', body: { rundgang_id: rundgangAktiv.id } }).then(({ ok, data }) => {
    if (!ok || data.status !== 'ok') { toast(data.message || w('netzfehler')); return; }
    rundgangAktiv.status = 'pausiert';
    rundgangAktiv.pausiert_seit = jetztDatetime();
    if (raus) { blattZu(); rgSeiteZu(); zeichneHeute(); return; }
    rundgangAnzeigen(einsatzId);
  });
}

function rundgangWiederAufnehmen(einsatzId) {
  const btn = document.querySelector('#blFuss .btn-primary');
  if (btn) btn.disabled = true;
  api('mein_rundgang_fortsetzen.php', { method: 'POST', body: { rundgang_id: rundgangAktiv.id } }).then(({ ok, data }) => {
    if (btn) btn.disabled = false;
    if (!ok || data.status !== 'ok') { toast(data.message || w('netzfehler')); return; }
    rundgangAktiv.status = data.rundgang_status;
    // Die gerade beendete Pause zur Summe addieren -- der Server tut dasselbe
    // (mein_rundgang_fortsetzen.php). Ohne das liefe der Timer nach dem
    // Fortsetzen um die Pausendauer vor, bis die Seite neu geladen wird.
    if (rundgangAktiv.pausiert_seit) {
      const pms = Date.parse(String(rundgangAktiv.pausiert_seit).replace(' ', 'T'));
      if (pms) {
        rundgangAktiv.pause_minuten = Number(rundgangAktiv.pause_minuten || 0)
          + Math.max(0, Math.floor((Date.now() - pms) / 60000));
      }
    }
    rundgangAktiv.pausiert_seit = null;
    rundgangAnzeigen(einsatzId);
  });
}

// $woher (ENT-324): Wohin „Zurueck" fuehrt. Ohne diese Angabe landete der
// Weg aus der Vollseite immer bei blattZu() -- auch wenn man ueber den
// Beenden-Dialog hergekommen war, der dann uebersprungen wurde. Ein
// Rueckweg, der eine Ebene ueberspringt, ist derselbe Sackgassen-Fehler wie
// ein fehlender.
function rundgangAbbrechenAnzeigen(einsatzId, woher, raus) {
  $('blTitel').textContent = w('rundgangAbbrechenTitel');
  $('blBody').innerHTML = `
    <div class="msg-err" style="color:var(--warn);background:var(--warn-soft)">${esc(w('rundgangAbbrechenHinweis'))}</div>
    <div class="f"><label for="raGrund">${esc(w('rundgangAbbrechenGrund'))}</label>
      <select class="inp" id="raGrund">
        <option value="">–</option>
        ${Object.entries(RUNDGANG_ABBRUCH_GRUENDE).map(([code, txt]) =>
          `<option value="${esc(code)}">${esc(txt)}</option>`).join('')}
      </select>
    </div>
    <div class="f"><label for="raFreitext">${esc(w('rundgangAbbrechenFreitext'))}</label>
      <textarea class="inp" id="raFreitext" rows="3"></textarea>
    </div>
    <div id="raErr" class="msg-err" style="display:none"></div>`;
  // Der Rueckweg haengt davon ab, woher man kommt (ENT-306): aus den
  // Funktionen der Vollseite fuehrt er zurueck auf die Seite, aus dem alten
  // Beenden-Dialog dorthin.
  $('blFuss').innerHTML = `
    <button class="btn btn-plain" onclick="${woher === 'beenden' || rgsModus !== 'lauf'
      ? `rundgangBeendenAnzeigen(${Number(einsatzId)})` : 'blattZu()'}">${esc(w('zurueck'))}</button>
    <button class="btn btn-neg" id="raBtn" onclick="rundgangAbbrechenSenden(${Number(einsatzId)}${raus ? ', true' : ''})">${esc(w('rundgangAbbrechenBestaetigen'))}</button>`;
  // Selbst oeffnen: Bis ENT-306 kam dieser Dialog immer aus einer bereits
  // offenen Schublade (rundgangBeendenAnzeigen). Aus den Funktionen der
  // Vollseite heraus ist sie zu -- ohne diesen Aufruf laege der Dialog
  // ausserhalb des Bildschirms und waere unbedienbar.
  blattZeigen();
}

function rundgangAbbrechenSenden(einsatzId, raus) {
  const err = $('raErr'); err.style.display = 'none';
  const grund = $('raGrund').value;
  if (!grund) { err.textContent = w('rundgangAbbrechenGrundPflicht'); err.style.display = ''; return; }
  const freitext = $('raFreitext').value.trim();
  const btn = $('raBtn'); btn.disabled = true;
  api('mein_rundgang_abbrechen.php', { method: 'POST', body: { rundgang_id: rundgangAktiv.id, grund, freitext } })
    .then(({ ok, data }) => {
      btn.disabled = false;
      if (!ok || data.status !== 'ok') { err.textContent = data.message || w('netzfehler'); err.style.display = ''; return; }
      rundgangAktiv.status = 'abgebrochen';
      rundgangAktiv.abbruch_grund = grund;
      rundgangAktiv.abbruch_freitext = freitext || null;
      // Ist die Runde abgebrochen und die Frage kam aus dem Pfeil, ist der
      // Weg hinaus die Antwort -- ein Zurueckspringen auf die Seite einer
      // beendeten Runde waere eine Sackgasse.
      if (raus) { blattZu(); rgSeiteZu(); zeichneHeute(); return; }
      rundgangAnzeigen(einsatzId);
    });
}

// ══════════════════════════════════════════ SCHICHT RAPPORTIEREN (ENT-082)
// Vorbefuellt aus der Schicht -- Kunde und Adresse stehen dort bereits.
// Der bestehende manuelle Rapport (index.html) bleibt daneben bestehen; das
// hier ist derselbe rapporte-Datensatz, nur mit gesetzter einsatz_id.
function schichtRapportBlatt(id) {
  const e = schichten.find(x => Number(x.id) === Number(id));
  if (!e) return;
  blattId = Number(id);
  const bisher = rapportFuerSchicht(id);
  const q = bisher || { kunde: e.kunde_name, strasse: e.strasse || '', ort: e.ort,
    einsatzart: e.einsatzart, von: e.von, bis: e.bis, pause_min: 0, bemerkung: '', unterzeichner: '' };

  $('blTitel').textContent = w('schichtRapportTitel');
  $('blBody').innerHTML = `
    ${bisher ? `<div class="msg-err" style="color:var(--ink-2);background:var(--line-soft)">
        ${esc(w('schonRapportiert'))} ${dmy(bisher.erfasst_am)}, ${String(bisher.erfasst_am).slice(11, 16)}.
        ${esc(w('erneutSendenKorrigiert'))}
      </div>` : ''}
    <div class="f"><label for="srKunde">${esc(w('kunde'))}</label><input class="inp" id="srKunde" value="${esc(q.kunde)}"></div>
    <div class="f"><label for="srStrasse">${esc(w('strasse'))}</label><input class="inp" id="srStrasse" value="${esc(q.strasse || '')}"></div>
    <div class="f"><label for="srOrt">${esc(w('ort'))}</label><input class="inp" id="srOrt" value="${esc(q.ort)}"></div>
    <div class="f"><label for="srEinsatzart">${esc(w('einsatzart'))}</label><input class="inp" id="srEinsatzart" value="${esc(q.einsatzart)}"></div>
    <div class="f"><label for="srVon">${esc(w('arbeitsbeginn'))}</label><input class="inp" id="srVon" type="time" data-zeit="fein" value="${esc(hm(q.von))}"></div>
    <div class="f"><label for="srBis">${esc(w('arbeitsende'))}</label><input class="inp" id="srBis" type="time" data-zeit="fein" value="${esc(hm(q.bis))}"></div>
    <div class="f"><label for="srPause">${esc(w('pauseMinuten'))}</label><input class="inp" id="srPause" type="number" min="0" max="600" step="5" value="${esc(String(bisher ? bisher.pause_min : 0))}"></div>
    <div class="f"><label for="srBemerkung">${esc(w('bemerkung'))}</label><textarea class="inp" id="srBemerkung" rows="2">${esc(q.bemerkung || '')}</textarea></div>
    ${e.schon_unterschrieben ? `
    <div class="hinweis" id="srSigDa">
      ✓ ${esc(w('schonUnterschrieben'))}${e.unterschrift_holte
        ? ' — ' + esc(w('eingeholtVon')) + ' ' + esc(e.unterschrift_holte) : ''}.
      ${esc(w('deineZeitenTrotzdem'))}
    </div>` : `
    <div class="f"><label for="srSigName">${esc(w('unterzeichnerName'))}</label><input class="inp" id="srSigName" placeholder="${esc(w('vorUndNachname'))}" value="${esc(q.unterzeichner || '')}"></div>
    <div class="f"><label>${esc(w('unterschriftKunde'))}</label>
      <div id="sigFeld"></div>
    </div>`}
    <div id="srErr" class="msg-err" style="display:none"></div>`;
  $('blFuss').innerHTML = `
    <button class="btn btn-plain" onclick="blattZu()">${esc(w('abbrechen'))}</button>
    <button class="btn btn-primary" id="srBtn" onclick="schichtRapportSenden(${Number(id)})">${esc(w('senden'))}</button>`;
  blattZeigen();
  // Ohne Feld hat fuer diesen Einsatz schon jemand unterschreiben lassen
  // (ENT-160) -- dann gibt es hier nichts einzurichten.
  if ($('sigFeld')) {
    Unterschrift.einrichten({
      ziel: 'sigFeld',
      kontext: () => ({
        zeilen: [$('srKunde').value.trim(),
                 `${dmy(e.datum)} · ${$('srVon').value}–${$('srBis').value}`],
        name: $('srSigName') ? $('srSigName').value.trim() : '',
      }),
    });
  } else {
    Unterschrift.zuruecksetzen();
  }
}

function schichtRapportSenden(einsatzId) {
  const e = schichten.find(x => Number(x.id) === Number(einsatzId));
  if (!e) return;
  const err = $('srErr'); err.style.display = 'none';
  const von = $('srVon').value, bis = $('srBis').value;
  if (!von || !bis) { err.textContent = w('beideZeitenNoetig'); err.style.display = ''; return; }
  const b = $('srBtn'); b.disabled = true;
  api('rapport_create.php', { method: 'POST', body: {
    einsatz_id: einsatzId,
    datum: String(e.datum).slice(0, 10),
    kunde: $('srKunde').value.trim(), strasse: $('srStrasse').value.trim(), ort: $('srOrt').value.trim(),
    einsatzart: $('srEinsatzart').value.trim(),
    von, bis, pause: $('srPause').value,
    bemerkung: $('srBemerkung').value.trim(),
    sigName: $('srSigName') ? $('srSigName').value.trim() : null,
    sig: Unterschrift.daten(),
  } }).then(({ ok, data }) => {
    b.disabled = false;
    if (!ok || data.status !== 'ok') { err.textContent = data.message || w('netzfehler'); err.style.display = ''; return; }
    blattZu();
    ladeRapporte().then(zeichne);
    toast(w('rapportGesendet'));
  });
}

// ══════════════════════════════════════════ ZEITBONUS ERKLAERT (ENT-052)
// Der Zeitbonus steht als Zahl auf der Kachel, aber die wenigsten kennen den
// GAV. Eine Zahl, die niemand einordnen kann, erzeugt Rueckfragen oder --
// schlimmer -- stilles Misstrauen.
//
// Der Text sagt AUSSCHLIESSLICH, was im Wortlaut von Art. 12 Ziff. 2 steht,
// geprueft gegen gav-2026.pdf, plus die vom PAKO-Kommentar bestaetigte Regel
// "nur einmal, nicht doppelt" (GAV-AUS-001). Keine eigene Auslegung -- das
// verbietet CLAUDE.md ausdruecklich, und hier liest es die betroffene Person.
//
// Was NICHT drinsteht und bewusst nicht: die anteilige Berechnung bei
// angebrochenen Stunden. Die ist bis heute eine vorlaeufige Annahme
// (GAV-AUS-008, Status offen) und darf niemandem als Regel verkauft werden.
function bonusInfoBlatt() {
  blattId = null;
  $('blTitel').textContent = w('bonusInfoTitel');
  const punkt = (k, t) => `<div style="margin-bottom:14px">
      <div style="font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px">${esc(k)}</div>
      <div style="font-size:15px;line-height:1.45">${esc(t)}</div>
    </div>`;
  $('blBody').innerHTML =
    punkt(w('bonusInfoWofuer'), w('bonusInfoWofuerT')) +
    punkt(w('bonusInfoWieviel'), w('bonusInfoWievielT')) +
    punkt(w('bonusInfoWas'), w('bonusInfoWasT')) +
    punkt(w('bonusInfoEinmal'), w('bonusInfoEinmalT')) +
    `<div style="font-size:13.5px;color:var(--warn);font-weight:600;margin-bottom:12px">${esc(w('bonusInfoLuecke'))}</div>
     <div style="font-size:12.5px;color:var(--ink-3)">${esc(w('bonusInfoQuelle'))}</div>`;
  $('blFuss').innerHTML =
    `<button class="btn btn-primary" onclick="blattZu()">${esc(w('schliessen'))}</button>`;
  blattZeigen();
}

// Auge am Passwortfeld (ENT-291). Wortgleich mit dem Cockpit und mit
// index.html -- dieselbe Geste, dieselben Zeichen, egal wo man gerade ist.
// Maskiert bleibt der Ausgangszustand: Er steht im Markup und wird nie
// gemerkt, damit ein einmal aufgedecktes Feld nicht offen stehen bleibt.
function togglePw(id, btn) {
  const inp = $(id);
  if (!inp) { return; }
  const zeigen = inp.type === 'password';
  inp.type = zeigen ? 'text' : 'password';
  btn.textContent = zeigen ? '🙈' : '👁';
  btn.setAttribute('aria-label', zeigen ? w('pwVerbergen') : w('pwZeigen'));
  const ende = inp.value.length;
  inp.focus();
  try { inp.setSelectionRange(ende, ende); } catch (e) { /* nicht jedes Feld kann das */ }
}

function passwortBlatt() {
  blattId = null;
  $('blTitel').textContent = w('passwortAendern');
  $('blBody').innerHTML = `
    <div class="msg-err" id="pwErr" style="display:none"></div>
    <div class="f"><label for="pwAlt">${esc(w('altesPasswort'))}</label>
      <div class="pw-feld"><input class="inp" id="pwAlt" type="password" autocomplete="current-password">
        <button type="button" class="pw-toggle" aria-label="${esc(w('pwZeigen'))}"
                onclick="togglePw('pwAlt', this)">👁</button></div></div>
    <div class="f"><label for="pwNeu">${esc(w('neuesPasswort'))}</label>
      <div class="pw-feld"><input class="inp" id="pwNeu" type="password" placeholder="${esc(w('mindPw'))}" autocomplete="new-password">
        <button type="button" class="pw-toggle" aria-label="${esc(w('pwZeigen'))}"
                onclick="togglePw('pwNeu', this)">👁</button></div></div>`;
  $('blFuss').innerHTML = `
    <button class="btn btn-plain" onclick="blattZu()">${esc(w('abbrechen'))}</button>
    <button class="btn btn-primary" id="pwBtn" onclick="passwortSpeichern()">${esc(w('speichern'))}</button>`;
  blattZeigen();
}
function passwortSpeichern() {
  const err = $('pwErr'); err.style.display = 'none';
  const alt = $('pwAlt').value, neu = $('pwNeu').value;
  if (neu.length < PW_MIN) { err.textContent = w('mindPw'); err.style.display = ''; return; }
  const b = $('pwBtn'); b.disabled = true;
  api('mein_passwort.php', { method: 'POST', body: { alt, neu } }).then(({ ok, data }) => {
    b.disabled = false;
    if (!ok || data.status !== 'ok') { err.textContent = data.message || w('netzfehler'); err.style.display = ''; return; }
    blattZu();
    toast(w('passwortOk'));
  });
}

function blattZeigen() {
  $('abdunkeln').classList.add('on');
  $('blatt').classList.add('on');
  $('blatt').setAttribute('aria-hidden', 'false');
}
function blattZu() {
  $('abdunkeln').classList.remove('on');
  $('blatt').classList.remove('on');
  $('blatt').setAttribute('aria-hidden', 'true');
  blattId = null;
}

// ══════════════════════════════════════════ START
// Escape schliesst immer nur die OBERSTE Ebene: liegt die Schublade ueber
// dem Einsatzmodus (ENT-294), geht sie zuerst zu -- sonst bliebe ein Dialog
// ueber einer bereits geschlossenen Seite stehen.
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('blatt').classList.contains('on')) { blattZu(); return; }
  // Die Rueckfrage (ENT-298) liegt innerhalb der Seite und ist damit die
  // oberste Ebene, solange sie offen ist. Escape heisst hier "Nein".
  if (!$('rgsDlg').hidden) { rgsFrageZu(); return; }
  if ($('rgSeite').classList.contains('on')) { rgSeiteZurueck(); return; }
  blattZu();
});
$('gPass').addEventListener('keydown', e => { if (e.key === 'Enter') anmelden(); });
$('gName').addEventListener('keydown', e => { if (e.key === 'Enter') $('gPass').focus(); });

beschriften();
sockelSetzen();
// Beim Drehen aendert sich alles, was sockelMessen() liest. Die kurze
// Verzoegerung ist noetig, weil innerHeight zum Zeitpunkt des Ereignisses
// auf manchen Geraeten noch den alten Wert traegt.
window.addEventListener('orientationchange', () => setTimeout(sockelSetzen, 350));
// Ein Reset-Link geht immer vor der normalen Anmeldung -- auch wenn noch
// eine gueltige Sitzung im Speicher liegt (siehe pwResetSpeichern: ein
// erfolgreicher Reset raeumt ohnehin ALLE Sitzungen ab). Die Kennung wird
// SOFORT aus der Adresszeile entfernt, gleiches Muster wie bei der
// Fahrzeug-Kennung (?fz=) in starten(): Sie ist ein Geheimnis und hat weder
// im Verlauf noch in einem geteilten Link etwas zu suchen.
const gStart = new URLSearchParams(location.search);
const gResetToken = gStart.get('reset');
if (gResetToken) {
  history.replaceState(null, '', location.pathname);
  pwResetToken = gResetToken;
  gateZeige('reset');
} else if (token && ich) {
  starten();
}
</script>
